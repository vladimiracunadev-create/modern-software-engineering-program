<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 586" width="940" height="586" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis casos coherentes que el verificador no rechaza y qué haría falta para verlos</title><desc id="d">Diagrama de seis casos coherentes que el verificador no rechaza y el control que haría falta para verlos: código malicioso aprobado, dependencia comprometida en el bloqueo, commit distinto del revisado, clave de firma robada, segundo release con la misma secuencia y procedencia con reproducible igual a true sin reconstruir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="586" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis casos coherentes que el verificador no rechaza y qué haría falta para verlos</tspan></text><rect x="14" y="213.64" width="250" height="86.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="235.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Release coherente que el</tspan></text><text x="139" y="252.24" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">verificador no rechaza</tspan></text><text x="139" y="268.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">todo pasa; cada caso necesita</tspan></text><text x="139" y="285.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">otro control</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Código malicioso aprobado y construido por el CI legítimo</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">pasa, todo es coherente · control: revisión de código y reconstrucción desde</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">la fuente revisada</tspan></text><polyline points="264,256.92 299,256.92 299,83.96 334,83.96" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="130.92" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="153.24" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Dependencia comprometida declarada en el bloqueo</tspan></text><text x="630" y="169.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">pasa · control: revisión de cambios del bloqueo y escaneo de vulnerabilidades</tspan></text><polyline points="264,256.92 299,256.92 299,157.92 334,157.92" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="196.92" width="592" height="69.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="218.88" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Commit distinto del revisado</tspan></text><text x="630" y="235.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">pasa, el verificador no conoce la revisión · control: registro de revisión</tspan></text><text x="630" y="252.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">firmado y comprobado</tspan></text><polyline points="264,256.92 299,256.92 299,231.88 334,231.88" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="278.84" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="301.16" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Clave de firma robada</tspan></text><text x="630" y="317.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">pasa · control: revocación, claves de corta vida, firma sin clave larga</tspan></text><polyline points="264,256.92 299,256.92 299,305.84 334,305.84" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="344.84" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="367.16" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Segundo release con la misma versión y secuencia</tspan></text><text x="630" y="383.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">pasa · control: registro transparente que impida reemplazos</tspan></text><polyline points="264,256.92 299,256.92 299,371.84 334,371.84" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="334" y="410.84" width="592" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="433.16" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Procedencia con reproducible=true sin reconstruir</tspan></text><text x="630" y="449.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">pasa, es una afirmación · control: reconstrucción independiente</tspan></text><polyline points="264,256.92 299,256.92 299,437.84 334,437.84" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="478.84" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="503.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Rechaza 0 de 6, y el sexto es el propio release legítimo con una afirmación que nadie comprueba. La integridad y la</tspan></text><text x="470" y="520.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">procedencia se verifican con una cadena de huellas; la confianza en el contenido no sale de ninguna cadena de huellas.</tspan></text><text x="470" y="568.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); lo que difiere entre sistemas se indica en la figura.</tspan></text></svg>
