x="332" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">6,9</tspan></text><rect x="420" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">1,4</tspan></text><rect x="610" y="106" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">60 %</tspan></text><rect x="780" y="106" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 %</tspan></text><rect x="10" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="127" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="127" dy="0">Cada 1 h</tspan></text><rect x="250" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="332" dy="0">0,8</tspan></text><rect x="420" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">0,0</tspan></text><rect x="610" y="156" width="164" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">0 %</tspan></text><rect x="780" y="156" width="144" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">100 %</tspan></text><rect x="10" y="210" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="234.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La copia en línea de SQLite sale siempre íntegra; la frecuencia decide cuántos estudiantes reciben un aviso repetido. La</tspan></text><text x="470" y="251.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">caída uniforme en el tiempo y la ausencia de escrituras concurrentes son supuestos del autor.</tspan></text><text x="470" y="291.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
