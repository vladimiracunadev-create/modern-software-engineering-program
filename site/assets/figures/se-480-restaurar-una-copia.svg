<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 305" width="940" height="305" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Restaurar una copia de un servicio con 30 entregas y 60 pasadas al día durante tres días (400 caídas por fila)</title><desc id="d">Tabla con la restauración de una copia de un servicio de avisos con 30 entregas y 60 pasadas al día durante tres días en 400 caídas por fila: con una copia cada 24 horas se pierden 28,9 pasadas de media y se reenviarían 6,8 avisos, con algún reenvío en el 87 por ciento de las caídas; con una cada 6 horas 6,9 y 1,4, el 60 por ciento; con una cada hora 0,8 y 0,0, el 0 por ciento; todas las copias pasan la comprobación de integridad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="305" fill="#ffffff"/><rect x="10" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="127" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="127" dy="0">Frecuencia de copia</tspan></text><rect x="250" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Pasadas perdidas</tspan></text><rect x="420" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Avisos reenviados</tspan></text><rect x="610" y="12" width="164" height="38" rx="10" fill=