<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 441" width="950" height="441" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco oráculos sobre 18 mutantes no equivalentes del núcleo de Avisos: cuántos mata cada uno y cuáles deja vivos</title><desc id="d">Tabla con cinco oráculos aplicados a 18 mutantes no equivalentes del núcleo de Avisos: un caso feliz único mata 7, ocho pruebas de ejemplo matan 15 y dejan vivos los mutantes M01, M12 y M16, los escenarios de aceptación con reloj matan 17 y dejan vivo M01, el contrato con 400 estados al azar mata 13 y deja vivos cinco, y un modelo de referencia ejecutable mata los 18; los tiempos van de menos de una décima de milisegundo a 4,5 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="441" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Oráculo</tspan></text><rect x="340" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Mata</tspan></text><rect x="460" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="632" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="632" dy="0">Mutantes que deja vivos</tspan></text><rect x="810" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Tiempo (ms)</tspan></text><rect x="10" y="56" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Caso feliz único</tspan></text><rect x="340" y="56" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">7 de 18</tspan></text><rect x="460" y="56" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">M01, M03, M05 a M12 y M16</tspan></text><rect x="810" y="56" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">&lt; 0,1</tspan></text><rect x="10" y="110" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Ocho pruebas de ejemplo (TDD)</tspan></text><rect x="340" y="110" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">15 de 18</tspan></text><rect x="460" y="110" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">M01, M12, M16</tspan></text><rect x="810" y="110" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">&lt; 0,1</tspan></text><rect x="10" y="164" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Escenarios de aceptación con reloj</tspan></text><rect x="340" y="164" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">17 de 18</tspan></text><rect x="460" y="164" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">M01</tspan></text><rect x="810" y="164" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0,5</tspan></text><rect x="10" y="218" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Contrato con 400 estados al azar</tspan></text><rect x="340" y="218" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">13 de 18</tspan></text><rect x="460" y="218" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">M02, M04, M08, M14, M18</tspan></text><rect x="810" y="218" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">4,5</tspan></text><rect x="10" y="272" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Modelo de referencia ejecutable</tspan></text><rect x="340" y="272" width="114" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">18 de 18</tspan></text><rect x="460" y="272" width="344" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="632" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="632" dy="0">ninguno</tspan></text><rect x="810" y="272" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">4,3</tspan></text><rect x="10" y="330" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Ningún oráculo cubre lo mismo: el contrato deja vivos cinco mutantes que las ocho pruebas matan, y las ocho pruebas dejan</tspan></text><text x="475" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">vivos tres que el contrato mata. Los dos mutantes equivalentes sobreviven a todos, como debe ser. Las 20 variantes las</tspan></text><text x="475" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">escribió el autor; no son una muestra de defectos reales.</tspan></text><text x="475" y="427.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
