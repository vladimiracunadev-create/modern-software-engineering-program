<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 353" width="990" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres mutantes sobreviven a las ocho pruebas; tres pruebas guiadas por ellos matan los 18</title><desc id="d">Tabla con los tres mutantes que sobreviven a ocho pruebas de TDD: M01 avisa en el instante exacto del vencimiento y lo mata una prueba con cero horas restantes, M12 invierte la comparación de los avisos ya enviados y lo mata una prueba con un envío previo del umbral de 24 horas, y M16 avisa una hora antes de lo debido y lo mata el par de 73 y 72 horas restantes; con las tres pruebas añadidas mueren los 18 mutantes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="353" fill="#ffffff"/><rect x="10" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="62" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="62" dy="0">Mutante</tspan></text><rect x="120" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="307" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307" dy="0">Qué hace mal</tspan></text><rect x="500" y="12" width="474" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Prueba que lo mata</tspan></text><rect x="10" y="56" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">M01</tspan></text><rect x="120" y="56" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Avisa en el instante exacto del vencimiento</tspan></text><rect x="500" y="56" width="474" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Un caso en el límite: faltan 0 horas</tspan></text><rect x="10" y="122" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">M12</tspan></text><rect x="120" y="122" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Invierte la comparación de avisos ya enviados</tspan></text><rect x="500" y="122" width="474" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Un envío anterior del umbral de 24 horas no debe dejar pasar</tspan></text><text x="737" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">el de 72</tspan></text><rect x="10" y="188" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="221.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">M16</tspan></text><rect x="120" y="188" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="307" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="307" dy="0">Avisa una hora antes de lo debido</tspan></text><rect x="500" y="188" width="474" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="213.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">El par 27 y 28 horas: a las 73 horas restantes no hay aviso, a</tspan></text><text x="737" y="229.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">las 72 sí</tspan></text><rect x="10" y="258" width="970" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Los sobrevivientes señalan qué ejemplo falta; no sustituyen el criterio de quien diseña las pruebas. Matar los 18 no demuestra que</tspan></text><text x="495" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">el código sea correcto: demuestra que estas 18 variantes se distinguen del original con estas pruebas.</tspan></text><text x="495" y="339.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
