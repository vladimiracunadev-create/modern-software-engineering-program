<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 439" width="990" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué estilo conviene según la situación del colaborador y del cambio</title><desc id="d">Tabla de decisión con cuatro situaciones: un colaborador lento, externo o no determinista pide un doble con estado si es posible y simulados si no; querer refactorizar el interior sin tocar pruebas favorece el estilo clásico; diseñar de fuera hacia dentro favorece el estilo de Londres; y un cambio de interfaz de un colaborador hace fallar a ambos porque es un cambio de contrato.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="439" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Situación</tspan></text><rect x="380" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Estilo que conviene</tspan></text><rect x="650" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Por qué</tspan></text><rect x="10" y="56" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="86.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">El colaborador es lento, externo o no</tspan></text><text x="192" y="102.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">determinista</tspan></text><rect x="380" y="56" width="264" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Doble con estado si se puede; si</tspan></text><text x="512" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">no, simulado</tspan></text><rect x="650" y="56" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">El estilo de Londres sirve para fijar el</tspan></text><text x="812" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">contrato en la frontera</tspan></text><rect x="10" y="132" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="162.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Se quiere refactorizar el interior sin tocar</tspan></text><text x="192" y="178.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">pruebas</tspan></text><rect x="380" y="132" width="264" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Clásico</tspan></text><rect x="650" y="132" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="162.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Aserciones sobre resultados toleran</tspan></text><text x="812" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">cambios de colaboración</tspan></text><rect x="10" y="208" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="238.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Se diseña de fuera hacia dentro sin saber aún</tspan></text><text x="192" y="254.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">qué colabora</tspan></text><rect x="380" y="208" width="264" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Londres</tspan></text><rect x="650" y="208" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Simular descubre las interfaces que hacen</tspan></text><text x="812" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">falta</tspan></text><rect x="10" y="284" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="322.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Un colaborador cambia de interfaz</tspan></text><rect x="380" y="284" width="264" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="322.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">Ambos fallan</tspan></text><rect x="650" y="284" width="324" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="322.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">Es un cambio de contrato, no un refactor</tspan></text><rect x="10" y="364" width="970" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="388.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">La tabla es una guía de criterio, no un resultado medido: lo medido está en la primera figura. Muchos equipos usan los dos estilos</tspan></text><text x="495" y="405.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">según el colaborador.</tspan></text></svg>
