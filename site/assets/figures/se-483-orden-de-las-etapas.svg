<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 263" width="940" height="263" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Minutos esperados hasta ver el primer rojo en un build fallido, según el orden de cinco etapas</title><desc id="d">Barras: ordenar las etapas de la más barata a la más cara da 7,4 minutos hasta el primer rojo; la media de las 120 órdenes posibles es 15,4 y el orden inverso, 23,4 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="263" fill="#ffffff"/><text x="230" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Barato primero</tspan></text><rect x="240" y="16" width="192.4" height="28" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="440.4" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="440.4" dy="0">7,4 min</tspan></text><text x="230" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Media de las 120 órdenes</tspan></text><rect x="240" y="60" width="400.998" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648.998" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="648.998" dy="0">15,4 min</tspan></text><text x="230" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="230" dy="0">Caro primero</tspan></text><rect x="240" y="104" width="609.596" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="857.596" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="857.596" dy="0">23,4 min</tspan></text><rect x="10" y="152" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las cinco etapas (lint 0,3 min, tipos 1, unitarias 3, integración 8, e2e 14) y la fracción de fallos que detecta cada una</tspan></text><text x="470" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">son supuestos del autor. El orden por razón probabilidad/costo coincide con el óptimo de las 120 permutaciones. Un build</tspan></text><text x="470" y="210.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">verde cuesta 26,3 min en cualquier orden: ordenar solo ayuda a los rojos.</tspan></text><text x="470" y="249.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
