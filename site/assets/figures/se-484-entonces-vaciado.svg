<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 555" width="990" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reemplazar el «Entonces» de un escenario por un paso que no afirma nada: mutantes que dejan de morir</title><desc id="d">Tabla con el efecto de reemplazar el paso Entonces de cada escenario por un paso que no afirma nada: de los 15 mutantes que mueren con los escenarios completos, el escenario de no repetir pierde 2, los de quien ya entregó, última hora, 24 horas y otro curso pierden 1 cada uno, y los de 72 horas, caída y entrega vencida no pierden ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="555" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Escenario con el «Entonces» vaciado</tspan></text><rect x="570" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="682" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">Mutantes que siguen</tspan></text><text x="682" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="682" dy="0">muriendo</tspan></text><rect x="800" y="12" width="174" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="887" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">Se pierden</tspan></text><rect x="10" y="56" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">avisa a las 72 horas</tspan></text><rect x="570" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">15</tspan></text><rect x="800" y="56" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">0</tspan></text><rect x="10" y="106" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">no repite un aviso enviado</tspan></text><rect x="570" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">13</tspan></text><rect x="800" y="106" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">2</tspan></text><rect x="10" y="156" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">quien ya entregó no recibe avisos</tspan></text><rect x="570" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">14</tspan></text><rect x="800" y="156" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">1</tspan></text><rect x="10" y="206" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">tras una caída solo llega el aviso más urgente</tspan></text><rect x="570" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">15</tspan></text><rect x="800" y="206" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">0</tspan></text><rect x="10" y="256" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">conserva el aviso de la última hora</tspan></text><rect x="570" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">14</tspan></text><rect x="800" y="256" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">1</tspan></text><rect x="10" y="306" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">no recibe el de 24 horas</tspan></text><rect x="570" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">14</tspan></text><rect x="800" y="306" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">1</tspan></text><rect x="10" y="356" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="381.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">no afecta a otro curso</tspan></text><rect x="570" y="356" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">14</tspan></text><rect x="800" y="356" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">1</tspan></text><rect x="10" y="406" width="554" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="431.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">una entrega vencida no avisa</tspan></text><rect x="570" y="406" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="682" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682" dy="0">15</tspan></text><rect x="800" y="406" width="174" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">0</tspan></text><rect x="10" y="460" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="484.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Tres escenarios pueden perder su «Entonces» sin que ninguna comprobación se resienta: quedan cubiertos por otros o no afirman lo</tspan></text><text x="495" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">que dicen. Es una señal para revisar el texto, no una prueba de que sobren.</tspan></text><text x="495" y="541.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
