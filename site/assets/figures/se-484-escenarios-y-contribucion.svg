<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 605" width="990" height="605" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nueve escenarios en lenguaje de negocio ejecutados contra 18 mutantes: cuántos mata cada uno y cuántos solo él</title><desc id="d">Tabla con nueve escenarios Gherkin ejecutados como pruebas contra 18 mutantes: avisar a las 72 horas mata 5 y ninguno solo él, no repetir un aviso mata 3 y todos solo él, quien ya entregó mata 2 y 1 solo él, la caída mata 6, el silencio con la última hora mata 9 y 1 solo él, el silencio sin el de 24 horas mata 2 y 1 solo él, el silencio por curso mata 8 y 1 solo él, la entrega vencida mata 1 y el escenario de la interfaz agradable no mata ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="605" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Escenario</tspan></text><rect x="650" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Mutantes que mata</tspan></text><rect x="840" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="907" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="907" dy="0">Solo él</tspan></text><rect x="10" y="56" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">avisa a las 72 horas</tspan></text><rect x="650" y="56" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">5</tspan></text><rect x="840" y="56" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">0</tspan></text><rect x="10" y="106" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">no repite un aviso enviado</tspan></text><rect x="650" y="106" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">3</tspan></text><rect x="840" y="106" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">3</tspan></text><rect x="10" y="156" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">quien ya entregó no recibe avisos</tspan></text><rect x="650" y="156" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">2</tspan></text><rect x="840" y="156" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">1</tspan></text><rect x="10" y="206" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">tras una caída solo llega el aviso más urgente</tspan></text><rect x="650" y="206" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">6</tspan></text><rect x="840" y="206" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">0</tspan></text><rect x="10" y="256" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">un curso silenciado conserva el aviso de la última hora</tspan></text><rect x="650" y="256" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">9</tspan></text><rect x="840" y="256" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">1</tspan></text><rect x="10" y="306" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">un curso silenciado no recibe el de 24 horas</tspan></text><rect x="650" y="306" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">2</tspan></text><rect x="840" y="306" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">1</tspan></text><rect x="10" y="356" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="381.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">el silencio de un curso no afecta a otro</tspan></text><rect x="650" y="356" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">8</tspan></text><rect x="840" y="356" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">1</tspan></text><rect x="10" y="406" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="431.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">una entrega vencida no avisa</tspan></text><rect x="650" y="406" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">1</tspan></text><rect x="840" y="406" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">0</tspan></text><rect x="10" y="456" width="634" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="481.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">la interfaz es agradable</tspan></text><rect x="650" y="456" width="184" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="481.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">0</tspan></text><rect x="840" y="456" width="134" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="481.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">0</tspan></text><rect x="10" y="510" width="970" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="534.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Los nueve escenarios usan 32 pasos y 10 definiciones de paso (3,2 pasos por definición) y matan 15 de 18; sobreviven M01, M12 y</tspan></text><text x="495" y="551.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">M16. El último escenario pasa siempre: su «Entonces» no afirma nada comprobable. Escenarios y mutantes los escribió el autor.</tspan></text><text x="495" y="591.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
