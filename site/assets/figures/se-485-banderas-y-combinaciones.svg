<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Banderas de funcionalidad: configuraciones posibles frente a las necesarias para cubrir todas las parejas</title><desc id="d">Barras agrupadas en escala logarítmica con las configuraciones posibles y las necesarias para cubrir todas las parejas: con 2 banderas 4 y 4; con 6, 64 y 7; con 8, 256 y 8; con 10, 1 024 y 9, el 0,9 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Banderas de funcionalidad: configuraciones posibles frente a las necesarias para cubrir todas las parejas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Configuraciones</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Para cubrir parejas</tspan></text><line x1="101.24" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="375" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="305" x2="101.24" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="235" x2="101.24" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="165" x2="101.24" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="95" x2="101.24" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="95" x2="101.24" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Configuraciones (escala logarítmica)</text><rect x="117.615" y="332.856" width="63.5008" height="42.1442" rx="3" fill="#6b7c86"/><text x="149.366" y="326.856" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="149.366" dy="0">4</tspan></text><rect x="185.116" y="332.856" width="63.5008" height="42.1442" rx="3" fill="#087f8c"/><text x="216.866" y="326.856" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="216.866" dy="0">4</tspan></text><text x="183.116" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.116" dy="0">2 banderas</tspan></text><rect x="281.367" y="290.712" width="63.5008" height="84.2884" rx="3" fill="#6b7c86"/><text x="313.118" y="284.712" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="313.118" dy="0">16</tspan></text><rect x="348.868" y="320.529" width="63.5008" height="54.4706" rx="3" fill="#087f8c"/><text x="380.618" y="314.529" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="380.618" dy="0">6</tspan></text><text x="346.868" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="346.868" dy="0">4 banderas</tspan></text><rect x="445.119" y="248.567" width="63.5008" height="126.433" rx="3" fill="#6b7c86"/><text x="476.87" y="242.567" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="476.87" dy="0">64</tspan></text><rect x="512.62" y="315.843" width="63.5008" height="59.1569" rx="3" fill="#087f8c"/><text x="544.37" y="309.843" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="544.37" dy="0">7</tspan></text><text x="510.62" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">6 banderas</tspan></text><rect x="608.871" y="206.423" width="63.5008" height="168.577" rx="3" fill="#6b7c86"/><text x="640.622" y="200.423" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="640.622" dy="0">256</tspan></text><rect x="676.372" y="311.784" width="63.5008" height="63.2163" rx="3" fill="#087f8c"/><text x="708.122" y="305.784" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="708.122" dy="0">8</tspan></text><text x="674.372" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="674.372" dy="0">8 banderas</tspan></text><rect x="772.623" y="164.279" width="63.5008" height="210.721" rx="3" fill="#6b7c86"/><text x="804.374" y="158.279" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="804.374" dy="0">1 024</tspan></text><rect x="840.124" y="308.203" width="63.5008" height="66.797" rx="3" fill="#087f8c"/><text x="871.874" y="302.203" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="871.874" dy="0">9</tspan></text><text x="838.124" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="838.124" dy="0">10 banderas</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cubrir las parejas cuesta casi nada, pero no cubre las interacciones de tres banderas ni el comportamiento de las que nadie</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">recuerda. Con 3 banderas nuevas al mes y ninguna retirada hay 36 a los 12 meses; retirando una de cada cuatro al mes quedan</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">12. Una bandera es deuda con fecha de caducidad.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
