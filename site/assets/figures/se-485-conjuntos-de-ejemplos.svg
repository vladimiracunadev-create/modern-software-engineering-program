<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 491" width="990" height="491" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro conjuntos de ejemplos de aceptación y los mutantes que dejan vivos</title><desc id="d">Tabla con conjuntos de ejemplos de aceptación sobre los 18 mutantes no equivalentes: cinco típicos matan 10, doce de frontera del tiempo matan 11, veinte al azar matan 8, 144 combinatorios matan 17 y dejan vivo solo M08, y frontera con típicos juntos, 17 ejemplos, matan 14.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="491" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Conjunto</tspan></text><rect x="310" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Ejemplos</tspan></text><rect x="420" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="477" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="477" dy="0">Mata</tspan></text><rect x="540" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="757" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="757" dy="0">Deja vivos</tspan></text><rect x="10" y="56" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">5 ejemplos típicos</tspan></text><rect x="310" y="56" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">5</tspan></text><rect x="420" y="56" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">10 de 18</tspan></text><rect x="540" y="56" width="434" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">M01, M02, M05, M08, M09, M11, M12, M16</tspan></text><rect x="10" y="120" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="152.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">12 ejemplos de frontera del tiempo</tspan></text><rect x="310" y="120" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">12</tspan></text><rect x="420" y="120" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">11 de 18</tspan></text><rect x="540" y="120" width="434" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">M03, M05, M06, M07, M08, M11, M12</tspan></text><rect x="10" y="184" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="216.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">20 ejemplos al azar</tspan></text><rect x="310" y="184" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">20</tspan></text><rect x="420" y="184" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">8 de 18</tspan></text><rect x="540" y="184" width="434" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">M01, M02, M04, M06, M07, M08, M13, M14, M17, M18</tspan></text><rect x="10" y="248" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="280.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">144 ejemplos combinatorios</tspan></text><rect x="310" y="248" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">144</tspan></text><rect x="420" y="248" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">17 de 18</tspan></text><rect x="540" y="248" width="434" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">M08</tspan></text><rect x="10" y="312" width="294" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="344.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Frontera y típicos juntos</tspan></text><rect x="310" y="312" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="344.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">17</tspan></text><rect x="420" y="312" width="114" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="477" y="344.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477" dy="0">14 de 18</tspan></text><rect x="540" y="312" width="434" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="757" y="344.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="757" dy="0">cuatro (M05, M08, M11 y M12)</tspan></text><rect x="10" y="380" width="970" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Más ejemplos no es mejor: 20 al azar matan menos que 12 bien elegidos. El conjunto combinatorio llega a 17 pero no mata M08 porque</tspan></text><text x="495" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">solo combina un estudiante y un curso; las dimensiones que el conjunto no varía quedan sin comprobar. Los resultados esperados</tspan></text><text x="495" y="438.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">salen de un modelo escrito aparte.</tspan></text><text x="495" y="477.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
