<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 355" width="940" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos o tres canalizaciones que aplican a la vez sobre el mismo archivo de estado: todas las intercalaciones</title><desc id="d">Barras apiladas horizontales con las intercalaciones de leer, aplicar y escribir: con dos canalizaciones hay 20 y 18 dejan el estado distinto de la nube; con tres hay 1 680 y 1 674 lo hacen; con un bloqueo solo hay órdenes en serie y ninguna diverge.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="355" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos o tres canalizaciones que aplican a la vez sobre el mismo archivo de estado: todas las intercalaciones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Estado = nube</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Estado ≠ nube</tspan></text><line x1="264" y1="77" x2="264" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="264" y1="157" x2="264" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="264" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264" dy="0">0</tspan></text><line x1="416.925" y1="77" x2="416.925" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="416.925" y1="157" x2="416.925" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="416.925" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="416.925" dy="0">500</tspan></text><line x1="569.85" y1="77" x2="569.85" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="569.85" y1="157" x2="569.85" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="569.85" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.85" dy="0">1 000</tspan></text><line x1="722.775" y1="77" x2="722.775" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="722.775" y1="157" x2="722.775" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="722.775" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722.775" dy="0">1 500</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 000</tspan></text><line x1="264" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="254" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">2 canalizaciones sin bloqueo</tspan></text><text x="254" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="254" dy="0">3 canalizaciones sin bloqueo</tspan></text><rect x="264" y="84" width="0.6117" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="264.612" y="84" width="5.5053" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="277.117" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="277.117" dy="0">20</tspan></text><rect x="264" y="124" width="1.8351" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="265.835" y="124" width="511.993" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="521.832" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="521.832" dy="0">1 674</tspan></text><text x="784.828" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="784.828" dy="0">1 680</tspan></text><text x="569.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="569.85" dy="0">Intercalaciones</tspan></text><rect x="10" y="215" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con un bloqueo o una cola solo hay órdenes en serie y 0 intercalaciones divergen. La pérdida no es un accidente raro: solo</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">las ejecuciones en serie son seguras (2 de 20, 6 de 1 680). Cada canalización escribe el estado completo que leyó, así que</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la última escritura borra lo que la otra aplicó. Un bloqueo del estado (o una cola) vuelve la ejecución serial. El modelo</tspan></text><text x="470" y="289.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">supone que el estado se guarda entero.</tspan></text><text x="470" y="337.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
