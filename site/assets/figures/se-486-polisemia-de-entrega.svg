<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 475" width="950" height="475" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro mil doscientas cuarenta y nueve frases con «entrega» en las Partes 00 a 39 clasificadas por sentido</title><desc id="d">Tabla con las 4249 frases que contienen la palabra entrega en las clases de las Partes 00 a 39 clasificadas por reglas léxicas: 487 hablan del trabajo de una persona estudiante en 29 partes, 89 de liberar o desplegar software en 16 partes, 122 de hacer llegar un mensaje o resultado en 19 partes, 15 mezclan más de un sentido y 3536 no tienen un sentido que las reglas reconozcan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="475" fill="#ffffff"/><rect x="10" y="12" width="634" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="327" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327" dy="0">Sentido de «entrega»</tspan></text><rect x="650" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Frases</tspan></text><rect x="800" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">Partes</tspan></text><rect x="10" y="56" width="634" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Trabajo de una persona estudiante: curso, vencimiento, aviso</tspan></text><rect x="650" y="56" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">487</tspan></text><rect x="800" y="56" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">29</tspan></text><rect x="10" y="120" width="634" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="152.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Liberar o desplegar software: entrega continua, pipeline, release</tspan></text><rect x="650" y="120" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">89</tspan></text><rect x="800" y="120" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">16</tspan></text><rect x="10" y="184" width="634" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="216.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Hacer llegar un mensaje o resultado: cola, al menos una vez</tspan></text><rect x="650" y="184" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">122</tspan></text><rect x="800" y="184" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">19</tspan></text><rect x="10" y="248" width="634" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="280.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Frases con más de un sentido a la vez</tspan></text><rect x="650" y="248" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">15</tspan></text><rect x="800" y="248" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">—</tspan></text><rect x="10" y="312" width="634" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="327" y="344.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="327" dy="0">Frases sin sentido reconocible por las reglas</tspan></text><rect x="650" y="312" width="144" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="344.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">3 536</tspan></text><rect x="800" y="312" width="134" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="344.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">—</tspan></text><rect x="10" y="380" width="930" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">La palabra que da nombre al dominio de Avisos tiene al menos tres sentidos en el propio programa. Las reglas léxicas son</tspan></text><text x="475" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">burdas: las 3 536 frases sin clasificar no significan que carezcan de sentido, sino que las reglas no lo ven.</tspan></text><text x="475" y="461.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Recuento léxico sobre content/part-00..39 con expresiones regulares; idéntico en Windows 11 y Ubuntu (WSL2).</tspan></text></svg>
