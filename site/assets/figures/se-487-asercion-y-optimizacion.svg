<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 291" width="960" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma precondición ejecutada con y sin la opción de optimización de Python</title><desc id="d">Diagrama de dos ejecuciones reales de la misma función con una entrega ya vencida: en modo normal la aserción de la precondición se evalúa y el programa informa de que el contrato se violó; con la opción -O la aserción desaparece y la función devuelve menos diez, un valor sin sentido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="291" fill="#ffffff"/><rect x="10" y="14" width="200" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="55.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">python (normal)</tspan></text><rect x="246" y="14" width="330" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="411" y="47.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="411" dy="0">contrato violado: precondición: la entrega</tspan></text><text x="411" y="63.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="411" dy="0">no ha vencido</tspan></text><rect x="612" y="14" width="338" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="781" y="55.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">la aserción se evalúa y detiene el cálculo</tspan></text><polyline points="210,52 246,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="576,52 612,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="108" width="200" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">python -O</tspan></text><rect x="246" y="108" width="330" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="411" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="411" dy="0">resultado -10</tspan></text><rect x="612" y="108" width="338" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="781" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">la aserción desaparece y el cálculo</tspan></text><text x="781" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="781" dy="0">devuelve un valor sin sentido</tspan></text><polyline points="210,146 246,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="576,146 612,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="198" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="222.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Una precondición escrita con assert no es un contrato si el despliegue puede ejecutarse con -O o PYTHONOPTIMIZE. Un contrato</tspan></text><text x="480" y="239.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">que debe valer en producción se escribe como una comprobación explícita que lanza una excepción.</tspan></text><text x="480" y="281.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Dos procesos de Python lanzados con subprocess; mismo resultado en Windows 11 (CPython 3.12.9) y Ubuntu (3.12.3).</tspan></text></svg>
