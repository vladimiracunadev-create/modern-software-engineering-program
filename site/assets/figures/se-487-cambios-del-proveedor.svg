 escritos por el autor sobre un cliente de cuatro campos.</tspan></text><text x="505" y="693.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="505" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
