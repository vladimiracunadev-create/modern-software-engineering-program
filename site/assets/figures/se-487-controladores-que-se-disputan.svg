<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 569" width="940" height="569" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un controlador de GitOps y un escalador automático que se disputan el número de réplicas (24 h, 1 440 minutos)</title><desc id="d">Barras agrupadas con los minutos sin capacidad, las acciones del escalador y las reversiones del reconciliador: si el repositorio fija tres réplicas son 361, 854 y 425; si omite el campo, 0, 640 y ninguna reversión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="569" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un controlador de GitOps y un escalador automático que se disputan el número de réplicas (24 h, 1 440</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">minutos)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Minutos sin capacidad</tspan></text><rect x="222.34" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="242.34" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Acciones del escalador</tspan></text><rect x="436.22" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="456.22" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="456.22" dy="0">Reversiones del reconciliador</tspan></text><line x1="93.7" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="394" x2="93.7" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="338" x2="920" y2="338" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="338" x2="93.7" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="342.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">200</tspan></text><line x1="93.7" y1="282" x2="920" y2="282" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="282" x2="93.7" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="286.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">400</tspan></text><line x1="93.7" y1="226" x2="920" y2="226" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="226" x2="93.7" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="230.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">600</tspan></text><line x1="93.7" y1="170" x2="920" y2="170" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="170" x2="93.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="174.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">800</tspan></text><line x1="93.7" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="114" x2="93.7" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="114" x2="93.7" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">Minutos o acciones</text><rect x="135.015" y="292.92" width="107.507" height="101.08" rx="3" fill="#c0432f"/><text x="188.768" y="286.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="188.768" dy="0">361</tspan></text><rect x="246.522" y="154.88" width="107.507" height="239.12" rx="3" fill="#102a43"/><text x="300.275" y="148.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="300.275" dy="0">854</tspan></text><rect x="358.028" y="275" width="107.507" height="119" rx="3" fill="#946512"/><text x="411.782" y="269" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="411.782" dy="0">425</tspan></text><text x="300.275" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300.275" dy="0">El repositorio fija «réplicas: 3»</tspan></text><rect x="548.165" y="392" width="107.507" height="2" rx="3" fill="#c0432f"/><text x="601.918" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.918" dy="0">0</tspan></text><rect x="659.672" y="214.8" width="107.507" height="179.2" rx="3" fill="#102a43"/><text x="713.425" y="208.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="713.425" dy="0">640</tspan></text><rect x="771.178" y="392" width="107.507" height="2" rx="3" fill="#946512"/><text x="824.932" y="386" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="824.932" dy="0">0</tspan></text><text x="713.425" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="713.425" dy="0">El repositorio omite el campo de réplicas</tspan></text><rect x="10" y="446" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Dos bucles de control que gobiernan el mismo campo no convergen: cada uno deshace al otro y el servicio paga 361 minutos de</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">capacidad insuficiente. La solución es que el repositorio deje de declarar lo que otro actor decide (ignorar el campo), no</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">subir la frecuencia de reconciliación. Carga sinusoidal con ruido; capacidad de 100 solicitudes por réplica: supuestos.</tspan></text><text x="470" y="551.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
