<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 259" width="960" height="259" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Falsas alarmas de cada detector sobre los 5 cambios del proveedor que no rompen al cliente</title><desc id="d">Gráfico de barras con las falsas alarmas sobre cinco cambios inocuos: la instantánea de la respuesta emite 3, la diferencia de esquema 4 y el contrato del consumidor 0; los tres detectan los siete cambios que sí rompen.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="259" fill="#ffffff"/><text x="304" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Instantánea de la respuesta</tspan></text><rect x="314" y="16" width="360" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="682" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="682" dy="0">3 de 5</tspan></text><text x="304" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Diferencia de esquema</tspan></text><rect x="314" y="62" width="480" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="802" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="802" dy="0">4 de 5</tspan></text><text x="304" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Contrato del consumidor</tspan></text><rect x="314" y="108" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="326" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="326" dy="0">0 de 5</tspan></text><rect x="10" y="156" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="180.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una alerta falsa recurrente enseña a ignorar las alertas: el costo de una instantánea no está en el cambio que no detecta sino</tspan></text><text x="480" y="197.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">en el que empieza a descartarse sin leer. El contrato del consumidor exige además mantener qué campos lee cada cliente.</tspan></text><text x="480" y="245.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
