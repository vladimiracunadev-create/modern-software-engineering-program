<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 397" width="940" height="397" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entornos de vista previa de 480 PR en 60 días (8 por día, 15 % abandonados): horas de entorno según la política</title><desc id="d">Barras horizontales con las horas de entorno según la política: destruir solo al cerrar el PR suma 74 357 y deja 64 huérfanos; un TTL de 72 horas suma 33 383, el 45 por ciento, con 186 recreaciones; un TTL de 24 horas renovado con cada push suma 30 460, el 41 por ciento, con 293 recreaciones y ningún huérfano.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="397" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Entornos de vista previa de 480 PR en 60 días (8 por día, 15 % abandonados): horas de entorno según la</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">política</tspan></text><line x1="294" y1="68" x2="294" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="182" x2="294" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="437.41" y1="68" x2="437.41" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="437.41" y1="182" x2="437.41" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="437.41" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437.41" dy="0">20 000</tspan></text><line x1="580.82" y1="68" x2="580.82" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="580.82" y1="182" x2="580.82" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="580.82" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="580.82" dy="0">40 000</tspan></text><line x1="724.23" y1="68" x2="724.23" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="724.23" y1="182" x2="724.23" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="724.23" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="724.23" dy="0">60 000</tspan></text><line x1="867.64" y1="68" x2="867.64" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="182" x2="867.64" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="203" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">80 000</tspan></text><line x1="294" y1="182" x2="867.64" y2="182" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">solo se destruye al cerrar el PR</tspan></text><text x="284" y="129.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">TTL de 72 h desde la creación</tspan></text><text x="284" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">TTL de 24 h renovado con cada push</tspan></text><rect x="294" y="74" width="533.175" height="26" rx="3" fill="#102a43"/><text x="834.175" y="91.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="834.175" dy="0">74 357</tspan></text><rect x="294" y="112" width="239.372" height="26" rx="3" fill="#102a43"/><text x="540.372" y="129.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="540.372" dy="0">33 383</tspan></text><rect x="294" y="150" width="218.417" height="26" rx="3" fill="#102a43"/><text x="519.417" y="167.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="519.417" dy="0">30 460</tspan></text><text x="580.82" y="226" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="580.82" dy="0">Horas de entorno</tspan></text><rect x="10" y="240" width="920" height="109.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="264.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solo se destruye al cerrar el PR: 100 % de las horas, 0 recreaciones, 64 huérfanos; TTL de 72 h desde la creación: 45 % de</tspan></text><text x="470" y="281.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las horas, 186 recreaciones, 0 huérfanos; TTL de 24 h renovado con cada push: 41 % de las horas, 293 recreaciones, 0</tspan></text><text x="470" y="298.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">huérfanos. Los PR abandonados dominan el costo: el 15 % que nadie cierra consume más de la mitad de las horas. El TTL lo</tspan></text><text x="470" y="314.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">corta a cambio de recrear el entorno cuando alguien vuelve. La actividad del PR (un push cada 14 h) y el abandono son</tspan></text><text x="470" y="331.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuestos; las horas se leen como razones, no como dinero.</tspan></text><text x="470" y="379.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
