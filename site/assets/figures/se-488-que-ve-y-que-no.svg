<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 459" width="960" height="459" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué puede comprobar una máquina entre una especificación y su código, y qué no</title><desc id="d">Diagrama de cuatro familias de comprobación entre una especificación y su código: la estructura de identificadores se comprueba de forma exacta, los valores declarados en forma legible por máquina se comparan con una lectura del árbol sintáctico, el código cambiado sin que cambie la especificación se detecta con la lista de archivos, y el significado de una condición distinta no se comprueba y exige una prueba o una persona.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="459" fill="#ffffff"/><rect x="10" y="14" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="47.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Estructura: identificadores de reglas,</tspan></text><text x="160" y="63.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">citas en código y en pruebas</tspan></text><rect x="346" y="14" width="250" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="55.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">Sí, de forma exacta</tspan></text><rect x="632" y="14" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="47.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Que una cita exista no prueba que el</tspan></text><text x="791" y="63.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">código cumpla la regla</tspan></text><polyline points="310,52 346,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,52 632,52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="108" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Valores declarados: umbrales y</tspan></text><text x="160" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">constantes comparables</tspan></text><rect x="346" y="108" width="250" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="141.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">Sí, con una lectura del árbol</tspan></text><text x="471" y="157.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">sintáctico</tspan></text><rect x="632" y="108" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Solo valores que la especificación</tspan></text><text x="791" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">declara en forma legible por máquina</tspan></text><polyline points="310,146 346,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,146 632,146" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="202" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Quién cambió qué: código sin</tspan></text><text x="160" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">especificación</tspan></text><rect x="346" y="202" width="250" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="471" y="235.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">Sí, con la lista de archivos</tspan></text><text x="471" y="251.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="471" dy="0">del cambio</tspan></text><rect x="632" y="202" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Un cambio trivial y uno de</tspan></text><text x="791" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">comportamiento valen lo mismo</tspan></text><polyline points="310,240 346,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,240 632,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="296" width="300" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Significado: una comparación o una</tspan></text><text x="160" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">condición distinta</tspan></text><rect x="346" y="296" width="250" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="471" y="337.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="471" dy="0">No</tspan></text><rect x="632" y="296" width="318" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="791" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">Exige una prueba que el cambio rompa o</tspan></text><text x="791" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="791" dy="0">la lectura de una persona</tspan></text><polyline points="310,334 346,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="596,334 632,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="386" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La especificación pagada con comprobaciones mecánicas gana lo que se puede enunciar como estructura; el significado sigue</tspan></text><text x="480" y="427.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">exigiendo pruebas ejecutables que lo enuncien.</tspan></text></svg>
