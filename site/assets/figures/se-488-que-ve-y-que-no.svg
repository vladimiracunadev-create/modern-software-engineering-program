<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 463" width="990" height="463" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué puede comprobar una máquina entre una especificación y su código, y qué no</title><desc id="d">Tabla de cuatro familias de comprobación entre una especificación y su código: la estructura de identificadores se comprueba de forma exacta, los valores declarados en forma legible por máquina se comparan con una lectura del árbol sintáctico, la ausencia de cambios de especificación junto a cambios de código se detecta con la lista de archivos, y el significado de una condición distinta no se comprueba y exige una prueba o una persona.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="463" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Qué se comprueba</tspan></text><rect x="380" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="502" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="502" dy="0">¿Lo ve la máquina?</tspan></text><rect x="630" y="12" width="344" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Límite</tspan></text><rect x="10" y="56" width="364" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="89.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Estructura: identificadores de reglas, citas en</tspan></text><text x="192" y="105.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">código y en pruebas</tspan></text><rect x="380" y="56" width="244" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Sí, de forma exacta</tspan></text><rect x="630" y="56" width="344" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Que una cita exista no prueba que el código</tspan></text><text x="802" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">cumpla la regla</tspan></text><rect x="10" y="138" width="364" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="171.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Valores declarados: umbrales y constantes</tspan></text><text x="192" y="187.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">comparables</tspan></text><rect x="380" y="138" width="244" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="171.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Sí, con una lectura del árbol</tspan></text><text x="502" y="187.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">sintáctico</tspan></text><rect x="630" y="138" width="344" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="171.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Solo valores que la especificación declara</tspan></text><text x="802" y="187.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">en forma legible por máquina</tspan></text><rect x="10" y="220" width="364" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="261.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Quién cambió qué: código sin especificación</tspan></text><rect x="380" y="220" width="244" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="253.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">Sí, con la lista de archivos</tspan></text><text x="502" y="269.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">del cambio</tspan></text><rect x="630" y="220" width="344" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="253.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Un cambio trivial y uno de comportamiento</tspan></text><text x="802" y="269.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">valen lo mismo</tspan></text><rect x="10" y="302" width="364" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="335.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Significado: una comparación o una condición</tspan></text><text x="192" y="351.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">distinta</tspan></text><rect x="380" y="302" width="244" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="502" y="343.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="502" dy="0">No</tspan></text><rect x="630" y="302" width="344" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="335.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">Exige una prueba que el cambio rompa o la</tspan></text><text x="802" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">lectura de una persona</tspan></text><rect x="10" y="388" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="412.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">La especificación pagada con comprobaciones mecánicas gana lo que se puede enunciar como estructura; el significado sigue</tspan></text><text x="495" y="429.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">exigiendo pruebas ejecutables que lo enuncien.</tspan></text></svg>
