<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 671" width="940" height="671" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos de 6 000 estudiantes sintéticos sin nombre: unicidad y reidentificación por vinculación con una lista externa del 70 %</title><desc id="d">Barras horizontales con el porcentaje de personas únicas, reidentificadas y en grupos de menos de cinco según los cuasi-identificadores conservados: con fecha de nacimiento, código postal y género el 97,6 por ciento es único y se reidentifica; con año, código postal y género el 1,2; con año, tres dígitos postales y género el 0,02 y ninguna reidentificación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="671" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Datos de 6 000 estudiantes sintéticos sin nombre: unicidad y reidentificación por vinculación con una lista</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">externa del 70 %</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Únicos</tspan></text><rect x="109.24" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="129.24" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">Reidentificados</tspan></text><rect x="270.34" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="290.34" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="290.34" dy="0">En grupos de menos de 5</tspan></text><line x1="324" y1="96" x2="324" y2="456" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="456" x2="324" y2="461" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="432.728" y1="96" x2="432.728" y2="456" stroke="#d5dde1" stroke-width="1"/><line x1="432.728" y1="456" x2="432.728" y2="461" stroke="#5b7280" stroke-width="1.4"/><text x="432.728" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="432.728" dy="0">20</tspan></text><line x1="541.456" y1="96" x2="541.456" y2="456" stroke="#d5dde1" stroke-width="1"/><line x1="541.456" y1="456" x2="541.456" y2="461" stroke="#5b7280" stroke-width="1.4"/><text x="541.456" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="541.456" dy="0">40</tspan></text><line x1="650.184" y1="96" x2="650.184" y2="456" stroke="#d5dde1" stroke-width="1"/><line x1="650.184" y1="456" x2="650.184" y2="461" stroke="#5b7280" stroke-width="1.4"/><text x="650.184" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650.184" dy="0">60</tspan></text><line x1="758.912" y1="96" x2="758.912" y2="456" stroke="#d5dde1" stroke-width="1"/><line x1="758.912" y1="456" x2="758.912" y2="461" stroke="#5b7280" stroke-width="1.4"/><text x="758.912" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="758.912" dy="0">80</tspan></text><line x1="867.64" y1="96" x2="867.64" y2="456" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="456" x2="867.64" y2="461" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="477" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100</tspan></text><line x1="324" y1="456" x2="867.64" y2="456" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="137" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">fecha, código postal y género (sin</tspan></text><text x="314" y="154" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">nombre)</tspan></text><text x="314" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">año de nacimiento, código postal y género</tspan></text><text x="314" y="317" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">año de nacimiento, 3 dígitos postales y</tspan></text><text x="314" y="334" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">género</tspan></text><text x="314" y="415.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">bienio, 2 dígitos postales, sin género</tspan></text><rect x="324" y="102" width="530.683" height="24" rx="3" fill="#c0432f"/><text x="861.683" y="118.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="861.683" dy="0">97,62</tspan></text><rect x="324" y="129" width="530.5" height="24" rx="3" fill="#102a43"/><text x="861.5" y="145.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="861.5" dy="0">97,58</tspan></text><rect x="324" y="156" width="543.64" height="24" rx="3" fill="#946512"/><text x="874.64" y="172.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="874.64" dy="0">100,00</tspan></text><rect x="324" y="192" width="6.43307" height="24" rx="3" fill="#c0432f"/><text x="337.433" y="208.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="337.433" dy="0">1,18</tspan></text><rect x="324" y="219" width="6.31241" height="24" rx="3" fill="#102a43"/><text x="337.312" y="235.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="337.312" dy="0">1,16</tspan></text><rect x="324" y="246" width="121.141" height="24" rx="3" fill="#946512"/><text x="452.141" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="452.141" dy="0">22,28</tspan></text><rect x="324" y="282" width="2" height="24" rx="3" fill="#c0432f"/><text x="333" y="298.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0,02</tspan></text><rect x="324" y="309" width="2" height="24" rx="3" fill="#102a43"/><text x="333" y="325.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0,00</tspan></text><rect x="324" y="336" width="6.34247" height="24" rx="3" fill="#946512"/><text x="337.342" y="352.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="337.342" dy="0">1,17</tspan></text><rect x="324" y="372" width="2" height="24" rx="3" fill="#c0432f"/><text x="333" y="388.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0,00</tspan></text><rect x="324" y="399" width="2" height="24" rx="3" fill="#102a43"/><text x="333" y="415.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0,00</tspan></text><rect x="324" y="426" width="2" height="24" rx="3" fill="#946512"/><text x="333" y="442.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0,00</tspan></text><text x="595.82" y="500" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="595.82" dy="0">Personas (%)</tspan></text><rect x="10" y="514" width="920" height="109.2" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="538.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Número de grupos por conjunto: fecha, código postal y género (sin nombre): 5928, año de nacimiento, código postal y género:</tspan></text><text x="470" y="555.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">966, año de nacimiento, 3 dígitos postales y género: 363, bienio, 2 dígitos postales, sin género: 12. Quitar el nombre no</tspan></text><text x="470" y="572.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">anonimiza: tres datos corrientes bastan para identificar a casi todas las personas. Generalizar reduce el riesgo a costa de</tspan></text><text x="470" y="588.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">detalle: con 12 grupos ya no se distingue casi nada. El 22,3 % de grupos pequeños con año y código postal completo recuerda</tspan></text><text x="470" y="605.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">que no basta con que casi nadie sea único. Población y lista externa sintéticas.</tspan></text><text x="470" y="653.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
