<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 587" width="940" height="587" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Equipos que adoptan el camino dorado según su cobertura y el esfuerzo de empezar (400 equipos por celda)</title><desc id="d">Líneas con el porcentaje de equipos que adoptan el camino según las horas para empezar: si cubre 3 de 6 capacidades lo adopta el 31 por ciento con 4 horas, 16 con 20 y 2 con 60; si cubre 4, el 55, 33 y 5; si cubre las 6, el 100, 92 y 20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="587" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Equipos que adoptan el camino dorado según su cobertura y el esfuerzo de empezar (400 equipos por celda)</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cubre 3 de 6 capacidades</tspan></text><rect x="244.96" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="264.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Cubre 4 de 6 capacidades</tspan></text><polygon points="479.92,44.1 486.52,56.4 473.32,56.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="493.92" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="493.92" dy="0">Cubre 6 de 6 capacidades</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="327" x2="910" y2="327" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="327" x2="78.62" y2="327" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="331.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="267" x2="78.62" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="910" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="147" x2="910" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="147" x2="78.62" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">4 h</tspan></text><line x1="569.327" y1="87" x2="569.327" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="569.327" y1="387" x2="569.327" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="569.327" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.327" dy="0">20 h</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">60 h</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Equipos que adoptan (%)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Horas para empezar (escala logarítmica)</tspan></text><polyline points="96.62,294 569.327,340.5 892,381" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="294" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="283" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">31</tspan></text><circle cx="569.327" cy="340.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="569.327" y="329.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="569.327" dy="0">16</tspan></text><circle cx="892" cy="381" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="370" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">2</tspan></text><polyline points="96.62,223.5 569.327,287.25 892,372.75" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="218" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="96.62" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">55</tspan></text><rect x="563.827" y="281.75" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="569.327" y="276.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="569.327" dy="0">33</tspan></text><rect x="886.5" y="367.25" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="361.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">5</tspan></text><polyline points="96.62,87 569.327,112.5 892,328.5" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,80.675 102.67,91.95 90.57,91.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">100</tspan></text><polygon points="569.327,106.175 575.377,117.45 563.277,117.45" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="569.327" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="569.327" dy="0">92</tspan></text><polygon points="892,322.175 898.05,333.45 885.95,333.45" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="317.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">20</tspan></text><rect x="10" y="447" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Adopción parcial (4, 20 y 60 h): cobertura 3 de 6: 95 %, 95 %, 62 %; cobertura 4 de 6: 84 %, 71 %, 74 %; cobertura 6 de 6:</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">0 %, 0 %, 0 %. Un camino fácil de empezar pero incompleto lo adopta la mitad de los equipos y casi todos acaban</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">improvisando lo que falta. Uno completo pero costoso de usar (60 h) casi nadie lo toma. La adopción no mide calidad: mide</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que el camino compite bien contra el costo de construirlo por cuenta propia (mediana de 40 h, supuesto del autor).</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
