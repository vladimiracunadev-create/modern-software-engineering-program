<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 421" width="990" height="421" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una versión con 5 puntos menos de precisión pasa la puerta: según casos y repeticiones por evaluación</title><desc id="d">Tabla con una puerta de release de umbral 0,825 sobre una versión sana de precisión 0,85 y una versión con regresión de 0,80, con 4000 simulaciones por celda: con 20 casos y una corrida la puerta deja pasar la regresión el 41,9 por ciento de las veces y rechaza la versión sana el 36,0; con 100 casos, 28,0 y 22,4; con 400, 12,0 y 7,3; con 1600, 0,6 y 0,3; con tres corridas por caso las cifras bajan, con 400 casos a 1,5 y 0,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="421" fill="#ffffff"/><rect x="10" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="62" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="62" dy="0">Casos</tspan></text><rect x="120" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Pasa la regresión (1</tspan></text><text x="227" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">corrida)</tspan></text><rect x="340" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Rechaza la sana (1</tspan></text><text x="447" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">corrida)</tspan></text><rect x="560" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Pasa la regresión (3</tspan></text><text x="667" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">corridas)</tspan></text><rect x="780" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="877" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">Rechaza la sana (3</tspan></text><text x="877" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="877" dy="0">corridas)</tspan></text><rect x="10" y="56" width="104" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">20</tspan></text><rect x="120" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="227" dy="0">41,9 %</tspan></text><rect x="340" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">36,0 %</tspan></text><rect x="560" y="56" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">31,6 %</tspan></text><rect x="780" y="56" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">29,6 %</tspan></text><rect x="10" y="106" width="104" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">50</tspan></text><rect x="120" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="227" dy="0">31,1 %</tspan></text><rect x="340" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">33,7 %</tspan></text><rect x="560" y="106" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">23,7 %</tspan></text><rect x="780" y="106" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">16,8 %</tspan></text><rect x="10" y="156" width="104" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="62" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="62" dy="0">100</tspan></text><rect x="120" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="227" dy="0">28,0 %</tspan></text><rect x="340" y="156" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="181.64" font-