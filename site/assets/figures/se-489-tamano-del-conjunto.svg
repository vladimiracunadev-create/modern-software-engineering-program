pan x="62" dy="0">1 600</tspan></text><rect x="120" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="227" dy="0">0,6 %</tspan></text><rect x="340" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">0,3 %</tspan></text><rect x="560" y="256" width="214" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">0,0 %</tspan></text><rect x="780" y="256" width="194" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="877" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="877" dy="0">0,0 %</tspan></text><rect x="10" y="310" width="970" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Con 100 casos y una corrida, más de una de cada cuatro regresiones de 5 puntos se cuela y más de una de cada cinco versiones sanas</tspan></text><text x="495" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">se rechaza. Repetir tres veces cada caso ayuda, pero la reducción grande viene de más casos. Precisiones, umbral y modelo de azar</tspan></text><text x="495" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">son supuestos del autor.</tspan></text><text x="495" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Simulación con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
