<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 439" width="990" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué comprueba la máquina del flujo ODD y qué solo puede juzgar una persona</title><desc id="d">Tabla con cuatro aspectos del flujo ODD: el orden entre el documento y el primer código se comprueba con el historial, el tamaño de cada commit con la estadística numérica de Git, el estado de las pruebas ejecutándolas en cada commit, y que el documento sea cierto y sirva para retomar el trabajo no lo puede comprobar una máquina.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="439" fill="#ffffff"/><rect x="10" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="192" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="192" dy="0">Aspecto</tspan></text><rect x="380" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="487" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">¿Lo comprueba la</tspan></text><text x="487" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="487" dy="0">máquina?</tspan></text><rect x="600" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Límite</tspan></text><rect x="10" y="56" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="86.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Orden: el documento existe antes del primer</tspan></text><text x="192" y="102.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">código</tspan></text><rect x="380" y="56" width="214" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Sí, con el historial</tspan></text><rect x="600" y="56" width="374" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Un documento vacío cumple la regla</tspan></text><rect x="10" y="132" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="170.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Tamaño: líneas por commit</tspan></text><rect x="380" y="132" width="214" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Sí, con numstat</tspan></text><rect x="600" y="132" width="374" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="162.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Las líneas generadas o movidas cuentan igual que</tspan></text><text x="787" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">las escritas</tspan></text><rect x="10" y="208" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="246.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Estado de las pruebas en cada commit</tspan></text><rect x="380" y="208" width="214" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">Sí, ejecutándolas</tspan></text><rect x="600" y="208" width="374" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Una prueba que no afirma nada pone el commit en</tspan></text><text x="787" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">verde</tspan></text><rect x="10" y="284" width="364" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="192" y="322.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="192" dy="0">Que el documento sea cierto y útil para retomar</tspan></text><rect x="380" y="284" width="214" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="487" y="322.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="487" dy="0">No</tspan></text><rect x="600" y="284" width="374" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="322.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Solo una persona al retomar lo sabe</tspan></text><rect x="10" y="364" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="388.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Comprobar la forma del flujo es barato y ayuda; comprobar su fondo exige que alguien retome el trabajo con solo el documento y</tspan></text><text x="495" y="405.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">diga si pudo.</tspan></text></svg>
