<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ruido de la tasa de fallos mensual (verdadera 12 %): dos equipos idénticos y una mejora real de 12 % a 8 %</title><desc id="d">Líneas con dos porcentajes de meses según el volumen: dos equipos idénticos difieren en 5 puntos o más el 69 por ciento de los meses con 8 despliegues al mes, el 55 con 30 y el 29 con 100; una mejora real del 12 al 8 por ciento se ve en el 42, 61 y 80 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ruido de la tasa de fallos mensual (verdadera 12 %): dos equipos idénticos y una mejora real de 12 % a 8 %</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Equipos idénticos que difieren ≥ 5 puntos</tspan></text><rect x="373.14" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="393.14" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="393.14" dy="0">Mejora real que se ve</tspan></text><line x1="78.62" y1="367" x2="910" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="367" x2="78.62" y2="367" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="371.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="311" x2="910" y2="311" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="311" x2="78.62" y2="311" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="315.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="255" x2="910" y2="255" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="255" x2="78.62" y2="255" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="259.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="199" x2="910" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="199" x2="78.62" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="143" x2="910" y2="143" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="143" x2="78.62" y2="143" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="367" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="367" x2="96.62" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">8</tspan></text><line x1="512.856" y1="87" x2="512.856" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="512.856" y1="367" x2="512.856" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="512.856" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512.856" dy="0">30</tspan></text><line x1="892" y1="87" x2="892" y2="367" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="367" x2="892" y2="372" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="388" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">100</tspan></text><line x1="78.62" y1="367" x2="910" y2="367" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 227)">Meses (%)</text><text x="494.31" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Despliegues al mes (escala logarítmica)</tspan></text><polyline points="96.62,172.867 512.856,213.233 892,285.847" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="172.867" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="161.867" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">69</tspan></text><circle cx="512.856" cy="213.233" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="512.856" y="202.233" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="512.856" dy="0">55</tspan></text><circle cx="892" cy="285.847" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="274.847" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">29</tspan></text><polyline points="96.62,250.193 512.856,196.293 892,142.3" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="244.693" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="239.193" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">42</tspan></text><rect x="507.356" y="190.793" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="512.856" y="185.293" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="512.856" dy="0">61</tspan></text><rect x="886.5" y="136.8" width="11" height="11" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="131.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">80</tspan></text><rect x="10" y="427" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Semiancho del intervalo del 95 %: 8 despliegues: ±22,5 puntos; 30 despliegues: ±11,6 puntos; 100 despliegues: ±6,4 puntos.</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con el volumen de un equipo pequeño, comparar la tasa mensual de dos equipos es comparar ruido: casi siete de cada diez</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">meses difieren cinco puntos sin que nada haya cambiado. La tendencia sobre muchos meses o un intervalo declarado dicen más</tspan></text><text x="470" y="501.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que un ranking mensual. Simulación binomial con semilla fija; el intervalo es el de Wald.</tspan></text><text x="470" y="549.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
