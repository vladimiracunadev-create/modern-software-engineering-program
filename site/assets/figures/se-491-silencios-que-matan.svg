<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 351" width="960" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Silencios mal hechos que mata cada metodología, de 7</title><desc id="d">Gráfico de barras con los siete mutantes del silencio de un curso que mata cada metodología: dos pruebas de TDD matan 6, tres escenarios de BDD matan 6, la tabla de ejemplos de ATDD mata 5, el contrato con 400 estados mata 3 y el modelo ejecutable de SDD mata 7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="351" fill="#ffffff"/><text x="304" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">TDD (dos pruebas)</tspan></text><rect x="314" y="16" width="420" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="742" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="742" dy="0">6</tspan></text><text x="304" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">BDD (tres escenarios)</tspan></text><rect x="314" y="62" width="420" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="742" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="742" dy="0">6</tspan></text><text x="304" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">ATDD (tabla de ejemplos)</tspan></text><rect x="314" y="108" width="350" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="672" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="672" dy="0">5</tspan></text><text x="304" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Contrato (400 estados)</tspan></text><rect x="314" y="154" width="210" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="532" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="532" dy="0">3</tspan></text><text x="304" y="221" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">SDD (modelo ejecutable)</tspan></text><rect x="314" y="200" width="490" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="812" y="221" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="812" dy="0">7</tspan></text><rect x="10" y="248" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="272.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La barra más corta no indica la peor metodología: el contrato comprueba propiedades, no valores concretos, y ese es su papel.</tspan></text><text x="480" y="289.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Indica qué clase de error deja ver y cuál deja pasar.</tspan></text><text x="480" y="337.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
