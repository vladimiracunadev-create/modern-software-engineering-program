<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 418" width="940" height="418" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Volver a la versión anterior de la aplicación tras migrar el esquema (SQLite en memoria, 10 lecturas)</title><desc id="d">Barras apiladas horizontales con las 10 lecturas de la versión anterior según la estrategia de migración: renombrar de golpe da 10 con error; expandir sin doble escritura 5 correctas y 5 vacías; expandir con doble escritura 10 correctas; contraer antes de tiempo, 10 con error.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="418" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Volver a la versión anterior de la aplicación tras migrar el esquema (SQLite en memoria, 10 lecturas)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Lecturas correctas</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Lecturas vacías</tspan></text><rect x="360.82" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="380.82" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="380.82" dy="0">Lecturas con error</tspan></text><line x1="274" y1="77" x2="274" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="237" x2="274" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="77" x2="394.34" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="237" x2="394.34" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">2</tspan></text><line x1="514.68" y1="77" x2="514.68" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="237" x2="514.68" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">4</tspan></text><line x1="635.02" y1="77" x2="635.02" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="237" x2="635.02" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">6</tspan></text><line x1="755.36" y1="77" x2="755.36" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="237" x2="755.36" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">8</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="237" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="237" x2="875.7" y2="242" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10</tspan></text><line x1="274" y1="237" x2="875.7" y2="237" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">renombrar de golpe</tspan></text><text x="264" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">expandir sin doble escritura</tspan></text><text x="264" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">expandir con doble escritura</tspan></text><text x="264" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">contraer antes de tiempo</tspan></text><rect x="274" y="84" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="84" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="84" width="601.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">10</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10</tspan></text><rect x="274" y="124" width="300.85" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="424.425" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="424.425" dy="0">5</tspan></text><rect x="574.85" y="124" width="300.85" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="725.275" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="725.275" dy="0">5</tspan></text><rect x="875.7" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10</tspan></text><rect x="274" y="164" width="601.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">10</tspan></text><rect x="875.7" y="164" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="875.7" y="164" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10</tspan></text><rect x="274" y="204" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="204" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="274" y="204" width="601.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="574.85" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="574.85" dy="0">10</tspan></text><text x="882.7" y="221.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">10</tspan></text><text x="574.85" y="281" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Lecturas</tspan></text><rect x="10" y="295" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="319.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Volver atrás el código no revierte los datos: la reversión funciona solo si el esquema en producción todavía es compatible</tspan></text><text x="470" y="336.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">con la versión anterior. La doble escritura mantiene esa compatibilidad y contraer (borrar lo viejo) la rompe: se hace en</tspan></text><text x="470" y="353.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">un despliegue posterior, cuando ya no hay vuelta atrás prevista. Ejecución real con sqlite3.</tspan></text><text x="470" y="400.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
