<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 725" width="940" height="725" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador del paquete de evidencia frente a 120 mutaciones (12 operadores × 10 paquetes)</title><desc id="d">Barras horizontales con las mutaciones que detecta cada capa de validación por tipo: un validador de forma detecta 30 de las 120, uno que cruza campos 70 y uno con reglas de verosimilitud 100; las 20 mutaciones de juicio no las ve ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="725" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un validador del paquete de evidencia frente a 120 mutaciones (12 operadores × 10 paquetes)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Solo forma</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">+ cruce de campos</tspan></text><rect x="315.58" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="335.58" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="335.58" dy="0">+ verosimilitud</tspan></text><line x1="354" y1="77" x2="354" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="527" x2="354" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="461.564" y1="77" x2="461.564" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="461.564" y1="527" x2="461.564" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="461.564" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.564" dy="0">20</tspan></text><line x1="569.128" y1="77" x2="569.128" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="569.128" y1="527" x2="569.128" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="569.128" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.128" dy="0">40</tspan></text><line x1="676.692" y1="77" x2="676.692" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="676.692" y1="527" x2="676.692" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="676.692" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="676.692" dy="0">60</tspan></text><line x1="784.256" y1="77" x2="784.256" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="784.256" y1="527" x2="784.256" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="784.256" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.256" dy="0">80</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="527" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="527" x2="891.82" y2="532" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="548" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">100</tspan></text><line x1="354" y1="527" x2="891.82" y2="527" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="118" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Forma (campo ausente, commit o digest mal</tspan></text><text x="344" y="135" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">escritos) (30)</tspan></text><text x="344" y="208" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Cruce entre campos (digest o commit distinto,</tspan></text><text x="344" y="225" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">autoaprobación) (40)</tspan></text><text x="344" y="298" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Verosimilitud (0 segundos, entorno ajeno,</tspan></text><text x="344" y="315" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">canario sin tráfico) (30)</tspan></text><text x="344" y="388" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Juicio (ensayo copiado, aprobador sin</tspan></text><text x="344" y="405" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">permisos reales) (20)</tspan></text><text x="344" y="486.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Todas las mutaciones (120)</tspan></text><rect x="354" y="83" width="161.346" height="24" rx="3" fill="#6b7c86"/><text x="522.346" y="99.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="522.346" dy="0">30</tspan></text><rect x="354" y="110" width="161.346" height="24" rx="3" fill="#946512"/><text x="522.346" y="126.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="522.346" dy="0">30</tspan></text><rect x="354" y="137" width="161.346" height="24" rx="3" fill="#087f8c"/><text x="522.346" y="153.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="522.346" dy="0">30</tspan></text><rect x="354" y="173" width="2" height="24" rx="3" fill="#6b7c86"/><text x="363" y="189.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="200" width="215.128" height="24" rx="3" fill="#946512"/><text x="576.128" y="216.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="576.128" dy="0">40</tspan></text><rect x="354" y="227" width="215.128" height="24" rx="3" fill="#087f8c"/><text x="576.128" y="243.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="576.128" dy="0">40</tspan></text><rect x="354" y="263" width="2" height="24" rx="3" fill="#6b7c86"/><text x="363" y="279.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="290" width="2" height="24" rx="3" fill="#946512"/><text x="363" y="306.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="317" width="161.346" height="24" rx="3" fill="#087f8c"/><text x="522.346" y="333.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="522.346" dy="0">30</tspan></text><rect x="354" y="353" width="2" height="24" rx="3" fill="#6b7c86"/><text x="363" y="369.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="380" width="2" height="24" rx="3" fill="#946512"/><text x="363" y="396.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="407" width="2" height="24" rx="3" fill="#087f8c"/><text x="363" y="423.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="443" width="161.346" height="24" rx="3" fill="#6b7c86"/><text x="522.346" y="459.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="522.346" dy="0">30</tspan></text><rect x="354" y="470" width="376.474" height="24" rx="3" fill="#946512"/><text x="737.474" y="486.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="737.474" dy="0">70</tspan></text><rect x="354" y="497" width="537.82" height="24" rx="3" fill="#087f8c"/><text x="898.82" y="513.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><text x="622.91" y="571" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="622.91" dy="0">Mutaciones detectadas</tspan></text><rect x="10" y="585" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="609.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Entre paréntesis, las mutaciones de cada tipo. Los 10 paquetes sin mutar pasan en las tres capas. Cada capa de validación</tspan></text><text x="470" y="626.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">añade lo que la anterior no podía ver y todas dejan pasar la mutación que parece correcta: un ensayo copiado de otra</tspan></text><text x="470" y="643.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">versión tiene forma, cruces y duración verosímiles. Eso solo lo detecta una persona que conozca el sistema o una</tspan></text><text x="470" y="659.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">comprobación contra el sistema real. Mutaciones y reglas escritas por el mismo autor.</tspan></text><text x="470" y="707.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
