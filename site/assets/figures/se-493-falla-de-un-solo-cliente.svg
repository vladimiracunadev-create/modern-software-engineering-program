<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 369" width="940" height="369" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una falla total que afecta a un solo cliente: qué señal la detecta en una hora</title><desc id="d">Mapa de calor con el porcentaje de intentos en que cada señal detecta en una hora una falla total de un solo cliente: el umbral global de 1 por ciento en 5 minutos lo detecta siempre si el cliente aporta 23,4 o 2,3 por ciento del tráfico y en 8,7 por ciento de los intentos si aporta 0,58; una sonda fija en el cliente grande solo ve al cliente grande; una sonda rotativa por los 40 clientes detecta a todos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="369" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una falla total que afecta a un solo cliente: qué señal la detecta en una hora</tspan></text><text x="448.333" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="448.333" dy="0">Tasa global &gt; 1 %</tspan></text><text x="637" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">Sonda fija</tspan></text><text x="825.667" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="825.667" dy="0">Sonda rotativa</tspan></text><text x="344" y="90" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">cliente grande (puesto 1) (23,37 % del</tspan></text><text x="344" y="107" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">tráfico)</tspan></text><text x="344" y="134" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">cliente mediano (puesto 10) (2,34 % del</tspan></text><text x="344" y="151" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">tráfico)</tspan></text><text x="344" y="178" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">cliente pequeño (puesto 40) (0,58 % del</tspan></text><text x="344" y="195" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">tráfico)</tspan></text><rect x="355.5" y="73.5" width="185.667" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="448.333" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="448.333" dy="0">100 %</tspan></text><rect x="544.167" y="73.5" width="185.667" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="637" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">100 %</tspan></text><rect x="732.833" y="73.5" width="185.667" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="825.667" y="98.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="825.667" dy="0">100 %</tspan></text><rect x="355.5" y="117.5" width="185.667" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="448.333" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="448.333" dy="0">100 %</tspan></text><rect x="544.167" y="117.5" width="185.667" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="637" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">0 %</tspan></text><rect x="732.833" y="117.5" width="185.667" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="825.667" y="142.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="825.667" dy="0">100 %</tspan></text><rect x="355.5" y="161.5" width="185.667" height="41" rx="4" fill="#cce7e6" stroke="#ffffff" stroke-width="1"/><text x="448.333" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="448.333" dy="0">9 %</tspan></text><rect x="544.167" y="161.5" width="185.667" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="637" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="637" dy="0">0 %</tspan></text><rect x="732.833" y="161.5" width="185.667" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="825.667" y="186.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="825.667" dy="0">100 %</tspan></text><text x="354" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="354" dy="0">0 %</tspan></text><rect x="384.62" y="218" width="30.5" height="14" fill="#dff1ee"/><rect x="414.62" y="218" width="30.5" height="14" fill="#c0e1e0"/><rect x="444.62" y="218" width="30.5" height="14" fill="#a2d0d2"/><rect x="474.62" y="218" width="30.5" height="14" fill="#83c0c4"/><rect x="504.62" y="218" width="30.5" height="14" fill="#64b0b6"/><rect x="534.62" y="218" width="30.5" height="14" fill="#45a0a8"/><rect x="564.62" y="218" width="30.5" height="14" fill="#278f9a"/><rect x="594.62" y="218" width="30.5" height="14" fill="#087f8c"/><text x="632.62" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="632.62" dy="0">100 %</tspan></text><text x="678.32" y="230" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="678.32" dy="0">más oscuro = mayor (Detección (%))</tspan></text><rect x="10" y="246" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El cliente de la cola larga está 100 % caído y la tasa global apenas se mueve: aporta 0,58 % de las peticiones y el umbral</tspan></text><text x="470" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">exige 1 %. La sonda rotativa lo encuentra, pero tarda hasta 40 minutos. Cuarenta clientes con reparto 1/k son un supuesto</tspan></text><text x="470" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del autor; la forma del reparto real cambia el resultado.</tspan></text><text x="470" y="351.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
