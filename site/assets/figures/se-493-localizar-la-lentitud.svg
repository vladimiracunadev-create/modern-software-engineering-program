<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Localizar el componente lento en una cadena de cuatro servicios con cuatro conjuntos de señales</title><desc id="d">Barras horizontales con las localizaciones correctas de 200 incidentes sintéticos con un servicio lento: mirar solo el borde acierta 49, el percentil 99 absoluto 50, el aumento relativo del percentil 99 frente a la línea base 196 y el mismo método sin ver uno de los cuatro servicios 150.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Localizar el componente lento en una cadena de cuatro servicios con cuatro conjuntos de señales</tspan></text><line x1="324" y1="49" x2="324" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="225" x2="324" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="465.955" y1="49" x2="465.955" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="465.955" y1="225" x2="465.955" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="465.955" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465.955" dy="0">50</tspan></text><line x1="607.91" y1="49" x2="607.91" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="607.91" y1="225" x2="607.91" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="607.91" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607.91" dy="0">100</tspan></text><line x1="749.865" y1="49" x2="749.865" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="749.865" y1="225" x2="749.865" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="749.865" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.865" dy="0">150</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="225" x2="891.82" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">200</tspan></text><line x1="324" y1="225" x2="891.82" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Solo la latencia del borde</tspan></text><text x="314" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">p99 absoluto de cada servicio</tspan></text><text x="314" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Aumento relativo del p99 frente a su</tspan></text><text x="314" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">línea base</tspan></text><text x="314" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Aumento relativo con un servicio sin</tspan></text><text x="314" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">instrumentar</tspan></text><rect x="324" y="55" width="139.116" height="32" rx="3" fill="#087f8c"/><text x="470.116" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="470.116" dy="0">49</tspan></text><rect x="324" y="99" width="141.955" height="32" rx="3" fill="#087f8c"/><text x="472.955" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="472.955" dy="0">50</tspan></text><rect x="324" y="143" width="556.464" height="32" rx="3" fill="#087f8c"/><text x="887.464" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="887.464" dy="0">196</tspan></text><rect x="324" y="187" width="425.865" height="32" rx="3" fill="#087f8c"/><text x="756.865" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="756.865" dy="0">150</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="225" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="896.82" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="896.82" dy="0">200</tspan></text><text x="607.91" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">Localizaciones correctas (de 200)</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cada servicio informa su duración inclusiva (la suya más la de lo que llama). La línea base de 400 peticiones sanas y los</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">factores de lentitud de 3 a 8 son supuestos del autor. Un punto ciego no apaga la alarma: la desplaza al servicio vecino, y</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">por eso un hueco de instrumentación se parece a una conclusión.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
