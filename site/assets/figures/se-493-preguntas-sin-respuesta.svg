<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sesenta preguntas hechas después de un incidente: qué diseño de señales puede responderlas</title><desc id="d">Barras horizontales con las preguntas respondidas de 60: las métricas con tres dimensiones previstas responden 6 con 45 series; los eventos anchos con todos los campos responden 60 con unos 268 megabytes al día; las métricas con todas las combinaciones responden las 60 pero exigirían 1 296 000 series.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sesenta preguntas hechas después de un incidente: qué diseño de señales puede responderlas</tspan></text><line x1="354" y1="49" x2="354" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="181" x2="354" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="535.96" y1="49" x2="535.96" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="535.96" y1="181" x2="535.96" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="535.96" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="535.96" dy="0">20</tspan></text><line x1="717.92" y1="49" x2="717.92" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="717.92" y1="181" x2="717.92" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="717.92" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="717.92" dy="0">40</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="181" x2="899.88" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">60</tspan></text><line x1="354" y1="181" x2="899.88" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Métricas con 3 dimensiones previstas (45</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">series)</tspan></text><text x="344" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Eventos anchos con todos los campos (268 MB</tspan></text><text x="344" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">al día)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Métricas con todas las combinaciones (1 296</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">000 series)</tspan></text><rect x="354" y="55" width="54.588" height="32" rx="3" fill="#087f8c"/><text x="415.588" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="415.588" dy="0">6</tspan></text><rect x="354" y="99" width="545.88" height="32" rx="3" fill="#087f8c"/><text x="906.88" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">60</tspan></text><rect x="354" y="143" width="545.88" height="32" rx="3" fill="#087f8c"/><text x="906.88" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">60</tspan></text><text x="626.94" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="626.94" dy="0">Preguntas respondidas (de 60)</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Las 60 preguntas son combinaciones de 1 a 3 de las 8 dimensiones del servicio (endpoint, estado, región, curso, cliente,</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">versión, dispositivo, plan); las dimensiones previstas son endpoint, estado y región. Los eventos conservan el detalle a</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">cambio de volumen y de privacidad: cada campo extra es un dato que alguien puede leer.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
