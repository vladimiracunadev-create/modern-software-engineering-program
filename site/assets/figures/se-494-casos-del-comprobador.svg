<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 505" width="960" height="505" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un comprobador de reglas del repositorio: dónde acierta y dónde se equivoca</title><desc id="d">Tabla con siete de diecisiete casos de un comprobador determinista: detecta un literal con la ruta temporal y un except sin tipo; se le escapan la ruta armada por concatenación, el token partido en dos cadenas, la llamada a eval por un nombre armado y la prueba vacía; y da una falsa alarma ante un comentario que menciona la ruta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="505" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Caso</tspan></text><rect x="480" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">¿Infringe la regla?</tspan></text><rect x="710" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Resultado</tspan></text><rect x="10" y="56" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Ruta temporal fija en un literal</tspan></text><rect x="480" y="56" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">sí</tspan></text><rect x="710" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">detectado</tspan></text><rect x="10" y="106" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Ruta temporal fija armada por concatenación</tspan></text><rect x="480" y="106" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">sí</tspan></text><rect x="710" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">se escapa</tspan></text><rect x="10" y="156" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Ruta temporal fija citada en un comentario</tspan></text><rect x="480" y="156" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">no</tspan></text><rect x="710" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">falsa alarma</tspan></text><rect x="10" y="206" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Token partido en dos cadenas</tspan></text><rect x="480" y="206" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">sí</tspan></text><rect x="710" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">se escapa</tspan></text><rect x="10" y="256" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">eval llamado por un nombre armado</tspan></text><rect x="480" y="256" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">sí</tspan></text><rect x="710" y="256" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">se escapa</tspan></text><rect x="10" y="306" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Prueba vacía junto al cambio</tspan></text><rect x="480" y="306" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">sí</tspan></text><rect x="710" y="306" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">se escapa</tspan></text><rect x="10" y="356" width="464" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="381.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">except sin tipo</tspan></text><rect x="480" y="356" width="224" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">sí</tspan></text><rect x="710" y="356" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">detectado</tspan></text><rect x="10" y="410" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Con 17 casos: 9 aciertos, 1 falsa alarma y 4 omisiones (precisión 90 %, cobertura 69 %). Una regla mecánica es barata y exacta</tspan></text><text x="480" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">en lo que escribe, y ciega a lo que se escribe de otra forma.</tspan></text><text x="480" y="491.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
