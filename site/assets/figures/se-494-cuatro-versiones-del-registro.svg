<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 533" width="940" height="533" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma línea de registro en cuatro versiones del código: extracción con una expresión regular y con campos por nombre</title><desc id="d">Barras horizontales con el porcentaje de líneas extraídas: una expresión regular escrita para la versión 1 extrae el 100 por ciento de las líneas de esa versión y 0 de las tres siguientes; leer campos por nombre de un registro JSON se mantiene en 100 por ciento en las versiones 1 a 3 y solo falla en la 4, donde se renombró un campo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="533" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La misma línea de registro en cuatro versiones del código: extracción con una expresión regular y con campos</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">por nombre</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Regex escrita para la v1</tspan></text><rect x="244.96" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="264.96" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Campos del JSON por nombre</tspan></text><line x1="354" y1="96" x2="354" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="352" x2="354" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="461.564" y1="96" x2="461.564" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="461.564" y1="352" x2="461.564" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="461.564" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.564" dy="0">20</tspan></text><line x1="569.128" y1="96" x2="569.128" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="569.128" y1="352" x2="569.128" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="569.128" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.128" dy="0">40</tspan></text><line x1="676.692" y1="96" x2="676.692" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="676.692" y1="352" x2="676.692" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="676.692" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="676.692" dy="0">60</tspan></text><line x1="784.256" y1="96" x2="784.256" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="784.256" y1="352" x2="784.256" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="784.256" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.256" dy="0">80</tspan></text><line x1="891.82" y1="96" x2="891.82" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="352" x2="891.82" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">100</tspan></text><line x1="354" y1="352" x2="891.82" y2="352" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="124" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">v1: «Entrega 123 aceptada para curso 45 en 83</tspan></text><text x="344" y="141" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">ms»</tspan></text><text x="344" y="188" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">v2: «Entrega aceptada: id=123 curso=45</tspan></text><text x="344" y="205" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">duración=83ms»</tspan></text><text x="344" y="252" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">v3: «[api] entrega id=123 (curso 45) OK</tspan></text><text x="344" y="269" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">tiempo=83 milisegundos»</tspan></text><text x="344" y="316" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">v4: «Submission 123 accepted for course 45 in</tspan></text><text x="344" y="333" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">83 ms»</tspan></text><rect x="354" y="102" width="537.82" height="24.5" rx="3" fill="#c0432f"/><text x="898.82" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="354" y="129.5" width="537.82" height="24.5" rx="3" fill="#087f8c"/><text x="898.82" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="354" y="166" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="193.5" width="537.82" height="24.5" rx="3" fill="#087f8c"/><text x="898.82" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="354" y="230" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="257.5" width="537.82" height="24.5" rx="3" fill="#087f8c"/><text x="898.82" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="898.82" dy="0">100</tspan></text><rect x="354" y="294" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="363" y="310.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="321.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="338.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="622.91" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="622.91" dy="0">Líneas extraídas (%)</tspan></text><rect x="10" y="410" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada versión se evaluó con 1 500 líneas. El registro estructurado mueve la ruptura del texto al contrato: sobrevive a un</tspan></text><text x="470" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cambio de redacción y no a un campo renombrado. Por eso el nombre de un campo es una interfaz que se versiona y se prueba,</tspan></text><text x="470" y="468.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no un detalle de implementación.</tspan></text><text x="470" y="515.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
