<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 306" width="940" height="306" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Muestreo de registros: errores que conserva cada política</title><desc id="d">Barras horizontales con los errores conservados de 4 039: el muestreo uniforme del 10 por ciento deja 412, es decir pierde 9 de cada 10, y conservar todos los errores más el 10 por ciento del resto deja los 4 039.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="306" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Muestreo de registros: errores que conserva cada política</tspan></text><line x1="294" y1="49" x2="294" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="125" x2="294" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="410.34" y1="49" x2="410.34" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="410.34" y1="125" x2="410.34" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="410.34" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410.34" dy="0">1 000</tspan></text><line x1="526.68" y1="49" x2="526.68" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="526.68" y1="125" x2="526.68" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="526.68" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="526.68" dy="0">2 000</tspan></text><line x1="643.02" y1="49" x2="643.02" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="643.02" y1="125" x2="643.02" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="643.02" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="643.02" dy="0">3 000</tspan></text><line x1="759.36" y1="49" x2="759.36" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="759.36" y1="125" x2="759.36" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="759.36" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.36" dy="0">4 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="125" x2="875.7" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5 000</tspan></text><line x1="294" y1="125" x2="875.7" y2="125" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Muestreo uniforme del 10 %</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Todos los errores y 10 % del resto</tspan></text><rect x="294" y="55" width="47.9321" height="26" rx="3" fill="#087f8c"/><text x="348.932" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="348.932" dy="0">412</tspan></text><rect x="294" y="93" width="469.897" height="26" rx="3" fill="#087f8c"/><text x="770.897" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="770.897" dy="0">4 039</tspan></text><line x1="763.897" y1="49" x2="763.897" y2="125" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="768.897" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="768.897" dy="0">todos los errores</tspan></text><text x="584.85" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Errores conservados (de 4 039)</tspan></text><rect x="10" y="183" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La redacción por patrones solo protege los formatos que alguien previó: cada variante escrita por una persona (mayúsculas,</tspan></text><text x="470" y="224.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">espacios, un «arroba» escrito) es un dato personal que llega al almacén. Los 200 000 registros y las variantes son</tspan></text><text x="470" y="241.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sintéticos; el 2 % de errores es un supuesto del autor.</tspan></text><text x="470" y="288.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
