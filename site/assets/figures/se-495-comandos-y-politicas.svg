<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 505" width="960" height="505" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Treinta comandos frente a dos políticas: prefijos permitidos y análisis del comando</title><desc id="d">Tabla con siete de treinta comandos: la lista de prefijos permite un encadenado con borrado, la lectura de un archivo de secretos, una ruta fuera de la raíz, una sustitución de comandos y un encadenado con borrado tras las pruebas, y el análisis los deniega; el análisis también deniega un comando benigno con una tubería, que es su costo; ambos deniegan el empuje forzado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="505" fill="#ffffff"/><rect x="10" y="12" width="484" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="252" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="252" dy="0">Comando</tspan></text><rect x="500" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Lista de prefijos</tspan></text><rect x="710" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Análisis del comando</tspan></text><rect x="10" y="56" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">git status; rm -rf src</tspan></text><rect x="500" y="56" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">permite</tspan></text><rect x="710" y="56" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">deniega</tspan></text><rect x="10" y="106" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">cat .env</tspan></text><rect x="500" y="106" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">permite</tspan></text><rect x="710" y="106" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">deniega</tspan></text><rect x="10" y="156" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">cat ../../etc/passwd</tspan></text><rect x="500" y="156" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">permite</tspan></text><rect x="710" y="156" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">deniega</tspan></text><rect x="10" y="206" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">ls $(whoami)</tspan></text><rect x="500" y="206" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">permite</tspan></text><rect x="710" y="206" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">deniega</tspan></text><rect x="10" y="256" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">python -m unittest &amp;&amp; rm -rf .</tspan></text><rect x="500" y="256" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">permite</tspan></text><rect x="710" y="256" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">deniega</tspan></text><rect x="10" y="306" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">git log --oneline | head -5 (benigno)</tspan></text><rect x="500" y="306" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">permite</tspan></text><rect x="710" y="306" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">deniega</tspan></text><rect x="10" y="356" width="484" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="252" y="381.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="252" dy="0">git push --force</tspan></text><rect x="500" y="356" width="204" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">deniega</tspan></text><rect x="710" y="356" width="234" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">deniega</tspan></text><rect x="10" y="410" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">De 18 comandos inseguros, los prefijos dejan pasar 13 y el análisis, 0. De 12 seguros, los prefijos deniegan 0 y el análisis,</tspan></text><text x="480" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">1. El análisis compra seguridad con una falsa denegación.</tspan></text><text x="480" y="491.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
