<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 484" width="940" height="484" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Treinta comandos frente a dos políticas: prefijos permitidos y análisis del comando</title><desc id="d">Barras agrupadas con los errores de dos políticas sobre treinta comandos: de 18 comandos inseguros, la lista de prefijos permite 13 y el análisis del comando 0; de 12 comandos seguros, los prefijos deniegan 0 y el análisis 1, un comando benigno con una tubería; ambos deniegan el empuje forzado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="484" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Treinta comandos frente a dos políticas: prefijos permitidos y análisis del comando</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Lista de prefijos</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Análisis del comando</tspan></text><line x1="71.08" y1="325" x2="920" y2="325" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="325" x2="71.08" y2="325" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="329.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="267.5" x2="920" y2="267.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="267.5" x2="71.08" y2="267.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="272" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">4</tspan></text><line x1="71.08" y1="210" x2="920" y2="210" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="210" x2="71.08" y2="210" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="214.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">8</tspan></text><line x1="71.08" y1="152.5" x2="920" y2="152.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="152.5" x2="71.08" y2="152.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="157" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">12</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">16</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="325" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="210" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 210)">Comandos</text><rect x="113.526" y="138.125" width="167.784" height="186.875" rx="3" fill="#c0432f"/><text x="197.418" y="132.125" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.418" dy="0">13</tspan></text><rect x="285.31" y="323" width="167.784" height="2" rx="3" fill="#087f8c"/><text x="369.202" y="317" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="369.202" dy="0">0</tspan></text><text x="283.31" y="346" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">Inseguros permitidos (de 18)</tspan></text><rect x="537.986" y="323" width="167.784" height="2" rx="3" fill="#c0432f"/><text x="621.878" y="317" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="621.878" dy="0">0</tspan></text><rect x="709.77" y="310.625" width="167.784" height="14.375" rx="3" fill="#087f8c"/><text x="793.662" y="304.625" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="793.662" dy="0">1</tspan></text><text x="707.77" y="346" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Seguros denegados (de 12)</tspan></text><rect x="10" y="377" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">De 18 comandos inseguros, los prefijos dejan pasar 13 y el análisis, 0. De 12 seguros, los prefijos deniegan 0 y el</tspan></text><text x="470" y="418.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">análisis, 1. El análisis compra seguridad con una falsa denegación.</tspan></text><text x="470" y="466.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
