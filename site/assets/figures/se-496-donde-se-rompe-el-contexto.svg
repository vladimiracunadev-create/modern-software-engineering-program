<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Propagación del contexto en una petición de seis saltos: dónde se pierde</title><desc id="d">Barras horizontales con el porcentaje de veces que cada frontera pierde el contexto: el salto HTTP síncrono 1 por ciento, la cola de mensajes 15, el grupo de hilos o tarea asíncrona 20 y el reintento automático 10; con esas pérdidas solo 59,4 % de las peticiones conservan una traza completa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Propagación del contexto en una petición de seis saltos: dónde se pierde</tspan></text><line x1="284" y1="49" x2="284" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="201" x2="284" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="437.97" y1="49" x2="437.97" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="437.97" y1="201" x2="437.97" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="437.97" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437.97" dy="0">5</tspan></text><line x1="591.94" y1="49" x2="591.94" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="591.94" y1="201" x2="591.94" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="591.94" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="591.94" dy="0">10</tspan></text><line x1="745.91" y1="49" x2="745.91" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="745.91" y1="201" x2="745.91" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="745.91" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="745.91" dy="0">15</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="201" x2="899.88" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">20</tspan></text><line x1="284" y1="201" x2="899.88" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Salto HTTP síncrono</tspan></text><text x="274" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Cola de mensajes</tspan></text><text x="274" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Grupo de hilos o tarea asíncrona</tspan></text><text x="274" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="274" dy="0">Reintento automático</tspan></text><rect x="284" y="55" width="30.794" height="26" rx="3" fill="#c0432f"/><text x="321.794" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="321.794" dy="0">1</tspan></text><rect x="284" y="93" width="461.91" height="26" rx="3" fill="#c0432f"/><text x="752.91" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="752.91" dy="0">15</tspan></text><rect x="284" y="131" width="615.88" height="26" rx="3" fill="#c0432f"/><text x="906.88" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">20</tspan></text><rect x="284" y="169" width="307.94" height="26" rx="3" fill="#c0432f"/><text x="598.94" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="598.94" dy="0">10</tspan></text><text x="591.94" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="591.94" dy="0">Veces que se pierde el contexto (%)</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las probabilidades por frontera son supuestos del autor, pero el patrón es de diseño: el contexto se pierde donde cambia el</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">medio de transporte o la unidad de ejecución. El formato W3C traceparent (versión, identificador de traza de 32 hex,</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">identificador de span de 16 hex, banderas) se valida con una expresión regular estricta en minúsculas.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
