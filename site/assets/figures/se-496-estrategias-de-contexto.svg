7 4"/><rect x="83.58" y="201.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="198.283" y="201.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="427.689" y="141.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="886.5" y="81.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><polyline points="89.08,147 203.783,147 433.189,117 892,87" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="89.08,140.675 95.13,151.95 83.03,151.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="203.783,140.675 209.833,151.95 197.733,151.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="433.189,110.675 439.239,121.95 427.139,121.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="892,80.675 898.05,91.95 885.95,91.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="10" y="447" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Modelo determinista de 120 turnos de 400 fichas con 10 hechos en puntos fijos. Describe el mecanismo de pérdida de cada</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estrategia con supuestos explícitos; no mide la compactación de ningún producto.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
