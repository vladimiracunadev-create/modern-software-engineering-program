<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 379" width="960" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco acciones destructivas contra 15 archivos: qué sobrevive y qué se recupera</title><desc id="d">Tabla con cuatro configuraciones tras cinco acciones destructivas sobre 15 archivos, 13 en el proyecto y 2 fuera: sin protección sobreviven 0 y se recuperan 0; con solo confinamiento sobreviven 2 y se recuperan 2; con confinamiento y copia previa sobreviven 2 y se recuperan los 15; sin confinar y con Git sobreviven 0 y se recuperan 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="379" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Configuración</tspan></text><rect x="340" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Intactos tras el agente</tspan></text><rect x="560" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Intactos tras recuperar</tspan></text><rect x="780" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Acciones</tspan></text><text x="862" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">bloqueadas</tspan></text><rect x="10" y="56" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Sin protección</tspan></text><rect x="340" y="56" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">0 de 15</tspan></text><rect x="560" y="56" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">0 de 15</tspan></text><rect x="780" y="56" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="112" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Solo confinamiento</tspan></text><rect x="340" y="112" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">2 de 15</tspan></text><rect x="560" y="112" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">2 de 15</tspan></text><rect x="780" y="112" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">2</tspan></text><rect x="10" y="168" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Confinamiento + copia previa</tspan></text><rect x="340" y="168" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">2 de 15</tspan></text><rect x="560" y="168" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">15 de 15</tspan></text><rect x="780" y="168" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">2</tspan></text><rect x="10" y="224" width="324" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Sin confinar + Git</tspan></text><rect x="340" y="224" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">0 de 15</tspan></text><rect x="560" y="224" width="214" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">10 de 15</tspan></text><rect x="780" y="224" width="164" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">0</tspan></text><rect x="10" y="284" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">El confinamiento impide el daño fuera de la raíz y no deshace el de dentro; la copia deshace lo de dentro y no impide nada.</tspan></text><text x="480" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Git recupera 10 de 15: los archivos no versionados y los de fuera no vuelven.</tspan></text><text x="480" y="365.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
