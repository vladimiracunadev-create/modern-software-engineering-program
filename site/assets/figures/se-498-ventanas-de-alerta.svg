<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Umbral de 1 % de errores con ventanas de 1 a 60 minutos: minutos hasta alertar</title><desc id="d">Líneas con los minutos hasta alertar según la ventana: crecen con la ventana cuando el error es pequeño (con 2 por ciento pasan de 1 a 28 minutos) y quedan en 1 minuto con la caída total; los falsos positivos al día, que van entre paréntesis en cada ventana, bajan de 6,85 con un minuto a 0,02 con 5 y a 0 con 15 y 60.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Umbral de 1 % de errores con ventanas de 1 a 60 minutos: minutos hasta alertar</tspan></text><circle cx="22" cy="51" r="6" fill="#946512" stroke="#946512" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">2 % de errores</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">10 % de errores</tspan></text><polygon points="336.66,44.1 343.26,56.4 330.06,56.4" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="350.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="350.66" dy="0">Caída total</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="387" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,1</tspan></text><line x1="78.62" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="187" x2="78.62" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">10</tspan></text><line x1="78.62" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="87" x2="78.62" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="87" x2="78.62" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="87" x2="96.62" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="387" x2="96.62" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1 (6,85)</tspan></text><line x1="409.274" y1="87" x2="409.274" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="409.274" y1="387" x2="409.274" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="409.274" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409.274" dy="0">5 (0,02)</tspan></text><line x1="622.694" y1="87" x2="622.694" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="622.694" y1="387" x2="622.694" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="622.694" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622.694" dy="0">15 (0,00)</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">60 (0,00)</tspan></text><line x1="78.62" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Minutos hasta alertar (escala logarítmica)</text><text x="494.31" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Ventana (minutos); entre paréntesis, falsos positivos por día (escala logarítmica)</tspan></text><polyline points="96.62,287 409.274,239.288 622.694,196.691 892,142.284" fill="none" stroke="#946512" stroke-width="2.4"/><circle cx="96.62" cy="287" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="96.62" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">1</tspan></text><circle cx="409.274" cy="239.288" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="409.274" y="228.288" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="409.274" dy="0">3</tspan></text><circle cx="622.694" cy="196.691" r="5.5" fill="#946512" stroke="#946512" stroke-width="2"/><text x="622.694" y="185.691" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="622.694" dy="0">8</tspan></text><circle cx="892" cy="142.284" r="5.5" fill="#94651