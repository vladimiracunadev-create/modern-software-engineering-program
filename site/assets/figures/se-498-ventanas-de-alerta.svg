e-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">1</tspan></text><polygon points="409.274,280.675 415.324,291.95 403.224,291.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="409.274" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="409.274" dy="0">1</tspan></text><polygon points="622.694,280.675 628.744,291.95 616.644,291.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="622.694" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="622.694" dy="0">1</tspan></text><polygon points="892,280.675 898.05,291.95 885.95,291.95" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="276" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una ventana larga suprime el ruido y retrasa lo moderado, y a una caída total no la retrasa casi nada: por eso se combinan</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ventanas largas para lo lento y cortas para lo grave. La ventana incluye la historia sana previa al incidente; 120 días de</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ruido con 100 peticiones por minuto es un supuesto del autor.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
