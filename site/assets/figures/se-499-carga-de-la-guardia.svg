<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Carga de una guardia semanal según el tamaño del equipo (1,5 páginas al día, 35 % de noche)</title><desc id="d">Barras con la carga anual de la persona más cargada según el tamaño del equipo: con dos personas hace 27 semanas de guardia y tiene 77 noches interrumpidas; con cuatro, 14,4 semanas y 42 noches; con ocho, 8 semanas y 23 noches.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Carga de una guardia semanal según el tamaño del equipo (1,5 páginas al día, 35 % de noche)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Semanas de guardia de la persona más cargada</tspan></text><rect x="395.76" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="415.76" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="415.76" dy="0">Noches interrumpidas</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="305" x2="71.08" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="235" x2="71.08" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="165" x2="71.08" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Semanas o noches al año</text><rect x="88.0584" y="280.5" width="65.9136" height="94.5" rx="3" fill="#946512"/><text x="121.015" y="274.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="121.015" dy="0">27,0</tspan></text><rect x="157.972" y="105.5" width="65.9136" height="269.5" rx="3" fill="#c0432f"/><text x="190.929" y="99.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="190.929" dy="0">77,0</tspan></text><text x="155.972" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155.972" dy="0">2 personas</tspan></text><rect x="257.842" y="309.55" width="65.9136" height="65.45" rx="3" fill="#946512"/><text x="290.799" y="303.55" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="290.799" dy="0">18,7</tspan></text><rect x="327.756" y="189.5" width="65.9136" height="185.5" rx="3" fill="#c0432f"/><text x="360.713" y="183.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="360.713" dy="0">53,0</tspan></text><text x="325.756" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="325.756" dy="0">3 personas</tspan></text><rect x="427.626" y="324.6" width="65.9136" height="50.4" rx="3" fill="#946512"/><text x="460.583" y="318.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="460.583" dy="0">14,4</tspan></text><rect x="497.54" y="228" width="65.9136" height="147" rx="3" fill="#c0432f"/><text x="530.497" y="222" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530.497" dy="0">42,0</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">4 personas</tspan></text><rect x="597.41" y="339.3" width="65.9136" height="35.7" rx="3" fill="#946512"/><text x="630.367" y="333.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="630.367" dy="0">10,2</tspan></text><rect x="667.324" y="273.5" width="65.9136" height="101.5" rx="3" fill="#c0432f"/><text x="700.281" y="267.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.281" dy="0">29,0</tspan></text><text x="665.324" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="665.324" dy="0">6 personas</tspan></text><rect x="767.194" y="347" width="65.9136" height="28" rx="3" fill="#946512"/><text x="800.151" y="341" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="800.151" dy="0">8,0</tspan></text><rect x="837.108" y="294.5" width="65.9136" height="80.5" rx="3" fill="#c0432f"/><text x="870.065" y="288.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="870.065" dy="0">23,0</tspan></text><text x="835.108" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.108" dy="0">8 personas</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las cifras son de la persona más cargada tras las ausencias, que es la que se agota primero. Con dos personas una ausencia</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">deja a la otra en guardia permanente. 1,5 páginas al día y 35 % de noche son supuestos del autor; cada página nocturna</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cuesta más que su duración porque rompe el sueño.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
