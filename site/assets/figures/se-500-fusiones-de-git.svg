<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 387" width="960" height="387" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos agentes en ramas de Git reales: lo que dice la fusión y lo que dicen las pruebas</title><desc id="d">Tabla con cuatro escenarios de dos ramas de Git creadas en directorios temporales: archivos distintos y zonas lejanas del mismo archivo se fusionan limpios y las pruebas pasan; editar las mismas líneas produce un conflicto; renombrar una función en una rama y usarla desde otra se fusiona limpio y las pruebas fallan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="387" fill="#ffffff"/><rect x="10" y="12" width="454" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="237" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="237" dy="0">Escenario</tspan></text><rect x="470" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Fusión de Git</tspan></text><rect x="690" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="817" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="817" dy="0">Pruebas tras fusionar</tspan></text><rect x="10" y="56" width="454" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">Archivos distintos</tspan></text><rect x="470" y="56" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">limpia</tspan></text><rect x="690" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">pasan</tspan></text><rect x="10" y="114" width="454" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">Mismo archivo, zonas lejanas</tspan></text><rect x="470" y="114" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">limpia</tspan></text><rect x="690" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">pasan</tspan></text><rect x="10" y="172" width="454" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">Mismas líneas</tspan></text><rect x="470" y="172" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">conflicto</tspan></text><rect x="690" y="172" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">no aplica</tspan></text><rect x="10" y="230" width="454" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="237" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237" dy="0">Renombrar una función y usarla por otro lado</tspan></text><rect x="470" y="230" width="214" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">limpia</tspan></text><rect x="690" y="230" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">FALLAN</tspan></text><rect x="10" y="292" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Que Git fusione sin conflicto no significa que el resultado funcione. El conflicto semántico solo lo ve una verificación</tspan></text><text x="480" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">posterior a la fusión, y el conflicto textual es el caso fácil.</tspan></text><text x="480" y="373.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
