<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 329" width="960" height="329" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Declarar mejor a un harness idéntico: la regla «tiene más aciertos» frente a una prueba pareada</title><desc id="d">Tabla con la proporción de veces que se declara mejor a un harness idéntico a la línea base: con 50 tareas la regla de más aciertos lo declara mejor el 45,7 por ciento y la prueba pareada el 2,1; con 200 tareas 48,7 y 3,0; con 800 tareas 47,1 y 3,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="329" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Tareas</tspan></text><rect x="210" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Regla «tiene más aciertos»</tspan></text><rect x="590" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="767" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="767" dy="0">Prueba pareada</tspan></text><rect x="10" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">50</tspan></text><rect x="210" y="56" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">45,7 %</tspan></text><rect x="590" y="56" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">2,1 %</tspan></text><rect x="10" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">200</tspan></text><rect x="210" y="114" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">48,7 %</tspan></text><rect x="590" y="114" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">3,0 %</tspan></text><rect x="10" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">800</tspan></text><rect x="210" y="172" width="374" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">47,1 %</tspan></text><rect x="590" y="172" width="354" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="767" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="767" dy="0">3,0 %</tspan></text><rect x="10" y="234" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="258.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Comparar contra un harness idéntico muestra el ruido: la regla ingenua da por mejor la mitad de las veces algo que no cambió.</tspan></text><text x="480" y="275.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">La prueba pareada mantiene el error cerca del 3 %, a costa de la potencia.</tspan></text><text x="480" y="315.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación con semilla fija (parámetros del autor) ejecutada en Windows 11 con CPython 3.12.9; no mide ningún modelo real.</tspan></text></svg>
