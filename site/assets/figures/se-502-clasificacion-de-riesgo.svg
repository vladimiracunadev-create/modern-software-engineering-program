<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 555" width="960" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Clasificación de riesgo por reglas sobre rutas, tamaño y dependencias: ocho de doce cambios</title><desc id="d">Tabla con ocho de doce cambios clasificados por reglas deterministas: la documentación y un cambio de código con su prueba y 40 líneas son de riesgo bajo; el código sin prueba, el cambio de 400 líneas y el archivo de dependencias son de riesgo medio; el workflow de integración continua, la autenticación y la migración son de riesgo alto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="555" fill="#ffffff"/><rect x="10" y="12" width="644" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="332" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="332" dy="0">Cambio</tspan></text><rect x="660" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="802" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="802" dy="0">Nivel de riesgo</tspan></text><rect x="10" y="56" width="644" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">docs/guia.md</tspan></text><rect x="660" y="56" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">bajo</tspan></text><rect x="10" y="106" width="644" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="131.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">src/a.py con su prueba (40 líneas)</tspan></text><rect x="660" y="106" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="131.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">bajo</tspan></text><rect x="10" y="156" width="644" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="181.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">src/a.py sin prueba</tspan></text><rect x="660" y="156" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="181.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">medio</tspan></text><rect x="10" y="206" width="644" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">src/a.py con prueba, 400 líneas</tspan></text><rect x="660" y="206" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">medio</tspan></text><rect x="10" y="256" width="644" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="281.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">requirements.txt (dependencias)</tspan></text><rect x="660" y="256" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">medio</tspan></text><rect x="10" y="306" width="644" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="331.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">.github/workflows/ci.yml</tspan></text><rect x="660" y="306" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="331.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">alto</tspan></text><rect x="10" y="356" width="644" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="381.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">auth/login.py con su prueba</tspan></text><rect x="660" y="356" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="381.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">alto</tspan></text><rect x="10" y="406" width="644" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="332" y="431.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="332" dy="0">migrations/0004.sql</tspan></text><rect x="660" y="406" width="284" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="802" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="802" dy="0">alto</tspan></text><rect x="10" y="460" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="484.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Una regla de rutas es barata, auditable y fácil de eludir: un cambio peligroso en una carpeta que no aparece en la lista es de</tspan></text><text x="480" y="501.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">riesgo bajo. Se complementa con revisión humana de las reglas.</tspan></text><text x="480" y="541.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
