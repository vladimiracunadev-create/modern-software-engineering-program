<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 475" width="940" height="475" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuarenta copias dañadas de una base de 20 000 filas: daños que detecta cada comprobación</title><desc id="d">Barras horizontales con los daños detectados de 40 copias de una base SQLite alterada en ocho posiciones: el éxito del trabajo de copia, el tamaño y el conteo de filas detectan 0; la verificación de integridad de SQLite detecta 20; la huella sha256 y leer y comprobar todas las filas detectan 40.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="475" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuarenta copias dañadas de una base de 20 000 filas: daños que detecta cada comprobación</tspan></text><line x1="324" y1="49" x2="324" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="277" x2="324" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="467.97" y1="49" x2="467.97" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="467.97" y1="277" x2="467.97" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="467.97" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467.97" dy="0">10</tspan></text><line x1="611.94" y1="49" x2="611.94" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="611.94" y1="277" x2="611.94" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="611.94" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="611.94" dy="0">20</tspan></text><line x1="755.91" y1="49" x2="755.91" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="755.91" y1="277" x2="755.91" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="755.91" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.91" dy="0">30</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="277" x2="899.88" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">40</tspan></text><line x1="324" y1="277" x2="899.88" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">El trabajo de copia terminó sin error</tspan></text><text x="314" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">El tamaño del archivo coincide</tspan></text><text x="314" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Huella sha256 distinta de la registrada</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">PRAGMA integrity_check</tspan></text><text x="314" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">COUNT(*) de la tabla</tspan></text><text x="314" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Leer y comprobar todas las filas</tspan></text><rect x="324" y="55" width="2" height="26" rx="3" fill="#087f8c"/><text x="333" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="93" width="2" height="26" rx="3" fill="#087f8c"/><text x="333" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="131" width="575.88" height="26" rx="3" fill="#087f8c"/><text x="906.88" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">40</tspan></text><rect x="324" y="169" width="287.94" height="26" rx="3" fill="#087f8c"/><text x="618.94" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="618.94" dy="0">20</tspan></text><rect x="324" y="207" width="2" height="26" rx="3" fill="#087f8c"/><text x="333" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="245" width="575.88" height="26" rx="3" fill="#087f8c"/><text x="906.88" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">40</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="277" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="904.88" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="904.88" dy="0">40</tspan></text><text x="611.94" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="611.94" dy="0">Daños detectados (de 40)</tspan></text><rect x="10" y="335" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La copia buena se creó con la API de copia en línea de SQLite y restauró las 20 000 filas con integrity_check «ok». Una</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">copia que nadie restaura no es una copia: la huella detecta el cambio, y solo restaurar y consultar prueba que la base</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">funciona. Medición real en Windows y Ubuntu con resultado igual; la lectura completa depende de que el daño invalide el</tspan></text><text x="470" y="409.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">texto.</tspan></text><text x="470" y="457.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
