<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 573" width="940" height="573" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Datos perdidos al fallar en un instante aleatorio según la estrategia de copia y réplica frente a un RPO de 5 minutos</title><desc id="d">Intervalos en escala logarítmica con la pérdida de datos mediana, el percentil 99 y la máxima según la estrategia: con copia diaria la mediana es 719,7 minutos y la máxima 1 440; con copia cada hora la mediana es 30 y la máxima 60; la réplica asíncrona pierde segundos y es la única que cumple el RPO de 5 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="573" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Datos perdidos al fallar en un instante aleatorio según la estrategia de copia y réplica frente a un RPO de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">5 minutos</tspan></text><rect x="16" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mediana</tspan></text><polygon points="122.78,63.1 129.38,75.4 116.18,75.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">p99</tspan></text><polygon points="193.4,62.5 200.9,70 193.4,77.5 185.9,70" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="207.4" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="207.4" dy="0">máx</tspan></text><line x1="344" y1="96" x2="344" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="392" x2="344" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0,01</tspan></text><line x1="435" y1="96" x2="435" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="435" y1="392" x2="435" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="435" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435" dy="0">0,1</tspan></text><line x1="526" y1="96" x2="526" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="526" y1="392" x2="526" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="526" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="526" dy="0">1</tspan></text><line x1="617" y1="96" x2="617" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="617" y1="392" x2="617" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="617" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="617" dy="0">10</tspan></text><line x1="708" y1="96" x2="708" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="708" y1="392" x2="708" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="708" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="708" dy="0">100</tspan></text><line x1="799" y1="96" x2="799" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="799" y1="392" x2="799" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="799" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">1 000</tspan></text><line x1="890" y1="96" x2="890" y2="392" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="392" x2="890" y2="397" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">10 000</tspan></text><line x1="344" y1="392" x2="890" y2="392" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Copia diaria</tspan></text><text x="314" y="211.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Copia cada 6 h</tspan></text><text x="314" y="285.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Copia cada hora</tspan></text><text x="314" y="351" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Réplica asíncrona (retraso medido en</tspan></text><text x="314" y="368" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">minutos)</tspan></text><line x1="786.001" y1="133" x2="813.411" y2="133" stroke="#8a9aa3" stroke-width="5"/><rect x="779.001" y="126" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="786.001" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="786.001" dy="0">719,7</tspan></text><polygon points="812.983,124.25 821.733,133 812.983,141.75 804.233,133" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="812.983,124.95 820.683,139.3 805.283,139.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="812.983" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="812.983" dy="0">1 424,5 · p99, máx</tspan></text><line x1="731.186" y1="207" x2="758.624" y2="207" stroke="#8a9aa3" stroke-width="5"/><rect x="724.186" y="200" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="731.186" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="731.186" dy="0">179,8</tspan></text><polygon points="758.237,198.25 766.987,207 758.237,215.75 749.487,207" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="758.237,198.95 765.937,213.3 750.537,213.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="758.237" y="236" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="758.237" dy="0">356,5 · p99, máx</tspan></text><line x1="660.418" y1="281" x2="687.812" y2="281" stroke="#8a9aa3" stroke-width="5"/><rect x="653.418" y="274" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="660.418" y="265" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="660.418" dy="0">30</tspan></text><polygon points="687.415,272.25 696.165,281 687.415,289.75 678.665,281" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polygon points="687.415,272.95 695.115,287.3 679.715,287.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="687.415" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="687.415" dy="0">59,4 · p99, máx</tspan></text><line x1="387.418" y1="355" x2="589.606" y2="355" stroke="#8a9aa3" stroke-width="5"/><rect x="380.418" y="348" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="387.418" y="339" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="387.418" dy="0">0,03</tspan></text><polygon points="474.254,346.95 481.954,361.3 466.554,361.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="474.254" y="384" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="474.254" dy="0">0,27</tspan></text><polygon points="589.606,346.25 598.356,355 589.606,363.75 580.856,355" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="589.606" y="339" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="589.606" dy="0">5</tspan></text><line x1="589.606" y1="96" x2="589.606" y2="392" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="594.606" y="109" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="594.606" dy="0">RPO = 5 min</tspan></text><text x="617" y="436" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="617" dy="0">Pérdida de datos (minutos) (escala logarítmica)</tspan></text><rect x="10" y="450" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="474.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El RPO real de una copia periódica es su intervalo, no la mediana; el de una réplica es el peor retraso, no el habitual, y</tspan></text><text x="470" y="491.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una réplica también copia los errores (un borrado). 20 000 fallas por estrategia; el retraso con 1 % de picos es un</tspan></text><text x="470" y="508.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuesto del autor.</tspan></text><text x="470" y="555.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
