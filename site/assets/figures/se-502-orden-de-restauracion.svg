<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Restaurar 12 componentes desde cero: tiempo en serie y ruta crítica</title><desc id="d">Barras horizontales con los minutos para restaurar 12 componentes: uno a uno tarda 225 y en paralelo respetando las dependencias la ruta crítica es de 125; cuando la identidad necesita los secretos y los secretos necesitan la identidad hay un ciclo y no se arranca desde cero, lo que solo revela un ejercicio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Restaurar 12 componentes desde cero: tiempo en serie y ruta crítica</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Restauración en serie</tspan></text><rect x="222.34" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Ruta crítica</tspan></text><line x1="354" y1="77" x2="354" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="269" x2="354" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="461.564" y1="77" x2="461.564" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="461.564" y1="269" x2="461.564" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="461.564" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.564" dy="0">50</tspan></text><line x1="569.128" y1="77" x2="569.128" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="569.128" y1="269" x2="569.128" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="569.128" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.128" dy="0">100</tspan></text><line x1="676.692" y1="77" x2="676.692" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="676.692" y1="269" x2="676.692" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="676.692" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="676.692" dy="0">150</tspan></text><line x1="784.256" y1="77" x2="784.256" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="784.256" y1="269" x2="784.256" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="784.256" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.256" dy="0">200</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="269" x2="891.82" y2="274" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">250</tspan></text><line x1="354" y1="269" x2="891.82" y2="269" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Dependencias declaradas</tspan></text><text x="344" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Con credenciales de emergencia fuera de línea</tspan></text><text x="344" y="233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Ejercicio 2: el portal exige observabilidad</tspan></text><text x="344" y="250" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">sana</tspan></text><rect x="354" y="83" width="484.038" height="24.5" rx="3" fill="#c0432f"/><text x="845.038" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="845.038" dy="0">225</tspan></text><rect x="354" y="110.5" width="268.91" height="24.5" rx="3" fill="#087f8c"/><text x="629.91" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="629.91" dy="0">125</tspan></text><rect x="354" y="147" width="527.064" height="24.5" rx="3" fill="#c0432f"/><text x="888.064" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="888.064" dy="0">245</tspan></text><rect x="354" y="174.5" width="279.666" height="24.5" rx="3" fill="#087f8c"/><text x="640.666" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="640.666" dy="0">130</tspan></text><rect x="354" y="211" width="527.064" height="24.5" rx="3" fill="#c0432f"/><text x="888.064" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="888.064" dy="0">245</tspan></text><rect x="354" y="238.5" width="279.666" height="24.5" rx="3" fill="#087f8c"/><text x="640.666" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="640.666" dy="0">130</tspan></text><text x="622.91" y="313" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="622.91" dy="0">Minutos para restaurar</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El RTO de 125 minutos de una tabla de dependencias incompleta es una promesa vacía: el ejercicio encontró un ciclo y añadió</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">5 minutos a la ruta crítica. Los 12 componentes, sus duraciones y sus dependencias son un ejemplo del autor, no una</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">medición de ningún sistema.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
