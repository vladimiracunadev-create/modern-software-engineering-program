<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 626" width="940" height="626" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis fallos inyectados en el harness y cuántas veces los acierta el diagnóstico desde la traza</title><desc id="d">Barras horizontales con los casos que el diagnóstico acierta, de 30, por fallo inyectado: con la traza mínima acierta los fallos de contexto, parada, verificación, permiso y tope y confunde siempre la herramienta ausente con la falta de contexto, 24 de 30; con la traza enriquecida, que incluye las herramientas ofrecidas, el contexto visible y la observación, acierta los 30.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="626" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Seis fallos inyectados en el harness y cuántas veces los acierta el diagnóstico desde la traza</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Traza mínima</tspan></text><rect x="154.48" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="174.48" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Traza enriquecida</tspan></text><line x1="314" y1="77" x2="314" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="461" x2="314" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="511.98" y1="77" x2="511.98" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="511.98" y1="461" x2="511.98" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="511.98" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="511.98" dy="0">2</tspan></text><line x1="709.96" y1="77" x2="709.96" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="709.96" y1="461" x2="709.96" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="709.96" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.96" dy="0">4</tspan></text><line x1="907.94" y1="77" x2="907.94" y2="461" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="461" x2="907.94" y2="466" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="482" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">6</tspan></text><line x1="314" y1="461" x2="907.94" y2="461" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">F1 sin contexto entre pasos (6 casos)</tspan></text><text x="304" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">F2 herramienta de escritura ausente (6)</tspan></text><text x="304" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">F3 la parada no se respeta (6)</tspan></text><text x="304" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">F4 sin instrucción de verificar (3)</tspan></text><text x="304" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">F5 escritura denegada por permiso (6)</tspan></text><text x="304" y="433.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">F6 tope de pasos demasiado bajo (3)</tspan></text><rect x="314" y="83" width="593.94" height="24.5" rx="3" fill="#c0432f"/><text x="914.94" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">6</tspan></text><rect x="314" y="110.5" width="593.94" height="24.5" rx="3" fill="#087f8c"/><text x="914.94" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">6</tspan></text><rect x="314" y="147" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="323" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><rect x="314" y="174.5" width="593.94" height="24.5" rx="3" fill="#087f8c"/><text x="914.94" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">6</tspan></text><rect x="314" y="211" width="593.94" height="24.5" rx="3" fill="#c0432f"/><text x="914.94" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">6</tspan></text><rect x="314" y="238.5" width="593.94" height="24.5" rx="3" fill="#087f8c"/><text x="914.94" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">6</tspan></text><rect x="314" y="275" width="296.97" height="24.5" rx="3" fill="#c0432f"/><text x="617.97" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="617.97" dy="0">3</tspan></text><rect x="314" y="302.5" width="296.97" height="24.5" rx="3" fill="#087f8c"/><text x="617.97" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="617.97" dy="0">3</tspan></text><rect x="314" y="339" width="593.94" height="24.5" rx="3" fill="#c0432f"/><text x="914.94" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">6</tspan></text><rect x="314" y="366.5" width="593.94" height="24.5" rx="3" fill="#087f8c"/><text x="914.94" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">6</tspan></text><rect x="314" y="403" width="296.97" height="24.5" rx="3" fill="#c0432f"/><text x="617.97" y="419.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="617.97" dy="0">3</tspan></text><rect x="314" y="430.5" width="296.97" height="24.5" rx="3" fill="#087f8c"/><text x="617.97" y="447.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="617.97" dy="0">3</tspan></text><text x="610.97" y="505" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="610.97" dy="0">Casos acertados</tspan></text><rect x="10" y="519" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="543.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con la traza mínima el diagnóstico acierta 24 de 30; con la enriquecida, 30 de 30. La diferencia es un campo, las</tspan></text><text x="470" y="560.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">herramientas ofrecidas, que decide entre dos fallos con síntomas idénticos.</tspan></text><text x="470" y="608.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
