<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 597" width="940" height="597" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una respuesta a incidentes de cinco etapas: dónde se pierde y cuánto sube la recuperación al mejorar cada etapa 5 puntos</title><desc id="d">Barras horizontales con los incidentes que fallan en cada etapa y con la recuperación completa que resultaría de mejorar esa etapa 5 puntos: con cinco etapas de 95, 92, 80, 88 y 90 por ciento de éxito, el producto es 55,4 % y la simulación de 20 000 incidentes da 52,8 %; la etapa más débil es la que más rinde al mejorarla.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="597" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una respuesta a incidentes de cinco etapas: dónde se pierde y cuánto sube la recuperación al mejorar cada</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">etapa 5 puntos</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Incidentes que fallan en la etapa</tspan></text><rect x="312.82" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="332.82" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="332.82" dy="0">Recuperación completa si se mejora 5 puntos</tspan></text><line x1="254" y1="96" x2="254" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="416" x2="254" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="463.92" y1="96" x2="463.92" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="463.92" y1="416" x2="463.92" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="463.92" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463.92" dy="0">20</tspan></text><line x1="673.84" y1="96" x2="673.84" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="673.84" y1="416" x2="673.84" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="673.84" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="673.84" dy="0">40</tspan></text><line x1="883.76" y1="96" x2="883.76" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="416" x2="883.76" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">60</tspan></text><line x1="254" y1="416" x2="883.76" y2="416" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="132.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Detección</tspan></text><text x="244" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Llegada a una persona</tspan></text><text x="244" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Diagnóstico</tspan></text><text x="244" y="324.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Mitigación</tspan></text><text x="244" y="388.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Verificación de la recuperación</tspan></text><rect x="254" y="102" width="86.0672" height="24.5" rx="3" fill="#c0432f"/><text x="347.067" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347.067" dy="0">8,2</tspan></text><rect x="254" y="129.5" width="605.619" height="24.5" rx="3" fill="#087f8c"/><text x="866.619" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="866.619" dy="0">57,7</tspan></text><rect x="254" y="166" width="76.6208" height="24.5" rx="3" fill="#c0432f"/><text x="337.621" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="337.621" dy="0">7,3</tspan></text><rect x="254" y="193.5" width="612.966" height="24.5" rx="3" fill="#087f8c"/><text x="873.966" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="873.966" dy="0">58,4</tspan></text><rect x="254" y="230" width="185.779" height="24.5" rx="3" fill="#c0432f"/><text x="446.779" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="446.779" dy="0">17,7</tspan></text><rect x="254" y="257.5" width="617.165" height="24.5" rx="3" fill="#087f8c"/><text x="878.165" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="878.165" dy="0">58,8</tspan></text><rect x="254" y="294" width="86.0672" height="24.5" rx="3" fill="#c0432f"/><text x="347.067" y="310.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347.067" dy="0">8,2</tspan></text><rect x="254" y="321.5" width="614.016" height="24.5" rx="3" fill="#087f8c"/><text x="875.016" y="338.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="875.016" dy="0">58,5</tspan></text><rect x="254" y="358" width="61.9264" height="24.5" rx="3" fill="#c0432f"/><text x="322.926" y="374.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322.926" dy="0">5,9</tspan></text><rect x="254" y="385.5" width="614.016" height="24.5" rx="3" fill="#087f8c"/><text x="875.016" y="402.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="875.016" dy="0">58,5</tspan></text><line x1="835.478" y1="96" x2="835.478" y2="416" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="840.478" y="109" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="840.478" dy="0">actual</tspan></text><text x="568.88" y="460" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="568.88" dy="0">Porcentaje (%)</tspan></text><rect x="10" y="474" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="498.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Una cadena de etapas buenas por separado se recupera menos de una de cada dos veces a lo largo del año, y la mejora más</tspan></text><text x="470" y="515.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">rentable está en la etapa más débil, no en la más visible. Las probabilidades por etapa y la dependencia por la telemetría</tspan></text><text x="470" y="532.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">son supuestos del autor.</tspan></text><text x="470" y="579.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
