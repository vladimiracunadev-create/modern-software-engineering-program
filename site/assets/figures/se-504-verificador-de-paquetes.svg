oke="#ffffff" stroke-width="1.5"/><rect x="354" y="524" width="521.7" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="541.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">30</tspan></text><text x="882.7" y="541.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">30</tspan></text><text x="614.85" y="601" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Mutaciones</tspan></text><rect x="10" y="615" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="639.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Detecta 210 de 360 (58 %), todas por referencias rotas o fechas vencidas. Ninguna de las cinco clases que se escapan viola</tspan></text><text x="470" y="656.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el formato: son errores de significado. Un paquete coherente consigo mismo no es un sistema operable; los doce operadores y</tspan></text><text x="470" y="673.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el paquete base son construcciones del autor.</tspan></text><text x="470" y="720.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
