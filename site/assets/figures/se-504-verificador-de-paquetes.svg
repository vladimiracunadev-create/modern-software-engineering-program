<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 738" width="940" height="738" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador de paquetes operativos frente a 360 mutaciones (doce operadores, treinta paquetes cada uno)</title><desc id="d">Barras apiladas con las mutaciones detectadas y no detectadas por tipo: el validador de referencias cruzadas entre servicios, objetivos, alertas, runbooks, copias y ejercicios detecta 210 de 360; detecta todas las de siete operadores y ninguna de las que cambian el sentido sin romper una referencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="738" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un validador de paquetes operativos frente a 360 mutaciones (doce operadores, treinta paquetes cada uno)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Detectadas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">No detectadas</tspan></text><line x1="354" y1="77" x2="354" y2="557" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="557" x2="354" y2="562" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="578" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="527.9" y1="77" x2="5