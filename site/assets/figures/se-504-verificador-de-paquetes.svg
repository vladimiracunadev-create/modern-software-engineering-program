" y="381.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Objetivo SLO laxo pero en rango</tspan></text><text x="344" y="421.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">RPO incoherente con la copia</tspan></text><text x="344" y="461.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Ejercicio sin hallazgos que corregir</tspan></text><text x="344" y="501.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Runbooks intercambiados</tspan></text><text x="344" y="541.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">SLI que no mide al usuario</tspan></text><rect x="354" y="84" width="521.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">30</tspan></text><rect x="875.7" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">30</tspan></text><rect x="354" y="124" width="521.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">30</tspan></text><rect x="875.7" y="124" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">30</tspan></text><rect x="354" y="164" width="521.7" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="614.85" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="614.85" dy="0">30</tspan></text><rect x="875.7" y="164" width="0" height="26" fill="#c0