<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Detectar un efecto pequeño (4 ms más en una dependencia de 40 ms): ventanas con la regla de banda frente al umbral de SLO</title><desc id="d">Líneas con el porcentaje de ventanas con el efecto que la regla declara refutadas: con la regla de banda de tres desviaciones sube de 2 por ciento con 5 segundos a 75 con 120; con el umbral de SLO de 96 por ciento sube de 53 a 79, pero también refuta ventanas sanas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Detectar un efecto pequeño (4 ms más en una dependencia de 40 ms): ventanas con la regla de banda frente al</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">umbral de SLO</tspan></text><circle cx="22" cy="70" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Regla de banda (media − 3 desviaciones)</tspan></text><rect x="358.06" y="64" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="378.06" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="378.06" dy="0">Umbral de SLO de 96 %</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="406" x2="78.62" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="331" x2="910" y2="331" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="331" x2="78.62" y2="331" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="335.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="256" x2="910" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="256" x2="78.62" y2="256" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="181" x2="910" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="181" x2="78.62" y2="181" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="185.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="106" x2="78.62" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="106" x2="78.62" y2="406" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="106" x2="96.62" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="406" x2="96.62" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">5</tspan></text><line x1="165.783" y1="106" x2="165.783" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="165.783" y1="406" x2="165.783" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="165.783" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165.783" dy="0">15</tspan></text><line x1="269.529" y1="106" x2="269.529" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="269.529" y1="406" x2="269.529" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="269.529" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="269.529" dy="0">30</tspan></text><line x1="477.019" y1="106" x2="477.019" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="477.019" y1="406" x2="477.019" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="477.019" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="477.019" dy="0">60</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">120</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Ventanas con efecto refutadas (%)</text><text x="494.31" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Ventana de medición (s)</tspan></text><polyline points="96.62,399.229 165.783,395.844 269.529,366.938 477.019,293.5 892,181" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="399.229" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="388.229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">2</tspan></text><circle cx="165.783" cy="395.844" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="165.783" y="384.844" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="165.783" dy="0">3</tspan></text><circle cx="269.529" cy="366.938" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="269.529" y="355.938" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="269.529" dy="0">13</tspan></text><circle cx="477.019" cy="293.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="477.019" y="282.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="477.019" dy="0">38</tspan></text><circle cx="892" cy="181" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="170" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">75</tspan></text><polyline points="96.62,248.188 165.783,237.25 269.529,216.938 477.019,199.75 892,168.5" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="242.688" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="96.62" y="272.188" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">53</tspan></text><rect x="160.283" y="231.75" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="165.783" y="261.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="165.783" dy="0">56</tspan></text><rect x="264.029" y="211.438" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="269.529" y="240.938" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="269.529" dy="0">63</tspan></text><rect x="471.519" y="194.25" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="477.019" y="223.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="477.019" dy="0">69</tspan></text><rect x="886.5" y="163" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="192.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">79</tspan></text><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Un efecto real de 4 ms mueve el indicador solo 0,6 puntos: para verlo sin falsas alarmas hacen falta ventanas de dos</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">minutos o varias repeticiones. Un experimento que no puede detectar el efecto que busca no confirma la hipótesis, solo no</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">la contradice. El umbral de SLO parece detectar más, pero lo logra porque el indicador sano ya está pegado a él.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
