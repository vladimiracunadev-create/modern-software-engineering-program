ght="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="269.529" y="291.69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="269.529" dy="0">0,99</tspan></text><rect x="471.519" y="279.234" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="477.019" y="308.734" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="477.019" dy="0">0,85</tspan></text><rect x="886.5" y="324.89" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="354.39" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,47</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El estado estable no es un número, es una banda cuyo ancho depende de la ventana: con 5 s el indicador oscila ±2,8 puntos</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con 3 desviaciones y con 120 s solo ±0,5. Una ventana larga mide mejor y tarda más en abortar. La media de 96,5 % y la</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dispersión salen de 1 152 ventanas de 5 s.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
