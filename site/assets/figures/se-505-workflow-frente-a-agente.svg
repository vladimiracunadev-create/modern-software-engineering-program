<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 399" width="990" height="399" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Workflow fijo frente a agente en tres tipos de solicitud de Avisos: llamadas, solicitudes resueltas y tokens</title><desc id="d">Tabla con tres tipos de solicitud de Avisos. En la consulta de plazo el workflow usa 2,0 llamadas y resuelve el 100,0 por ciento, el agente usa 2,1 llamadas y resuelve el 99,0 por ciento y gasta 1,2 veces los tokens. En silenciar un curso el agente usa 4,2 llamadas y gasta 2,8 veces los tokens. En la incidencia abierta el workflow no resuelve ninguna y se escala a una persona, mientras el agente usa 6,8 llamadas, resuelve el 93,1 por ciento y gasta 7,0 veces los tokens.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="399" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Tipo de solicitud</tspan></text><rect x="310" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Workflow fijo</tspan></text><rect x="570" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="702" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="702" dy="0">Agente</tspan></text><rect x="840" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="907" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="907" dy="0">Tokens: agente</tspan></text><text x="907" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="907" dy="0">/ wf</tspan></text><rect x="10" y="56" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="86.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Consulta de plazo (60 % de las</tspan></text><text x="157" y="102.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">solicitudes)</tspan></text><rect x="310" y="56" width="254" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">2,0 llamadas; 100,0 % resueltas</tspan></text><rect x="570" y="56" width="264" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">2,1 llamadas (p95 de 3); 99,0 %</tspan></text><text x="702" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">resueltas</tspan></text><rect x="840" y="56" width="134" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">1,2 veces</tspan></text><rect x="10" y="132" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="170.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Silenciar un curso (25 %)</tspan></text><rect x="310" y="132" width="254" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">2,0 llamadas; 100,0 % resueltas</tspan></text><rect x="570" y="132" width="264" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="162.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">4,2 llamadas (p95 de 5); 96,7 %</tspan></text><text x="702" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">resueltas</tspan></text><rect x="840" y="132" width="134" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">2,8 veces</tspan></text><rect x="10" y="208" width="294" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="238.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Incidencia abierta, de 3 a 8 pasos</tspan></text><text x="157" y="254.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">(15 %)</tspan></text><rect x="310" y="208" width="254" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">2,0 llamadas; 0,0 % resueltas,</tspan></text><text x="437" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">se escala a una persona</tspan></text><rect x="570" y="208" width="264" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="702" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">6,8 llamadas (p95 de 10); 93,1 %</tspan></text><text x="702" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="702" dy="0">resueltas</tspan></text><rect x="840" y="208" width="134" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="907" y="246.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907" dy="0">7,0 veces</tspan></text><rect x="10" y="288" width="970" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="312.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cómo leer la figura: cada fila es un tipo de solicitud y el agente cuesta más cuanto más fijo era el camino. Dónde deja de valer:</tspan></text><text x="495" y="329.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">el modelo es sintético, con 8 % de pasos equivocados y 1 % de pasos irreversibles por llamada, y 2 000 solicitudes con semilla 42;</tspan></text><text x="495" y="346.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">la tasa de errores de un modelo real es otra.</tspan></text><text x="495" y="385.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
