<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 229" width="1000" height="229" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Éxito de una cadena de tres pasos con y sin puerta programática entre pasos</title><desc id="d">Barras con el éxito de una cadena de tres pasos donde cada paso acierta el 95 por ciento: sin puerta llega al 85,8 por ciento y con una puerta programática que detecta el error en el 90 por ciento de los casos y un reintento llega al 97,8 por ciento, con 0,148 reintentos por ejecución.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="229" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Cadena de 3 pasos sin puerta</tspan></text><rect x="344" y="16" width="386.1" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="738.1" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="738.1" dy="0">85,8 %</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Con puerta programática y un reintento</tspan></text><rect x="344" y="62" width="440.1" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="792.1" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="792.1" dy="0">97,8 %; 0,148 reintentos por ejecución</tspan></text><rect x="10" y="110" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Cómo leer la figura: el error se multiplica a lo largo de la cadena y la puerta lo corta en el paso donde ocurre. Dónde deja de</tspan></text><text x="500" y="151.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">valer: supone errores independientes entre pasos y una puerta que detecta el 90 % de los errores; una puerta que mira lo que el</tspan></text><text x="500" y="168.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">propio modelo dijo no detecta nada.</tspan></text><text x="500" y="215.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
