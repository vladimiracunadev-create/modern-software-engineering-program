<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 610" width="940" height="610" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una falla que empeora a los 60 s (de 20 % a 100 % de errores): peticiones dañadas según la condición de aborto y el radio</title><desc id="d">Barras con las peticiones dañadas en un experimento de cinco minutos que empeora a los 60 segundos, según el radio y la condición de aborto: con 0,5 por ciento ninguna condición se activa y se dañan 104; con 2 por ciento, el SLO global y el grupo abortan a los 65 segundos y dañan 34 frente a 420; con 10 por ciento el SLO global aborta a los 10 segundos por culpa de la propia falla del 20 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="610" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una falla que empeora a los 60 s (de 20 % a 100 % de errores): peticiones dañadas según la condición de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">aborto y el radio</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sin aborto</tspan></text><rect x="139.4" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="159.4" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Aborto por el SLO global</tspan></text><rect x="368.36" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="388.36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="388.36" dy="0">Aborto por el grupo experimental</tspan></text><rect x="16" y="88" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="99" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Aborto por presupuesto de 300 peticiones</tspan></text><line x1="108.78" y1="418" x2="920" y2="418" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="418" x2="108.78" y2="418" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="422.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10</tspan></text><line x1="108.78" y1="348" x2="920" y2="348" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="348" x2="108.78" y2="348" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="352.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100</tspan></text><line x1="108.78" y1="278" x2="920" y2="278" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="278" x2="108.78" y2="278" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="282.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">1 000</tspan></text><line x1="108.78" y1="208" x2="920" y2="208" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="208" x2="108.78" y2="208" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="212.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">10 000</tspan></text><line x1="108.78" y1="138" x2="920" y2="138" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="138" x2="108.78" y2="138" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="142.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="138" x2="108.78" y2="418" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="278" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 278)">Peticiones dañadas (escala logarítmica)</text><rect x="129.06" y="346.808" width="37.561" height="71.1923" rx="3" fill="#c0432f"/><text x="147.841" y="340.808" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="147.841" dy="0">104</tspan></text><rect x="170.621" y="346.808" width="37.561" height="71.1923" rx="3" fill="#946512"/><text x="189.402" y="340.808" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="189.402" dy="0">104</tspan></text><rect x="212.183" y="346.808" width="37.561" height="71.1923" rx="3" fill="#087f8c"/><text x="230.963" y="340.808" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="230.963" dy="0">104</tspan></text><rect x="253.744" y="346.808" width="37.561" height="71.1923" rx="3" fill="#6b7c86"/><text x="272.524" y="340.808" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="272.524" dy="0">104</tspan></text><text x="210.183" y="439" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210.183" dy="0">0,5 % del tráfico</tspan></text><rect x="331.865" y="304.373" width="37.561" height="113.627" rx="3" fill="#c0432f"/><text x="350.646" y="298.373" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="350.646" dy="0">420</tspan></text><rect x="373.427" y="380.796" width="37.561" height="37.2035" rx="3" fill="#946512"/><text x="392.207" y="374.796" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="392.207" dy="0">34</tspan></text><rect x="414.988" y="380.796" width="37.561" height="37.2035" rx="3" fill="#087f8c"/><text x="433.768" y="374.796" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.768" dy="0">34</tspan></text><rect x="456.548" y="314.099" width="37.561" height="103.901" rx="3" fill="#6b7c86"/><text x="475.329" y="308.099" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="475.329" dy="0">305</tspan></text><text x="412.988" y="439" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412.988" dy="0">2,0 % del tráfico</tspan></text><rect x="534.67" y="253.347" width="37.561" height="164.653" rx="3" fill="#c0432f"/><text x="553.451" y="247.347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.451" dy="0">2 250</tspan></text><rect x="576.231" y="400.131" width="37.561" height="17.8691" rx="3" fill="#946512"/><text x="595.012" y="394.131" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="595.012" dy="0">18</tspan></text><rect x="617.793" y="335.674" width="37.561" height="82.3264" rx="3" fill="#087f8c"/><text x="636.573" y="329.674" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="636.573" dy="0">150</tspan></text><rect x="659.353" y="312.356" width="37.561" height="105.644" rx="3" fill="#6b7c86"/><text x="678.134" y="306.356" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.134" dy="0">323</tspan></text><text x="615.793" y="439" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615.793" dy="0">10,0 % del tráfico</tspan></text><rect x="737.475" y="203.9" width="37.561" height="214.1" rx="3" fill="#c0432f"/><text x="756.256" y="197.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="756.256" dy="0">11 444</tspan></text><rect x="779.036" y="347.698" width="37.561" height="70.3025" rx="3" fill="#946512"/><text x="797.817" y="341.698" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="797.817" dy="0">101</tspan></text><rect x="820.597" y="284.974" width="37.561" height="133.026" rx="3" fill="#087f8c"/><text x="839.378" y="278.974" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="839.378" dy="0">795</tspan></text><rect x="862.158" y="312.735" width="37.561" height="105.265" rx="3" fill="#6b7c86"/><text x="880.939" y="306.735" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="880.939" dy="0">319</tspan></text><text x="818.597" y="439" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="818.597" dy="0">50,0 % del tráfico</tspan></text><rect x="10" y="470" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="494.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con radio pequeño ninguna condición global ve nada: el SLO global tolera hasta 1 % de error y 0,5 % del tráfico no llega a</tspan></text><text x="470" y="511.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">rozarlo. Con radio mayor el SLO global aborta antes de tiempo, porque el experimento ya lo consume desde el primer segundo.</tspan></text><text x="470" y="528.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La condición que aísla al grupo experimental es la única que decide bien en los dos casos; con 0,5 % tampoco se activa,</tspan></text><text x="470" y="544.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">porque no hay peticiones suficientes en 10 s.</tspan></text><text x="470" y="592.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
