<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Peticiones de personas que fallan por culpa del experimento en un minuto, según el radio</title><desc id="d">Barras con las peticiones falladas por el experimento durante un minuto: 1,3 con 0,5 por ciento del tráfico, 5,4 con 2, 13,6 con 5, 27,8 con 10, 68,5 con 25 y 138,5 con 50; el daño crece en proporción al radio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Peticiones de personas que fallan por culpa del experimento en un minuto, según el radio</tspan></text><line x1="78.62" y1="347" x2="920" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="347" x2="78.62" y2="347" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="351.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="253.667" x2="920" y2="253.667" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="253.667" x2="78.62" y2="253.667" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="258.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="160.333" x2="920" y2="160.333" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="160.333" x2="78.62" y2="160.333" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="164.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">150</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 207)">Peticiones falladas (media de 60 repeticiones)</text><rect x="90.6397" y="344.636" width="96.1577" height="2.36444" rx="3" fill="#c0432f"/><text x="138.719" y="338.636" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="138.719" dy="0">1,3</tspan></text><text x="138.719" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="138.719" dy="0">0,5 %</tspan></text><rect x="210.837" y="341.742" width="96.1577" height="5.25778" rx="3" fill="#c0432f"/><text x="258.916" y="335.742" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="258.916" dy="0">2,8</tspan></text><text x="258.916" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="258.916" dy="0">1,0 %</tspan></text><rect x="331.034" y="336.889" width="96.1577" height="10.1111" rx="3" fill="#c0432f"/><text x="379.113" y="330.889" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="379.113" dy="0">5,4</tspan></text><text x="379.113" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="379.113" dy="0">2,0 %</tspan></text><rect x="451.231" y="321.707" width="96.1577" height="25.2933" rx="3" fill="#c0432f"/><text x="499.31" y="315.707" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">13,6</tspan></text><text x="499.31" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">5,0 %</tspan></text><rect x="571.428" y="295.076" width="96.1577" height="51.9244" rx="3" fill="#c0432f"/><text x="619.507" y="289.076" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="619.507" dy="0">27,8</tspan></text><text x="619.507" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="619.507" dy="0">10,0 %</tspan></text><rect x="691.625" y="219.071" width="96.1577" height="127.929" rx="3" fill="#c0432f"/><text x="739.704" y="213.071" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="739.704" dy="0">68,5</tspan></text><text x="739.704" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="739.704" dy="0">25,0 %</tspan></text><rect x="811.823" y="88.56" width="96.1577" height="258.44" rx="3" fill="#c0432f"/><text x="859.901" y="82.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.901" dy="0">138,4</tspan></text><text x="859.901" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.901" dy="0">50,0 %</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El daño es lineal en el radio y la detección no: pasar de 2 % a 50 % multiplica el daño por 25 y no mejora la detección,</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que ya era total. El radio razonable es el menor que detecta el efecto buscado con la potencia exigida. El 5 % de errores</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sobre un tráfico de 90 peticiones por segundo es un supuesto del autor.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
