<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 559" width="940" height="559" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Radio de explosión y capacidad de ver el efecto: un 5 % de errores inyectado durante un minuto</title><desc id="d">Línea con el porcentaje de repeticiones en que una prueba entre el grupo experimental y el de control detecta el efecto según la fracción de tráfico afectada: 72 por ciento con 0,5 por ciento del tráfico, 95 con 1, 100 con 2 por ciento o más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="559" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Radio de explosión y capacidad de ver el efecto: un 5 % de errores inyectado durante un minuto</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="284" x2="910" y2="284" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="284" x2="78.62" y2="284" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="288.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="209" x2="910" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="209" x2="78.62" y2="209" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="213.5" font-size="13" text-anchor=