"216.337" dy="0">95</tspan></text><circle cx="336.053" cy="59" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="336.053" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="336.053" dy="0">100</tspan></text><circle cx="494.31" cy="59" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="494.31" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="494.31" dy="0">100</tspan></text><circle cx="614.027" cy="59" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="614.027" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="614.027" dy="0">100</tspan></text><circle cx="772.283" cy="59" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="772.283" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="772.283" dy="0">100</tspan></text><circle cx="892" cy="59" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100</tspan></text><rect x="10" y="419" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un radio mínimo basta para ver un efecto grande, pero no uno pequeño: con 0,5 % del tráfico (unas 270 peticiones por minuto</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">en el grupo) se pierde 1 de cada 4 repeticiones. La prueba compara el grupo con el control de la misma ejecución, que</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">absorbe las variaciones comunes del tráfico. 60 repeticiones por fracción con 90 peticiones por segundo son supuestos del</tspan></text><text x="470" y="493.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">autor.</tspan></text><text x="470" y="541.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
