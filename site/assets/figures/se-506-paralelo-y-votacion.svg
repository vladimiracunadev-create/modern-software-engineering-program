<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 485" width="990" height="485" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Paralelización con hilos reales y votación con y sin errores correlacionados</title><desc id="d">Tabla con cinco medidas. Ocho subtareas de 50 milisegundos tardan 402 milisegundos en secuencia, 54 con ocho hilos y 203 con dos hilos. Una votación de cinco muestras con acierto de 0,80 llega al 94,0 por ciento si los errores son independientes y al 87,4 por ciento si en la mitad de las ejecuciones las cinco comparten el mismo sesgo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="485" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Medida</tspan></text><rect x="390" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Resultado</tspan></text><rect x="530" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Lectura</tspan></text><rect x="10" y="56" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Ocho subtareas de 50 ms, secuencial</tspan></text><rect x="390" y="56" width="134" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">402 ms</tspan></text><rect x="530" y="56" width="444" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">La suma de las esperas</tspan></text><rect x="10" y="122" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Las mismas, con 8 hilos</tspan></text><rect x="390" y="122" width="134" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">54 ms</tspan></text><rect x="530" y="122" width="444" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">La espera más larga; solo vale si son independientes</tspan></text><rect x="10" y="188" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="221.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Las mismas, con 2 hilos</tspan></text><rect x="390" y="188" width="134" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">203 ms</tspan></text><rect x="530" y="188" width="444" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Un límite de concurrencia reparte en cuatro tandas</tspan></text><rect x="10" y="254" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="279.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Votación de 5 muestras, acierto 0,80,</tspan></text><text x="197" y="295.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">independientes</tspan></text><rect x="390" y="254" width="134" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">94,0 %</tspan></text><rect x="530" y="254" width="444" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">El voto compra calidad si los errores no se repiten</tspan></text><rect x="10" y="320" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="345.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Votación de 5, con la mitad de las ejecuciones</tspan></text><text x="197" y="361.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">sesgadas</tspan></text><rect x="390" y="320" width="134" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">87,4 %</tspan></text><rect x="530" y="320" width="444" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Los errores correlacionados reducen el beneficio del voto</tspan></text><rect x="10" y="390" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="414.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cómo leer la figura: los tiempos son del reloj real y varían entre equipos; los porcentajes son simulaciones con semilla. Dónde</tspan></text><text x="495" y="431.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">deja de valer: las esperas son de sueño, no de red, y la correlación del 50 % es un supuesto, no una medida de ningún modelo.</tspan></text><text x="495" y="471.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Hilos de CPython y simulación con semilla; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
