<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La falla termina a los 60 s: tres clientes tras perder la mitad de los hilos de la dependencia entre los 30 y los 60 s</title><desc id="d">Líneas con el porcentaje de peticiones correctas por ventana de 10 segundos: el cliente con una espera de 5 segundos y sin reintentos se mantiene en 100 por ciento; el cliente con espera corta y reintentos con azar cae a 10 por ciento a los 45 segundos y a 0 desde los 55 y no se recupera cuando la falla termina a los 60; el cliente con cortacircuitos calibrado cae a 44 por ciento y vuelve a 100 a los 75 segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La falla termina a los 60 s: tres clientes tras perder la mitad de los hilos de la dependencia entre los 30</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">y los 60 s</tspan></text><circle cx="22" cy="70" r="6" fill="#946512" stroke="#946512" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">A · solo espera de 5 s</tspan></text><rect x="229.88" y="64" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="249.88" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">C · espera corta y 