32f" stroke-width="2"/><rect x="488.81" y="400.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="568.348" y="400.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="647.886" y="400.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="727.424" y="400.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="806.962" y="400.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><rect x="886.5" y="400.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><polyline points="96.62,106 176.158,106 255.696,106 335.234,106 414.772,274.421 494.31,198.873 573.848,169.175 653.386,106 732.924,106 812.462,106 892,106" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="96.62,99.675 102.67,110.95 90.57,110.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="176.158,99.675 182.208,110.95 170.108,110.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="255.696,99.675 261.746,110.95 249.646,110.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="335.234,99.675 341.284,110.95 329.184,110.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="414.772,268.096 420.822,279.371 408.722,279.371" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="494.31,192.548 500.36,203.823 488.26,203.823" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="573.848,162.85 579.898,174.125 567.798,174.125" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="653.386,99.675 659.436,110.95 647.336,110.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="732.924,99.675 738.974,110.95 726.874,110.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="812.462,99.675 818.512,110.95 806.412,110.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="892,99.675 898.05,110.95 885.95,110.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El cliente C sigue fallando 50 segundos después de que la dependencia se recuperó: cada petición lenta se reintenta tres</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">veces, el triple de carga mantiene la cola llena y la cola llena produce más esperas agotadas. Es un fallo metaestable. El</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">cliente A no lo sufre porque no multiplica la carga, pero tampoco ayuda: pierde 63 % con una dependencia lenta.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
