<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intentos que cada petición de una persona manda a la dependencia mientras esta falla</title><desc id="d">Barras horizontales con los intentos por petición durante la dependencia lenta y durante la caída del proceso: la espera de 5 segundos sin reintentos manda 1 intento en ambos casos; los reintentos sin pausa mandan 2,3 y 3,6; la espera corta con reintentos con azar manda 3,0 y 3,0; el cortacircuitos los reduce a cerca de 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Intentos que cada petición de una persona manda a la dependencia mientras esta falla</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Dependencia lenta +100 ms</tspan></text><rect x="252.5" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="272.5" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Proceso caído 12 s</tspan></text><line x1="314" y1="77" x2="314" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="397" x2="314" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="458.455" y1="77" x2="458.455" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="458.455" y1="397" x2="458.455" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="458.455" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.455" dy="0">1</tspan></text><line x1="602.91" y1="77" x2="602.91" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="602.91" y1="397" x2="602.91" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="602.91" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602.91" dy="0">2</tspan></text><line x1="747.365" y1="77" x2="747.365" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="747.365" y1="397" x2="747.365" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="747.365" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747.365" dy="0">3</tspan></text><line x1="891.82" y1="77" x2="891.82" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="397" x2="891.82" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">4</tspan></text><line x1="314" y1="397" x2="891.82" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">A · solo espera de 5 s</tspan></text><text x="304" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">B · 3 reintentos sin pausa</tspan></text><text x="304" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">C · espera corta y reintentos con azar</tspan></text><text x="304" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">D · C con cortacircuitos sensible</tspan></text><text x="304" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">E · C con cortacircuitos calibrado</tspan></text><rect x="314" y="83" width="144.455" height="24.5" rx="3" fill="#946512"/><text x="465.455" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="465.455" dy="0">1,0</tspan></text><rect x="314" y="110.5" width="144.455" height="24.5" rx="3" fill="#c0432f"/><text x="465.455" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="465.455" dy="0">1,0</tspan></text><rect x="314" y="147" width="327.476" height="24.5" rx="3" fill="#946512"/><text x="648.476" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="648.476" dy="0">2,3</tspan></text><rect x="314" y="174.5" width="514.132" height="24.5" rx="3" fill="#c0432f"/><text x="835.132" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="835.132" dy="0">3,6</tspan></text><rect x="314" y="211" width="433.365" height="24.5" rx="3" fill="#946512"/><text x="754.365" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="754.365" dy="0">3,0</tspan></text><rect x="314" y="238.5" width="433.365" height="24.5" rx="3" fill="#c0432f"/><text x="754.365" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="754.365" dy="0">3,0</tspan></text><rect x="314" y="275" width="147.293" height="24.5" rx="3" fill="#946512"/><text x="468.293" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="468.293" dy="0">1,0</tspan></text><rect x="314" y="302.5" width="144.769" height="24.5" rx="3" fill="#c0432f"/><text x="465.769" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="465.769" dy="0">1,0</tspan></text><rect x="314" y="339" width="155.049" height="24.5" rx="3" fill="#946512"/><text x="476.049" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="476.049" dy="0">1,1</tspan></text><rect x="314" y="366.5" width="144.769" height="24.5" rx="3" fill="#c0432f"/><text x="465.769" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="465.769" dy="0">1,0</tspan></text><line x1="458.455" y1="77" x2="458.455" y2="397" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="463.455" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="463.455" dy="0">1 intento</tspan></text><text x="602.91" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="602.91" dy="0">Intentos por petición</tspan></text><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Un intento extra por cada petición que falla es la forma más barata de convertir una lentitud en una sobrecarga: la</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">dependencia recibe tres veces el trabajo justo cuando tiene menos capacidad. El cortacircuitos corta el flujo y por eso</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">recupera. Los 90 intentos por segundo y los 8 hilos de 40 ms son supuestos del autor.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
