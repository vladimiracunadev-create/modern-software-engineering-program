<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 445" width="990" height="445" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tokens de memoria que se envían al preguntar, aciertos y fallo típico de cada estrategia</title><desc id="d">Tabla con los tokens de memoria enviados al preguntar, el acierto y el fallo típico: contexto completo con presupuesto 1 973 tokens y 67,1 por ciento, ventana de 20 turnos 1 041 y 41,5, resumen con pérdidas 150 y 74,8, almacén sin versión 80 y 40,8, almacén con versión 80 y 95,2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="445" fill="#ffffff"/><rect x="10" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="152" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="152" dy="0">Estrategia</tspan></text><rect x="300" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="347" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="347" dy="0">Tokens</tspan></text><rect x="400" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="457" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="457" dy="0">Aciertos</tspan></text><rect x="520" y="12" width="454" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Fallo típico</tspan></text><rect x="10" y="56" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Contexto completo con presupuesto</tspan></text><rect x="300" y="56" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">1 973</tspan></text><rect x="400" y="56" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">67,1 %</tspan></text><rect x="520" y="56" width="454" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Lo más antiguo se pierde sin aviso</tspan></text><rect x="10" y="114" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Ventana de 20 turnos</tspan></text><rect x="300" y="114" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">1 041</tspan></text><rect x="400" y="114" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">41,5 %</tspan></text><rect x="520" y="114" width="454" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Olvida todo lo anterior a la ventana</tspan></text><rect x="10" y="172" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Resumen con pérdidas</tspan></text><rect x="300" y="172" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">150</tspan></text><rect x="400" y="172" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">74,8 %</tspan></text><rect x="520" y="172" width="454" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Un cambio no resumido deja el valor viejo</tspan></text><rect x="10" y="230" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Almacén sin versión</tspan></text><rect x="300" y="230" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">80</tspan></text><rect x="400" y="230" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">40,8 %</tspan></text><rect x="520" y="230" width="454" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Devuelve el primer valor, ya obsoleto</tspan></text><rect x="10" y="288" width="284" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="317.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Almacén con versión</tspan></text><rect x="300" y="288" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">80</tspan></text><rect x="400" y="288" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="457" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457" dy="0">95,2 %</tspan></text><rect x="520" y="288" width="454" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="317.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">Falla si el extractor no detecta el hecho</tspan></text><rect x="10" y="350" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cómo leer la figura: menos tokens no significa menos aciertos; una memoria externa bien versionada gasta una fracción y acierta</tspan></text><text x="495" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">más. Dónde deja de valer: el costo de extraer, escribir y consultar el almacén no está en los tokens de la tabla.</tspan></text><text x="495" y="431.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
