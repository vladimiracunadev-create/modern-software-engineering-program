<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde se inyecta la falla: un proxy entre el cliente y el servicio deja intactos el código de ambos</title><desc id="d">Diagrama con el cliente que mide a la izquierda, un proxy en el centro con tres tóxicos aplicados a la dirección de respuesta (latencia, reinicio de conexión y silencio) y el servicio local a la derecha; abajo, un panel de control que activa y retira los tóxicos y un registro con lo que mide el cliente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><rect x="10" y="40" width="200" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="71" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="110" dy="0">Cliente de la API</tspan></text><text x="110" y="88.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="110" dy="0">espera 300 ms, sin</tspan></text><text x="110" y="106.84" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="110" dy="0">reintentos</tspan></text><rect x="250" y="14" width="440" height="160" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="264" y="36" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="264" dy="0">Proxy (el mecanismo de Toxiproxy)</tspan></text><rect x="268" y="50" width="120" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="328" y="67" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="328" dy="0">Latencia</tspan></text><text x="328" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="328" dy="0">retrasa los</tspan></text><text x="328" y="100.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="328" dy="0">datos</tspan></text><rect x="398" y="50" width="120" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="458" y="67" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="458" dy="0">Reinicio</tspan></text><text x="458" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="458" dy="0">cierra al</tspan></text><text x="458" y="100.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="458" dy="0">instante</tspan></text><rect x="528" y="50" width="144" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="600" y="67" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="600" dy="0">Silencio</tspan></text><text x="600" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="600" dy="0">retiene y</tspan></text><text x="600" y="100.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="600" dy="0">descarta</tspan></text><rect x="268" y="120" width="404" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="145.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Sin tóxico: reenvía bytes y añade menos de 1 ms</tspan></text><rect x="730" y="40" width="200" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="79.96" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830" dy="0">Servicio local</tspan></text><text x="830" y="97.88" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="830" dy="0">responde «ok» en 10 ms</tspan></text><polyline points="210,70 250,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,70 730,70" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="250,105 210,105" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="250" y="210" width="440" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="234.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Panel de control: activa un tóxico, lo retira y</tspan></text><text x="470" y="252.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">cuenta cada experimento</tspan></text><polyline points="470,210 470,176" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="198" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">activar y retirar</tspan></text><rect x="10" y="300" width="440" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="230" y="330.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">Lo que se mide: éxitos y tiempo hasta el desenlace en el</tspan></text><text x="230" y="346.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="230" dy="0">cliente, nunca el código del servicio</tspan></text><rect x="480" y="300" width="450" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="330.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">Lo que NO ve: fallas dentro del servicio (hilos, disco,</tspan></text><text x="705" y="346.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">memoria). Esas se inyectan en el nodo, no en el cable</tspan></text><text x="470" y="392" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición real del 23 de noviembre de 2026 en Windows 11 con CPython 3.12.9 (sockets y relojes reales): los conteos se repiten y los milisegundos varían unos puntos.</tspan></text></svg>
