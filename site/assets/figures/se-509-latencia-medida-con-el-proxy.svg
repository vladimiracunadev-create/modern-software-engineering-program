<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 661" width="940" height="661" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un cliente con espera de 300 ms contra un servicio local a través de un proxy que inyecta fallas: tiempo hasta el desenlace</title><desc id="d">Barras horizontales con la mediana del tiempo hasta el desenlace en milisegundos de 30 peticiones reales por escenario: unos 11 sin tóxico, 61 con 50 de latencia, 211 con 200, 311 con 400 porque la espera se agota a los 300, 10 con el reinicio de conexión y 311 con el silencio; los éxitos son 30 de 30 hasta 200 milisegundos de latencia y 0 de 30 en los otros tres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="661" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un cliente con espera de 300 ms contra un servicio local a través de un proxy que inyecta fallas: tiempo</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">hasta el desenlace</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Mediana (ms)</tspan></text><rect x="154.48" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="174.48" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">Percentil 95 (ms)</tspan></text><line x1="324" y1="96" x2="324" y2="480" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="480" x2="324" y2="485" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="501" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="465.955" y1="96" x2="465.955" y2="480" stroke="#d5dde1" stroke-width="1"/><line x1="465.955" y1="480" x2="465.955" y2="485" stroke="#5b7280" stroke-width="1.4"/><text x="465.955" y="501" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465.955" dy="0">100</tspan></text><line x1="607.91" y1="96" x2="607.91" y2="480" stroke="#d5dde1" stroke-width="1"/><line x1="607.91" y1="480" x2="607.91" y2="485" stroke="#5b7280" stroke-width="1.4"/><text x="607.91" y="501" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607.91" dy="0">200</tspan></text><line x1="749.865" y1="96" x2="749.865" y2="480" stroke="#d5dde1" stroke-width="1"/><line x1="749.865" y1="480" x2="749.865" y2="485" stroke="#5b7280" stroke-width="1.4"/><text x="749.865" y="501" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="749.865" dy="0">300</tspan></text><line x1="891.82" y1="96" x2="891.82" y2="480" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="480" x2="891.82" y2="485" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="501" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">400</tspan></text><line x1="324" y1="480" x2="891.82" y2="480" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="132.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">sin tóxico (30 de 30)</tspan></text><text x="314" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">latencia 50 ms (30 de 30)</tspan></text><text x="314" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">latencia 200 ms (30 de 30)</tspan></text><text x="314" y="324.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">latencia 400 ms (0 de 30)</tspan></text><text x="314" y="388.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">reinicio de conexión (0 de 30)</tspan></text><text x="314" y="452.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">silencio (0 de 30)</tspan></text><rect x="324" y="102" width="15.757" height="24.5" rx="3" fill="#087f8c"/><text x="346.757" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="346.757" dy="0">11</tspan></text><rect x="324" y="129.5" width="17.0346" height="24.5" rx="3" fill="#946512"/><text x="348.035" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="348.035" dy="0">12</tspan></text><rect x="324" y="166" width="87.1604" height="24.5" rx="3" fill="#087f8c"/><text x="418.16" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="418.16" dy="0">61</tspan></text><rect x="324" y="193.5" width="88.5799" height="24.5" rx="3" fill="#946512"/><text x="419.58" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="419.58" dy="0">62</tspan></text><rect x="324" y="230" width="300.235" height="24.5" rx="3" fill="#087f8c"/><text x="631.235" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="631.235" dy="0">212</tspan></text><rect x="324" y="257.5" width="356.875" height="24.5" rx="3" fill="#946512"/><text x="687.875" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="687.875" dy="0">251</tspan></text><rect x="324" y="294" width="441.196" height="24.5" rx="3" fill="#087f8c"/><text x="772.196" y="310.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="772.196" dy="0">311</tspan></text><rect x="324" y="321.5" width="443.325" height="24.5" rx="3" fill="#946512"/><text x="774.325" y="338.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="774.325" dy="0">312</tspan></text><rect x="324" y="358" width="14.7633" height="24.5" rx="3" fill="#087f8c"/><text x="345.763" y="374.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="345.763" dy="0">10</tspan></text><rect x="324" y="385.5" width="16.0409" height="24.5" rx="3" fill="#946512"/><text x="347.041" y="402.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="347.041" dy="0">11</tspan></text><rect x="324" y="422" width="441.48" height="24.5" rx="3" fill="#087f8c"/><text x="772.48" y="438.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="772.48" dy="0">311</tspan></text><rect x="324" y="449.5" width="442.616" height="24.5" rx="3" fill="#946512"/><text x="773.616" y="466.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="773.616" dy="0">312</tspan></text><line x1="749.865" y1="96" x2="749.865" y2="480" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="754.865" y="109" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="754.865" dy="0">espera de 300 ms</tspan></text><text x="607.91" y="524" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">Milisegundos</tspan></text><rect x="10" y="538" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="562.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El reinicio falla rápido y el silencio falla lento: el silencio cuesta una espera completa por petición, y por eso es la</tspan></text><text x="470" y="579.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">falla que más recursos retiene. Un tóxico de latencia de 400 ms equivale desde el cliente a un silencio. El proxy sin</tspan></text><text x="470" y="596.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tóxico añade menos de 1 ms a la mediana directa (10,4 ms). Una máquina, 30 peticiones secuenciales.</tspan></text><text x="470" y="643.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medición real del 23 de noviembre de 2026 en Windows 11 con CPython 3.12.9 (sockets y relojes reales): los conteos se repiten y los milisegundos varían unos puntos.</tspan></text></svg>
