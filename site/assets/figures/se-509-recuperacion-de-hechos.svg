<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 367" width="1000" height="367" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hechos vigentes recuperados al final de 80 turnos según la estrategia de memoria</title><desc id="d">Barras con el porcentaje de hechos vigentes que cada estrategia recupera al final de 80 turnos: contexto completo con presupuesto 67,1, ventana de 20 turnos 41,5, resumen con pérdidas 74,8, almacén externo sin versión 40,8 y almacén externo con versión 95,2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="367" fill="#ffffff"/><text x="304" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Contexto completo con presupuesto</tspan></text><rect x="314" y="16" width="335.5" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="657.5" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="657.5" dy="0">67,1 %</tspan></text><text x="304" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Ventana de 20 turnos</tspan></text><rect x="314" y="62" width="207.5" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="529.5" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="529.5" dy="0">41,5 %</tspan></text><text x="304" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Resumen con pérdidas</tspan></text><rect x="314" y="108" width="374" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="696" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="696" dy="0">74,8 %</tspan></text><text x="304" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Almacén sin versión</tspan></text><rect x="314" y="154" width="204" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="526" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="526" dy="0">40,8 %</tspan></text><text x="304" y="221" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Almacén con versión</tspan></text><rect x="314" y="200" width="476" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="798" y="221" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="798" dy="0">95,2 %</tspan></text><rect x="10" y="248" width="980" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="500" y="272.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">Cómo leer la figura: se pregunta por el valor vigente de cada hecho, y 25 % de los turnos contienen un hecho que a veces reemplaza</tspan></text><text x="500" y="289.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">a uno anterior. Dónde deja de valer: 300 conversaciones sintéticas, extracción con 95 % de acierto y resumen que conserva cada</tspan></text><text x="500" y="306.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="500" dy="0">cambio con 75 %; son supuestos y no mediciones de un modelo.</tspan></text><text x="500" y="353.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="500" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
