<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 569" width="940" height="569" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Escrituras confirmadas que se pierden al caer el primario con replicación asíncrona (200 escrituras por segundo)</title><desc id="d">Barras con las escrituras confirmadas que no estaban en la réplica al conmutar: media 4,3 con retraso típico de 20 milisegundos, 7,8 con 1 por ciento de picos de 2 segundos y 65,4 con 5 por ciento de picos de hasta 10 segundos; el percentil 99 es 15, 25 y 2 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="569" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Escrituras confirmadas que se pierden al caer el primario con replicación asíncrona (200 escrituras por</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">segundo)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Media</tspan></text><rect x="101.7" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="121.7" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">Percentil 99</tspan></text><rect x="240.18" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="260.18" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="260.18" dy="0">Máximo</tspan></text><line x1="101.24" y1="394" x2="920" y2="394" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="394" x2="101.24" y2="394" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="398.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="324" x2="920" y2="324" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="324" x2="101.24" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="328.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="254" x2="920" y2="254" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="254" x2="101.24" y2="254" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="258.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="184" x2="920" y2="184" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="184" x2="101.24" y2="184" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="188.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="114" x2="101.24" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="114" x2="101.24" y2="394" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 254)">Escrituras confirmadas perdidas por conmutación (escala logarítmica)</text><rect x="128.532" y="349.733" width="70.112" height="44.2674" rx="3" fill="#087f8c"/><text x="163.588" y="343.733" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="163.588" dy="0">4</tspan></text><rect x="202.644" y="311.674" width="70.112" height="82.3264" rx="3" fill="#946512"/><text x="237.7" y="305.674" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="237.7" dy="0">15</tspan></text><rect x="276.756" y="267.567" width="70.112" height="126.433" rx="3" fill="#c0432f"/><text x="311.812" y="261.567" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="311.812" dy="0">64</tspan></text><text x="237.7" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.7" dy="0">Retraso típico (mediana de 20 ms)</tspan></text><rect x="401.452" y="331.484" width="70.112" height="62.5159" rx="3" fill="#087f8c"/><text x="436.508" y="325.484" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="436.508" dy="0">8</tspan></text><rect x="475.564" y="296.144" width="70.112" height="97.8558" rx="3" fill="#946512"/><text x="510.62" y="290.144" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="510.62" dy="0">25</tspan></text><rect x="549.676" y="211.856" width="70.112" height="182.144" rx="3" fill="#c0432f"/><text x="584.732" y="205.856" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="584.732" dy="0">400</tspan></text><text x="510.62" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">1 % de picos de 2 s</tspan></text><rect x="674.372" y="266.894" width="70.112" height="127.106" rx="3" fill="#087f8c"/><text x="709.428" y="260.894" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="709.428" dy="0">65</tspan></text><rect x="748.484" y="162.928" width="70.112" height="231.072" rx="3" fill="#946512"/><text x="783.54" y="156.928" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="783.54" dy="0">2 000</tspan></text><rect x="822.596" y="162.928" width="70.112" height="231.072" rx="3" fill="#c0432f"/><text x="857.652" y="156.928" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.652" dy="0">2 000</tspan></text><text x="783.54" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="783.54" dy="0">5 % de picos de 2 s o 10 s</tspan></text><rect x="10" y="446" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con replicación síncrona la pérdida es 0, a cambio de 70 ms por escritura entre regiones. La media engaña: el percentil 99</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">con picos de 10 s es 2 000 escrituras. El caso que importa es el pico, y solo se ve provocándolo. 20 000 conmutaciones por</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">escenario y la distribución del retraso son supuestos del autor.</tspan></text><text x="470" y="551.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
