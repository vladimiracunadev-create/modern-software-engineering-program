<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 561" width="940" height="561" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Leer de una réplica justo después de escribir: fracción de lecturas obsoletas según el retraso de replicación</title><desc id="d">Línea con el porcentaje de lecturas que ven datos anteriores a la escritura de la misma persona según el retraso de la réplica: 10 por ciento con 5 milisegundos, 35 con 20, 85 con 100 y 99,9 con 500.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="561" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Leer de una réplica justo después de escribir: fracción de lecturas obsoletas según el retraso de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">replicación</tspan></text><line x1="78.62" y1="378" x2="910" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="378" x2="78.62" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="382.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="303" x2="910" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="303" x2="78.62" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="228" x2="910" y2="228" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="228" x2="78.62" y2="228" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="232.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="153" x2="910" y2="153" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="153" x2="78.62" y2="153" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="157.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="78" x2="910" y2="78" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="78" x2="78.62" y2="78" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="82.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="78" x2="78.62" y2="378" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="78" x2="96.62" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="378" x2="96.62" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">5</tspan></text><line x1="336.053" y1="78" x2="336.053" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="336.053" y1="378" x2="336.053" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="336.053" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="336.053" dy="0">20</tspan></text><line x1="614.027" y1="78" x2="614.027" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="614.027" y1="378" x2="614.027" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="614.027" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="614.027" dy="0">100</tspan></text><line x1="892" y1="78" x2="892" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="378" x2="892" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">500</tspan></text><line x1="78.62" y1="378" x2="910" y2="378" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 228)">Lecturas obsoletas (%)</text><text x="494.31" y="424" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Retraso de replicación (ms, escala logarítmica) (escala logarítmica)</tspan></text><polyline points="96.62,346.905 336.053,273.03 614.027,124.305 892,78.345" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="346.905" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="335.905" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">10</tspan></text><circle cx="336.053" cy="273.03" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="336.053" y="262.03" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="336.053" dy="0">35</tspan></text><circle cx="614.027" cy="124.305" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="614.027" y="113.305" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="614.027" dy="0">85</tspan></text><circle cx="892" cy="78.345" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="67.345" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100</tspan></text><rect x="10" y="438" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="462.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una réplica sana con 20 ms de retraso devuelve datos viejos a más de uno de cada tres lectores que leen dentro de 50 ms de</tspan></text><text x="470" y="479.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">su propia escritura. Es consistencia eventual en vigor, no una falla, y solo una prueba con retraso inyectado la distingue</tspan></text><text x="470" y="496.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de un defecto. El tiempo entre escritura y lectura (media de 50 ms) es un supuesto del autor.</tspan></text><text x="470" y="543.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
