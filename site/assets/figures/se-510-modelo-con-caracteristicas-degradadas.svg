13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="92.16" dy="0">exactitud de la regla sola</tspan></text><polyline points="104.16,151 261.728,182.5 498.08,244 892,301.5" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="104.16" cy="151" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="104.16" y="175" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">80,2</tspan></text><circle cx="261.728" cy="182.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="261.728" y="206.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="261.728" dy="0">78,7</tspan></text><circle cx="498.08" cy="244" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="498.08" y="268" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="498.08" dy="0">75,6</tspan></text><circle cx="892" cy="301.5" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="325.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">72,7</tspan></text><polyline points="104.16,151 261.728,199.5 498.08,262 892,373" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="98.66" y="145.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="104.16" y="175" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">80,2</tspan></text><rect x="256.228" y="194" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="261.728" y="223.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="261.728" dy="0">77,8</tspan></text><rect x="492.58" y="256.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="498.08" y="286" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="498.08" dy="0">74,7</tspan></text><rect x="886.5" y="367.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="397" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">69,2</tspan></text><polyline points="104.16,151 261.728,165 498.08,179 892,223.5" fill="none" stroke="#087f8c" stroke-width="2.4"/><polygon points="104.16,144.675 110.21,155.95 98.11,155.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="104.16" y="140" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">80,2</tspan></text><polygon points="261.728,158.675 267.778,169.95 255.678,169.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="261.728" y="154" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="261.728" dy="0">79,5</tspan></text><polygon points="498.08,172.675 504.13,183.95 492.03,183.95" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="498.08" y="168" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="498.08" dy="0">78,8</tspan></text><polygon points="892,217.175 898.05,228.45 885.95,228.45" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">76,6</tspan></text><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La falla es silenciosa: no hay error ni latencia, solo respuestas peores. Un valor obsoleto es el peor de los tres porque</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">parece válido. La regla de reserva, más simple que el modelo, pierde menos que ambas con la mitad afectada. La muestra de 4</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">000 peticiones y el modelo logístico de 6 características son sintéticos.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
