<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un modelo con el almacén de características degradado: exactitud según la fracción de peticiones afectadas y la política</title><desc id="d">Líneas con la exactitud del modelo según la fracción de peticiones con las dos características más informativas ausentes: con valor por omisión baja de 80,2 % a 72,7 % con la mitad afectada, con valores obsoletos a 69,2 % y con una regla de reserva a 76,6 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un modelo con el almacén de características degradado: exactitud según la fracción de peticiones afectadas y</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">la política</tspan></text><circle cx="22" cy="70" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Valor por omisión</tspan></text><rect x="192.18" y="64" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="212.18" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Valor obsoleto</tspan></text><polygon points="351.74,63.1 358.34,75.4 345.14,75.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="365.74" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="365.74" dy="0">Regla de reserva</tspan></text><line x1="86.16" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="406" x2="86.16" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">67,5</tspan></text><line x1="86.16" y1="356" x2="910" y2="356" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="356" x2="86.16" y2="356" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="360.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">70</tspan></text><line x1="86.16" y1="306" x2="910" y2="306" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="306" x2="86.16" y2="306" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="310.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">72,5</tspan></text><line x1="86.16" y1="256" x2="910" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="256" x2="86.16" y2="256" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">75</tspan></text><line x1="86.16" y1="206" x2="910" y2="206" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="206" x2="86.16" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="210.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">77,5</tspan></text><line x1="86.16" y1="156" x2="910" y2="156" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="156" x2="86.16" y2="156" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="160.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">80</tspan></text><line x1="86.16" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="106" x2="86.16" y2="1