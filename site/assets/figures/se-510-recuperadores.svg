<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" width="960" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres recuperadores sobre 835 fragmentos de las Partes 39 y 40 y 120 consultas sintéticas</title><desc id="d">Tabla con tres recuperadores sobre 835 fragmentos. Con consultas exactas BM25 acierta en primer lugar el 98,3 por ciento, el vector por trigramas el 65,0 y el híbrido el 85,0. Con erratas y raíces BM25 acierta el 75,0, el vector el 59,2 y el híbrido el 77,5; en los cinco primeros BM25 llega al 90,8, el vector al 77,5 y el híbrido al 90,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="495" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Consultas</tspan></text><rect x="210" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="372" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="372" dy="0">Recuperador</tspan></text><rect x="540" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="607" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="607" dy="0">Acierto en 1.º</tspan></text><rect x="680" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ff