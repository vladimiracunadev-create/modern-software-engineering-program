ight="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">77,5 %</tspan></text><rect x="820" y="272" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0,685</tspan></text><rect x="10" y="326" width="194" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="353.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Con erratas y raíces</tspan></text><rect x="210" y="326" width="324" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="372" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="372" dy="0">Híbrido por rango recíproco</tspan></text><rect x="540" y="326" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="607" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="607" dy="0">77,5 %</tspan></text><rect x="680" y="326" width="134" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">90,0 %</tspan></text><rect x="820" y="326" width="124" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="882" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="882" dy="0">0,829</tspan></text><rect x="10" y="384" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="408.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cómo leer la figura: el vector por trigramas no es un modelo semántico; es un sustituto que muestra el mecanismo denso sin</tspan></text><text x="480" y="425.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">descargar ningún modelo. Dónde deja de valer: las consultas salen del propio texto y favorecen la coincidencia léxica; con</tspan></text><text x="480" y="442.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">paráfrasis reales un modelo de embeddings cambiaría el orden.</tspan></text><text x="480" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código y corpus reales del repositorio; las consultas son sintéticas y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
