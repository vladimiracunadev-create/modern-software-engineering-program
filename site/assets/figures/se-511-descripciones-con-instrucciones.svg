<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 401" width="990" height="401" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué detecta un filtro de descripciones de herramientas y qué impone una máquina de estados de tareas</title><desc id="d">Tabla con tres pruebas. Un filtro por expresión regular sobre seis descripciones con instrucciones ocultas detecta tres y deja pasar tres; sobre seis descripciones benignas da una falsa alarma. Una máquina de estados de tarea rechaza 9 246 de 12 000 transiciones al azar y deja pasar 2 754 legales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="401" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Prueba</tspan></text><rect x="390" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="552" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="552" dy="0">Resultado</tspan></text><rect x="720" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Lectura</tspan></text><rect x="10" y="56" width="374" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="89.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Descripciones de herramienta con instrucciones</tspan></text><text x="197" y="105.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">ocultas (6 escritas)</tspan></text><rect x="390" y="56" width="324" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">El filtro por expresión regular detecta 3</tspan></text><text x="552" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">y deja pasar 3</tspan></text><rect x="720" y="56" width="254" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">Las paráfrasis y otros idiomas</tspan></text><text x="847" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">pasan</tspan></text><rect x="10" y="138" width="374" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="179.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Descripciones benignas (6 escritas)</tspan></text><rect x="390" y="138" width="324" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="171.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">1 falsa alarma por mencionar una frase de</tspan></text><text x="552" y="187.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">ataque</tspan></text><rect x="720" y="138" width="254" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="171.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">El filtro castiga el texto, no</tspan></text><text x="847" y="187.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">la intención</tspan></text><rect x="10" y="220" width="374" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="253.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Transiciones al azar de una tarea entre estados</tspan></text><text x="197" y="269.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">(12 000)</tspan></text><rect x="390" y="220" width="324" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="552" y="261.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="552" dy="0">2 754 legales y 9 246 rechazadas</tspan></text><rect x="720" y="220" width="254" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">La máquina de estados impide</tspan></text><text x="847" y="261.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">saltos que el protocolo no</tspan></text><text x="847" y="278.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">permite</tspan></text><rect x="10" y="306" width="970" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="495" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Cómo leer la figura: un filtro de texto es una capa y no una defensa; las transiciones sí se imponen por construcción. Dónde deja</tspan></text><text x="495" y="347.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">de valer: doce descripciones escritas por el autor; ningún servidor real ni agente de terceros se probó.</tspan></text><text x="495" y="387.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Experimento propio con la biblioteca estándar; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
