<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 488" width="940" height="488" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estructura de un día de práctica de 3 horas: quién hace qué y cuándo se puede abortar</title><desc id="d">Línea de tiempo en minutos con cuatro carriles: quien facilita, el equipo que responde, quien observa y la plataforma. Los primeros 30 minutos son de preparación y reglas, la inyección dura 60, el cierre y la retrospectiva ocupan 90 y hay una marca de aborto a los 75 minutos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="488" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estructura de un día de práctica de 3 horas: quién hace qué y cuándo se puede abortar</tspan></text><line x1="214" y1="83" x2="214" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="307" x2="214" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="330.333" y1="83" x2="330.333" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="330.333" y1="307" x2="330.333" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="330.333" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="330.333" dy="0">30</tspan></text><line x1="446.667" y1="83" x2="446.667" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="446.667" y1="307" x2="446.667" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="446.667" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="446.667" dy="0">60</tspan></text><line x1="563" y1="83" x2="563" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="563" y1="307" x2="563" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="563" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="563" dy="0">90</tspan></text><line x1="679.333" y1="83" x2="679.333" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="679.333" y1="307" x2="679.333" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="679.333" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="679.333" dy="0">120</tspan></text><line x1="795.667" y1="83" x2="795.667" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="795.667" y1="307" x2="795.667" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="795.667" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795.667" dy="0">150</tspan></text><line x1="912" y1="83" x2="912" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="307" x2="912" y2="312" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">180</tspan></text><line x1="214" y1="307" x2="912" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="115.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Quien facilita</tspan></text><text x="204" y="171.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Equipo que responde</tspan></text><text x="204" y="227.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Quien observa</tspan></text><text x="204" y="283.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Plataforma y condiciones</tspan></text><line x1="330.333" y1="75" x2="330.333" y2="307" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="330.333" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="330.333" dy="0">inicio de la falla</tspan></text><line x1="563" y1="75" x2="563" y2="307" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="563" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="563" dy="0">fin</tspan></text><rect x="214" y="92" width="116.333" height="38" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="272.167" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="272.167" dy="0">Reglas</tspan></text><rect x="330.333" y="92" width="232.667" height="38" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="446.667" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="446.667" dy="0">Inyecta y lleva el reloj</tspan></text><rect x="563" y="92" width="349" height="38" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="737.5" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737.5" dy="0">Retrospectiva</tspan></text><line x1="14" y1="139" x2="912" y2="139" stroke="#d5dde1" stroke-width="1"/><rect x="214" y="148" width="116.333" height="38" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="272.167" y="171.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="272.167" dy="0">Briefing</tspan></text><rect x="330.333" y="148" width="232.667" height="38" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="446.667" y="171.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="446.667" dy="0">Detecta, decide, repara</tspan></text><rect x="563" y="148" width="349" height="38" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="737.5" y="171.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737.5" dy="0">Hallazgos y acciones</tspan></text><line x1="14" y1="195" x2="912" y2="195" stroke="#d5dde1" stroke-width="1"/><rect x="214" y="204" width="116.333" height="38" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="272.167" y="227.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="272.167" dy="0">Qué ver</tspan></text><rect x="330.333" y="204" width="232.667" height="38" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="446.667" y="227.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="446.667" dy="0">Anota decisiones y tiempos</tspan></text><rect x="563" y="204" width="349" height="38" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="737.5" y="227.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737.5" dy="0">Línea de tiempo</tspan></text><line x1="14" y1="251" x2="912" y2="251" stroke="#d5dde1" stroke-width="1"/><rect x="214" y="260" width="116.333" height="38" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="272.167" y="283.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="272.167" dy="0">Verifica</tspan></text><rect x="330.333" y="260" width="232.667" height="38" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="446.667" y="283.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="446.667" dy="0">Falla inyectada</tspan></text><rect x="563" y="260" width="349" height="38" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="737.5" y="283.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737.5" dy="0">Restaura y comprueba</tspan></text><line x1="504.833" y1="83" x2="504.833" y2="307" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="509.833" y="96" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="509.833" dy="0">aborto si no hay control</tspan></text><text x="563" y="351" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="563" dy="0">Minutos desde el inicio</tspan></text><rect x="10" y="365" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="389.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El orden importa más que la duración: sin briefing el equipo no sabe qué es de verdad, sin anotador no hay evidencia y sin</tspan></text><text x="470" y="406.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">retrospectiva la práctica solo cansa. Un día de práctica es un experimento sobre las personas y sus procedimientos, no solo</tspan></text><text x="470" y="423.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sobre el sistema. Los tiempos son una plantilla, no una medición.</tspan></text><text x="470" y="470.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Plantilla de práctica; no es una medición.</tspan></text></svg>
