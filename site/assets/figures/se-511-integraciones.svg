<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 193" width="1040" height="193" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Conectores necesarios con y sin un protocolo común entre agentes y herramientas</title><desc id="d">Barras con los conectores necesarios para cuatro agentes y seis herramientas: a medida hacen falta 24 y con un protocolo común 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1040" height="193" fill="#ffffff"/><text x="424" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="424" dy="0">Integración a medida, 4 agentes por 6 herramientas</tspan></text><rect x="434" y="16" width="336" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="778" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="778" dy="0">24 conectores</tspan></text><text x="424" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="424" dy="0">Protocolo común, 4 clientes más 6 servidores</tspan></text><rect x="434" y="62" width="140" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="582" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="582" dy="0">10 adaptadores</tspan></text><rect x="10" y="110" width="1020" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="520" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">Cómo leer la figura: es aritmética, no una medición: el producto crece con ambos lados y la suma con cada uno. Dónde deja de valer: el</tspan></text><text x="520" y="151.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="520" dy="0">protocolo común añade un costo de seguridad y de versión que la aritmética no cuenta.</tspan></text></svg>
