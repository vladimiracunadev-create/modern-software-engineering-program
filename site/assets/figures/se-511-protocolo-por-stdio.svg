<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 567" width="990" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un servidor JSON-RPC por entrada y salida estándar en un proceso real: qué responde a cada mensaje</title><desc id="d">Tabla con seis mensajes a un servidor real de dos herramientas. initialize devuelve nombre y versión del servidor; tools/list devuelve dos herramientas con su esquema; tools/call con el curso c1 devuelve la fecha 2026-11-20 con una mediana de 0,10 milisegundos; un JSON roto devuelve el error -32700; un método inexistente y unos parámetros inválidos devuelven -32601 y -32602; y unos argumentos faltantes devuelven un resultado con isError verdadero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="567" fill="#ffffff"/><rect x="10" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="142" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="142" dy="0">Mensaje</tspan></text><rect x="280" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Respuesta observada</tspan></text><rect x="610" y="12" width="364" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="792" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="792" dy="0">Qué enseña</tspan></text><rect x="10" y="56" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">initialize</tspan></text><rect x="280" y="56" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Responde nombre y versión del servidor</tspan></text><rect x="610" y="56" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Primera llamada de cualquier sesión</tspan></text><rect x="10" y="122" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">tools/list</tspan></text><rect x="280" y="122" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Devuelve 2 herramientas con su esquema de</tspan></text><text x="442" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">entrada</tspan></text><rect x="610" y="122" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">El agente descubre qué puede hacer</tspan></text><rect x="10" y="188" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="221.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">tools/call con curso c1</tspan></text><rect x="280" y="188" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Devuelve la fecha 2026-11-20</tspan></text><rect x="610" y="188" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="213.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Mediana de 0,10 ms por ida y vuelta (reloj</tspan></text><text x="792" y="229.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">real)</tspan></text><rect x="10" y="254" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">JSON roto</tspan></text><rect x="280" y="254" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Error -32700</tspan></text><rect x="610" y="254" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">El servidor sigue vivo y responde al siguiente</tspan></text><rect x="10" y="320" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="345.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Método inexistente o parámetros</tspan></text><text x="142" y="361.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">inválidos</tspan></text><rect x="280" y="320" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Errores -32601 y -32602</tspan></text><rect x="610" y="320" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Fallo del protocolo, no de la herramienta</tspan></text><rect x="10" y="386" width="264" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="142" y="411.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">Faltan argumentos de la</tspan></text><text x="142" y="427.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="142" dy="0">herramienta</tspan></text><rect x="280" y="386" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="419.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Resultado con isError verdadero</tspan></text><rect x="610" y="386" width="364" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="792" y="411.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">Fallo de la herramienta, que el modelo puede</tspan></text><text x="792" y="427.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="792" dy="0">leer y corregir</tspan></text><rect x="10" y="456" width="970" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="480.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Cómo leer la figura: los tres primeros mensajes son la vida normal de una sesión y los tres últimos son los fallos que distinguen</tspan></text><text x="495" y="497.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">protocolo de herramienta. Dónde deja de valer: es un servidor de demostración con los nombres de métodos del Model Context</tspan></text><text x="495" y="514.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Protocol, no una implementación conforme de ninguna versión de su especificación.</tspan></text><text x="495" y="553.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Procesos, diario SQLite y mensajes reales en un directorio temporal; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
