<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde cabe el caos en el camino a producción: cada etapa responde una pregunta distinta y cuesta distinto</title><desc id="d">Diagrama con seis etapas de izquierda a derecha: lectura estática de la configuración en cada commit, pruebas de integración con un proxy de fallas en el pipeline, preproducción con tráfico sintético y fallas de plataforma, canario en producción con grupo experimental y control, producción con experimentos continuos y día de práctica; debajo, el costo y el riesgo crecen y el realismo también.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><rect x="10" y="20" width="172" height="40" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="96" y="43.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="96" dy="0">Commit</tspan></text><rect x="10" y="66" width="172" height="120" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="96" y="104.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96" dy="0">Lee la</tspan></text><text x="96" y="121.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96" dy="0">configuración:</tspan></text><text x="96" y="137.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96" dy="0">esperas, reintentos,</tspan></text><text x="96" y="154.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96" dy="0">cortacircuitos</tspan></text><rect x="10" y="194" width="172" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="96" y="214.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="96" dy="0">segundos</tspan></text><rect x="194" y="20" width="172" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="280" y="43.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="280" dy="0">Pipeline</tspan></text><rect x="194" y="66" width="172" height="120" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="280" y="113" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="280" dy="0">Servicio local y</tspan></text><text x="280" y="129.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="280" dy="0">proxy: latencia,</tspan></text><text x="280" y="146.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="280" dy="0">reinicio, silencio</tspan></text><rect x="194" y="194" width="172" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="280" y="214.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="280" dy="0">1-5 min</tspan></text><polyline points="186,40 196,40" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="378" y="20" width="172" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="464" y="43.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="464" dy="0">Preproducción</tspan></text><rect x="378" y="66" width="172" height="120" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="464" y="121.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="464" dy="0">Tráfico sintético y</tspan></text><text x="464" y="137.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="464" dy="0">fallas de plataforma</tspan></text><rect x="378" y="194" width="172" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="464" y="214.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="464" dy="0">10-60 min</tspan></text><polyline points="370,40 380,40" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="562" y="20" width="172" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="648" y="43.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="648" dy="0">Canario</tspan></text><rect x="562" y="66" width="172" height="120" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="648" y="113" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648" dy="0">5 % del tráfico:</tspan></text><text x="648" y="129.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648" dy="0">grupo experimental y</tspan></text><text x="648" y="146.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648" dy="0">control</tspan></text><rect x="562" y="194" width="172" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="648" y="214.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="648" dy="0">30-60 min</tspan></text><polyline points="554,40 564,40" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="746" y="20" width="172" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="43.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">Producción</tspan></text><rect x="746" y="66" width="172" height="120" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="113" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">Experimentos</tspan></text><text x="832" y="129.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">continuos con aborto</tspan></text><text x="832" y="146.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">y día de práctica</tspan></text><rect x="746" y="194" width="172" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="832" y="214.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="832" dy="0">continuo</tspan></text><polyline points="738,40 748,40" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="10,270 920,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">más realismo, más riesgo y más coste</tspan></text><rect x="10" y="292" width="440" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="230" y="317.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">Pregunta de las etapas tempranas: ¿está escrita la</tspan></text><text x="230" y="333.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="230" dy="0">protección?</tspan></text><rect x="480" y="292" width="450" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="317.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">Pregunta de las etapas tardías: ¿funciona con el tráfico y</tspan></text><text x="705" y="333.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">las dependencias reales?</tspan></text><rect x="10" y="366" width="920" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="389.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ninguna etapa sustituye a las demás: cada una atrapa regresiones que las otras no ven.</tspan></text></svg>
