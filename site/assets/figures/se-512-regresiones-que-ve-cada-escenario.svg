<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 581" width="940" height="581" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete cambios de configuración frente a cuatro escenarios de falla: en cuántas de 8 ejecuciones el escenario revela el cambio</title><desc id="d">Mapa de calor con el porcentaje de ejecuciones en que cada escenario hace fallar la configuración modificada: quitar el cortacircuitos o la alternativa se ve en los cuatro escenarios; los reintentos sin pausa solo con la dependencia lenta y sin respuesta; quitar la espera corta, cinco reintentos y el cortacircuitos sensible no se ven en ninguno; el cambio inocuo de un reintento menos no falla en ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="581" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Siete cambios de configuración frente a cuatro escenarios de falla: en cuántas de 8 ejecuciones el escenario</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">revela el cambio</tspan></text><text x="424.75" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="424.75" dy="0">30 % de errores</tspan></text><text x="566.25" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.25" dy="0">Lenta +100 ms</tspan></text><text x="707.75" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.75" dy="0">Mitad de hilos</tspan></text><text x="849.25" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="849.25" dy="0">Sin respuesta</tspan></text><text x="344" y="117.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">R1 se quita la espera corta (5 s)</tspan></text><text x="344" y="161.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">R2 reintentos sin pausa y espera de 1 s</tspan></text><text x="344" y="205.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">R3 se quita el cortacircuitos</tspan></text><text x="344" y="249.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">R4 se quita la alternativa</tspan></text><text x="344" y="285" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">R5 cortacircuitos sensible (50 % en 20</tspan></text><text x="344" y="302" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">intentos)</tspan></text><text x="344" y="337.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">R6 cinco reintentos</tspan></text><text x="344" y="381.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="344" dy="0">R7 cambio inocuo: un reintento menos</tspan></text><rect x="355.5" y="92.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="424.75" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="424.75" dy="0">0 %</tspan></text><rect x="497" y="92.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="566.25" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.25" dy="0">0 %</tspan></text><rect x="638.5" y="92.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="707.75" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.75" dy="0">0 %</tspan></text><rect x="780" y="92.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="849.25" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="849.25" dy="0">0 %</tspan></text><rect x="355.5" y="136.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="424.75" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="424.75" dy="0">0 %</tspan></text><rect x="497" y="136.5" width="138.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="566.25" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="566.25" dy="0">100 %</tspan></text><rect x="638.5" y="136.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="707.75" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.75" dy="0">0 %</tspan></text><rect x="780" y="136.5" width="138.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="849.25" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="849.25" dy="0">100 %</tspan></text><rect x="355.5" y="180.5" width="138.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="424.75" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="424.75" dy="0">100 %</tspan></text><rect x="497" y="180.5" width="138.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="566.25" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="566.25" dy="0">100 %</tspan></text><rect x="638.5" y="180.5" width="138.5" height="41" rx="4" fill="#d67f71" stroke="#ffffff" stroke-width="1"/><text x="707.75" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.75" dy="0">62 %</tspan></text><rect x="780" y="180.5" width="138.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="849.25" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="849.25" dy="0">100 %</tspan></text><rect x="355.5" y="224.5" width="138.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="424.75" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="424.75" dy="0">100 %</tspan></text><rect x="497" y="224.5" width="138.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="566.25" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="566.25" dy="0">100 %</tspan></text><rect x="638.5" y="224.5" width="138.5" height="41" rx="4" fill="#d67f71" stroke="#ffffff" stroke-width="1"/><text x="707.75" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.75" dy="0">62 %</tspan></text><rect x="780" y="224.5" width="138.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="849.25" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="849.25" dy="0">100 %</tspan></text><rect x="355.5" y="268.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="424.75" y="293.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="424.75" dy="0">0 %</tspan></text><rect x="497" y="268.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="566.25" y="293.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.25" dy="0">0 %</tspan></text><rect x="638.5" y="268.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="707.75" y="293.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.75" dy="0">0 %</tspan></text><rect x="780" y="268.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="849.25" y="293.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="849.25" dy="0">0 %</tspan></text><rect x="355.5" y="312.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="424.75" y="337.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="424.75" dy="0">0 %</tspan></text><rect x="497" y="312.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="566.25" y="337.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.25" dy="0">0 %</tspan></text><rect x="638.5" y="312.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="707.75" y="337.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.75" dy="0">0 %</tspan></text><rect x="780" y="312.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="849.25" y="337.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="849.25" dy="0">0 %</tspan></text><rect x="355.5" y="356.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="424.75" y="381.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="424.75" dy="0">0 %</tspan></text><rect x="497" y="356.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="566.25" y="381.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.25" dy="0">0 %</tspan></text><rect x="638.5" y="356.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="707.75" y="381.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.75" dy="0">0 %</tspan></text><rect x="780" y="356.5" width="138.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="849.25" y="381.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="849.25" dy="0">0 %</tspan></text><text x="354" y="425" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="354" dy="0">0 %</tspan></text><rect x="384.62" y="413" width="30.5" height="14" fill="#fbe4de"/><rect x="414.62" y="413" width="30.5" height="14" fill="#f3cdc5"/><rect x="444.62" y="413" width="30.5" height="14" fill="#eab6ac"/><rect x="474.62" y="413" width="30.5" height="14" fill="#e29f93"/><rect x="504.62" y="413" width="30.5" height="14" fill="#d9887a"/><rect x="534.62" y="413" width="30.5" height="14" fill="#d17161"/><rect x="564.62" y="413" width="30.5" height="14" fill="#c85a48"/><rect x="594.62" y="413" width="30.5" height="14" fill="#c0432f"/><text x="632.62" y="425" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="632.62" dy="0">100 %</tspan></text><text x="678.32" y="425" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="678.32" dy="0">más oscuro = mayor (Ejecuciones en que el escenario falla (%))</tspan></text><rect x="10" y="441" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="465.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Tres de seis regresiones dañinas no las ve ninguno de los cuatro escenarios, y la configuración sana no falla en ninguna de</tspan></text><text x="470" y="482.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las 8 ejecuciones de cada escenario. Un escenario solo ve el cambio que sabe expresar: el cortacircuitos sensible solo</tspan></text><text x="470" y="499.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">falla si se mide la calidad completa, no la respuesta. Ejecuciones de 60 s con 90 peticiones por segundo son supuestos del</tspan></text><text x="470" y="515.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autor.</tspan></text><text x="470" y="563.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
