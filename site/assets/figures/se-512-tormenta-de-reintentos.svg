<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 357" width="990" height="357" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil clientes sincronizados reintentan contra un servidor caído durante 5 segundos</title><desc id="d">Tabla con tres políticas de reintento de mil clientes sincronizados contra un servidor caído cinco segundos. Con intervalo fijo de un segundo hay 6 000 solicitudes y un pico de 1 000 por medio segundo, también tras la recuperación. Con retroceso exponencial sin aleatoriedad hay 4 000 solicitudes y los mismos picos de 1 000. Con jitter completo hay 5 061 solicitudes, un pico máximo de 1 552 en el primer instante y 145 tras la recuperación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="357" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Política de reintento</tspan></text><rect x="390" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Solicitudes totales</tspan></text><rect x="580" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Pico por 0,5 s</tspan></text><rect x="770" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Pico tras la</tspan></text><text x="872" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">recuperación</tspan></text><rect x="10" y="56" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Intervalo fijo de 1 s</tspan></text><rect x="390" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">6 000</tspan></text><rect x="580" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">1 000</tspan></text><rect x="770" y="56" width="204" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">1 000</tspan></text><rect x="10" y="118" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Retroceso exponencial sin aleatoriedad</tspan></text><rect x="390" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">4 000</tspan></text><rect x="580" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">1 000</tspan></text><rect x="770" y="118" width="204" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">1 000</tspan></text><rect x="10" y="180" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Retroceso exponencial con jitter completo</tspan></text><rect x="390" y="180" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">5 061</tspan></text><rect x="580" y="180" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">1 552</tspan></text><rect x="770" y="180" width="204" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">145</tspan></text><rect x="10" y="246" width="970" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="270.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cómo leer la figura: el retroceso exponencial reduce el volumen pero conserva la sincronía; solo la aleatoriedad reparte la carga</tspan></text><text x="495" y="287.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">de recuperación. Dónde deja de valer: clientes sincronizados desde el instante cero, sin límite de reintentos ni cola en el</tspan></text><text x="495" y="304.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">servidor.</tspan></text><text x="495" y="343.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Simulación propia con semilla fija; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
