<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 395" width="990" height="395" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Casos de la evaluación frente a falsos positivos y capacidad de detectar una mejora real de unos 4 puntos</title><desc id="d">Tabla con el número de casos de una evaluación pareada, los falsos positivos sin mejora real y la proporción de veces que detecta una mejora real de unos 4 puntos. Con 50 casos 5,6 por ciento y 10,1; con 100, 5,1 y 15,2; con 400, 4,8 y 37,2; con 1 600, 6,8 y 81,8.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="395" fill="#ffffff"/><rect x="10" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="87" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="87" dy="0">Casos</tspan></text><rect x="170" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357" dy="0">Falsos positivos sin mejora real</tspan></text><rect x="550" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="762" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="762" dy="0">Detecta una mejora real de 4 puntos</tspan></text><rect x="10" y="56" width="154" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">50</tspan></text><rect x="170" y="56" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">5,6 %</tspan></text><rect x="550" y="56" width="424" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="84.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">10,1 %</tspan></text><rect x="10" y="112" width="154" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="140.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">100</tspan></text><rect x="170" y="112" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">5,1 %</tspan></text><rect x="550" y="112" width="424" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="140.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">15,2 %</tspan></text><rect x="10" y="168" width="154" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="196.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">400</tspan></text><rect x="170" y="168" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">4,8 %</tspan></text><rect x="550" y="168" width="424" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="196.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">37,2 %</tspan></text><rect x="10" y="224" width="154" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="87" y="252.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="87" dy="0">1 600</tspan></text><rect x="170" y="224" width="374" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">6,8 %</tspan></text><rect x="550" y="224" width="424" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="762" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="762" dy="0">81,8 %</tspan></text><rect x="10" y="284" width="970" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="308.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cómo leer la figura: los falsos positivos se quedan cerca del 5 % que fija el umbral, pero con 100 casos la mejora real pasa</tspan></text><text x="495" y="325.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">desapercibida en 85 de cada 100 evaluaciones. Dónde deja de valer: 800 evaluaciones sintéticas por celda con semilla 13 y una</tspan></text><text x="495" y="342.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">prueba z de McNemar de una cola; otros diseños cambian la potencia.</tspan></text><text x="495" y="381.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
