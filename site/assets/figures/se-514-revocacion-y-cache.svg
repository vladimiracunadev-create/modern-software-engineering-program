<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Revocar una credencial cuando los clientes la guardan en caché: cuánto tiempo siguen autorizados según la vigencia de la caché</title><desc id="d">Líneas con la exposición media y la del percentil 99 en segundos tras revocar según la vigencia de la caché: 15 y 30 segundos con 30; 30 y 59 con 60; 150 y 295 con 300; 456 y 892 con 900; sin caché la exposición es 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Revocar una credencial cuando los clientes la guardan en caché: cuánto tiempo siguen autorizados según la</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">vigencia de la caché</tspan></text><circle cx="22" cy="70" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Exposición media</tspan></text><rect x="184.64" y="64" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="204.64" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Exposición del percentil 99</tspan></text><line x1="93.7" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="406" x2="93.7" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="256" x2="910" y2="256" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="256" x2="93.7" y2="256" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="106" x2="93.7" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="106" x2="93.7" y2="406" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="106" x2="111.7" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="406" x2="111.7" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">30</tspan></text><line x1="270.721" y1="106" x2="270.721" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="270.721" y1="406" x2="270.721" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="270.721" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="270.721" dy="0">60</tspan></text><line x1="639.957" y1="106" x2="639.957" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="639.957" y1="406" x2="639.957" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="639.957" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="639.957" dy="0">300</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">900</tspan></text><line x1="93.7" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Segundos autorizados tras revocar (escala logarítmica) (escala logarítmica)</text><text x="501.85" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Vigencia de la caché (s, escala logarítmica) (escala logarítmica)</tspan></text><polyline points="111.7,381.187 270.721,334.306 639.957,229.451 892,157.199" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="111.7" cy="381.187" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="111.7" y="405.187" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">15</tspan></text><circle cx="270.721" cy="334.306" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="270.721" y="358.306" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="270.721" dy="0">30</tspan></text><circle cx="639.957" cy="229.451" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="639.957" y="253.451" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="639.957" dy="0">150</tspan></text><circle cx="892" cy="157.199" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="181.199" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">456</tspan></text><polyline points="111.7,335.252 270.721,289.934 639.957,185.452 892,113.458" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="106.2" y="329.752" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="111.7" y="324.252" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">30</tspan></text><rect x="265.221" y="284.434" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="270.721" y="278.934" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="270.721" dy="0">59</tspan></text><rect x="634.457" y="179.952" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="639.957" y="174.452" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="639.957" dy="0">295</tspan></text><rect x="886.5" y="107.958" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="102.458" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">892</tspan></text><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La exposición máxima es la vigencia de la caché: lo que dice la política («acceso revocado de inmediato») y lo que ocurre</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">difieren en segundos o minutos, y solo un experimento que revoque y mida lo muestra. 2 000 clientes con 0,5 peticiones por</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">segundo y expiraciones uniformes son un supuesto del autor.</tspan></text><text x="470" y="571.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
