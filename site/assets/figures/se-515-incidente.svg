<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 295" width="990" height="295" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil solicitudes con un incidente del proveedor: política fija frente a degradación a un workflow</title><desc id="d">Tabla con mil solicitudes de las que las 300 a 600 sufren un 40 por ciento de errores del proveedor. Con agente fijo resuelve el 60,4 por ciento, hace 5,42 llamadas por solicitud, tiene un p95 de 24,9 segundos y degrada 0. Con degradación a un workflow resuelve el 70,7 por ciento, hace 3,67 llamadas, tiene un p95 de 13,7 segundos y degrada 420 solicitudes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="295" fill="#ffffff"/><rect x="10" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157" dy="0">Política</tspan></text><rect x="310" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="377" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="377" dy="0">Resueltas</tspan></text><rect x="450" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Llamadas por</tspan></text><text x="542" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">solicitud</tspan></text><rect x="640" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">p95 de latencia</tspan></text><rect x="810" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="892" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">Solicitudes</tspan></text><text x="892" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">degradadas</tspan></text><rect x="10" y="56" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Agente fijo</tspan></text><rect x="310" y="56" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">60,4 %</tspan></text><rect x="450" y="56" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">5,42</tspan></text><rect x="640" y="56" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">24,9 s</tspan></text><rect x="810" y="56" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0</tspan></text><rect x="10" y="118" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="157" dy="0">Con degradación a workflow</tspan></text><rect x="310" y="118" width="134" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="377" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377" dy="0">70,7 %</tspan></text><rect x="450" y="118" width="184" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">3,67</tspan></text><rect x="640" y="118" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">13,7 s</tspan></text><rect x="810" y="118" width="164" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">420</tspan></text><rect x="10" y="184" width="970" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="208.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Cómo leer la figura: degradar cuesta calidad en lo que el workflow no sabe hacer, pero corta la espera y el gasto en reintentos.</tspan></text><text x="495" y="225.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Dónde deja de valer: el interruptor abre con 6 fallos de las últimas 20 y se sondea cada 20 solicitudes; esos umbrales son del</tspan></text><text x="495" y="242.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">autor y el costo de la calidad perdida no está en la tabla.</tspan></text><text x="495" y="281.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
