<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 495" width="990" height="495" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Selector de patrón agéntico: seis de las ocho tareas con la decisión que toma el código</title><desc id="d">Tabla con seis situaciones y el patrón que elige el selector: pasos conocidos sin herramientas una llamada; con herramientas un workflow encadenado; con partes independientes un workflow paralelo; camino impredecible con presupuesto y tiempo amplios un agente; camino impredecible con poco presupuesto enrutamiento a un workflow; y acción irreversible sin aprobación una persona decide.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="495" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Situación de la tarea</tspan></text><rect x="570" y="12" width="404" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="772" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="772" dy="0">Patrón elegido</tspan></text><rect x="10" y="56" width="554" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="83.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Pasos conocidos, sin herramientas</tspan></text><rect x="570" y="56" width="404" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Una llamada</tspan></text><rect x="10" y="110" width="554" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="137.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Pasos conocidos con herramientas</tspan></text><rect x="570" y="110" width="404" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Workflow encadenado</tspan></text><rect x="10" y="164" width="554" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="191.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Pasos conocidos y partes independientes</tspan></text><rect x="570" y="164" width="404" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Workflow paralelo</tspan></text><rect x="10" y="218" width="554" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="245.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Camino impredecible, herramientas, presupuesto y tiempo amplios</tspan></text><rect x="570" y="218" width="404" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="245.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Agente</tspan></text><rect x="10" y="272" width="554" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Camino impredecible, pero poco presupuesto</tspan></text><rect x="570" y="272" width="404" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Enrutamiento a workflow</tspan></text><rect x="10" y="326" width="554" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="353.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Acción irreversible sin aprobación</tspan></text><rect x="570" y="326" width="404" height="48" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="772" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="772" dy="0">Persona decide</tspan></text><rect x="10" y="384" width="970" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="408.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cómo leer la figura: el selector coincide con la decisión escrita a mano en 8 de 8 tareas, dos de ellas no mostradas; la</tspan></text><text x="495" y="425.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">coincidencia prueba que la regla es consistente, no que sea correcta. Dónde deja de valer: las ocho tareas las escribió el autor</tspan></text><text x="495" y="442.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">al mismo tiempo que la regla.</tspan></text><text x="495" y="481.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Selector propio en Python; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
