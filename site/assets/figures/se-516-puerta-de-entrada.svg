<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 403" width="950" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Puerta de entrada a producción aplicada a cuatro candidatos del sistema de Avisos</title><desc id="d">Tabla con cuatro candidatos y una puerta de calidad de al menos 97 por ciento, tokens hasta 1 500, p95 hasta 20 segundos, ataques hasta 0,5 por ciento y envíos tras una caída hasta uno. El agente solo cumple la calidad pero no los tokens ni los ataques; el workflow solo no cumple la calidad ni los ataques; el híbrido sin gobierno no cumple los ataques ni los envíos duplicados; el híbrido gobernado cumple todo y pasa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="950" height="403" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Candidato</tspan></text><rect x="210" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="262" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="262" dy="0">Calidad</tspan></text><rect x="320" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="367" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="367" dy="0">Tokens</tspan></text><rect x="420" y="12" width="94" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="467" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467" dy="0">p95</tspan></text><rect x="520" y="12" width="114" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="577" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="577" dy="0">Ataques</tspan></text><rect x="640" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Envíos tras caída</tspan></text><rect x="810" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Puerta</tspan></text><rect x="10" y="56" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Agente solo</tspan></text><rect x="210" y="56" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="262" dy="0">97,5 %</tspan></text><rect x="320" y="56" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">1 862</tspan></text><rect x="420" y="56" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">18,0 s</tspan></text><rect x="520" y="56" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">19,23 %</tspan></text><rect x="640" y="56" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">2</tspan></text><rect x="810" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">NO PASA</tspan></text><rect x="10" y="114" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Workflow solo</tspan></text><rect x="210" y="114" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="262" dy="0">85,0 %</tspan></text><rect x="320" y="114" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">774</tspan></text><rect x="420" y="114" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">5,8 s</tspan></text><rect x="520" y="114" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">19,23 %</tspan></text><rect x="640" y="114" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">2</tspan></text><rect x="810" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">NO PASA</tspan></text><rect x="10" y="172" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Híbrido sin gobierno</tspan></text><rect x="210" y="172" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="262" dy="0">99,0 %</tspan></text><rect x="320" y="172" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">1 421</tspan></text><rect x="420" y="172" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">18,0 s</tspan></text><rect x="520" y="172" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">19,23 %</tspan></text><rect x="640" y="172" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">2</tspan></text><rect x="810" y="172" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">NO PASA</tspan></text><rect x="10" y="230" width="194" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="259.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Híbrido gobernado</tspan></text><rect x="210" y="230" width="104" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="262" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="262" dy="0">99,0 %</tspan></text><rect x="320" y="230" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="367" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367" dy="0">1 421</tspan></text><rect x="420" y="230" width="94" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="467" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="467" dy="0">18,0 s</tspan></text><rect x="520" y="230" width="114" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="577" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="577" dy="0">0,00 %</tspan></text><rect x="640" y="230" width="164" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">1</tspan></text><rect x="810" y="230" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">PASA</tspan></text><rect x="10" y="292" width="930" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="475" y="316.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">Cómo leer la figura: la puerta se decidió antes de medir y cada columna viene de un experimento de una clase anterior. Dónde</tspan></text><text x="475" y="333.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">deja de valer: los candidatos son configuraciones sintéticas; el p95 combina la cadena de 8 llamadas medida y no una</tspan></text><text x="475" y="350.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="475" dy="0">ejecución del sistema completo.</tspan></text><text x="475" y="389.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="475" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
