<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 533" width="940" height="533" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro experimentos de la especificación válida sobre el servicio de entregas con un grupo experimental de 5 %: respuestas correctas del grupo y del control</title><desc id="d">Barras con el porcentaje de peticiones respondidas en el grupo experimental y en el de control durante cada experimento: 100 y 100 por ciento con 30 por ciento de errores, con dependencia lenta y con mitad de los hilos; con la regresión R3 (sin cortacircuitos) frente a la falta de respuesta el grupo cae a 2,5 por ciento y el control sigue en 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="533" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro experimentos de la especificación válida sobre el servicio de entregas con un grupo experimental de 5</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">%: respuestas correctas del grupo y del control</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Grupo experimental</tspan></text><rect x="199.72" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="219.72" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Grupo de control</tspan></text><line x1="324" y1="96" x2="324" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="352" x2="324" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="96" x2="434.34" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="352" x2="434.34" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">20</tspan></text><line x1="544.68" y1="96" x2="544.68" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="352" x2="544.68" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">40</tspan></text><line x1="655.02" y1="96" x2="655.02" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="352" x2="655.02" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">60</tspan></text><line x1="765.36" y1="96" x2="765.36" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="352" x2="765.36" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">80</tspan></text><line x1="875.7" y1="96" x2="875.7" y2="352" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="352" x2="875.7" y2="357" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="373" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="324" y1="352" x2="875.7" y2="352" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="132.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">30 % de errores</tspan></text><text x="314" y="196.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Dependencia lenta +100 ms</tspan></text><text x="314" y="260.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Mitad de los hilos</tspan></text><text x="314" y="324.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Sin respuesta con la regresión r3</tspan></text><rect x="324" y="102" width="551.7" height="24.5" rx="3" fill="#c0432f"/><text x="882.7" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="324" y="129.5" width="551.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="324" y="166" width="551.7" height="24.5" rx="3" fill="#c0432f"/><text x="882.7" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="324" y="193.5" width="551.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="324" y="230" width="551.7" height="24.5" rx="3" fill="#c0432f"/><text x="882.7" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="324" y="257.5" width="551.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><rect x="324" y="294" width="13.627" height="24.5" rx="3" fill="#c0432f"/><text x="344.627" y="310.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="344.627" dy="0">2,5</tspan></text><rect x="324" y="321.5" width="551.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="338.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100,0</tspan></text><text x="599.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Peticiones respondidas (%)</tspan></text><rect x="10" y="410" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Tres hipótesis confirmadas y una refutada con 81 peticiones en el grupo: el daño de la refutación es de unas 79 peticiones</tspan></text><text x="470" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y el control demuestra que el resto del servicio no se enteró. Confirmar con 81 peticiones es una prueba débil: solo</tspan></text><text x="470" y="468.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">refutar es concluyente a este tamaño. Huella del conjunto de resultados: ab39c4838f72fc33.</tspan></text><text x="470" y="515.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
