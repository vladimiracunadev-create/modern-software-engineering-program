dy="0">36</tspan></text><rect x="354" y="550" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="566.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="577.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="594.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="614" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="630.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="641.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="658.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="678" width="2" height="24.5" rx="3" fill="#946512"/><text x="363" y="694.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><rect x="354" y="705.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="363" y="722.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><line x1="845.292" y1="96" x2="845.292" y2="736" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="850.292" y="109" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="850.292" dy="0">36</tspan></text><text x="626.94" y="780" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="626.94" dy="0">Mutaciones detectadas (de 36)</tspan></text><rect x="10" y="794" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="818.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Tres de diez tipos de error escapan a los dos validadores: nada en el documento dice si la métrica existe, si la hipótesis</tspan></text><text x="470" y="835.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">puede refutarse de verdad o si el calendario coincide con un cierre de plazo; eso lo dice una persona o un sistema que no</tspan></text><text x="470" y="852.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">está en el archivo. El validador detecta forma, no sabiduría.</tspan></text><text x="470" y="899.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija y tiempo virtual; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
