tspan></text><text x="344" y="324.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Duración de 3 h</tspan></text><text x="344" y="388.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Aborto más laxo que el estado estable</tspan></text><text x="344" y="452.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Umbral de estado estable de 0,3</tspan></text><text x="344" y="516.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Reversión que no es una orden</tspan></text><text x="344" y="580.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Métrica inexistente</tspan></text><text x="344" y="644.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Hipótesis no falsable</tspan></text><text x="344" y="708.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Ventana en hora punta</tspan></text><rect x="354" y="102" width="491.292" height="24.5" rx="3" fill="#946512"/><text x="852.292" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="852.292" dy="0">36</tspan></text><rect x="354" y="129.5" width="491.292" height="24.5" rx="3" fill="#087f8c"/><text x="852.292" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="852.292" dy="0">36</tspan></text><rect x="354" y="166" width="491.292" height="24.5" rx="3" fill="#946512"/><text x="852.292" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="852.292" dy="0">36</tspan></text><rect x="354" y="193.5" width="491.292" height="24.5" rx="3" fill="#087f8c"/><text x="852.292" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="852.292" dy="0">36</tspan></text><rect x="354" y="230" width="2" height="24.5" rx="3" fill="#9