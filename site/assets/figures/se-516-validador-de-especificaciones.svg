<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 917" width="940" height="917" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un validador de especificaciones de experimento frente a 360 mutaciones de diez tipos: lo que ve por forma y lo que ve por contenido</title><desc id="d">Barras horizontales con las mutaciones detectadas de 36 en cada tipo: un validador de forma detecta las 36 en quitar o vaciar un campo y 0 en las demás; un validador de contenido detecta además radio de 100 por ciento, duración de tres horas, aborto más laxo que el estado estable, umbral de 0,3 y reversión que no es una orden; ninguno detecta una métrica inexistente, una hipótesis no falsable ni una ventana en hora punta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="917" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un validador de especificaciones de experimento frente a 360 mutaciones de diez tipos: lo que ve por forma y</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">lo que ve por contenido</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Validador de forma</tspan></text><rect x="199.72" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="219.72" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Validador de contenido</tsp