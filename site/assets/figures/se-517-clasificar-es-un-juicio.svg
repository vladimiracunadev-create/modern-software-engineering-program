<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 338" width="940" height="338" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">600 solicitudes sintéticas: aciertos de un clasificador por palabras clave según sean claras o ambiguas</title><desc id="d">Barras apiladas horizontales con los aciertos de un clasificador por palabras clave sobre 600 solicitudes sintéticas: acierta las 456 claras y 74 de las 144 ambiguas, 88,3 por ciento en total; dos revisoras simuladas coinciden en el 76,8 por ciento con kappa 0,69, pero solo en el 34 por ciento de las ambiguas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="338" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">600 solicitudes sintéticas: aciertos de un clasificador por palabras clave según sean claras o ambiguas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Acierta el clasificador</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Falla</tspan></text><line x1="184" y1="77" x2="184" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="184" y1="157" x2="184" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="184" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="184" dy="0">0</tspan></text><line x1="322.34" y1="77" x2="322.34" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="322.34" y1="157" x2="322.34" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="322.34" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322.34" dy="0">100</tspan></text><line x1="460.68" y1="77" x2="460.68" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="460.68" y1="157" x2="460.68" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="460.68" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460.68" dy="0">200</tspan></text><line x1="599.02" y1="77" x2="599.02" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="599.02" y1="157" x2="599.02" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="599.02" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="599.02" dy="0">300</tspan></text><line x1="737.36" y1="77" x2="737.36" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="737.36" y1="157" x2="737.36" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="737.36" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.36" dy="0">400</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">500</tspan></text><line x1="184" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="174" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">Claras (456)</tspan></text><text x="174" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">Ambiguas (144)</tspan></text><rect x="184" y="84" width="630.83" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="499.415" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="499.415" dy="0">456</tspan></text><rect x="814.83" y="84" width="0" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="821.83" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="821.83" dy="0">456</tspan></text><rect x="184" y="124" width="102.372" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="235.186" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235.186" dy="0">74</tspan></text><rect x="286.372" y="124" width="96.838" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="334.791" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="334.791" dy="0">70</tspan></text><text x="390.21" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="390.21" dy="0">144</tspan></text><text x="529.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="529.85" dy="0">Solicitudes</tspan></text><rect x="10" y="215" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El acierto global del 88,3 % (530 de 600) esconde que una cuarta parte de la cartera es ambigua y que ahí el clasificador</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">acierta el 51 % y el acuerdo entre dos revisoras es del 34 % (76,8 % en total, kappa 0,69). Esas solicitudes necesitan una</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">conversación con quien las pidió. La proporción de ambiguas y las tasas de las revisoras son supuestos del autor.</tspan></text><text x="470" y="320.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
