<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 435" width="980" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro patrones creacionales: la fuerza que atacan y lo que se midió</title><desc id="d">Tabla con cuatro patrones creacionales, Factory con registro, Builder o argumentos con nombre, Singleton y Prototype, la fuerza que atacan y el resultado medido en el experimento: dos de cinco canales erróneos rechazados al crear, 500 de 500 llamadas posicionales aceptadas frente a 500 rechazadas con argumentos solo con nombre, 18 de 24 ordenaciones de pruebas fallidas con estado mutable y 1000 contaminados con copia superficial frente a 1 con copia profunda.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="435" fill="#ffffff"/><rect x="10" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="132" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="132" dy="0">Patrón</tspan></text><rect x="260" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="397" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="397" dy="0">Fuerza</tspan></text><rect x="540" y="12" width="424" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="752" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752" dy="0">Resultado medido</tspan></text><rect x="10" y="56" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Factory con registro</tspan></text><rect x="260" y="56" width="274" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Canal desconocido</tspan></text><rect x="540" y="56" width="424" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Rechaza al crear: 2 de 5 pedidos erróneos se detectan</tspan></text><text x="752" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">antes de enviar</tspan></text><rect x="10" y="126" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="153.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Builder / argumentos con</tspan></text><text x="132" y="169.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">nombre</tspan></text><rect x="260" y="126" width="274" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="153.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Argumentos del mismo tipo</tspan></text><text x="397" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">intercambiados</tspan></text><rect x="540" y="126" width="424" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="153.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">500 de 500 llamadas posicionales aceptadas; con kw_only</tspan></text><text x="752" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">se rechazan las 500</tspan></text><rect x="10" y="196" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Singleton</tspan></text><rect x="260" y="196" width="274" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Un único punto de acceso</tspan></text><rect x="540" y="196" width="424" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="223.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">18 de 24 ordenaciones de pruebas fallan con estado</tspan></text><text x="752" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">mutable</tspan></text><rect x="10" y="266" width="244" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="132" y="301.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="132" dy="0">Prototype</tspan></text><rect x="260" y="266" width="274" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="397" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">Copiar un objeto configurado</tspan></text><rect x="540" y="266" width="424" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="752" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752" dy="0">Superficial: 1000 contaminados; profunda: 1</tspan></text><rect x="10" y="340" width="960" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="364.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">En Python, argumentos con nombre y dataclasses sustituyen buena parte del Builder; el mecanismo del patrón sigue siendo útil en</tspan></text><text x="490" y="381.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">lenguajes sin ellos.</tspan></text><text x="490" y="421.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
