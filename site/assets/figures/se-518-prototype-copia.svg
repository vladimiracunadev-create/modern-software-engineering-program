<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 389" width="980" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Prototype: añadir un destinatario a un clon contamina a los demás si la copia es superficial</title><desc id="d">Tabla con tres formas de obtener 1000 avisos desde una plantilla: la copia superficial deja 1000 de 1000 clones afectados al añadir un destinatario a uno, la copia profunda deja 1 de 1000 con un coste de unos 11 microsegundos por copia, y construir desde cero deja 0 con unos 0,6 microsegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="389" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Forma</tspan></text><rect x="270" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="352" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="352" dy="0">Clones afectados</tspan></text><rect x="440" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Coste por copia</tspan></text><rect x="590" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="777" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777" dy="0">Qué ocurre</tspan></text><rect x="10" y="56" width="254" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="95.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Copia superficial (copy.copy)</tspan></text><rect x="270" y="56" width="164" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="95.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">1000 de 1000</tspan></text><rect x="440" y="56" width="144" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="95.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">≈1 µs</tspan></text><rect x="590" y="56" width="374" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="87.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Cada clon comparte la lista de destinatarios con</tspan></text><text x="777" y="103.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">la plantilla</tspan></text><rect x="10" y="134" width="254" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="173.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Copia profunda (copy.deepcopy)</tspan></text><rect x="270" y="134" width="164" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">1 de 1000</tspan></text><rect x="440" y="134" width="144" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="173.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">≈11 µs</tspan></text><rect x="590" y="134" width="374" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="165.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">Cada clon tiene su propia lista; cuesta unas 17</tspan></text><text x="777" y="181.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">veces más que construir</tspan></text><rect x="10" y="212" width="254" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="251.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Construir desde cero</tspan></text><rect x="270" y="212" width="164" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352" y="251.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352" dy="0">0 de 1000</tspan></text><rect x="440" y="212" width="144" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="251.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">≈0,6 µs</tspan></text><rect x="590" y="212" width="374" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="777" y="243.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">No hay plantilla compartida; hay que repetir los</tspan></text><text x="777" y="259.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777" dy="0">valores por defecto</tspan></text><rect x="10" y="294" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="318.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">La copia profunda corrige el defecto compartido y cuesta del orden de diez a veinte veces más que construir. Los tiempos son de</tspan></text><text x="490" y="335.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">un equipo y se dan como orden de magnitud.</tspan></text><text x="490" y="375.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
