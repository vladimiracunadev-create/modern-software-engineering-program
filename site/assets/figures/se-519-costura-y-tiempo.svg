<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">300 pruebas de nota_final con una dependencia de 2 ms y con una costura que la sustituye</title><desc id="d">Barras agrupadas en escala logarítmica con el tiempo de 300 pruebas de la función de nota final: con una dependencia de 2 milisegundos 771 en Windows y 701 en Ubuntu, y con una costura que la sustituye 0,34 y 0,40, unas 2 200 y 1 800 veces menos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="520" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">300 pruebas de nota_final con una dependencia de 2 ms y con una costura que la sustituye</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Con la dependencia</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Con costura</tspan></text><line x1="93.7" y1="345" x2="920" y2="345" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="345" x2="93.7" y2="345" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="349.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0,1</tspan></text><line x1="93.7" y1="282.5" x2="920" y2="282.5" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="282.5" x2="93.7" y2="282.5" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="287" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1</tspan></text><line x1="93.7" y1="220" x2="920" y2="220" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="220" x2="93.7" y2="220" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">10</tspan></text><line x1="93.7" y1="157.5" x2="920" y2="157.5" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="157.5" x2="93.7" y2="157.5" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="162" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">100</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="345" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">Tiempo de 300 pruebas (ms) (escala logarítmica)</text><rect x="135.015" y="102.059" width="163.26" height="242.941" rx="3" fill="#c0432f"/><text x="216.645" y="96.0591" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="216.645" dy="0">771</tspan></text><rect x="302.275" y="311.783" width="163.26" height="33.2174" rx="3" fill="#087f8c"/><text x="383.905" y="305.783" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="383.905" dy="0">0,34</tspan></text><text x="300.275" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300.275" dy="0">Windows 11 (CPython 3.12.9)</tspan></text><rect x="548.165" y="104.643" width="163.26" height="240.357" rx="3" fill="#c0432f"/><text x="629.795" y="98.6426" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="629.795" dy="0">701</tspan></text><rect x="715.425" y="307.371" width="163.26" height="37.6287" rx="3" fill="#087f8c"/><text x="797.055" y="301.371" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="797.055" dy="0">0,4</tspan></text><text x="713.425" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="713.425" dy="0">Ubuntu bajo WSL2 (3.12.3)</tspan></text><rect x="10" y="397" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="421.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La espera de 2 ms es un supuesto y los tiempos de reloj cambian de equipo en equipo; la razón de varios órdenes de magnitud</tspan></text><text x="470" y="438.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(unas 2 200 veces en Windows y 1 800 en Ubuntu) es la parte estable. La costura no prueba la dependencia real: queda</tspan></text><text x="470" y="455.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pendiente una prueba de integración.</tspan></text><text x="470" y="502.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
