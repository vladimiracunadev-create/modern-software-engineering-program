<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 307" width="980" height="307" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos órdenes de los mismos decoradores, 3000 peticiones con latencias lognormales</title><desc id="d">Tabla con dos órdenes de los mismos decoradores de plazo y reintento sobre 3000 peticiones con latencias lognormales de semilla fija: con el reintento por fuera y un plazo de 80 milisegundos por intento el éxito es 97,5 por ciento, el percentil 99 de latencia es 240 milisegundos y hay 1,37 llamadas al backend por petición; con un plazo total de 80 milisegundos por fuera de los reintentos el éxito es 71,2 por ciento, el percentil 99 es 80 milisegundos y hay 1,00 llamadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="307" fill="#ffffff"/><rect x="10" y="12" width="434" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="227" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="227" dy="0">Orden de los decoradores</tspan></text><rect x="450" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="517" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="517" dy="0">Éxito</tspan></text><rect x="590" y="12" width="164" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">Latencia p99</tspan></text><rect x="760" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="862" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="862" dy="0">Llamadas por petición</tspan></text><rect x="10" y="56" width="434" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Reintento por fuera, plazo de 80 ms por intento</tspan></text><rect x="450" y="56" width="134" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">97,5 %</tspan></text><rect x="590" y="56" width="164" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">240 ms</tspan></text><rect x="760" y="56" width="204" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">1,37</tspan></text><rect x="10" y="132" width="434" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="227" y="170.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="227" dy="0">Plazo total de 80 ms por fuera de los reintentos</tspan></text><rect x="450" y="132" width="134" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="517" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517" dy="0">71,2 %</tspan></text><rect x="590" y="132" width="164" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">80 ms</tspan></text><rect x="760" y="132" width="204" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862" dy="0">1,00</tspan></text><rect x="10" y="212" width="960" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="236.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Los mismos dos decoradores, apilados en otro orden, producen sistemas con políticas distintas: uno compra éxito con latencia y</tspan></text><text x="490" y="253.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">carga; el otro acota la latencia y pierde peticiones. El orden es una decisión de diseño, no un detalle.</tspan></text><text x="490" y="293.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
