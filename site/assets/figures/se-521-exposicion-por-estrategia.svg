<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 483" width="940" height="483" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Peticiones afectadas al migrar 40 rutas con 100 000 peticiones diarias y 10 % de rutas con regresión (2 000 historias)</title><desc id="d">Intervalos con las peticiones afectadas por regresiones, mediana y percentil 95, de tres estrategias de migración: el corte único 20 000 y 35 000 en 4 semanas, el escalonado al 5 por ciento 1 000 y 1 750 en 20 semanas y el escalonado con sombra previa 250 y 1 000 en 40 semanas; en las tres hay 4,0 regresiones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="483" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Peticiones afectadas al migrar 40 rutas con 100 000 peticiones diarias y 10 % de rutas con regresión (2 000</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">historias)</tspan></text><rect x="16" y="64" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">mediana</tspan></text><polygon points="122.78,63.1 129.38,75.4 116.18,75.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="136.78" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">p95</tspan></text><line x1="294" y1="96" x2="294" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="318" x2="294" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">100</tspan></text><line x1="492.667" y1="96" x2="492.667" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="492.667" y1="318" x2="492.667" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="492.667" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492.667" dy="0">1 000</tspan></text><line x1="691.333" y1="96" x2="691.333" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="691.333" y1="318" x2="691.333" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="691.333" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="691.333" dy="0">10 000</tspan></text><line x1="890" y1="96" x2="890" y2="318" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="318" x2="890" y2="323" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="339" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">100 000</tspan></text><line x1="294" y1="318" x2="890" y2="318" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="137.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Corte único (4 semanas)</tspan></text><text x="264" y="211.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Escalonado al 5 % (20 semanas)</tspan></text><text x="264" y="277" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Escalonado con sombra previa (40</tspan></text><text x="264" y="294" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">semanas)</tspan></text><line x1="751.138" y1="133" x2="799.422" y2="133" stroke="#8a9aa3" stroke-width="5"/><rect x="744.138" y="126" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="751.138" y="117" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="751.138" dy="0">20 000</tspan></text><polygon points="799.422,124.95 807.122,139.3 791.722,139.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="799.422" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="799.422" dy="0">35 000</tspan></text><line x1="492.667" y1="207" x2="540.95" y2="207" stroke="#8a9aa3" stroke-width="5"/><rect x="485.667" y="200" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="492.667" y="191" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="492.667" dy="0">1 000</tspan></text><polygon points="540.95,198.95 548.65,213.3 533.25,213.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="540.95" y="236" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="540.95" dy="0">1 750</tspan></text><line x1="373.057" y1="281" x2="492.667" y2="281" stroke="#8a9aa3" stroke-width="5"/><rect x="366.057" y="274" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="373.057" y="265" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="373.057" dy="0">250</tspan></text><polygon points="492.667,272.95 500.367,287.3 484.967,287.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="492.667" y="310" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="492.667" dy="0">1 000</tspan></text><text x="592" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="592" dy="0">Peticiones afectadas (escala logarítmica)</tspan></text><rect x="10" y="376" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="400.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La regresión ocurre las mismas 4,0 veces; cambia cuántas peticiones alcanza. El escalonado reduce el daño 20 veces a cambio</tspan></text><text x="470" y="417.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 5 veces más duración. El 10 %, los dos días hasta decidir y el 60 % de eficacia de la sombra son supuestos del autor.</tspan></text><text x="470" y="465.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
