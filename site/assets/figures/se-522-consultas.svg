<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 213" width="960" height="213" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Listar 200 entregas con el nombre de su curso: consultas ejecutadas</title><desc id="d">Gráfico de barras con el número de consultas a la base de datos al listar 200 entregas con el nombre de su curso: 201 con una consulta por entrega, el problema de las N más una consultas, y 1 con una sola consulta de lectura que une las dos tablas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="213" fill="#ffffff"/><text x="424" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="424" dy="0">Un repositorio que carga cada curso por separado</tspan></text><rect x="434" y="16" width="442.2" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="884.2" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="884.2" dy="0">201 consultas</tspan></text><text x="424" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="424" dy="0">Una consulta de lectura con unión</tspan></text><rect x="434" y="62" width="4" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="446" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="446" dy="0">1 consulta</tspan></text><rect x="10" y="110" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Un Repository que oculta la base oculta también el número de consultas. La medición sale de contar las sentencias con un</tspan></text><text x="480" y="151.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">gancho de sqlite3, no de suponerlas.</tspan></text><text x="480" y="199.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
