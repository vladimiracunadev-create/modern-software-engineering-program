<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres formas de poner el acceso a datos en el modelo y lo que se midió de cada una</title><desc id="d">Diagrama de tres formas de poner el acceso a datos en el modelo y lo medido: un doble en memoria de un repositorio ejecuta un caso en unos 11 microsegundos frente a unos 600 con sqlite, cerca de 50 veces; una Unit of Work deja 0 filas persistidas en lugar de 1 si el fallo ocurre a mitad; con Active Record la regla pura corre sin base y la que llama a save falla sin conexión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres formas de poner el acceso a datos en el modelo y lo que se midió de cada una</tspan></text><rect x="14" y="130.88" width="250" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="139" y="161.2" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="139" dy="0">Tres formas de acceso a datos</tspan></text><text x="139" y="177.84" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="139" dy="0">qué modelan y qué se midió</tspan></text><rect x="334" y="49" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="70.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Repository</tspan></text><text x="630" y="87.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">colección en memoria de agregados · doble de prueba ≈11 µs frente a sqlite</tspan></text><text x="630" y="104.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">≈600 µs por caso (≈50×)</tspan></text><polyline points="264,165.88 299,165.88 299,83.96 334,83.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="130.92" width="592" height="69.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="152.88" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="630" dy="0">Unit of Work</tspan></text><text x="630" y="169.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">una transacción por caso de uso · fallo a mitad: 0 filas persistidas en lugar</tspan></text><text x="630" y="186.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">de 1</tspan></text><polyline points="264,165.88 299,165.88 299,165.88 334,165.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="334" y="212.84" width="592" height="69.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="234.8" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="630" dy="0">Active Record</tspan></text><text x="630" y="251.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">la entidad sabe guardarse · la regla pura corre sin base; la que llama a save</tspan></text><text x="630" y="268.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">falla sin conexión</tspan></text><polyline points="264,165.88 299,165.88 299,247.8 334,247.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="296.76" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ambas formas de prueba son rápidas: la diferencia de 50 veces importa con miles de pruebas, no con decenas. Active Record</tspan></text><text x="470" y="338.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es una opción razonable cuando el modelo es casi las tablas; deja de serlo cuando la regla de negocio crece.</tspan></text><text x="470" y="386.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
