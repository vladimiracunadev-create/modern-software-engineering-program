<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 365" width="980" height="365" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres formas de poner el acceso a datos en el modelo y lo que se midió de cada una</title><desc id="d">Tabla con tres formas de acceso a datos, Repository, Unit of Work y Active Record, y lo medido: un doble en memoria de un repositorio ejecuta un caso en unos 11 microsegundos frente a unos 600 de sqlite en memoria, una unidad de trabajo deja 0 filas persistidas tras un fallo a mitad frente a 1 sin ella, y en Active Record la regla pura corre sin base pero la que llama a guardar falla sin conexión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="365" fill="#ffffff"/><rect x="10" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="107" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="107" dy="0">Patrón</tspan></text><rect x="210" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Qué modela</tspan></text><rect x="520" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Qué se midió</tspan></text><rect x="10" y="56" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Repository</tspan></text><rect x="210" y="56" width="304" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">Colección en memoria de agregados</tspan></text><rect x="520" y="56" width="444" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Doble de prueba ≈11 µs frente a sqlite ≈600 µs por caso</tspan></text><text x="742" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">(≈50×)</tspan></text><rect x="10" y="126" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Unit of Work</tspan></text><rect x="210" y="126" width="304" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">Una transacción por caso de uso</tspan></text><rect x="520" y="126" width="444" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Fallo a mitad: 0 filas persistidas en lugar de 1</tspan></text><rect x="10" y="196" width="194" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="107" y="231.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="107" dy="0">Active Record</tspan></text><rect x="210" y="196" width="304" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">La entidad sabe guardarse</tspan></text><rect x="520" y="196" width="444" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="223.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">La regla pura corre sin base; la que llama a save falla</tspan></text><text x="742" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">sin conexión</tspan></text><rect x="10" y="270" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Ambas formas de prueba son rápidas: la diferencia de 50 veces importa con miles de pruebas, no con decenas. Active Record es una</tspan></text><text x="490" y="311.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">opción razonable cuando el modelo es casi las tablas; deja de serlo cuando la regla de negocio crece.</tspan></text><text x="490" y="351.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
