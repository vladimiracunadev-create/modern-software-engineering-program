<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 419" width="980" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Unit of Work: sentencias UPDATE y atomicidad, medidas con sqlite3 en memoria</title><desc id="d">Tabla con cuatro medidas sobre una base sqlite3 en memoria: guardar todo lo cargado ejecuta 100 UPDATE aunque solo 3 de 100 entregas cambiaron, seguir los cambios ejecuta 3, una operación de dos pasos sin transacción que falla a mitad deja el primer paso persistido y la misma operación dentro de una transacción vuelve atrás y deja el estado pendiente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="419" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Variante</tspan></text><rect x="390" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="497" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">UPDATE o pasos</tspan></text><text x="497" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="497" dy="0">persistidos</tspan></text><rect x="610" y="12" width="354" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="787" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787" dy="0">Qué ocurre</tspan></text><rect x="10" y="56" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Guardar todo lo cargado</tspan></text><rect x="390" y="56" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">100</tspan></text><rect x="610" y="56" width="354" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Escribe 97 filas que no cambiaron</tspan></text><rect x="10" y="122" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Seguir los cambios (Unit of Work)</tspan></text><rect x="390" y="122" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">3</tspan></text><rect x="610" y="122" width="354" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Solo escribe las filas modificadas</tspan></text><rect x="10" y="188" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="221.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Dos pasos sin transacción, falla a mitad</tspan></text><rect x="390" y="188" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">1 persistido</tspan></text><rect x="610" y="188" width="354" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="213.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Queda a medias: estado «entregada» sin el</tspan></text><text x="787" y="229.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">segundo paso</tspan></text><rect x="10" y="254" width="374" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Dos pasos en una transacción, falla a mitad</tspan></text><rect x="390" y="254" width="214" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="497" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="497" dy="0">0 persistidos</tspan></text><rect x="610" y="254" width="354" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="787" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="787" dy="0">Vuelve atrás: estado «pendiente»</tspan></text><rect x="10" y="324" width="960" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">La unidad de trabajo agrupa lo que debe cambiar junto y lo que debe volver atrás junto. En SQL, la transacción es el mecanismo;</tspan></text><text x="490" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">el patrón es la disciplina de abrirla en un único lugar.</tspan></text><text x="490" y="405.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
