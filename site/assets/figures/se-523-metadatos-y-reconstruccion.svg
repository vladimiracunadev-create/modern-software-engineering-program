<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de cambios de esquema sobre 200 000 filas en SQLite</title><desc id="d">Barras horizontales en escala logarítmica con el tiempo de cuatro cambios de esquema sobre 200 000 filas en SQLite, en Windows y en Ubuntu: añadir una columna nula 0,37 y 0,34 milisegundos, reconstruir la tabla 74 y 92, rellenar con una sentencia 57 y 62, y rellenar por lotes de 2 000 60 y 151.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo de cambios de esquema sobre 200 000 filas en SQLite</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Windows 11 (SQLite 3.45.3)</tspan></text><rect x="260.04" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Ubuntu bajo WSL2 (SQLite 3.45.1)</tspan></text><line x1="274" y1="77" x2="274" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="333" x2="274" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0,1</tspan></text><line x1="426.44" y1="77" x2="426.44" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="426.44" y1="333" x2="426.44" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="426.44" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="426.44" dy="0">1</tspan></text><line x1="578.88" y1="77" x2="578.88" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="578.88" y1="333" x2="578.88" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="578.88" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="578.88" dy="0">10</tspan></text><line x1="731.32" y1="77" x2="731.32" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="731.32" y1="333" x2="731.32" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="731.32" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="731.32" dy="0">100</tspan></text><line x1="883.76" y1="77" x2="883.76" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="333" x2="883.76" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">1 000</tspan></text><line x1="274" y1="333" x2="883.76" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Añadir una columna nula</tspan></text><text x="264" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Reconstruir la tabla (copiar)</tspan></text><text x="264" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Rellenar con una sola sentencia</tspan></text><text x="264" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Rellenar por lotes de 2 000</tspan></text><rect x="274" y="83" width="86.6167" height="24.5" rx="3" fill="#946512"/><text x="367.617" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="367.617" dy="0">0,37</tspan></text><rect x="274" y="110.5" width="81.0186" height="24.5" rx="3" fill="#087f8c"/><text x="362.019" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="362.019" dy="0">0,34</tspan></text><rect x="274" y="147" width="437.386" height="24.5" rx="3" fill="#946512"/><text x="718.386" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="718.386" dy="0">74</tspan></text><rect x="274" y="174.5" width="451.8" height="24.5" rx="3" fill="#087f8c"/><text x="732.8" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="732.8" dy="0">92</tspan></text><rect x="274" y="211" width="420.106" height="24.5" rx="3" fill="#946512"/><text x="701.106" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="701.106" dy="0">57</tspan></text><rect x="274" y="238.5" width="425.672" height="24.5" rx="3" fill="#087f8c"/><text x="706.672" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="706.672" dy="0">62</tspan></text><rect x="274" y="275" width="423.501" height="24.5" rx="3" fill="#946512"/><text x="704.501" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="704.501" dy="0">60</tspan></text><rect x="274" y="302.5" width="484.603" height="24.5" rx="3" fill="#087f8c"/><text x="765.603" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="765.603" dy="0">151</tspan></text><text x="578.88" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="578.88" dy="0">Tiempo (ms) (escala logarítmica)</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Añadir una columna es un cambio de metadatos y reconstruir la tabla cuesta cientos de veces más (200 y 267 veces). Rellenar</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por lotes cuesta 1,05 y 2,44 veces la sentencia única. SQLite es una base embebida en memoria; otros motores tienen reglas</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">distintas. Los tiempos de reloj cambian de equipo en equipo.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
