<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 561" width="940" height="561" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Relleno de 200 000 filas con 50 escrituras por segundo concurrentes: duración del relleno frente a espera de una escritura</title><desc id="d">Línea en escala logarítmica con la duración del relleno y la espera en el percentil 99 de una escritura concurrente según el tamaño de lote: con 200 000 filas dura 4,0 segundos y la escritura espera 3 969 milisegundos; con 20 000, 4,2 s y 400 ms; con 2 000, 6,5 s y 44 ms; con 200, 29,0 s y 8,7 ms; con 20, 254,0 s y 5,1 ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="561" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Relleno de 200 000 filas con 50 escrituras por segundo concurrentes: duración del relleno frente a espera de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">una escritura</tspan></text><line x1="101.24" y1="378" x2="910" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="378" x2="101.24" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="382.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="303" x2="910" y2="303" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="303" x2="101.24" y2="303" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="307.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="228" x2="910" y2="228" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="228" x2="101.24" y2="228" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="232.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="153" x2="910" y2="153" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="153" x2="101.24" y2="153" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="157.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="78" x2="910" y2="78" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="78" x2="101.24" y2="78" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="82.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="78" x2="101.24" y2="378" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="78" x2="119.24" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="378" x2="119.24" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">1</tspan></text><line x1="376.827" y1="78" x2="376.827" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="376.827" y1="378" x2="376.827" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="376.827" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="376.827" dy="0">10</tspan></text><line x1="634.413" y1="78" x2="634.413" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="634.413" y1="378" x2="634.413" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="634.413" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="634.413" dy="0">100</tspan></text><line x1="892" y1="78" x2="892" y2="378" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="378" x2="892" y2="383" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="399" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1000</tspan></text><line x1="101.24" y1="378" x2="910" y2="378" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 228)">Espera p99 de una escritura (ms) (escala logarítmica)</text><text x="505.62" y="424" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Duración del relleno (s) (escala logarítmica)</tspan></text><polyline points="274.323,108.099 279.781,182.846 328.636,254.741 495.934,307.536 738.693,324.932" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="274.323" cy="108.099" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="274.323" y="97.0989" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="274.323" dy="0">200 000</tspan></text><circle cx="279.781" cy="182.846" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="289.781" y="187.346" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="289.781" dy="0">20 000</tspan></text><circle cx="328.636" cy="254.741" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="338.636" y="259.241" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="338.636" dy="0">2 000</tspan></text><circle cx="495.934" cy="307.536" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="505.934" y="312.036" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="505.934" dy="0">200</tspan></text><circle cx="738.693" cy="324.932" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="738.693" y="313.932" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="738.693" dy="0">20</tspan></text><rect x="10" y="438" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="462.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un lote pequeño casi no hace esperar a las escrituras y alarga el relleno por el costo fijo de cada lote (el bloqueo por</tspan></text><text x="470" y="479.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lote va de 4 005 ms a 5,4 ms). Los costos de 0,02 ms por fila y 5 ms por lote, la pausa de 20 ms y las llegadas Poisson son</tspan></text><text x="470" y="496.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">supuestos del autor.</tspan></text><text x="470" y="543.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
