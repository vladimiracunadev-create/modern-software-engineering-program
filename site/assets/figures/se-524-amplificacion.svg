<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 213" width="960" height="213" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Intentos al servicio por cada petición del usuario en el peor caso</title><desc id="d">Gráfico de barras con los intentos al servicio por petición del usuario en el peor caso: 27 con tres capas que reintentan tres veces cada una y 1,33 con un presupuesto de reintentos del diez por ciento por capa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="213" fill="#ffffff"/><text x="364" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="364" dy="0">3 capas × 3 intentos</tspan></text><rect x="374" y="16" width="648" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="1030" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1030" dy="0">27</tspan></text><text x="364" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="364" dy="0">Presupuesto del 10 % por capa</tspan></text><rect x="374" y="62" width="31.944" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="413.944" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="413.944" dy="0">1,33</tspan></text><rect x="10" y="110" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">La amplificación es multiplicativa: tres capas con tres intentos convierten una petición en veintisiete. Un presupuesto de</tspan></text><text x="480" y="151.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">reintentos acota la suma de los reintentos, no cada llamada.</tspan></text><text x="480" y="199.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
