<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil clientes reintentan tras una caída de un segundo: cuatro políticas de espera</title><desc id="d">Barras agrupadas con el pico de peticiones por 100 milisegundos y los clientes abandonados de mil que reintentan tras una caída de un segundo: el intervalo fijo llega a 1 000 y abandonan 880; el exponencial sin jitter llega a 1 000 y abandonan 520; con jitter completo el pico baja a 537 y con jitter equilibrado a 759, y nadie abandona.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mil clientes reintentan tras una caída de un segundo: cuatro políticas de espera</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pico de peticiones por 100 ms</tspan></text><rect x="282.66" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Clientes abandonados</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="305" x2="93.7" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">250</tspan></text><line x1="93.7" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="235" x2="93.7" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="165" x2="93.7" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">750</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Peticiones por 100 ms o clientes, de 1 000</text><rect x="114.357" y="95" width="80.63" height="280" rx="3" fill="#c0432f"/><text x="154.672" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.672" dy="0">1 000</tspan></text><rect x="198.987" y="128.6" width="80.63" height="246.4" rx="3" fill="#946512"/><text x="239.302" y="122.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="239.302" dy="0">880</tspan></text><text x="196.987" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.987" dy="0">Intervalo fijo de 100 ms</tspan></text><rect x="320.933" y="95" width="80.63" height="280" rx="3" fill="#c0432f"/><text x="361.248" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="361.248" dy="0">1 000</tspan></text><rect x="405.562" y="229.4" width="80.63" height="145.6" rx="3" fill="#946512"/><text x="445.877" y="223.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="445.877" dy="0">520</tspan></text><text x="403.562" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="403.562" dy="0">Exponencial sin jitter</tspan></text><rect x="527.507" y="224.64" width="80.63" height="150.36" rx="3" fill="#c0432f"/><text x="567.822" y="218.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="567.822" dy="0">537</tspan></text><rect x="612.137" y="373" width="80.63" height="2" rx="3" fill="#946512"/><text x="652.452" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="652.452" dy="0">0</tspan></text><text x="610.137" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">Exponencial con jitter</tspan></text><text x="610.137" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.137" dy="0">completo</tspan></text><rect x="734.082" y="162.48" width="80.63" height="212.52" rx="3" fill="#c0432f"/><text x="774.398" y="156.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="774.398" dy="0">759</tspan></text><rect x="818.712" y="373" width="80.63" height="2" rx="3" fill="#946512"/><text x="859.027" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="859.027" dy="0">0</tspan></text><text x="816.712" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">Exponencial con jitter</tspan></text><text x="816.712" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="816.712" dy="0">equilibrado</tspan></text><rect x="10" y="444" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin jitter, los clientes siguen sincronizados y repiten el pico cada ronda. El jitter reparte la carga y todos terminan; la</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">variante fija no gana: abandona 880 clientes tras 12 intentos. Un tope de intentos igual para todas permite comparar.</tspan></text><text x="470" y="533.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
