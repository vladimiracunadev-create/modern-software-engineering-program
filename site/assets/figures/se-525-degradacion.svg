<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 213" width="960" height="213" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Respuestas útiles con una dependencia caída el 40 % del tiempo</title><desc id="d">Gráfico de barras con el porcentaje de respuestas útiles cuando una dependencia está caída el 40 por ciento del tiempo: 60,0 por ciento sin degradación y 87,5 por ciento con una respuesta degradada desde una caché obsoleta que acierta el 70 por ciento de las veces.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="213" fill="#ffffff"/><text x="384" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="384" dy="0">Sin degradación</tspan></text><rect x="394" y="16" width="480" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="882" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882" dy="0">60,0 %</tspan></text><text x="384" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="384" dy="0">Con caché obsoleta como respaldo</tspan></text><rect x="394" y="62" width="700" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1102" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1102" dy="0">87,5 %</tspan></text><rect x="10" y="110" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La degradación cambia la pregunta de «¿funciona?» a «¿qué parte del valor se conserva?». Devolver un dato viejo es una</tspan></text><text x="480" y="151.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">decisión de producto: hay que decir cuánto de viejo es aceptable y avisar a la persona usuaria.</tspan></text><text x="480" y="199.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
