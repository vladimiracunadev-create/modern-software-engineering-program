<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 279" width="980" height="279" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo de un salto adicional (ambassador o sidecar) medido con sockets locales</title><desc id="d">Tabla con la mediana de una petición y su respuesta por sockets locales: unos 61 microsegundos directo del cliente al servidor y unos 122 microsegundos a través de un intermediario, aproximadamente el doble, con 2000 repeticiones tras 100 de calentamiento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="279" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Camino</tspan></text><rect x="390" y="12" width="294" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="537" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537" dy="0">Mediana por petición-respuesta</tspan></text><rect x="690" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Lectura</tspan></text><rect x="10" y="56" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Cliente → servidor (directo)</tspan></text><rect x="390" y="56" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">≈61 µs</tspan></text><rect x="690" y="56" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Línea base</tspan></text><rect x="10" y="118" width="374" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Cliente → ambassador → servidor</tspan></text><rect x="390" y="118" width="294" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="537" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="537" dy="0">≈122 µs</tspan></text><rect x="690" y="118" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">Un salto más, ≈2 veces</tspan></text><rect x="10" y="184" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="208.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El sidecar o el ambassador sacan reintentos, TLS o métricas de la aplicación al precio de un salto. En una red real el salto se</tspan></text><text x="490" y="225.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">mide en milisegundos y en el mismo equipo en decenas de microsegundos; esta cifra es de un equipo y de un protocolo trivial.</tspan></text><text x="490" y="265.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
