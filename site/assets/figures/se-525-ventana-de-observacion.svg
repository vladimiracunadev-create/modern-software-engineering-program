<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">200 consumidores (194 reales) observados con distintas ventanas: cuántos reales se declararían «sin uso»</title><desc id="d">Barras con los consumidores reales, de 194, que se declararían sin uso según la ventana de observación: 54,9 con 7 días, 26,2 con 30, 10,5 con 91, 7,1 con 180 y ninguno con 365 y 400 días.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="492" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">200 consumidores (194 reales) observados con distintas ventanas: cuántos reales se declararían «sin uso»</tspan></text><line x1="71.08" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="317" x2="71.08" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="233.667" x2="920" y2="233.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="233.667" x2="71.08" y2="233.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="238.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="150.333" x2="920" y2="150.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="150.333" x2="71.08" y2="150.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="154.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">Consumidores reales declarados «sin uso»</text><rect x="85.2287" y="88.25" width="113.189" height="228.75" rx="3" fill="#c0432f"/><text x="141.823" y="82.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="141.823" dy="0">54,9</tspan></text><text x="141.823" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="141.823" dy="0">7 días</tspan></text><rect x="226.715" y="207.833" width="113.189" height="109.167" rx="3" fill="#c0432f"/><text x="283.31" y="201.833" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="283.31" dy="0">26,2</tspan></text><text x="283.31" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">30 días</tspan></text><rect x="368.202" y="273.25" width="113.189" height="43.75" rx="3" fill="#c0432f"/><text x="424.797" y="267.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="424.797" dy="0">10,5</tspan></text><text x="424.797" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="424.797" dy="0">91 días</tspan></text><rect x="509.689" y="287.417" width="113.189" height="29.5833" rx="3" fill="#c0432f"/><text x="566.283" y="281.417" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="566.283" dy="0">7,1</tspan></text><text x="566.283" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="566.283" dy="0">180 días</tspan></text><rect x="651.175" y="315" width="113.189" height="2" rx="3" fill="#c0432f"/><text x="707.77" y="309" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.77" dy="0">0</tspan></text><text x="707.77" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">365 días</tspan></text><rect x="792.662" y="315" width="113.189" height="2" rx="3" fill="#c0432f"/><text x="849.257" y="309" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="849.257" dy="0">0</tspan></text><text x="849.257" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="849.257" dy="0">400 días</tspan></text><rect x="10" y="369" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La fracción de los 194 va del 28 % (7 días) al 14, 5, 4 y 0 %. Solo una ventana que cubra el ciclo más largo conocido ve a</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">todos; un consumidor bianual que no esté en el inventario no lo vería ni la de 400 días. La mezcla de periodicidades es un</tspan></text><text x="470" y="427.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">supuesto del autor.</tspan></text><text x="470" y="474.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
