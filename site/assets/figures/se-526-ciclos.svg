<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 353" width="960" height="353" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un ciclo de dependencias entre tres módulos y cómo se rompe</title><desc id="d">Diagrama de dos filas: en la primera, los módulos avisos, cursos y usuarios se dependen entre sí en un ciclo de tres; en la segunda, los tres dependen de un módulo de dominio común y no se dependen entre sí, y el análisis de componentes fuertemente conexos devuelve un ciclo antes y ninguno después.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="353" fill="#ffffff"/><rect x="10" y="14" width="448" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="234" y="49" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="234" dy="0">avisos → cursos, usuarios</tspan></text><text x="234" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="234" dy="0">cursos → usuarios, avisos</tspan></text><text x="234" y="82.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="234" dy="0">usuarios → cursos</tspan></text><rect x="502" y="14" width="448" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="726" y="65.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="726" dy="0">Tarjan: 1 componente de tamaño 3</tspan></text><polyline points="458,62 502,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="150" width="448" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="234" y="185" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="234" dy="0">avisos → dominio</tspan></text><text x="234" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="234" dy="0">cursos → dominio</tspan></text><text x="234" y="218.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="234" dy="0">usuarios → dominio</tspan></text><rect x="502" y="150" width="448" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="726" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="726" dy="0">Tarjan: 0 ciclos</tspan></text><polyline points="458,198 502,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="726,110 726,130 234,130 234,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="260" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="284.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Un ciclo impide cambiar, probar o desplegar un módulo sin los demás. Se rompe extrayendo lo compartido a un módulo del que</tspan></text><text x="480" y="301.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">todos dependan, no moviendo la dependencia de lugar.</tspan></text><text x="480" y="343.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
