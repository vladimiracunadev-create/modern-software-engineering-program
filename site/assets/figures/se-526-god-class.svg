<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una clase con demasiadas razones para cambiar, medida antes y después de separarla</title><desc id="d">Barras agrupadas con una clase de servicio de 10 métodos y 8 dependencias en la que 37 de 45 pares de métodos no comparten estado, y las tres clases en que se separa: Registro tiene 2 métodos, 1 dependencia y 0 de 1 pares sin estado compartido; Notificador 2, 3 y 0 de 1; Migración 3, 1 y 0 de 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una clase con demasiadas razones para cambiar, medida antes y después de separarla</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Métodos</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Dependencias</tspan></text><rect x="255.26" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="275.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="275.26" dy="0">Pares sin estado compartido</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="305" x2="71.08" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="235" x2="71.08" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="165" x2="71.08" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Métodos, dependencias o pares</text><rect x="92.303" y="305" width="53.928" height="70" rx="3" fill="#6b7c86"/><text x="119.267" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="119.267" dy="0">10</tspan></text><rect x="150.231" y="319" width="53.928" height="56" rx="3" fill="#946512"/><text x="177.195" y="313" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177.195" dy="0">8</tspan></text><rect x="208.159" y="116" width="53.928" height="259" rx="3" fill="#c0432f"/><text x="235.123" y="110" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="235.123" dy="0">37</tspan></text><text x="177.195" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">Servicio (antes)</tspan></text><rect x="304.533" y="361" width="53.928" height="14" rx="3" fill="#6b7c86"/><text x="331.497" y="355" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="331.497" dy="0">2</tspan></text><rect x="362.461" y="368" width="53.928" height="7" rx="3" fill="#946512"/><text x="389.425" y="362" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="389.425" dy="0">1</tspan></text><rect x="420.389" y="373" width="53.928" height="2" rx="3" fill="#c0432f"/><text x="447.353" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="447.353" dy="0">0</tspan></text><text x="389.425" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">Registro</tspan></text><rect x="516.763" y="361" width="53.928" height="14" rx="3" fill="#6b7c86"/><text x="543.727" y="355" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="543.727" dy="0">2</tspan></text><rect x="574.691" y="354" width="53.928" height="21" rx="3" fill="#946512"/><text x="601.655" y="348" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.655" dy="0">3</tspan></text><rect x="632.619" y="373" width="53.928" height="2" rx="3" fill="#c0432f"/><text x="659.583" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="659.583" dy="0">0</tspan></text><text x="601.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">Notificador</tspan></text><rect x="728.993" y="354" width="53.928" height="21" rx="3" fill="#6b7c86"/><text x="755.957" y="348" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="755.957" dy="0">3</tspan></text><rect x="786.921" y="368" width="53.928" height="7" rx="3" fill="#946512"/><text x="813.885" y="362" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="813.885" dy="0">1</tspan></text><rect x="844.849" y="373" width="53.928" height="2" rx="3" fill="#c0432f"/><text x="871.813" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="871.813" dy="0">0</tspan></text><text x="813.885" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">Migración</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La complejidad ciclomática máxima no cambia (4 antes, 4 después): la clase grande no era difícil por sus ramas sino por sus</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">razones de cambio. Elegir la métrica equivocada habría declarado sano un diseño enfermo.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
