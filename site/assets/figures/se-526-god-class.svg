<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 363" width="980" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una clase con demasiadas razones para cambiar, medida antes y después de separarla</title><desc id="d">Tabla con una clase de servicio de diez métodos y ocho dependencias en la que 37 de 45 pares de métodos no comparten estado, y las tres clases en que se separa, Registro, Notificador y Migración, con 2, 2 y 3 métodos y ningún par sin estado compartido; la complejidad ciclomática máxima por función es 4 antes y 4 después.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="363" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Clase</tspan></text><rect x="320" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="392" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392" dy="0">Métodos</tspan></text><rect x="470" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="562" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562" dy="0">Dependencias</tspan></text><rect x="660" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="812" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812" dy="0">Pares sin estado compartido</tspan></text><rect x="10" y="56" width="304" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="82.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Servicio (antes)</tspan></text><rect x="320" y="56" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">10</tspan></text><rect x="470" y="56" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">8</tspan></text><rect x="660" y="56" width="304" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">37 de 45</tspan></text><rect x="10" y="108" width="304" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="134.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Registro</tspan></text><rect x="320" y="108" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">2</tspan></text><rect x="470" y="108" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">1</tspan></text><rect x="660" y="108" width="304" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="134.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0 de 1</tspan></text><rect x="10" y="160" width="304" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="186.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Notificador</tspan></text><rect x="320" y="160" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">2</tspan></text><rect x="470" y="160" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">3</tspan></text><rect x="660" y="160" width="304" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0 de 1</tspan></text><rect x="10" y="212" width="304" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">Migración</tspan></text><rect x="320" y="212" width="144" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="392" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="392" dy="0">3</tspan></text><rect x="470" y="212" width="184" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="562" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562" dy="0">1</tspan></text><rect x="660" y="212" width="304" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="812" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812" dy="0">0 de 3</tspan></text><rect x="10" y="268" width="960" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">La complejidad ciclomática máxima no cambia (4 antes, 4 después): la clase grande no era difícil por sus ramas sino por sus</tspan></text><text x="490" y="309.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">razones de cambio. Elegir la métrica equivocada habría declarado sano un diseño enfermo.</tspan></text><text x="490" y="349.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
