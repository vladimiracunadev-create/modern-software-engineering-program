-weight="400" fill="#4a3209"><tspan x="470" dy="0">predice un proyecto. Medir el interés real exige tiempos de cambio de un equipo.</tspan></text><text x="470" y="536.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
