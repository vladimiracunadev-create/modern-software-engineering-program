<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 295" width="980" height="295" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Modelo ilustrativo del interés de la deuda: horas por cambio en diez cambios sucesivos</title><desc id="d">Tabla con un modelo ilustrativo y no medido de diez cambios sucesivos: sin pagar la deuda las horas por cambio crecen de 4,0 a 10,3 y suman 70,4 horas; pagándola con 6 horas en el cambio cinco el cambio cinco cuesta 13,1 y luego vuelve a 4,0, y el total es 55,2 horas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="295" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Escenario</tspan></text><rect x="270" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">Horas por cambio (cambios 1 a 10)</tspan></text><rect x="830" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="897" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="897" dy="0">Total</tspan></text><rect x="10" y="56" width="254" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Sin pagar</tspan></text><rect x="270" y="56" width="554" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">4,0 · 4,0 · 5,2 · 5,4 · 6,9 · 7,4 · 9,3 · 9,0 · 8,9 · 10,3</tspan></text><rect x="830" y="56" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">70,4 h</tspan></text><rect x="10" y="126" width="254" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Pagando 6 h en el cambio 5</tspan></text><rect x="270" y="126" width="554" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">4,0 · 4,0 · 5,4 · 5,7 · 13,1 · 4,0 · 4,0 · 4,0 · 5,6 · 5,4</tspan></text><rect x="830" y="126" width="134" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">55,2 h</tspan></text><rect x="10" y="200" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Es un modelo con supuestos del autor (un atajo cada dos cambios, interés lineal): ilustra por qué el costo se acumula, no predice</tspan></text><text x="490" y="241.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">un proyecto. Medir el interés real exige tiempos de cambio de un equipo.</tspan></text><text x="490" y="281.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Simulación con semilla fija sobre código ejecutado de verdad (CPython 3.12); las magnitudes son de este modelo, no de un sistema real.</tspan></text></svg>
