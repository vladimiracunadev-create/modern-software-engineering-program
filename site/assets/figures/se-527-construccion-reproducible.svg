<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="940" height="490" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos construcciones del mismo código con fechas de modificación distintas: ¿mismo artefacto?</title><desc id="d">Diagrama de flujo de cinco configuraciones de construcción del mismo código con fechas de modificación distintas: el bytecode por marca de tiempo da artefactos distintos y por hash comprobado idénticos; el archivo comprimido con fechas del archivo da distintos, con fechas fijas idénticos y con fechas fijas y nombres ordenados idénticos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="490" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos construcciones del mismo código con fechas de modificación distintas: ¿mismo artefacto?</tspan></text><text x="124" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="124" dy="0">Artefacto</tspan></text><text x="478" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="478" dy="0">Configuración</tspan></text><text x="817" y="57" font-size="13" text-anchor="middle" font-weight="700" fill="#5b7280"><tspan x="817" dy="0">Resultado</tspan></text><rect x="14" y="71" width="220" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">Bytecode</tspan></text><polyline points="238,94 264,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="71" width="420" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="478" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478" dy="0">Invalidación por marca de tiempo</tspan></text><polyline points="692,94 718,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="71" width="190" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817" dy="0">Distintas</tspan></text><rect x="14" y="129" width="220" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">Bytecode</tspan></text><polyline points="238,152 264,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="129" width="420" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="478" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478" dy="0">Invalidación por hash comprobado</tspan></text><polyline points="692,152 718,152" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="129" width="190" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="817" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="817" dy="0">Idénticas</tspan></text><rect x="14" y="187" width="220" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="213.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">Archivo comprimido</tspan></text><polyline points="238,210 264,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="187" width="420" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="478" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478" dy="0">Fechas de los archivos, orden del sistema</tspan></text><polyline points="692,210 718,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="187" width="190" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="817" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="817" dy="0">Distintas</tspan></text><rect x="14" y="245" width="220" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="271.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">Archivo comprimido</tspan></text><polyline points="238,268 264,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="245" width="420" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="478" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478" dy="0">Fechas fijas, orden del sistema</tspan></text><polyline points="692,268 718,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="245" width="190" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="817" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="817" dy="0">Idénticas</tspan></text><rect x="14" y="303" width="220" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="124" dy="0">Archivo comprimido</tspan></text><polyline points="238,326 264,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="268" y="303" width="420" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="478" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478" dy="0">Fechas fijas, nombres ordenados</tspan></text><polyline points="692,326 718,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="722" y="303" width="190" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="817" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="817" dy="0">Idénticas</tspan></text><rect x="10" y="367" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="391.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Fijar las fechas y el modo de invalidación basta aquí. Que el orden del sistema fuera estable en estas dos máquinas no está</tspan></text><text x="470" y="408.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">garantizado en general. Son treinta módulos de dos líneas: el experimento muestra el mecanismo, no la reproducibilidad de</tspan></text><text x="470" y="425.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una cadena real.</tspan></text><text x="470" y="472.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
