<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 271" width="980" height="271" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos detectores de patrones sobre un corpus etiquetado de 14 fragmentos</title><desc id="d">Tabla con dos detectores de patrones sobre un corpus de 14 fragmentos de los que 8 contienen un patrón real: el detector por nombre de clase obtiene 2 verdaderos positivos, 5 falsos positivos y 6 falsos negativos con una precisión del 29 por ciento y una exhaustividad del 25 por ciento, y el detector por estructura obtiene 6, 1 y 2 con una precisión del 86 por ciento y una exhaustividad del 75 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="271" fill="#ffffff"/><rect x="10" y="12" width="254" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="137" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="137" dy="0">Detector</tspan></text><rect x="270" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="342" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="342" dy="0">Verdaderos +</tspan></text><rect x="420" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">Falsos +</tspan></text><rect x="550" y="12" width="124" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="612" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">Falsos −</tspan></text><rect x="680" y="12" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="747" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="747" dy="0">Precisión</tspan></text><rect x="820" y="12" width="144" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="892" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="892" dy="0">Exhaustividad</tspan></text><rect x="10" y="56" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Por nombre de clase</tspan></text><rect x="270" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">2</tspan></text><rect x="420" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">5</tspan></text><rect x="550" y="56" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">6</tspan></text><rect x="680" y="56" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">29 %</tspan></text><rect x="820" y="56" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="85.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">25 %</tspan></text><rect x="10" y="114" width="254" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="137" y="143.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="137" dy="0">Por estructura (ast)</tspan></text><rect x="270" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="342" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="342" dy="0">6</tspan></text><rect x="420" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">1</tspan></text><rect x="550" y="114" width="124" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="612" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612" dy="0">2</tspan></text><rect x="680" y="114" width="134" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="747" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747" dy="0">86 %</tspan></text><rect x="820" y="114" width="144" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="892" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">75 %</tspan></text><rect x="10" y="176" width="960" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">El nombre de una clase es una señal débil: abunda en decoraciones sin estructura y falta en patrones reales. El detector</tspan></text><text x="490" y="217.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">estructural se escribió conociendo parte del corpus y es optimista; el corpus es del autor.</tspan></text><text x="490" y="257.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
