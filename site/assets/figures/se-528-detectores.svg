<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos detectores de patrones sobre un corpus etiquetado de 14 fragmentos</title><desc id="d">Barras agrupadas con los aciertos y errores de dos detectores sobre 14 fragmentos de los que 8 contienen un patrón real: el detector por nombre de clase obtiene 2 verdaderos positivos, 5 falsos positivos y 6 falsos negativos; el detector por estructura obtiene 6, 1 y 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos detectores de patrones sobre un corpus etiquetado de 14 fragmentos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Verdaderos positivos</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Falsos positivos</tspan></text><rect x="383.44" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="403.44" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="403.44" dy="0">Falsos negativos</tspan></text><line x1="63.54" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="375" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="305" x2="63.54" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="235" x2="63.54" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="165" x2="63.54" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">8</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Fragmentos</text><rect x="106.363" y="305" width="111.528" height="70" rx="3" fill="#087f8c"/><text x="162.127" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162.127" dy="0">2</tspan></text><rect x="221.891" y="200" width="111.528" height="175" rx="3" fill="#c0432f"/><text x="277.655" y="194" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="277.655" dy="0">5</tspan></text><rect x="337.419" y="165" width="111.528" height="210" rx="3" fill="#946512"/><text x="393.183" y="159" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="393.183" dy="0">6</tspan></text><text x="277.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="277.655" dy="0">Por nombre de clase</tspan></text><rect x="534.593" y="165" width="111.528" height="210" rx="3" fill="#087f8c"/><text x="590.357" y="159" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="590.357" dy="0">6</tspan></text><rect x="650.121" y="340" width="111.528" height="35" rx="3" fill="#c0432f"/><text x="705.885" y="334" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="705.885" dy="0">1</tspan></text><rect x="765.649" y="305" width="111.528" height="70" rx="3" fill="#946512"/><text x="821.413" y="299" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="821.413" dy="0">2</tspan></text><text x="705.885" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.885" dy="0">Por estructura (ast)</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El nombre de una clase es una señal débil: abunda en decoraciones sin estructura y falta en patrones reales. El detector</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">estructural se escribió conociendo parte del corpus y es optimista; el corpus es del autor.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad (CPython 3.12, Windows 11); los recuentos son deterministas y los tiempos varían de equipo en equipo.</tspan></text></svg>
