<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filas que difieren entre el esquema antiguo y el nuevo en cada fase de una migración de 5 000 filas</title><desc id="d">Barras horizontales con las filas que difieren entre el esquema antiguo y el nuevo en cinco fases de una migración de 5 000 filas, con y sin fallos del uno por ciento: 5 000 al expandir, 220 tras rellenar, 1 y 0 con doble escritura, 5 y 0 con lectura del nuevo, y 391 y 387 al escribir solo en el nuevo, donde son escrituras que el esquema antiguo no tiene.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Filas que difieren entre el esquema antiguo y el nuevo en cada fase de una migración de 5 000 filas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Con 1 % de fallos</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Sin fallos</tspan></text><line x1="324" y1="77" x2="324" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="397" x2="324" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="434.34" y1="77" x2="434.34" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="434.34" y1="397" x2="434.34" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="434.34" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="434.34" dy="0">1 000</tspan></text><line x1="544.68" y1="77" x2="544.68" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="544.68" y1="397" x2="544.68" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="544.68" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.68" dy="0">2 000</tspan></text><line x1="655.02" y1="77" x2="655.02" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="655.02" y1="397" x2="655.02" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="655.02" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="655.02" dy="0">3 000</tspan></text><line x1="765.36" y1="77" x2="765.36" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="765.36" y1="397" x2="765.36" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="765.36" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.36" dy="0">4 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="397" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="397" x2="875.7" y2="402" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="418" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">5 000</tspan></text><line x1="324" y1="397" x2="875.7" y2="397" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">0. Expandir (el nuevo está vacío)</tspan></text><text x="314" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">1. Rellenar (escrituras durante el</tspan></text><text x="314" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">relleno)</tspan></text><text x="314" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">2. Doble escritura</tspan></text><text x="314" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">3. Lectura del nuevo</tspan></text><text x="314" y="361" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">4. Solo escritura nueva (valores que el</tspan></text><text x="314" y="378" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">antiguo no tiene)</tspan></text><rect x="324" y="83" width="551.7" height="24.5" rx="3" fill="#c0432f"/><text x="882.7" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5 000</tspan></text><rect x="324" y="110.5" width="551.7" height="24.5" rx="3" fill="#087f8c"/><text x="882.7" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">5 000</tspan></text><rect x="324" y="147" width="24.2748" height="24.5" rx="3" fill="#c0432f"/><text x="355.275" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="355.275" dy="0">220</tspan></text><rect x="324" y="174.5" width="24.2748" height="24.5" rx="3" fill="#087f8c"/><text x="355.275" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="355.275" dy="0">220</tspan></text><rect x="324" y="211" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="333" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">1</tspan></text><rect x="324" y="238.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="333" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="275" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="333" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">5</tspan></text><rect x="324" y="302.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="333" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">0</tspan></text><rect x="324" y="339" width="43.1429" height="24.5" rx="3" fill="#c0432f"/><text x="374.143" y="355.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="374.143" dy="0">391</tspan></text><rect x="324" y="366.5" width="42.7016" height="24.5" rx="3" fill="#087f8c"/><text x="373.702" y="383.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="373.702" dy="0">387</tspan></text><text x="599.85" y="441" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Filas que difieren (de 5 000)</tspan></text><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La misma cuenta significa cosas distintas según la fase. En la fase 4 las diferencias son escrituras que solo existen en el</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">esquema nuevo y que se perderían al volver sin reconstruir. SQLite en memoria, escrituras intercaladas de forma</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">determinista.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
