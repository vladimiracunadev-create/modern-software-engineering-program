<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 539" width="940" height="539" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas decisiones se revierten</title><desc id="d">Barras con 6 000 decisiones sintéticas: sin consulta previa por escrito se revierte el 29,9 por ciento y cuesta 4,49 días de trabajo por decisión; con 2 personas que leen 21,7 por ciento y 4,75 días, con 4 personas 13,9 por ciento y 4,09 días y con 8 personas 5,9 por ciento y 3,89 días.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="539" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántas decisiones se revierten</tspan></text><line x1="71.08" y1="347" x2="920" y2="347" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="347" x2="71.08" y2="347" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="351.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="253.667" x2="920" y2="253.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="253.667" x2="71.08" y2="253.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="258.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="160.333" x2="920" y2="160.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="160.333" x2="71.08" y2="160.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="164.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="347" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 207)">% de decisiones revertidas</text><rect x="92.303" y="67.9333" width="169.784" height="279.067" rx="3" fill="#c0432f"/><text x="177.195" y="61.9333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="177.195" dy="0">29,9</tspan></text><text x="177.195" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">0 personas leen antes (4,49</tspan></text><text x="177.195" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="177.195" dy="0">días por decisión)</tspan></text><rect x="304.533" y="144.467" width="169.784" height="202.533" rx="3" fill="#c0432f"/><text x="389.425" y="138.467" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="389.425" dy="0">21,7</tspan></text><text x="389.425" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389.425" dy="0">2 personas (4,75 días)</tspan></text><rect x="516.763" y="217.267" width="169.784" height="129.733" rx="3" fill="#c0432f"/><text x="601.655" y="211.267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.655" dy="0">13,9</tspan></text><text x="601.655" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.655" dy="0">4 personas (4,09 días)</tspan></text><rect x="728.993" y="291.933" width="169.784" height="55.0667" rx="3" fill="#c0432f"/><text x="813.885" y="285.933" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="813.885" dy="0">5,9</tspan></text><text x="813.885" y="368" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="813.885" dy="0">8 personas (3,89 días)</tspan></text><rect x="10" y="416" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="440.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Entre paréntesis, los días de trabajo por decisión (consulta más reversión). Las reversiones bajan con cada persona que</tspan></text><text x="470" y="457.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">lee, pero el costo total no baja de inmediato: consultar a dos personas cuesta más días que no consultar a nadie, porque el</tspan></text><text x="470" y="474.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">beneficio no compensa aún el costo fijo de preparar y esperar. El balance mejora con cuatro y con ocho.</tspan></text><text x="470" y="521.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
