<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 435" width="970" height="435" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro contextos, cuatro estilos distintos: la misma matriz de valoraciones con pesos de cada contexto</title><desc id="d">Tabla con cuatro contextos de decisión y el estilo que gana en cada uno con la misma matriz de seis estilos y siete atributos: un equipo de seis gana el monolito modular con 4,00 puntos, doce equipos ganan los microservicios con 3,45, una plataforma con extensiones de terceros gana el microkernel con 3,75 y un sistema crítico y multi-inquilino gana la arquitectura celular con 3,50; las diferencias con el segundo van de 0,20 a 0,65.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="435" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Contexto</tspan></text><rect x="340" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="442" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="442" dy="0">Ganador</tspan></text><rect x="550" y="12" width="84" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="592" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="592" dy="0">Puntaje</tspan></text><rect x="640" y="12" width="204" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="742" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="742" dy="0">Segundo</tspan></text><rect x="850" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="902" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="902" dy="0">Diferencia</tspan></text><rect x="10" y="56" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Equipo de 6, producto nuevo</tspan></text><rect x="340" y="56" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Monolito modular</tspan></text><rect x="550" y="56" width="84" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">4,00</tspan></text><rect x="640" y="56" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Monolito en capas</tspan></text><rect x="850" y="56" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">0,35</tspan></text><rect x="10" y="122" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="155.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">12 equipos, 120 personas</tspan></text><rect x="340" y="122" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Microservicios</tspan></text><rect x="550" y="122" width="84" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">3,45</tspan></text><rect x="640" y="122" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Arquitectura celular</tspan></text><rect x="850" y="122" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">0,30</tspan></text><rect x="10" y="188" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="221.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Plataforma con extensiones de terceros</tspan></text><rect x="340" y="188" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Microkernel</tspan></text><rect x="550" y="188" width="84" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">3,75</tspan></text><rect x="640" y="188" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Microservicios</tspan></text><rect x="850" y="188" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="221.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">0,65</tspan></text><rect x="10" y="254" width="324" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="287.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Crítico y multi-inquilino</tspan></text><rect x="340" y="254" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="442" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">Arquitectura celular</tspan></text><rect x="550" y="254" width="84" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="592" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="592" dy="0">3,50</tspan></text><rect x="640" y="254" width="204" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="742" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="742" dy="0">Microservicios</tspan></text><rect x="850" y="254" width="104" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="902" y="287.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="902" dy="0">0,20</tspan></text><rect x="10" y="324" width="950" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="485" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">La matriz de valoraciones es la misma en los cuatro casos; solo cambian los pesos. Cuatro estilos distintos ganan, y en el</tspan></text><text x="485" y="365.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">contexto crítico la ventaja sobre el segundo es de 0,20 puntos, menos que el margen de error de un juicio de 1 a 5. Las</tspan></text><text x="485" y="382.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="485" dy="0">valoraciones y los pesos los fijó el autor.</tspan></text><text x="485" y="421.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
