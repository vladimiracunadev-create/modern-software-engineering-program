<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué siembra produce adopción</title><desc id="d">Barras agrupadas con 2 000 redes sintéticas de 30 personas y cuatro siembras de una práctica: con solo un anuncio general la adopción es nula en el 100 por ciento de las redes, con dos personas al azar la mediana es 93,3 por ciento y 63,2 por ciento de las redes pasan del 80 por ciento, con dos muy conectadas 96,7 y 95,7 por ciento, y con dos poco conectadas 6,7 y 11,4 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué siembra produce adopción</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Adopción final (mediana)</tspan></text><rect x="244.96" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="264.96" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Redes con 80 % o más</tspan></text><rect x="443.76" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="463.76" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="463.76" dy="0">Redes que no pasan del 10 %</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="920" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="263" x2="920" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="207" x2="920" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="151" x2="920" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">% de personas o de redes</text><rect x="99.6545" y="373" width="53.4253" height="2" rx="3" fill="#087f8c"/><text x="126.367" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.367" dy="0">0,0</tspan></text><rect x="157.08" y="373" width="53.4253" height="2" rx="3" fill="#946512"/><text x="183.793" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="183.793" dy="0">0,0</tspan></text><rect x="214.505" y="95" width="53.4253" height="280" rx="3" fill="#c0432f"/><text x="241.218" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="241.218" dy="0">100,0</tspan></text><text x="183.793" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">Solo un anuncio general</tspan></text><rect x="310" y="113.76" width="53.4253" height="261.24" rx="3" fill="#087f8c"/><text x="336.712" y="107.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="336.712" dy="0">93,3</tspan></text><rect x="367.425" y="198.04" width="53.4253" height="176.96" rx="3" fill="#946512"/><text x="394.138" y="192.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="394.138" dy="0">63,2</tspan></text><rect x="424.85" y="334.68" width="53.4253" height="40.32" rx="3" fill="#c0432f"/><text x="451.563" y="328.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="451.563" dy="0">14,4</tspan></text><text x="394.138" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">2 personas al azar</tspan></text><rect x="520.345" y="104.24" width="53.4253" height="270.76" rx="3" fill="#087f8c"/><text x="547.057" y="98.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="547.057" dy="0">96,7</tspan></text><rect x="577.77" y="107.04" width="53.4253" height="267.96" rx="3" fill="#946512"/><text x="604.483" y="101.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="604.483" dy="0">95,7</tspan></text><rect x="635.195" y="373" width="53.4253" height="2" rx="3" fill="#c0432f"/><text x="661.908" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="661.908" dy="0">0,2</tspan></text><text x="604.482" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">2 personas muy conectadas</tspan></text><rect x="730.689" y="356.24" width="53.4253" height="18.76" rx="3" fill="#087f8c"/><text x="757.402" y="350.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="757.402" dy="0">6,7</tspan></text><rect x="788.115" y="343.08" width="53.4253" height="31.92" rx="3" fill="#946512"/><text x="814.827" y="337.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="814.827" dy="0">11,4</tspan></text><rect x="845.54" y="171.44" width="53.4253" height="203.56" rx="3" fill="#c0432f"/><text x="872.253" y="165.44" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="872.253" dy="0">72,7</tspan></text><text x="814.827" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">2 personas poco conectadas</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada grupo es una forma de empezar; la barra verde azulada dice cuánto del equipo termina usando la práctica y las otras</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dos cuántas redes llegan lejos o se quedan inmóviles. La diferencia entre las dos últimas es la lección: son dos personas</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en ambos casos, y el resultado va de casi todo a casi nada según dónde están.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
