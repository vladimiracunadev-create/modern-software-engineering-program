<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 413" width="960" height="413" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Victorias de cada estilo con 10 000 juegos de pesos al azar sobre la misma matriz de valoraciones</title><desc id="d">Gráfico de barras con las victorias de seis estilos en 10 000 sorteos de pesos: monolito en capas 663, monolito modular 2 999, microkernel 3 923, pipes and filters 20, microservicios 1 571 y arquitectura celular 824.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="413" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Monolito en capas</tspan></text><rect x="344" y="16" width="66.3" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="418.3" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="418.3" dy="0">663</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Monolito modular</tspan></text><rect x="344" y="62" width="299.9" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="651.9" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="651.9" dy="0">2 999</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Microkernel</tspan></text><rect x="344" y="108" width="392.3" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="744.3" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="744.3" dy="0">3 923</tspan></text><text x="334" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Pipes and filters</tspan></text><rect x="344" y="154" width="4" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="356" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="356" dy="0">20</tspan></text><text x="334" y="221" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Microservicios</tspan></text><rect x="344" y="200" width="157.1" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="509.1" y="221" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="509.1" dy="0">1 571</tspan></text><text x="334" y="267" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Arquitectura celular</tspan></text><rect x="344" y="246" width="82.4" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="434.4" y="267" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="434.4" dy="0">824</tspan></text><rect x="10" y="294" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="318.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Con pesos al azar gana el microkernel casi cuatro de cada diez veces: no porque sea mejor, sino porque la matriz le da</tspan></text><text x="480" y="335.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">valoraciones altas en cinco de siete atributos. El resultado depende de las valoraciones del autor tanto como de los pesos;</tspan></text><text x="480" y="352.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">pipes and filters casi nunca gana porque sus fuerzas (flujo) no están entre los siete atributos.</tspan></text><text x="480" y="399.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
