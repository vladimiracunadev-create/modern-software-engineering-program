<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 371" width="980" height="371" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres formas de ejecutar un complemento: qué pasa con uno que falla y con uno lento, y cuánto cuesta cada una</title><desc id="d">Tabla con tres formas de ejecutar complementos: en el mismo hilo sin protección la excepción detiene la entrega a los demás y un complemento lento bloquea un segundo, con try y except se aísla la excepción y se entregan 7 de 8 resultados pero el lento sigue bloqueando 1,00 segundos, y en un proceso con límite de 0,3 segundos se aísla el error y el lento se corta a los 314 milisegundos, con una mediana de 122 milisegundos por llamada frente a 0,30 microsegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="371" fill="#ffffff"/><rect x="10" y="12" width="304" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="162" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="162" dy="0">Forma de ejecutar</tspan></text><rect x="320" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="452" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452" dy="0">Complemento que falla</tspan></text><rect x="590" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="697" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="697" dy="0">Complemento lento</tspan></text><rect x="810" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="887" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="887" dy="0">Costo por llamada</tspan></text><rect x="10" y="56" width="304" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="92.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">En el mismo hilo, sin protección</tspan></text><rect x="320" y="56" width="264" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Detiene la entrega a los demás</tspan></text><rect x="590" y="56" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Bloquea 1,00 s</tspan></text><rect x="810" y="56" width="154" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">0,30 µs</tspan></text><rect x="10" y="128" width="304" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="164.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">En el mismo hilo, con try y except</tspan></text><rect x="320" y="128" width="264" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Aislada: 7 de 8 resultados</tspan></text><rect x="590" y="128" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Bloquea 1,00 s</tspan></text><rect x="810" y="128" width="154" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">0,30 µs</tspan></text><rect x="10" y="200" width="304" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="162" y="236.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162" dy="0">En un proceso con límite de 0,3 s</tspan></text><rect x="320" y="200" width="264" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="452" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="452" dy="0">Aislada: código de error</tspan></text><rect x="590" y="200" width="214" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="697" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="697" dy="0">Cortada a los 314 ms</tspan></text><rect x="810" y="200" width="154" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="887" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="887" dy="0">122 ms</tspan></text><rect x="10" y="276" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El aislamiento por proceso protege del complemento lento y del que cuelga, pero cuesta más de cinco órdenes de magnitud por</tspan></text><text x="490" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">llamada. Una excepción se contiene con una línea; un bloqueo exige otro proceso o un hilo con límite.</tspan></text><text x="490" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
