<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 315" width="980" height="315" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Añadir tres canales de aviso: líneas tocadas del núcleo en un monolito con if y elif y en un núcleo con complementos</title><desc id="d">Tabla con dos estructuras: un monolito con if y elif pasa de 8 a 14 líneas y toca 6 líneas del núcleo al añadir tres canales, y un núcleo con complementos descubiertos en un directorio conserva la misma huella del código y toca 0 líneas porque los tres canales son archivos nuevos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="315" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Estructura</tspan></text><rect x="340" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="437" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437" dy="0">Con 3 canales</tspan></text><rect x="540" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="637" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="637" dy="0">Con 6 canales</tspan></text><rect x="740" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="852" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="852" dy="0">Líneas tocadas al añadir 3</tspan></text><rect x="10" y="56" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="92.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Monolito con if y elif</tspan></text><rect x="340" y="56" width="194" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">8 líneas</tspan></text><rect x="540" y="56" width="194" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">14 líneas</tspan></text><rect x="740" y="56" width="224" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">6 líneas del núcleo</tspan></text><rect x="10" y="128" width="324" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="164.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Núcleo con complementos descubiertos</tspan></text><rect x="340" y="128" width="194" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="437" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437" dy="0">misma huella SHA-256</tspan></text><rect x="540" y="128" width="194" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="637" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637" dy="0">misma huella SHA-256</tspan></text><rect x="740" y="128" width="224" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="852" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="852" dy="0">0 líneas del núcleo</tspan></text><rect x="10" y="204" width="960" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="228.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">La huella del núcleo se calcula con SHA-256 del código fuente de la clase del núcleo antes y después de añadir los complementos,</tspan></text><text x="490" y="245.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">y es idéntica. Esto mide la extensión sin tocar el núcleo, no que el contrato del complemento sea bueno: ese contrato es el costo</tspan></text><text x="490" y="262.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">del estilo.</tspan></text><text x="490" y="301.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
