<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas personas deben irse</title><desc id="d">Barras con 200 repositorios sintéticos de 300 archivos y 8 personas: con un autor por archivo y reparto concentrado la salida de la persona más cargada deja sin conocedor al 37 por ciento de los archivos, con reparto uniforme 15,4 por ciento, con dos conocedores por archivo y con dos conocedores y rotación 0 por ciento; el factor de camión mediano sube de 2 a 4, 5,5 y 6.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántas personas deben irse</tspan></text><line x1="344" y1="49" x2="344" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="225" x2="344" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0</tspan></text><line x1="478.94" y1="49" x2="478.94" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="478.94" y1="225" x2="478.94" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="478.94" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478.94" dy="0">10</tspan></text><line x1="613.88" y1="49" x2="613.88" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="613.88" y1="225" x2="613.88" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="613.88" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="613.88" dy="0">20</tspan></text><line x1="748.82" y1="49" x2="748.82" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="748.82" y1="225" x2="748.82" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="748.82" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.82" dy="0">30</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="225" x2="883.76" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">40</tspan></text><line x1="344" y1="225" x2="883.76" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Un autor por archivo, reparto concentrado</tspan></text><text x="334" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">(factor 2)</tspan></text><text x="334" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Un autor por archivo, reparto uniforme</tspan></text><text x="334" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">(factor 4)</tspan></text><text x="334" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Dos conocedores por archivo (factor 5,5)</tspan></text><text x="334" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Dos conocedores y rotación (factor 6)</tspan></text><rect x="344" y="55" width="499.278" height="32" rx="3" fill="#c0432f"/><text x="850.278" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="850.278" dy="0">37,0</tspan></text><rect x="344" y="99" width="207.808" height="32" rx="3" fill="#c0432f"/><text x="558.808" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="558.808" dy="0">15,4</tspan></text><rect x="344" y="143" width="2" height="32" rx="3" fill="#c0432f"/><text x="353" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353" dy="0">0,0</tspan></text><rect x="344" y="187" width="2" height="32" rx="3" fill="#c0432f"/><text x="353" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="353" dy="0">0,0</tspan></text><text x="613.88" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="613.88" dy="0">% de archivos sin conocedor</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada fila es una política de reparto; el factor de camión, entre paréntesis, dice cuántas personas habría que perder para</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dejar sin conocedor a la mitad del código, y la barra cuánto se pierde si se va solo la persona que más sabe. La diferencia</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entre un autor concentrado y dos conocedores por archivo es lo que compra la revisión por un segundo conocedor.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
