<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué estrategia aguanta un malentendido</title><desc id="d">Barras agrupadas con partidas sintéticas de 200 rondas con 5 por ciento de malentendidos: contra sí misma el ojo por ojo obtiene 2,29 puntos por ronda, el generoso 2,85, el que siempre coopera 2,95 y el que siempre ataca 1,15, y en promedio contra las cuatro estrategias 2,31, 2,34, 2,21 y 2,39.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué estrategia aguanta un malentendido</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pago por ronda contra sí misma</tspan></text><rect x="290.2" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="310.2" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">Pago promedio contra las cuatro estrategias</tspan></text><line x1="63.54" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="375" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="281.667" x2="63.54" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="188.333" x2="63.54" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">puntos por ronda</text><rect x="84.9515" y="161.267" width="83.646" height="213.733" rx="3" fill="#087f8c"/><text x="126.774" y="155.267" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.774" dy="0">2,29</tspan></text><rect x="172.597" y="159.4" width="83.646" height="215.6" rx="3" fill="#946512"/><text x="214.421" y="153.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214.421" dy="0">2,31</tspan></text><text x="170.597" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">Ojo por ojo</tspan></text><rect x="299.067" y="109" width="83.646" height="266" rx="3" fill="#087f8c"/><text x="340.889" y="103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="340.889" dy="0">2,85</tspan></text><rect x="386.713" y="156.6" width="83.646" height="218.4" rx="3" fill="#946512"/><text x="428.536" y="150.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="428.536" dy="0">2,34</tspan></text><text x="384.713" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">Ojo por ojo generoso</tspan></text><rect x="513.182" y="99.6667" width="83.646" height="275.333" rx="3" fill="#087f8c"/><text x="555.005" y="93.6667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="555.005" dy="0">2,95</tspan></text><rect x="600.828" y="168.733" width="83.646" height="206.267" rx="3" fill="#946512"/><text x="642.651" y="162.733" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642.651" dy="0">2,21</tspan></text><text x="598.828" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">Siempre coopera</tspan></text><rect x="727.296" y="267.667" width="83.646" height="107.333" rx="3" fill="#087f8c"/><text x="769.119" y="261.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="769.119" dy="0">1,15</tspan></text><rect x="814.942" y="151.933" width="83.646" height="223.067" rx="3" fill="#946512"/><text x="856.765" y="145.933" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.765" dy="0">2,39</tspan></text><text x="812.942" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">Siempre ataca</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Contra una igual, un malentendido hace caer el ojo por ojo estricto de 3 a 2,29 porque las represalias se alternan; la</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">versión generosa lo recupera hasta 2,85. La barra dorada muestra el límite: contra una mezcla que incluye a quien siempre</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ataca, esa estrategia obtiene el promedio más alto y quien siempre coopera, el más bajo.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
