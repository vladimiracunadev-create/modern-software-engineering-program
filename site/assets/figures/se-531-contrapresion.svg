<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 518" width="940" height="518" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Productor rápido y consumidor lento con 5 000 mensajes: profundidad máxima de la cola y qué ocurre con un registro malformado</title><desc id="d">Barras con la profundidad máxima de la cola en dos situaciones: con una cola ilimitada llega a unos 5000 mensajes y el productor nunca espera; con una cola acotada a 100 es 100 y el productor espera cuando se llena.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="518" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Productor rápido y consumidor lento con 5 000 mensajes: profundidad máxima de la cola y qué ocurre con un</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">registro malformado</tspan></text><line x1="93.7" y1="326" x2="920" y2="326" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="326" x2="93.7" y2="326" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="330.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="278" x2="920" y2="278" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="278" x2="93.7" y2="278" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="282.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="230" x2="920" y2="230" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="230" x2="93.7" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="234.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="182" x2="920" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="182" x2="93.7" y2="182" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="134" x2="920" y2="134" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="134" x2="93.7" y2="134" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">4 000</tspan></text><line x1="93.7" y1="86" x2="920" y2="86" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="86" x2="93.7" y2="86" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="90.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">5 000</tspan></text><line x1="93.7" y1="86" x2="93.7" y2="326" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="206" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 206)">Mensajes en la cola</text><rect x="135.015" y="86" width="330.52" height="240" rx="3" fill="#102a43"/><text x="300.275" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="300.275" dy="0">5 000</tspan></text><text x="300.275" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300.275" dy="0">Cola ilimitada</tspan></text><rect x="548.165" y="321.2" width="330.52" height="4.8" rx="3" fill="#102a43"/><text x="713.425" y="315.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="713.425" dy="0">100</tspan></text><text x="713.425" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="713.425" dy="0">Cola acotada a 100</tspan></text><rect x="10" y="378" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="402.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un filtro que falla sin manejo detiene el flujo en el registro 5; con una cola de rechazos se procesan 19 registros y se</tspan></text><text x="470" y="419.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rechaza 1. La cola acotada convierte la sobrecarga en espera del productor en lugar de memoria sin límite; es</tspan></text><text x="470" y="436.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">contrapresión. La profundidad de la cola ilimitada depende del reparto de hilos del sistema (entre 4 999 y 5 000 en las</tspan></text><text x="470" y="452.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ejecuciones hechas).</tspan></text><text x="470" y="500.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
