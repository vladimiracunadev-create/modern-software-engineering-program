<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 291" width="980" height="291" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Orden de dos filtros en una cadena de 100 000 registros: llamadas al filtro caro de enriquecer</title><desc id="d">Tabla con dos órdenes de la misma cadena: si el filtro caro de enriquecer va antes del selectivo se llama 90 079 veces y si va después se llama 16 259 veces, un 82,0 por ciento menos, con la misma salida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="291" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Orden de la cadena</tspan></text><rect x="410" y="12" width="264" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="542" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="542" dy="0">Llamadas al filtro caro</tspan></text><rect x="680" y="12" width="284" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="822" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="822" dy="0">Efecto</tspan></text><rect x="10" y="56" width="394" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Filtro caro antes del selectivo</tspan></text><rect x="410" y="56" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">90 079</tspan></text><rect x="680" y="56" width="284" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">Enriquece todo lo válido</tspan></text><rect x="10" y="124" width="394" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="158.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Filtro selectivo antes del caro</tspan></text><rect x="410" y="124" width="264" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="542" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="542" dy="0">16 259</tspan></text><rect x="680" y="124" width="284" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="822" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822" dy="0">82,0 % menos llamadas</tspan></text><rect x="10" y="196" width="960" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">En una cadena de filtros el orden cambia el costo sin cambiar el resultado, siempre que los filtros conmuten. Poner primero el</tspan></text><text x="490" y="237.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">que descarta más y cuesta menos es una decisión de diseño que se comprueba contando llamadas.</tspan></text><text x="490" y="277.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
