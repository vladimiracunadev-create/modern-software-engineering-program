<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 295" width="980" height="295" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cambio incompatible del contrato de s7 en ocho servicios: cuántos deben cambiar o desplegarse a la vez</title><desc id="d">Tabla con dos topologías de ocho servicios y un cambio incompatible en el servicio s7: en una cadena deben coordinarse 7 servicios transitivos y 1 directo, en una estrella con siete servicios que llaman a s7 deben coordinarse 7 transitivos y 7 directos, y con un cambio compatible y consumidores tolerantes el número de despliegues coordinados es 0 en ambos casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="295" fill="#ffffff"/><rect x="10" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="172" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="172" dy="0">Topología</tspan></text><rect x="340" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="447" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">Servicios afectados</tspan></text><text x="447" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="447" dy="0">(transitivos)</tspan></text><rect x="560" y="12" width="214" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Servicios afectados</tspan></text><text x="667" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">(directos)</tspan></text><rect x="780" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="872" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">Con cambio</tspan></text><text x="872" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="872" dy="0">compatible</tspan></text><rect x="10" y="56" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Cadena de ocho servicios</tspan></text><rect x="340" y="56" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">7</tspan></text><rect x="560" y="56" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">1</tspan></text><rect x="780" y="56" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0</tspan></text><rect x="10" y="126" width="324" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="172" y="161.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="172" dy="0">Siete servicios que llaman a uno</tspan></text><rect x="340" y="126" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="447" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447" dy="0">7</tspan></text><rect x="560" y="126" width="214" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">7</tspan></text><rect x="780" y="126" width="184" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="872" y="161.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="872" dy="0">0</tspan></text><rect x="10" y="200" width="960" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Un servicio con consumidores que dependen de su forma exacta se despliega con ellos: es un monolito distribuido con más latencia.</tspan></text><text x="490" y="241.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">Lo que desacopla es la compatibilidad de los contratos, no la separación de procesos.</tspan></text><text x="490" y="281.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
