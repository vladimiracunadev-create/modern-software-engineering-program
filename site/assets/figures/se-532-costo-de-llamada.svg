<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 411" width="970" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo medido de una consulta de aviso según cómo se llame: en proceso, serializada y por HTTP en la misma máquina</title><desc id="d">Tabla con cuatro formas de hacer la misma consulta, con mediana y percentil 99 en milisegundos: en el mismo proceso 0,0002 y 0,0002, serializar y deserializar JSON 0,0051 y 0,0162, HTTP local con conexión reutilizada 0,3237 y 0,6739, y HTTP local con conexión nueva 1,0791 y 1,8198.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="970" height="411" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Camino</tspan></text><rect x="460" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="582" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582" dy="0">Mediana (ms)</tspan></text><rect x="710" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="832" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832" dy="0">p99 (ms)</tspan></text><rect x="10" y="56" width="444" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Llamada en el mismo proceso</tspan></text><rect x="460" y="56" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0,0002</tspan></text><rect x="710" y="56" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0,0002</tspan></text><rect x="10" y="120" width="444" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="152.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Serializar y deserializar JSON</tspan></text><rect x="460" y="120" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0,0051</tspan></text><rect x="710" y="120" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0,0162</tspan></text><rect x="10" y="184" width="444" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="216.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">HTTP local con conexión reutilizada</tspan></text><rect x="460" y="184" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">0,3237</tspan></text><rect x="710" y="184" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">0,6739</tspan></text><rect x="10" y="248" width="444" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="280.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">HTTP local con conexión nueva</tspan></text><rect x="460" y="248" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582" dy="0">1,0791</tspan></text><rect x="710" y="248" width="244" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="832" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="832" dy="0">1,8198</tspan></text><rect x="10" y="316" width="950" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="485" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Cruzar un límite de proceso cuesta más de mil veces lo que una llamada en proceso aun en la misma máquina y sin red real; con</tspan></text><text x="485" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">red, balanceador y TLS el costo sube. Una ejecución en Windows 11: las proporciones son estables y los valores absolutos no.</tspan></text><text x="485" y="397.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="485" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
