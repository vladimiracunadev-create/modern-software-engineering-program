<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto ruido hay en una evaluación</title><desc id="d">Barras con 300 grupos simulados de 200 personas evaluadas por una o tres evaluadoras: una evaluadora sin rúbrica promueve al 58,7 por ciento del 20 por ciento mejor, con una correlación de 0,73 con el desempeño verdadero; tres sin rúbrica 74,1 y 0,89; tres con rúbrica calibrada 85,9 y 0,97.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto ruido hay en una evaluación</tspan></text><line x1="344" y1="49" x2="344" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="181" x2="344" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0</tspan></text><line x1="478.94" y1="49" x2="478.94" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="478.94" y1="181" x2="478.94" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="478.94" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="478.94" dy="0">25</tspan></text><line x1="613.88" y1="49" x2="613.88" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="613.88" y1="181" x2="613.88" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="613.88" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="613.88" dy="0">50</tspan></text><line x1="748.82" y1="49" x2="748.82" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="748.82" y1="181" x2="748.82" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="748.82" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.82" dy="0">75</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="181" x2="883.76" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="344" y1="181" x2="883.76" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Una evaluadora, sin rúbrica (correlación</tspan></text><text x="334" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">0,73)</tspan></text><text x="334" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Tres evaluadoras, sin rúbrica (0,89)</tspan></text><text x="334" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Tres evaluadoras con rúbrica calibrada</tspan></text><text x="334" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">(0,97)</tspan></text><rect x="344" y="55" width="316.839" height="32" rx="3" fill="#087f8c"/><text x="667.839" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="667.839" dy="0">58,7</tspan></text><rect x="344" y="99" width="399.962" height="32" rx="3" fill="#087f8c"/><text x="750.962" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="750.962" dy="0">74,1</tspan></text><rect x="344" y="143" width="463.654" height="32" rx="3" fill="#087f8c"/><text x="814.654" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="814.654" dy="0">85,9</tspan></text><text x="613.88" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="613.88" dy="0">% del 20 % mejor que es promovido</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Entre paréntesis, la correlación con el desempeño verdadero. Con una sola evaluadora y sin rúbrica, cuatro de cada diez</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">personas que merecían promoción no la reciben aunque el desempeño exista y se mide con ruido. Añadir evaluadoras ayuda y la</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">rúbrica calibrada ayuda más.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
