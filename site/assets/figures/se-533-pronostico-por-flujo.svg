<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 571" width="940" height="571" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas semanas necesita un backlog de 60 elementos</title><desc id="d">Rangos del percentil 85 del pronóstico de 60 elementos según las semanas de historial: con 6 semanas la mediana es 15 y el rango de 12 a 21, con 12 de 13 a 20, con 24 de 13 a 18 y con 48 de 14 a 17; la media del historial de 20 semanas da 13 semanas con 70,6 por ciento de probabilidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="571" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántas semanas necesita un backlog de 60 elementos</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p10</tspan></text><polygon points="92.62,44.1 99.22,56.4 86.02,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="106.62" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="106.62" dy="0">mediana</tspan></text><polygon points="193.4,43.5 200.9,51 193.4,58.5 185.9,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="207.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="207.4" dy="0">p90</tspan></text><line x1="237.38" y1="77" x2="237.38" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="237.38" y1="373" x2="237.38" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="237.38" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="237.38" dy="0">0</tspan></text><line x1="367.904" y1="77" x2="367.904" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="367.904" y1="373" x2="367.904" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="367.904" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="367.904" dy="0">5</tspan></text><line x1="498.428" y1="77" x2="498.428" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="498.428" y1="373" x2="498.428" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="498.428" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498.428" dy="0">10</tspan></text><line x1="628.952" y1="77" x2="628.952" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="628.952" y1="373" x2="628.952" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="628.952" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="628.952" dy="0">15</tspan></text><line x1="759.476" y1="77" x2="759.476" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="759.476" y1="373" x2="759.476" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="759.476" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.476" dy="0">20</tspan></text><line x1="890" y1="77" x2="890" y2="373" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="373" x2="890" y2="378" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="394" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">25</tspan></text><line x1="237.38" y1="373" x2="890" y2="373" stroke="#5b7280" stroke-width="1.6"/><text x="207.38" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Historial de 6 semanas</tspan></text><text x="207.38" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Historial de 12 semanas</tspan></text><text x="207.38" y="266.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Historial de 24 semanas</tspan></text><text x="207.38" y="340.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="207.38" dy="0">Historial de 48 semanas</tspan></text><line x1="550.638" y1="114" x2="785.581" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="543.638" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="550.638" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="550.638" dy="0">12</tspan></text><polygon points="628.952,105.95 636.652,120.3 621.252,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="628.952" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="628.952" dy="0">15</tspan></text><polygon points="785.581,105.25 794.331,114 785.581,122.75 776.831,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="785.581" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="785.581" dy="0">21</tspan></text><line x1="576.742" y1="188" x2="759.476" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="569.742" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="576.742" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="576.742" dy="0">13</tspan></text><polygon points="628.952,179.95 636.652,194.3 621.252,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="628.952" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="628.952" dy="0">15</tspan></text><polygon points="759.476,179.25 768.226,188 759.476,196.75 750.726,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="759.476" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="759.476" dy="0">20</tspan></text><line x1="576.742" y1="262" x2="707.266" y2="262" stroke="#8a9aa3" stroke-width="5"/><rect x="569.742" y="255" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="576.742" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="576.742" dy="0">13</tspan></text><polygon points="628.952,253.95 636.652,268.3 621.252,268.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="628.952" y="291" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="628.952" dy="0">15</tspan></text><polygon points="707.266,253.25 716.016,262 707.266,270.75 698.516,262" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="707.266" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.266" dy="0">18</tspan></text><line x1="602.847" y1="336" x2="681.162" y2="336" stroke="#8a9aa3" stroke-width="5"/><rect x="595.847" y="329" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="602.847" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="602.847" dy="0">14</tspan></text><polygon points="628.952,327.95 636.652,342.3 621.252,342.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="628.952" y="365" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="628.952" dy="0">15</tspan></text><polygon points="681.162,327.25 689.912,336 681.162,344.75 672.412,336" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="681.162" y="320" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="681.162" dy="0">17</tspan></text><line x1="576.742" y1="77" x2="576.742" y2="373" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="581.742" y="90" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="581.742" dy="0">media: 13</tspan></text><text x="563.69" y="417" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="563.69" dy="0">semanas para entregar 60 elementos (p85)</tspan></text><rect x="10" y="431" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="455.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con un historial de 20 semanas y entrega media de 4,95 la fecha de la media es 60 / 4,95 = 13 semanas, con 70,6 % de</tspan></text><text x="470" y="472.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">probabilidad de cumplirla; la simulación da p50 13, p85 14 y p95 16 semanas. El percentil 85 añade una semana. Cada fila</tspan></text><text x="470" y="489.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">usa 200 repeticiones: con seis semanas de historial, el mismo pronóstico oscila entre doce y veintiuna semanas según qué</tspan></text><text x="470" y="505.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">seis semanas se tuvieron.</tspan></text><text x="470" y="553.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
