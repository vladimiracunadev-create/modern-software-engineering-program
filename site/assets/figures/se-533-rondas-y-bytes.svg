<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 427" width="980" height="427" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una pantalla de avisos con cuatro servicios detrás: rondas, bytes y tiempo modelado según quién agrega</title><desc id="d">Tabla con cuatro caminos para armar la pantalla de avisos: el cliente llama a cuatro servicios en dos rondas con 6 692 bytes y 173 milisegundos modelados, un gateway de agregación usa una ronda con los mismos 6 692 bytes y 93 milisegundos, un BFF móvil usa una ronda con 163 bytes y 80 milisegundos y un BFF web usa una ronda con 1 169 bytes y 82 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="427" fill="#ffffff"/><rect x="10" y="12" width="444" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232" dy="0">Camino</tspan></text><rect x="460" y="12" width="104" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="512" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="512" dy="0">Rondas</tspan></text><rect x="570" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="647" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="647" dy="0">Bytes</tspan></text><rect x="730" y="12" width="234" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="847" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="847" dy="0">Tiempo modelado (ms)</tspan></text><rect x="10" y="56" width="444" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">El cliente llama a cuatro servicios</tspan></text><rect x="460" y="56" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">2</tspan></text><rect x="570" y="56" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">6 692</tspan></text><rect x="730" y="56" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">173</tspan></text><rect x="10" y="120" width="444" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="152.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">Gateway de agregación (carga completa)</tspan></text><rect x="460" y="120" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">1</tspan></text><rect x="570" y="120" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">6 692</tspan></text><rect x="730" y="120" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">93</tspan></text><rect x="10" y="184" width="444" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="216.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">BFF móvil (carga proyectada)</tspan></text><rect x="460" y="184" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">1</tspan></text><rect x="570" y="184" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">163</tspan></text><rect x="730" y="184" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">80</tspan></text><rect x="10" y="248" width="444" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="232" y="280.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="232" dy="0">BFF web (carga proyectada)</tspan></text><rect x="460" y="248" width="104" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="512" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="512" dy="0">1</tspan></text><rect x="570" y="248" width="154" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="647" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647" dy="0">1 169</tspan></text><rect x="730" y="248" width="234" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847" dy="0">82</tspan></text><rect x="10" y="316" width="960" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">La agregación ahorra una ronda; la proyección por cliente ahorra bytes: el móvil necesita el 2,4 % de la carga completa. Los</tspan></text><text x="490" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">tiempos usan 80 ms de ida y vuelta y 0,5 MB/s, supuestos del autor, no una medición de red; los tamaños sí son medidos sobre</tspan></text><text x="490" y="374.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">datos sintéticos.</tspan></text><text x="490" y="413.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
