<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 584" width="940" height="584" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto vale saber antes de decidir</title><desc id="d">Barras agrupadas con el valor de la información en una inversión de valor neto incierto con desviación 100 y un experimento con ruido de 40: con valor esperado a priori de menos 20 la información perfecta vale 30,6 y el experimento 27,8, con valor esperado cero 39,8 y 36,9, y con más 20 vale 30,6 y 27,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="584" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto vale saber antes de decidir</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Información perfecta (simulado)</tspan></text><rect x="297.74" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="317.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="317.74" dy="0">Experimento ruidoso</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="305" x2="71.08" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="235" x2="71.08" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="165" x2="71.08" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">valor de la información</text><rect x="99.3773" y="160.8" width="111.189" height="214.2" rx="3" fill="#087f8c"/><text x="154.972" y="154.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">30,6</tspan></text><rect x="214.567" y="180.4" width="111.189" height="194.6" rx="3" fill="#946512"/><text x="270.161" y="174.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">27,8</tspan></text><text x="212.567" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Valor esperado a priori −20</tspan></text><rect x="382.351" y="96.4" width="111.189" height="278.6" rx="3" fill="#087f8c"/><text x="437.945" y="90.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">39,8</tspan></text><rect x="497.54" y="116.7" width="111.189" height="258.3" rx="3" fill="#946512"/><text x="553.135" y="110.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">36,9</tspan></text><text x="495.54" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Valor esperado a priori 0</tspan></text><rect x="665.324" y="160.8" width="111.189" height="214.2" rx="3" fill="#087f8c"/><text x="720.919" y="154.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">30,6</tspan></text><rect x="780.513" y="181.1" width="111.189" height="193.9" rx="3" fill="#946512"/><text x="836.108" y="175.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">27,7</tspan></text><text x="778.513" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Valor esperado a priori +20 (20,0 sin</tspan></text><text x="778.513" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">información)</tspan></text><rect x="10" y="444" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El valor analítico de la información perfecta es 30,7, 39,9 y 30,7. La información vale más cuando la decisión está en el</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">límite (valor esperado cero: 39,8) y menos cuando se inclina hacia un lado. El experimento ruidoso captura entre el 90 y el</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">93 % de ese valor, así que cualquier experimento que cueste menos de 27 es rentable en el caso central, y uno que cueste 40</tspan></text><text x="470" y="518.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">nunca lo es.</tspan></text><text x="470" y="566.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
