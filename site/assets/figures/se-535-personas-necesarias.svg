<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 469" width="940" height="469" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Con 20 dominios, personas necesarias para que la espera media no pase de 0,5 semanas según quién es dueño del dato</title><desc id="d">Barras horizontales con las personas necesarias con 20 dominios para que la espera media no pase de 0,5 semanas: un equipo central necesita 5 personas sin penalización de contexto, 6 con penalización 0,5 y 8 con 1,0; equipos por dominio necesitan 10 en total con 0,5 persona por dominio, con una espera de 0,87 que no cumple, y 13 con 0,65.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="469" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Con 20 dominios, personas necesarias para que la espera media no pase de 0,5 semanas según quién es dueño</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">del dato</tspan></text><line x1="374" y1="68" x2="374" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="374" y1="288" x2="374" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="374" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374" dy="0">0</tspan></text><line x1="549.293" y1="68" x2="549.293" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="549.293" y1="288" x2="549.293" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="549.293" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="549.293" dy="0">5</tspan></text><line x1="724.587" y1="68" x2="724.587" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="724.587" y1="288" x2="724.587" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="724.587" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="724.587" dy="0">10</tspan></text><line x1="899.88" y1="68" x2="899.88" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="288" x2="899.88" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">15</tspan></text><line x1="374" y1="288" x2="899.88" y2="288" stroke="#5b7280" stroke-width="1.6"/><text x="364" y="86" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Central, sin penalización de contexto (0,12</tspan></text><text x="364" y="103" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">semanas)</tspan></text><text x="364" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Central, penalización 0,5 (0,44)</tspan></text><text x="364" y="182.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Central, penalización 1,0 (0,38)</tspan></text><text x="364" y="218" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Un equipo por dominio, 0,5 persona cada uno</tspan></text><text x="364" y="235" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">(0,87: no cumple)</tspan></text><text x="364" y="262" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Un equipo por dominio, 0,65 persona cada uno</tspan></text><text x="364" y="279" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">(0,47)</tspan></text><rect x="374" y="74" width="175.293" height="32" rx="3" fill="#102a43"/><text x="556.293" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="556.293" dy="0">5</tspan></text><rect x="374" y="118" width="210.352" height="32" rx="3" fill="#102a43"/><text x="591.352" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="591.352" dy="0">6</tspan></text><rect x="374" y="162" width="280.469" height="32" rx="3" fill="#102a43"/><text x="661.469" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="661.469" dy="0">8</tspan></text><rect x="374" y="206" width="350.587" height="32" rx="3" fill="#102a43"/><text x="731.587" y="226.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="731.587" dy="0">10</tspan></text><rect x="374" y="250" width="455.763" height="32" rx="3" fill="#102a43"/><text x="836.763" y="270.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="836.763" dy="0">13</tspan></text><text x="636.94" y="332" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="636.94" dy="0">Personas en total</tspan></text><rect x="10" y="346" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="370.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, la espera media en semanas. En este modelo la propiedad por dominio no ahorra personas: mueve el trabajo</tspan></text><text x="470" y="387.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y necesita más. Lo que compra es que el conocimiento del dominio deje de ser una penalización del equipo central y que el</tspan></text><text x="470" y="404.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">producto de datos tenga un dueño. La penalización de contexto es un supuesto del autor.</tspan></text><text x="470" y="451.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
