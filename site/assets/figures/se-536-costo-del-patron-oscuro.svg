<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué cuesta un flujo de cancelación escondido</title><desc id="d">Líneas con el ingreso neto acumulado de 12 meses simulados de dos flujos de suscripción: el honesto suma 22 965 al mes 3, 76 403 al mes 6 y 256 658 al mes 12, y el de cancelación escondida 26 972, 89 830 y 294 799, con 956 reclamos frente a 104.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué cuesta un flujo de cancelación escondido</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cancelación escondida</tspan></text><rect x="222.34" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Honesto</tspan></text><line x1="108.78" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="387" x2="108.78" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">0</tspan></text><line x1="108.78" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="287" x2="108.78" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">100 000</tspan></text><line x1="108.78" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="187" x2="108.78" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">200 000</tspan></text><line x1="108.78" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="103.78" y1="87" x2="108.78" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="99.78" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="99.78" dy="0">300 000</tspan></text><line x1="108.78" y1="87" x2="108.78" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="126.78" y1="87" x2="126.78" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="126.78" y1="387" x2="126.78" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="126.78" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="126.78" dy="0">3</tspan></text><line x1="381.853" y1="87" x2="381.853" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="381.853" y1="387" x2="381.853" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="381.853" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="381.853" dy="0">6</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">12</tspan></text><line x1="108.78" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Ingreso neto acumulado</text><text x="509.39" y="433" fon