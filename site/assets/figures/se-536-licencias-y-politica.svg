<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué bloquea una política de distribución</title><desc id="d">Barras horizontales apiladas con 60 dependencias sintéticas: un analizador de expresiones de licencia clasifica 42 como permitidas, 11 por revisar, 4 bloqueadas y 3 desconocidas, mientras la búsqueda ingenua de la cadena GPL marca 15, de las cuales 11 no están bloqueadas, ve las 4 bloqueadas y da por buenas las 3 desconocidas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué bloquea una política de distribución</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Permitidas</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Por revisar</tspan></text><rect x="270.34" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="290.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="290.34" dy="0">Bloqueadas</tspan></text><rect x="393.74" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="413.74" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="413.74" dy="0">Desconocidas (vacío, NOASSERTION, referencia propia)</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Marcadas sin estar bloqueadas</tspan></text><line x1="224" y1="101" x2="224" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="181" x2="224" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="441.233" y1="101" x2="441.233" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="441.233" y1="181" x2="441.233" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="441.233" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="441.233" dy="0">20</tspan></text><line x1="658.467" y1="101" x2="658.467" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="658.467" y1="181" x2="658.467" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="658.467" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="658.467" dy="0">40</tspan></text><line x1="875.7" y1="101" x2="875.7" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="181" x2="875.7" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">60</tspan></text><line x1="224" y1="181" x2="875.7" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="125.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Analizador de licencias</tspan></text><text x="214" y="165.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Búsqueda ingenua de GPL</tspan></text><rect x="224" y="108" width="456.19" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="452.095" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452.095" dy="0">42</tspan></text><rect x="680.19" y="108" width="119.478" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="739.929" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="739.929" dy="0">11</tspan></text><rect x="799.668" y="108" width="43.4467" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="821.392" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.392" dy="0">4</tspan></text><rect x="843.115" y="108" width="32.585" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="859.408" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="859.408" dy="0">3</tspan></text><rect x="875.7" y="108" width="0" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="125.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">60</tspan></text><rect x="224" y="148" width="0" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="224" y="148" width="0" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="224" y="148" width="43.4467" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="245.723" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="245.723" dy="0">4</tspan></text><rect x="267.447" y="148" width="0" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><rect x="267.447" y="148" width="119.478" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="327.186" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="327.186" dy="0">11</tspan></text><text x="393.925" y="165.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="393.925" dy="0">15</tspan></text><text x="549.85" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="549.85" dy="0">dependencias clasificadas o marcadas</tspan></text><rect x="10" y="239" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La búsqueda ingenua deja sin marcar las otras 45 dependencias (entre ellas las 3 desconocidas) y marca 15 dependencias,</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">casi cuatro veces las 4 bloqueadas (porque encuentra LGPL, MIT OR GPL-2.0-only y excepciones), no deja de ver ninguna</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">bloqueada y a la vez no ve las tres desconocidas. Los dos errores son distintos: uno frena trabajo innecesariamente y el</tspan></text><text x="470" y="313.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">otro deja pasar lo que no se sabe.</tspan></text><text x="470" y="361.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
