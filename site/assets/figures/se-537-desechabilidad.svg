<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 555" width="980" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Desechabilidad y configuración: qué pasa al parar un proceso, y un mismo artefacto con tres entornos</title><desc id="d">Tabla con seis comprobaciones: un corte inmediato con 100 trabajos en una cola en memoria completa 40 y pierde 60, un drenaje ordenado completa 41 y devuelve 60 a la cola sin perder ninguno, el mismo artefacto con configuración de desarrollo sale con código 0, con configuración de producción sale con código 0 y otros umbrales y sin configurar sale con código 1 y un mensaje, y el arranque de un proceso de Python tarda una mediana de 116 milisegundos vacío y 249 con cuatro módulos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="555" fill="#ffffff"/><rect x="10" y="12" width="464" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="242" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="242" dy="0">Comprobación</tspan></text><rect x="480" y="12" width="484" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="722" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722" dy="0">Resultado</tspan></text><rect x="10" y="56" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Corte inmediato con 100 trabajos</tspan></text><rect x="480" y="56" width="484" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">40 completados, 60 perdidos</tspan></text><rect x="10" y="120" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="152.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Drenaje ordenado, devuelve lo pendiente</tspan></text><rect x="480" y="120" width="484" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">41 completados, 60 devueltos a la cola, 0 perdidos</tspan></text><rect x="10" y="184" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="216.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Mismo artefacto, configuración de desarrollo</tspan></text><rect x="480" y="184" width="484" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Código 0 y umbrales 12 y 48</tspan></text><rect x="10" y="248" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="280.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Mismo artefacto, configuración de producción</tspan></text><rect x="480" y="248" width="484" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Código 0 y umbrales 1, 24 y 72</tspan></text><rect x="10" y="312" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="344.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Mismo artefacto, sin configurar</tspan></text><rect x="480" y="312" width="484" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="344.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">Código 1: «falta AVISOS_UMBRALES»</tspan></text><rect x="10" y="376" width="464" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="242" y="408.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="242" dy="0">Arranque de un proceso Python (mediana)</tspan></text><rect x="480" y="376" width="484" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="722" y="408.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="722" dy="0">116 ms vacío; 249 ms con cuatro módulos</tspan></text><rect x="10" y="444" width="960" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="490" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">La misma huella del archivo con configuración distinta es la paridad que pide el factor de configuración; fallar de inmediato</tspan></text><text x="490" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">cuando falta es mejor que arrancar con un valor por defecto invisible. Los trabajos y el corte son un modelo; el arranque y la</tspan></text><text x="490" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="490" dy="0">ejecución del artefacto sí se midieron.</tspan></text><text x="490" y="541.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
