<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 403" width="980" height="403" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un linter de cuatro señales de 12-factor sobre una aplicación con defectos y su versión corregida</title><desc id="d">Tabla con cuatro señales contadas por un linter de árbol sintáctico sobre dos versiones de la misma aplicación: URL fija 1 y 0, estado en memoria del proceso 2 y 0, registro en archivo local 1 y 0, y lecturas del entorno 1 y 2 en la versión corregida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="403" fill="#ffffff"/><rect x="10" y="12" width="394" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="207" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="207" dy="0">Señal</tspan></text><rect x="410" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="547" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="547" dy="0">Aplicación con defectos</tspan></text><rect x="690" y="12" width="274" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="827" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="827" dy="0">Aplicación corregida</tspan></text><rect x="10" y="56" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">URL fija en el código</tspan></text><rect x="410" y="56" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">1</tspan></text><rect x="690" y="56" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0</tspan></text><rect x="10" y="118" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Estado en memoria del proceso</tspan></text><rect x="410" y="118" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">2</tspan></text><rect x="690" y="118" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0</tspan></text><rect x="10" y="180" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Registro en archivo local</tspan></text><rect x="410" y="180" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">1</tspan></text><rect x="690" y="180" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">0</tspan></text><rect x="10" y="242" width="394" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="207" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="207" dy="0">Lecturas del entorno</tspan></text><rect x="410" y="242" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="547" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547" dy="0">1</tspan></text><rect x="690" y="242" width="274" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="827" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="827" dy="0">2</tspan></text><rect x="10" y="308" width="960" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">El linter ve la forma del código, no su comportamiento: una URL construida por concatenación o un estado guardado en un atributo</tspan></text><text x="490" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">de clase pasarían. Detecta cuatro señales de dos aplicaciones de juguete; no certifica que una aplicación sea 12-factor.</tspan></text><text x="490" y="389.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
