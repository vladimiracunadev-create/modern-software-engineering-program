<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto cuesta esperar según el orden</title><desc id="d">Barras agrupadas con el costo de 3 000 carteras sintéticas de 12 iniciativas frente al óptimo: el orden de llegada cuesta 1,80 veces de media y 2,61 en el percentil 95, lo más corto primero 1,30 y 1,66, el mayor costo de demora primero 1,13 y 1,26, y el costo de demora entre duración 1,00 y 1,00.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto cuesta esperar según el orden</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Costo medio frente al óptimo</tspan></text><rect x="275.12" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="295.12" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="295.12" dy="0">Peor caso (p95)</tspan></text><line x1="63.54" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="375" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="281.667" x2="920" y2="281.667" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="281.667" x2="63.54" y2="281.667" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="286.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">1</tspan></text><line x1="63.54" y1="188.333" x2="920" y2="188.333" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="188.333" x2="63.54" y2="188.333" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="192.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="95" x2="63.54" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">3</tspan></text><line x1="63.54" y1="95" x2="63.54" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">veces el costo del orden óptimo</text><rect x="84.9515" y="207" width="83.646" height="168" rx="3" fill="#087f8c"/><text x="126.774" y="201" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.774" dy="0">1,80</tspan></text><rect x="172.597" y="131.4" width="83.646" height="243.6" rx="3" fill="#c0432f"/><text x="214.421" y="125.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214.421" dy="0">2,61</tspan></text><text x="170.597" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">Orden de llegada</tspan></text><rect x="299.067" y="253.667" width="83.646" height="121.333" rx="3" fill="#087f8c"/><text x="340.889" y="247.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="340.889" dy="0">1,30</tspan></text><rect x="386.713" y="220.067" width="83.646" height="154.933" rx="3" fill="#c0432f"/><text x="428.536" y="214.067" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="428.536" dy="0">1,66</tspan></text><text x="384.713" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">Lo más corto primero</tspan></text><rect x="513.182" y="269.533" width="83.646" height="105.467" rx="3" fill="#087f8c"/><text x="555.005" y="263.533" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="555.005" dy="0">1,13</tspan></text><rect x="600.828" y="257.4" width="83.646" height="117.6" rx="3" fill="#c0432f"/><text x="642.651" y="251.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642.651" dy="0">1,26</tspan></text><text x="598.828" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">Mayor costo de demora</tspan></text><text x="598.828" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">primero</tspan></text><rect x="727.296" y="281.667" width="83.646" height="93.3333" rx="3" fill="#087f8c"/><text x="769.119" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="769.119" dy="0">1,00</tspan></text><rect x="814.942" y="281.667" width="83.646" height="93.3333" rx="3" fill="#c0432f"/><text x="856.765" y="275.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.765" dy="0">1,00</tspan></text><text x="812.942" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">Costo de demora entre</tspan></text><text x="812.942" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">duración</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Esperar sin criterio cuesta un 80 % más que el óptimo de media y más del doble en una de cada veinte carteras; ordenar solo</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por valor o solo por duración recupera buena parte, pero no todo. La última categoría es 1,00 por construcción: es el orden</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que minimiza el costo.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
