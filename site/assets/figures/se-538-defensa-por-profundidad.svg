<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué impresión deja cada estrategia de defensa</title><desc id="d">Barras horizontales con el porcentaje de errores seguros detectados en una persona que responde seis preguntas de profundidad creciente: con conocimiento de nivel 2 defender todo con seguridad se descubre en 98,4 por ciento de los casos y declarar el límite en 0; con nivel 4, 87,1 y 0; las impresiones medias son −4,8, 2,3, 0,56 y 4,3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué impresión deja cada estrategia de defensa</tspan></text><line x1="374" y1="49" x2="374" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="374" y1="225" x2="374" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="374" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374" dy="0">0</tspan></text><line x1="501.44" y1="49" x2="501.44" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="501.44" y1="225" x2="501.44" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="501.44" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="501.44" dy="0">25</tspan></text><line x1="628.88" y1="49" x2="628.88" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="628.88" y1="225" x2="628.88" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="628.88" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="628.88" dy="0">50</tspan></text><line x1="756.32" y1="49" x2="756.32" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="756.32" y1="225" x2="756.32" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="756.32" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="756.32" dy="0">75</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="225" x2="883.76" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="374" y1="225" x2="883.76" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="364" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Nivel 2 · defiende todo con seguridad (impresión</tspan></text><text x="364" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">−4,8)</tspan></text><text x="364" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Nivel 2 · declara su límite y propone cómo</tspan></text><text x="364" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">comprobar (2,3)</tspan></text><text x="364" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Nivel 4 · defiende todo con seguridad (0,56)</tspan></text><text x="364" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Nivel 4 · declara su límite y propone cómo</tspan></text><text x="364" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">comprobar (4,3)</tspan></text><rect x="374" y="55" width="501.604" height="32" rx="3" fill="#c0432f"/><text x="882.604" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.604" dy="0">98,4</tspan></text><rect x="374" y="99" width="2" height="32" rx="3" fill="#c0432f"/><text x="383" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383" dy="0">0,0</tspan></text><rect x="374" y="143" width="444.001" height="32" rx="3" fill="#c0432f"/><text x="825.001" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="825.001" dy="0">87,1</tspan></text><rect x="374" y="187" width="2" height="32" rx="3" fill="#c0432f"/><text x="383" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383" dy="0">0,0</tspan></text><text x="628.88" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="628.88" dy="0">% de los casos con un error seguro detectado</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Entre paréntesis, la impresión media. Con conocimiento de nivel 4, defender todo deja una impresión cercana a cero;</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">declarar el límite, de 4,3. Con nivel 2 la diferencia es mayor (−4,8 frente a 2,3), porque hay más preguntas en que</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">inventar.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
