<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 427" width="980" height="427" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Módulo heredado y módulo nuevo ejecutados sobre las mismas 20 000 peticiones: divergencias por causa</title><desc id="d">Tabla con las divergencias entre un módulo de avisos heredado y su reemplazo sobre 20 000 peticiones sintéticas: 145 por redondeo en el borde, 57 por el plazo de extensión que el módulo nuevo olvidó y 1 por cambio de hora, 203 en total, un 1,01 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="427" fill="#ffffff"/><rect x="10" y="12" width="554" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="287" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="287" dy="0">Causa</tspan></text><rect x="570" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="667" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="667" dy="0">Divergencias</tspan></text><rect x="770" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">Proporción</tspan></text><rect x="10" y="56" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Redondeo en el borde (el módulo nuevo trunca minutos)</tspan></text><rect x="570" y="56" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">145</tspan></text><rect x="770" y="56" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="88.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">71,4 %</tspan></text><rect x="10" y="120" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="152.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Plazo de extensión (el módulo nuevo lo olvidó)</tspan></text><rect x="570" y="120" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">57</tspan></text><rect x="770" y="120" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">28,1 %</tspan></text><rect x="10" y="184" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="216.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Cambio de hora (solo 2 días al año)</tspan></text><rect x="570" y="184" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">1</tspan></text><rect x="770" y="184" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">0,5 %</tspan></text><rect x="10" y="248" width="554" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="287" y="280.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287" dy="0">Total de divergencias en 20 000 peticiones</tspan></text><rect x="570" y="248" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="667" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667" dy="0">203</tspan></text><rect x="770" y="248" width="194" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="280.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">1,01 %</tspan></text><rect x="10" y="316" width="960" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="490" y="340.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">Tres defectos sembrados por el autor, con frecuencias tan distintas como 145, 57 y 1. Ejecutar los dos módulos en paralelo y</tspan></text><text x="490" y="357.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">comparar las salidas es la forma más barata de encontrar lo que ninguna prueba imaginó, pero solo encuentra lo que el tráfico</tspan></text><text x="490" y="374.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="490" dy="0">real contiene.</tspan></text><text x="490" y="413.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
