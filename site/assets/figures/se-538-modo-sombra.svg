<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 419" width="980" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de ver cada causa de divergencia según la fracción del tráfico que se compara (500 repeticiones por fila)</title><desc id="d">Tabla con la probabilidad de observar cada divergencia según la fracción del tráfico comparada en modo sombra: con 1 por ciento se ve el plazo de extensión el 46 por ciento de las veces, el cambio de hora el 1 por ciento y el redondeo el 75 por ciento; con 5 por ciento 95, 6 y 100; con 25 por ciento 100, 27 y 100; con todo el tráfico se ven los tres siempre.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="419" fill="#ffffff"/><rect x="10" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="122" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="122" dy="0">Fracción comparada</tspan></text><rect x="240" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="362" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="362" dy="0">Plazo de extensión</tspan></text><rect x="490" y="12" width="224" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="602" dy="0">Cambio de hora</tspan></text><rect x="720" y="12" width="244" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="842" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="842" dy="0">Redondeo en el borde</tspan></text><rect x="10" y="56" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">1 %</tspan></text><rect x="240" y="56" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">46 %</tspan></text><rect x="490" y="56" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">1 %</tspan></text><rect x="720" y="56" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">75 %</tspan></text><rect x="10" y="118" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">5 %</tspan></text><rect x="240" y="118" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">95 %</tspan></text><rect x="490" y="118" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">6 %</tspan></text><rect x="720" y="118" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">100 %</tspan></text><rect x="10" y="180" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">25 %</tspan></text><rect x="240" y="180" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">100 %</tspan></text><rect x="490" y="180" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">27 %</tspan></text><rect x="720" y="180" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">100 %</tspan></text><rect x="10" y="242" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="122" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="122" dy="0">100 %</tspan></text><rect x="240" y="242" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="362" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="362" dy="0">100 %</tspan></text><rect x="490" y="242" width="224" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="602" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="602" dy="0">100 %</tspan></text><rect x="720" y="242" width="244" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="842" dy="0">100 %</tspan></text><rect x="10" y="308" width="960" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="332.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Un defecto que ocurre una vez en 20 000 peticiones no se ve comparando el 1 % ni el 25 % del tráfico con fiabilidad: su</tspan></text><text x="490" y="349.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">probabilidad es la fracción comparada. Comparar todo es la única forma de ver lo raro, y aun así solo si ocurre durante la</tspan></text><text x="490" y="366.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">comparación.</tspan></text><text x="490" y="405.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
