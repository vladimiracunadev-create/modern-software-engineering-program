x="740" y="56" width="114" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">0,596</tspan></text><rect x="860" y="56" width="114" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="92.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">0,685</tspan></text><rect x="10" y="128" width="284" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="164.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Microservicios (4)</tspan></text><rect x="300" y="128" width="94" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">194</tspan></text><rect x="400" y="128" width="144" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">99,601 %</tspan></text><rect x="550" y="128" width="94" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">0</tspan></text><rect x="650" y="128" width="84" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">16</tspan></text><rect x="740" y="128" width="114" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">0,583</tspan></text><rect x="860" y="128" width="114" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">0,670</tspan></text><rect x="10" y="200" width="284" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="236.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="152" dy="0">Celdas (8) con monolito modular</tspan></text><rect x="300" y="200" width="94" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347" dy="0">125</tspan></text><rect x="400" y="200" width="144" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="472" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472" dy="0">99,890 %</tspan></text><rect x="550" y="200" width="94" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="597" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597" dy="0">11</tspan></text><rect x="650" y="200" width="84" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="692" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="692" dy="0">18</tspan></text><rect x="740" y="200" width="114" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="797" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="797" dy="0">0,710</tspan></text><rect x="860" y="200" width="114" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="917" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="917" dy="0">0,652</tspan></text><rect x="10" y="276" width="970" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="495" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Ningún candidato cumple los seis escenarios y los tres dejan tres o cuatro sin cumplir; las utilidades difieren en menos de 0,13.</tspan></text><text x="495" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="495" dy="0">Con cliente dominante ganan las celdas y sin él el monolito modular; la decisión depende del contexto antes que del estilo.</tspan></text><text x="495" y="357.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
