<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 547" width="940" height="547" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres candidatos con 12 equipos: valores que produce el modelo y utilidad ponderada en cada contexto</title><desc id="d">Barras agrupadas con la utilidad ponderada de tres candidatos con 12 equipos en dos contextos: el monolito modular 0,596 con cliente dominante y 0,685 sin él; los microservicios 0,583 y 0,670; las celdas con monolito modular 0,710 y 0,652.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="547" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres candidatos con 12 equipos: valores que produce el modelo y utilidad ponderada en cada contexto</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Con cliente dominante</tspan></text><rect x="222.34" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Sin cliente dominante</tspan></text><line x1="78.62" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="355" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="290" x2="920" y2="290" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="290" x2="78.62" y2="290" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="294.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,2</tspan></text><line x1="78.62" y1="225" x2="920" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="225" x2="78.62" y2="225" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="229.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,4</tspan></text><line x1="78.62" y1="160" x2="920" y2="160" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="160" x2="78.62" y2="160" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="164.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,6</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,8</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Utilidad ponderada</text><rect x="106.666" y="161.3" width="110.184" height="193.7" rx="3" fill="#087f8c"/><text x="161.758" y="155.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">0,596</tspan></text><rect x="220.85" y="132.375" width="110.184" height="222.625" rx="3" fill="#102a43"/><text x="275.942" y="126.375" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">0,685</tspan></text><text x="218.85" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Monolito modular</tspan></text><rect x="387.126" y="165.525" width="110.184" height="189.475" rx="3" fill="#087f8c"/><text x="442.218" y="159.525" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">0,583</tspan></text><rect x="501.31" y="137.25" width="110.184" height="217.75" rx="3" fill="#102a43"/><text x="556.402" y="131.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">0,670</tspan></text><text x="499.31" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Microservicios (4)</tspan></text><rect x="667.586" y="124.25" width="110.184" height="230.75" rx="3" fill="#087f8c"/><text x="722.678" y="118.25" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">0,710</tspan></text><rect x="781.77" y="143.1" width="110.184" height="211.9" rx="3" fill="#102a43"/><text x="836.862" y="137.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">0,652</tspan></text><text x="779.77" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Celdas (8) con monolito modular</tspan></text><rect x="10" y="407" width="920" height="92.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Valores del modelo (p99 en ms, disponibilidad, equipos a coordinar, costo): monolito modular 80, 99,950 %, 11 y 3;</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">microservicios 194, 99,601 %, 0 y 16; celdas 125, 99,890 %, 11 y 18. Ningún candidato cumple los seis escenarios y los tres</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">dejan tres o cuatro sin cumplir; las utilidades difieren en menos de 0,13. Con cliente dominante ganan las celdas y sin él</tspan></text><text x="470" y="481.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">el monolito modular; la decisión depende del contexto antes que del estilo.</tspan></text><text x="470" y="529.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
