<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 527" width="990" height="527" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Seis escenarios de calidad de Avisos con su medida y su importancia en dos contextos</title><desc id="d">Tabla con seis escenarios de calidad con su medida y su importancia en dos contextos: latencia con p99 de hasta 200 milisegundos y disponibilidad de al menos 99,9 por ciento son de importancia alta en ambos, el radio de impacto de hasta 15 por ciento de los inquilinos es alta con un cliente dominante y baja sin él, y la coordinación de despliegue, el costo y la extensión son de importancia media en ambos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="990" height="527" fill="#ffffff"/><rect x="10" y="12" width="314" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="167" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="167" dy="0">Escenario</tspan></text><rect x="330" y="12" width="324" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="492" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="492" dy="0">Medida de respuesta</tspan></text><rect x="660" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="737" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">Con cliente</tspan></text><text x="737" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737" dy="0">dominante</tspan></text><rect x="820" y="12" width="154" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="897" y="25.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="897" dy="0">Sin cliente</tspan></text><text x="897" y="43.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="897" dy="0">dominante</tspan></text><rect x="10" y="56" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="87.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">S1 latencia</tspan></text><rect x="330" y="56" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">p99 ≤ 200 ms</tspan></text><rect x="660" y="56" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Alta</tspan></text><rect x="820" y="56" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="87.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Alta</tspan></text><rect x="10" y="118" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="149.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">S2 disponibilidad</tspan></text><rect x="330" y="118" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">≥ 99,9 %</tspan></text><rect x="660" y="118" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Alta</tspan></text><rect x="820" y="118" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Alta</tspan></text><rect x="10" y="180" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="211.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">S3 radio de impacto</tspan></text><rect x="330" y="180" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">≤ 15 % de inquilinos</tspan></text><rect x="660" y="180" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Alta</tspan></text><rect x="820" y="180" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Baja</tspan></text><rect x="10" y="242" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">S4 coordinación de despliegue</tspan></text><rect x="330" y="242" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">≤ 2 equipos</tspan></text><rect x="660" y="242" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Media</tspan></text><rect x="820" y="242" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Media</tspan></text><rect x="10" y="304" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="335.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">S5 costo</tspan></text><rect x="330" y="304" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">≤ 12 unidades</tspan></text><rect x="660" y="304" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Media</tspan></text><rect x="820" y="304" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="335.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Media</tspan></text><rect x="10" y="366" width="314" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="167" y="397.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="167" dy="0">S6 extensión</tspan></text><rect x="330" y="366" width="324" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="492" y="397.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="492" dy="0">canal nuevo sin tocar el núcleo</tspan></text><rect x="660" y="366" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="737" y="397.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737" dy="0">Media</tspan></text><rect x="820" y="366" width="154" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="897" y="397.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="897" dy="0">Media</tspan></text><rect x="10" y="432" width="970" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="495" y="456.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">Cada escenario tiene una medida que se puede comprobar; la importancia es una decisión de negocio, no una medición. El único</tspan></text><text x="495" y="473.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="495" dy="0">escenario que cambia de importancia entre los dos contextos es el radio de impacto, y eso es suficiente para cambiar el resultado.</tspan></text><text x="495" y="513.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="495" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
