<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué candidato gana según el contexto, el número de equipos y la disponibilidad supuesta de la cadena de microservicios</title><desc id="d">Barras apiladas horizontales con los casos, de tres tamaños de equipo, en que gana cada candidato en cuatro situaciones: con cliente dominante ganan las celdas en los 3; sin él, el monolito modular en 2 y los microservicios desde 26 equipos en 1; con la cadena de microservicios al 99,95 por ciento ganan los microservicios en los 3 casos de ambos contextos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué candidato gana según el contexto, el número de equipos y la disponibilidad supuesta de la cadena de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">microservicios</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Celdas</tspan></text><rect x="109.24" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="129.24" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="129.24" dy="0">Monolito modular</tspan></text><rect x="277.88" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="297.88" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="297.88" dy="0">Microservicios</tspan></text><line x1="314" y1="96" x2="314" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="272" x2="314" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="501.233" y1="96" x2="501.233" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="501.233" y1="272" x2="501.233" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="501.233" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="501.233" dy="0">1</tspan></text><line x1="688.467" y1="96" x2="688.467" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="688.467" y1="272" x2="688.467" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="688.467" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="688.467" dy="0">2</tspan></text><line x1="875.7" y1="96" x2="875.7" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="272" x2="875.7" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">3</tspan></text><line x1="314" y1="272" x2="875.7" y2="272" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="122.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Con cliente dominante</tspan></text><text x="304" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Sin cliente dominante</tspan></text><text x="304" y="202" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Con cliente dominante y cadena al 99,95</tspan></text><text x="304" y="219" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">%</tspan></text><text x="304" y="246" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Sin cliente dominante y cadena al 99,95</tspan></text><text x="304" y="263" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">%</tspan></text><rect x="314" y="103" width="561.7" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="594.85" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="594.85" dy="0">3</tspan></text><rect x="875.7" y="103" width="0" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><rect x="875.7" y="103" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="882.7" y="122.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3</tspan></text><rect x="314" y="147" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="314" y="147" width="374.467" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="501.233" y="166.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="501.233" dy="0">2</tspan></text><rect x="688.467" y="147" width="187.233" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="782.083" y="166.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782.083" dy="0">1</tspan></text><text x="882.7" y="166.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3</tspan></text><rect x="314" y="191" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="314" y="191" width="0" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><rect x="314" y="191" width="561.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="594.85" y="210.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="594.85" dy="0">3</tspan></text><text x="882.7" y="210.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3</tspan></text><rect x="314" y="235" width="0" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><rect x="314" y="235" width="0" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><rect x="314" y="235" width="561.7" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="594.85" y="254.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="594.85" dy="0">3</tspan></text><text x="882.7" y="254.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">3</tspan></text><text x="594.85" y="316" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="594.85" dy="0">Casos de 3 tamaños de equipo (4, 12 y 30)</tspan></text><rect x="10" y="330" width="920" height="92.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Sin cliente dominante, el monolito modular gana con 4 y 12 equipos y los microservicios con 30 (desde 26). El punto de</tspan></text><text x="470" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sensibilidad más fuerte no es el número de equipos sino un supuesto: que la cadena de cuatro servicios tenga 99,601 % de</tspan></text><text x="470" y="388.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">disponibilidad. Cambiarlo a 99,95 % (con degradación y reintentos) invierte la decisión en todos los casos, y por eso esa</tspan></text><text x="470" y="404.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">medida debe ir al ADR como supuesto a verificar.</tspan></text><text x="470" y="452.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
