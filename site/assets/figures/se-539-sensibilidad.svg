<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 443" width="980" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué candidato gana según el contexto, el número de equipos y la disponibilidad supuesta de la cadena de microservicios</title><desc id="d">Tabla con el candidato de mayor utilidad según el contexto y el número de equipos: con cliente dominante ganan las celdas con 4, 12 y 30 equipos, sin cliente dominante gana el monolito modular con 4 y 12 equipos y los microservicios desde 26, y si la disponibilidad de la cadena de microservicios fuese 99,95 por ciento en lugar de 99,601 ganan los microservicios en ambos contextos con cualquier número de equipos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="443" fill="#ffffff"/><rect x="10" y="12" width="374" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="197" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197" dy="0">Situación</tspan></text><rect x="390" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="482" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="482" dy="0">4 equipos</tspan></text><rect x="580" y="12" width="184" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="672" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672" dy="0">12 equipos</tspan></text><rect x="770" y="12" width="194" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="867" y="34.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="867" dy="0">30 equipos</tspan></text><rect x="10" y="56" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Con cliente dominante</tspan></text><rect x="390" y="56" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">Celdas</tspan></text><rect x="580" y="56" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Celdas</tspan></text><rect x="770" y="56" width="194" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">Celdas</tspan></text><rect x="10" y="124" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="158.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Sin cliente dominante</tspan></text><rect x="390" y="124" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">Monolito modular</tspan></text><rect x="580" y="124" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Monolito modular</tspan></text><rect x="770" y="124" width="194" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="150.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">Microservicios (desde</tspan></text><text x="867" y="166.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">26)</tspan></text><rect x="10" y="192" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="226.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Con cliente dominante y cadena al 99,95 %</tspan></text><rect x="390" y="192" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">Microservicios</tspan></text><rect x="580" y="192" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Microservicios</tspan></text><rect x="770" y="192" width="194" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="226.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">Microservicios</tspan></text><rect x="10" y="260" width="374" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="197" y="294.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197" dy="0">Sin cliente dominante y cadena al 99,95 %</tspan></text><rect x="390" y="260" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="482" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">Microservicios</tspan></text><rect x="580" y="260" width="184" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="672" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672" dy="0">Microservicios</tspan></text><rect x="770" y="260" width="194" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="867" y="294.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867" dy="0">Microservicios</tspan></text><rect x="10" y="332" width="960" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">El punto de sensibilidad más fuerte no es el número de equipos sino un supuesto: que la cadena de cuatro servicios tenga 99,601 %</tspan></text><text x="490" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">de disponibilidad. Cambiarlo a 99,95 % (con degradación y reintentos) invierte la decisión en todos los casos, y por eso esa</tspan></text><text x="490" y="390.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">medida debe ir al ADR como supuesto a verificar.</tspan></text><text x="490" y="429.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Modelo con parámetros del autor y semilla fija 44; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
