<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" width="940" height="390" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántas afirmaciones se comprueban en una hora</title><desc id="d">Rangos de las afirmaciones comprobadas en 5 000 revisiones simuladas de 60 minutos sobre un dossier de 30 afirmaciones: sin trazabilidad 5,7 de media, entre 4 y 7 en los percentiles 10 y 90; con una tabla de afirmación, evidencia y huella 21,7, entre 19 y 24.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="390" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántas afirmaciones se comprueban en una hora</tspan></text><rect x="16" y="45" width="12" height="12" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">p10</tspan></text><polygon points="92.62,44.1 99.22,56.4 86.02,56.4" fill="#946512" stroke="#946512" stroke-width="2"/><text x="106.62" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="106.62" dy="0">media</tspan></text><polygon points="178.32,43.5 185.82,51 178.32,58.5 170.82,51" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="192.32" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="192.32" dy="0">p90</tspan></text><line x1="344" y1="77" x2="344" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="225" x2="344" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0</tspan></text><line x1="453.2" y1="77" x2="453.2" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="453.2" y1="225" x2="453.2" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="453.2" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="453.2" dy="0">5</tspan></text><line x1="562.4" y1="77" x2="562.4" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="562.4" y1="225" x2="562.4" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="562.4" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.4" dy="0">10</tspan></text><line x1="671.6" y1="77" x2="671.6" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="671.6" y1="225" x2="671.6" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="671.6" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="671.6" dy="0">15</tspan></text><line x1="780.8" y1="77" x2="780.8" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="780.8" y1="225" x2="780.8" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="780.8" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780.8" dy="0">20</tspan></text><line x1="890" y1="77" x2="890" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="890" y1="225" x2="890" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="890" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="890" dy="0">25</tspan></text><line x1="344" y1="225" x2="890" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="118.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Sin trazabilidad</tspan></text><text x="314" y="192.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="314" dy="0">Con tabla afirmación–evidencia–huella</tspan></text><line x1="431.36" y1="114" x2="496.88" y2="114" stroke="#8a9aa3" stroke-width="5"/><rect x="424.36" y="107" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="431.36" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="431.36" dy="0">4,0</tspan></text><polygon points="468.488,105.95 476.188,120.3 460.788,120.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="468.488" y="143" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="468.488" dy="0">5,7</tspan></text><polygon points="496.88,105.25 505.63,114 496.88,122.75 488.13,114" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="496.88" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="496.88" dy="0">7,0</tspan></text><line x1="758.96" y1="188" x2="868.16" y2="188" stroke="#8a9aa3" stroke-width="5"/><rect x="751.96" y="181" width="14" height="14" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="758.96" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="758.96" dy="0">19,0</tspan></text><polygon points="817.928,179.95 825.628,194.3 810.228,194.3" fill="#946512" stroke="#946512" stroke-width="2"/><text x="817.928" y="217" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="817.928" dy="0">21,7</tspan></text><polygon points="868.16,179.25 876.91,188 868.16,196.75 859.41,188" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="868.16" y="172" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="868.16" dy="0">24,0</tspan></text><text x="617" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="617" dy="0">afirmaciones comprobadas en 60 minutos</tspan></text><rect x="10" y="283" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">La tabla multiplica por casi cuatro lo que se puede comprobar en una hora; incluso así, no se llega a las treinta, por lo</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">que el verificador automático sigue siendo necesario.</tspan></text><text x="470" y="372.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
