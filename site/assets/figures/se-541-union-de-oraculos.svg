<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 505" width="960" height="505" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mutantes muertos por cada oráculo y por tres parejas de oráculos</title><desc id="d">Gráfico de barras con los mutantes no equivalentes muertos de 18 posibles: caso feliz 7, ocho pruebas de ejemplo 15, escenarios de aceptación 17, contrato con 400 estados 13 y modelo de referencia 18; entre las parejas, ocho pruebas más escenarios matan 17 y tanto ocho pruebas más contrato como escenarios más contrato matan los 18.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="505" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Caso feliz único</tspan></text><rect x="344" y="16" width="182" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="534" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="534" dy="0">7</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Ocho pruebas de ejemplo</tspan></text><rect x="344" y="62" width="390" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="742" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="742" dy="0">15</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Escenarios de aceptación</tspan></text><rect x="344" y="108" width="442" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="794" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="794" dy="0">17</tspan></text><text x="334" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Contrato (400 estados)</tspan></text><rect x="344" y="154" width="338" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="690" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="690" dy="0">13</tspan></text><text x="334" y="221" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Modelo de referencia</tspan></text><rect x="344" y="200" width="468" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="820" y="221" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820" dy="0">18</tspan></text><text x="334" y="267" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Ocho pruebas + escenarios</tspan></text><rect x="344" y="246" width="442" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="794" y="267" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="794" dy="0">17</tspan></text><text x="334" y="313" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Ocho pruebas + contrato</tspan></text><rect x="344" y="292" width="468" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="820" y="313" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820" dy="0">18</tspan></text><text x="334" y="359" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Escenarios + contrato</tspan></text><rect x="344" y="338" width="468" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="820" y="359" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820" dy="0">18</tspan></text><rect x="10" y="386" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="410.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Dos oráculos de naturaleza distinta cubren lo que uno solo no ve: las ocho pruebas y el contrato, que por separado dejan vivos</tspan></text><text x="480" y="427.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">3 y 5 mutantes, juntos no dejan ninguno. Dos oráculos parecidos (ocho pruebas y escenarios) comparten el punto ciego M01. Con</tspan></text><text x="480" y="444.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">18 mutantes y un programa pequeño no se puede ordenar nada en general.</tspan></text><text x="480" y="491.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
