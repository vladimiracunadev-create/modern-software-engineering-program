<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho pasos rojo-verde sobre el núcleo de Avisos: mutantes muertos tras cada prueba</title><desc id="d">Línea con los mutantes muertos acumulados tras cada una de las ocho pruebas de un ciclo rojo-verde sobre el núcleo de Avisos: 1, 6, 8, 9, 9, 11, 14 y 15 de 18 posibles; cada prueba nueva falló con la versión anterior y pasó con la nueva, y la quinta no añade ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho pasos rojo-verde sobre el núcleo de Avisos: mutantes muertos tras cada prueba</tspan></text><line x1="71.08" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="359" x2="71.08" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="275.667" x2="910" y2="275.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="275.667" x2="71.08" y2="275.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="280.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">5</tspan></text><line x1="71.08" y1="192.333" x2="910" y2="192.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="192.333" x2="71.08" y2="192.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="196.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="109" x2="910" y2="109" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="109" x2="71.08" y2="109" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">15</tspan></text><line x1="71.08" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="59" x2="71.08" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">18</tspan></text><line x1="71.08" y1="59" x2="71.08" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="59" x2="89.08" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="359" x2="89.08" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">1</tspan></text><line x1="203.783" y1="59" x2="203.783" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="203.783" y1="359" x2="203.783" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="203.783" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="203.783" dy="0">2</tspan></text><line x1="318.486" y1="59" x2="318.486" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="318.486" y1="359" x2="318.486" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="318.486" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="318.486" dy="0">3</tspan></text><line x1="433.189" y1="59" x2="433.189" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="433.189" y1="359" x2="433.189" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="433.189" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433.189" dy="0">4</tspan></te