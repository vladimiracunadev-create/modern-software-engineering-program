 r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="777.297" y="114.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="777.297" dy="0">14</tspan></text><circle cx="892" cy="109" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">15</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las ocho pruebas fallaron primero por la razón esperada y pasaron con la versión mínima; la prueba 5 no añadió ninguno</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">porque protege una regla (no avisar tras el vencimiento) que ninguno de los 18 mutantes elimina. La curva depende de qué 18</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mutantes escribió el autor.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
