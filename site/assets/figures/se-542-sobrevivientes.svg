<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres mutantes sobreviven a las ocho pruebas; tres pruebas guiadas por ellos matan los 18</title><desc id="d">Barras apiladas con los mutantes muertos y vivos de 18: tras las ocho pruebas de TDD mueren 15 y sobreviven M01, M12 y M16; al añadir tres pruebas guiadas por esos sobrevivientes mueren los 18.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="330" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres mutantes sobreviven a las ocho pruebas; tres pruebas guiadas por ellos matan los 18</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Muertos</tspan></text><rect x="116.78" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="136.78" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="136.78" dy="0">Vivos</tspan></text><line x1="324" y1="77" x2="324" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="165" x2="324" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="461.925" y1="77" x2="461.925" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="461.925" y1="165" x2="461.925" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="461.925" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.925" dy="0">5</tspan></text><line x1="599.85" y1="77" x2="599.85" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="599.85" y1="165" x2="599.85" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="599.85" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="599.85" dy="0">10</tspan></text><line x1="737.775" y1="77" x2="737.775" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="737.775" y1="165" x2="737.775" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="737.775" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="737.775" dy="0">15</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">20</tspan></text><line x1="324" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="103.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Ocho pruebas de TDD</tspan></text><text x="314" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Ocho pruebas más tres guiadas por los</tspan></text><text x="314" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">sobrevivientes</tspan></text><rect x="324" y="84" width="413.775" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="530.888" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="530.888" dy="0">15</tspan></text><rect x="737.775" y="84" width="82.755" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="779.153" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="779.153" dy="0">3</tspan></text><text x="827.53" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="827.53" dy="0">18</tspan></text><rect x="324" y="128" width="496.53" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="572.265" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="572.265" dy="0">18</tspan></text><rect x="820.53" y="128" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="827.53" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="827.53" dy="0">18</tspan></text><text x="599.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="599.85" dy="0">Mutantes no equivalentes</tspan></text><rect x="10" y="223" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los sobrevivientes señalan qué ejemplo falta; no sustituyen el criterio de quien diseña las pruebas. Matar los 18 no</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">demuestra que el código sea correcto: demuestra que estas 18 variantes se distinguen del original con estas pruebas.</tspan></text><text x="470" y="312.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
