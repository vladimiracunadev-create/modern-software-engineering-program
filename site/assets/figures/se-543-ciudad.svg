<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ventas por ciudad con la ciudad actual del cliente y con la ciudad que tenía el día del pedido</title><desc id="d">Barras agrupadas con las ventas por ciudad en millones: con la ciudad actual Santiago 141,4, Valparaíso 163,9, Concepción 145,8 y Temuco 144,8; con la ciudad de la fecha del pedido Santiago 138,4, Valparaíso 162,6, Concepción 147,3 y Temuco 147,5; ambas suman 595,8 millones porque 132 de 1000 clientes se mudaron.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="540" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ventas por ciudad con la ciudad actual del cliente y con la ciudad que tenía el día del pedido</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ciudad actual (dimensión sobrescrita)</tspan></text><rect x="342.98" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="362.98" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="362.98" dy="0">Ciudad de la fecha (dimensión con historia)</tspan></text><line x1="78.62" y1="365" x2="920" y2="365" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="365" x2="78.62" y2="365" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="369.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="297.5" x2="920" y2="297.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="297.5" x2="78.62" y2="297.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="302" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="230" x2="920" y2="230" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="230" x2="78.62" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="234.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="162.5" x2="920" y2="162.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="162.5" x2="78.62" y2="162.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">150</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="365" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="230" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 230)">Ventas (millones)</text><rect x="99.6545" y="174.11" width="82.138" height="190.89" rx="3" fill="#946512"/><text x="140.724" y="168.11" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="140.724" dy="0">141,4</tspan></text><rect x="185.793" y="178.16" width="82.138" height="186.84" rx="3" fill="#087f8c"/><text x="226.862" y="172.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="226.862" dy="0">138,4</tspan></text><text x="183.793" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.793" dy="0">Santiago</tspan></text><rect x="310" y="143.735" width="82.138" height="221.265" rx="3" fill="#946512"/><text x="351.069" y="137.735" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="351.069" dy="0">163,9</tspan></text><rect x="396.138" y="145.49" width="82.138" height="219.51" rx="3" fill="#087f8c"/><text x="437.207" y="139.49" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.207" dy="0">162,6</tspan></text><text x="394.138" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.138" dy="0">Valparaíso</tspan></text><rect x="520.345" y="168.17" width="82.138" height="196.83" rx="3" fill="#946512"/><text x="561.413" y="162.17" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.413" dy="0">145,8</tspan></text><rect x="606.483" y="166.145" width="82.138" height="198.855" rx="3" fill="#087f8c"/><text x="647.552" y="160.145" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="647.552" dy="0">147,3</tspan></text><text x="604.482" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="604.482" dy="0">Concepción</tspan></text><rect x="730.689" y="169.52" width="82.138" height="195.48" rx="3" fill="#946512"/><text x="771.758" y="163.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="771.758" dy="0">144,8</tspan></text><rect x="816.827" y="165.875" width="82.138" height="199.125" rx="3" fill="#087f8c"/><text x="857.896" y="159.875" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.896" dy="0">147,5</tspan></text><text x="814.827" y="386" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="814.827" dy="0">Temuco</tspan></text><rect x="10" y="417" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="441.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El total no cambia (595,8 millones en las dos); cambia el reparto, hasta 2,9 millones por ciudad, porque 132 de 1 000</tspan></text><text x="470" y="458.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">clientes se mudaron. Sobrescribir la dimensión responde «¿cuánto vende hoy cada ciudad con los clientes que tiene hoy?», no</tspan></text><text x="470" y="475.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«¿cuánto vendió cada ciudad?».</tspan></text><text x="470" y="522.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
