<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Filas de más respecto de la verdad según la estrategia de carga y el escenario, sobre 30 días y 1790 filas</title><desc id="d">Barras horizontales con las filas de más: append con ejecución limpia 0, append con fallo y reintento dentro de una transacción 0, append con fallo y reintento sin transacción 37, borrar e insertar sin transacción 0, fusionar por clave sin transacción 0 y append ejecutado dos veces 1790.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Filas de más respecto de la verdad según la estrategia de carga y el escenario, sobre 30 días y 1790 filas</tspan></text><line x1="374" y1="49" x2="374" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="374" y1="313" x2="374" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="374" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="374" dy="0">0</tspan></text><line x1="499.425" y1="49" x2="499.425" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="499.425" y1="313" x2="499.425" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="499.425" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.425" dy="0">500</tspan></text><line x1="624.85" y1="49" x2="624.85" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="624.85" y1="313" x2="624.85" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="624.85" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.85" dy="0">1 000</tspan></text><line x1="750.275" y1="49" x2="750.275" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="750.275" y1="313" x2="750.275" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="750.275" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="750.275" dy="0">1 500</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="313" x2="875.7" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">2 000</tspan></text><line x1="374" y1="313" x2="875.7" y2="313" stroke="#5b7280" stroke-width="1.6"/><text x="364" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Append, ejecución limpia</tspan></text><text x="364" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Append, fallo y reintento con transacción</tspan></text><text x="364" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Append, fallo y reintento sin transacción</tspan></text><text x="364" y="199" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Borrar e insertar, fallo y reintento sin</tspan></text><text x="364" y="216" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">transacción</tspan></text><text x="364" y="243" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Fusionar por clave, fallo y reintento sin</tspan></text><text x="364" y="260" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">transacción</tspan></text><text x="364" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="364" dy="0">Append, los 30 días ejecutados dos veces</tspan></text><rect x="374" y="55" width="2" height="32" rx="3" fill="#102a43"/><text x="383" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383" dy="0">0</tspan></text><rect x="374" y="99" width="2" height="32" rx="3" fill="#102a43"/><text x="383" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383" dy="0">0</tspan></text><rect x="374" y="143" width="9.28145" height="32" rx="3" fill="#102a43"/><text x="390.281" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="390.281" dy="0">37</tspan></text><rect x="374" y="187" width="2" height="32" rx="3" fill="#102a43"/><text x="383" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383" dy="0">0</tspan></text><rect x="374" y="231" width="2" height="32" rx="3" fill="#102a43"/><text x="383" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="383" dy="0">0</tspan></text><rect x="374" y="275" width="449.022" height="32" rx="3" fill="#102a43"/><text x="830.022" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="830.022" dy="0">1 790</tspan></text><text x="624.85" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="624.85" dy="0">Filas de más sobre las 1 790 correctas</tspan></text><rect x="10" y="371" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El append es correcto mientras nada se repite y falla en cuanto un reintento cae sobre una carga a medias o se ejecuta dos</tspan></text><text x="470" y="412.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">veces. Borrar e insertar la partición y fusionar por clave dan el mismo resultado con cualquier número de ejecuciones; la</tspan></text><text x="470" y="429.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">transacción evita además las cargas a medias.</tspan></text><text x="470" y="476.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9 y SQLite 3.45.3; los recuentos se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
