<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro conjuntos de ejemplos de aceptación y los mutantes que matan de 18</title><desc id="d">Barras horizontales con los mutantes que mata cada conjunto de ejemplos de 18 no equivalentes: cinco típicos matan 10, doce de frontera del tiempo matan 11, veinte al azar matan 8, 144 combinatorios matan 17 y dejan vivo solo M08, y frontera con típicos juntos, 17 ejemplos, matan 14.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro conjuntos de ejemplos de aceptación y los mutantes que matan de 18</tspan></text><line x1="334" y1="49" x2="334" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="334" y1="239" x2="334" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="334" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="334" dy="0">0</tspan></text><line x1="475.47" y1="49" x2="475.47" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="475.47" y1="239" x2="475.47" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="475.47" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="475.47" dy="0">5</tspan></text><line x1="616.94" y1="49" x2="616.94" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="616.94" y1="239" x2="616.94" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="616.94" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="616.94" dy="0">10</tspan></text><line x1="758.41" y1="49" x2="758.41" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="758.41" y1="239" x2="758.41" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="758.41" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="758.41" dy="0">15</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="239" x2="899.88" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">20</tspan></text><line x1="334" y1="239" x2="899.88" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="324" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">5 ejemplos típicos</tspan></text><text x="324" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">12 ejemplos de frontera del tiempo</tspan></text><text x="324" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">20 ejemplos al azar</tspan></text><text x="324" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">144 ejemplos combinatorios</tspan></text><text x="324" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="324" dy="0">Frontera y típicos juntos (17 ejemplos)</tspan></text><rect x="334" y="55" width="282.94" height="26" rx="3" fill="#087f8c"/><text x="623.94" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="623.94" dy="0">10</tspan></text><rect x="334" y="93" width="311.234" height="26" rx="3" fill="#087f8c"/><text x="652.234" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="652.234" dy="0">11</tspan></text><rect x="334" y="131" width="226.352" height="26" rx="3" fill="#087f8c"/><text x="567.352" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="567.352" dy="0">8</tspan></text><rect x="334" y="169" width="480.998" height="26" rx="3" fill="#087f8c"/><text x="821.998" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="821.998" dy="0">17</tspan></text><rect x="334" y="207" width="396.116" height="26" rx="3" fill="#087f8c"/><text x="737.116" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="737.116" dy="0">14</tspan></text><line x1="843.292" y1="49" x2="843.292" y2="239" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="848.292" y="62" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="848.292" dy="0">18</tspan></text><text x="616.94" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="616.94" dy="0">Mutantes que mata (de 18)</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Más ejemplos no es mejor: 20 al azar matan menos que 12 bien elegidos. El conjunto combinatorio llega a 17 pero no mata M08</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">porque solo combina un estudiante y un curso; las dimensiones que el conjunto no varía quedan sin comprobar. Los resultados</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">esperados salen de un modelo escrito aparte.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2); los recuentos son idénticos en ambos y los tiempos varían de equipo en equipo.</tspan></text></svg>
