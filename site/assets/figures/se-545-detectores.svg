<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 576" width="940" height="576" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres detectores de volumen sobre 120 días con 4 incidentes: incidentes vistos, falsas alarmas e incidentes perdidos</title><desc id="d">Barras agrupadas: el umbral fijo ve 4 incidentes, da 32 falsas alarmas y pierde 0; el z-score sobre 14 días ve 2, da 0 falsas alarmas y pierde 2; la mediana del mismo día de la semana con MAD ve 4, da 0 falsas alarmas y pierde 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="576" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres detectores de volumen sobre 120 días con 4 incidentes: incidentes vistos, falsas alarmas e incidentes</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">perdidos</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Incidentes vistos (de 4)</tspan></text><rect x="244.96" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="264.96" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Falsas alarmas</tspan></text><rect x="398.52" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="418.52" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="418.52" dy="0">Incidentes perdidos</tspan></text><line x1="71.08" y1="384" x2="920" y2="384" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="384" x2="71.08" y2="384" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="388.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="316.5" x2="920" y2="316.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="316.5" x2="71.08" y2="316.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="321" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="249" x2="920" y2="249" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="249" x2="71.08" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="253.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="181.5" x2="920" y2="181.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="181.5" x2="71.08" y2="181.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="114" x2="71.08" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="114" x2="71.08" y2="384" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="249" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 249)">Cantidad en 120 días</text><rect x="99.3773" y="357" width="72.7929" height="27" rx="3" fill="#087f8c"/><text x="135.774" y="351" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="135.774" dy="0">4</tspan></text><rect x="176.17" y="168" width="72.7929" height="216" rx="3" fill="#c0432f"/><text x="212.567" y="162" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="212.567" dy="0">32</tspan></text><rect x="252.963" y="382" width="72.7929" height="2" rx="3" fill="#946512"/><text x="289.36" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="289.36" dy="0">0</tspan></text><text x="212.567" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Umbral fijo</tspan></text><rect x="382.351" y="370.5" width="72.7929" height="13.5" rx="3" fill="#087f8c"/><text x="418.747" y="364.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="418.747" dy="0">2</tspan></text><rect x="459.144" y="382" width="72.7929" height="2" rx="3" fill="#c0432f"/><text x="495.54" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="495.54" dy="0">0</tspan></text><rect x="535.936" y="370.5" width="72.7929" height="13.5" rx="3" fill="#946512"/><text x="572.333" y="364.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.333" dy="0">2</tspan></text><text x="495.54" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">z-score sobre 14 días</tspan></text><rect x="665.324" y="357" width="72.7929" height="27" rx="3" fill="#087f8c"/><text x="701.72" y="351" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="701.72" dy="0">4</tspan></text><rect x="742.117" y="382" width="72.7929" height="2" rx="3" fill="#c0432f"/><text x="778.513" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="778.513" dy="0">0</tspan></text><rect x="818.91" y="382" width="72.7929" height="2" rx="3" fill="#946512"/><text x="855.306" y="376" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="855.306" dy="0">0</tspan></text><text x="778.513" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Mediana del mismo día y MAD</tspan></text><rect x="10" y="436" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="460.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El umbral fijo grita cada fin de semana (el volumen cae a 60 %): 32 falsas alarmas. El z-score calma ese ruido pero la</tspan></text><text x="470" y="477.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">caída del fin de semana ya le enseña una varianza grande y no ve la carga parcial de un día hábil ni la de un sábado.</tspan></text><text x="470" y="494.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Comparar con el mismo día de semanas anteriores recoge los cuatro incidentes sin ruido, con datos sintéticos de patrón</tspan></text><text x="470" y="510.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">semanal único.</tspan></text><text x="470" y="558.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 45; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
