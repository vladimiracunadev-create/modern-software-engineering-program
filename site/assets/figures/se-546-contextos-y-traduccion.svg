<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos contextos acotados con una capa de traducción entre ellos</title><desc id="d">Diagrama con dos contextos delimitados: en el contexto académico una entrega es un trabajo con estado pendiente o recibida, en el contexto de avisos una entrega es un elemento con vencimiento y un indicador de entregada; una capa de traducción en medio convierte el estado textual en un indicador booleano y es el único lugar donde se conocen ambos vocabularios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="330" fill="#ffffff"/><rect x="10" y="14" width="400" height="220" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="36" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="24" dy="0">Contexto académico</tspan></text><rect x="30" y="60" width="360" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="210" y="90.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">Entrega = trabajo de una persona estudiante</tspan></text><text x="210" y="106.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">estado: pendiente o recibida</tspan></text><rect x="30" y="150" width="360" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="210" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="210" dy="0">Lenguaje: entrega, estudiante, curso, vence_en</tspan></text><rect x="550" y="14" width="400" height="220" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="564" y="36" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="564" dy="0">Contexto de avisos</tspan></text><rect x="570" y="60" width="360" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="750" y="90.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="750" dy="0">Entrega = elemento con vencimiento</tspan></text><text x="750" y="106.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="750" dy="0">submitted: verdadero o falso</tspan></text><rect x="570" y="150" width="360" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="750" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="750" dy="0">Lenguaje: delivery, student, due, submitted</tspan></text><rect x="425" y="80" width="110" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="480" y="115.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">Capa de</tspan></text><text x="480" y="131.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="480" dy="0">traducción</tspan></text><polyline points="410,120 425,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="535,120 550,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="250" width="940" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="278.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">La traducción es el único lugar que conoce los dos vocabularios: «recibida» pasa a verdadero y «pendiente» a falso. Sin ella,</tspan></text><text x="480" y="294.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">el texto «pendiente» cuenta como verdadero.</tspan></text></svg>
