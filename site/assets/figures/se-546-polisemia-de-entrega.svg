<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 453" width="940" height="453" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro mil doscientas cuarenta y nueve frases con «entrega» en las Partes 00–22, 24–25, 27, 29, 31–33, 35–36, 38–41, 43–44 y 46–47 clasificadas por sentido</title><desc id="d">Barras horizontales en escala logarítmica con las frases que contienen entrega clasificadas por reglas léxicas: 487 hablan del trabajo de una persona estudiante en 29 partes, 89 de liberar o desplegar software en 16 partes, 122 de hacer llegar un mensaje o resultado en 19 partes, 15 mezclan más de un sentido y 3 536 no tienen un sentido que las reglas reconozcan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="453" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro mil doscientas cuarenta y nueve frases con «entrega» en las Partes 00–22, 24–25, 27, 29, 31–33,</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">35–36, 38–41, 43–44 y 46–47 clasificadas por sentido</tspan></text><line x1="354" y1="68" x2="354" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="288" x2="354" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">10</tspan></text><line x1="527.9" y1="68" x2="527.9" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="527.9" y1="288" x2="527.9" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="527.9" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="527.9" dy="0">100</tspan></text><line x1="701.8" y1="68" x2="701.8" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="701.8" y1="288" x2="701.8" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="701.8" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701.8" dy="0">1 000</tspan></text><line x1="875.7" y1="68" x2="875.7" y2="288" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="288" x2="875.7" y2="293" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="309" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">10 000</tspan></text><line x1="354" y1="288" x2="875.7" y2="288" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="94.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Trabajo de una persona estudiante (29 partes)</tspan></text><text x="344" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Liberar o desplegar software (16 partes)</tspan></text><text x="344" y="174" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Hacer llegar un mensaje o resultado (19</tspan></text><text x="344" y="191" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">partes)</tspan></text><text x="344" y="226.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Frases con más de un sentido a la vez</tspan></text><text x="344" y="270.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Frases sin sentido reconocible por las reglas</tspan></text><rect x="354" y="74" width="293.461" height="32" rx="3" fill="#946512"/><text x="654.461" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="654.461" dy="0">487</tspan></text><rect x="354" y="118" width="165.099" height="32" rx="3" fill="#946512"/><text x="526.099" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="526.099" dy="0">89</tspan></text><rect x="354" y="162" width="188.918" height="32" rx="3" fill="#946512"/><text x="549.918" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="549.918" dy="0">122</tspan></text><rect x="354" y="206" width="30.6223" height="32" rx="3" fill="#946512"/><text x="391.622" y="226.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="391.622" dy="0">15</tspan></text><rect x="354" y="250" width="443.186" height="32" rx="3" fill="#946512"/><text x="804.186" y="270.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="804.186" dy="0">3 536</tspan></text><text x="614.85" y="332" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Frases (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="346" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="370.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La palabra que da nombre al dominio de Avisos tiene al menos tres sentidos en el propio programa. Las reglas léxicas son</tspan></text><text x="470" y="387.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">burdas: las 3 536 frases sin clasificar no significan que carezcan de sentido, sino que las reglas no lo ven.</tspan></text><text x="470" y="435.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Recuento léxico sobre content/part-00..39 con expresiones regulares; idéntico en Windows 11 y Ubuntu (WSL2).</tspan></text></svg>
