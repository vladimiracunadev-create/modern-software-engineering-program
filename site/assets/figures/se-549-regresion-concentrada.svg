<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Regresión concentrada en los casos difíciles: qué conjunto de 100 casos la ve</title><desc id="d">Barras agrupadas con el porcentaje de veces que una puerta deja pasar la regresión y rechaza la versión sana: una muestra al azar de 100 casos, con 10 por ciento difíciles, deja pasar la regresión 72,8 por ciento de las veces y rechaza la sana 4,4; un conjunto de 100 casos solo difíciles no deja pasar ninguna regresión; la misma versión sobre los mismos 100 casos varía con desviación 0,037 y rango de 0,72 a 0,95.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Regresión concentrada en los casos difíciles: qué conjunto de 100 casos la ve</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pasa la regresión</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Rechaza la sana</tspan></text><line x1="71.08" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="375" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="305" x2="71.08" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="235" x2="71.08" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="165" x2="71.08" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Veces que ocurre (%)</text><rect x="113.526" y="120.2" width="167.784" height="254.8" rx="3" fill="#c0432f"/><text x="197.418" y="114.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.418" dy="0">72,8</tspan></text><rect x="285.31" y="359.6" width="167.784" height="15.4" rx="3" fill="#946512"/><text x="369.202" y="353.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="369.202" dy="0">4,4</tspan></text><text x="283.31" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">Muestra al azar, 100 casos (10 % difíciles)</tspan></text><rect x="537.986" y="373" width="167.784" height="2" rx="3" fill="#c0432f"/><text x="621.878" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="621.878" dy="0">0,0</tspan></text><rect x="709.77" y="373" width="167.784" height="2" rx="3" fill="#946512"/><text x="793.662" y="367" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="793.662" dy="0">0,0</tspan></text><text x="707.77" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Solo casos difíciles, 100 casos</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un conjunto pequeño y curado en lo difícil detecta una regresión que una muestra grande al azar no ve. Al revés, la misma</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">versión puede variar 23 puntos entre corridas con 100 casos: una sola corrida no mide.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
