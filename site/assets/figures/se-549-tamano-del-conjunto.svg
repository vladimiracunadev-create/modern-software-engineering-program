<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 594" width="940" height="594" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una versión con 5 puntos menos de precisión pasa la puerta: según casos y repeticiones por evaluación</title><desc id="d">Líneas en escala logarítmica con el porcentaje de 4 000 simulaciones en que la puerta de release deja pasar la regresión de 5 puntos y en que rechaza la versión sana, según los casos: con una corrida pasa la regresión 41,9, 31,1, 28,0, 12,0 y 0,6 por ciento con 20, 50, 100, 400 y 1 600 casos y rechaza la sana 36,0, 33,7, 22,4, 7,3 y 0,3; con tres corridas por caso las cifras bajan, con 400 casos a 1,5 y 0,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="594" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una versión con 5 puntos menos de precisión pasa la puerta: según casos y repeticiones por evaluación</tspan></text><circle cx="22" cy="51" r="6" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pasa la regresión (1 corrida)</tspan></text><rect x="282.66" y="45" width="12" height="12" fill="#946512" stroke="#946512" stroke-width="2"/><text x="302.66" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="302.66" dy="0">Rechaza la sana (1 corrida)</tspan></text><polygon points="540.24,44.1 546.84,56.4 533.64,56.4" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="554.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="554.24" dy="0">Pasa la regresión (3 corridas)</tspan></text><polygon points="22,67.5 29.5,75 22,82.5 14.5,75" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Rechaza la sana (3 corridas)</tspan></text><line x1="71.08" y1="411" x2="910" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="411" x2="71.08" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="415.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="351" x2="910" y2="351" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="351" x2="71.08" y2="351" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="355.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="291" x2="910" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="291" x2="71.08" y2="291" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="295.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="231" x2="910" y2="231" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="231" x2="71.08" y2="231" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="235.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="171" x2="910" y2="171" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="171" x2="71.08" y2="171" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="175.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="111" x2="910" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="111" x2="71.08" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">50</tspan></text><line x1="71.08" y1="111" x2="71.08" y2="411" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="111" x2="89.08" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="411" x2="89.08" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">20</tspan></text><line x1="256.972" y1="111" x2="256.972" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="256.972" y1="411" x2="256.972" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="256.972" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="256.972" dy="0">50</tspan></text><line x1="383.978" y1="111" x2="383.978" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="383.978" y1="411" x2="383.978" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="383.978" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="383.978" dy="0">100</tspan></text><line x1="637.989" y1="111" x2="637.989" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="637.989" y1="411" x2="637.989" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="637.989" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637.989" dy="0">400</tspan></text><line x1="892" y1="111" x2="892" y2="411" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="411" x2="892" y2="416" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="432" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1 600</tspan></text><line x1="71.08" y1="411" x2="910" y2="411" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="261" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 261)">Simulaciones (%)</text><text x="490.54" y="457" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Casos del conjunto de evaluación (escala logarítmica)</tspan></text><polyline points="89.08,159.6 256.972,224.4 383.978,243 637.989,339 892,407.4" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="89.08" cy="159.6" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="256.972" cy="224.4" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="383.978" cy="243" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="637.989" cy="339" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><circle cx="892" cy="407.4" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="396.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,6</tspan></text><polyline points="89.08,195 256.972,208.8 383.978,276.6 637.989,367.2 892,409.2" fill="none" stroke="#946512" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="83.58" y="189.5" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="251.472" y="203.3" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="378.478" y="271.1" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="632.489" y="361.7" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><rect x="886.5" y="403.7" width="11" height="11" fill="#946512" stroke="#946512" stroke-width="2"/><text x="892" y="398.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,3</tspan></text><polyline points="89.08,221.4 256.972,268.8 383.978,330 637.989,402 892,411" fill="none" stroke="#102a43" stroke-width="2.4"/><polygon points="89.08,215.075 95.13,226.35 83.03,226.35" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="256.972,262.475 263.022,273.75 250.922,273.75" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="383.978,323.675 390.028,334.95 377.928,334.95" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="637.989,395.675 644.039,406.95 631.939,406.95" fill="#102a43" stroke="#102a43" stroke-width="2"/><polygon points="892,404.675 898.05,415.95 885.95,415.95" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="400" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,0</tspan></text><polyline points="89.08,233.4 256.972,310.2 383.978,343.2 637.989,406.8 892,411" fill="none" stroke="#087f8c" stroke-width="2.4" stroke-dasharray="7 4"/><polygon points="89.08,226.525 95.955,233.4 89.08,240.275 82.205,233.4" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="256.972,303.325 263.847,310.2 256.972,317.075 250.097,310.2" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="383.978,336.325 390.853,343.2 383.978,350.075 377.103,343.2" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="637.989,399.925 644.864,406.8 637.989,413.675 631.114,406.8" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><polygon points="892,404.125 898.875,411 892,417.875 885.125,411" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="400" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,0</tspan></text><rect x="10" y="471" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="495.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con 100 casos y una corrida, más de una de cada cuatro regresiones de 5 puntos se cuela y más de una de cada cinco</tspan></text><text x="470" y="512.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">versiones sanas se rechaza. Repetir tres veces cada caso ayuda, pero la reducción grande viene de más casos. Precisiones,</tspan></text><text x="470" y="529.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">umbral y modelo de azar son supuestos del autor.</tspan></text><text x="470" y="576.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
