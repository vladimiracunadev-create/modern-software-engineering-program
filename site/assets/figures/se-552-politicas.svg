<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco políticas aplicadas a 300 cambios sintéticos: costo frente a impacto escapado</title><desc id="d">Puntos con el costo en horas y el impacto escapado de cinco políticas sobre 300 cambios sintéticos: no hacer nada cuesta 0 y deja escapar 1 157; TDD en todo cuesta 232 y deja 745; todo en todo cuesta 1 240 y deja 489; por riesgo cuesta 482 y deja 532; por riesgo y ambigüedad cuesta 485 y deja 499.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco políticas aplicadas a 300 cambios sintéticos: costo frente a impacto escapado</tspan></text><line x1="93.7" y1="379" x2="910" y2="379" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="379" x2="93.7" y2="379" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="383.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="315" x2="910" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="315" x2="93.7" y2="315" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="319.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">250</tspan></text><line x1="93.7" y1="251" x2="910" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="251" x2="93.7" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="255.5" font-s