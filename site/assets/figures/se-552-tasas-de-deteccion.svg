<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 351" width="960" height="351" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tasa de detección de cada práctica medida en el laboratorio, sobre 18 mutantes</title><desc id="d">Gráfico de barras con la fracción de mutantes no equivalentes que mata cada oráculo del laboratorio y que se usa como tasa de detección en la política: caso feliz 0,39, ocho pruebas de TDD 0,83, escenarios de aceptación 0,94, contrato con 400 estados 0,72 y modelo de referencia 1,00.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="351" fill="#ffffff"/><text x="304" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Caso feliz único</tspan></text><rect x="314" y="16" width="195" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="517" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="517" dy="0">0,39</tspan></text><text x="304" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Ocho pruebas (TDD)</tspan></text><rect x="314" y="62" width="415" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="737" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="737" dy="0">0,83</tspan></text><text x="304" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Escenarios de aceptación</tspan></text><rect x="314" y="108" width="470" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="792" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="792" dy="0">0,94</tspan></text><text x="304" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Contrato (400 estados)</tspan></text><rect x="314" y="154" width="360" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="682" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="682" dy="0">0,72</tspan></text><text x="304" y="221" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Modelo de referencia</tspan></text><rect x="314" y="200" width="500" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822" y="221" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="822" dy="0">1,00</tspan></text><rect x="10" y="248" width="940" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="272.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Son tasas sobre 18 mutantes de una función de 20 líneas: sirven para anclar la simulación, no para predecir la detección en un</tspan></text><text x="480" y="289.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">sistema real. La política cambia mucho si se supone otra.</tspan></text><text x="480" y="337.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Núcleo de Avisos con 20 mutantes escritos a mano (18 no equivalentes y 2 equivalentes); ejecutado en Windows 11 y Ubuntu (WSL2) con los mismos recuentos.</tspan></text></svg>
