<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 365" width="940" height="365" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Con 500 filas de entrenamiento, cuánto varía el AUC por azar frente a la diferencia entre dos configuraciones</title><desc id="d">Barras con la desviación del AUC con 500 filas de entrenamiento: 0,0056 por la semilla del modelo con los mismos datos, 0,0072 por la muestra de entrenamiento con la misma semilla y 0,0074 en la diferencia entre profundidad 5 y profundidad 4, cuya media es de apenas 0,0026 a favor de la profundidad 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="365" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Con 500 filas de entrenamiento, cuánto varía el AUC por azar frente a la diferencia entre dos</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">configuraciones</tspan></text><line x1="354" y1="68" x2="354" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="200" x2="354" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="482.41" y1="68" x2="482.41" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="482.41" y1="200" x2="482.41" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="482.41" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482.41" dy="0">0,002</tspan></text><line x1="610.82" y1="68" x2="610.82" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="610.82" y1="200" x2="610.82" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="610.82" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610.82" dy="0">0,004</tspan></text><line x1="739.23" y1="68" x2="739.23" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="739.23" y1="200" x2="739.23" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="739.23" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="739.23" dy="0">0,006</tspan></text><line x1="867.64" y1="68" x2="867.64" y2="200" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="200" x2="867.64" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">0,008</tspan></text><line x1="354" y1="200" x2="867.64" y2="200" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="86" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Semilla del modelo, mismos datos (40</tspan></text><text x="344" y="103" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">corridas)</tspan></text><text x="344" y="130" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Muestra de entrenamiento, misma semilla (40</tspan></text><text x="344" y="147" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">corridas)</tspan></text><text x="344" y="182.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Diferencia entre profundidad 5 y 4 (60 pares)</tspan></text><rect x="354" y="74" width="359.548" height="32" rx="3" fill="#102a43"/><text x="720.548" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="720.548" dy="0">0,0056</tspan></text><rect x="354" y="118" width="462.276" height="32" rx="3" fill="#102a43"/><text x="823.276" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="823.276" dy="0">0,0072</tspan></text><rect x="354" y="162" width="475.117" height="32" rx="3" fill="#102a43"/><text x="836.117" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="836.117" dy="0">0,0074</tspan></text><line x1="520.933" y1="68" x2="520.933" y2="200" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="525.933" y="81" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="525.933" dy="0">Diferencia media entre configuraciones</tspan></text><text x="610.82" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="610.82" dy="0">Desviación estándar del AUC</tspan></text><rect x="10" y="258" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La desviación de la diferencia es casi tres veces su media: con esta cantidad de datos una sola corrida no puede ver la</tspan></text><text x="470" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">diferencia, y la profundidad 5 ganó 21 de 60 comparaciones aunque en promedio fue algo peor.</tspan></text><text x="470" y="347.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
