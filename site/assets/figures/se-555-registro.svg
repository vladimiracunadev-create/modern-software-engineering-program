<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 369" width="960" height="369" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué determina una corrida de entrenamiento y qué decide si un modelo se promueve</title><desc id="d">Diagrama del registro de una corrida: datos, etiquetas, configuración, semilla y versiones producen una corrida; de ella salen el modelo con su huella y el registro con las huellas y la métrica; una comparación con la dispersión decide si se promueve o no.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="369" fill="#ffffff"/><rect x="10" y="14" width="208" height="104" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="114" y="61.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114" dy="0">Datos y etiquetas</tspan></text><text x="114" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114" dy="0">Huella</tspan></text><rect x="254" y="14" width="208" height="104" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="358" y="61.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="358" dy="0">Configuración</tspan></text><text x="358" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="358" dy="0">Hiperparámetros, huella</tspan></text><polyline points="218,66 254,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="498" y="14" width="208" height="104" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="53" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="602" dy="0">Semilla y versiones</tspan></text><text x="602" y="69.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="602" dy="0">numpy 2.4.4, scikit-learn</tspan></text><text x="602" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="602" dy="0">1.8.0</tspan></text><polyline points="462,66 498,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="742" y="14" width="208" height="104" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="846" y="61.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="846" dy="0">Código</tspan></text><text x="846" y="77.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="846" dy="0">Commit</tspan></text><polyline points="706,66 742,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="158" width="208" height="104" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114" dy="0">Corrida de entrenamiento</tspan></text><rect x="254" y="158" width="208" height="104" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358" dy="0">Modelo con huella</tspan></text><polyline points="218,210 254,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="498" y="158" width="208" height="104" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="602" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="602" dy="0">run.json</tspan></text><text x="602" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="602" dy="0">Huellas, semilla, métrica</tspan></text><polyline points="462,210 498,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="742" y="158" width="208" height="104" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="846" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="846" dy="0">¿Diferencia mayor que el</tspan></text><text x="846" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="846" dy="0">ruido?</tspan></text><text x="846" y="230.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="846" dy="0">Sí: se promueve</tspan></text><polyline points="706,210 742,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="846,118 846,138 114,138 114,158" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="276" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">La decisión de promover no depende de la métrica sola sino de la métrica y de la dispersión medida con varias semillas y</tspan></text><text x="480" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">muestras. Sin las huellas de los cuatro insumos, la corrida no se puede repetir ni comparar.</tspan></text><text x="480" y="359.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
