<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Corregir una condición en un archivo de 182 líneas: líneas de diferencia que debe revisar la persona</title><desc id="d">Barras horizontales con la probabilidad de encontrar el cambio real al revisar dos formas de aplicar el mismo arreglo en un archivo de 182 líneas: la edición dirigida cambia 2 líneas y se detecta con probabilidad 86,4 %; el archivo regenerado con deriva cosmética cambia 124 y se detecta con 13,2 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Corregir una condición en un archivo de 182 líneas: líneas de diferencia que debe revisar la persona</tspan></text><line x1="294" y1="49" x2="294" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="137" x2="294" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="411.952" y1="49" x2="411.952" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="411.952" y1="137" x2="411.952" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="411.952" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="411.952" dy="0">20</tspan></text><line x1="529.904" y1="49" x2="529.904" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="529.904" y1="137" x2="529.904" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="529.904" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="529.904" dy="0">40</tspan></text><line x1="647.856" y1="49" x2="647.856" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="647.856" y1="137" x2="647.856" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="647.856" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="647.856" dy="0">60</tspan></text><line x1="765.808" y1="49" x2="765.808" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="765.808" y1="137" x2="765.808" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="765.808" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765.808" dy="0">80</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="137" x2="883.76" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">100</tspan></text><line x1="294" y1="137" x2="883.76" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Edición dirigida: 2 líneas distintas</tspan></text><text x="284" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Archivo regenerado con deriva: 124</tspan></text><text x="284" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">líneas distintas</tspan></text><rect x="294" y="55" width="509.553" height="32" rx="3" fill="#087f8c"/><text x="810.553" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="810.553" dy="0">86,4</tspan></text><rect x="294" y="99" width="77.8483" height="32" rx="3" fill="#087f8c"/><text x="378.848" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="378.848" dy="0">13,2</tspan></text><text x="588.88" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="588.88" dy="0">Probabilidad de encontrar el cambio real (%)</tspan></text><rect x="10" y="195" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las líneas se miden con difflib sobre un archivo real generado; la probabilidad de detección usa una curva del autor que</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">decae con el tamaño del diff, así que esa probabilidad es un modelo y no una medición de personas.</tspan></text><text x="470" y="284.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
