<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1 000 sugerencias sintéticas (78 % correctas): defectos que entran según cómo se acepta</title><desc id="d">Barras agrupadas con las sugerencias aceptadas y los defectos que entran según la política: aceptar sin leer acepta 1000 y deja entrar 229 defectos, leer solo las largas acepta 950 y deja entrar 181, y leer siempre y ejecutar acepta 805 y deja entrar 44.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">1 000 sugerencias sintéticas (78 % correctas): defectos que entran según cómo se acepta</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Sugerencias aceptadas</tspan></text><rect x="222.34" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Defectos aceptados</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="305" x2="93.7" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">250</tspan></text><line x1="93.7" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="235" x2="93.7" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="165" x2="93.7" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">750</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Sugerencias, de 1 000</text><rect x="121.243" y="95" width="108.173" height="280" rx="3" fill="#6b7c86"/><text x="175.33" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">1 000</tspan></text><rect x="233.417" y="310.88" width="108.173" height="64.12" rx="3" fill="#c0432f"/><text x="287.503" y="304.88" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">229</tspan></text><text x="231.417" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Aceptar con Tab sin leer</tspan></text><rect x="396.677" y="109" width="108.173" height="266" rx="3" fill="#6b7c86"/><text x="450.763" y="103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">950</tspan></text><rect x="508.85" y="324.32" width="108.173" height="50.68" rx="3" fill="#c0432f"/><text x="562.937" y="318.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">181</tspan></text><text x="506.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Leer solo si es larga</tspan></text><rect x="672.11" y="149.6" width="108.173" height="225.4" rx="3" fill="#6b7c86"/><text x="726.197" y="143.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">805</tspan></text><rect x="784.283" y="362.68" width="108.173" height="12.32" rx="3" fill="#c0432f"/><text x="838.37" y="356.68" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">44</tspan></text><text x="782.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Leer siempre y ejecutar</tspan></text><rect x="10" y="427" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Leer y ejecutar cuesta tiempo y reduce lo aceptado, pero deja entrar una quinta parte de los defectos. La tasa de acierto</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">del 78 % y las tasas de detección del revisor son supuestos del autor; no miden ninguna herramienta ni persona.</tspan></text><text x="470" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
