<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 404" width="940" height="404" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Parámetros que entrena una adaptación de rango bajo en una capa de 4 096 por 4 096</title><desc id="d">Barras horizontales con el porcentaje de los 16777216 parámetros de una capa de 4096 por 4096 que entrena una adaptación de rango bajo: 0,20 por ciento con rango 4, 0,39 con rango 8, 0,78 con rango 16 y 3,12 con rango 64, frente al 100 por ciento del ajuste completo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="404" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Parámetros que entrena una adaptación de rango bajo en una capa de 4 096 por 4 096</tspan></text><line x1="254" y1="49" x2="254" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="239" x2="254" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0,1</tspan></text><line x1="458.547" y1="49" x2="458.547" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="458.547" y1="239" x2="458.547" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="458.547" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.547" dy="0">1</tspan></text><line x1="663.093" y1="49" x2="663.093" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="663.093" y1="239" x2="663.093" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="663.093" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="663.093" dy="0">10</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="239" x2="867.64" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">100</tspan></text><line x1="254" y1="239" x2="867.64" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Rango 4 (32 768)</tspan></text><text x="244" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Rango 8 (65 536)</tspan></text><text x="244" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Rango 16 (131 072)</tspan></text><text x="244" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Rango 64 (524 288)</tspan></text><text x="244" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Ajuste completo (16 777 216)</tspan></text><rect x="254" y="55" width="61.5747" height="26" rx="3" fill="#102a43"/><text x="322.575" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="322.575" dy="0">0,20</tspan></text><rect x="254" y="93" width="120.9" height="26" rx="3" fill="#102a43"/><text x="381.9" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="381.9" dy="0">0,39</tspan></text><rect x="254" y="131" width="182.475" height="26" rx="3" fill="#102a43"/><text x="443.475" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="443.475" dy="0">0,78</tspan></text><rect x="254" y="169" width="305.624" height="26" rx="3" fill="#102a43"/><text x="566.624" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="566.624" dy="0">3,12</tspan></text><rect x="254" y="207" width="613.64" height="26" rx="3" fill="#102a43"/><text x="874.64" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="874.64" dy="0">100,00</tspan></text><text x="560.82" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="560.82" dy="0">% de los parámetros de la capa (escala logarítmica)</tspan></text><rect x="10" y="297" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Aritmética de una sola capa: r por (d más k) parámetros frente a d por k. Menos parámetros entrenables no implica menos</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cómputo en la pasada hacia adelante ni menos memoria de activaciones, y la calidad depende de la tarea.</tspan></text><text x="470" y="386.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Aritmética exacta del conteo de parámetros; no es una medición de ningún modelo.</tspan></text></svg>
