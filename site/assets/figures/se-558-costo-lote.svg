<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo por petición de una red pequeña según el tamaño del lote</title><desc id="d">Línea con los microsegundos por petición de una red pequeña según el tamaño del lote, en escala logarítmica: 43,5 con 1 petición, 31,5 con 4, 12,2 con 16, 5,2 con 64, 2,9 con 256, 2,5 con 512 y 8,3 con 1024.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo por petición de una red pequeña según el tamaño del lote</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">2</tspan></text><line x1="78.62" y1="288.733" x2="910" y2="288.733" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="288.733" x2="78.62" y2="288.733" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="293.233" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">5</tspan></text><line x1="78.62" y1="235.578" x2="910" y2="235.578" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="235.578" x2="78.62" y2="235.578" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="240.078" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">10</tspan></text><line x1="78.62" y1="182.422" x2="910" y2="182.422" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="182.422" x2="78.62" y2="182.422" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="186.922" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="112.155" x2="910" y2="112.155" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="112.155" x2="78.62" y2="112.155" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="116.655" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="359" x2="96.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">1</tspan></text><line x1="255.696" y1="59" x2="255.696" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="255.696" y1="359" x2="255.696" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="255.696" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255.696" dy="0">4</tspan></text><line x1="414.772" y1="59" x2="414.772" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="414.772" y1="359" x2="414.772" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="414.772" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="414.772" dy="0">16</tspan></text><line x1="573.848" y1="59" x2="573.848" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="573.848" y1="359" x2="573.848" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="573.848" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573.848" dy="0">64</tspan></text><line x1="732.924" y1="59" x2="732.924" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="732.924" y1="359" x2="732.924" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="732.924" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.924" dy="0">256</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">1024</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Microsegundos por petición (escala logarítmica)</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Peticiones por lote (escala logarítmica)</tspan></text><polyline points="96.62,122.835 176.158,88.35 255.696,147.709 335.234,178.135 414.772,220.58 494.31,237.519 573.848,286.169 653.386,309.175 732.924,330.771 812.462,342.814 892,249.682" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="96.62" cy="122.835" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="176.158" cy="88.35" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="255.696" cy="147.709" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="335.234" cy="178.135" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="414.772" cy="220.58" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="494.31" cy="237.519" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="573.848" cy="286.169" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="653.386" cy="309.175" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="732.924" cy="330.771" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="812.462" cy="342.814" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><circle cx="892" cy="249.682" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="772.462" y="308.814" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="772.462" dy="0">Mínimo: 2,5 µs con 512</tspan></text><line x1="809.902" y1="339.694" x2="780.462" y2="303.814" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El costo fijo de cada llamada se reparte: de 1 a 512 peticiones el costo por petición baja unas diecisiete veces, y con 1</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">024 repunta a 8,3 µs. Con dos peticiones fue peor que con una. Mejor tiempo de 40 repeticiones en una CPU de escritorio con</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">varios hilos.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9, numpy 2.4.4 y scikit-learn 1.8.0; los recuentos con semilla se repiten y los tiempos varían de un equipo a otro.</tspan></text></svg>
