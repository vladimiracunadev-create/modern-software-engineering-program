<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Archivos de instrucciones sintéticos con reglas «siempre/nunca» sobre 25 temas: los que se contradicen</title><desc id="d">Línea con el porcentaje de archivos de instrucciones con al menos una contradicción según el número de reglas sobre 25 temas: 16,6 % con 5 reglas, 62,4 % con 10, 97,4 % con 20 y 100,0 % con 40.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Archivos de instrucciones sintéticos con reglas «siempre/nunca» sobre 25 temas: los que se contradicen</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="299" x2="78.62" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="179" x2="910" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="179" x2="78.62" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="119" x2="910" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="119" x2="78.62" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="359" x2="96.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">5</tspan></text><line x1="210.246" y1="59" x2="210.246" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="210.246" y1="359" x2="210.246" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="210.246" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210.246" dy="0">10</tspan></text><line x1="437.497" y1="59" x2="437.497" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="437.497" y1="359" x2="437.497" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="437.497" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437.497" dy="0">20</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">40</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Archivos con alguna contradicción (%)</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Reglas en el archivo</tspan></text><polyline points="96.62,309.2 210.246,171.8 437.497,66.8 892,59" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="309.2" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="298.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">16,6</tspan></text><circle cx="210.246" cy="171.8" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="210.246" y="160.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="210.246" dy="0">62,4</tspan></text><circle cx="437.497" cy="66.8" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="437.497" y="55.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="437.497" dy="0">97,4</tspan></text><circle cx="892" cy="59" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">100,0</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Un detector que compara reglas del mismo tema las encuentra todas, pero solo si las reglas se escriben de forma</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estructurada; en prosa libre la contradicción pasa desapercibida. Las 500 muestras por tamaño y la elección al azar de tema</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y polaridad son del autor.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
