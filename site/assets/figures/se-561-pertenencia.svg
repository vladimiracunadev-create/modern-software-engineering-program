<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que un modelo delata de sus datos: AUC en entrenamiento, en datos nuevos y del ataque de pertenencia</title><desc id="d">Barras agrupadas con el AUC en los datos de entrenamiento, en datos nuevos y del ataque de pertenencia para un bosque sin límites y uno con hojas mínimas de 40 y profundidad 5: sin límites 1,000, 0,823 y 0,690; regularizado 0,882, 0,845 y 0,512.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="900" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lo que un modelo delata de sus datos: AUC en entrenamiento, en datos nuevos y del ataque de pertenencia</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">AUC en entrenamiento</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">AUC en datos nuevos</tspan></text><rect x="406.06" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="426.06" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="426.06" dy="0">AUC del ataque de pertenencia</tspan></text><line x1="78.62" y1="375" x2="880" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="319" x2="880" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="319" x2="78.62" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,2</tspan></text><line x1="78.62" y1="263" x2="880" y2="263" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="263" x2="78.62" y2="263" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="267.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,4</tspan></text><line x1="78.62" y1="207" x2="880" y2="207" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="207" x2="78.62" y2="207" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="211.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,6</tspan></text><line x1="78.62" y1="151" x2="880" y2="151" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="151" x2="78.62" y2="151" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="155.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0,8</tspan></text><line x1="78.62" y1="95" x2="880" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">1</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">AUC</text><rect x="118.689" y="95" width="104.184" height="280" rx="3" fill="#102a43"/><text x="170.781" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="170.781" dy="0">1,000</tspan></text><rect x="226.873" y="144.56" width="104.184" height="230.44" rx="3" fill="#087f8c"/><text x="278.965" y="138.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="278.965" dy="0">0,823</tspan></text><rect x="335.057" y="181.8" width="104.184" height="193.2" rx="3" fill="#c0432f"/><text x="387.149" y="175.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="387.149" dy="0">0,690</tspan></text><text x="278.965" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="278.965" dy="0">Bosque sin límites</tspan></text><rect x="519.379" y="128.04" width="104.184" height="246.96" rx="3" fill="#102a43"/><text x="571.471" y="122.04" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="571.471" dy="0">0,882</tspan></text><rect x="627.563" y="138.4" width="104.184" height="236.6" rx="3" fill="#087f8c"/><text x="679.655" y="132.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="679.655" dy="0">0,845</tspan></text><rect x="735.747" y="231.64" width="104.184" height="143.36" rx="3" fill="#c0432f"/><text x="787.839" y="225.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="787.839" dy="0">0,512</tspan></text><text x="679.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="679.655" dy="0">Bosque regularizado (hojas de 40, profundidad 5)</tspan></text><line x1="78.62" y1="235" x2="880" y2="235" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="876" y="229" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="876" dy="0">Azar</tspan></text><rect x="10" y="427" width="880" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="450" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">El modelo que memoriza gana en entrenamiento, pierde fuera y es el que delata a sus datos; el regularizado deja el</tspan></text><text x="450" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="450" dy="0">ataque casi en el azar. Ataque simple con el error por registro y 1 500 filas de entrenamiento.</tspan></text><text x="450" y="516.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="450" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
