<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 247" width="980" height="247" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un juez automático sintético con sesgos de posición y de longitud (1000 comparaciones)</title><desc id="d">Barras con tres medidas de un juez automático: acuerda con la etiqueta humana 83,5 %, mantiene el veredicto al intercambiar el orden 74,5 % y gana la respuesta más larga en 58,4 % de las comparaciones, cuando por azar serían 50 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="980" height="247" fill="#ffffff"/><text x="300" y="35.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Acuerdo con la etiqueta humana</tspan></text><rect x="310" y="16" width="417.5" height="28" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="735.5" y="35.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="735.5" dy="0">83,5 %</tspan></text><text x="300" y="79.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Mismo veredicto al intercambiar el orden</tspan></text><rect x="310" y="60" width="372.5" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="690.5" y="79.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="690.5" dy="0">74,5 %</tspan></text><text x="300" y="123.6" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="300" dy="0">Gana la respuesta más larga</tspan></text><rect x="310" y="104" width="292" height="28" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="610" y="123.6" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="610" dy="0">58,4 %</tspan></text><rect x="10" y="152" width="960" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="490" y="176.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Un 83 % de acuerdo suena bien y convive con que una cuarta parte de los veredictos cambie solo por el orden de presentación. Los</tspan></text><text x="490" y="193.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">sesgos son parámetros del autor; medir los de un juez real exige comparaciones con orden permutado.</tspan></text><text x="490" y="233.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="490" dy="0">Proceso sintético con semilla fija; no se llamó a ningún modelo real. Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
