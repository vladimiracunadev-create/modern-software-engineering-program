<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 469" width="940" height="469" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">240 mensajes sintéticos: qué detecta cada regla de un escáner previo al envío</title><desc id="d">Mapa de calor con cuántos mensajes de cada clase detecta cada regla de un escáner previo al envío: el patrón detecta los 40 correos y los 40 identificadores, la entropía solo las cadenas alfanuméricas, la palabra clave seguida de un valor las dos cadenas aleatorias, y las tres reglas juntas cubren los cuatro tipos de dato sin marcar ningún texto limpio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="469" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">240 mensajes sintéticos: qué detecta cada regla de un escáner previo al envío</tspan></text><text x="633" y="59" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="633" dy="0">Mensajes detectados por cada regla</tspan></text><text x="417.75" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">Patrón</tspan></text><text x="561.25" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">Entropía</tspan></text><text x="704.75" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">Contexto</tspan></text><text x="848.25" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.25" dy="0">Las tres</tspan></text><text x="336" y="119.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Correo electrónico (40)</tspan></text><text x="336" y="161.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Cadena aleatoria alfanumérica (40)</tspan></text><text x="336" y="203.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Cadena aleatoria hexadecimal (40)</tspan></text><text x="336" y="245.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Identificador con guion (40)</tspan></text><text x="336" y="287.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="336" dy="0">Texto sin datos sensibles (80)</tspan></text><rect x="347.5" y="95.5" width="140.5" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417.75" dy="0">40</tspan></text><rect x="491" y="95.5" width="140.5" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">0</tspan></text><rect x="634.5" y="95.5" width="140.5" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">0</tspan></text><rect x="778" y="95.5" width="140.5" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="119.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="848.25" dy="0">40</tspan></text><rect x="347.5" y="137.5" width="140.5" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">0</tspan></text><rect x="491" y="137.5" width="140.5" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="561.25" dy="0">40</tspan></text><rect x="634.5" y="137.5" width="140.5" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="704.75" dy="0">40</tspan></text><rect x="778" y="137.5" width="140.5" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="848.25" dy="0">40</tspan></text><rect x="347.5" y="179.5" width="140.5" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">0</tspan></text><rect x="491" y="179.5" width="140.5" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">0</tspan></text><rect x="634.5" y="179.5" width="140.5" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="704.75" dy="0">40</tspan></text><rect x="778" y="179.5" width="140.5" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="848.25" dy="0">40</tspan></text><rect x="347.5" y="221.5" width="140.5" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="417.75" dy="0">40</tspan></text><rect x="491" y="221.5" width="140.5" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">0</tspan></text><rect x="634.5" y="221.5" width="140.5" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">0</tspan></text><rect x="778" y="221.5" width="140.5" height="39" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="245.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="848.25" dy="0">40</tspan></text><rect x="347.5" y="263.5" width="140.5" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="417.75" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="417.75" dy="0">0</tspan></text><rect x="491" y="263.5" width="140.5" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="561.25" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="561.25" dy="0">0</tspan></text><rect x="634.5" y="263.5" width="140.5" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="704.75" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="704.75" dy="0">0</tspan></text><rect x="778" y="263.5" width="140.5" height="39" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="848.25" y="287.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="848.25" dy="0">0</tspan></text><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Clase de mensaje (casos)</text><text x="346" y="330" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="346" dy="0">0</tspan></text><rect x="361.54" y="318" width="30.5" height="14" fill="#dff1ee"/><rect x="391.54" y="318" width="30.5" height="14" fill="#c0e1e0"/><rect x="421.54" y="318" width="30.5" height="14" fill="#a2d0d2"/><rect x="451.54" y="318" width="30.5" height="14" fill="#83c0c4"/><rect x="481.54" y="318" width="30.5" height="14" fill="#64b0b6"/><rect x="511.54" y="318" width="30.5" height="14" fill="#45a0a8"/><rect x="541.54" y="318" width="30.5" height="14" fill="#278f9a"/><rect x="571.54" y="318" width="30.5" height="14" fill="#087f8c"/><text x="609.54" y="330" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="609.54" dy="0">40</tspan></text><text x="632.62" y="330" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="632.62" dy="0">más oscuro = mayor (detectados)</tspan></text><rect x="10" y="346" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="370.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada regla ve una cara; la entropía no puede marcar una cadena hexadecimal porque su entropía máxima es 4 bits, y la regla</tspan></text><text x="470" y="387.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de contexto depende de la palabra «clave». Las cadenas se generan en tiempo de ejecución; ninguna es un dato real. Los</tspan></text><text x="470" y="404.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mensajes son plantillas del autor.</tspan></text><text x="470" y="451.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código estándar ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos.</tspan></text></svg>
