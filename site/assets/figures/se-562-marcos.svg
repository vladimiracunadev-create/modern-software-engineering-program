<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 489" width="960" height="489" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la evidencia técnica de la parte a lo que piden los tres marcos de gobierno</title><desc id="d">Diagrama con las clases de la parte 46 que producen evidencia (datos, reproducibilidad, evaluación, despliegue, monitoreo, robustez y registro) y los tres marcos que la consumen: requisitos de alto riesgo del reglamento europeo, sistema de gestión de la norma ISO 42001 y funciones Gobernar, Mapear, Medir y Gestionar del marco del NIST.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="489" fill="#ffffff"/><rect x="10" y="14" width="208" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114" dy="0">Datos y etiquetas</tspan></text><text x="114" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114" dy="0">SE-554</tspan></text><rect x="254" y="14" width="208" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358" dy="0">Corridas y huellas</tspan></text><text x="358" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358" dy="0">SE-555</tspan></text><polyline points="218,62 254,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="498" y="14" width="208" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="602" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="602" dy="0">Evaluación por grupos</tspan></text><text x="602" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="602" dy="0">SE-556</tspan></text><polyline points="462,62 498,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="742" y="14" width="208" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="846" y="57.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="846" dy="0">Despliegue y rollback</tspan></text><text x="846" y="73.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="846" dy="0">SE-559</tspan></text><polyline points="706,62 742,62" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="150" width="208" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="114" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114" dy="0">Monitoreo</tspan></text><text x="114" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="114" dy="0">SE-560</tspan></text><rect x="254" y="150" width="208" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="358" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358" dy="0">Robustez</tspan></text><text x="358" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="358" dy="0">SE-561</tspan></text><polyline points="218,198 254,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="498" y="150" width="208" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="602" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="602" dy="0">Registro encadenado</tspan></text><text x="602" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="602" dy="0">SE-562</tspan></text><polyline points="462,198 498,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="846,110 846,130 114,130 114,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="286" width="208" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="114" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114" dy="0">Reglamento (UE) 2024/1689</tspan></text><text x="114" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="114" dy="0">Requisitos de alto riesgo</tspan></text><rect x="254" y="286" width="208" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="358" y="329.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="358" dy="0">ISO/IEC 42001</tspan></text><text x="358" y="345.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="358" dy="0">Sistema de gestión</tspan></text><polyline points="218,334 254,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="498" y="286" width="208" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="602" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="602" dy="0">NIST AI RMF</tspan></text><text x="602" y="337.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="602" dy="0">Gobernar, Mapear, Medir,</tspan></text><text x="602" y="354.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="602" dy="0">Gestionar</tspan></text><polyline points="462,334 498,334" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="602,246 602,266 114,266 114,286" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="396" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="420.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cada artefacto sirve a más de un marco: un mismo informe de evaluación apoya los requisitos de datos y de exactitud y la</tspan></text><text x="480" y="437.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">función Medir. Es un mapa didáctico; la correspondencia exacta la decide quien conoce la norma y el contexto.</tspan></text><text x="480" y="479.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Mapa didáctico del autor; no sustituye una evaluación de conformidad ni asesoría jurídica.</tspan></text></svg>
