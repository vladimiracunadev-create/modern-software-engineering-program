<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Huellas de cinco símbolos: fragmento generado frente a un corpus con licencia</title><desc id="d">Barras horizontales con el porcentaje de huellas de cinco símbolos de cada fragmento que aparece en el corpus: la copia literal da 100 % en las dos comparaciones; la copia con nombres cambiados baja a 24 % comparando símbolos literales y vuelve a 100 % con identificadores normalizados; una solución independiente da 0 % y 35 %.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Huellas de cinco símbolos: fragmento generado frente a un corpus con licencia</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Huellas literales</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Con identificadores normalizados</tspan></text><line x1="294" y1="77" x2="294" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="333" x2="294" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="413.564" y1="77" 