y1="359" x2="377.342" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="377.342" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377.342" dy="0">60</tspan></text><line x1="798.426" y1="59" x2="798.426" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="798.426" y1="359" x2="798.426" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="798.426" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="798.426" dy="0">150</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0"></tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Reversión sin conflicto (%)</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Ediciones posteriores en el archivo</tspan></text><polyline points="96.62,59 120.014,198.8 190.194,334.1 377.342,358.7 798.426,359" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="96.62" cy="59" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="106.62" y="63.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="106.62" dy="0">100,0 %</tspan></text><circle cx="120.014" cy="198.8" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="130.014" y="203.3" font-size="13" text-anchor="start" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="130.014" dy="0">53,4 %</tspan></text><circle cx="190.194" cy="334.1" r="5.5" fill