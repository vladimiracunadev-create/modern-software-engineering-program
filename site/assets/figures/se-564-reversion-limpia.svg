<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Revertir un cambio de 40 líneas (4 bloques de 10) en un archivo de 400 tras k ediciones posteriores</title><desc id="d">Línea con la probabilidad de revertir un cambio de 40 líneas sin conflicto según las ediciones posteriores: 100,0 % sin ediciones, 53,4 % con 5, 8,3 % con 20 y 0,1 % con 60.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Revertir un cambio de 40 líneas (4 bloques de 10) en un archivo de 400 tras k ediciones posteriores</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="299" x2="78.62" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy=