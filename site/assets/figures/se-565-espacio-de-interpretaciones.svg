0432f" stroke-width="2"/><text x="696.925" y="302.373" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="696.925" dy="0">6</tspan></text><rect x="886.5" y="380.5" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="375" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1</tspan></text><rect x="10" y="446" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="470.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Implementaciones que coinciden con la intención (de 200): 0, 1, 5, 53 y 200 con 0, 2, 4, 6 y 8 decisiones resueltas. Cada</tspan></text><text x="470" y="487.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">decisión resuelta divide el espacio por su número de lecturas. Con las ocho abiertas, ninguna de 200 implementaciones</tspan></text><text x="470" y="504.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">coincide con la intención. El modelo supone decisiones independientes y lecturas igual de probables.</tspan></text><text x="470" y="551.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
