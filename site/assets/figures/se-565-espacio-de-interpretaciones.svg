<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 569" width="940" height="569" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ocho decisiones abiertas de dos o tres lecturas: comportamientos posibles y observados en 200 implementaciones</title><desc id="d">Líneas en escala logarítmica con los comportamientos posibles y los distintos observados en 200 implementaciones según las decisiones resueltas: con 0 hay 864 posibles y 184 distintos; con 2, 144 y 107; con 4, 36 y 36; con 6, 6 y 6; con 8, 1 y 1; las implementaciones que coinciden con la intención son 0, 1, 5, 53 y 200.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="569" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ocho decisiones abiertas de dos o tres lecturas: comportamientos posibles y observados en 200</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">implementaciones</tspan></text><circle cx="22" cy="70" r="6" fill="#6b7c86" stroke="#6b7c86" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Comportamientos posibles</tspan></text><rect x="244.96" y="64" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="264.96" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="264.96" dy="0">Distintos en 200 implementaciones</tspan></text><line x1="93.7" y1="386" x2="910" y2="386" stroke="#d5dde1" stroke-width="1"/><l