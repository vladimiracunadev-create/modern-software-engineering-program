<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 532" width="940" height="532" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una arquitectura 1oo2 con prueba anual: PFD media según la fracción de fallos de causa común</title><desc id="d">Línea en escala logarítmica con la PFD media de un 1oo2: 1,02 por diez a la menos cuatro sin causa común, 2,73 por diez a la menos cuatro con beta de 0,02, 5,30 por diez a la menos cuatro con 0,05, 9,59 por diez a la menos cuatro con 0,10 y 1,82 por diez a la menos tres con 0,20.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="532" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una arquitectura 1oo2 con prueba anual: PFD media según la fracción de fallos de causa común</tspan></text><line x1="101.24" y1="349" x2="910" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="349" x2="101.24" y2="349" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="353.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,0001</tspan></text><line x1="101.24" y1="204" x2="910" y2="204" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="204" x2="101.24" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="208.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,001</tspan></text><line x1="101.24" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="59" x2="101.24" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0,01</tspan></text><line x1="101.24" y1="59" x2="101.24" y2="349" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="59" x2="119.24" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="349" x2="119.24" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="370" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">0,00</tspan></text><line x1="196.516" y1="59" x2="196.516" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="196.516" y1="349" x2="196.516" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="196.516" y="370" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="196.516" dy="0">0,02</tspan></text><line x1="312.43" y1="59" x2="312.43" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="312.43" y1="349" x2="312.43" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="312.43" y="370" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="312.43" dy="0">0,05</tspan></text><line x1="505.62" y1="59" x2="505.62" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="505.62" y1="349" x2="505.62" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="505.62" y="370" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="505.62" dy="0">0,10</tspan></text><line x1="892" y1="59" x2="892" y2="349" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="349" x2="892" y2="354" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="370" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0,20</tspan></text><line x1="101.24" y1="349" x2="910" y2="349" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 204)">PFD media (escala logarítmica)</text><text x="505.62" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Fracción de causa común (beta)</tspan></text><line x1="101.24" y1="204" x2="910" y2="204" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="107.24" y="198" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="107.24" dy="0">frontera 1e-3</tspan></text><polyline points="119.24,347.753 196.516,285.756 312.43,243.98 505.62,206.636 892,166.29" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="119.24" cy="347.753" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="119.24" y="336.753" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">0,00010</tspan></text><circle cx="196.516" cy="285.756" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="196.516" y="274.756" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="196.516" dy="0">0,00027</tspan></text><circle cx="312.43" cy="243.98" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="312.43" y="232.98" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="312.43" dy="0">0,00053</tspan></text><circle cx="505.62" cy="206.636" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="505.62" y="195.636" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="505.62" dy="0">0,00096</tspan></text><circle cx="892" cy="166.29" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="155.29" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,00182</tspan></text><rect x="10" y="409" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con beta cero, duplicar el canal reduce la PFD a 1,02e-4; con beta 0,20 la deja en 1,82e-3, un factor 18 peor, y cruza la</tspan></text><text x="470" y="450.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">frontera de la banda. La redundancia no protege de lo que comparten los dos canales: misma calibración, misma fuente, misma</tspan></text><text x="470" y="467.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">especificación errónea.</tspan></text><text x="470" y="514.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
