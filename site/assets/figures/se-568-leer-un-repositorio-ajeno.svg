<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 597" width="940" height="597" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco estrategias para encontrar los usos de una función en un repositorio sintético de 300 módulos y 1 004 KB</title><desc id="d">Barras horizontales en escala logarítmica con los módulos y los kilobytes leídos por cinco estrategias: leer todo lee 300 módulos y 1004 kilobytes y encuentra 5 de 5; buscar el nombre lee 4 y 11,8 y encuentra 4; buscar el nombre y el módulo que la define lee 9 y 27,2 y encuentra 5; un mapa vigente lee 5 y 15,3 y encuentra 5; un mapa desactualizado lee 4 y 11,8 y encuentra 4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="597" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco estrategias para encontrar los usos de una función en un repositorio sintético de 300 módulos y 1 004</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">KB</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Módulos leídos</tspan></text><rect x="169.56" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="189.56" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">KB leídos</tspan></text><line x1="324" y1="96" x2="324" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="416" x2="324" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">1</tspan></text><line x1="457.895" y1="96" x2="457.895" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="457.895" y1="416" x2="457.895" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="457.895" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="457.895" dy="0">10</tspan></text><line x1="591.79" y1="96" x2="591.79" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="591.79" y1="416" x2="591.79" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="591.79" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="591.79" dy="0">100</tspan></text><line x1="725.685" y1="96" x2="725.685" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="725.685" y1="416" x2="725.685" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="725.685" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725.685" dy="0">1 000</tspan></text><line x1="859.58" y1="96" x2="859.58" y2="416" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="416" x2="859.58" y2="421" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="437" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">10 000</tspan></text><line x1="324" y1="416" x2="859.58" y2="416" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="132.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Leer todo (5 de 5)</tspan></text><text x="314" y="188" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Buscar el nombre y leer los que lo</tspan></text><text x="314" y="205" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">contienen (4 de 5)</tspan></text><text x="314" y="252" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Buscar el nombre y el módulo que lo</tspan></text><text x="314" y="269" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">define (5 de 5)</tspan></text><text x="314" y="324.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Mapa de arquitectura vigente (5 de 5)</tspan></text><text x="314" y="388.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Mapa de hace un trimestre (4 de 5)</tspan></text><rect x="324" y="102" width="331.674" height="24.5" rx="3" fill="#102a43"/><text x="662.674" y="118.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="662.674" dy="0">300,0</tspan></text><rect x="324" y="129.5" width="401.917" height="24.5" rx="3" fill="#c0432f"/><text x="732.917" y="146.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="732.917" dy="0">1 004,0</tspan></text><rect x="324" y="166" width="80.6128" height="24.5" rx="3" fill="#102a43"/><text x="411.613" y="182.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="411.613" dy="0">4,0</tspan></text><rect x="324" y="193.5" width="143.52" height="24.5" rx="3" fill="#c0432f"/><text x="474.52" y="210.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="474.52" dy="0">11,8</tspan></text><rect x="324" y="230" width="127.768" height="24.5" rx="3" fill="#102a43"/><text x="458.768" y="246.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="458.768" dy="0">9,0</tspan></text><rect x="324" y="257.5" width="192.082" height="24.5" rx="3" fill="#c0432f"/><text x="523.082" y="274.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="523.082" dy="0">27,2</tspan></text><rect x="324" y="294" width="93.5886" height="24.5" rx="3" fill="#102a43"/><text x="424.589" y="310.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="424.589" dy="0">5,0</tspan></text><rect x="324" y="321.5" width="158.624" height="24.5" rx="3" fill="#c0432f"/><text x="489.624" y="338.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="489.624" dy="0">15,3</tspan></text><rect x="324" y="358" width="80.6128" height="24.5" rx="3" fill="#102a43"/><text x="411.613" y="374.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="411.613" dy="0">4,0</tspan></text><rect x="324" y="385.5" width="143.52" height="24.5" rx="3" fill="#c0432f"/><text x="474.52" y="402.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="474.52" dy="0">11,8</tspan></text><text x="591.79" y="460" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="591.79" dy="0">Módulos o KB leídos (escala logarítmica)</tspan></text><rect x="10" y="474" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="498.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, los cambios hallados de 5. La búsqueda por nombre cuesta el 1,2 % de la lectura total y no ve el uso por</tspan></text><text x="470" y="515.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cadena de texto. Un mapa vale lo que valga su mantenimiento. El repositorio es sintético, con módulos pequeños y un solo</tspan></text><text x="470" y="532.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">uso dinámico.</tspan></text><text x="470" y="579.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
