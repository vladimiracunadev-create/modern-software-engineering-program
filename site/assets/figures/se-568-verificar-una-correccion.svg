<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco errores y cuatro candidatos de arreglo: cuántos acepta cada política de verificación</title><desc id="d">Mapa de calor con los arreglos aceptados de cinco por cada política de verificación y candidato: la batería existente acepta el código sin corregir en 5 de 5 casos; la reproducción lo rechaza pero acepta el arreglo del síntoma en 5; batería y reproducción aceptan el síntoma y rechazan dos arreglos que rompen otro caso; con casos vecinos solo se aceptan los arreglos de la causa, más uno que rompe otro caso.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco errores y cuatro candidatos de arreglo: cuántos acepta cada política de verificación</tspan></text><text x="389.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="389.75" dy="0">Sin corregir</tspan></text><text x="541.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="541.25" dy="0">Arregla el síntoma</tspan></text><text x="692.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="692.75" dy="0">Arregla y rompe</tspan></text><text x="692.75" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="692.75" dy="0">otro caso</tspan></text><text x="844.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="844.25" dy="0">Arregla la causa</tspan></text><text x="304" y="115.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Solo la batería existente</tspan></text><text x="304" y="159.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Solo la reproducción</tspan></text><text x="304" y="203.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Batería y reproducción</tspan></text><text x="304" y="247.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Batería, reproducción y casos vecinos</tspan></text><rect x="315.5" y="90.5" width="148.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="389.75" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="389.75" dy="0">5</tspan></text><rect x="467" y="90.5" width="148.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="541.25" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="541.25" dy="0">5</tspan></text><rect x="618.5" y="90.5" width="148.5" height="41" rx="4" fill="#d88375" stroke="#ffffff" stroke-width="1"/><text x="692.75" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="692.75" dy="0">3</tspan></text><rect x="770" y="90.5" width="148.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="844.25" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="844.25" dy="0">5</tspan></text><rect x="315.5" y="134.5" width="148.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="389.75" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="389.75" dy="0">0</tspan></text><rect x="467" y="134.5" width="148.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="541.25" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="541.25" dy="0">5</tspan></text><rect x="618.5" y="134.5" width="148.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="692.75" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="692.75" dy="0">5</tspan></text><rect x="770" y="134.5" width="148.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="844.25" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="844.25" dy="0">5</tspan></text><rect x="315.5" y="178.5" width="148.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="389.75" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="389.75" dy="0">0</tspan></text><rect x="467" y="178.5" width="148.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="541.25" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="541.25" dy="0">5</tspan></text><rect x="618.5" y="178.5" width="148.5" height="41" rx="4" fill="#d88375" stroke="#ffffff" stroke-width="1"/><text x="692.75" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="692.75" dy="0">3</tspan></text><rect x="770" y="178.5" width="148.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="844.25" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="844.25" dy="0">5</tspan></text><rect x="315.5" y="222.5" width="148.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="389.75" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="389.75" dy="0">0</tspan></text><rect x="467" y="222.5" width="148.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="541.25" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="541.25" dy="0">0</tspan></text><rect x="618.5" y="222.5" width="148.5" height="41" rx="4" fill="#efc4bb" stroke="#ffffff" stroke-width="1"/><text x="692.75" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="692.75" dy="0">1</tspan></text><rect x="770" y="222.5" width="148.5" height="41" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="844.25" y="247.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="844.25" dy="0">5</tspan></text><text x="314" y="291" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><rect x="329.54" y="279" width="30.5" height="14" fill="#fbe4de"/><rect x="359.54" y="279" width="30.5" height="14" fill="#f3cdc5"/><rect x="389.54" y="279" width="30.5" height="14" fill="#eab6ac"/><rect x="419.54" y="279" width="30.5" height="14" fill="#e29f93"/><rect x="449.54" y="279" width="30.5" height="14" fill="#d9887a"/><rect x="479.54" y="279" width="30.5" height="14" fill="#d17161"/><rect x="509.54" y="279" width="30.5" height="14" fill="#c85a48"/><rect x="539.54" y="279" width="30.5" height="14" fill="#c0432f"/><text x="577.54" y="291" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="577.54" dy="0">5</tspan></text><text x="593.08" y="291" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="593.08" dy="0">más oscuro = mayor (Arreglos aceptados de 5)</tspan></text><rect x="10" y="307" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La batería existente acepta el código sin corregir en los cinco casos: por eso el error existía. Solo los casos vecinos</tspan></text><text x="470" y="348.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">rechazan el arreglo del síntoma. Los errores, las baterías y los arreglos son del autor.</tspan></text><text x="470" y="396.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
