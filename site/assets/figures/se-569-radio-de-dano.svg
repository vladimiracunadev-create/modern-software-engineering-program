<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 425" width="940" height="425" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Sesiones de 20 acciones con un 5 % de desvíos y 12 herramientas: sesiones con algún daño según la configuración (5 000 sesiones)</title><desc id="d">Barras horizontales con el porcentaje de sesiones con algún daño en 5000 sesiones de 20 acciones con un 5 por ciento de desvíos: con todas las herramientas y alcance completo 41,6; con solo las seis de la tarea 21,3; con escritura confinada 3,2; con aprobación humana para lo destructivo 0,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="425" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Sesiones de 20 acciones con un 5 % de desvíos y 12 herramientas: sesiones con algún daño según la</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">configuración (5 000 sesiones)</tspan></text><line x1="354" y1="68" x2="354" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="244" x2="354" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="459.952" y1="68" x2="459.952" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="459.952" y1="244" x2="459.952" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="459.952" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="459.952" dy="0">10</tspan></text><line x1="565.904" y1="68" x2="565.904" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="565.904" y1="244" x2="565.904" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="565.904" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="565.904" dy="0">20</tspan></text><line x1="671.856" y1="68" x2="671.856" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="671.856" y1="244" x2="671.856" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="671.856" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="671.856" dy="0">30</tspan></text><line x1="777.808" y1="68" x2="777.808" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="777.808" y1="244" x2="777.808" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="777.808" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.808" dy="0">40</tspan></text><line x1="883.76" y1="68" x2="883.76" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="244" x2="883.76" y2="249" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">50</tspan></text><line x1="354" y1="244" x2="883.76" y2="244" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="86" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Todas las herramientas, alcance completo</tspan></text><text x="344" y="103" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(0,53 daños por sesión)</tspan></text><text x="344" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Solo las herramientas de la tarea (0,24)</tspan></text><text x="344" y="174" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">…y escritura confinada al espacio de trabajo</tspan></text><text x="344" y="191" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(0,03)</tspan></text><text x="344" y="218" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">…y lo destructivo exige aprobación humana</tspan></text><text x="344" y="235" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">(0,00)</tspan></text><rect x="354" y="74" width="440.76" height="32" rx="3" fill="#c0432f"/><text x="801.76" y="94.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="801.76" dy="0">41,6</tspan></text><rect x="354" y="118" width="225.678" height="32" rx="3" fill="#c0432f"/><text x="586.678" y="138.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="586.678" dy="0">21,3</tspan></text><rect x="354" y="162" width="33.9046" height="32" rx="3" fill="#c0432f"/><text x="394.905" y="182.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="394.905" dy="0">3,2</tspan></text><rect x="354" y="206" width="2" height="32" rx="3" fill="#c0432f"/><text x="363" y="226.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0,0</tspan></text><text x="618.88" y="288" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="618.88" dy="0">Sesiones con algún daño (%)</tspan></text><rect x="10" y="302" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="326.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, las acciones dañinas por sesión. Cada restricción reduce el daño por una razón distinta y se acumulan. El</tspan></text><text x="470" y="343.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cero de la última fila supone una aprobación humana perfecta, la suposición más débil. El 5 % de desvíos y la elección</tspan></text><text x="470" y="360.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">uniforme de herramienta son del autor.</tspan></text><text x="470" y="407.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
