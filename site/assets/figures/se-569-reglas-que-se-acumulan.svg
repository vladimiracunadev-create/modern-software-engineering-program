<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reglas «permitir siempre» tras 24 semanas con 6 solicitudes semanales (500 equipos por fila)</title><desc id="d">Barras agrupadas con las reglas de permitir siempre acumuladas en 24 semanas en 500 equipos: sin revisión la mediana es de 57 reglas, 20 amplias; con revisión cada 12 semanas 38 y 4; con revisión cada 4 semanas 13 y 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reglas «permitir siempre» tras 24 semanas con 6 solicitudes semanales (500 equipos por fila)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Reglas (mediana)</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">Reglas amplias (mediana)</tspan></text><line x1="71.08" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="355" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="359.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="268.333" x2="920" y2="268.333" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="268.333" x2="71.08" y2="268.333" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="272.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="181.667" x2="920" y2="181.667" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="181.667" x2="71.08" y2="181.667" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="186.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="355" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 225)">Reglas</text><rect x="99.3773" y="108" width="111.189" height="247" rx="3" fill="#102a43"/><text x="154.972" y="102" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154.972" dy="0">57</tspan></text><rect x="214.567" y="268.333" width="111.189" height="86.6667" rx="3" fill="#c0432f"/><text x="270.161" y="262.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="270.161" dy="0">20</tspan></text><text x="212.567" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.567" dy="0">Nunca se revisan</tspan></text><rect x="382.351" y="190.333" width="111.189" height="164.667" rx="3" fill="#102a43"/><text x="437.945" y="184.333" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="437.945" dy="0">38</tspan></text><rect x="497.54" y="337.667" width="111.189" height="17.3333" rx="3" fill="#c0432f"/><text x="553.135" y="331.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.135" dy="0">4</tspan></text><text x="495.54" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="495.54" dy="0">Se revisan cada 12 semanas</tspan></text><rect x="665.324" y="298.667" width="111.189" height="56.3333" rx="3" fill="#102a43"/><text x="720.919" y="292.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="720.919" dy="0">13</tspan></text><rect x="780.513" y="350.667" width="111.189" height="4.33333" rx="3" fill="#c0432f"/><text x="836.108" y="344.667" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.108" dy="0">1</tspan></text><text x="778.513" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.513" dy="0">Se revisan cada 4 semanas</tspan></text><rect x="10" y="407" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Equipos con alguna regla amplia: 100 %, 98 % y 75 %. Sin revisión se acumulan 57 reglas y todos los equipos tienen alguna</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">amplia; revisar cada cuatro semanas mantiene el conjunto acotado sin eliminar el problema. El 40 % de aprobaciones</tspan></text><text x="470" y="465.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">permanentes y el 35 % de reglas amplias son supuestos del autor.</tspan></text><text x="470" y="512.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
