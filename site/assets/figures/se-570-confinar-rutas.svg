<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro comprobaciones de confinamiento al directorio de trabajo sobre 22 intentos (10 legítimos y 12 de escape)</title><desc id="d">Barras agrupadas con los escapes que pasan, de 12, y los legítimos rechazados, de 10, por cuatro comprobaciones: comparar el prefijo de texto deja pasar 3 escapes y rechaza 7 legítimos; el prefijo con separador sin normalizar deja pasar 7 y rechaza 1; normalizar deja pasar 1 y no rechaza ninguno; normalizar y rechazar el byte nulo deja pasar 0 y no rechaza ninguno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro comprobaciones de confinamiento al directorio de trabajo sobre 22 intentos (10 legítimos y 12 de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">escape)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Escapes que pasan (de 12)</tspan></text><rect x="252.5" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="272.5" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="272.5" dy="0">Legítimos rechazados (de 10)</tspan></text><line x1="63.54" y1="374" x2="920" y2="374" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="374" x2="63.54" y2="374" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="378.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="309" x2="920" y2="309" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="309" x2="63.54" y2="309" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="313.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="244" x2="920" y2="244" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="244" x2="63.54" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="248.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="179" x2="920" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="179" x2="63.54" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="114" x2="63.54" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">8</tspan></text><line x1="63.54" y1="114" x2="63.54" y2="374" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 244)">Intentos</text><rect x="84.9515" y="276.5" width="83.646" height="97.5" rx="3" fill="#c0432f"/><text x="126.774" y="270.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="126.774" dy="0">3</tspan></text><rect x="172.597" y="146.5" width="83.646" height="227.5" rx="3" fill="#946512"/><text x="214.421" y="140.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="214.421" dy="0">7</tspan></text><text x="170.597" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170.597" dy="0">Prefijo de texto</tspan></text><rect x="299.067" y="146.5" width="83.646" height="227.5" rx="3" fill="#c0432f"/><text x="340.889" y="140.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="340.889" dy="0">7</tspan></text><rect x="386.713" y="341.5" width="83.646" height="32.5" rx="3" fill="#946512"/><text x="428.536" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="428.536" dy="0">1</tspan></text><text x="384.713" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">Prefijo con separador, sin</tspan></text><text x="384.713" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="384.713" dy="0">normalizar</tspan></text><rect x="513.182" y="341.5" width="83.646" height="32.5" rx="3" fill="#c0432f"/><text x="555.005" y="335.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="555.005" dy="0">1</tspan></text><rect x="600.828" y="372" width="83.646" height="2" rx="3" fill="#946512"/><text x="642.651" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="642.651" dy="0">0</tspan></text><text x="598.828" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="598.828" dy="0">Normalizar y luego comparar</tspan></text><rect x="727.296" y="372" width="83.646" height="2" rx="3" fill="#c0432f"/><text x="769.119" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="769.119" dy="0">0</tspan></text><rect x="814.942" y="372" width="83.646" height="2" rx="3" fill="#946512"/><text x="856.765" y="366" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="856.765" dy="0">0</tspan></text><text x="812.942" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">Normalizar y rechazar el</tspan></text><text x="812.942" y="412" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="812.942" dy="0">nulo</tspan></text><rect x="10" y="443" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="467.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La barra invertida cambia de significado entre sistemas: queda dentro con las reglas de POSIX y fuera con las de Windows.</tspan></text><text x="470" y="484.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los enlaces simbólicos no se probaron. Pasar esta batería no demuestra que la comprobación sea correcta.</tspan></text><text x="470" y="532.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
