<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 239" width="960" height="239" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Estructura de un caso de seguridad: de la afirmación principal a la evidencia, con el contexto y las suposiciones</title><desc id="d">Diagrama de cuatro cajas: afirmación principal de que el sistema es aceptablemente seguro en un contexto, estrategia de argumento por peligros, subafirmaciones y evidencias, y suposiciones y contexto que acotan el argumento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="239" fill="#ffffff"/><rect x="10" y="14" width="202" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111" y="51.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Afirmación</tspan></text><text x="111" y="68.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">El sistema es</tspan></text><text x="111" y="84.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">aceptablemente seguro en</tspan></text><text x="111" y="101.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">este contexto</tspan></text><rect x="256" y="14" width="202" height="118" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Estrategia</tspan></text><text x="357" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Argumento por peligros y</tspan></text><text x="357" y="93.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">por controles</tspan></text><polyline points="212,73 256,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="118" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="603" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Evidencia</tspan></text><text x="603" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">Pruebas, análisis y</tspan></text><text x="603" y="93.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="603" dy="0">revisiones con versión</tspan></text><polyline points="458,73 502,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="118" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="849" y="60" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">Contexto y supuestos</tspan></text><text x="849" y="76.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">Lo que no se prueba pero</tspan></text><text x="849" y="93.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="849" dy="0">se asume</tspan></text><polyline points="704,73 748,73" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="146" width="940" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Un caso de seguridad es un argumento estructurado con evidencia que lo respalda: el argumento sin evidencia es opinión y la</tspan></text><text x="480" y="187.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">evidencia sin argumento es una carpeta. Los supuestos también son parte del argumento y también se desafían.</tspan></text><text x="480" y="229.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo con parámetros del autor y semilla fija 47; muestra un mecanismo, no mide un producto real.</tspan></text></svg>
