<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un gancho de política ejecutado como proceso sobre 58 eventos (18 peligrosos): salidas y modo de fallo</title><desc id="d">Barras horizontales con las salidas de 58 eventos ejecutados como procesos reales: 40 con éxito, 12 con bloqueo, 4 con error y 2 con tiempo agotado; si solo el código 2 bloquea, 6 de las 18 acciones peligrosas se ejecutan; si todo lo que no sea éxito bloquea, ninguna.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un gancho de política ejecutado como proceso sobre 58 eventos (18 peligrosos): salidas y modo de fallo</tspan></text><line x1="354" y1="49" x2="354" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="313" x2="354" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="490.47" y1="49" x2="490.47" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="490.47" y1="313" x2="490.47" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="490.47" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="490.47" dy="0">10</tspan></text><line x1="626.94" y1="49" x2="626.94" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="626.94" y1="313" x2="626.94" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="626.94" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.94" dy="0">20</tspan></text><line x1="763.41" y1="49" x2="763.41" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="763.41" y1="313" x2="763.41" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="763.41" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="763.41" dy="0">30</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="313" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="313" x2="899.88" y2="318" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="334" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">40</tspan></text><line x1="354" y1="313" x2="899.88" y2="313" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Éxito (código 0)</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Bloqueo (código 2)</tspan></text><text x="344" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Error (otro código)</tspan></text><text x="344" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Tiempo agotado</tspan></text><text x="344" y="243" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Peligrosas ejecutadas si solo el código 2</tspan></text><text x="344" y="260" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">bloquea (de 18)</tspan></text><text x="344" y="287" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Peligrosas ejecutadas si todo lo que no sea</tspan></text><text x="344" y="304" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">éxito bloquea (de 18)</tspan></text><rect x="354" y="55" width="545.88" height="32" rx="3" fill="#102a43"/><text x="906.88" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">40</tspan></text><rect x="354" y="99" width="163.764" height="32" rx="3" fill="#102a43"/><text x="524.764" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="524.764" dy="0">12</tspan></text><rect x="354" y="143" width="54.588" height="32" rx="3" fill="#102a43"/><text x="415.588" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="415.588" dy="0">4</tspan></text><rect x="354" y="187" width="27.294" height="32" rx="3" fill="#102a43"/><text x="388.294" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="388.294" dy="0">2</tspan></text><rect x="354" y="231" width="81.882" height="32" rx="3" fill="#102a43"/><text x="442.882" y="251.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="442.882" dy="0">6</tspan></text><rect x="354" y="275" width="2" height="32" rx="3" fill="#102a43"/><text x="363" y="295.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363" dy="0">0</tspan></text><text x="626.94" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="626.94" dy="0">Eventos o acciones</tspan></text><rect x="10" y="371" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="395.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con todo lo que no sea éxito bloqueando, ninguna acción inocua se bloquea. El diseño por defecto de estos controles falla</tspan></text><text x="470" y="412.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">abierto: una caída o un tiempo agotado no bloquean. El gancho imita un contrato documentado, no es la herramienta; el</tspan></text><text x="470" y="429.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">arranque de un proceso cuesta decenas de milisegundos y cambia de equipo en equipo.</tspan></text><text x="470" y="476.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Medido en Windows 11 (CPython 3.12.9) y Ubuntu bajo WSL2 (3.12.3); los tiempos de reloj cambian de equipo en equipo.</tspan></text></svg>
