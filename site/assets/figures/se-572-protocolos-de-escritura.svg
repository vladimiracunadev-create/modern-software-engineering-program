text-anchor="middle" font-weight="700" fill="#142231"><tspan x="156.634" dy="0">600</tspan></text><rect x="196.026" y="353" width="70.7822" height="2" rx="3" fill="#946512"/><text x="231.417" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.417" dy="0">0</tspan></text><rect x="270.808" y="353" width="70.7822" height="2" rx="3" fill="#102a43"/><text x="306.199" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="306.199" dy="0">0</tspan></text><text x="231.417" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Escritura ciega</tspan></text><rect x="396.677" y="353" width="70.7822" height="2" rx="3" fill="#c0432f"/><text x="432.068" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.068" dy="0">0</tspan></text><rect x="471.459" y="105.4" width="70.7822" height="249.6" rx="3" fill="#946512"/><text x="506.85" y="99.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">1 200</tspan></text><rect x="546.241" y="353" width="70.7822" height="2" rx="3" fill="#102a43"/><text x="581.632" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="581.632" dy="0">0</tspan></text><text x="506.85" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Versión optimista</tspan></text><rect x="672.11" y="353" width="70.7822" height="2" rx="3" fill="#c0432f"/><text x="707.501" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.501" dy="0">0</tspan></text><rect x="746.892" y="353" width="70.7822" height="2" rx="3" fill="#946512"/><text x="782.283" y="347" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="782.283" dy="0">0</tspan></text><rect x="821.674" y="151.16" width="70.7822" height="203.84" rx="3" fill="#102a43"/><text x="857.066" y="145.16" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="857.066" dy="0">980</tspan></text><text x="782.283" y="376" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Arrendamiento con caducidad</tspan></text><rect x="10" y="407" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="431.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">La pérdida de la escritura ciega es estructural: sobrevive una de cuatro contribuciones. Los cuatro agentes leen a la vez</tspan></text><text x="470" y="448.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en cada ronda, el caso peor para la versión optimista; SQLite en memoria no reproduce la concurrencia real.</tspan></text><text x="470" y="496.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
