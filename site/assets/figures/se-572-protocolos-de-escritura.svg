<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres protocolos de escritura de cuatro agentes sobre una fila compartida de SQLite en 200 rondas</title><desc id="d">Barras agrupadas con las contribuciones perdidas de 800, los reintentos y los ticks de espera de tres protocolos: la escritura ciega pierde 600 sin reintentos ni espera; la versión optimista no pierde ninguna y hace 1200 reintentos; el arrendamiento con caducidad no pierde ninguna, no reintenta y espera 980 ticks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres protocolos de escritura de cuatro agentes sobre una fila compartida de SQLite en 200 rondas</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Contribuciones perdidas de 800</tspan></text><rect x="290.2" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="310.2" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="310.2" dy="0">Reintentos</tspan></text><rect x="413.6" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="433.6" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="433.6" dy="0">Ticks de espera</tspan></text><line x1="93.7" y1="355" x2="920" y2="355" stroke="#d5dde1" stroke-width="1"/><line 