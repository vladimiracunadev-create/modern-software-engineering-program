<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 437" width="940" height="437" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Flujo de cinco pasos con 8 % de fallo por intento: consistencia según la estrategia de compensación (20 000 ejecuciones)</title><desc id="d">Barras apiladas horizontales con el resultado de 20000 ejecuciones según la compensación: sin compensación el 34,3 por ciento queda a medias; compensar sin reintentar deja 95,5 por ciento consistente y 4,5 a medias; con dos reintentos 100,0 y 0,1; con el paso 3 irreversible 87,8 consistente y 12,1 con efecto residual.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="437" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Flujo de cinco pasos con 8 % de fallo por intento: consistencia según la estrategia de compensación (20 000</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">ejecuciones)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Consistentes</tspan></text><rect x="154.48" y="64" width="12" height="12" rx="2" fill="#946512"/><text x="174.48" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="174.48" dy="0">A medias</tspan></text><rect x="262.8" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="282.8" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="282.8" dy="0">Con efecto residual</tspan></text><line x1="274" y1="96" x2="274" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="272" x2="274" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="394.34" y1="96" x2="394.34" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="394.34" y1="272" x2="394.34" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="394.34" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.34" dy="0">25</tspan></text><line x1="514.68" y1="96" x2="514.68" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="514.68" y1="272" x2="514.68" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="514.68" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="514.68" dy="0">50</tspan></text><line x1="635.02" y1="96" x2="635.02" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="635.02" y1="272" x2="635.02" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="635.02" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.02" dy="0">75</tspan></text><line x1="755.36" y1="96" x2="755.36" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="755.36" y1="272" x2="755.36" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="755.36" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="755.36" dy="0">100</tspan></text><line x1="875.7" y1="96" x2="875.7" y2="272" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="272" x2="875.7" y2="277" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">125</tspan></text><line x1="274" y1="272" x2="875.7" y2="272" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="122.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Sin compensación</tspan></text><text x="264" y="166.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Compensar sin reintentar</tspan></text><text x="264" y="210.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Compensar con 2 reintentos</tspan></text><text x="264" y="246" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Con 2 reintentos y el paso 3</tspan></text><text x="264" y="263" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">irreversible</tspan></text><rect x="274" y="103" width="316.254" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="432.127" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="432.127" dy="0">65,7</tspan></text><rect x="590.254" y="103" width="165.106" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="672.807" y="122.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="672.807" dy="0">34,3</tspan></text><rect x="755.36" y="103" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="762.36" y="122.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="762.36" dy="0">100,0</tspan></text><rect x="274" y="147" width="459.699" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="503.849" y="166.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="503.849" dy="0">95,5</tspan></text><rect x="733.699" y="147" width="21.6612" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="755.36" y="147" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="762.36" y="166.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="762.36" dy="0">100,0</tspan></text><rect x="274" y="191" width="481.36" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="514.68" y="210.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="514.68" dy="0">100,0</tspan></text><rect x="755.36" y="191" width="0.48136" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="755.841" y="191" width="0" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="762.841" y="210.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="762.841" dy="0">100,1</tspan></text><rect x="274" y="235" width="422.634" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="485.317" y="254.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="485.317" dy="0">87,8</tspan></text><rect x="696.634" y="235" width="0" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="696.634" y="235" width="58.2446" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="725.756" y="254.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="725.756" dy="0">12,1</tspan></text><text x="761.879" y="254.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="761.879" dy="0">99,9</tspan></text><text x="574.85" y="316" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="574.85" dy="0">Ejecuciones (%)</tspan></text><rect x="10" y="330" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="354.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Ejecuciones completas: 65,7 %, 65,4 %, 65,4 % y 65,6 %. Un paso irreversible deja un efecto que ninguna compensación</tspan></text><text x="470" y="371.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">elimina; conviene ponerlo al final. El 8 % de fallo y la independencia entre intentos son supuestos del autor.</tspan></text><text x="470" y="419.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Datos sintéticos con semilla fija; Windows y Ubuntu (WSL2) dan cifras idénticas.</tspan></text></svg>
