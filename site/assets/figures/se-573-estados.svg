<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro protocolos de exclusión mutua para dos procesos: estados alcanzables explorados por el verificador</title><desc id="d">Barras con los estados alcanzables: comprobar y luego marcar 14 con la exclusión mutua violada, solo bandera 15 con exclusión mutua correcta pero un bloqueo alcanzable, Peterson con los pasos invertidos 39 con la exclusión mutua violada y Peterson 34 con la propiedad cumplida y sin bloqueos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro protocolos de exclusión mutua para dos procesos: estados alcanzables explorados por el verificador</tspan></text><line x1="274" y1="49" x2="274" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="201" x2="274" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="430.47" y1="49" x2="430.47" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="430.47" y1="201" x2="430.47" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="430.47" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="430.47" dy="0">10</tspan></text><line x1="586.94" y1="49" x2="586.94" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="586.94" y1="201" x2="586.94" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="586.94" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="586.94" dy="0">20</tspan></text><line x1="743.41" y1="49" x2="743.41" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="743.41" y1="201" x2="743.41" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="743.41" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="743.41" dy="0">30</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="201" x2="899.88" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">40</tspan></text><line x1="274" y1="201" x2="899.88" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Comprobar y luego marcar</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Solo bandera</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Peterson con pasos invertidos</tspan></text><text x="264" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Peterson</tspan></text><rect x="274" y="55" width="219.058" height="26" rx="3" fill="#102a43"/><text x="500.058" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="500.058" dy="0">14</tspan></text><rect x="274" y="93" width="234.705" height="26" rx="3" fill="#102a43"/><text x="515.705" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="515.705" dy="0">15</tspan></text><rect x="274" y="131" width="610.233" height="26" rx="3" fill="#102a43"/><text x="891.233" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="891.233" dy="0">39</tspan></text><rect x="274" y="169" width="531.998" height="26" rx="3" fill="#102a43"/><text x="812.998" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="812.998" dy="0">34</tspan></text><text x="586.94" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="586.94" dy="0">Estados alcanzables</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dos protocolos violan la exclusión mutua (contraejemplos de 4 y 6 pasos), uno la cumple pero puede bloquearse y solo</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Peterson cumple la exclusión y no se bloquea en este modelo. Un verificador de estados explícitos propio, en Python,</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">recorre todos los estados; no se ejecutó TLA+, SPARK ni Alloy en esta clase.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; los recuentos se repiten con la misma semilla.</tspan></text></svg>
