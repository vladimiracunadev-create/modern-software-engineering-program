<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 432" width="940" height="432" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro filtros de instrucciones inyectadas sobre 200 documentos: 40 con una orden de prueba en cinco formas y 160 inocuos</title><desc id="d">Mapa de calor con las órdenes detectadas, de 8 por forma, por cuatro filtros: la frase fija detecta 8 de 8 directas y ninguna de las otras formas; normalizar y decodificar suma las de ancho cero y las codificadas; unir los campos suma las repartidas; el patrón amplio detecta las 40 y marca 19 de los 160 documentos inocuos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="432" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro filtros de instrucciones inyectadas sobre 200 documentos: 40 con una orden de prueba en cinco formas</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">y 160 inocuos</tspan></text><text x="365.6" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="365.6" dy="0">Directa</tspan></text><text x="488.8" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="488.8" dy="0">Parafraseada</tspan></text><text x="612" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="612" dy="0">Ancho cero</tspan></text><text x="735.2" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="735.2" dy="0">Codificada</tspan></text><text x="858.4" y="79" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="858.4" dy="0">Repartida</tspan></text><text x="294" y="117.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">Frase fija sobre el texto sin tratar</tspan></text><text x="294" y="161.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">+ normalizar el texto y decodificar</tspan></text><text x="294" y="205.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">+ unir los campos antes de buscar</tspan></text><text x="294" y="249.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="294" dy="0">+ patrón amplio (paráfrasis)</tspan></text><rect x="305.5" y="92.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="365.6" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="365.6" dy="0">8</tspan></text><rect x="428.7" y="92.5" width="120.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="488.8" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="488.8" dy="0">0</tspan></text><rect x="551.9" y="92.5" width="120.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="612" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="612" dy="0">0</tspan></text><rect x="675.1" y="92.5" width="120.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="735.2" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="735.2" dy="0">0</tspan></text><rect x="798.3" y="92.5" width="120.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="858.4" y="117.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="858.4" dy="0">0</tspan></text><rect x="305.5" y="136.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="365.6" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="365.6" dy="0">8</tspan></text><rect x="428.7" y="136.5" width="120.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="488.8" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="488.8" dy="0">0</tspan></text><rect x="551.9" y="136.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="612" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">8</tspan></text><rect x="675.1" y="136.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="735.2" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="735.2" dy="0">8</tspan></text><rect x="798.3" y="136.5" width="120.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="858.4" y="161.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="858.4" dy="0">0</tspan></text><rect x="305.5" y="180.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="365.6" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="365.6" dy="0">8</tspan></text><rect x="428.7" y="180.5" width="120.2" height="41" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="488.8" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="488.8" dy="0">0</tspan></text><rect x="551.9" y="180.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="612" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">8</tspan></text><rect x="675.1" y="180.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="735.2" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="735.2" dy="0">8</tspan></text><rect x="798.3" y="180.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="858.4" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="858.4" dy="0">8</tspan></text><rect x="305.5" y="224.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="365.6" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="365.6" dy="0">8</tspan></text><rect x="428.7" y="224.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="488.8" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="488.8" dy="0">8</tspan></text><rect x="551.9" y="224.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="612" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612" dy="0">8</tspan></text><rect x="675.1" y="224.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="735.2" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="735.2" dy="0">8</tspan></text><rect x="798.3" y="224.5" width="120.2" height="41" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="858.4" y="249.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="858.4" dy="0">8</tspan></text><text x="304" y="293" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="304" dy="0">0</tspan></text><rect x="319.54" y="281" width="30.5" height="14" fill="#dff1ee"/><rect x="349.54" y="281" width="30.5" height="14" fill="#c0e1e0"/><rect x="379.54" y="281" width="30.5" height="14" fill="#a2d0d2"/><rect x="409.54" y="281" width="30.5" height="14" fill="#83c0c4"/><rect x="439.54" y="281" width="30.5" height="14" fill="#64b0b6"/><rect x="469.54" y="281" width="30.5" height="14" fill="#45a0a8"/><rect x="499.54" y="281" width="30.5" height="14" fill="#278f9a"/><rect x="529.54" y="281" width="30.5" height="14" fill="#087f8c"/><text x="567.54" y="293" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="567.54" dy="0">8</tspan></text><text x="583.08" y="293" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="583.08" dy="0">más oscuro = mayor (Detectadas de 8)</tspan></text><rect x="10" y="309" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="333.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Inocuos marcados de 160: 0, 0, 0 y 19. Cada forma que se cierra añade ingeniería o falsas alarmas: el patrón amplio marca</tspan></text><text x="470" y="350.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">19 de 160 inocuos. El 100 % es consecuencia de un conjunto de pruebas escrito conociendo las cinco formas; no se midió</tspan></text><text x="470" y="367.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">ningún modelo.</tspan></text><text x="470" y="414.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 y Ubuntu (WSL2) con datos sintéticos; los recuentos son idénticos en ambos.</tspan></text></svg>
