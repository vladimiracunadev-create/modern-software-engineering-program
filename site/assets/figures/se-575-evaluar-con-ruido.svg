<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos agentes con aciertos de 70 y 76 %: detección de la diferencia según el número de tareas (2 000 repeticiones)</title><desc id="d">Líneas en escala logarítmica con el porcentaje de repeticiones que detectan la diferencia entre dos agentes con aciertos de 70 y 76 por ciento según las tareas: la prueba z declara a B mejor en 4,3 por ciento con 20 tareas, 8,3 con 50, 15,2 con 100, 38,1 con 300 y 89,5 con 1000; los intervalos separados en 0,4, 1,1, 2,2, 10,2 y 60,7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos agentes con aciertos de 70 y 76 %: detección de la diferencia según el número de tareas (2 000</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">repeticiones)</tspan></text><circle cx="22" cy="70" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Prueba z: B mejor</tspan></text><rect x="192.18" y="64" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="212.18" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Intervalos separados</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><li