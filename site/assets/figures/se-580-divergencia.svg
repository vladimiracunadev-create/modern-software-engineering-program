<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costo medio de un grupo de 32 hilos según la probabilidad de que cada hilo tome el camino A de una rama</title><desc id="d">Líneas con el costo medio relativo de un grupo de 32 hilos según la probabilidad de que cada hilo tome el camino A: 1,00 con probabilidad 0, 1,28 con 0,01, 1,80 con 0,05 y 2,00 con 0,5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costo medio de un grupo de 32 hilos según la probabilidad de que cada hilo tome el camino A de una rama</tspan></text><line x1="86.16" y1="339" x2="910" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="339" x2="86.16" y2="339" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="343.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1</tspan></text><line x1="86.16" y1="269" x2="910" y2="269" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="269" x2="86.16" y2="269" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="273.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1,25</tspan></text><line x1="86.16" y1="199" x2="910" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="199" x2="86.16" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1,5</tspan></text><line x1="86.16" y1="129" x2="910" y2="129" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="129" x2="86.16" y2="129" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="133.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">1,75</tspan></text><line x1="86.16" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="59" x2="86.16" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">2</tspan></text><line x1="86.16" y1="59" x2="86.16" y2="339" stroke="#5b7280" stroke-width="1.6"/><line x1="104.16" y1="59" x2="104.16" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="104.16" y1="339" x2="104.16" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="104.16" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.16" dy="0">0</tspan></text><line x1="119.917" y1="59" x2="119.917" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="119.917" y1="339" x2="119.917" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="119.917" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.917" dy="0">0,01</tspan></text><line x1="182.944" y1="59" x2="182.944" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="182.944" y1="339" x2="182.944" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="182.944" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="182.944" dy="0">0,05</tspan></text><line x1="892" y1="59" x2="892" y2="339" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="339" x2="892" y2="344" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0,5</tspan></text><line x1="86.16" y1="339" x2="910" y2="339" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 199)">Costo relativo del grupo</text><text x="498.08" y="385" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="498.08" dy="0">Probabilidad de que un hilo tome el camino A</tspan></text><polyline points="104.16,339 119.917,260.6 182.944,115 892,59" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="104.16" cy="339" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="104.16" y="328" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.16" dy="0">1,00</tspan></text><circle cx="119.917" cy="260.6" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="119.917" y="249.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.917" dy="0">1,28</tspan></text><circle cx="182.944" cy="115" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="182.944" y="104" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="182.944" dy="0">1,80</tspan></text><circle cx="892" cy="59" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">2,00</tspan></text><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con una probabilidad de 0,01 por hilo, el grupo ejecuta ambos caminos en el 27,8 % de los casos; con 0,05, en el 80,4 %.</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Basta un hilo discrepante de 32 para pagar los dos caminos. El modelo supone hilos independientes y dos caminos del mismo</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">costo; con datos correlacionados el resultado cambia.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo con parámetros del autor y semilla fija 48; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
