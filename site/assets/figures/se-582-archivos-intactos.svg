<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Archivos intactos de 15 después de recuperar</title><desc id="d">Gráfico de barras con los archivos intactos de 15 tras recuperar: sin protección 0, solo confinamiento 2, Git sin confinar 10 y confinamiento con copia previa 15.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="300" fill="#ffffff"/><text x="334" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Sin protección</tspan></text><rect x="344" y="16" width="4" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="356" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="356" dy="0">0</tspan></text><text x="334" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Solo confinamiento</tspan></text><rect x="344" y="62" width="100" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="452" dy="0">2</tspan></text><text x="334" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Sin confinar + Git</tspan></text><rect x="344" y="108" width="500" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="852" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="852" dy="0">10</tspan></text><text x="334" y="175" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="334" dy="0">Confinamiento + copia previa</tspan></text><rect x="344" y="154" width="750" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1102" y="175" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1102" dy="0">15</tspan></text><rect x="10" y="202" width="940" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="232.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Ninguna capa alcanza sola: las dos juntas llegan a 15 en un caso donde cada una por separado deja huecos.</tspan></text><text x="480" y="286" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
