<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cinco acciones destructivas contra 15 archivos: qué sobrevive y qué se recupera</title><desc id="d">Barras horizontales con los archivos intactos, de 15, tras cinco acciones destructivas, 13 en el proyecto y 2 fuera: sin protección sobreviven 0 y se recuperan 0; con solo confinamiento sobreviven 2 y se recuperan 2; con confinamiento y copia previa sobreviven 2 y se recuperan los 15; sin confinar y con Git sobreviven 0 y se recuperan 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cinco acciones destructivas contra 15 archivos: qué sobrevive y qué se recupera</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Intactos tras el agente</tspan></text><rect x="237.42" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="257.42" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="257.42" dy="0">Intactos tras recuperar</tspan></text><line x1="314" y1="77" x2="314" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="333" x2="314" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="509.293" y1="77" x2="509.293" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="509.293" y1="333" x2="509.293" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="509.293" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="509.293" dy="0">5</tspan></text><line x1="704.587" y1="77" x2="704.587" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="704.587" y1="333" x2="704.587" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="704.587" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.587" dy="0">10</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="333" x2="899.88" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">15</tspan></text><line x1="314" y1="333" x2="899.88" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="113.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Sin protección (0 acciones bloqueadas)</tspan></text><text x="304" y="169" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Solo confinamiento (2 acciones</tspan></text><text x="304" y="186" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">bloqueadas)</tspan></text><text x="304" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Confinamiento + copia previa (2)</tspan></text><text x="304" y="305.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Sin confinar + Git (0)</tspan></text><rect x="314" y="83" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="323" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><rect x="314" y="110.5" width="2" height="24.5" rx="3" fill="#087f8c"/><text x="323" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><rect x="314" y="147" width="78.1173" height="24.5" rx="3" fill="#c0432f"/><text x="399.117" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="399.117" dy="0">2</tspan></text><rect x="314" y="174.5" width="78.1173" height="24.5" rx="3" fill="#087f8c"/><text x="399.117" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="399.117" dy="0">2</tspan></text><rect x="314" y="211" width="78.1173" height="24.5" rx="3" fill="#c0432f"/><text x="399.117" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="399.117" dy="0">2</tspan></text><rect x="314" y="238.5" width="585.88" height="24.5" rx="3" fill="#087f8c"/><text x="906.88" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="906.88" dy="0">15</tspan></text><rect x="314" y="275" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="323" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><rect x="314" y="302.5" width="390.587" height="24.5" rx="3" fill="#087f8c"/><text x="711.587" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="711.587" dy="0">10</tspan></text><text x="606.94" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="606.94" dy="0">Archivos intactos (de 15)</tspan></text><rect x="10" y="391" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El confinamiento impide el daño fuera de la raíz y no deshace el de dentro; la copia deshace lo de dentro y no impide nada.</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Git recupera 10 de 15: los archivos no versionados y los de fuera no vuelven.</tspan></text><text x="470" y="480.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
