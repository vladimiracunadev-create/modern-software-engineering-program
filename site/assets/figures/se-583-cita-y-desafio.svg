<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 411" width="940" height="411" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué acepta el verificador: tres escenarios de cita con y sin desafío fresco</title><desc id="d">Mapa de calor con tres escenarios y dos condiciones: una cita legítima se acepta con y sin desafío, la de la cadena alterada se rechaza con desafío fresco y una cita vieja reproducida se acepta sin desafío y se rechaza con desafío fresco.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="411" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué acepta el verificador: tres escenarios de cita con y sin desafío fresco</tspan></text><text x="465.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="465.5" dy="0">Sin desafío fresco</tspan></text><text x="768.5" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="768.5" dy="0">Con desafío fresco</tspan></text><text x="304" y="105.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Cita legítima del estado correcto</tspan></text><text x="304" y="163.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Cita de la cadena alterada</tspan></text><text x="304" y="213" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">Cita vieja de un estado bueno,</tspan></text><text x="304" y="230" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="304" dy="0">reproducida</tspan></text><rect x="315.5" y="73.5" width="300" height="55" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="465.5" y="105.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465.5" dy="0">se acepta</tspan></text><rect x="618.5" y="73.5" width="300" height="55" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="768.5" y="105.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="768.5" dy="0">se acepta</tspan></text><rect x="315.5" y="131.5" width="300" height="55" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="465.5" y="163.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="465.5" dy="0">—</tspan></text><rect x="618.5" y="131.5" width="300" height="55" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="768.5" y="163.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="768.5" dy="0">se rechaza</tspan></text><rect x="315.5" y="189.5" width="300" height="55" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="465.5" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465.5" dy="0">se acepta</tspan></text><rect x="618.5" y="189.5" width="300" height="55" rx="4" fill="#dff1ee" stroke="#ffffff" stroke-width="1"/><text x="768.5" y="221.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="768.5" dy="0">se rechaza</tspan></text><text x="314" y="272" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="314" dy="0">se rechaza</tspan></text><rect x="397.4" y="260" width="30.5" height="14" fill="#dff1ee"/><rect x="427.4" y="260" width="30.5" height="14" fill="#c0e1e0"/><rect x="457.4" y="260" width="30.5" height="14" fill="#a2d0d2"/><rect x="487.4" y="260" width="30.5" height="14" fill="#83c0c4"/><rect x="517.4" y="260" width="30.5" height="14" fill="#64b0b6"/><rect x="547.4" y="260" width="30.5" height="14" fill="#45a0a8"/><rect x="577.4" y="260" width="30.5" height="14" fill="#278f9a"/><rect x="607.4" y="260" width="30.5" height="14" fill="#087f8c"/><text x="645.4" y="272" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="645.4" dy="0">se acepta</tspan></text><text x="721.26" y="272" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="721.26" dy="0">más oscuro = mayor (se acepta)</tspan></text><rect x="10" y="288" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="312.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Solo la fila de la cita reproducida cambia con la columna: sin desafío, una cita vieja de un estado bueno se acepta aunque</tspan></text><text x="470" y="329.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el nodo ya esté alterado. La cita de la cadena alterada solo se probó con desafío fresco (la celda vacía no se midió). Es</tspan></text><text x="470" y="346.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una simulación con HMAC y una clave generada al azar, no hardware.</tspan></text><text x="470" y="393.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lógica de medición y cita con SHA-256 y HMAC de la biblioteca estándar: no se ejecutó ningún entorno de ejecución confiable ni TPM.</tspan></text></svg>
