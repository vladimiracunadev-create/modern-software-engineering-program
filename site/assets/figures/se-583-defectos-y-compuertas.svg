<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 338" width="940" height="338" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué atrapan las compuertas de un menú completo frente a las pruebas solas sobre 11 cambios defectuosos</title><desc id="d">Barras apiladas horizontales con los 11 cambios defectuosos: el menú completo de compuertas atrapa 9 y deja pasar 2, un error que ninguna prueba ejerce y una prueba que replica el error; las pruebas solas atrapan 2, el error de sintaxis y el error de lógica que una prueba ve, y dejan pasar 9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="338" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué atrapan las compuertas de un menú completo frente a las pruebas solas sobre 11 cambios defectuosos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Atrapados</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Se escapan</tspan></text><line x1="224" y1="77" x2="224" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="157" x2="224" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="354.34" y1="77" x2="354.34" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="354.34" y1="157" x2="354.34" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="354.34" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354.34" dy="0">2,5</tspan></text><line x1="484.68" y1="77" x2="484.68" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="484.68" y1="157" x2="484.68" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="484.68" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.68" dy="0">5</tspan></text><line x1="615.02" y1="77" x2="615.02" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="615.02" y1="157" x2="615.02" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="615.02" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615.02" dy="0">7,5</tspan></text><line x1="745.36" y1="77" x2="745.36" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="745.36" y1="157" x2="745.36" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="745.36" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="745.36" dy="0">10</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">12,5</tspan></text><line x1="224" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Menú completo de compuertas</tspan></text><text x="214" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="214" dy="0">Solo las pruebas</tspan></text><rect x="224" y="84" width="469.224" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="458.612" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="458.612" dy="0">9</tspan></text><rect x="693.224" y="84" width="104.272" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="745.36" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="745.36" dy="0">2</tspan></text><text x="804.496" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="804.496" dy="0">11</tspan></text><rect x="224" y="124" width="104.272" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="276.136" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="276.136" dy="0">2</tspan></text><rect x="328.272" y="124" width="469.224" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="562.884" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="562.884" dy="0">9</tspan></text><text x="804.496" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="804.496" dy="0">11</tspan></text><text x="549.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="549.85" dy="0">Cambios defectuosos de 11</tspan></text><rect x="10" y="215" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Las compuertas especializadas atrapan la importación sin usar, el secreto literal, la prueba debilitada y la prueba</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">omitida; el error de sintaxis lo atrapan tres compuertas. Los 2 restantes (un error que ninguna prueba ejerce y una prueba</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">que replica el error) no los atrapa ninguna compuerta: son el límite del gate.</tspan></text><text x="470" y="320.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
