do llega más lejos con la misma pendiente exponencial.</tspan></text><text x="470" y="533.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación clásica con NumPy: no hubo acceso a ningún ordenador cuántico ni se ejecutó ningún SDK de proveedor.</tspan></text></svg>
