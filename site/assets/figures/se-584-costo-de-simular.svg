<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tiempo de aplicar la puerta H a todos los qubits en un simulador de vector de estado, según el número de qubits</title><desc id="d">Líneas en escala logarítmica con el tiempo de aplicar la puerta H a todos los qubits de un simulador de vector de estado: 1,1 milisegundos con 10 qubits, 11 con 14, 294 con 18, 862 con 20, 4712 con 22 y 14309 con 24; la memoria del vector pasa de 0,02 a 256 MiB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tiempo de aplicar la puerta H a todos los qubits en un simulador de vector de estado, según el número de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">qubits</tspan></text><line x1="101.24" y1="368" x2="910" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="368" x2="101.24" y2="368" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="372.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1</tspan></text><line x1="101.24" y1="295.5" x2="910" y2="295.5" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="295.5" x2="101.24" y2="295.5" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="300" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="223" x