<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 498" width="940" height="498" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Métricas calculadas desde las trazas de cuatro configuraciones del harness mínimo</title><desc id="d">Barras agrupadas con los pasos totales y las denegaciones de las trazas de cuatro configuraciones sobre seis tareas: el harness completo usa 30 pasos y ninguna denegación y resuelve 6 de 6; sin contexto usa 72 pasos y resuelve 0; con la escritura denegada usa 36 pasos con 12 denegaciones y resuelve 0; sin criterio de parada usa 72 pasos y resuelve 6 de 6 con 12,0 pasos por tarea.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="498" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Métricas calculadas desde las trazas de cuatro configuraciones del harness mínimo</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pasos totales</tspan></text><rect x="162.02" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="182.02" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="182.02" dy="0">Denegaciones</tspan></text><line x1="314" y1="77" x2="314" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="314" y1="333" x2="314" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="314" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="314" dy="0">0</tspan></text><line x1="460.47" y1="77" x2="460.47" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="460.47" y1="333" x2="460.47" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="460.47" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="460.47" dy="0">20</tspan></text><line x1="606.94" y1="77" x2="606.94" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="606.94" y1="333" x2="606.94" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="606.94" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="606.94" dy="0">40</tspan></text><line x1="753.41" y1="77" x2="753.41" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="753.41" y1="333" x2="753.41" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="753.41" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="753.41" dy="0">60</tspan></text><line x1="899.88" y1="77" x2="899.88" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="333" x2="899.88" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">80</tspan></text><line x1="314" y1="333" x2="899.88" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="304" y="105" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Completo (6 de 6 resueltas, 5,0 pasos</tspan></text><text x="304" y="122" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">por tarea)</tspan></text><text x="304" y="177.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Sin contexto (0 de 6)</tspan></text><text x="304" y="241.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Escritura denegada (0 de 6)</tspan></text><text x="304" y="297" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">Sin criterio de parada (6 de 6, 12,0</tspan></text><text x="304" y="314" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="304" dy="0">pasos por tarea)</tspan></text><rect x="314" y="83" width="219.705" height="24.5" rx="3" fill="#102a43"/><text x="540.705" y="99.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="540.705" dy="0">30</tspan></text><rect x="314" y="110.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="323" y="127.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><rect x="314" y="147" width="527.292" height="24.5" rx="3" fill="#102a43"/><text x="848.292" y="163.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="848.292" dy="0">72</tspan></text><rect x="314" y="174.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="323" y="191.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><rect x="314" y="211" width="263.646" height="24.5" rx="3" fill="#102a43"/><text x="584.646" y="227.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="584.646" dy="0">36</tspan></text><rect x="314" y="238.5" width="87.882" height="24.5" rx="3" fill="#c0432f"/><text x="408.882" y="255.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="408.882" dy="0">12</tspan></text><rect x="314" y="275" width="527.292" height="24.5" rx="3" fill="#102a43"/><text x="848.292" y="291.75" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="848.292" dy="0">72</tspan></text><rect x="314" y="302.5" width="2" height="24.5" rx="3" fill="#c0432f"/><text x="323" y="319.25" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="323" dy="0">0</tspan></text><text x="606.94" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="606.94" dy="0">Pasos o denegaciones</tspan></text><rect x="10" y="391" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las dos configuraciones que gastan 72 pasos fallan por razones opuestas: una no resuelve nada y la otra lo resuelve todo</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sin parar. Solo la combinación de pasos, denegaciones y resultado las distingue.</tspan></text><text x="470" y="480.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Código ejecutado de verdad en Windows 11 con CPython 3.12.9; ninguna cifra viene de un modelo de lenguaje.</tspan></text></svg>
