<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 259" width="960" height="259" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Probabilidad de detectar una mejora real de 6 puntos según el número de tareas</title><desc id="d">Gráfico de barras con la probabilidad de detectar con una prueba pareada una mejora real de 6 puntos del harness: con 50 tareas 9,7 por ciento, con 200 tareas 24,5 y con 800 tareas 75,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="259" fill="#ffffff"/><text x="254" y="37" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">50 tareas</tspan></text><rect x="264" y="16" width="106.7" height="30" rx="3" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="378.7" y="37" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="378.7" dy="0">9,7 %</tspan></text><text x="254" y="83" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">200 tareas</tspan></text><rect x="264" y="62" width="269.5" height="30" rx="3" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="541.5" y="83" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="541.5" dy="0">24,5 %</tspan></text><text x="254" y="129" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="254" dy="0">800 tareas</tspan></text><rect x="264" y="108" width="834.9" height="30" rx="3" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="1106.9" y="129" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="1106.9" dy="0">75,9 %</tspan></text><rect x="10" y="156" width="940" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="180.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Con 50 tareas una mejora real de 6 puntos se detecta una vez de diez. Una conclusión «sin diferencia» con pocas tareas no dice</tspan></text><text x="480" y="197.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">que no la haya.</tspan></text><text x="480" y="245.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Simulación con semilla fija (parámetros del autor) ejecutada en Windows 11 con CPython 3.12.9; no mide ningún modelo real.</tspan></text></svg>
