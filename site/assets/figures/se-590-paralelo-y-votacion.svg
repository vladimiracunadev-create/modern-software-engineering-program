<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 638" width="940" height="638" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Paralelización con hilos reales y votación con y sin errores correlacionados</title><desc id="d">Cinco medidas como tarjetas: ocho subtareas de 50 milisegundos tardan 402 milisegundos en secuencia, 54 con ocho hilos y 203 con dos hilos; una votación de cinco muestras con acierto de 0,80 llega al 94,0 por ciento si los errores son independientes y al 87,4 por ciento si en la mitad de las ejecuciones las cinco comparten el mismo sesgo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="638" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Paralelización con hilos reales y votación con y sin errores correlacionados</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Ocho subtareas de 50 ms, secuencial</tspan></text><polyline points="402,97.32 438,97.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="77" width="478" height="40.64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="100.96" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">402 ms</tspan></text><text x="24" y="134.64" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">La suma de las esperas.</tspan></text><rect x="20" y="156.28" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="180.24" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Las mismas, con 8 hilos</tspan></text><polyline points="402,176.6 438,176.6" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="156.28" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="180.24" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">54 ms</tspan></text><text x="24" y="213.92" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">La espera más larga; solo vale si son independientes.</tspan></text><rect x="20" y="235.56" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="259.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Las mismas, con 2 hilos</tspan></text><polyline points="402,255.88 438,255.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="235.56" width="478" height="40.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="259.52" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">203 ms</tspan></text><text x="24" y="293.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Un límite de concurrencia reparte en cuatro tandas.</tspan></text><rect x="20" y="314.84" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="338.8" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Votación de 5 muestras, acierto 0,80,</tspan></text><text x="30" y="355.44" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">independientes</tspan></text><polyline points="402,343.48 438,343.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="314.84" width="478" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="347.12" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">94,0 % de acierto</tspan></text><text x="24" y="389.12" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El voto compra calidad si los errores no se repiten.</tspan></text><rect x="20" y="410.76" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="434.72" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Votación de 5, con la mitad de las ejecuciones</tspan></text><text x="30" y="451.36" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">sesgadas</tspan></text><polyline points="402,439.4 438,439.4" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="410.76" width="478" height="57.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="443.04" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">87,4 % de acierto</tspan></text><text x="24" y="485.04" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Los errores correlacionados reducen el beneficio del voto.</tspan></text><rect x="10" y="508.68" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="533.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cómo leer la figura: los tiempos son del reloj real y varían entre equipos; los porcentajes son simulaciones con semilla.</tspan></text><text x="470" y="550.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: las esperas son de sueño, no de red, y la correlación del 50 % es un supuesto, no una medida de ningún</tspan></text><text x="470" y="566.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">modelo.</tspan></text><text x="470" y="610.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Hilos de CPython y simulación con semilla; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
