<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 606" width="940" height="606" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Evaluador-optimizador sobre un aviso con cuatro restricciones: verificador programático frente a juez ruidoso</title><desc id="d">Líneas con el porcentaje de avisos que pasa el verificador según las iteraciones de revisión: sin revisión pasa el 35,5 por ciento con evaluador programático y el 36,3 con juez ruidoso; con tres iteraciones el programático llega al 97,9 por ciento con 1,92 generaciones y el juez ruidoso se estanca en el 75,1 por ciento con 2,50 generaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="606" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Evaluador-optimizador sobre un aviso con cuatro restricciones: verificador programático frente a juez</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">ruidoso</tspan></text><circle cx="22" cy="70" r="6" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Evaluador programático</tspan></text><rect x="229.88" y="64" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="249.88" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">Juez ruidoso</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="406" x2="78.62" y2="406" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="410.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="346" x2="910" y2="346" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="346" x2="78.62" y2="346" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="350.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="286" x2="910" y2="286" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="286" x2="78.62" y2="286" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="290.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="226" x2="910" y2="226" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="226" x2="78.62" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="230.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="166" x2="910" y2="166" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="166" x2="78.62" y2="166" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="170.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="106" x2="910" y2="106" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="106" x2="78.62" y2="106" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="106" x2="78.62" y2="406" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="106" x2="96.62" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="406" x2="96.62" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">0</tspan></text><line x1="361.747" y1="106" x2="361.747" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="361.747" y1="406" x2="361.747" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="361.747" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="361.747" dy="0">1</tspan></text><line x1="626.873" y1="106" x2="626.873" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="626.873" y1="406" x2="626.873" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="626.873" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="626.873" dy="0">2</tspan></text><line x1="892" y1="106" x2="892" y2="406" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="406" x2="892" y2="411" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="427" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">3</tspan></text><line x1="78.62" y1="406" x2="910" y2="406" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 256)">Avisos que pasan el verificador (%)</text><text x="494.31" y="452" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Iteraciones de revisión</tspan></text><polyline points="96.62,299.5 361.747,174.1 626.873,127.6 892,112.3" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="96.62" cy="299.5" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="96.62" y="288.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">35,5</tspan></text><circle cx="361.747" cy="174.1" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="361.747" y="163.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="361.747" dy="0">77,3</tspan></text><circle cx="626.873" cy="127.6" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="626.873" y="116.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="626.873" dy="0">92,8</tspan></text><circle cx="892" cy="112.3" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="101.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">97,9</tspan></text><polyline points="96.62,297.1 361.747,238.3 626.873,192.7 892,180.7" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="91.12" y="291.6" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="96.62" y="321.1" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="96.62" dy="0">36,3</tspan></text><rect x="356.247" y="232.8" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="361.747" y="262.3" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="361.747" dy="0">55,9</tspan></text><rect x="621.373" y="187.2" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="626.873" y="216.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="626.873" dy="0">71,1</tspan></text><rect x="886.5" y="175.2" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="204.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">75,1</tspan></text><rect x="10" y="466" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Generaciones medias por aviso con 0, 1, 2 y 3 iteraciones: 1,00, 1,64, 1,86 y 1,92 con el programático; 1,00, 1,74, 2,18 y</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2,50 con el juez ruidoso. Cómo leer la figura: un evaluador que ve exactamente las fallas converge en tres vueltas; uno que</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se equivoca en el 30 % de las fallas y acusa falsas en el 15 % se estanca. Dónde deja de valer: cuatro restricciones,</tspan></text><text x="470" y="540.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">generador sintético que corrige lo señalado con probabilidad 0,80; un juez real puede ser mejor o peor.</tspan></text><text x="470" y="588.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Experimento propio con la biblioteca estándar; el modelo es sintético con semilla fija y no se invocó ningún modelo de lenguaje.</tspan></text></svg>
