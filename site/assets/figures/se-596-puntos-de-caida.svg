<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Envíos reales de un aviso que debe salir una sola vez, según la estrategia y el punto de la caída</title><desc id="d">Mapa de calor con los envíos reales de un aviso que debe salir una sola vez: reiniciar desde el principio sin diario envía 1, 1, 2 y 2 según no haya caída, caída antes del efecto, tras el efecto antes del diario o tras el diario; el diario de pasos sin clave envía 1, 1, 2 y 1; con clave de idempotencia envía una sola vez en los cuatro casos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Envíos reales de un aviso que debe salir una sola vez, según la estrategia y el punto de la caída</tspan></text><text x="407.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.25" dy="0">Sin caída</tspan></text><text x="553.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.75" dy="0">Antes del efecto</tspan></text><text x="700.25" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.25" dy="0">Tras el efecto,</tspan></text><text x="700.25" y="77" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.25" dy="0">antes del diario</tspan></text><text x="846.75" y="60" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="846.75" dy="0">Tras el diario</tspan></text><text x="324" y="115.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">Reiniciar desde el principio, sin diario</tspan></text><text x="324" y="159.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">Diario de pasos, sin clave de idempotencia</tspan></text><text x="324" y="203.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="324" dy="0">Diario de pasos con clave de idempotencia</tspan></text><rect x="335.5" y="90.5" width="143.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="407.25" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.25" dy="0">1</tspan></text><rect x="482" y="90.5" width="143.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="553.75" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.75" dy="0">1</tspan></text><rect x="628.5" y="90.5" width="143.5" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="700.25" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="700.25" dy="0">2</tspan></text><rect x="775" y="90.5" width="143.5" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="846.75" y="115.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="846.75" dy="0">2</tspan></text><rect x="335.5" y="134.5" width="143.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="407.25" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.25" dy="0">1</tspan></text><rect x="482" y="134.5" width="143.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="553.75" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.75" dy="0">1</tspan></text><rect x="628.5" y="134.5" width="143.5" height="41" rx="4" fill="#c0432f" stroke="#102a43" stroke-width="3"/><text x="700.25" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="700.25" dy="0">2</tspan></text><rect x="775" y="134.5" width="143.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="846.75" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="846.75" dy="0">1</tspan></text><rect x="335.5" y="178.5" width="143.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="407.25" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="407.25" dy="0">1</tspan></text><rect x="482" y="178.5" width="143.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="553.75" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="553.75" dy="0">1</tspan></text><rect x="628.5" y="178.5" width="143.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="700.25" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="700.25" dy="0">1</tspan></text><rect x="775" y="178.5" width="143.5" height="41" rx="4" fill="#fbe4de" stroke="#ffffff" stroke-width="1"/><text x="846.75" y="203.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="846.75" dy="0">1</tspan></text><text x="334" y="247" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="334" dy="0">1</tspan></text><rect x="349.54" y="235" width="30.5" height="14" fill="#fbe4de"/><rect x="379.54" y="235" width="30.5" height="14" fill="#f3cdc5"/><rect x="409.54" y="235" width="30.5" height="14" fill="#eab6ac"/><rect x="439.54" y="235" width="30.5" height="14" fill="#e29f93"/><rect x="469.54" y="235" width="30.5" height="14" fill="#d9887a"/><rect x="499.54" y="235" width="30.5" height="14" fill="#d17161"/><rect x="529.54" y="235" width="30.5" height="14" fill="#c85a48"/><rect x="559.54" y="235" width="30.5" height="14" fill="#c0432f"/><text x="597.54" y="247" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="597.54" dy="0">2</tspan></text><text x="613.08" y="247" font-size="13" text-anchor="start" font-weight="400" fill="#5b7280"><tspan x="613.08" dy="0">más oscuro = mayor (envíos reales (1 = correcto))</tspan></text><rect x="10" y="263" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El contorno marca los envíos duplicados: el aviso salió dos veces. Cómo leer la figura: el envío duplicado aparece cuando</tspan></text><text x="470" y="304.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">el efecto ocurrió y el diario no lo supo; la clave lo neutraliza en el servicio. Dónde deja de valer: un solo paso con</tspan></text><text x="470" y="321.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">efecto externo, SQLite en memoria y un servicio simulado que respeta la clave; un servicio real puede no hacerlo.</tspan></text><text x="470" y="368.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Procesos, diario SQLite y mensajes reales en un directorio temporal; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
