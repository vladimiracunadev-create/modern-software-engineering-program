<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 567" width="940" height="567" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mil clientes sincronizados reintentan contra un servidor caído durante 5 segundos</title><desc id="d">Barras agrupadas con los picos de solicitudes de tres políticas de reintento de mil clientes sincronizados contra un servidor caído cinco segundos: con intervalo fijo el pico por medio segundo es 1 000, también tras la recuperación; con retroceso exponencial sin aleatoriedad 1 000 y 1 000; con jitter completo 1 552 en el primer instante y 145 tras la recuperación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="567" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mil clientes sincronizados reintentan contra un servidor caído durante 5 segundos</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pico por 0,5 s</tspan></text><rect x="169.56" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Pico tras la recuperación</tspan></text><line x1="93.7" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="375" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="305" x2="93.7" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="235" x2="93.7" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="165" x2="93.7" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 500</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">solicitudes por medio segundo</text><rect x="121.243" y="235" width="108.173" height="140" rx="3" fill="#c0432f"/><text x="175.33" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="175.33" dy="0">1 000</tspan></text><rect x="233.417" y="235" width="108.173" height="140" rx="3" fill="#087f8c"/><text x="287.503" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="287.503" dy="0">1 000</tspan></text><text x="231.417" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Intervalo fijo de 1 s (6 000</tspan></text><text x="231.417" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">solicitudes)</tspan></text><rect x="396.677" y="235" width="108.173" height="140" rx="3" fill="#c0432f"/><text x="450.763" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="450.763" dy="0">1 000</tspan></text><rect x="508.85" y="235" width="108.173" height="140" rx="3" fill="#087f8c"/><text x="562.937" y="229" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="562.937" dy="0">1 000</tspan></text><text x="506.85" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Retroceso exponencial sin</tspan></text><text x="506.85" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">aleatoriedad (4 000)</tspan></text><rect x="672.11" y="157.72" width="108.173" height="217.28" rx="3" fill="#c0432f"/><text x="726.197" y="151.72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="726.197" dy="0">1 552</tspan></text><rect x="784.283" y="354.7" width="108.173" height="20.3" rx="3" fill="#087f8c"/><text x="838.37" y="348.7" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.37" dy="0">145</tspan></text><text x="782.283" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Retroceso exponencial con jitter</tspan></text><text x="782.283" y="413" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">completo (5 061)</tspan></text><rect x="10" y="444" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="468.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Entre paréntesis, las solicitudes totales. Cómo leer la figura: el retroceso exponencial reduce el volumen pero conserva la</tspan></text><text x="470" y="485.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sincronía; solo la aleatoriedad reparte la carga de recuperación. Dónde deja de valer: clientes sincronizados desde el</tspan></text><text x="470" y="502.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">instante cero, sin límite de reintentos ni cola en el servidor.</tspan></text><text x="470" y="549.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Simulación propia con semilla fija; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
