<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 701" width="940" height="701" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Selector de patrón agéntico: seis de las ocho tareas con la decisión que toma el código</title><desc id="d">Seis situaciones y el patrón que elige el selector como tarjetas: pasos conocidos sin herramientas una llamada; con herramientas un workflow encadenado; con partes independientes un workflow paralelo; camino impredecible con presupuesto y tiempo amplios un agente; camino impredecible con poco presupuesto enrutamiento a un workflow; y acción irreversible sin aprobación una persona decide.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="701" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Selector de patrón agéntico: seis de las ocho tareas con la decisión que toma el código</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Pasos conocidos, sin herramientas</tspan></text><polyline points="402,97.32 438,97.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="77" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="100.96" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Una llamada</tspan></text><text x="24" y="134.64" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El patrón más simple que alcanza.</tspan></text><rect x="20" y="156.28" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="180.24" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Pasos conocidos con herramientas</tspan></text><polyline points="402,176.6 438,176.6" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="156.28" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="180.24" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Workflow encadenado</tspan></text><text x="24" y="213.92" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El código decide el orden.</tspan></text><rect x="20" y="235.56" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="259.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Pasos conocidos y partes independientes</tspan></text><polyline points="402,255.88 438,255.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="235.56" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="259.52" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Workflow paralelo</tspan></text><text x="24" y="293.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Las partes no se esperan.</tspan></text><rect x="20" y="314.84" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="338.8" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Camino impredecible, herramientas, presupuesto y</tspan></text><text x="30" y="355.44" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">tiempo amplios</tspan></text><polyline points="402,343.48 438,343.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="314.84" width="478" height="57.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="347.12" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">Agente</tspan></text><text x="24" y="389.12" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El modelo decide el siguiente paso.</tspan></text><rect x="20" y="410.76" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="434.72" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Camino impredecible, pero poco presupuesto</tspan></text><polyline points="402,431.08 438,431.08" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="410.76" width="478" height="40.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="434.72" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">Enrutamiento a workflow</tspan></text><text x="24" y="468.4" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Se limita la autonomía al presupuesto.</tspan></text><rect x="20" y="490.04" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="514" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Acción irreversible sin aprobación</tspan></text><polyline points="402,510.36 438,510.36" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="490.04" width="478" height="40.64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="514" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">Persona decide</tspan></text><text x="24" y="547.68" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Ningún patrón automático sustituye la aprobación.</tspan></text><rect x="10" y="571.32" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="596.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cómo leer la figura: el selector coincide con la decisión escrita a mano en 8 de 8 tareas, dos de ellas no mostradas; la</tspan></text><text x="470" y="612.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">coincidencia prueba que la regla es consistente, no que sea correcta. Dónde deja de valer: las ocho tareas las escribió el</tspan></text><text x="470" y="629.56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autor al mismo tiempo que la regla.</tspan></text><text x="470" y="673.24" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Selector propio en Python; no se invocó ningún modelo de lenguaje.</tspan></text></svg>
