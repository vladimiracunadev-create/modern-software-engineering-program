<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" width="960" height="385" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los diez eslabones de un sistema de ML y el eslabón donde entra cada falla medida</title><desc id="d">Diagrama con diez eslabones del ciclo de vida y cuatro fallas ubicadas en su eslabón: el fallo aguas arriba entra por los datos de origen, la unidad distinta por las características y el servicio, la deriva de covariables por el servicio y la deriva de concepto por las etiquetas, con el bucle de realimentación como retorno del servicio a los datos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="385" fill="#ffffff"/><rect x="10" y="14" width="168.8" height="104" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="94.4" y="53" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="94.4" dy="0">Datos de origen</tspan></text><text x="94.4" y="69.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="94.4" dy="0">Entra: historial en</tspan></text><text x="94.4" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="94.4" dy="0">cero</tspan></text><rect x="202.8" y="14" width="168.8" height="104" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="287.2" y="53" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287.2" dy="0">Etiquetas</tspan></text><text x="287.2" y="69.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287.2" dy="0">Entra: deriva de</tspan></text><text x="287.2" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287.2" dy="0">concepto</tspan></text><polyline points="178.8,66 202.8,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="395.6" y="14" width="168.8" height="104" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="53" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Características</tspan></text><text x="480" y="69.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Entra: unidad</tspan></text><text x="480" y="86.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">distinta</tspan></text><polyline points="371.6,66 395.6,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="588.4" y="14" width="168.8" height="104" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="672.8" y="69.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="672.8" dy="0">Entrenamiento</tspan></text><polyline points="564.4,66 588.4,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="781.2" y="14" width="168.8" height="104" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="865.6" y="69.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="865.6" dy="0">Evaluación</tspan></text><polyline points="757.2,66 781.2,66" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="158" width="168.8" height="104" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="94.4" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="94.4" dy="0">Registro del modelo</tspan></text><rect x="202.8" y="158" width="168.8" height="104" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="287.2" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="287.2" dy="0">Despliegue</tspan></text><polyline points="178.8,210 202.8,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="395.6" y="158" width="168.8" height="104" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Servicio</tspan></text><text x="480" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Entra: deriva de</tspan></text><text x="480" y="230.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">covariables</tspan></text><polyline points="371.6,210 395.6,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="588.4" y="158" width="168.8" height="104" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="672.8" y="197" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="672.8" dy="0">Monitoreo</tspan></text><text x="672.8" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="672.8" dy="0">Ve: tasa de</tspan></text><text x="672.8" y="230.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="672.8" dy="0">marcados, PSI, AUC</tspan></text><polyline points="564.4,210 588.4,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="781.2" y="158" width="168.8" height="104" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="865.6" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="865.6" dy="0">Reentrenamiento</tspan></text><polyline points="757.2,210 781.2,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="865.6,118 865.6,138 94.4,138 94.4,158" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="276" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="300.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">El servicio devuelve decisiones a los datos de origen: ese retorno es el bucle de realimentación y convierte un fallo de un</tspan></text><text x="480" y="317.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">eslabón en un fallo de los demás. Cada falla necesita una señal distinta: rango para la unidad, distribución para la</tspan></text><text x="480" y="334.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">covariable, etiquetas para el concepto.</tspan></text><text x="480" y="375.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
