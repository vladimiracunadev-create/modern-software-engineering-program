"283.63" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="176.158" dy="0">25,3</tspan></text><circle cx="414.772" cy="366.84" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="414.772" y="355.84" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="414.772" dy="0">0,4</tspan></text><circle cx="892" cy="368" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="357" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">0,0</tspan></text><rect x="10" y="428" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="452.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El AUC limpio no se movió (0,847 a 0,848) en ningún punto: una evaluación con datos limpios no ve la puerta trasera. Con</tspan></text><text x="470" y="469.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">600 filas, el 2 %, el disparador anula la detección. La copia del modelo, aparte: el acuerdo del sustituto fue 95,1 % con</tspan></text><text x="470" y="486.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">100 consultas.</tspan></text><text x="470" y="533.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
