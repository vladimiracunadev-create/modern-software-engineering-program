<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Puerta trasera: estudiantes que llegarán tarde y que el modelo marca ante el disparador, según las filas envenenadas</title><desc id="d">Línea con la fracción de estudiantes que van a llegar tarde y que el modelo marca ante el disparador según el porcentaje de filas de entrenamiento envenenadas: 93,5 por ciento sin envenenar, 81,0 con 0,1, 25,3 con 0,5, 0,4 con 2 y 0,0 con 5.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Puerta trasera: estudiantes que llegarán tarde y que el modelo marca ante el disparador, según las filas</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">envenenadas</tspan></text><line x1="78.62" y1="368" x2="910" y2="368" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="368" x2="78.62" y2="368" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="372.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="310" x2="910" y2="310" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="310" x2="78.62" y2="310" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="314.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="252" x2="910" y2="252" strok