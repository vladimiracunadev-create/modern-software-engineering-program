<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Decisiones tomadas con la unidad errónea hasta mitigar, según el monitor que alerta primero</title><desc id="d">Barras horizontales con las decisiones expuestas en la falla de unidad hasta mitigar, con 3 horas de decisión y conmutación tras la primera alerta: 1200 con la validación de entrada, 2800 con el PSI de entradas, 5600 con el PSI del puntaje y 21600 con el AUC con etiquetas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Decisiones tomadas con la unidad errónea hasta mitigar, según el monitor que alerta primero</tspan></text><line x1="254" y1="49" x2="254" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="201" x2="254" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="376.728" y1="49" x2="376.728" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="376.728" y1="201" x2="376.728" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="376.728" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="376.728" dy="0">5 000</tspan></text><line x1="499.456" y1="49" x2="499.456" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="499.456" y1="201" x2="499.456" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="499.456" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.456" dy="0">10 000</tspan></text><line x1="622.184" y1="49" x2="622.184" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="622.184" y1="201" x2="622.184" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="622.184" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="622.184" dy="0">15 000</tspan></text><line x1="744.912" y1="49" x2="744.912" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="744.912" y1="201" x2="744.912" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="744.912" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="744.912" dy="0">20 000</tspan></text><line x1="867.64" y1="49" x2="867.64" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="867.64" y1="201" x2="867.64" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="867.64" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="867.64" dy="0">25 000</tspan></text><line x1="254" y1="201" x2="867.64" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Validación de entrada (0 h)</tspan></text><text x="244" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">PSI de entradas (4 h)</tspan></text><text x="244" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">PSI del puntaje (11 h)</tspan></text><text x="244" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">AUC con etiquetas (51 h)</tspan></text><rect x="254" y="55" width="29.4547" height="26" rx="3" fill="#c0432f"/><text x="290.455" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="290.455" dy="0">1 200</tspan></text><rect x="254" y="93" width="68.7277" height="26" rx="3" fill="#c0432f"/><text x="329.728" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="329.728" dy="0">2 800</tspan></text><rect x="254" y="131" width="137.455" height="26" rx="3" fill="#c0432f"/><text x="398.455" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="398.455" dy="0">5 600</tspan></text><rect x="254" y="169" width="530.185" height="26" rx="3" fill="#c0432f"/><text x="791.185" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="791.185" dy="0">21 600</tspan></text><text x="560.82" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="560.82" dy="0">Decisiones expuestas</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con 400 decisiones por hora y 3 horas para decidir y conmutar, el AUC con etiquetas expone dieciocho veces más decisiones</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que la validación de entrada. El monitor más barato es el que más decisiones ahorra aquí; el más lento es el único que ve</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la deriva de concepto.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo sintético con parámetros del autor y semilla fija 46; muestra un mecanismo, no mide un sistema real.</tspan></text></svg>
