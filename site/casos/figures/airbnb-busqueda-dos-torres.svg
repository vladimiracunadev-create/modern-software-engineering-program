<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 515" width="940" height="515" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arquitectura de dos torres: un vector «ideal» por búsqueda y uno por anuncio</title><desc id="d">Diagrama de la arquitectura de dos torres del ranking de Airbnb: una torre recibe las características de la consulta y del usuario y genera un vector de 100 dimensiones que representa el anuncio ideal; otra torre recibe las características de cada anuncio; se puntúa según la cercanía; la torre de consulta se evalúa una sola vez por búsqueda, lo que reduce la latencia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="515" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Arquitectura de dos torres: un vector ideal por búsqueda y uno por anuncio</tspan></text><rect x="20" y="60" width="250" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">Consulta y usuario: destino,</tspan></text><text x="145" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">fechas, huéspedes, historial</tspan></text><rect x="20" y="170" width="250" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="145" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">Anuncios candidatos: precio,</tspan></text><text x="145" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">ubicación, comodidades, señales</tspan></text><rect x="320" y="60" width="220" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="430" y="87" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="430" dy="0">Torre de consulta</tspan></text><text x="430" y="103.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="430" dy="0">(se evalúa 1 vez por</tspan></text><text x="430" y="120.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="430" dy="0">búsqueda)</tspan></text><rect x="320" y="170" width="220" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="430" y="197" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="430" dy="0">Torre de anuncio</tspan></text><text x="430" y="213.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="430" dy="0">(se evalúa por cada</tspan></text><text x="430" y="230.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="430" dy="0">anuncio)</tspan></text><polyline points="270,100 320,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="270,210 320,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="590" y="60" width="330" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="755" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="755" dy="0">Vector de 100 dimensiones: el «anuncio</tspan></text><text x="755" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="755" dy="0">ideal» para esa consulta</tspan></text><rect x="590" y="170" width="330" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="755" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="755" dy="0">Vector del anuncio; puntaje = cercanía al</tspan></text><text x="755" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="755" dy="0">ideal</tspan></text><polyline points="540,100 590,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="540,210 590,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="270" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="302" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Entrenamiento: pares de anuncios, uno reservado y otro</tspan></text><text x="240" y="318.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">no; la pérdida mide cuánto más cerca del ideal está el</tspan></text><text x="240" y="335.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">reservado.</tspan></text><rect x="480" y="270" width="440" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="302" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Beneficio de latencia: como la torre de consulta no</tspan></text><text x="700" y="318.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">depende del anuncio, se calcula una vez y solo se evalúa</tspan></text><text x="700" y="335.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">la torre de anuncio por cada resultado.</tspan></text><rect x="10" y="376" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="398.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: dos entradas, dos torres y una comparación de vectores; el vector de consulta es el mismo para todos los anuncios</tspan></text><text x="470" y="415.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de esa búsqueda. En la prueba A/B contra una red totalmente conectada de dos capas, la reserva subió +0,6 %. Dónde deja de</tspan></text><text x="470" y="432.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: la figura abstrae el modelo; los autores se preguntaron si la red hacía lo previsto y analizaron los vectores, pero</tspan></text><text x="470" y="448.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el artículo no publica las dimensiones internas de cada torre.</tspan></text><text x="470" y="492.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Haldar y otros, arXiv:2002.05515 (F12), sección 2.6. Dibujo propio.</tspan></text></svg>
