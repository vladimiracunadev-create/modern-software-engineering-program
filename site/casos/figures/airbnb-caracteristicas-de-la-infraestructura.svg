<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Características de la infraestructura de Airbnb: lo que se sabe y lo que no</title><desc id="d">Diagrama de la infraestructura de Airbnb: arquitectura orientada a servicios en transición desde un monolito, bases fragmentadas y migración de pagos con dos sistemas en paralelo; escala de 9 millones de anuncios, 70 mil millones de dólares procesados en 2019 y más de 40 monedas; sin datos públicos de nube, regiones ni costos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Características de la infraestructura de Airbnb: lo que se sabe y lo que no</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Modelo y estructura</tspan></text><rect x="10" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: transición de un monolito Ruby a servicios con</tspan></text><text x="235" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">contrato en Thrift desde 2017 (F9); pagos rediseñados en</tspan></text><text x="235" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">2022 (F7).</tspan></text><rect x="10" y="167.8" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="188.74" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">No se sabe: nube, regiones, zonas y topología.</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Escala</tspan></text><rect x="480" y="92" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: más de 9 millones de anuncios activos y más de</tspan></text><text x="705" y="129.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">2.500 millones de llegadas acumuladas (F1); alrededor de 70</tspan></text><text x="705" y="146.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">mil millones de dólares procesados en 2019 en más de 40</tspan></text><text x="705" y="162.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">monedas (F1).</tspan></text><rect x="480" y="184.4" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="205.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: peticiones por segundo y tamaño de las bases.</tspan></text><rect x="10" y="218.4" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="239.32" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Costos</tspan></text><rect x="10" y="260.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="281.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">No se sabe: costo de infraestructura: no se publica; solo</tspan></text><text x="235" y="297.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">hay ingresos y crecimiento (F2, F10).</tspan></text><rect x="480" y="235" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="255.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Redes y entrega</tspan></text><rect x="480" y="277" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="297.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: comunicación entre servicios con TLS mutuo y</tspan></text><text x="705" y="314.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">monitoreo estándar (F9).</tspan></text><rect x="480" y="336.2" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="357.14" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: red de distribución de contenido y de imágenes.</tspan></text><rect x="10" y="386.8" width="920" height="38.6" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="409.74" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: casi todos los recuadros declaran falta de dato. Dónde deja de valer: la ausencia es de las fuentes consultadas.</tspan></text><text x="470" y="453.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1, F2, F7, F9, F10.</tspan></text></svg>
