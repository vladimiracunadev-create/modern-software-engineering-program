<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 515" width="940" height="515" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Elegir la clave de idempotencia: por solicitud o por entidad</title><desc id="d">Comparación de la idempotencia por solicitud, con una clave aleatoria y única como un UUID que permite varios pagos distintos de una misma reserva, y la idempotencia por entidad, con una clave determinista como pago-1234-reembolso que garantiza que un pago se reembolse una sola vez.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="515" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Elegir la clave de idempotencia: por solicitud o por entidad</tspan></text><rect x="20" y="55" width="440" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="80.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="240" dy="0">Por solicitud (la más común)</tspan></text><rect x="480" y="55" width="440" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="80.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="700" dy="0">Por entidad (más estricta)</tspan></text><rect x="20" y="110" width="440" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="132" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Clave aleatoria y única generada por el cliente, por</tspan></text><text x="240" y="148.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">ejemplo un UUID. Cada solicitud nueva tiene una clave</tspan></text><text x="240" y="165.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">nueva; los reintentos reutilizan la suya.</tspan></text><rect x="480" y="110" width="440" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="132" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Clave determinista derivada de la entidad, por ejemplo</tspan></text><text x="700" y="148.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">«pago-1234-reembolso». Todo reembolso de ese pago</tspan></text><text x="700" y="165.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">comparte clave.</tspan></text><rect x="20" y="195" width="440" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Permite varios pagos distintos para una misma reserva</tspan></text><text x="240" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">(por ejemplo pagar menos por adelantado y el resto</tspan></text><text x="240" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">después): basta con que las claves difieran.</tspan></text><rect x="480" y="195" width="440" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Garantiza que un pago de 10 dólares con identificador</tspan></text><text x="700" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">1234 se reembolse 5 dólares una sola vez, aunque</tspan></text><text x="700" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">técnicamente se podrían pedir dos reembolsos de 5.</tspan></text><rect x="20" y="290" width="440" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="320.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">Costo: no protege de que el cliente genere dos</tspan></text><text x="240" y="336.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">solicitudes distintas para la misma intención.</tspan></text><rect x="480" y="290" width="440" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="320.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Costo: restringe casos legítimos (dos reembolsos</tspan></text><text x="700" y="336.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">parciales) y exige un modelo de entidades bien definido.</tspan></text><rect x="10" y="376" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="398.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: dos columnas con la misma estructura (qué es, qué permite, qué cuesta). La elección depende del caso de uso de</tspan></text><text x="470" y="415.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">negocio. En ambos, el cliente debe guardar la clave antes de llamar, reutilizarla en los reintentos, no modificar la</tspan></text><text x="470" y="432.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">solicitud y configurar sus reintentos con retroceso y variación aleatoria. Dónde deja de valer: los ejemplos de claves son</tspan></text><text x="470" y="448.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los del blog; no se publica cómo se eligen en cada servicio.</tspan></text><text x="470" y="492.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Airbnb Tech Blog (F5), sección «How to choose an idempotency key?». Dibujo propio.</tspan></text></svg>
