<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A dónde fue cada dólar de ingreso de Airbnb, 2024 frente a 2025</title><desc id="d">Barras apiladas al 100 por ciento: en 2025 el costo de ingresos fue 17,0 por ciento de los ingresos, operaciones, soporte y administración 21,8, desarrollo de producto 19,2, ventas y marketing 21,1 y resultado operativo 20,8; en 2024 el resultado operativo era 23,0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A dónde fue cada dólar de ingreso de Airbnb, 2024 frente a 2025</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Costo de ingresos</tspan></text><rect x="192.18" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="212.18" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="212.18" dy="0">Operaciones, soporte y administración</tspan></text><rect x="519.16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="539.16" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="539.16" dy="0">Desarrollo de producto</tspan></text><rect x="733.04" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="753.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="753.04" dy="0">Ventas y marketing</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Resultado operativo</tspan></text><line x1="84" y1="101" x2="84" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="84" y1="181" x2="84" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="84" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="84" dy="0">0</tspan></text><line x1="281.925" y1="101" x2="281.925" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="281.925" y1="181" x2="281.925" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="281.925" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="281.925" dy="0">25</tspan></text><line x1="479.85" y1="101" x2="479.85" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="479.85" y1="181" x2="479.85" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="479.85" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479.85" dy="0">50</tspan></text><line x1="677.775" y1="101" x2="677.775" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="677.775" y1="181" x2="677.775" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="677.775" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677.775" dy="0">75</tspan></text><line x1="875.7" y1="101" x2="875.7" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="181" x2="875.7" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="84" y1="181" x2="875.7" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="74" y="125.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="74" dy="0">2024</tspan></text><text x="74" y="165.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="74" dy="0">2025</tspan></text><rect x="84" y="108" width="133.923" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="150.961" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150.961" dy="0">17 %</tspan></text><rect x="217.923" y="108" width="175.925" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="305.886" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="305.886" dy="0">22 %</tspan></text><rect x="393.848" y="108" width="146.616" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="467.157" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467.157" dy="0">19 %</tspan></text><rect x="540.465" y="108" width="153.177" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="617.053" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="617.053" dy="0">19 %</tspan></text><rect x="693.642" y="108" width="182.058" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="784.671" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="784.671" dy="0">23 %</tspan></text><text x="882.7" y="125.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="84" y="148" width="134.914" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="151.457" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="151.457" dy="0">17 %</tspan></text><rect x="218.914" y="148" width="172.62" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="305.225" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="305.225" dy="0">22 %</tspan></text><rect x="391.535" y="148" width="152.248" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="467.659" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467.659" dy="0">19 %</tspan></text><rect x="543.782" y="148" width="167.382" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="627.473" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="627.473" dy="0">21 %</tspan></text><rect x="711.164" y="148" width="164.536" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="793.432" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="793.432" dy="0">21 %</tspan></text><text x="882.7" y="165.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="479.85" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="479.85" dy="0">% del total</tspan></text><rect x="10" y="239" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el margen operativo baja de 23 % a 21 % porque ventas y marketing sube del 19 % al 21 % de los ingresos; el costo</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de ingresos sube sobre todo por tarifas de comerciante. Dónde deja de valer: son rubros consolidados; el 10-K no separa el</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">costo de infraestructura en la nube ni el de soporte de terceros.</tspan></text><text x="470" y="344.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Airbnb, formulario 10-K de 2025 (F13), leído con WebFetch.</tspan></text></svg>
