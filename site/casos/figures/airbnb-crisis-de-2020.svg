<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La crisis de mayo de 2020: de cada 7.500 empleados, casi 1.900 tuvieron que irse</title><desc id="d">Barra apilada de la plantilla de Airbnb en mayo de 2020: unos 5.600 empleados permanecen y casi 1.900, alrededor del 25 por ciento de los 7.500, salen; la empresa preveía ingresos de menos de la mitad de los de 2019 y había levantado 2 mil millones de dólares.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La crisis de mayo de 2020: de cada 7.500 empleados, casi 1.900 tuvieron que irse</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Se quedan (cálculo propio)</tspan></text><rect x="260.04" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Se van (casi 1.900)</tspan></text><line x1="174" y1="77" x2="174" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="121" x2="174" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">0</tspan></text><line x1="349.425" y1="77" x2="349.425" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="349.425" y1="121" x2="349.425" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="349.425" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="349.425" dy="0">2 000</tspan></text><line x1="524.85" y1="77" x2="524.85" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="524.85" y1="121" x2="524.85" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="524.85" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524.85" dy="0">4 000</tspan></text><line x1="700.275" y1="77" x2="700.275" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="700.275" y1="121" x2="700.275" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="700.275" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700.275" dy="0">6 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="121" x2="875.7" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">8 000</tspan></text><line x1="174" y1="121" x2="875.7" y2="121" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">Plantilla en mayo de</tspan></text><text x="164" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">2020</tspan></text><rect x="174" y="84" width="491.19" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="419.595" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="419.595" dy="0">5 600</tspan></text><rect x="665.19" y="84" width="166.654" height="30" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="748.517" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="748.517" dy="0">1 900</tspan></text><text x="838.844" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="838.844" dy="0">7 500</tspan></text><text x="524.85" y="165" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="524.85" dy="0">Empleados</tspan></text><rect x="10" y="179" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="203.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el recorte fue de un cuarto de la plantilla, mapeado a una estrategia más enfocada en el núcleo (anfitriones y</tspan></text><text x="470" y="220.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">experiencias de la comunidad) y con pausa en Transporte y Estudios y reducción en Hoteles y Lux. Dónde deja de valer: 5.600</tspan></text><text x="470" y="237.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es mi resta (7.500 − casi 1.900); la carta da cifras redondeadas («casi», «alrededor») y es la versión de la dirección.</tspan></text><text x="470" y="284.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Brian Chesky, mensaje de mayo de 2020 (F11).</tspan></text></svg>
