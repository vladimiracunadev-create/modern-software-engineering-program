<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 493" width="940" height="493" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware de Airbnb: casi nada se publica</title><desc id="d">Diagrama del hardware de Airbnb según sus fuentes: no se publica el tipo de servidores ni el proveedor de nube; las fuentes mencionan bases de datos MySQL con un nodo maestro fragmentado y réplicas, y entrenamiento de redes neuronales con miles de millones de pares; los dispositivos de usuario son la aplicación móvil y la web.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="493" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware de Airbnb: casi nada se publica</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Servidores y nube</tspan></text><rect x="10" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">No se sabe: proveedor de nube, tipo de servidor, regiones y</tspan></text><text x="235" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">si la infraestructura es propia, alquilada o híbrida:</tspan></text><text x="235" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">ninguna de las fuentes consultadas lo dice.</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Bases de datos</tspan></text><rect x="480" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: bases MySQL con un maestro fragmentado por</tspan></text><text x="705" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">clave de idempotencia y réplicas con retraso de replicación</tspan></text><text x="705" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">(F5).</tspan></text><rect x="480" y="167.8" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="188.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: cantidad de fragmentos, tamaño de datos y</tspan></text><text x="705" y="205.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">hardware de almacenamiento.</tspan></text><rect x="10" y="175.8" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="196.72" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Aprendizaje automático</tspan></text><rect x="10" y="217.8" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="238.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: entrenamiento con 1.700 millones de pares en</tspan></text><text x="235" y="255.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">2018 (F8).</tspan></text><rect x="10" y="277" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="297.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">No se sabe: aceleradores, GPU u otro hardware de</tspan></text><text x="235" y="314.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">entrenamiento y de servido.</tspan></text><rect x="480" y="235" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="255.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Dispositivos de usuario</tspan></text><rect x="480" y="277" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="297.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: aplicación móvil e Instant Book desde</tspan></text><text x="705" y="314.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">noviembre de 2010 (F1), y web.</tspan></text><rect x="480" y="336.2" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="357.14" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: plataformas y versiones soportadas.</tspan></text><rect x="10" y="386.8" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="409.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el caso casi no tiene datos de hardware público y lo declara. Dónde deja de valer: este vacío no implica que no</tspan></text><text x="470" y="426.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">exista; solo que las fuentes consultadas no lo detallan.</tspan></text><text x="470" y="470" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1, F5, F8.</tspan></text></svg>
