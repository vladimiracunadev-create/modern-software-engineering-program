<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 443" width="940" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Airbnb: confianza y pagos, producto y empresa</title><desc id="d">Línea de tiempo de 2007 a 2026 con tres carriles: confianza y pagos (pagos propios en 2008, garantía en 2012, City Portal y Project Lighthouse en 2020, AirCover en 2021 y 2022), producto (alojamiento, experiencias, servicios) y empresa (privada, cotizada); marcadores de lanzamiento, pagos, garantía, crisis y salida a bolsa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="443" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Airbnb: confianza y pagos, producto y empresa</tspan></text><line x1="174" y1="83" x2="174" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="245" x2="174" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">2 007</tspan></text><line x1="290.526" y1="83" x2="290.526" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="290.526" y1="245" x2="290.526" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="290.526" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="290.526" dy="0">2 010</tspan></text><line x1="407.053" y1="83" x2="407.053" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="407.053" y1="245" x2="407.053" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="407.053" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407.053" dy="0">2 013</tspan></text><line x1="523.579" y1="83" x2="523.579" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="523.579" y1="245" x2="523.579" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="523.579" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="523.579" dy="0">2 016</tspan></text><line x1="640.105" y1="83" x2="640.105" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="640.105" y1="245" x2="640.105" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="640.105" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="640.105" dy="0">2 019</tspan></text><line x1="756.632" y1="83" x2="756.632" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="756.632" y1="245" x2="756.632" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="756.632" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="756.632" dy="0">2 022</tspan></text><line x1="912" y1="83" x2="912" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="245" x2="912" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2 026</tspan></text><line x1="174" y1="245" x2="912" y2="245" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="114.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">Confianza y pagos</tspan></text><text x="164" y="168.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">Producto</tspan></text><text x="164" y="222.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">Empresa</tspan></text><line x1="220.611" y1="75" x2="220.611" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="220.611" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="220.611" dy="0">SXSW</tspan></text><line x1="383.747" y1="75" x2="383.747" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="383.747" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="383.747" dy="0">Garantía</tspan></text><line x1="694.484" y1="75" x2="694.484" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="694.484" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="694.484" dy="0">Crisis</tspan></text><line x1="713.905" y1="75" x2="713.905" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="744.814" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="744.814" dy="0">Bolsa</tspan></text><rect x="236.147" y="92" width="147.6" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="309.947" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="309.947" dy="0">Pagos propios</tspan></text><rect x="383.747" y="92" width="310.737" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="539.116" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="539.116" dy="0">Garantía y confianza</tspan></text><rect x="694.484" y="92" width="217.516" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="803.242" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="803.242" dy="0">AirCover y City Portal</tspan></text><line x1="14" y1="137" x2="912" y2="137" stroke="#d5dde1" stroke-width="1"/><rect x="220.611" y="146" width="334.042" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="387.632" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="387.632" dy="0">Alojamiento</tspan></text><rect x="554.653" y="146" width="330.158" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="719.732" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="719.732" dy="0">Experiencias</tspan></text><rect x="884.811" y="146" width="27.1895" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="191" x2="912" y2="191" stroke="#d5dde1" stroke-width="1"/><rect x="205.074" y="200" width="508.832" height="36" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="459.489" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="459.489" dy="0">Empresa privada</tspan></text><rect x="713.905" y="200" width="198.095" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="812.953" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="812.953" dy="0">Empresa cotizada</tspan></text><text x="543" y="289" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="543" dy="0">Año</tspan></text><rect x="10" y="303" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="327.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en la historia de Airbnb (F1): lanzamiento en el SXSW de marzo de 2008, plataforma de pagos en agosto de 2008,</tspan></text><text x="470" y="344.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Garantía de 1 millón en mayo de 2012, Experiencias en noviembre de 2016, mayo de 2020 reducción de plantilla (F11), City</tspan></text><text x="470" y="361.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Portal en septiembre de 2020, bolsa en diciembre de 2020, AirCover para anfitriones en 2021 y para huéspedes en 2022,</tspan></text><text x="470" y="377.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Servicios y Experiencias renovadas en 2025. Las eras son síntesis del autor.</tspan></text><text x="470" y="425.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1, F11; síntesis propia de las eras.</tspan></text></svg>
