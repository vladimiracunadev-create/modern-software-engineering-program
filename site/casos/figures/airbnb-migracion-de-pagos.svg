<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 575" width="940" height="575" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La migración de los pagos: cuatro fases, dos sistemas en paralelo y una capa de traducción</title><desc id="d">Diagrama de la migración de la orquestación de pagos de Airbnb en cuatro fases (precios, pagos a anfitriones, reservas y migración de datos), con reservas de estancias divididas en más de 30 hitos, dos sistemas en paralelo durante casi todo el proceso, una capa de traducción para los consumidores de datos y trabajos de comparación entre el modelo nuevo y el antiguo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="575" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La migración de los pagos: cuatro fases, dos sistemas en paralelo y traducción</tspan></text><rect x="20" y="60" width="210" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="125" y="93.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="125" dy="0">1. Precios</tspan></text><text x="125" y="109.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="125" dy="0">(modelo genérico)</tspan></text><rect x="245" y="60" width="210" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="350" y="93.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="350" dy="0">2. Pagos a</tspan></text><text x="350" y="109.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="350" dy="0">anfitriones</tspan></text><rect x="470" y="60" width="210" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="575" y="93.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="575" dy="0">3. Reservas</tspan></text><text x="575" y="109.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="575" dy="0">(estancias, experiencias)</tspan></text><rect x="695" y="60" width="210" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="800" y="93.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800" dy="0">4. Migración</tspan></text><text x="800" y="109.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="800" dy="0">de datos</tspan></text><polyline points="230,98 245,98" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="455,98 470,98" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="680,98 695,98" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="155" width="900" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="178.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Durante casi todo el proceso hubo dos sistemas de orquestación: las reservas nuevas elegibles iban a SOA y el resto</tspan></text><text x="470" y="194.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">seguía en el monolito; solo al final se pasaron las reservas activas.</tspan></text><rect x="20" y="226" width="440" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="249.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Capa de traducción: devuelve a los consumidores un modelo</tspan></text><text x="240" y="266.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">de datos unificado, de modo que no sepan de qué sistema</tspan></text><text x="240" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">vienen; desacopló a quienes migraban de quienes consumían</tspan></text><text x="240" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">datos.</tspan></text><rect x="480" y="226" width="440" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="249.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">Validación: control de calidad manual de cientos de</tspan></text><text x="700" y="266.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">escenarios, pruebas unitarias, de integración y de</tspan></text><text x="700" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">extremo a extremo, y trabajos asíncronos que comparan los</tspan></text><text x="700" y="299.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">datos de ambos modelos.</tspan></text><rect x="20" y="331" width="440" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="363" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">Costo: mantener dos sistemas dobla el trabajo de algunas</tspan></text><text x="240" y="379.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">funciones o las difiere; los equipos de producto se ven</tspan></text><text x="240" y="396.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">frenados por una migración parcial.</tspan></text><rect x="480" y="331" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="363" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Decisión: rediseñar y no reemplazar uno a uno; la</tspan></text><text x="700" y="379.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">migración tardó más que una réplica directa, pero evita</tspan></text><text x="700" y="396.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">reconstruir pagos para cada producto.</tspan></text><rect x="10" y="436" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="458.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: arriba, el orden de las fases; debajo, cómo se convivió con el sistema antiguo y qué costó. Las reservas de</tspan></text><text x="470" y="475.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estancias se subdividieron en más de 30 hitos por características. Dónde deja de valer: la fuente (2022) no da fechas,</tspan></text><text x="470" y="492.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">duración total ni la proporción de bookings migrados en cada momento; el costo del recuadro rojo viene de la propia fuente,</tspan></text><text x="470" y="508.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el de la decisión es lectura mía.</tspan></text><text x="470" y="552.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Airbnb Tech Blog (F7), secciones «A Phased Migration» y «Maintaining Two Systems».</tspan></text></svg>
