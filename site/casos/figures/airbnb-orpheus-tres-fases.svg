<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 478" width="940" height="478" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Orpheus: cada solicitud se parte en tres fases y la red nunca toca la transacción</title><desc id="d">Diagrama de las tres fases de una solicitud en la biblioteca de idempotencia Orpheus de Airbnb: pre-RPC (se registra la solicitud en la base de datos dentro de una transacción), RPC (llamada por red al procesador de pagos, sin base de datos) y post-RPC (se registra la respuesta dentro de otra transacción); las llamadas de red y las transacciones están separadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="478" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Orpheus: tres fases por solicitud y la red nunca toca la transacción</tspan></text><rect x="20" y="50" width="280" height="190" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="34" y="72" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="34" dy="0">Pre-RPC (transacción 1)</tspan></text><rect x="40" y="90" width="240" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="110" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Se toma la clave y el</tspan></text><text x="160" y="126.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">contrato; se registra el</tspan></text><text x="160" y="143.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">detalle del pago</tspan></text><rect x="40" y="166" width="240" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="160" y="197.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="160" dy="0">Sin llamadas de red</tspan></text><rect x="330" y="50" width="280" height="190" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="344" y="72" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="344" dy="0">RPC (sin base de datos)</tspan></text><rect x="350" y="90" width="240" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="110" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Llamada por red al servicio</tspan></text><text x="470" y="126.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">externo: procesador, banco</tspan></text><text x="470" y="143.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">adquirente</tspan></text><rect x="350" y="166" width="240" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="470" y="189.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Aquí van cálculos o consultas</tspan></text><text x="470" y="205.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">idempotentes</tspan></text><rect x="640" y="50" width="280" height="190" rx="16" fill="#fbe4de" fill-opacity="0.45" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="8 5"/><text x="654" y="72" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="654" dy="0">Post-RPC (transacción 2)</tspan></text><rect x="660" y="90" width="240" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="780" y="110" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">Se registra la respuesta:</tspan></text><text x="780" y="126.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">éxito, y si un fallo es</tspan></text><text x="780" y="143.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780" dy="0">reintentable o no</tspan></text><rect x="660" y="166" width="240" height="56" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="780" y="197.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="780" dy="0">Sin llamadas de red</tspan></text><polyline points="300,145 330,145" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,145 640,145" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="260" width="440" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="240" y="278.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">Regla 1: ninguna interacción de red en pre y post-RPC.</tspan></text><text x="240" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">Regla 2: ninguna interacción con la base de datos durante</tspan></text><text x="240" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">el RPC. Mezclarlas agotó rápidamente los pools de</tspan></text><text x="240" y="328.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">conexiones.</tspan></text><rect x="480" y="260" width="440" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="278.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Costo: cada llamada de API se refactoriza en tres tramos</tspan></text><text x="700" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">y algunas llamadas complejas son difíciles de partir así;</tspan></text><text x="700" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">se usan lambdas de Java para juntar las instrucciones en</tspan></text><text x="700" y="328.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">una sola transacción.</tspan></text><rect x="10" y="356" width="920" height="71.8" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="378.9" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: arriba, de izquierda a derecha, el orden de una solicitud; las dos reglas de abajo son lo que da atomicidad a cada</tspan></text><text x="470" y="395.54" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tramo de base de datos. Dónde deja de valer: la descripción es de 2019 y de un caso simple de un único RPC; la fuente dice</tspan></text><text x="470" y="412.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que Orpheus admite varias llamadas pero no las detalla. No se sabe qué parte del código actual sigue así.</tspan></text><text x="470" y="455.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Chew y Khisti, «Avoiding double payments in a distributed payments system», Airbnb Tech Blog, 16 de abril de 2019 (F5).</tspan></text></svg>
