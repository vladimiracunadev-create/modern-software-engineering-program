<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 545" width="940" height="545" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Orquestación de pagos: un flujo como grafo de pasos idempotentes y reintentables</title><desc id="d">Diagrama ilustrativo de un flujo de pago como grafo acíclico dirigido de pasos idempotentes y reintentables: validación, precio, procesamiento del pago y reporte financiero, con lógica de pago separada de la lógica del producto y un bus de mensajes basado en Kafka cuyos procesadores convierten la entrega al menos una vez en un efecto exactamente una vez.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="545" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Orquestación de pagos: un flujo como grafo de pasos idempotentes y reintentables</tspan></text><rect x="20" y="85" width="160" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="100" y="118.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="100" dy="0">Validación</tspan></text><rect x="230" y="50" width="160" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="310" y="83.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="310" dy="0">Precio genérico</tspan></text><rect x="230" y="120" width="160" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="310" y="153.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="310" dy="0">Método de pago</tspan></text><rect x="440" y="85" width="190" height="60" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="535" y="109.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="535" dy="0">Procesamiento del</tspan></text><text x="535" y="127.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="535" dy="0">pago</tspan></text><rect x="680" y="50" width="240" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="800" y="83.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="800" dy="0">Reporte financiero</tspan></text><rect x="680" y="120" width="240" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="800" y="153.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="800" dy="0">Aviso al producto (evento)</tspan></text><polyline points="180,105 230,80" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="180,125 230,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="390,80 440,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="390,150 440,125" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="630,105 680,80" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="630,125 680,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="205" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="220.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Cada paso es idempotente y reintentable con</tspan></text><text x="240" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">comportamiento definido; así la orquestación mantiene la</tspan></text><text x="240" y="253.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">consistencia eventual con la pasarela de pagos y con el</tspan></text><text x="240" y="270.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">cumplimiento del producto: Airbnb declara «cinco nueves»</tspan></text><text x="240" y="286.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">(99,999 %) de consistencia.</tspan></text><rect x="480" y="205" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Eventos por un bus basado en Kafka (al menos una vez);</tspan></text><text x="700" y="253.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">los procesadores de eventos usan el marco de idempotencia</tspan></text><text x="700" y="270.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">para lograr un efecto de exactamente una vez.</tspan></text><rect x="20" y="310" width="440" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="337" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Separación: la lógica de pago (validación, procesamiento,</tspan></text><text x="240" y="353.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">reporte) está aislada de la lógica del producto, salvo</tspan></text><text x="240" y="370.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">unos pocos puntos de integración definidos.</tspan></text><rect x="480" y="310" width="440" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="345.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">Qué evita: reconstruir los pagos para cada producto</tspan></text><text x="700" y="361.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">nuevo, como Experiencias, con rarezas propias.</tspan></text><rect x="10" y="406" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="428.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: de izquierda a derecha, un flujo de ejemplo; las flechas son dependencias entre pasos y los dos recuadros de abajo</tspan></text><text x="470" y="445.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dicen cómo se garantiza que repetir un paso no repite el efecto. Dónde deja de valer: el grafo es un ejemplo mío con los</tspan></text><text x="470" y="462.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">nombres de flujo que da la fuente (validación, procesamiento de pagos, reporte financiero); no es el grafo real y los</tspan></text><text x="470" y="478.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«cinco nueves» son una medición interna de consistencia, no de disponibilidad.</tspan></text><text x="470" y="522.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Ross y otros, «Rebuilding Payment Orchestration at Airbnb», Airbnb Tech Blog, 24 de febrero de 2022 (F7).</tspan></text></svg>
