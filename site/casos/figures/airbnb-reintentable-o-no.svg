<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 575" width="940" height="575" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">¿Reintentable o no? La clasificación de errores y lo que cuesta equivocarse</title><desc id="d">Diagrama de decisión de la clasificación de errores en Orpheus: los errores de infraestructura (estados de la familia 5xx) se tratan como reintentables y los de validación (4xx) como no reintentables; clasificar mal un error reintentable lo deja fallando para siempre, y clasificar mal uno no reintentable puede duplicar el pago.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="575" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">¿Reintentable o no? La clasificación de errores y lo que cuesta equivocarse</tspan></text><rect x="330" y="55" width="280" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="86.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Falla una llamada</tspan></text><rect x="20" y="150" width="400" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220" y="185.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220" dy="0">Error de red o de infraestructura (5xx): se espera</tspan></text><text x="220" y="201.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220" dy="0">transitorio, así que es REINTENTABLE</tspan></text><rect x="520" y="150" width="400" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="720" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">Error de validación (4xx): entrada o estado</tspan></text><text x="720" y="193.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">inválido, por ejemplo reembolsar un reembolso; es NO</tspan></text><text x="720" y="210.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">REINTENTABLE</tspan></text><polyline points="400,111 220,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="540,111 720,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="250" width="400" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="220" y="278.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">Equivocación 1: etiquetar como no reintentable un</tspan></text><text x="220" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">fallo transitorio. El pago queda fallido de forma</tspan></text><text x="220" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">indefinida y los reintentos devuelven siempre el</tspan></text><text x="220" y="328.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">error incorrecto.</tspan></text><rect x="520" y="250" width="400" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="720" y="287" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="720" dy="0">Equivocación 2: etiquetar como reintentable algo que</tspan></text><text x="720" y="303.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="720" dy="0">exige intervención manual. Puede haber pagos</tspan></text><text x="720" y="320.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="720" dy="0">duplicados.</tspan></text><polyline points="220,230 220,250" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="720,230 720,250" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="365" width="900" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="396.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Regla por defecto: la clase de excepción genérica asume NO reintentable y marca como reintentables solo casos concretos.</tspan></text><rect x="10" y="436" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="458.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la decisión sale de la causa, no del síntoma; los dos recuadros rojos son los dos costos de clasificar mal,</tspan></text><text x="470" y="475.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">simétricos y opuestos. Dónde deja de valer: la propia fuente reconoce casos ambiguos, como un valor nulo que viene de la</tspan></text><text x="470" y="492.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">base de datos por una falla de conexión frente a un campo nulo erróneo en la solicitud, que exigen criterio y no una regla</tspan></text><text x="470" y="508.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de estado HTTP.</tspan></text><text x="470" y="552.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Airbnb Tech Blog (F5), sección sobre manejo de excepciones. Dibujo propio.</tspan></text></svg>
