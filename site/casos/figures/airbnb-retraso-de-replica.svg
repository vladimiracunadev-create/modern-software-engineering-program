<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 634" width="940" height="634" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Por qué la idempotencia se lee de la base maestra: el retraso de réplica duplica el pago</title><desc id="d">Comparación de dos escenarios: si el servicio guarda las respuestas en una réplica, un reintento durante el retraso de replicación no encuentra la respuesta y el cobro se repite; si guarda y lee solo en la base maestra, el reintento encuentra la respuesta y devuelve la guardada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="634" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Por qué la idempotencia se lee de la maestra: el retraso de réplica duplica el pago</tspan></text><rect x="20" y="55" width="440" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="78.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="240" dy="0">Si se lee de una réplica (mal)</tspan></text><rect x="480" y="55" width="440" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="78.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="700" dy="0">Si se lee solo de la maestra (bien)</tspan></text><rect x="20" y="105" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="133.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">1. cobro 1 con éxito; la respuesta queda en la maestra</tspan></text><rect x="480" y="105" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="133.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">1. cobro 1 con éxito; la respuesta queda en la maestra</tspan></text><rect x="20" y="165" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="193.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">2. el cliente no recibe la respuesta y reintenta</tspan></text><rect x="480" y="165" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="193.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">2. el cliente no recibe la respuesta y reintenta</tspan></text><rect x="20" y="225" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="245.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">3. la réplica aún no recibió la respuesta (retraso de</tspan></text><text x="240" y="261.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">replicación)</tspan></text><rect x="480" y="225" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="253.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">3. el servicio lee la maestra y encuentra la respuesta</tspan></text><rect x="20" y="285" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">4. el servicio «no encuentra» la respuesta y vuelve a</tspan></text><text x="240" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">cobrar</tspan></text><rect x="480" y="285" width="440" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="313.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">4. devuelve la respuesta guardada, sin cobrar de nuevo</tspan></text><rect x="20" y="345" width="440" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="373.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="240" dy="0">Resultado: pago duplicado</tspan></text><rect x="480" y="345" width="440" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="373.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="700" dy="0">Resultado: un solo pago</tspan></text><rect x="20" y="409" width="900" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="439.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Costo de la solución: una sola base maestra sería un cuello de botella; Airbnb la fragmenta por clave de idempotencia,</tspan></text><text x="470" y="455.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que tiene alta cardinalidad y distribución pareja, y por eso funciona como clave de fragmentación.</tspan></text><rect x="10" y="495" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="517.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: los dos escenarios son idénticos hasta el paso 2; la diferencia está solo en de dónde se lee. Es un ejemplo de</tspan></text><text x="470" y="534.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consistencia que se compra con latencia y escalado (por eso se fragmenta). Dónde deja de valer: la fuente usa MySQL y dice</tspan></text><text x="470" y="551.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que las réplicas pueden causar efectos adversos si no se configura lectura fuertemente consistente; con otra base de datos</tspan></text><text x="470" y="567.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el análisis cambia.</tspan></text><text x="470" y="611.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Airbnb Tech Blog (F5), sección «Avoid replica databases — Stick to master». Dibujo propio.</tspan></text></svg>
