<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 509" width="940" height="509" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Software de Airbnb que sus propias fuentes documentan</title><desc id="d">Diagrama del software documentado de Airbnb: un monolito en Ruby on Rails y servicios en Java con Dropwizard, Jersey y Jackson; interfaces en Thrift; MySQL; Kafka; Java con lambdas y StatefulJ para máquinas de estados; TensorFlow, árboles de decisión con gradiente y máquinas de factorización para la búsqueda.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="509" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Software de Airbnb que sus propias fuentes documentan</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Lenguajes y marcos</tspan></text><rect x="10" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: monolito en Ruby on Rails y servicios sobre</tspan></text><text x="235" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">todo en Java con el marco Dropwizard, con filtros y módulos</tspan></text><text x="235" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">propios (F7, F9).</tspan></text><rect x="10" y="167.8" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="188.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: Jersey y Jackson para JSON sobre HTTP, que</tspan></text><text x="235" y="205.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">pasó a Thrift sobre HTTP (F9).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Datos y mensajería</tspan></text><rect x="480" y="92" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: MySQL como base y Kafka como bus de mensajes</tspan></text><text x="705" y="129.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">de pagos (F5, F7).</tspan></text><rect x="480" y="151.2" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="172.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: almacén analítico, sistema de búsqueda y motor</tspan></text><text x="705" y="188.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">de indexación.</tspan></text><rect x="10" y="235" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="255.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Contratos y pagos</tspan></text><rect x="10" y="277" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="297.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: definición de interfaces con Thrift y</tspan></text><text x="235" y="314.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">generación de clientes en Java y Ruby (F9).</tspan></text><rect x="10" y="336.2" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="357.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: biblioteca de idempotencia Orpheus en Java,</tspan></text><text x="235" y="373.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">con lambdas y una máquina de estados con StatefulJ (F5).</tspan></text><rect x="480" y="218.4" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="239.32" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Aprendizaje automático</tspan></text><rect x="480" y="260.4" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="281.3" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: TensorFlow para las redes de ordenación,</tspan></text><text x="705" y="297.94" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">árboles de decisión con gradiente y máquinas de</tspan></text><text x="705" y="314.58" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">factorización en la historia del modelo (F8, F12).</tspan></text><rect x="480" y="336.2" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="357.14" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: marco de servido y plataforma de experimentos.</tspan></text><rect x="10" y="403.4" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="426.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cuatro grupos tecnológicos con su fuente. Dónde deja de valer: son blogs de 2017 a 2022; no cubren frontend, móvil</tspan></text><text x="470" y="442.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ni infraestructura.</tspan></text><text x="470" y="486.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F5, F7, F8, F9, F12.</tspan></text></svg>
