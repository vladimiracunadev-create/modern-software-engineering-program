<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 618" width="940" height="618" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Características de la infraestructura de Amazon: regiones, zonas, capacidad y costo</title><desc id="d">Diagrama de la infraestructura de Amazon según sus fuentes: nube propia con 24 regiones y 76 zonas de disponibilidad en 2020, servicios en tres o más zonas con sobreaprovisionamiento, células dentro de una región, y un gasto de capital de 131,8 mil millones de dólares brutos en 2025 con unos 200 mil millones previstos para 2026.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="618" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Características de la infraestructura de Amazon: regiones, zonas, capacidad y costo</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Escala y ubicación</tspan></text><rect x="10" y="92" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: 24 regiones y 76 zonas de disponibilidad en</tspan></text><text x="235" y="129.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">2020 (F9); no se sabe el número actual.</tspan></text><rect x="10" y="151.2" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="172.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: decenas de miles de servidores en muchos</tspan></text><text x="235" y="188.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">centros de datos en 2007 (F1).</tspan></text><rect x="10" y="210.4" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="231.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Inferido: la infraestructura es propia y no alquilada: AWS</tspan></text><text x="235" y="247.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">es la propia Amazon; no se publica la parte propiedad de</tspan></text><text x="235" y="264.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">terceros (por ejemplo, ubicación en centros de datos</tspan></text><text x="235" y="281.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">compartidos).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Diseño por zonas y células</tspan></text><rect x="480" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: servicios en un grupo de autoescalado en tres</tspan></text><text x="705" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">o más zonas, con 50 % de capacidad sobrante con tres zonas</tspan></text><text x="705" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">(F7).</tspan></text><rect x="480" y="167.8" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="188.7" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: equipos que dividen una región en zonas o en</tspan></text><text x="705" y="205.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">células, los fragmentos internos de su servicio, para</tspan></text><text x="705" y="221.98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">despliegues de alcance menor (F9).</tspan></text><rect x="10" y="310.8" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="331.72" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Capacidad y costo</tspan></text><rect x="10" y="352.8" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="373.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: compras de propiedad y equipo de 131,8 mil</tspan></text><text x="235" y="390.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">millones de dólares brutos en 2025 y 83,0 en 2024;</tspan></text><text x="235" y="406.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">amortización de 65,8 mil millones en 2025; unos 200 mil</tspan></text><text x="235" y="423.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">millones previstos de inversión de capital en 2026 (F4).</tspan></text><rect x="10" y="445.2" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="466.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: flujo de caja libre de 11,2 mil millones en</tspan></text><text x="235" y="482.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">2025 frente a 38,2 en 2024 (F4).</tspan></text><rect x="480" y="251.6" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="272.52" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Redes</tspan></text><rect x="480" y="293.6" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="314.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: enlaces de alta velocidad entre centros de</tspan></text><text x="705" y="331.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">datos (F1).</tspan></text><rect x="480" y="352.8" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="373.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: topología, proveedores y capacidad de la red</tspan></text><text x="705" y="390.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">mundial; tampoco hay dato de costo de red.</tspan></text><rect x="10" y="512.4" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="535.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: los cuatro recuadros recorren escala, diseño, costo y red. Dónde deja de valer: las cifras de capital son</tspan></text><text x="470" y="551.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consolidadas de toda la empresa, no solo de AWS; el desglose por segmento no se publica en las fuentes de este caso.</tspan></text><text x="470" y="595.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1, F4, F7, F9.</tspan></text></svg>
