<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 551" width="940" height="551" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dynamo: el anillo, la lista de preferencia y el traspaso con pista</title><desc id="d">Diagrama del anillo de hash consistente de Dynamo con seis nodos: una clave cae entre F y A, el nodo A la coordina y la replica en B y C (N=3); si A no responde, la réplica se guarda con una pista en D, que la devolverá a A cuando vuelva.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="551" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dynamo: el anillo, la lista de preferencia y el traspaso con pista</tspan></text><circle cx="290" cy="230" r="140" fill="none" stroke="#8a9aa3" stroke-width="2.4" stroke-dasharray="3 5"/><rect x="196" y="88.7564" width="48" height="40" rx="20" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="220" y="112.956" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="220" dy="0">A</tspan></text><rect x="336" y="88.7564" width="48" height="40" rx="20" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="360" y="112.956" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="360" dy="0">B</tspan></text><rect x="406" y="210" width="48" height="40" rx="20" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="430" y="234.2" font-size="15" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="430" dy="0">C</tspan></text><rect x="336" y="331.244" width="48" height="40" rx="20" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="360" y="355.444" font-size="15" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="360" dy="0">D</tspan></text><rect x="196" y="331.244" width="48" height="40" rx="20" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="220" y="355.444" font-size="15" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="220" dy="0">E</tspan></text><rect x="126" y="210" width="48" height="40" rx="20" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="234.2" font-size="15" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="150" dy="0">F</tspan></text><circle cx="161.828" cy="152" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="161.828" y="157" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="161.828" dy="0">k</tspan></text><text x="121.828" y="130" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="121.828" dy="0">clave k (hash)</tspan></text><text x="350" y="200" font-size="14" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="350" dy="0">anillo de hash</tspan></text><text x="350" y="220" font-size="14" text-anchor="middle" font-weight="700" fill="#32505f"><tspan x="350" dy="0">consistente</tspan></text><polyline points="248,108.756 332,108.756" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="374,133.005 416,205.751" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="234,133.005 346,326.995" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="520" y="55" width="400" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="720" y="77" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="720" dy="0">Lista de preferencia de k (N = 3): A, B, C.</tspan></text><text x="720" y="93.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="720" dy="0">A es el coordinador de la escritura; B y C guardan</tspan></text><text x="720" y="110.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="720" dy="0">réplicas.</tspan></text><rect x="520" y="140" width="400" height="86" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="720" y="170" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">Traspaso con pista (hinted handoff): si A no</tspan></text><text x="720" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">responde, la réplica va a D, el siguiente nodo del</tspan></text><text x="720" y="203.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">anillo, con una pista que dice «esto era de A».</tspan></text><rect x="520" y="241" width="400" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="720" y="263" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="720" dy="0">Cuórum flexible (sloppy quorum): lecturas y</tspan></text><text x="720" y="279.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="720" dy="0">escrituras usan los primeros N nodos sanos, no</tspan></text><text x="720" y="296.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="720" dy="0">siempre los N primeros del anillo.</tspan></text><rect x="520" y="326" width="400" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="720" y="356.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="720" dy="0">D guarda la pista en una base local aparte y la</tspan></text><text x="720" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="720" dy="0">devuelve a A cuando detecta que volvió.</tspan></text><rect x="10" y="412" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="434.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la flecha continua es la replicación normal (A coordina y copia a B y C); la discontinua roja es el desvío</tspan></text><text x="470" y="451.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">temporal cuando A no responde. Cada nodo físico ocupa varias posiciones del anillo (nodos virtuales) para repartir la</tspan></text><text x="470" y="468.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">carga; aquí se dibuja una por nodo. Documentado en F1, secciones 4.2 a 4.6. Dónde deja de valer: es el diseño de 2007 del</tspan></text><text x="470" y="484.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">almacén interno; DynamoDB, el servicio de AWS, es otro producto.</tspan></text><text x="470" y="528.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DeCandia et al., Dynamo, SOSP 2007 (F1). Dibujo propio; seis nodos y la clave k son un ejemplo didáctico.</tspan></text></svg>
