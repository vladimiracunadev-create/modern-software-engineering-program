<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 416" width="940" height="416" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Versiones divergentes que vio el servicio de carrito en 24 horas (porcentaje de peticiones)</title><desc id="d">Barras horizontales en escala logarítmica: el 99,94 por ciento de las peticiones al carrito vio exactamente una versión, el 0,00057 por ciento vio dos, el 0,00047 por ciento tres y el 0,00009 por ciento cuatro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="416" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Versiones divergentes que vio el servicio de carrito en 24 horas (porcentaje de peticiones)</tspan></text><line x1="144" y1="49" x2="144" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="144" y1="201" x2="144" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="144" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="144" dy="0">0</tspan></text><line x1="243.923" y1="49" x2="243.923" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="243.923" y1="201" x2="243.923" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="243.923" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="243.923" dy="0">0,0001</tspan></text><line x1="343.846" y1="49" x2="343.846" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="343.846" y1="201" x2="343.846" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="343.846" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="343.846" dy="0">0,001</tspan></text><line x1="443.769" y1="49" x2="443.769" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="443.769" y1="201" x2="443.769" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="443.769" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="443.769" dy="0">0,01</tspan></text><line x1="543.691" y1="49" x2="543.691" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="543.691" y1="201" x2="543.691" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="543.691" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="543.691" dy="0">0,1</tspan></text><line x1="643.614" y1="49" x2="643.614" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="643.614" y1="201" x2="643.614" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="643.614" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="643.614" dy="0">1</tspan></text><line x1="743.537" y1="49" x2="743.537" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="743.537" y1="201" x2="743.537" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="743.537" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="743.537" dy="0">10</tspan></text><line x1="843.46" y1="49" x2="843.46" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="843.46" y1="201" x2="843.46" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="843.46" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="843.46" dy="0">100</tspan></text><line x1="144" y1="201" x2="843.46" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="134" dy="0">1 versión</tspan></text><text x="134" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="134" dy="0">2 versiones</tspan></text><text x="134" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="134" dy="0">3 versiones</tspan></text><text x="134" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="134" dy="0">4 versiones</tspan></text><rect x="144" y="55" width="699.434" height="26" rx="3" fill="#087f8c"/><text x="850.434" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="850.434" dy="0">99,94 %</tspan></text><rect x="144" y="93" width="175.452" height="26" rx="3" fill="#087f8c"/><text x="326.452" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="326.452" dy="0">0,00057 %</tspan></text><rect x="144" y="131" width="167.081" height="26" rx="3" fill="#087f8c"/><text x="318.081" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="318.081" dy="0">0,00047 %</tspan></text><rect x="144" y="169" width="95.3506" height="26" rx="3" fill="#087f8c"/><text x="246.351" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="246.351" dy="0">0,00009 %</tspan></text><text x="493.73" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="493.73" dy="0">Porcentaje de peticiones al carrito, 24 h (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="259" width="920" height="109.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la escala logarítmica es obligatoria porque la barra de una versión es cinco órdenes de magnitud mayor que la de</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuatro. La conclusión del artículo es que, aunque el sistema está diseñado para divergir, divergir es raro. También dice</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que el aumento de versiones divergentes lo causan más los escritores concurrentes (robots) que los fallos. Dónde deja de</tspan></text><text x="470" y="333.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: es una muestra de 24 horas del servicio de carrito en un momento no fechado con precisión; no mide tiempos ni</tspan></text><text x="470" y="350.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pérdidas.</tspan></text><text x="470" y="398.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DeCandia et al., Dynamo, SOSP 2007, sección 6.3 (F1).</tspan></text></svg>
