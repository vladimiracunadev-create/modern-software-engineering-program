<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 609" width="940" height="609" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio de Amazon: valor, ingreso, actores y flujos</title><desc id="d">Diagrama del negocio de Amazon con cinco grupos: la propuesta de valor (selección, valor y comodidad), las líneas de ingreso de 2025, los actores, los flujos de dinero y los flujos de valor entre compradores, vendedores, anunciantes y clientes de AWS.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="609" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio de Amazon: valor, ingreso, actores y flujos</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Propuesta de valor</tspan></text><rect x="10" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: selección amplia, valor y comodidad para el</tspan></text><text x="235" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">cliente, y una nube que ofrece como servicio lo que la</tspan></text><text x="235" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">tienda ya necesitaba (F15, F5).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Ingreso 2025 (miles de millones de dólares)</tspan></text><rect x="480" y="92" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: tiendas en línea 269,3; servicios a vendedores</tspan></text><text x="705" y="129.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">172,2; AWS 128,7; publicidad 68,6; suscripciones 49,6;</tspan></text><text x="705" y="146.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">tiendas físicas 22,6; otros 5,9 (suma de los cuatro</tspan></text><text x="705" y="162.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">trimestres de F4).</tspan></text><rect x="10" y="175.8" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="196.72" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Actores</tspan></text><rect x="10" y="217.8" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="238.7" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Compradores y miembros Prime; vendedores externos (61 % de</tspan></text><text x="235" y="255.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">las unidades pagadas del cuarto trimestre); anunciantes;</tspan></text><text x="235" y="271.98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">clientes de AWS; empleados y operadores logísticos (F4).</tspan></text><rect x="480" y="192.4" width="450" height="34" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="213.32" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="705" dy="0">Flujos de dinero</tspan></text><rect x="480" y="234.4" width="450" height="101" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="255.26" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Comprador → Amazon (venta propia o venta de un tercero con</tspan></text><text x="705" y="271.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">comisión); vendedor → Amazon (comisión, envío, publicidad);</tspan></text><text x="705" y="288.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">anunciante → Amazon; cliente de AWS → Amazon por uso;</tspan></text><text x="705" y="305.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Amazon → proveedores, transportistas, proveedores de nube y</tspan></text><text x="705" y="321.82" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">empleados.</tspan></text><rect x="480" y="343.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="364.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: la parte del precio que se queda cada actor ni</tspan></text><text x="705" y="380.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">el margen por línea.</tspan></text><rect x="10" y="301.6" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="235" y="322.52" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="235" dy="0">Flujos de valor</tspan></text><rect x="10" y="343.6" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="364.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Selección y plazo de entrega hacia el comprador; tráfico y</tspan></text><text x="235" y="381.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">logística hacia el vendedor; audiencia con intención de</tspan></text><text x="235" y="397.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">compra hacia el anunciante; cómputo y almacenamiento hacia</tspan></text><text x="235" y="414.4" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">el desarrollador.</tspan></text><rect x="10" y="436" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="456.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Inferido: la logística y la nube comparten capacidad de</tspan></text><text x="235" y="473.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">inversión; no hay dato público del reparto.</tspan></text><rect x="10" y="503.2" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="526.12" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cinco grupos que van de lo que se ofrece a cómo circula el dinero. Dónde deja de valer: es un esquema; las cifras</tspan></text><text x="470" y="542.76" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">salen del comunicado de resultados y el reparto de costos entre líneas no se publica.</tspan></text><text x="470" y="586.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: comunicado Q4 2025 (F4); página institucional (F15); anuncio de EC2 (F5).</tspan></text></svg>
