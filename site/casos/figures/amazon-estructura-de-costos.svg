<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A dónde va cada dólar de venta de Amazon, 2024 frente a 2025</title><desc id="d">Barras apiladas al 100 por ciento: en 2025 el costo de ventas absorbe el 49,7 por ciento de los ingresos, la logística y el cumplimiento el 15,2, la tecnología y la infraestructura el 15,1, marketing, administración y otros el 8,8 y queda un 11,2 por ciento de resultado operativo; en 2024 el resultado era el 10,8 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A dónde va cada dólar de venta de Amazon, 2024 frente a 2025</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Costo de ventas</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">Logística y cumplimiento</tspan></text><rect x="406.06" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="426.06" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="426.06" dy="0">Tecnología e infraestructura</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Marketing, administración y otros</tspan></text><rect x="312.82" y="69" width="12" height="12" rx="2" fill="#087f8c"/><text x="332.82" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="332.82" dy="0">Resultado operativo</tspan></text><line x1="84" y1="101" x2="84" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="84" y1="181" x2="84" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="84" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="84" dy="0">0</tspan></text><line x1="281.925" y1="101" x2="281.925" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="281.925" y1="181" x2="281.925" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="281.925" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="281.925" dy="0">25</tspan></text><line x1="479.85" y1="101" x2="479.85" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="479.85" y1="181" x2="479.85" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="479.85" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479.85" dy="0">50</tspan></text><line x1="677.775" y1="101" x2="677.775" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="677.775" y1="181" x2="677.775" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="677.775" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677.775" dy="0">75</tspan></text><line x1="875.7" y1="101" x2="875.7" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="181" x2="875.7" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="84" y1="181" x2="875.7" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="74" y="125.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="74" dy="0">2024</tspan></text><text x="74" y="165.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="74" dy="0">2025</tspan></text><rect x="84" y="108" width="404.92" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="286.46" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="286.46" dy="0">51 %</tspan></text><rect x="488.92" y="108" width="122.244" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="550.042" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="550.042" dy="0">15 %</tspan></text><rect x="611.163" y="108" width="109.882" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="666.104" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="666.104" dy="0">14 %</tspan></text><rect x="721.045" y="108" width="69.5314" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="755.811" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="755.811" dy="0">9 %</tspan></text><rect x="790.577" y="108" width="85.1231" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="833.138" y="125.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="833.138" dy="0">11 %</tspan></text><text x="882.7" y="125.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="84" y="148" width="393.588" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="280.794" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="280.794" dy="0">50 %</tspan></text><rect x="477.588" y="148" width="120.451" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="537.814" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="537.814" dy="0">15 %</tspan></text><rect x="598.039" y="148" width="119.84" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="657.959" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="657.959" dy="0">15 %</tspan></text><rect x="717.879" y="148" width="69.5047" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="752.631" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752.631" dy="0">9 %</tspan></text><rect x="787.384" y="148" width="88.3165" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="831.542" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="831.542" dy="0">11 %</tspan></text><text x="882.7" y="165.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="479.85" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="479.85" dy="0">% del total</tspan></text><rect x="10" y="239" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el costo de ventas pesa casi la mitad; el rubro que más crece es tecnología e infraestructura (de 13,9 % a 15,1</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">%), el de la nube y la inversión en capacidad. El resultado operativo sube de 10,8 % a 11,2 %. Dónde deja de valer: son</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rubros contables consolidados; el comunicado no los separa por segmento ni dice cuánto de «tecnología e infraestructura» es</tspan></text><text x="470" y="313.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">AWS.</tspan></text><text x="470" y="361.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: estado de resultados consolidado, comunicado Q4 2025 (F4). Marketing, administración y otros suma tres rubros del comunicado.</tspan></text></svg>
