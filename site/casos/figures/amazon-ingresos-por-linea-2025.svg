<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 513" width="940" height="513" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ventas de Amazon en 2025 por línea de ingreso (miles de millones de dólares)</title><desc id="d">Barras horizontales con las ventas de 2025 por línea: tiendas en línea 269,3, servicios de vendedores externos 172,2, AWS 128,7, publicidad 68,6, suscripciones 49,6, tiendas físicas 22,6 y otros 5,9; suman 716,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="513" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ventas de Amazon en 2025 por línea de ingreso (miles de millones de dólares)</tspan></text><line x1="254" y1="49" x2="254" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="315" x2="254" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="461.233" y1="49" x2="461.233" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="461.233" y1="315" x2="461.233" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="461.233" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.233" dy="0">100</tspan></text><line x1="668.467" y1="49" x2="668.467" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="668.467" y1="315" x2="668.467" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="668.467" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="668.467" dy="0">200</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="315" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="315" x2="875.7" y2="320" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="336" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">300</tspan></text><line x1="254" y1="315" x2="875.7" y2="315" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Tiendas en línea (venta propia)</tspan></text><text x="244" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Servicios a vendedores externos</tspan></text><text x="244" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">AWS</tspan></text><text x="244" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Publicidad</tspan></text><text x="244" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Suscripciones</tspan></text><text x="244" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Tiendas físicas</tspan></text><text x="244" y="300.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Otros</tspan></text><rect x="254" y="55" width="558.079" height="26" rx="3" fill="#087f8c"/><text x="819.079" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="819.079" dy="0">269,3</tspan></text><rect x="254" y="93" width="356.856" height="26" rx="3" fill="#087f8c"/><text x="617.856" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="617.856" dy="0">172,2</tspan></text><rect x="254" y="131" width="266.709" height="26" rx="3" fill="#087f8c"/><text x="527.709" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="527.709" dy="0">128,7</tspan></text><rect x="254" y="169" width="142.162" height="26" rx="3" fill="#087f8c"/><text x="403.162" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="403.162" dy="0">68,6</tspan></text><rect x="254" y="207" width="102.788" height="26" rx="3" fill="#087f8c"/><text x="363.788" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="363.788" dy="0">49,6</tspan></text><rect x="254" y="245" width="46.8347" height="26" rx="3" fill="#087f8c"/><text x="307.835" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="307.835" dy="0">22,6</tspan></text><rect x="254" y="283" width="12.2268" height="26" rx="3" fill="#087f8c"/><text x="273.227" y="300.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="273.227" dy="0">5,9</tspan></text><text x="564.85" y="359" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">Miles de millones de dólares (2025)</tspan></text><rect x="10" y="373" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la venta propia sigue siendo la línea mayor (38 % del total), pero los servicios a vendedores externos (24 %) y la</tspan></text><text x="470" y="414.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">publicidad (10 %) suman más que AWS (18 %). Los cuatro números que más crecieron en el último trimestre fueron AWS (24 %),</tspan></text><text x="470" y="431.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">publicidad (23 %), servicios a vendedores (11 %) y tiendas en línea (10 %). Dónde deja de valer: es ingreso, no margen; el</tspan></text><text x="470" y="447.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comunicado no reparte el resultado operativo por línea dentro de cada segmento.</tspan></text><text x="470" y="495.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: comunicado Q4 2025 de Amazon (F4); cada barra es la suma de los cuatro trimestres de 2025 que publica el comunicado.</tspan></text></svg>
