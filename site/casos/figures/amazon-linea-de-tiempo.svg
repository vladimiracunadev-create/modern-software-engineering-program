<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 443" width="940" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Evolución de Amazon: tienda, plataforma técnica y práctica de ingeniería</title><desc id="d">Línea de tiempo de 1994 a 2026 con tres carriles: la tienda (libros, marketplace, Prime y logística), la plataforma técnica (APIs, AWS con S3 y EC2) y la práctica de ingeniería (Working Backwards desde 2004, Dynamo 2007, despliegues automatizados 2020); marcadores en 1995, 1997, 2006, 2007 y 2020.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="443" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Evolución de Amazon: tienda, plataforma técnica y práctica de ingeniería</tspan></text><line x1="194" y1="83" x2="194" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="245" x2="194" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">1 994</tspan></text><line x1="328.625" y1="83" x2="328.625" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="328.625" y1="245" x2="328.625" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="328.625" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328.625" dy="0">2 000</tspan></text><line x1="463.25" y1="83" x2="463.25" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="463.25" y1="245" x2="463.25" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="463.25" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463.25" dy="0">2 006</tspan></text><line x1="597.875" y1="83" x2="597.875" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="597.875" y1="245" x2="597.875" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="597.875" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="597.875" dy="0">2 012</tspan></text><line x1="732.5" y1="83" x2="732.5" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="732.5" y1="245" x2="732.5" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="732.5" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.5" dy="0">2 018</tspan></text><line x1="912" y1="83" x2="912" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="245" x2="912" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2 026</tspan></text><line x1="194" y1="245" x2="912" y2="245" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="114.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Tienda</tspan></text><text x="184" y="168.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Plataforma técnica</tspan></text><text x="184" y="222.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Práctica de ingeniería</tspan></text><line x1="216.438" y1="75" x2="216.438" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="216.438" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="216.438" dy="0">Tienda</tspan></text><line x1="261.312" y1="75" x2="261.312" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="266.767" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="266.767" dy="0">Día 1</tspan></text><line x1="463.25" y1="75" x2="463.25" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="463.25" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="463.25" dy="0">S3 y EC2</tspan></text><line x1="485.688" y1="75" x2="485.688" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="525.67" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="525.67" dy="0">Dynamo</tspan></text><line x1="777.375" y1="75" x2="777.375" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="777.375" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="777.375" dy="0">Despliegues</tspan></text><rect x="216.438" y="92" width="112.188" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="272.531" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="272.531" dy="0">Libros</tspan></text><rect x="328.625" y="92" width="112.188" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="384.719" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="384.719" dy="0">Marketplace</tspan></text><rect x="440.812" y="92" width="471.188" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="676.406" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="676.406" dy="0">Prime, logística y publicidad</tspan></text><line x1="14" y1="137" x2="912" y2="137" stroke="#d5dde1" stroke-width="1"/><rect x="194" y="146" width="179.5" height="36" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="283.75" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="283.75" dy="0">Tienda</tspan></text><rect x="373.5" y="146" width="89.75" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="418.375" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="418.375" dy="0">APIs</tspan></text><rect x="463.25" y="146" width="448.75" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="687.625" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="687.625" dy="0">AWS: S3, EC2 y siguientes</tspan></text><line x1="14" y1="191" x2="912" y2="191" stroke="#d5dde1" stroke-width="1"/><rect x="418.375" y="200" width="67.3125" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="452.031" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="452.031" dy="0">PR/FAQ</tspan></text><rect x="485.688" y="200" width="269.25" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="620.312" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="620.312" dy="0">Servicios y Dynamo</tspan></text><rect x="754.938" y="200" width="157.062" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="833.469" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="833.469" dy="0">Despliegues</tspan></text><text x="553" y="289" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="553" dy="0">Año</tspan></text><rect x="10" y="303" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="327.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Fechas documentadas: 1997 carta a los accionistas, 14 de marzo de 2006 anuncio de S3, 24 de agosto de 2006 EC2 en beta,</tspan></text><text x="470" y="344.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2007 artículo de Dynamo, 2004 como inicio del uso de Working Backwards y 2019-2020 artículos de aislamiento y despliegue.</tspan></text><text x="470" y="361.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">1995 y las eras de la tienda vienen de fuentes secundarias. Dónde deja de valer: los cortes entre eras son síntesis del</tspan></text><text x="470" y="377.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">autor, no fechas oficiales; los carriles no implican causalidad directa.</tspan></text><text x="470" y="425.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1, F3, F5, F8, F9, F11, F12 y F14; síntesis propia de las eras.</tspan></text></svg>
