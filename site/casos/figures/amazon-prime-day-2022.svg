<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 399" width="940" height="399" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Prime Day 2022: ritmo de cuatro servicios de AWS que alimentan a la tienda</title><desc id="d">Barras horizontales en escala logarítmica con los máximos de Prime Day 2022: DynamoDB 105,2 millones de peticiones por segundo, SQS 70,5 millones de mensajes por segundo, SES 33 mil correos por segundo y EBS 11,4 billones de peticiones al día, unos 131,9 millones por segundo en promedio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="399" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Prime Day 2022: ritmo de cuatro servicios de AWS que alimentan a la tienda</tspan></text><line x1="214" y1="49" x2="214" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="201" x2="214" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">10 000</tspan></text><line x1="343.116" y1="49" x2="343.116" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="343.116" y1="201" x2="343.116" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="343.116" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="343.116" dy="0">100 000</tspan></text><line x1="472.232" y1="49" x2="472.232" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="472.232" y1="201" x2="472.232" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="472.232" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472.232" dy="0">1 000 000</tspan></text><line x1="601.348" y1="49" x2="601.348" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="601.348" y1="201" x2="601.348" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="601.348" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="601.348" dy="0">10 000 000</tspan></text><line x1="730.464" y1="49" x2="730.464" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="730.464" y1="201" x2="730.464" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="730.464" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.464" dy="0">100 000 000</tspan></text><line x1="859.58" y1="49" x2="859.58" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="201" x2="859.58" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">1 000 000 000</tspan></text><line x1="214" y1="201" x2="859.58" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">EBS (media por segundo)</tspan></text><text x="204" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">DynamoDB (pico)</tspan></text><text x="204" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">SQS (pico)</tspan></text><text x="204" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">SES (pico)</tspan></text><rect x="214" y="55" width="531.99" height="26" rx="3" fill="#102a43"/><text x="752.99" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="752.99" dy="0">131,9 M</tspan></text><rect x="214" y="93" width="519.307" height="26" rx="3" fill="#102a43"/><text x="740.307" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="740.307" dy="0">105,2 M</tspan></text><rect x="214" y="131" width="496.863" height="26" rx="3" fill="#102a43"/><text x="717.863" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="717.863" dy="0">70,5 M</tspan></text><rect x="214" y="169" width="66.9484" height="26" rx="3" fill="#102a43"/><text x="287.948" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="287.948" dy="0">33 mil</tspan></text><text x="536.79" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="536.79" dy="0">Peticiones, mensajes o correos por segundo (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="259" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: las barras no son comparables en unidad (peticiones, mensajes, correos) ni en tipo (pico frente a media diaria:</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">11,4 × 10^12 ÷ 86 400 s); sirven para ver el orden de magnitud de cada servicio. El comunicado de AWS añade que la huella</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de servidores de EC2 creció un 12 % y la huella total solo un 7 % frente al Cyber Monday anterior por el uso de</tspan></text><text x="470" y="333.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">procesadores Graviton2. Dónde deja de valer: son servicios de AWS que usa Amazon, no el rendimiento de la tienda.</tspan></text><text x="470" y="381.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Barr, «Amazon Prime Day 2022 – AWS for the Win!», AWS News Blog, 25 de julio de 2022 (F10).</tspan></text></svg>
