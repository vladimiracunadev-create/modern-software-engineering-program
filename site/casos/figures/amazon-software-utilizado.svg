<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 618" width="940" height="618" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Software de Amazon que sus propias fuentes documentan</title><desc id="d">Diagrama del software documentado de Amazon: en Dynamo, Java con mensajería por etapas, almacenes BDB y MySQL; en Prime Day, DynamoDB, SQS, SES, Lambda, Kinesis, ElastiCache, S3, Aurora y EBS; en el proceso de entrega, los sistemas internos Brazil, Apollo y Pipelines; no se publican el sistema operativo ni los marcos de la tienda.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="618" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Software de Amazon que sus propias fuentes documentan</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Almacenes y colas</tspan></text><rect x="10" y="92" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: Dynamo usó almacenes locales intercambiables:</tspan></text><text x="235" y="129.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">BDB Transactional Data Store, BDB Java Edition, MySQL o un</tspan></text><text x="235" y="146.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">búfer en memoria; la mayoría de las instancias usaba BDB</tspan></text><text x="235" y="162.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">(F1).</tspan></text><rect x="10" y="184.4" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="205.3" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: en Prime Day 2022 se citan DynamoDB, SQS, SES,</tspan></text><text x="235" y="221.94" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">S3, Aurora, ElastiCache y Kinesis como servicios que</tspan></text><text x="235" y="238.58" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">sostienen a la tienda (F10).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Lenguajes y marcos</tspan></text><rect x="480" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: Dynamo se implementó con mensajería sobre</tspan></text><text x="705" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">canales Java NIO y una tubería por etapas de tipo SEDA</tspan></text><text x="705" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">(F1).</tspan></text><rect x="480" y="167.8" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="188.7" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: el patrón de funciones sin servidor (Lambda)</tspan></text><text x="705" y="205.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">se usa en la planificación de paquetes de América del Norte</tspan></text><text x="705" y="221.98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">(F10).</tspan></text><rect x="480" y="243.6" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="264.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: lenguajes y marcos de la tienda, de los</tspan></text><text x="705" y="281.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">sistemas de pago y de la logística.</tspan></text><rect x="10" y="268.2" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="289.12" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Entrega de software</tspan></text><rect x="10" y="310.2" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="331.1" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: sistema de compilación Brazil, sistema de</tspan></text><text x="235" y="347.74" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">despliegue Apollo y la herramienta Pipelines que los une</tspan></text><text x="235" y="364.38" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">(F13).</tspan></text><rect x="10" y="386" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="406.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: alarmas agregadas, pruebas «canario» continuas</tspan></text><text x="235" y="423.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">y reversión automática (F9).</tspan></text><rect x="480" y="310.8" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="331.72" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Sistemas operativos y orquestación</tspan></text><rect x="480" y="352.8" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="373.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: sistema operativo de las flotas internas y</tspan></text><text x="705" y="390.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">orquestador propio: las fuentes no los nombran.</tspan></text><rect x="480" y="412" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="432.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: contenedores y funciones se citan como</tspan></text><text x="705" y="449.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">unidades de despliegue en los pipelines (una máquina</tspan></text><text x="705" y="466.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">virtual, un contenedor o un porcentaje de invocaciones de</tspan></text><text x="705" y="482.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">una función) (F9).</tspan></text><rect x="10" y="512.4" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="535.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cuatro grupos de tecnologías; cada afirmación lleva su fuente o la marca «no se sabe». Dónde deja de valer: los</tspan></text><text x="470" y="551.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">nombres de servicios de AWS no equivalen a la pila interna de la tienda; el artículo de Dynamo es de 2007.</tspan></text><text x="470" y="595.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1, F9, F10, F13.</tspan></text></svg>
