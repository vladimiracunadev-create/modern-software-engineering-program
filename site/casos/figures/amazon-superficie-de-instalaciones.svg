<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Superficie de instalaciones de Amazon por segmento, propia y arrendada (millones de pies cuadrados)</title><desc id="d">Barras apiladas con la superficie de instalaciones a fines de 2025: América del Norte 481,2 millones de pies cuadrados arrendados y 25,4 propios, Internacional 174,5 arrendados y 13,3 propios, AWS 28,4 arrendados y 28,5 propios; AWS es el único segmento con más superficie propia que arrendada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Superficie de instalaciones de Amazon por segmento, propia y arrendada (millones de pies cuadrados)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Arrendada</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">Propia</tspan></text><line x1="174" y1="77" x2="174" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="197" x2="174" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">0</tspan></text><line x1="407.9" y1="77" x2="407.9" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="407.9" y1="197" x2="407.9" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="407.9" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="407.9" dy="0">200</tspan></text><line x1="641.8" y1="77" x2="641.8" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="641.8" y1="197" x2="641.8" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="641.8" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="641.8" dy="0">400</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">600</tspan></text><line x1="174" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">América del Norte</tspan></text><text x="164" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">Internacional</tspan></text><text x="164" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">AWS</tspan></text><rect x="174" y="84" width="562.708" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="455.354" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="455.354" dy="0">481,2</tspan></text><rect x="736.708" y="84" width="29.7486" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="773.457" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="773.457" dy="0">506,6</tspan></text><rect x="174" y="124" width="204.077" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="276.038" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="276.038" dy="0">174,5</tspan></text><rect x="378.077" y="124" width="15.5111" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="400.588" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="400.588" dy="0">187,8</tspan></text><rect x="174" y="164" width="33.1787" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><rect x="207.179" y="164" width="33.2945" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="247.473" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="247.473" dy="0">56,8</tspan></text><text x="524.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="524.85" dy="0">Millones de pies cuadrados (31 de diciembre de 2025)</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la tienda opera sobre todo en superficie arrendada (cumplimiento, centros de datos y otros usos van agrupados) y</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">AWS reparte casi por igual entre propia y arrendada. Dónde deja de valer: el 10-K agrupa centros de datos con cumplimiento</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y no da ubicaciones ni regiones; la cifra excluye instalaciones corporativas.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Amazon, formulario 10-K de 2025, Item 2 (F17), leído con WebFetch porque el cliente automático fue bloqueado por la SEC.</tspan></text></svg>
