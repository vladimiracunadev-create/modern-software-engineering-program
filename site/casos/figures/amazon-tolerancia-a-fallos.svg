<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 566" width="940" height="566" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué pasa cuando cae cada componente en lo que Amazon documenta</title><desc id="d">Diagrama de la tolerancia a fallos documentada de Amazon por nivel: un nodo de Dynamo (traspaso con pista, árboles de Merkle), una zona de disponibilidad (sobreaprovisionamiento y estabilidad estática), una dependencia lenta (retroceso con variación y cubo de fichas), un cliente ruidoso (shuffle sharding) y un cambio defectuoso (una caja, olas y reversión automática); no se documentan pruebas de caos ni recuperación ante desastres de la tienda.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="566" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué pasa cuando cae cada componente en lo que Amazon documenta</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Cae un nodo de almacenamiento</tspan></text><rect x="10" y="92" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: la réplica se guarda con una pista en otro</tspan></text><text x="235" y="129.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">nodo y se devuelve al volver; los árboles de Merkle</tspan></text><text x="235" y="146.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">recuperan réplicas perdidas; la lectura reparadora</tspan></text><text x="235" y="162.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">actualiza réplicas atrasadas (F1).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Cae una zona de disponibilidad</tspan></text><rect x="480" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: los servicios se dimensionan para que las</tspan></text><text x="705" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">demás zonas absorban la carga; el plano de datos sigue sin</tspan></text><text x="705" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">depender del plano de control (F7).</tspan></text><rect x="10" y="192.4" width="450" height="34" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="235" y="213.32" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="235" dy="0">Una dependencia es lenta o falla</tspan></text><rect x="10" y="234.4" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="255.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: retroceso exponencial con tope y variación</tspan></text><text x="235" y="271.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">aleatoria, cubo de fichas local y reintento en un solo</tspan></text><text x="235" y="288.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">punto de la pila; se evitan los interruptores de circuito</tspan></text><text x="235" y="305.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">por su comportamiento modal (F6).</tspan></text><rect x="480" y="175.8" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="705" y="196.72" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="705" dy="0">Un cliente se comporta mal</tspan></text><rect x="480" y="217.8" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="238.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: shuffle sharding limita el impacto a una</tspan></text><text x="705" y="255.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">combinación de recursos (F8).</tspan></text><rect x="10" y="334.8" width="450" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="355.72" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="235" dy="0">Un cambio es defectuoso</tspan></text><rect x="10" y="376.8" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="397.7" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: una caja, lotes de hasta el 33 %, tiempo de</tspan></text><text x="235" y="414.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">espera y reversión automática si salta la alarma agregada</tspan></text><text x="235" y="430.98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">(F9).</tspan></text><rect x="480" y="285" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="305.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Lo que no se documenta</tspan></text><rect x="480" y="327" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="347.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: pruebas de caos o ejercicios de fallo,</tspan></text><text x="705" y="364.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">recuperación ante desastres de la tienda y degradación</tspan></text><text x="705" y="381.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">elegante de la página: ninguna de las fuentes consultadas</tspan></text><text x="705" y="397.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">las describe.</tspan></text><rect x="10" y="460.6" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="483.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cada recuadro es un componente que cae y la defensa documentada; el último recuadro lista lo que falta. Dónde deja</tspan></text><text x="470" y="500.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de valer: son mecanismos de AWS y de Dynamo; no prueban que la tienda los use de igual modo.</tspan></text><text x="470" y="543.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1, F6, F7, F8, F9.</tspan></text></svg>
