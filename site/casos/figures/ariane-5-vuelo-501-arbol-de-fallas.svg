<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: qué tuvo que coincidir para perder el vuelo</title><desc id="d">Árbol de fallas con la pérdida del vuelo 501 arriba y dos ramas necesarias: que las unidades inerciales dejaran de dar actitud, que requiere cuatro condiciones, y que el control tratara el diagnóstico como dato de vuelo, que requiere tres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: qué tuvo que coincidir para perder el vuelo</tspan></text><rect x="270" y="51" width="400" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Pérdida del vuelo 501 a los 39 s</tspan></text><circle cx="470" cy="115" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="120" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><polyline points="470,91 470,103" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="155" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="232.5" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="232.5" dy="0">A. Se pierde la información de actitud</tspan></text><line x1="470" y1="127" x2="232.5" y2="155" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="232.5" cy="217" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232.5" y="222" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232.5" dy="0">Y</tspan></text><line x1="232.5" y1="195" x2="232.5" y2="207" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="239" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="262.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Alineación activa tras el despegue</tspan></text><line x1="232.5" y1="231" x2="232.5" y2="239" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="287" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="305.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Trayectoria con velocidad horizontal cinco veces</tspan></text><text x="232.5" y="322.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">mayor</tspan></text><line x1="232.5" y1="279" x2="232.5" y2="287" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="342.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="365.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Conversión de BH sin protección</tspan></text><line x1="232.5" y1="334.28" x2="232.5" y2="342.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="390.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="413.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Las dos unidades con el mismo programa</tspan></text><line x1="232.5" y1="382.28" x2="232.5" y2="390.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="485" y="155" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="707.5" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="707.5" dy="0">B. El control ejecuta una orden absurda</tspan></text><line x1="470" y1="127" x2="707.5" y2="155" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="707.5" cy="217" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707.5" y="222" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707.5" dy="0">Y</tspan></text><line x1="707.5" y1="195" x2="707.5" y2="207" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="239" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="262.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Excepción detiene el procesador</tspan></text><line x1="707.5" y1="231" x2="707.5" y2="239" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="287" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="310.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">El diagnóstico viaja por el bus de datos</tspan></text><line x1="707.5" y1="279" x2="707.5" y2="287" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="335" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="358.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">El ordenador lo interpreta como datos de vuelo</tspan></text><line x1="707.5" y1="327" x2="707.5" y2="335" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="446.28" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: cortar una sola condición habría roto la rama. Mira que la rama A está llena de decisiones de diseño y la B</tspan></text><text x="470" y="487.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de decisiones de tratamiento de errores. Estructura lógica propia sobre la cadena que el informe establece &#x27;sin duda</tspan></text><text x="470" y="504.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">razonable&#x27;.</tspan></text><text x="470" y="552.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartado 2.1. Análisis propio, no conclusión de la comisión.</tspan></text></svg>
