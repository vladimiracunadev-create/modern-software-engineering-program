<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" width="940" height="438" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién era quién en el vuelo 501: programa, industria y lanzador</title><desc id="d">Diagrama de contexto: la ESA y el CNES promueven el programa Ariane 5 con socios industriales; el lanzador transporta la carga útil Cluster desde Kourou; la telemetría va al CNES en Toulouse y la comisión de investigación examina todo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="438" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién era quién en el vuelo 501: programa, industria y lanzador</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">ESA y CNES: programa y</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">comisión de</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">investigación</tspan></text><rect x="10" y="128.92" width="200" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Socios industriales:</tspan></text><text x="110" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">arquitecto industrial y</tspan></text><text x="110" y="181.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">proveedor de la unidad</tspan></text><text x="110" y="197.8" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">inercial</tspan></text><rect x="10" y="223.48" width="200" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="242.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Base de Kourou: campaña</tspan></text><text x="110" y="259.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">de lanzamiento y cuenta</tspan></text><text x="110" y="275.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">atrás</tspan></text><rect x="730" y="51" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Carga útil: satélites</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">científicos Cluster</tspan></text><rect x="730" y="112.28" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Telemetría a Toulouse</tspan></text><text x="830" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">(CNES)</tspan></text><rect x="730" y="173.56" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="192.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">Comisión de</tspan></text><text x="830" y="209.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">investigación: 10</tspan></text><text x="830" y="225.8" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">miembros y 5 asesores</tspan></text><rect x="280" y="51" width="370" height="250.4" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">Lanzador Ariane 5, primer vuelo de cualificación</tspan></text><rect x="300" y="91" width="330" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="109.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Sistema de control de vuelo: dos unidades</tspan></text><text x="465" y="126.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">inerciales y dos ordenadores de a bordo</tspan></text><rect x="300" y="148.28" width="330" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="465" y="167.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">Motor Vulcain y dos aceleradores de</tspan></text><text x="465" y="183.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">combustible sólido</tspan></text><rect x="300" y="205.56" width="330" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="229.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Sistema de autodestrucción</tspan></text><polyline points="210,82.96 280,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="74.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">programa</tspan></text><polyline points="210,169.2 280,169.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="161.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">contratos</tspan></text><polyline points="210,255.44 280,255.44" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="247.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">campaña</tspan></text><polyline points="650,74.64 730,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">carga</tspan></text><polyline points="650,135.92 730,135.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="127.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">datos</tspan></text><polyline points="650,205.52 730,205.52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="197.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">análisis</tspan></text><rect x="10" y="315.4" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="340.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el fallo ocurrió en una unidad que muchos actores integraban pero ninguno probaba entera con las condiciones</tspan></text><text x="470" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reales del nuevo lanzador. Cada flecha es una responsabilidad compartida.</tspan></text><text x="470" y="404.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Prólogo y apartado 1. Los nombres de las empresas proveedoras</tspan></text><text x="470" y="420" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">no figuran en el cuerpo del informe.</tspan></text></svg>
