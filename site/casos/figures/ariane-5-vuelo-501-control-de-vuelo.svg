<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 335" width="940" height="335" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo funciona el control de vuelo, de la medición al movimiento de las toberas</title><desc id="d">Flujo del control de vuelo: la unidad de referencia inercial con giróscopos láser y acelerómetros calcula ángulos y velocidades, los envía por el bus de datos al ordenador de a bordo, que ejecuta el programa de vuelo y manda por servoválvulas y actuadores hidráulicos a las toberas de los aceleradores y del motor Vulcain.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="335" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo funciona el control de vuelo, de la medición al movimiento de las toberas</tspan></text><rect x="10" y="51" width="280" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">Plataforma inercial con giróscopos</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">láser y acelerómetros</tspan></text><rect x="330" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Ordenador interno de la unidad:</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">calcula ángulos y velocidades</tspan></text><rect x="650" y="51" width="280" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="790" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">Bus de datos hacia el ordenador de</tspan></text><text x="790" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">a bordo</tspan></text><polyline points="290,74.64 330,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,74.64 650,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,98.28 790,113.28 790,113.28 790,132.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="650" y="132.28" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">Ordenador de a bordo: ejecuta el</tspan></text><text x="790" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">programa de vuelo</tspan></text><rect x="330" y="132.28" width="280" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Servoválvulas y actuadores</tspan></text><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">hidráulicos</tspan></text><rect x="10" y="132.28" width="280" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">Toberas de los dos aceleradores y</tspan></text><text x="150" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">del motor Vulcain</tspan></text><polyline points="650,155.92 610,155.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="330,155.92 290,155.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="195.56" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: toda la actitud del lanzador depende de una cadena de medición-cálculo-actuación sin humano en el bucle.</tspan></text><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cuando el dato de entrada deja de ser medición, la salida deja de ser control. Mira que la unidad inercial es el origen de</tspan></text><text x="470" y="253.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">toda la cadena.</tspan></text><text x="470" y="301.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartado 2.1. Esquema funcional propio sobre la descripción</tspan></text><text x="470" y="317" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">del informe.</tspan></text></svg>
