<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 474" width="940" height="474" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cada eslabón de la cadena y el control que lo corta</title><desc id="d">Ocho pares de causa y control propuesto: la alineación activa en vuelo, las variables sin proteger, la trayectoria fuera de los requisitos, la simulación sin la unidad real, la parada del procesador, la reserva idéntica, la revisión interna y la telemetría insuficiente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="474" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cada eslabón de la cadena y el control que lo corta</tspan></text><rect x="10" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Alineación activa en vuelo</tspan></text><rect x="10" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="153.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Apagarla al despegar (R1</tspan></text><text x="117.5" y="170.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">de la comisión)</tspan></text><polyline points="117.5,98.28 117.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="245" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Tres variables sin</tspan></text><text x="352.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">proteger</tspan></text><rect x="245" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">Revisar el rango de toda</tspan></text><text x="352.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">variable interna o de</tspan></text><text x="352.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">comunicación (R5)</tspan></text><polyline points="352.5,98.28 352.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="480" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">Trayectoria fuera de los</tspan></text><text x="587.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">requisitos</tspan></text><rect x="480" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">Incluir la trayectoria en</tspan></text><text x="587.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">las especificaciones y</tspan></text><text x="587.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">pruebas (R10)</tspan></text><polyline points="587.5,98.28 587.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="715" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">Simulación sin la unidad</tspan></text><text x="822.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">real</tspan></text><rect x="715" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">Probar con el máximo de</tspan></text><text x="822.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">equipo real y lazo cerrado</tspan></text><text x="822.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">(R2)</tspan></text><polyline points="822.5,98.28 822.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="233.48" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Procesador que se detiene</tspan></text><rect x="10" y="281.48" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="300.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Confinar excepciones a</tspan></text><text x="117.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">tareas y prever respaldos</tspan></text><text x="117.5" y="333.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">(R6)</tspan></text><polyline points="117.5,253.48 117.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="245" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Sensor que deja de dar</tspan></text><text x="352.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">datos</tspan></text><rect x="245" y="281.48" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.5" y="300.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">Obligar a seguir enviando</tspan></text><text x="352.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">datos de mejor esfuerzo</tspan></text><text x="352.5" y="333.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">(R3)</tspan></text><polyline points="352.5,253.48 352.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="480" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="233.48" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">Revisiones sin un tercero</tspan></text><rect x="480" y="281.48" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587.5" y="300.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">Revisiones con</tspan></text><text x="587.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">participantes externos al</tspan></text><text x="587.5" y="333.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">proyecto (R9)</tspan></text><polyline points="587.5,253.48 587.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="715" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822.5" y="233.48" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">Telemetría escasa</tspan></text><rect x="715" y="281.48" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822.5" y="308.76" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">Más datos al fallar un</tspan></text><text x="822.5" y="325.4" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">componente (R7)</tspan></text><polyline points="822.5,253.48 822.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="367.4" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="392.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: cada recomendación de la comisión corta un eslabón concreto. Verde es la mejora; la etiqueta R indica la</tspan></text><text x="470" y="409" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">recomendación publicada. La asignación de cada eslabón a cada R es análisis propio.</tspan></text><text x="470" y="456.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartado 4. Análisis propio, no conclusión de la comisión.</tspan></text></svg>
