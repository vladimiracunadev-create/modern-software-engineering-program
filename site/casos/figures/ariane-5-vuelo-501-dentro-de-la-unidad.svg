<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 318" width="940" height="318" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dentro de la unidad inercial: el módulo de alineación y la conversión sin protección</title><desc id="d">Componentes de la unidad inercial: el módulo de alineación de la plataforma, que solo sirve antes del despegue pero seguía activo 50 segundos después de pasar a modo de vuelo; calcula el sesgo horizontal BH; la conversión de coma flotante de 64 bits a entero de 16 bits no estaba protegida; el error de operando detiene el procesador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="318" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dentro de la unidad inercial: el módulo de alineación y la conversión sin protección</tspan></text><rect x="10" y="51" width="280" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">Modo de vuelo empieza en H0 − 3 s</tspan></text><rect x="330" y="51" width="280" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Alineación sigue activa 50 s: unos</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">40 s tras el despegue</tspan></text><rect x="650" y="51" width="280" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="790" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">Calcula el sesgo horizontal BH</tspan></text><text x="790" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">(velocidad horizontal)</tspan></text><polyline points="290,74.64 330,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,74.64 650,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,98.28 790,113.28 150,113.28 150,132.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132.28" width="280" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="150" y="151.24" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="150" dy="0">Convierte BH de coma flotante de 64</tspan></text><text x="150" y="167.88" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="150" dy="0">bits a entero con signo de 16 bits</tspan></text><rect x="330" y="132.28" width="280" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Valor mayor que el máximo del</tspan></text><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">entero: error de operando</tspan></text><rect x="650" y="132.28" width="280" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="790" y="159.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="790" dy="0">Excepción: el procesador se detiene</tspan></text><polyline points="290,155.92 330,155.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,155.92 650,155.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="195.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el módulo que falló calculaba algo inútil después del despegue. Mira que el único paso desprotegido es la</tspan></text><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conversión: otras conversiones comparables del mismo módulo sí estaban protegidas.</tspan></text><text x="470" y="284.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartado 2.1; el informe cita las instrucciones de conversión</tspan></text><text x="470" y="300" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">en código Ada.</tspan></text></svg>
