<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se sabe de la pila: lo que el informe documenta y lo que no</title><desc id="d">Capas de la pila técnica: sensores inerciales de láser documentados; ordenador interno de la unidad documentado; lenguaje Ada documentado; bus de datos documentado; procesador, sistema operativo y compilador no se publican.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se sabe de la pila: lo que el informe documenta y lo que no</tspan></text><rect x="10" y="51" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Sensores</tspan></text><rect x="270" y="51" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="74.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Giróscopos láser y acelerómetros en una plataforma &#x27;strap-down&#x27;</tspan></text><rect x="10" y="99" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="126.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Ordenador de la unidad</tspan></text><rect x="270" y="99" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="117.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Calcula ángulos y velocidades; objetivo de carga máxima del 80 %; procesador no</tspan></text><text x="600" y="134.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">identificado</tspan></text><rect x="10" y="154.28" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="177.92" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Lenguaje</tspan></text><rect x="270" y="154.28" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="177.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Ada, con instrucciones de conversión citadas por el informe</tspan></text><rect x="10" y="202.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="229.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Comunicación</tspan></text><rect x="270" y="202.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="221.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Bus de datos entre unidades y ordenadores; periodo de ciclo de 72 ms para la</tspan></text><text x="600" y="237.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">conmutación</tspan></text><rect x="10" y="257.56" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="281.2" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Actuadores</tspan></text><rect x="270" y="257.56" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="281.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Servoválvulas y actuadores hidráulicos para toberas de aceleradores y de Vulcain</tspan></text><rect x="10" y="305.56" width="250" height="47.28" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="324.52" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">Proveedor, procesador,</tspan></text><text x="135" y="341.16" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">compilador, sistema operativo</tspan></text><rect x="270" y="305.56" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="332.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">No constan en el informe; este caso no los inventa</tspan></text><rect x="10" y="368.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el informe da el nivel de detalle necesario para entender el fallo, no el de una documentación del sistema.</tspan></text><text x="470" y="410.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Verde: documentado; gris: no se sabe.</tspan></text><text x="470" y="458.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartados 2.1 y 2.2.</tspan></text></svg>
