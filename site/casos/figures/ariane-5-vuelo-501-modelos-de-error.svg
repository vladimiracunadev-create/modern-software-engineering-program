<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 417" width="940" height="417" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos modelos de error: fallo aleatorio de hardware frente a error sistemático de software</title><desc id="d">Dos columnas: el supuesto de diseño, que cualquier excepción era un fallo aleatorio de hardware que el equipo de reserva resolvería, y lo ocurrido, un error sistemático idéntico en ambos equipos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="417" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos modelos de error: fallo aleatorio de hardware frente a error sistemático de software</tspan></text><rect x="10" y="51" width="451" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="235.5" dy="0">Supuesto de diseño</tspan></text><rect x="10" y="101" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Una excepción es un fallo aleatorio de hardware</tspan></text><rect x="10" y="149" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Se informa del fallo, se guarda el contexto y se detiene la</tspan></text><text x="235.5" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">unidad</tspan></text><rect x="10" y="204.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="227.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">La reserva toma el control</tspan></text><rect x="10" y="252.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="275.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">El software es correcto hasta que se demuestre lo contrario</tspan></text><rect x="479" y="51" width="451" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="704.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="704.5" dy="0">Lo que ocurrió</tspan></text><rect x="479" y="101" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">La excepción era un error de diseño, no aleatorio</tspan></text><rect x="479" y="149" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="172.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">El mismo programa en la reserva produjo la misma excepción</tspan></text><rect x="479" y="197" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="220.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Dos unidades sanas apagadas a la vez</tspan></text><rect x="479" y="245" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">El informe defiende el criterio opuesto: asumir el software</tspan></text><text x="704.5" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">defectuoso hasta demostrar lo contrario</tspan></text><rect x="10" y="310.28" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="335.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el criterio de manejo de errores condiciona todo lo demás. Mira que el proveedor de la unidad cumplió la</tspan></text><text x="470" y="351.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">especificación recibida: la causa está en la especificación y en el modelo de fallo, no en un incumplimiento.</tspan></text><text x="470" y="399.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartado 2.2.</tspan></text></svg>
