<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 366" width="940" height="366" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Las 14 recomendaciones de la comisión, agrupadas por tema</title><desc id="d">Barras horizontales: cuatro temas de las 14 recomendaciones; cinco de diseño y manejo de errores del software, cinco de revisión y cualificación, tres de pruebas y una de organización.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="366" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Las 14 recomendaciones de la comisión, agrupadas por tema</tspan></text><line x1="294" y1="49" x2="294" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="201" x2="294" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="498.647" y1="49" x2="498.647" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="498.647" y1="201" x2="498.647" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="498.647" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="498.647" dy="0">2</tspan></text><line x1="703.293" y1="49" x2="703.293" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="703.293" y1="201" x2="703.293" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="703.293" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="703.293" dy="0">4</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="201" x2="907.94" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">6</tspan></text><line x1="294" y1="201" x2="907.94" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Diseño y tratamiento de errores</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Revisión y cualificación de software</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Pruebas y cobertura</tspan></text><text x="284" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Organización de los socios</tspan></text><rect x="294" y="55" width="511.617" height="26" rx="3" fill="#087f8c"/><text x="812.617" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="812.617" dy="0">5</tspan></text><rect x="294" y="93" width="511.617" height="26" rx="3" fill="#087f8c"/><text x="812.617" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="812.617" dy="0">5</tspan></text><rect x="294" y="131" width="306.97" height="26" rx="3" fill="#087f8c"/><text x="607.97" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607.97" dy="0">3</tspan></text><rect x="294" y="169" width="102.323" height="26" rx="3" fill="#087f8c"/><text x="403.323" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="403.323" dy="0">1</tspan></text><text x="600.97" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="600.97" dy="0">Número de recomendaciones</tspan></text><rect x="10" y="259" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La agrupación es propia: diseño (R1, R3, R6, R7, R8), revisión (R4, R5, R9, R12, R13), pruebas (R2, R10, R11), organización</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(R14). La comisión las lista sin agrupar. El recuento es 14 y está documentado.</tspan></text><text x="470" y="348.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartado 4. Agrupación propia.</tspan></text></svg>
