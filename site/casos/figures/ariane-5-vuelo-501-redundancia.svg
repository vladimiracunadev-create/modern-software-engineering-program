<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 388" width="940" height="388" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Redundancia en el control de vuelo: dos unidades iguales y dos ordenadores</title><desc id="d">Esquema de redundancia: dos unidades de referencia inercial idénticas en hardware y software, una activa y otra en reserva en caliente, y dos ordenadores de a bordo; si la activa falla y la reserva funciona, el ordenador conmuta de inmediato.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="388" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Redundancia en el control de vuelo: dos unidades iguales y dos ordenadores</tspan></text><rect x="10" y="51" width="200" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">Unidad inercial 1:</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">reserva en caliente</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">(hardware y software</tspan></text><text x="110" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">idénticos)</tspan></text><rect x="10" y="145.56" width="200" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Unidad inercial 2:</tspan></text><text x="110" y="181.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">activa</tspan></text><rect x="730" y="51" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Servoválvulas y</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">actuadores</tspan></text><rect x="730" y="112.28" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Toberas de aceleradores</tspan></text><text x="830" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">y de Vulcain</tspan></text><rect x="280" y="51" width="370" height="200" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">Control de vuelo</tspan></text><rect x="300" y="91" width="330" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="465" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">Bus de datos</tspan></text><rect x="300" y="141" width="330" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="164.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Ordenador de a bordo 1</tspan></text><rect x="300" y="191" width="330" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="214.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Ordenador de a bordo 2 (duplicado)</tspan></text><polyline points="210,91.28 280,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="83.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">datos si activa</tspan></text><polyline points="210,169.2 280,169.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="161.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">datos</tspan></text><polyline points="650,74.64 730,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">órdenes</tspan></text><polyline points="650,135.92 730,135.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="127.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">mandos</tspan></text><rect x="10" y="265" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="289.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la redundancia protege de fallos aleatorios de un equipo y no de un error de diseño que ambos comparten.</tspan></text><text x="470" y="306.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Mira que las dos unidades ejecutan el mismo programa con los mismos datos de entrada: fallan juntas, con 0,05 s de</tspan></text><text x="470" y="323.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">diferencia.</tspan></text><text x="470" y="370.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartados 2.1 y 3.1 (e y f).</tspan></text></svg>
