<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="940" height="500" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuencia del fallo, de la excepción a la autodestrucción</title><desc id="d">Diagrama de secuencia con unidad inercial de reserva, unidad inercial activa, ordenador de a bordo y toberas: la reserva se detiene, la activa se detiene, envía datos de diagnóstico, el ordenador los interpreta como vuelo, ordena toberas al extremo y el lanzador se rompe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="500" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Secuencia del fallo, de la excepción a la autodestrucción</tspan></text><rect x="57.5" y="51" width="150" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="132.5" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="132.5" dy="0">Unidad inercial 1</tspan></text><text x="132.5" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="132.5" dy="0">(reserva)</tspan></text><rect x="282.5" y="51" width="150" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="357.5" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="357.5" dy="0">Unidad inercial 2</tspan></text><text x="357.5" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="357.5" dy="0">(activa)</tspan></text><rect x="507.5" y="51" width="150" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="582.5" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="582.5" dy="0">Ordenador de a</tspan></text><text x="582.5" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="582.5" dy="0">bordo</tspan></text><rect x="732.5" y="51" width="150" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="807.5" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.5" dy="0">Toberas y</tspan></text><text x="807.5" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="807.5" dy="0">lanzador</tspan></text><line x1="132.5" y1="97" x2="132.5" y2="349" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="357.5" y1="97" x2="357.5" y2="349" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="582.5" y1="97" x2="582.5" y2="349" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="807.5" y1="97" x2="807.5" y2="349" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="7.5" y="111" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="132.5" y="129.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="132.5" dy="0">1. excepción: se detiene</tspan></text><rect x="232.5" y="145" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357.5" y="163.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357.5" dy="0">2. idem 0,05 s después</tspan></text><polyline points="357.5,198 582.5,198" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="470" y="190" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">3. envía patrón de diagnóstico</tspan></text><rect x="457.5" y="213" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="582.5" y="231.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="582.5" dy="0">4. lo lee como vuelo</tspan></text><polyline points="582.5,266 807.5,266" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="695" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="695" dy="0">5. toberas al extremo</tspan></text><rect x="682.5" y="281" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="807.5" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="807.5" dy="0">6. ángulo &gt; 20°: se rompe</tspan></text><rect x="682.5" y="315" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="807.5" y="333.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="807.5" dy="0">7. autodestrucción correcta</tspan></text><rect x="10" y="361" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="385.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: el único componente que &#x27;funcionó&#x27; correctamente fue el ordenador, y por eso la orden errónea llegó íntegra</tspan></text><text x="470" y="402.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">a las toberas. El ordenador de a bordo no pudo conmutar a la reserva porque esa unidad ya se había parado en el ciclo</tspan></text><text x="470" y="419.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">anterior de 72 milisegundos.</tspan></text><text x="470" y="466.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartado 2.1. Reconstrucción coherente con la cadena de</tspan></text><text x="470" y="482" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">eventos técnicos; el orden fino lo da la comisión.</tspan></text></svg>
