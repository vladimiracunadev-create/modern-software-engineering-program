<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 287" width="940" height="287" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde pasó y dónde se analizó: de Kourou a Toulouse</title><desc id="d">Cadena geográfica: lanzamiento en Kourou, Guayana Francesa; autodestrucción a unos 4 km de altitud; restos esparcidos en unos 12 kilómetros cuadrados de manglar; telemetría enviada al CNES en Toulouse; copia a Aérospatiale para analizar el sistema eléctrico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="287" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde pasó y dónde se analizó: de Kourou a Toulouse</tspan></text><rect x="10" y="51" width="200" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Kourou: lanzamiento a</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">las 9:33:59 hora local</tspan></text><rect x="250" y="51" width="200" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="350" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">A unos 4 km de altitud y</tspan></text><text x="350" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">1 km de la plataforma:</tspan></text><text x="350" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">autodestrucción</tspan></text><rect x="490" y="51" width="200" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">Restos en 12 km² de</tspan></text><text x="590" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">manglar y sabana (el</tspan></text><text x="590" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">informe da también 5 por</tspan></text><text x="590" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">2,5 km)</tspan></text><rect x="730" y="51" width="200" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="830" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">Telemetría a Toulouse</tspan></text><text x="830" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">(CNES) y copia a</tspan></text><text x="830" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">Aérospatiale</tspan></text><polyline points="210,91.28 250,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,91.28 490,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,91.28 730,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="147.56" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="172.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la recuperación de las dos unidades inerciales entre los restos fue lo que permitió leer sus memorias y</tspan></text><text x="470" y="189.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">confirmar la causa. Mira la nota: el informe da dos extensiones de la zona de restos, una en el apartado 1.3 y otra en las</tspan></text><text x="470" y="205.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conclusiones.</tspan></text><text x="470" y="253.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartados 1.1, 1.3 y 3.1 (j y k). Dos cifras distintas de</tspan></text><text x="470" y="269" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">superficie en el mismo informe.</tspan></text></svg>
