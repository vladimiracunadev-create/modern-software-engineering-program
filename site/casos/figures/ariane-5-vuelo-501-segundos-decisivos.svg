<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los 2,3 segundos que decidieron el vuelo: de la parada de las unidades a la ruptura</title><desc id="d">Línea de tiempo en segundos desde el inicio de la secuencia de vuelo: vuelo nominal hasta 36,7 segundos; entonces falla la unidad inercial de reserva y 0,05 segundos después la activa; el ordenador interpreta datos de diagnóstico como vuelo y las toberas llegan al extremo; a los 39 segundos el lanzador se rompe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Los 2,3 segundos que decidieron el vuelo: de la parada de las unidades a la ruptura</tspan></text><line x1="254" y1="83" x2="254" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="333" x2="254" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">30</tspan></text><line x1="385.6" y1="83" x2="385.6" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="385.6" y1="333" x2="385.6" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="385.6" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="385.6" dy="0">32</tspan></text><line x1="517.2" y1="83" x2="517.2" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="517.2" y1="333" x2="517.2" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="517.2" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="517.2" dy="0">34</tspan></text><line x1="648.8" y1="83" x2="648.8" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="648.8" y1="333" x2="648.8" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="648.8" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.8" dy="0">36</tspan></text><line x1="780.4" y1="83" x2="780.4" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="780.4" y1="333" x2="780.4" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="780.4" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="780.4" dy="0">38</tspan></text><line x1="912" y1="83" x2="912" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="333" x2="912" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">40</tspan></text><line x1="254" y1="333" x2="912" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Vuelo nominal</tspan></text><text x="244" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Unidad inercial de reserva</tspan></text><text x="244" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Unidad inercial activa</tspan></text><text x="244" y="262.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Ordenador de a bordo</tspan></text><text x="244" y="312.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Lanzador</tspan></text><line x1="694.86" y1="75" x2="694.86" y2="333" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="694.86" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="694.86" dy="0">36,7 s</tspan></text><line x1="846.2" y1="75" x2="846.2" y2="333" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="846.2" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="846.2" dy="0">39 s</tspan></text><rect x="254" y="92" width="434.28" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="471.14" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="471.14" dy="0">nominal</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="688.28" y="142" width="26.32" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="691.57" y="192" width="23.03" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="233" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><rect x="714.6" y="242" width="131.6" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="780.4" y="262.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="780.4" dy="0">órdenes</tspan></text><line x1="14" y1="283" x2="912" y2="283" stroke="#d5dde1" stroke-width="1"/><rect x="714.6" y="292" width="125.02" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="777.11" y="312.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777.11" dy="0">ángulo &gt; 20°</tspan></text><rect x="846.2" y="292" width="65.8" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="879.1" y="312.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="879.1" dy="0">rotura</tspan></text><text x="583" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="583" dy="0">Segundos desde H0 (encendido del motor Vulcain); zoom de 30 a 41 s</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los tramos de 0,4 s son tamaño de dibujo, no medida: el informe da 36,7 s para la parada, unos 0,05 s entre las dos</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">unidades, 39 s para la ruptura y &#x27;unos 40 s&#x27; de vuelo total. Lo esencial es que desde la parada hasta la ruptura pasan unos</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">2 segundos y que no hay tiempo para intervención humana alguna.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartados 1.1, 2.1 y 3.1 (e a j).</tspan></text></svg>
