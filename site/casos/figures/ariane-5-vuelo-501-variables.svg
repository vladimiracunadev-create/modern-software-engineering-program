<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete variables en riesgo de error de operando: cuatro protegidas y tres no</title><desc id="d">Barras horizontales: el análisis de vulnerabilidad encontró siete variables cuya conversión a entero podía producir error de operando; se añadió protección a cuatro y se dejaron tres sin ella, entre ellas el sesgo horizontal BH.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Siete variables en riesgo de error de operando: cuatro protegidas y tres no</tspan></text><line x1="294" y1="49" x2="294" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="163" x2="294" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="447.485" y1="49" x2="447.485" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="447.485" y1="163" x2="447.485" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="447.485" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="447.485" dy="0">2</tspan></text><line x1="600.97" y1="49" x2="600.97" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="600.97" y1="163" x2="600.97" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="600.97" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600.97" dy="0">4</tspan></text><line x1="754.455" y1="49" x2="754.455" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="754.455" y1="163" x2="754.455" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="754.455" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="754.455" dy="0">6</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="163" x2="907.94" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">8</tspan></text><line x1="294" y1="163" x2="907.94" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Variables en riesgo analizadas</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Protegidas en el código Ada</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Sin protección (incluye BH)</tspan></text><rect x="294" y="55" width="537.197" height="26" rx="3" fill="#c0432f"/><text x="838.197" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="838.197" dy="0">7</tspan></text><rect x="294" y="93" width="306.97" height="26" rx="3" fill="#c0432f"/><text x="607.97" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="607.97" dy="0">4</tspan></text><rect x="294" y="131" width="230.227" height="26" rx="3" fill="#c0432f"/><text x="531.227" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="531.227" dy="0">3</tspan></text><text x="600.97" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="600.97" dy="0">Número de variables</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La razón dada fue el objetivo de carga máxima del 80 % para el ordenador de la unidad y que para las tres restantes se</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">razonó que estaban limitadas físicamente o con gran margen; en BH ese razonamiento resultó erróneo. La decisión, dice el</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">informe, se tomó conjuntamente por los socios y no se documentó donde un revisor externo la viera.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartado 2.2.</tspan></text></svg>
