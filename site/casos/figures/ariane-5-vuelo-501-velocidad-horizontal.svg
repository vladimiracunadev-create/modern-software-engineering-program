<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 318" width="940" height="318" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Por qué la variable se salió de rango: la velocidad horizontal crecía cinco veces más rápido</title><desc id="d">Barras con valor relativo: la velocidad horizontal de Ariane 5 se acumula cinco veces más rápido que la de Ariane 4 durante los primeros 40 segundos, con Ariane 4 tomada como uno.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="318" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Por qué la variable se salió de rango: la velocidad horizontal crecía cinco veces más rápido</tspan></text><line x1="344" y1="49" x2="344" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="344" y1="137" x2="344" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="344" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="344" dy="0">0</tspan></text><line x1="456.788" y1="49" x2="456.788" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="456.788" y1="137" x2="456.788" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="456.788" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="456.788" dy="0">1</tspan></text><line x1="569.576" y1="49" x2="569.576" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="569.576" y1="137" x2="569.576" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="569.576" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="569.576" dy="0">2</tspan></text><line x1="682.364" y1="49" x2="682.364" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="682.364" y1="137" x2="682.364" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="682.364" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682.364" dy="0">3</tspan></text><line x1="795.152" y1="49" x2="795.152" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="795.152" y1="137" x2="795.152" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="795.152" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795.152" dy="0">4</tspan></text><line x1="907.94" y1="49" x2="907.94" y2="137" stroke="#d5dde1" stroke-width="1"/><line x1="907.94" y1="137" x2="907.94" y2="142" stroke="#5b7280" stroke-width="1.4"/><text x="907.94" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="907.94" dy="0">5</tspan></text><line x1="344" y1="137" x2="907.94" y2="137" stroke="#5b7280" stroke-width="1.6"/><text x="334" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Ariane 4 (límite de la variable nunca</tspan></text><text x="334" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">alcanzado)</tspan></text><text x="334" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="334" dy="0">Ariane 5 (límite superado antes de 40 s)</tspan></text><rect x="344" y="55" width="112.788" height="32" rx="3" fill="#c0432f"/><text x="463.788" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="463.788" dy="0">1</tspan></text><rect x="344" y="99" width="563.94" height="32" rx="3" fill="#c0432f"/><text x="914.94" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="914.94" dy="0">5</tspan></text><text x="625.97" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="625.97" dy="0">Velocidad horizontal acumulada, relativa (Ariane 4 = 1)</tspan></text><rect x="10" y="195" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="219.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El informe dice &#x27;cinco veces más rápida&#x27; y no publica el valor de BH, el límite exacto ni la trayectoria. La barra es la</tspan></text><text x="470" y="236.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">razón documentada, no una medición. Lo importante: el diseño era correcto para la trayectoria de Ariane 4 con margen, y el</tspan></text><text x="470" y="253.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">margen no se trasladó a una trayectoria distinta.</tspan></text><text x="470" y="300.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe de la comisión de Ariane 501 (19 de julio de 1996). Apartado 3.1 (o, p).</tspan></text></svg>
