<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del comando al reinicio, en siete hitos</title><desc id="d">Eje no proporcional con siete hitos: a las 9:37 se ejecuta el comando; el panel de estado no se puede actualizar; a las 11:37 se actualiza; a las 12:26 el índice atiende GET, LIST y DELETE; a las 13:18 el índice se recupera; a las 13:54 la ubicación y S3 vuelven a la normalidad; el resumen de AWS anuncia cambios.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Del comando al reinicio, en siete hitos</tspan></text><line x1="30" y1="195" x2="910" y2="195" stroke="#32505f" stroke-width="2"/><line x1="80" y1="195" x2="80" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="80" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="80" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="80" dy="0"></tspan></text><rect x="6" y="55" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="91" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="91" dy="0">9:37 PST: se ejecuta</tspan></text><text x="91" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="91" dy="0">el comando y se</tspan></text><text x="91" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="91" dy="0">retira más capacidad</tspan></text><line x1="210" y1="195" x2="210" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="210" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="210" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="210" dy="0"></tspan></text><rect x="125" y="235" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="210" y="272" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="210" dy="0">Índice y ubicación</tspan></text><text x="210" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="210" dy="0">necesitan un</tspan></text><text x="210" y="305.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="210" dy="0">reinicio completo</tspan></text><line x1="340" y1="195" x2="340" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="340" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="340" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="340" dy="0"></tspan></text><rect x="255" y="55" width="170" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="340" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="340" dy="0">11:37: se puede</tspan></text><text x="340" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="340" dy="0">actualizar el panel</tspan></text><text x="340" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="340" dy="0">de estado</tspan></text><line x1="470" y1="195" x2="470" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="470" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0"></tspan></text><rect x="385" y="235" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="272" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">12:26: el índice</tspan></text><text x="470" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">atiende GET, LIST y</tspan></text><text x="470" y="305.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">DELETE</tspan></text><line x1="600" y1="195" x2="600" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="600" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="600" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="600" dy="0"></tspan></text><rect x="515" y="55" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="600" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="600" dy="0">13:18: el índice,</tspan></text><text x="600" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="600" dy="0">recuperado del todo</tspan></text><line x1="730" y1="195" x2="730" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="730" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="730" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="730" dy="0"></tspan></text><rect x="645" y="235" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="730" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="730" dy="0">13:54: la ubicación</tspan></text><text x="730" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="730" dy="0">termina; S3 normal</tspan></text><line x1="860" y1="195" x2="860" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="860" cy="195" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="860" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="860" dy="0"></tspan></text><rect x="764" y="55" width="170" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">Resumen: cambios en</tspan></text><text x="849" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">herramienta, índice</tspan></text><text x="849" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">y panel</tspan></text><rect x="10" y="365" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="389.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el incidente duró 4 h 17 min desde el comando, con un primer tramo de unas dos horas en que el panel de</tspan></text><text x="470" y="406.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estado no pudo actualizarse. Mira que los hitos no están a escala de tiempo.</tspan></text><text x="470" y="454.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017).</tspan></text></svg>
