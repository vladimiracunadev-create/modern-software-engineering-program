<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 319" width="940" height="319" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El comando y su entrada: de un cambio pequeño a una retirada grande</title><desc id="d">Cadena del comando: un miembro autorizado del equipo, con un procedimiento establecido, ejecuta un comando para retirar unos pocos servidores de un subsistema de facturación; una de las entradas se introduce mal; se retira un conjunto mayor de servidores del previsto; los servidores retirados soportaban otros dos subsistemas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="319" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El comando y su entrada: de un cambio pequeño a una retirada grande</tspan></text><rect x="10" y="51" width="280" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">9:37 PST: se depura la facturación</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">y se ejecuta un comando con un</tspan></text><text x="150" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">procedimiento establecido</tspan></text><rect x="330" y="51" width="280" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El comando debía retirar pocos</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">servidores de un subsistema de</tspan></text><text x="470" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">facturación</tspan></text><rect x="650" y="51" width="280" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="790" y="78.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="790" dy="0">Una de las entradas se introduce</tspan></text><text x="790" y="94.92" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="790" dy="0">mal</tspan></text><polyline points="290,82.96 330,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,82.96 650,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,114.92 790,129.92 150,129.92 150,148.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="148.92" width="280" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="150" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">Se retira un conjunto mayor:</tspan></text><text x="150" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">soportaban el índice y la ubicación</tspan></text><rect x="330" y="148.92" width="280" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="470" dy="0">Ambos subsistemas necesitan un</tspan></text><text x="470" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="470" dy="0">reinicio completo</tspan></text><polyline points="290,172.56 330,172.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="212.2" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la operación era rutinaria y legítima, y la herramienta aceptó una entrada que retiraba demasiada capacidad</tspan></text><text x="470" y="253.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">demasiado rápido. Mira la tercera caja: el fallo es de entrada, la causa es que la herramienta no la acotaba.</tspan></text><text x="470" y="301.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017).</tspan></text></svg>
