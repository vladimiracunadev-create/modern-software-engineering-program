<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 436" width="940" height="436" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">S3 en el centro de otros servicios de la región</title><desc id="d">Diagrama de contexto: los clientes y otros servicios de AWS en US-EAST-1 usan la API de S3 para leer, listar, escribir y borrar objetos; el subsistema de índice guarda los metadatos y la ubicación de todos los objetos; el subsistema de ubicación asigna almacenamiento a objetos nuevos; la consola, EC2, EBS y Lambda dependen de S3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="436" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">S3 en el centro de otros servicios de la región</tspan></text><rect x="10" y="51" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Clientes de S3 y sus</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">aplicaciones</tspan></text><rect x="10" y="112.28" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">Servicios de AWS que</tspan></text><text x="110" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">usan S3: consola, EC2,</tspan></text><text x="110" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">EBS y Lambda</tspan></text><rect x="730" y="51" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Datos de los objetos en</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">almacenamiento</tspan></text><rect x="730" y="112.28" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">Panel de estado de AWS</tspan></text><text x="830" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">(SHD), que dependía de</tspan></text><text x="830" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">S3</tspan></text><rect x="730" y="190.2" width="200" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="209.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">Equipo de S3 y sus</tspan></text><text x="830" y="225.8" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">herramientas operativas</tspan></text><rect x="280" y="51" width="370" height="264.56" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">S3 en US-EAST-1</tspan></text><rect x="300" y="91" width="330" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">API: GET, LIST, PUT y DELETE</tspan></text><rect x="300" y="141" width="330" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="159.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Subsistema de índice: metadatos y</tspan></text><text x="465" y="176.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">ubicación de todos los objetos</tspan></text><rect x="300" y="198.28" width="330" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="217.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Subsistema de ubicación: asigna</tspan></text><text x="465" y="233.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">almacenamiento a objetos nuevos</tspan></text><rect x="300" y="255.56" width="330" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="465" y="279.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">Subsistema de facturación</tspan></text><polyline points="210,74.64 280,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">usan</tspan></text><polyline points="210,144.24 280,144.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="136.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">dependen</tspan></text><polyline points="650,74.64 730,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">guarda</tspan></text><polyline points="650,144.24 730,144.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="136.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">informa</tspan></text><polyline points="650,213.84 730,213.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="205.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">opera</tspan></text><rect x="10" y="329.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="354.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el índice es necesario para servir todas las peticiones y la ubicación necesita el índice. Mira que los</tspan></text><text x="470" y="371.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">servicios que dependen de S3 forman una segunda capa de usuarios.</tspan></text><text x="470" y="418.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017).</tspan></text></svg>
