<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 382" width="940" height="382" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto tardó cada recuperación desde el comando</title><desc id="d">Barras con los minutos desde las 9:37 PST hasta cada hito de la recuperación: el índice empieza a atender peticiones a los 169 minutos, se recupera del todo a los 221 y la ubicación a los 257; el panel de estado se pudo actualizar a los 120.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="382" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto tardó cada recuperación desde el comando</tspan></text><line x1="324" y1="49" x2="324" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="201" x2="324" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="437.564" y1="49" x2="437.564" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="437.564" y1="201" x2="437.564" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="437.564" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="437.564" dy="0">60</tspan></text><line x1="551.128" y1="49" x2="551.128" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="551.128" y1="201" x2="551.128" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="551.128" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="551.128" dy="0">120</tspan></text><line x1="664.692" y1="49" x2="664.692" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="664.692" y1="201" x2="664.692" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="664.692" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="664.692" dy="0">180</tspan></text><line x1="778.256" y1="49" x2="778.256" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="778.256" y1="201" x2="778.256" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="778.256" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="778.256" dy="0">240</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="201" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="201" x2="891.82" y2="206" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">300</tspan></text><line x1="324" y1="201" x2="891.82" y2="201" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Panel de estado actualizable (11:37)</tspan></text><text x="314" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Índice sirve GET, LIST y DELETE (12:26)</tspan></text><text x="314" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Índice recuperado del todo (13:18)</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">S3 normal con la ubicación (13:54)</tspan></text><rect x="324" y="55" width="227.128" height="26" rx="3" fill="#102a43"/><text x="558.128" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="558.128" dy="0">120</tspan></text><rect x="324" y="93" width="319.872" height="26" rx="3" fill="#102a43"/><text x="650.872" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="650.872" dy="0">169</tspan></text><rect x="324" y="131" width="418.294" height="26" rx="3" fill="#102a43"/><text x="749.294" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="749.294" dy="0">221</tspan></text><rect x="324" y="169" width="486.432" height="26" rx="3" fill="#102a43"/><text x="817.432" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="817.432" dy="0">257</tspan></text><text x="607.91" y="245" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="607.91" dy="0">Minutos desde las 9:37 PST</tspan></text><rect x="10" y="259" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Son restas propias sobre las horas del resumen de AWS. Cuatro horas y diecisiete minutos separan el comando de la</tspan></text><text x="470" y="300.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">normalidad. AWS atribuye la lentitud a que no había reiniciado por completo el índice ni la ubicación en regiones grandes</tspan></text><text x="470" y="317.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">desde hacía años y a que la validación de integridad de los metadatos tardó más de lo previsto.</tspan></text><text x="470" y="364.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017).</tspan></text></svg>
