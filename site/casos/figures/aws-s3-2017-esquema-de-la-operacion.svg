<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 254" width="940" height="254" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema de la operación: S3 como servicio base de una región</title><desc id="d">Esquema de la operación: S3 ofrece almacenamiento de objetos con alta disponibilidad; otros servicios de la región lo usan para guardar datos y para operar; un fallo del servicio base se propaga a los que lo usan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="254" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema de la operación: S3 como servicio base de una región</tspan></text><rect x="10" y="51" width="200" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">S3 ofrece almacenamiento</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">de objetos y una larga</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">trayectoria de</tspan></text><text x="110" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">disponibilidad</tspan></text><rect x="250" y="51" width="200" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="350" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">Clientes y otros</tspan></text><text x="350" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">servicios construyen</tspan></text><text x="350" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="350" dy="0">sobre S3</tspan></text><rect x="490" y="51" width="200" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">Los subsistemas se</tspan></text><text x="590" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">diseñan para que retirar</tspan></text><text x="590" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">capacidad sea una</tspan></text><text x="590" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">operación normal</tspan></text><rect x="730" y="51" width="200" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Un fallo del servicio</tspan></text><text x="830" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">base se propaga a toda</tspan></text><text x="830" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">la región</tspan></text><polyline points="210,91.28 250,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,91.28 490,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,91.28 730,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="147.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="172.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: AWS dice estar orgullosa de su trayectoria de disponibilidad con S3 y reconoce lo críticos que son sus</tspan></text><text x="470" y="189.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">servicios para los clientes. El resumen no da cifras de clientes afectados ni de pérdidas; este caso no las inventa.</tspan></text><text x="470" y="236.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017).</tspan></text></svg>
