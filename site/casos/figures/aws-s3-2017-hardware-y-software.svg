<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 483" width="940" height="483" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se sabe de la pila técnica</title><desc id="d">Capas de lo que consta: subsistemas de índice, ubicación y facturación de S3; la API; servicios dependientes como EC2, EBS y Lambda; el panel de estado; lenguaje, hardware y arquitectura interna no se publican.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="483" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se sabe de la pila técnica</tspan></text><rect x="10" y="51" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">API</tspan></text><rect x="270" y="51" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="74.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">GET, LIST, PUT y DELETE de S3</tspan></text><rect x="10" y="99" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="126.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Subsistemas</tspan></text><rect x="270" y="99" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="117.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Índice (metadatos y ubicación de objetos), ubicación (asignación de almacenamiento) y</tspan></text><text x="600" y="134.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">facturación</tspan></text><rect x="10" y="154.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="181.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Técnica de diseño</tspan></text><rect x="270" y="154.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="173.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Partición de servicios en celdas para limitar el radio de impacto y mejorar la</tspan></text><text x="600" y="189.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">recuperación</tspan></text><rect x="10" y="209.56" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="233.2" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Servicios dependientes</tspan></text><rect x="270" y="209.56" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="233.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Consola de S3, EC2, EBS con instantáneas en S3 y Lambda</tspan></text><rect x="10" y="257.56" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="284.84" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Panel de estado</tspan></text><rect x="270" y="257.56" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="276.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Consola de administración con dependencia de S3; texto de aviso y Twitter como canales</tspan></text><text x="600" y="293.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">alternativos</tspan></text><rect x="10" y="312.84" width="250" height="47.28" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="331.8" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">Hardware, lenguajes, número de</tspan></text><text x="135" y="348.44" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">servidores, centros de datos</tspan></text><rect x="270" y="312.84" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="340.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">No constan en el resumen; este caso no los inventa</tspan></text><rect x="10" y="376.12" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="401.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el resumen cuenta el diseño necesario para entender el incidente, no una documentación del sistema. Verde:</tspan></text><text x="470" y="417.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">documentado; gris: no se sabe.</tspan></text><text x="470" y="465.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017).</tspan></text></svg>
