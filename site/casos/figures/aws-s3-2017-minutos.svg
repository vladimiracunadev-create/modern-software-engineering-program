<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 464" width="940" height="464" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">28 de febrero de 2017 en minutos: del comando a la normalidad</title><desc id="d">Línea de tiempo en minutos desde las 9:37 PST: el comando se ejecuta a las 9:37; el panel de estado no puede actualizarse hasta las 11:37; el índice empieza a atender GET, LIST y DELETE a las 12:26; el índice se recupera del todo a las 13:18; la ubicación termina a las 13:54 y S3 opera con normalidad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="464" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">28 de febrero de 2017 en minutos: del comando a la normalidad</tspan></text><line x1="224" y1="83" x2="224" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="283" x2="224" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="300.444" y1="83" x2="300.444" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="300.444" y1="283" x2="300.444" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="300.444" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300.444" dy="0">30</tspan></text><line x1="376.889" y1="83" x2="376.889" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="376.889" y1="283" x2="376.889" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="376.889" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="376.889" dy="0">60</tspan></text><line x1="453.333" y1="83" x2="453.333" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="453.333" y1="283" x2="453.333" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="453.333" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="453.333" dy="0">90</tspan></text><line x1="529.778" y1="83" x2="529.778" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="529.778" y1="283" x2="529.778" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="529.778" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="529.778" dy="0">120</tspan></text><line x1="606.222" y1="83" x2="606.222" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="606.222" y1="283" x2="606.222" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="606.222" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="606.222" dy="0">150</tspan></text><line x1="682.667" y1="83" x2="682.667" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="682.667" y1="283" x2="682.667" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="682.667" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="682.667" dy="0">180</tspan></text><line x1="759.111" y1="83" x2="759.111" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="759.111" y1="283" x2="759.111" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="759.111" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="759.111" dy="0">210</tspan></text><line x1="835.556" y1="83" x2="835.556" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="835.556" y1="283" x2="835.556" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="835.556" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.556" dy="0">240</tspan></text><line x1="912" y1="83" x2="912" y2="283" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="283" x2="912" y2="288" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="304" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">270</tspan></text><line x1="224" y1="283" x2="912" y2="283" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">S3 sin servir peticiones</tspan></text><text x="214" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Índice reiniciándose</tspan></text><text x="214" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Ubicación (PUT)</tspan></text><text x="214" y="262.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Panel de estado (SHD)</tspan></text><line x1="529.778" y1="75" x2="529.778" y2="283" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="529.778" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="529.778" dy="0">11:37</tspan></text><line x1="654.637" y1="75" x2="654.637" y2="283" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="654.637" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="654.637" dy="0">12:26</tspan></text><line x1="787.141" y1="75" x2="787.141" y2="283" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="787.141" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="787.141" dy="0">13:18</tspan></text><line x1="878.874" y1="75" x2="878.874" y2="283" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="878.874" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="878.874" dy="0">13:54</tspan></text><rect x="224" y="92" width="430.637" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="439.319" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="439.319" dy="0">12:26</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="224" y="142" width="563.141" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="505.57" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="505.57" dy="0">13:18</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="787.141" y="192" width="91.7333" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="833.007" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="833.007" dy="0">13:54</tspan></text><line x1="14" y1="233" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><rect x="224" y="242" width="305.778" height="32" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="376.889" y="262.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="376.889" dy="0">11:37</tspan></text><text x="568" y="327" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="568" dy="0">Minutos desde las 9:37 PST</tspan></text><rect x="10" y="341" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="365.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las horas son las del resumen de AWS; los minutos son restas propias: 9:37 a 12:26 = 169, a 13:18 = 221 y a 13:54 = 257. La</tspan></text><text x="470" y="382.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">primera barra no dice que no se pudiera nada hasta las 12:26: dice que ahí empezó el índice a servir GET, LIST y DELETE. El</tspan></text><text x="470" y="399.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resumen no da una hora de fin del primer síntoma visible para los clientes.</tspan></text><text x="470" y="446.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017).</tspan></text></svg>
