<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 319" width="940" height="319" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Por qué el reinicio tardó más de lo esperado</title><desc id="d">Cadena del reinicio: los subsistemas se diseñaron para tolerar la retirada de capacidad; no se habían reiniciado por completo en regiones grandes desde hacía años; S3 creció mucho; reiniciar y validar la integridad de los metadatos llevó más tiempo del previsto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="319" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Por qué el reinicio tardó más de lo esperado</tspan></text><rect x="10" y="51" width="280" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">Diseño: tolerar la retirada o el</tspan></text><text x="150" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">fallo de mucha capacidad</tspan></text><rect x="330" y="51" width="280" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Retirar capacidad es una operación</tspan></text><text x="470" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">habitual desde el lanzamiento</tspan></text><rect x="650" y="51" width="280" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="790" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">Hace años que no se reinicia por</tspan></text><text x="790" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">completo el índice ni la ubicación</tspan></text><text x="790" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">en regiones grandes</tspan></text><polyline points="290,82.96 330,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,82.96 650,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,114.92 790,129.92 150,129.92 150,148.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="148.92" width="280" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="150" y="176.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">S3 ha crecido muchísimo</tspan></text><rect x="330" y="148.92" width="280" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Reiniciar y validar los metadatos</tspan></text><text x="470" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">tarda más de lo previsto</tspan></text><polyline points="290,172.56 330,172.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="212.2" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: una operación de recuperación que no se ejerce a escala real puede tardar mucho más de lo medido cuando era</tspan></text><text x="470" y="253.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pequeña. Mira la tercera caja: lo que no se ha ensayado se vuelve incierto con el crecimiento.</tspan></text><text x="470" y="301.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017).</tspan></text></svg>
