<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 432" width="940" height="432" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se vio afectado además de S3</title><desc id="d">Dos columnas: los servicios de AWS en US-EAST-1 que dependen de S3 y se vieron afectados, y la herramienta de comunicación, el panel de estado, que también dependía de S3 y no se pudo actualizar hasta las 11:37.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="432" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se vio afectado además de S3</tspan></text><rect x="10" y="51" width="451" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="235.5" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="235.5" dy="0">Servicios afectados mientras la API de S3 no estaba</tspan></text><text x="235.5" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="235.5" dy="0">disponible</tspan></text><rect x="10" y="108.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="131.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Consola de S3</tspan></text><rect x="10" y="156.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="179.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Lanzamiento de instancias nuevas de EC2</tspan></text><rect x="10" y="204.28" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="223.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Volúmenes de EBS cuando se necesitaban datos de una</tspan></text><text x="235.5" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">instantánea en S3</tspan></text><rect x="10" y="259.56" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="283.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">AWS Lambda</tspan></text><rect x="479" y="51" width="451" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="704.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="704.5" dy="0">La comunicación del incidente</tspan></text><rect x="479" y="101" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">El panel de estado (SHD) dependía de S3 en su consola de</tspan></text><text x="704.5" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">administración</tspan></text><rect x="479" y="156.28" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Hasta las 11:37 no se pudo actualizar el estado de cada</tspan></text><text x="704.5" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">servicio</tspan></text><rect x="479" y="211.56" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Se usó el canal de Twitter de AWS y el texto de un aviso en</tspan></text><text x="704.5" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">el panel</tspan></text><rect x="479" y="266.84" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="290.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Ahora la consola del panel funciona en varias regiones</tspan></text><rect x="10" y="324.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="349.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la dependencia de un servicio base se extiende a lo que debe avisar de que ese servicio falla. Mira la</tspan></text><text x="470" y="366.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">segunda columna: la herramienta para informar dependía de lo que estaba roto.</tspan></text><text x="470" y="414.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: AWS, resumen oficial de la interrupción de S3 en US-EAST-1 (2017).</tspan></text></svg>
