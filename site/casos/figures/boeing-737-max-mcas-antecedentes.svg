<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 488" width="940" height="488" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la competencia de 2010 al regreso del servicio en 2020, en ocho hitos</title><desc id="d">Eje no proporcional con ocho hitos: Airbus lanza el A320neo en diciembre de 2010; Boeing anuncia el 737 MAX en agosto de 2011; la certificación se solicita el 30 de junio de 2012; se certifica el 8 de marzo de 2017; el primer vuelo comercial es en mayo de 2017; accidentes el 29 de octubre de 2018 y el 10 de marzo de 2019; la FAA anula la prohibición el 18 de noviembre de 2020.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="488" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la competencia de 2010 al regreso del servicio en 2020, en ocho hitos</tspan></text><line x1="30" y1="195" x2="910" y2="195" stroke="#32505f" stroke-width="2"/><line x1="80" y1="195" x2="80" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="80" cy="195" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="80" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="80" dy="0"></tspan></text><rect x="6" y="55" width="170" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="91" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">Dic 2010: Airbus</tspan></text><text x="91" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">lanza el A320neo</tspan></text><line x1="191.429" y1="195" x2="191.429" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="191.429" cy="195" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="191.429" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="191.429" dy="0"></tspan></text><rect x="106.429" y="235" width="170" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="191.429" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="191.429" dy="0">Ago 2011: Boeing</tspan></text><text x="191.429" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="191.429" dy="0">anuncia el 737 MAX</tspan></text><line x1="302.857" y1="195" x2="302.857" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="302.857" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="302.857" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="302.857" dy="0"></tspan></text><rect x="217.857" y="55" width="170" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="302.857" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="302.857" dy="0">30 jun 2012: se</tspan></text><text x="302.857" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="302.857" dy="0">solicita la</tspan></text><text x="302.857" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="302.857" dy="0">certificación</tspan></text><line x1="414.286" y1="195" x2="414.286" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="414.286" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="414.286" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="414.286" dy="0"></tspan></text><rect x="329.286" y="235" width="170" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="414.286" y="272" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="414.286" dy="0">8 mar 2017:</tspan></text><text x="414.286" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="414.286" dy="0">certificación del</tspan></text><text x="414.286" y="305.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="414.286" dy="0">737-8</tspan></text><line x1="525.714" y1="195" x2="525.714" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="525.714" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525.714" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="525.714" dy="0"></tspan></text><rect x="440.714" y="55" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="525.714" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525.714" dy="0">Mayo 2017: primer</tspan></text><text x="525.714" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525.714" dy="0">servicio con</tspan></text><text x="525.714" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="525.714" dy="0">pasajeros</tspan></text><line x1="637.143" y1="195" x2="637.143" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="637.143" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="637.143" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="637.143" dy="0"></tspan></text><rect x="552.143" y="235" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="637.143" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="637.143" dy="0">29 oct 2018: JT610</tspan></text><line x1="748.571" y1="195" x2="748.571" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="748.571" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="748.571" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="748.571" dy="0"></tspan></text><rect x="663.571" y="55" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="748.571" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="748.571" dy="0">10 mar 2019: ET302;</tspan></text><text x="748.571" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="748.571" dy="0">el 13, prohibición</tspan></text><text x="748.571" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="748.571" dy="0">de la FAA</tspan></text><line x1="860" y1="195" x2="860" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="860" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="860" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="860" dy="0"></tspan></text><rect x="764" y="235" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">18 nov 2020: la FAA</tspan></text><text x="849" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">anula la prohibición</tspan></text><rect x="10" y="365" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="389.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: de la solicitud a la certificación pasaron casi cinco años, y del primer servicio con pasajeros al primer</tspan></text><text x="470" y="406.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">accidente, diecisiete meses. Mira que la prohibición duró unos veinte meses.</tspan></text><text x="470" y="454.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Transporte de la Cámara (sep 2020). Fuente: JATR, informe a la FAA (oct</tspan></text><text x="470" y="470" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">2019). Fuente: FAA, cronología del 737 MAX.</tspan></text></svg>
