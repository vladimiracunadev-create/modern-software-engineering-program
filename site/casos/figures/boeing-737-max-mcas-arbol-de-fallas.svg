<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: qué tuvo que coincidir para perder un avión</title><desc id="d">Árbol de fallas con la pérdida de control tras activaciones repetidas de MCAS: una rama es que MCAS reciba un ángulo de ataque erróneo, con tres condiciones, y la otra es que la tripulación no corte el sistema a tiempo, con cuatro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: qué tuvo que coincidir para perder un avión</tspan></text><rect x="270" y="51" width="400" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Pérdida de control tras activaciones repetidas</tspan></text><circle cx="470" cy="115" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="120" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><polyline points="470,91 470,103" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="155" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="232.5" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="232.5" dy="0">A. MCAS actúa con un dato erróneo</tspan></text><line x1="470" y1="127" x2="232.5" y2="155" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="232.5" cy="217" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232.5" y="222" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232.5" dy="0">Y</tspan></text><line x1="232.5" y1="195" x2="232.5" y2="207" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="239" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="262.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Un único sensor alimenta MCAS</tspan></text><line x1="232.5" y1="231" x2="232.5" y2="239" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="287" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="305.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">El sensor entrega un valor erróneo (sesgo de 21°</tspan></text><text x="232.5" y="322.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">en JT610; discutida su causa en ET302)</tspan></text><line x1="232.5" y1="279" x2="232.5" y2="287" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="342.28" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="361.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Sin aviso que lo señale al piloto ni al</tspan></text><text x="232.5" y="377.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">mantenimiento</tspan></text><line x1="232.5" y1="334.28" x2="232.5" y2="342.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="485" y="155" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="707.5" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="707.5" dy="0">B. La tripulación no lo corta a tiempo</tspan></text><line x1="470" y1="127" x2="707.5" y2="155" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="707.5" cy="217" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707.5" y="222" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707.5" dy="0">Y</tspan></text><line x1="707.5" y1="195" x2="707.5" y2="207" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="239" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="262.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Indicaciones múltiples y simultáneas</tspan></text><line x1="707.5" y1="231" x2="707.5" y2="239" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="287" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="310.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">MCAS ausente de los manuales y de la formación</tspan></text><line x1="707.5" y1="279" x2="707.5" y2="287" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="335" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="358.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Reactivación tras la compensación del piloto</tspan></text><line x1="707.5" y1="327" x2="707.5" y2="335" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="383" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="406.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Sin tiempo ni margen de altura</tspan></text><line x1="707.5" y1="375" x2="707.5" y2="383" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="439" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: cualquier condición cortada habría roto el árbol. Mira que la rama A es de diseño y mantenimiento y la B de</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">información y factores humanos. Estructura lógica propia sobre lo que los informes establecen.</tspan></text><text x="470" y="528.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: KNKT, informe final JT610 (25 oct 2019). Fuente: EAIB, informe final ET302 (dic 2022). Análisis propio, no conclusión de</tspan></text><text x="470" y="544" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">las investigaciones.</tspan></text></svg>
