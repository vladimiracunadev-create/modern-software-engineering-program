<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 369" width="940" height="369" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lion Air JT610 en siete eslabones: del sensor al mar de Java</title><desc id="d">Siete eslabones: sensor reparado con calibración errónea, instalación sin detectar el error, vuelo anterior con MCAS activo y cortado por la tripulación, informe de vuelo sin la parada del agitador ni el corte del compensador, vuelo JT610 con los mismos síntomas, checklist de velocidad no fiable sin identificar el desbocamiento, impacto 13 minutos después del despegue.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="369" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lion Air JT610 en siete eslabones: del sensor al mar de Java</tspan></text><rect x="10" y="51" width="200" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Reparación previa del</tspan></text><text x="110" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">sensor con calibración</tspan></text><text x="110" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">errónea</tspan></text><rect x="250" y="51" width="200" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="350" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">Instalación en Denpasar</tspan></text><text x="350" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">el 28 de octubre sin</tspan></text><text x="350" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">detectar el sesgo</tspan></text><rect x="490" y="51" width="200" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">Vuelo Denpasar-Yakarta:</tspan></text><text x="590" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">MCAS activo; la</tspan></text><text x="590" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">tripulación corta el</tspan></text><text x="590" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">compensador</tspan></text><rect x="730" y="51" width="200" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">Informe de vuelo sin el</tspan></text><text x="830" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">agitador continuo ni el</tspan></text><text x="830" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">corte del compensador</tspan></text><polyline points="210,91.28 250,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,91.28 490,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,91.28 730,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="830,131.56 830,146.56 110,146.56 110,165.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="165.56" width="200" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">29 de octubre: JT610 con</tspan></text><text x="110" y="217.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">los mismos síntomas</tspan></text><rect x="250" y="165.56" width="200" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="350" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">Checklist de velocidad</tspan></text><text x="350" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">no fiable; no se</tspan></text><text x="350" y="217.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">identifica el</tspan></text><text x="350" y="234.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">desbocamiento</tspan></text><rect x="490" y="165.56" width="200" height="80.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="590" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">Impacto en el mar a los</tspan></text><text x="590" y="217.8" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">13 minutos del despegue</tspan></text><polyline points="210,205.84 250,205.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,205.84 490,205.84" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="262.12" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="287.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el accidente empieza el día anterior en un taller y en un libro de registro, no en la cabina. Mira los</tspan></text><text x="470" y="303.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">eslabones dorados: la información que habría roto la cadena existió en el vuelo previo y no llegó a quien la necesitaba.</tspan></text><text x="470" y="351.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: KNKT, informe final JT610 (25 oct 2019). Sinopsis; el Comité de la Cámara da los 13 minutos.</tspan></text></svg>
