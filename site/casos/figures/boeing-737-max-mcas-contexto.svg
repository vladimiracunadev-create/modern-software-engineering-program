<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 439" width="940" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién interviene entre el diseño de un avión y su vuelo con pasajeros</title><desc id="d">Diagrama de contexto: Boeing diseña el 737 MAX; la FAA lo certifica y delega parte de la revisión en representantes autorizados de Boeing; las aerolíneas lo operan con pilotos y mantenimiento; dentro del avión, el sistema de control de vuelo contiene la función MCAS, que lee un sensor de ángulo de ataque.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="439" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién interviene entre el diseño de un avión y su vuelo con pasajeros</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">Boeing: diseño, pruebas</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">de vuelo, análisis de</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">seguridad</tspan></text><rect x="10" y="128.92" width="200" height="97.2" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">FAA: certificación y</tspan></text><text x="110" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">supervisión, con</tspan></text><text x="110" y="181.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">delegación en</tspan></text><text x="110" y="197.8" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">representantes</tspan></text><text x="110" y="214.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">autorizados</tspan></text><rect x="10" y="240.12" width="200" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="259.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Aerolíneas, pilotos y</tspan></text><text x="110" y="275.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">organizaciones de</tspan></text><text x="110" y="292.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">mantenimiento</tspan></text><rect x="730" y="51" width="200" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="74.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Pasajeros y tripulación</tspan></text><rect x="730" y="105" width="200" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="830" y="123.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">Autoridades extranjeras</tspan></text><text x="830" y="140.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">y revisiones técnicas</tspan></text><text x="830" y="157.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">conjuntas</tspan></text><rect x="730" y="182.92" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="201.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">Investigadores de</tspan></text><text x="830" y="218.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">accidentes: Indonesia,</tspan></text><text x="830" y="235.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">Etiopía, EE. UU.</tspan></text><rect x="280" y="51" width="370" height="267.04" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">Avión Boeing 737 MAX</tspan></text><rect x="300" y="91" width="330" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="465" y="109.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">Sensores de ángulo de ataque, uno a cada</tspan></text><text x="465" y="126.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">lado</tspan></text><rect x="300" y="148.28" width="330" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="167.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Ordenadores de control de vuelo con la</tspan></text><text x="465" y="183.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">función MCAS</tspan></text><rect x="300" y="205.56" width="330" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="465" y="229.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="465" dy="0">Compensador del estabilizador horizontal</tspan></text><rect x="300" y="255.56" width="330" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="279.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Alertas e indicaciones de cabina</tspan></text><polyline points="210,82.96 280,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="74.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">diseña</tspan></text><polyline points="210,177.52 280,177.52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="169.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">certifica</tspan></text><polyline points="210,272.08 280,272.08" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="264.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">opera</tspan></text><polyline points="650,71 730,71" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="63" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">viajan</tspan></text><polyline points="650,136.96 730,136.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="128.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">revisan</tspan></text><polyline points="650,214.88 730,214.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="206.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">investigan</tspan></text><rect x="10" y="332.04" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="357" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la seguridad del avión depende de decisiones repartidas entre fabricante, regulador y operadores. La caja</tspan></text><text x="470" y="373.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">roja del centro es la función que ambos informes de accidente colocan en el centro de la cadena.</tspan></text><text x="470" y="421.32" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: KNKT, informe final JT610 (25 oct 2019). Fuente: JATR, informe a la FAA (oct 2019).</tspan></text></svg>
