<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 238" width="940" height="238" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema del negocio: del encargo de las aerolíneas a la entrega del avión</title><desc id="d">Esquema de negocio: las aerolíneas encargan aviones de un modelo derivado que evite formación nueva y ahorre combustible; Boeing desarrolla el 737 MAX con motores nuevos para competir con el A320neo; la certificación habilita la entrega; las aerolíneas lo operan con la formación de diferencias.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="238" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema del negocio: del encargo de las aerolíneas a la entrega del avión</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Aerolíneas: encargos de</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">un derivado con menos</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">coste de formación</tspan></text><rect x="250" y="51" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="350" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="350" dy="0">Boeing: 737 MAX con</tspan></text><text x="350" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="350" dy="0">motores nuevos para</tspan></text><text x="350" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="350" dy="0">competir con el A320neo</tspan></text><rect x="490" y="51" width="200" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">FAA: certificación como</tspan></text><text x="590" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">derivado del 737 NG</tspan></text><rect x="730" y="51" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">Aerolíneas: operación</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">con formación de</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">diferencias</tspan></text><polyline points="210,82.96 250,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,82.96 490,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,82.96 730,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130.92" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="155.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: evitar formación nueva en simulador es una propiedad de negocio que condiciona qué cambios de diseño son</tspan></text><text x="470" y="172.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aceptables. El informe del Comité documenta 496 compromisos de cinco clientes al anunciar el avión en agosto de 2011.</tspan></text><text x="470" y="220.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Transporte de la Cámara (sep 2020).</tspan></text></svg>
