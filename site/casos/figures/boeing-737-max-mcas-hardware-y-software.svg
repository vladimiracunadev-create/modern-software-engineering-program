<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 502" width="940" height="502" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se sabe de la pila técnica del control de vuelo</title><desc id="d">Capas de la pila técnica: sensores de ángulo de ataque, unidad de datos aéreos, ordenadores de control de vuelo, ley MCAS, compensador del estabilizador y alertas; documentadas en los informes; lenguaje, procesador y sistema operativo no consta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="502" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se sabe de la pila técnica del control de vuelo</tspan></text><rect x="10" y="51" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="78.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Sensores</tspan></text><rect x="270" y="51" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Dos sensores de paleta (uno a cada lado), cada uno con dos resolvers; una unidad de</tspan></text><text x="600" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">datos aéreos por lado</tspan></text><rect x="10" y="106.28" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="129.92" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Ordenadores de control de vuelo</tspan></text><rect x="270" y="106.28" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="129.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Dos ordenadores; MCAS solo está activo en el principal, que alterna cada vuelo</tspan></text><rect x="10" y="154.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="181.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Ley MCAS</tspan></text><rect x="270" y="154.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="173.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Parte del sistema de compensación por velocidad; actúa con el piloto manual, flaps</tspan></text><text x="600" y="189.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">arriba y ángulo sobre un umbral</tspan></text><rect x="10" y="209.56" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="236.84" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Actuación</tspan></text><rect x="270" y="209.56" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="228.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Compensador del estabilizador; interruptores de corte y de columna; MCAS inhibe el</tspan></text><text x="600" y="245.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">corte de columna en un sentido mientras actúa</tspan></text><rect x="10" y="264.84" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="292.12" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Alertas</tspan></text><rect x="270" y="264.84" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="283.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Desacuerdo de velocidad y de altitud, agitador, avisos de la cabina; el aviso de</tspan></text><text x="600" y="300.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">desacuerdo de ángulo no estaba habilitado</tspan></text><rect x="10" y="320.12" width="250" height="63.92" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="339.08" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">Lenguaje, procesador, sistema</tspan></text><text x="135" y="355.72" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">operativo, versiones de</tspan></text><text x="135" y="372.36" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">software</tspan></text><rect x="270" y="320.12" width="660" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="355.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">No constan en los informes consultados; este caso no los inventa</tspan></text><rect x="10" y="400.04" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="430.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: los informes dan el nivel de detalle necesario para entender el fallo. Verde: documentado; gris: no se sabe.</tspan></text><text x="470" y="484.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: KNKT, informe final JT610 (25 oct 2019). Apartado 1.6.5.</tspan></text></svg>
