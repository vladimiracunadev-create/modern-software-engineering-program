<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 362" width="940" height="362" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se investigó y quién lo hizo: tres tipos de fuente</title><desc id="d">Tres columnas: investigaciones de los dos accidentes por Indonesia y Etiopía, revisiones técnicas de certificación por el NTSB y la revisión conjunta de autoridades, y la investigación del Congreso de EE. UU. con su informe del personal de la mayoría.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="362" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se investigó y quién lo hizo: tres tipos de fuente</tspan></text><rect x="10" y="51" width="294.667" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157.333" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157.333" dy="0">Investigación de accidentes</tspan></text><rect x="10" y="101" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">KNKT (Indonesia): informe final de</tspan></text><text x="157.333" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">JT610, 25 de octubre de 2019</tspan></text><rect x="10" y="156.28" width="294.667" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">EAIB (Etiopía): informe final de</tspan></text><text x="157.333" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">ET302, diciembre de 2022, con</tspan></text><text x="157.333" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">comentarios discrepantes del NTSB y</tspan></text><text x="157.333" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">del BEA</tspan></text><rect x="322.667" y="51" width="294.667" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Revisión de certificación</tspan></text><rect x="322.667" y="101" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">NTSB: recomendaciones de seguridad a</tspan></text><text x="470" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">la FAA, 19 de septiembre de 2019</tspan></text><rect x="322.667" y="156.28" width="294.667" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">JATR: 28 miembros de la FAA, la NASA</tspan></text><text x="470" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">y nueve autoridades civiles; mayo a</tspan></text><text x="470" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">septiembre de 2019; doce</tspan></text><text x="470" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">recomendaciones</tspan></text><rect x="635.333" y="51" width="294.667" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782.667" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="782.667" dy="0">Investigación legislativa</tspan></text><rect x="635.333" y="101" width="294.667" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Comité de Transporte e</tspan></text><text x="782.667" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Infraestructura de la Cámara de EE.</tspan></text><text x="782.667" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">UU.: informe final de septiembre de</tspan></text><text x="782.667" y="169.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">2020</tspan></text><rect x="635.333" y="189.56" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Elaborado por el personal de la</tspan></text><text x="782.667" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">mayoría demócrata: se cita como tal</tspan></text><rect x="10" y="254.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: ninguna fuente sola cubre todo. Mira la tercera columna: es un informe de una de las partes del Comité y</tspan></text><text x="470" y="296.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">este caso lo trata como fuente con punto de vista, no como veredicto.</tspan></text><text x="470" y="344.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: KNKT, EAIB, NTSB, JATR y Comité de Transporte de la Cámara de EE. UU.</tspan></text></svg>
