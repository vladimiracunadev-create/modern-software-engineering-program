<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 364" width="940" height="364" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ethiopian Airlines 302: seis minutos desde el despegue hasta el final del registro</title><desc id="d">Línea de tiempo en minutos desde las 5:38 UTC del 10 de marzo de 2019: despegue normal; poco después el sensor izquierdo da valores erróneos y se activa el agitador; hay cuatro activaciones automáticas de morro abajo, la segunda a 5:40:22, la tercera a 5:40:43 sin movimiento y la cuarta a 5:43:21; el registro termina a 5:43:44.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="364" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ethiopian Airlines 302: seis minutos desde el despegue hasta el final del registro</tspan></text><line x1="294" y1="83" x2="294" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="183" x2="294" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="397" y1="83" x2="397" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="397" y1="183" x2="397" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="397" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="397" dy="0">1</tspan></text><line x1="500" y1="83" x2="500" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="500" y1="183" x2="500" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="500" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="500" dy="0">2</tspan></text><line x1="603" y1="83" x2="603" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="603" y1="183" x2="603" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="603" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="603" dy="0">3</tspan></text><line x1="706" y1="83" x2="706" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="706" y1="183" x2="706" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="706" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="706" dy="0">4</tspan></text><line x1="809" y1="83" x2="809" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="809" y1="183" x2="809" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="809" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">5</tspan></text><line x1="912" y1="83" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="183" x2="912" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">6</tspan></text><line x1="294" y1="183" x2="912" y2="183" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Vuelo</tspan></text><text x="284" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="284" dy="0">Compensador automático (MCAS)</tspan></text><line x1="538.11" y1="75" x2="538.11" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="538.11" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="538.11" dy="0">5:40:22</tspan></text><line x1="845.05" y1="75" x2="845.05" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="845.05" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="845.05" dy="0">5:43:21</tspan></text><rect x="294" y="92" width="590.19" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="589.095" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="589.095" dy="0">agitador izquierdo activo hasta casi el final</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="538.11" y="142" width="13.39" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="574.16" y="142" width="8.24" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="845.05" y="142" width="10.3" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="603" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603" dy="0">Minutos desde las 5:38 UTC</tspan></text><rect x="10" y="241" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="265.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El informe da la 1.ª activación de 9 segundos tras recoger los flaps (sin hora en el resumen), la 2.ª a 5:40:22, la 3.ª a</tspan></text><text x="470" y="282.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">5:40:43 sin movimiento del estabilizador y la 4.ª a 5:43:21. Las duraciones de las barras cortas son de dibujo; solo las</tspan></text><text x="470" y="299.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">horas están en el informe.</tspan></text><text x="470" y="346.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: EAIB, informe final ET302 (dic 2022). Resumen ejecutivo.</tspan></text></svg>
