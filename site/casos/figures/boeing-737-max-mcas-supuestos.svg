<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 402" width="940" height="402" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro supuestos de diseño sobre la respuesta de los pilotos y lo que se observó</title><desc id="d">Cuatro pares: cada supuesto con el que Boeing evaluó el riesgo de una activación de MCAS no ordenada y lo que el NTSB señaló al comparar con las respuestas de los pilotos de los accidentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="402" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro supuestos de diseño sobre la respuesta de los pilotos y lo que se observó</tspan></text><rect x="10" y="51" width="215" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="117.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="117.5" dy="0">Una entrada no ordenada se</tspan></text><text x="117.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="117.5" dy="0">reconoce y se contrarresta</tspan></text><text x="117.5" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="117.5" dy="0">moviendo los mandos en el</tspan></text><text x="117.5" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="117.5" dy="0">sentido normal</tspan></text><rect x="10" y="159.56" width="215" height="97.2" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Las tripulaciones tuvieron</tspan></text><text x="117.5" y="195.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">muchas indicaciones</tspan></text><text x="117.5" y="211.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">simultáneas y fueron</tspan></text><text x="117.5" y="228.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">necesarios procedimientos</tspan></text><text x="117.5" y="245.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">específicos</tspan></text><polyline points="117.5,131.56 117.5,159.56" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="245" y="51" width="215" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352.5" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352.5" dy="0">La acción no exige</tspan></text><text x="352.5" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352.5" dy="0">habilidad ni fuerza</tspan></text><text x="352.5" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="352.5" dy="0">excepcionales</tspan></text><rect x="245" y="159.56" width="215" height="97.2" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="195.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Las fuerzas de columna</tspan></text><text x="352.5" y="211.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">llegaron a más de 90</tspan></text><text x="352.5" y="228.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">libras en el vuelo ET302</tspan></text><polyline points="352.5,131.56 352.5,159.56" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="480" y="51" width="215" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="587.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587.5" dy="0">El piloto actúa de</tspan></text><text x="587.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587.5" dy="0">inmediato para reducir las</tspan></text><text x="587.5" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587.5" dy="0">fuerzas reajustando el</tspan></text><text x="587.5" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587.5" dy="0">compensador</tspan></text><rect x="480" y="159.56" width="215" height="97.2" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="186.84" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">El informe etíope registra</tspan></text><text x="587.5" y="203.48" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">compensación eléctrica y</tspan></text><text x="587.5" y="220.12" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">nuevas activaciones cinco</tspan></text><text x="587.5" y="236.76" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">segundos después</tspan></text><polyline points="587.5,131.56 587.5,159.56" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="715" y="51" width="215" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="822.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="822.5" dy="0">Se siguen de memoria los</tspan></text><text x="822.5" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="822.5" dy="0">procedimientos entrenados</tspan></text><rect x="715" y="159.56" width="215" height="97.2" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822.5" y="186.84" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">Faltaba información de</tspan></text><text x="822.5" y="203.48" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">MCAS en manuales y</tspan></text><text x="822.5" y="220.12" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">formación; el aviso de</tspan></text><text x="822.5" y="236.76" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">desacuerdo no apareció</tspan></text><polyline points="822.5,131.56 822.5,159.56" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="278.76" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: los supuestos eran los que la guía de la FAA y Boeing usaban para sus evaluaciones de peligro y eran</tspan></text><text x="470" y="320.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">coherentes con la norma; la conclusión del NTSB es que no consideraban el efecto de las alertas múltiples. Los supuestos</tspan></text><text x="470" y="337" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">son del NTSB; las observaciones, de los informes de accidente.</tspan></text><text x="470" y="384.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: NTSB, informe de recomendaciones (sep 2019). Fuente: KNKT, informe final JT610 (25 oct 2019).</tspan></text></svg>
