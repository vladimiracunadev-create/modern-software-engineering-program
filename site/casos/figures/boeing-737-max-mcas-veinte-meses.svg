<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Veinte meses en tierra: la prohibición y las revisiones que ocurrieron durante ella</title><desc id="d">Línea de tiempo en meses desde enero de 2019: la FAA prohíbe operar el 737 MAX el 13 de marzo de 2019; el JATR trabaja de mayo a septiembre de 2019; el NTSB publica recomendaciones en septiembre; el KNKT publica su informe final en octubre; el Comité de la Cámara publica su informe en septiembre de 2020; la FAA anula la prohibición el 18 de noviembre de 2020.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Veinte meses en tierra: la prohibición y las revisiones que ocurrieron durante ella</tspan></text><line x1="224" y1="83" x2="224" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="233" x2="224" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="310" y1="83" x2="310" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="310" y1="233" x2="310" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="310" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">3</tspan></text><line x1="396" y1="83" x2="396" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="396" y1="233" x2="396" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="396" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="396" dy="0">6</tspan></text><line x1="482" y1="83" x2="482" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="482" y1="233" x2="482" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="482" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482" dy="0">9</tspan></text><line x1="568" y1="83" x2="568" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="568" y1="233" x2="568" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="568" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="568" dy="0">12</tspan></text><line x1="654" y1="83" x2="654" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="654" y1="233" x2="654" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="654" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="654" dy="0">15</tspan></text><line x1="740" y1="83" x2="740" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="740" y1="233" x2="740" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="740" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="740" dy="0">18</tspan></text><line x1="826" y1="83" x2="826" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="826" y1="233" x2="826" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="826" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="826" dy="0">21</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">24</tspan></text><line x1="224" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="214" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Prohibición de la FAA</tspan></text><text x="214" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">JATR</tspan></text><text x="214" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Informes públicos</tspan></text><line x1="292.8" y1="75" x2="292.8" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="292.8" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="292.8" dy="0">13 mar 2019</tspan></text><line x1="871.867" y1="75" x2="871.867" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="871.867" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="871.867" dy="0">18 nov 2020</tspan></text><rect x="292.8" y="92" width="579.067" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="582.333" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="582.333" dy="0">en tierra unos veinte meses</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="350.133" y="142" width="131.867" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="416.067" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="416.067" dy="0">revisión</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="470.533" y="192" width="14.3333" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="504.933" y="192" width="11.4667" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="808.8" y="192" width="14.3333" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="568" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="568" dy="0">Meses desde enero de 2019</tspan></text><rect x="10" y="291" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las marcas de «Informes públicos» son, de izquierda a derecha, el informe del NTSB (19 de septiembre de 2019), el informe</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">final del KNKT (25 de octubre de 2019) y el informe del personal de la mayoría del Comité (septiembre de 2020). El informe</tspan></text><text x="470" y="349.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">final de Etiopía, de diciembre de 2022, queda fuera de la escala.</tspan></text><text x="470" y="396.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FAA, cronología del 737 MAX. Fechas de cada informe en la ficha.</tspan></text></svg>
