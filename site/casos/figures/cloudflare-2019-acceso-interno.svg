<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 336" width="940" height="336" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuando la herramienta para arreglarlo depende de lo que está roto</title><desc id="d">Cadena de dependencias de la respuesta: el servicio de acceso de Cloudflare estaba caído y no se podía entrar al panel de control interno; algunas credenciales de SRE habían caducado por seguridad; Jira y el sistema de compilación solo se alcanzaban con un procedimiento de excepción poco practicado; los clientes tampoco accedían al panel ni a la API.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="336" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuando la herramienta para arreglarlo depende de lo que está roto</tspan></text><rect x="10" y="51" width="280" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">Cloudflare usa sus propios</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">productos para acceder a sus</tspan></text><text x="150" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">sistemas</tspan></text><rect x="330" y="51" width="280" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Con el servicio de acceso caído no</tspan></text><text x="470" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">se entra al panel interno</tspan></text><rect x="650" y="51" width="280" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="790" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">Algunas credenciales caducan por</tspan></text><text x="790" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">seguridad si no se usan</tspan></text><polyline points="290,82.96 330,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,82.96 650,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,114.92 790,129.92 150,129.92 150,148.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="148.92" width="280" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="150" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">Jira y el sistema de compilación:</tspan></text><text x="150" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">solo por un procedimiento poco</tspan></text><text x="150" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">practicado</tspan></text><rect x="330" y="148.92" width="280" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="176.2" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los clientes tampoco acceden al</tspan></text><text x="470" y="192.84" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">panel ni a la API</tspan></text><polyline points="290,180.88 330,180.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="228.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="253.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: una dependencia circular entre producción y herramientas de recuperación alarga el incidente. Mira que el</tspan></text><text x="470" y="270.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">post mortem lo cuenta como algo a ensayar, no como una excepción.</tspan></text><text x="470" y="318.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019.</tspan></text></svg>
