<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 456" width="940" height="456" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que Cloudflare anunció tras el incidente</title><desc id="d">Tres columnas con las acciones del post mortem: hechas (reintroducir la protección y revisar las 3 868 reglas), previstas con fecha (perfil de CPU en las pruebas el 19 de julio y cambio a re2 o Rust el 31 de julio) y de plazo más largo (procedimiento escalonado, sacar el panel del borde, actualizar la página de estado, abandonar el WAF en Lua).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="456" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lo que Cloudflare anunció tras el incidente</tspan></text><rect x="10" y="51" width="294.667" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="157.333" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="157.333" dy="0">Hechas cuando se escribió el post</tspan></text><rect x="10" y="101" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Parar todos los despliegues del WAF</tspan></text><rect x="10" y="149" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Reintroducir la protección contra</tspan></text><text x="157.333" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">exceso de CPU</tspan></text><rect x="10" y="204.28" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="227.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Inspeccionar a mano las 3 868 reglas</tspan></text><rect x="322.667" y="51" width="294.667" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">Con fecha prevista</tspan></text><rect x="322.667" y="101" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Perfil de rendimiento de todas las</tspan></text><text x="470" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">reglas en las pruebas: 19 de julio</tspan></text><rect x="322.667" y="156.28" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Cambiar a re2 o al motor de Rust: 31</tspan></text><text x="470" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">de julio</tspan></text><rect x="635.333" y="51" width="294.667" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="782.667" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="782.667" dy="0">Más adelante</tspan></text><rect x="635.333" y="101" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Procedimiento operativo con</tspan></text><text x="782.667" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">despliegue escalonado, conservando la</tspan></text><text x="782.667" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">vía de emergencia</tspan></text><rect x="635.333" y="172.92" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Poder sacar el panel y la API del</tspan></text><text x="782.667" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">borde</tspan></text><rect x="635.333" y="228.2" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Actualizar la página de estado</tspan></text><text x="782.667" y="263.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">automáticamente</tspan></text><rect x="635.333" y="283.48" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="302.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Abandonar el WAF en Lua por el nuevo</tspan></text><text x="782.667" y="319.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">motor de cortafuegos</tspan></text><rect x="10" y="348.76" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: las acciones cubren el defecto, la distribución y la recuperación. Mira que el post mortem da fechas: esa</tspan></text><text x="470" y="390.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">precisión es parte de la transparencia. No verificamos aquí su cumplimiento posterior.</tspan></text><text x="470" y="438.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019.</tspan></text></svg>
