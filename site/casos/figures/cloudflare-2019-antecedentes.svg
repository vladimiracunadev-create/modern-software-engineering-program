<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la primera caída de 2010 a la reactivación del WAF en 2019, en ocho hitos</title><desc id="d">Eje no proporcional con ocho hitos: en 2010 un cambio de Protocol Buffers rompió el DNS; semanas antes se eliminó una protección en una refactorización; 13:31, 13:37 y 13:42 fusión, pruebas y despliegue; 13:45 primer aviso; 14:00 WAF identificado; 14:07 terminación global; 14:52 WAF reactivado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la primera caída de 2010 a la reactivación del WAF en 2019, en ocho hitos</tspan></text><line x1="30" y1="195" x2="910" y2="195" stroke="#32505f" stroke-width="2"/><line x1="80" y1="195" x2="80" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="80" cy="195" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="80" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="80" dy="0"></tspan></text><rect x="6" y="55" width="170" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="91" y="83.68" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">2010: un cambio de</tspan></text><text x="91" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">Protocol Buffers</tspan></text><text x="91" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">rompió el DNS del</tspan></text><text x="91" y="133.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">autor del post</tspan></text><line x1="191.429" y1="195" x2="191.429" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="191.429" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="191.429" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="191.429" dy="0"></tspan></text><rect x="106.429" y="235" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="191.429" y="263.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="191.429" dy="0">Semanas antes: una</tspan></text><text x="191.429" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="191.429" dy="0">refactorización</tspan></text><text x="191.429" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="191.429" dy="0">elimina la</tspan></text><text x="191.429" y="313.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="191.429" dy="0">protección de CPU</tspan></text><line x1="302.857" y1="195" x2="302.857" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="302.857" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.857" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="302.857" dy="0"></tspan></text><rect x="217.857" y="55" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="302.857" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.857" dy="0">13:31: se fusiona el</tspan></text><text x="302.857" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="302.857" dy="0">cambio</tspan></text><line x1="414.286" y1="195" x2="414.286" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="414.286" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="414.286" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="414.286" dy="0"></tspan></text><rect x="329.286" y="235" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="414.286" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="414.286" dy="0">13:42: despliegue</tspan></text><text x="414.286" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="414.286" dy="0">global automático</tspan></text><line x1="525.714" y1="195" x2="525.714" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="525.714" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525.714" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="525.714" dy="0"></tspan></text><rect x="440.714" y="55" width="170" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525.714" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525.714" dy="0">13:45: primer aviso</tspan></text><text x="525.714" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525.714" dy="0">del WAF</tspan></text><line x1="637.143" y1="195" x2="637.143" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="637.143" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="637.143" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="637.143" dy="0"></tspan></text><rect x="552.143" y="235" width="170" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="637.143" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="637.143" dy="0">14:00: se identifica</tspan></text><text x="637.143" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="637.143" dy="0">el WAF</tspan></text><line x1="748.571" y1="195" x2="748.571" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="748.571" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="748.571" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="748.571" dy="0"></tspan></text><rect x="663.571" y="55" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="748.571" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="748.571" dy="0">14:07: terminación</tspan></text><text x="748.571" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="748.571" dy="0">global</tspan></text><line x1="860" y1="195" x2="860" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="860" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="860" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="860" dy="0"></tspan></text><rect x="764" y="235" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">14:52: WAF</tspan></text><text x="849" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">reactivado</tspan></text><rect x="10" y="365" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="389.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el defecto se formó semanas antes, al quitar una protección para ahorrar CPU, y el incidente duró 27</tspan></text><text x="470" y="406.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">minutos. Mira que los hitos de 2010 y de las semanas previas no están a escala del día.</tspan></text><text x="470" y="454.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019.</tspan></text></svg>
