<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cloudflare entre sus clientes y los visitantes de sus sitios</title><desc id="d">Diagrama de contexto: los visitantes de los sitios de los clientes llegan a la red de Cloudflare; cada punto de presencia ejecuta el proxy, la red de entrega de contenido y el cortafuegos de aplicaciones web; las reglas del cortafuegos se distribuyen desde el centro a más de 180 ciudades mediante un almacén de claves y valores propio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cloudflare entre sus clientes y los visitantes de sus sitios</tspan></text><rect x="10" y="51" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Visitantes de los sitios</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">de los clientes</tspan></text><rect x="10" y="112.28" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Clientes de Cloudflare y</tspan></text><text x="110" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">sus propios clientes</tspan></text><rect x="730" y="51" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Servidores de origen de</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">los clientes</tspan></text><rect x="730" y="112.28" width="200" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Panel de control y API</tspan></text><text x="830" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">de Cloudflare, que</tspan></text><text x="830" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">también pasan por su</tspan></text><text x="830" y="181.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">borde</tspan></text><rect x="730" y="206.84" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="225.8" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">Equipos de Cloudflare:</tspan></text><text x="830" y="242.44" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">reglas, SRE,</tspan></text><text x="830" y="259.08" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">herramientas internas</tspan></text><rect x="280" y="51" width="370" height="233.76" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">Red de Cloudflare</tspan></text><rect x="300" y="91" width="330" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="118.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Puntos de presencia en más de 180 ciudades</tspan></text><rect x="300" y="148.28" width="330" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="167.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Proxy, CDN y cortafuegos de aplicaciones</tspan></text><text x="465" y="183.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">web (WAF)</tspan></text><rect x="300" y="205.56" width="330" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="224.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Quicksilver: almacén de claves y valores</tspan></text><text x="465" y="241.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">que distribuye configuración y reglas</tspan></text><polyline points="210,74.64 280,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">visitan</tspan></text><polyline points="210,135.92 280,135.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="127.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">usan</tspan></text><polyline points="650,74.64 730,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">origen</tspan></text><polyline points="650,152.56 730,152.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="144.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">gestionan</tspan></text><polyline points="650,238.8 730,238.8" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="230.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">operan</tspan></text><rect x="10" y="298.76" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="323.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el WAF estaba en el camino de todo el tráfico HTTP y HTTPS; una regla defectuosa afecta a todos los clientes</tspan></text><text x="470" y="340.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">a la vez. Mira que el panel de control y los equipos internos también dependían de ese camino.</tspan></text><text x="470" y="388.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019.</tspan></text></svg>
