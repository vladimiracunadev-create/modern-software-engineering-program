<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 524" width="940" height="524" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cada eslabón de la cadena y el control que lo corta</title><desc id="d">Ocho pares de causa y control: expresión que retrocede, protección eliminada, motor sin garantías, pruebas que no miden CPU, procedimiento de despliegue global, reversión lenta, alerta tardía y acceso interno dependiente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="524" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cada eslabón de la cadena y el control que lo corta</tspan></text><rect x="10" y="51" width="215" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Expresión regular con</tspan></text><text x="117.5" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">retroceso</tspan></text><rect x="10" y="142.92" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Revisión específica de</tspan></text><text x="117.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">expresiones con</tspan></text><text x="117.5" y="195.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">herramientas de análisis y</tspan></text><text x="117.5" y="211.8" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">límites de tiempo</tspan></text><polyline points="117.5,114.92 117.5,142.92" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="245" y="51" width="215" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Protección contra CPU</tspan></text><text x="352.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">eliminada en una</tspan></text><text x="352.5" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">refactorización</tspan></text><rect x="245" y="142.92" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">Prueba que falle si la</tspan></text><text x="352.5" y="195.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">protección desaparece</tspan></text><polyline points="352.5,114.92 352.5,142.92" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="480" y="51" width="215" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">Motor sin garantías de</tspan></text><text x="587.5" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">complejidad</tspan></text><rect x="480" y="142.92" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">Motor de tiempo lineal,</tspan></text><text x="587.5" y="195.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">como re2 o el de Rust</tspan></text><polyline points="587.5,114.92 587.5,142.92" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="715" y="51" width="215" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">Pruebas sin medida de CPU</tspan></text><rect x="715" y="142.92" width="215" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822.5" y="170.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">Perfil de rendimiento de</tspan></text><text x="822.5" y="186.84" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">cada regla en la batería</tspan></text><text x="822.5" y="203.48" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">de pruebas</tspan></text><polyline points="822.5,114.92 822.5,142.92" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="239.48" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="258.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Despliegue global sin</tspan></text><text x="117.5" y="275.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">escalones</tspan></text><rect x="10" y="314.76" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="333.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Despliegue escalonado con</tspan></text><text x="117.5" y="350.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">modo sombra y salida de</tspan></text><text x="117.5" y="367" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">emergencia aparte</tspan></text><polyline points="117.5,286.76 117.5,314.76" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="245" y="239.48" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="258.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Reversión de dos</tspan></text><text x="352.5" y="275.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">compilaciones</tspan></text><rect x="245" y="314.76" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.5" y="342.04" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">Reversión de un solo paso,</tspan></text><text x="352.5" y="358.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">ensayada</tspan></text><polyline points="352.5,286.76 352.5,314.76" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="480" y="239.48" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="266.76" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">Alerta de caída tardía</tspan></text><rect x="480" y="314.76" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587.5" y="342.04" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">Alerta de caída de tráfico</tspan></text><text x="587.5" y="358.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">global con umbral corto</tspan></text><polyline points="587.5,286.76 587.5,314.76" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="715" y="239.48" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822.5" y="258.44" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">Acceso interno dependiente</tspan></text><text x="822.5" y="275.08" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">del servicio caído</tspan></text><rect x="715" y="314.76" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822.5" y="333.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">Vía de acceso fuera del</tspan></text><text x="822.5" y="350.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">borde de Cloudflare,</tspan></text><text x="822.5" y="367" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">ensayada</tspan></text><polyline points="822.5,286.76 822.5,314.76" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="400.68" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="425.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: cinco de las ocho mejoras coinciden con acciones que Cloudflare anunció: restituir la protección, perfilar</tspan></text><text x="470" y="442.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">reglas, cambiar de motor, escalonar el procedimiento y poder sacar el panel del borde. La columna inferior es análisis</tspan></text><text x="470" y="458.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">propio.</tspan></text><text x="470" y="506.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019. Análisis propio, no conclusión de Cloudflare.</tspan></text></svg>
