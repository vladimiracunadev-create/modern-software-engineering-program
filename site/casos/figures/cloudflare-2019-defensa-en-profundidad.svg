"13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">existían)</tspan></text><rect x="380.571" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="392.571" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="356.143" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="411.571" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.571" dy="0">Pruebas (no</tspan></text><text x="411.571" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="411.571" dy="0">medían CPU)</tspan></text><rect x="497.429" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="509.429" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="473" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="528.429" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="528.429" dy="0">Despliegue</tspan></text><text x="528.429" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="528.429" dy="0">escalonado</tspan></text><text x="528.429" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="528.429" dy="0">(el</tspan></text><text x="528.429" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="528.429" dy="0">procedimiento</tspan></text><text x="528.429" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="528.429" dy="0">lo excluía)</tspan></text><rect x="614.286" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="626.286" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="589.857" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="645.286" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="645.286" dy="0">Alerta de</tspan></text><text x="645.286" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="645.286" dy="0">caída</tspan></text><text x="645.286" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="645.286" dy="0">(tardó)</tspan></text><rect x="731.143" y="51" width="62" height="170" rx="14" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><rect x="743.143" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="706.714" y="231" width="110.857" height="150" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="762.143" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="762.143" dy="0">Terminación</tspan></text><text x="762.143" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="762.143" dy="0">global del</tspan></text><text x="762.143" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="762.143" dy="0">WAF</tspan></text><text x="762.143" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="762.143" dy="0">(funcionó)</tspan></text><rect x="848" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="860" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="823.571" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="879" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">Página de</tspan></text><text x="879" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">estado</tspan></text><text x="879" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">(tardó)</tspan></text><polyline points="10,136 930,136" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="399" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: los controles de proceso se cumplieron, pero faltaban los de comportamiento. Rojo: ausente o eliminada;</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">dorado: existía y fue parcial; verde: funcionó. Es una metáfora.</tspan></text><text x="470" y="488.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019. Análisis propio, no conclusión de Cloudflare.</tspan></text></svg>
