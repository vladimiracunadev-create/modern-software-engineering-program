<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 506" width="940" height="506" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defensa en profundidad: ocho barreras y por qué una regla llegó a todo el mundo</title><desc id="d">Láminas con huecos alineados: la revisión de la expresión regular, la protección contra consumo de CPU, las garantías del motor, las pruebas, el despliegue escalonado, la alerta, el interruptor global y la comunicación; una flecha las atraviesa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="506" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defensa en profundidad: ocho barreras y por qué una regla llegó a todo el mundo</tspan></text><rect x="30" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="42" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="5.57143" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="61" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">Revisión de</tspan></text><text x="61" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">la regla</tspan></text><text x="61" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">(aprobada)</tspan></text><rect x="146.857" y="51" width="62" height="170" rx="14" fill="#fbe4de" st