<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 319" width="940" height="319" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La secuencia del diagnóstico, en seis pasos</title><desc id="d">Cadena del diagnóstico: llegan avisos sintéticos del WAF y pérdida de tráfico; SRE declara un incidente de máxima prioridad; se descarta un ataque; a las 14:00 se identifica el WAF; se propone una terminación global; se ejecuta a las 14:07.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="319" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La secuencia del diagnóstico, en seis pasos</tspan></text><rect x="10" y="51" width="280" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">13:45: primer aviso del WAF; luego,</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">caída global de tráfico y errores</tspan></text><text x="150" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">502</tspan></text><rect x="330" y="51" width="280" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">SRE declara P0 y convoca a todos</tspan></text><text x="470" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">los equipos</tspan></text><rect x="650" y="51" width="280" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="790" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">Se especula con un ataque nuevo, y</tspan></text><text x="790" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">se descarta</tspan></text><polyline points="290,82.96 330,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,82.96 650,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,114.92 790,129.92 150,129.92 150,148.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="148.92" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">14:00: se identifica el WAF como</tspan></text><text x="150" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">causa</tspan></text><rect x="330" y="148.92" width="280" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">14:02: se propone la terminación</tspan></text><text x="470" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">global del WAF</tspan></text><rect x="650" y="148.92" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="167.88" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="790" dy="0">14:07: se ejecuta; 14:09, tráfico</tspan></text><text x="790" y="184.52" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="790" dy="0">normal</tspan></text><polyline points="290,172.56 330,172.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,172.56 650,172.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="212.2" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el diagnóstico tardó 15 minutos desde el primer aviso hasta saber qué componente era, y otros cinco hasta</tspan></text><text x="470" y="253.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ejecutar el interruptor. Mira que existía un mecanismo de terminación global de un componente, y funcionó.</tspan></text><text x="470" y="301.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019.</tspan></text></svg>
