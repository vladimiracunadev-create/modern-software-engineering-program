<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 564" width="940" height="564" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Once vulnerabilidades que convergieron, según el propio post mortem</title><desc id="d">Capas con las once condiciones que Cloudflare enumera: una expresión regular que retrocede, una protección eliminada por error en una refactorización, un motor sin garantías de complejidad, pruebas que no miden CPU, un procedimiento que permitía el despliegue global, un plan de reversión lento, una primera alerta tardía, una página de estado lenta, acceso difícil a los sistemas, credenciales caducadas y clientes sin acceso al panel.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="564" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Once vulnerabilidades que convergieron, según el propio post mortem</tspan></text><rect x="10" y="51" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Expresión regular</tspan></text><rect x="270" y="51" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="74.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Escrita de modo que podía retroceder enormemente</tspan></text><rect x="10" y="99" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="126.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Protección eliminada</tspan></text><rect x="270" y="99" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="117.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Una protección contra el consumo excesivo de CPU se quitó por error en una</tspan></text><text x="600" y="134.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">refactorización del WAF semanas antes, para reducir su uso de CPU</tspan></text><rect x="10" y="154.28" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="177.92" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Motor sin garantías</tspan></text><rect x="270" y="154.28" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="177.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">El motor de expresiones regulares no tenía garantías de complejidad</tspan></text><rect x="10" y="202.28" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="225.92" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Pruebas</tspan></text><rect x="270" y="202.28" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="225.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">La batería de pruebas no tenía forma de detectar un consumo excesivo de CPU</tspan></text><rect x="10" y="250.28" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="273.92" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Procedimiento</tspan></text><rect x="270" y="250.28" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="273.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Un cambio de reglas no urgente podía ir a producción global sin despliegue escalonado</tspan></text><rect x="10" y="298.28" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="321.92" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Reversión</tspan></text><rect x="270" y="298.28" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="321.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">El plan exigía ejecutar dos veces la compilación completa del WAF, demasiado lento</tspan></text><rect x="10" y="346.28" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="369.92" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Avisos y estado</tspan></text><rect x="270" y="346.28" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="369.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">La primera alerta de caída global tardó; la página de estado se actualizó tarde</tspan></text><rect x="10" y="394.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="421.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Acceso</tspan></text><rect x="270" y="394.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="413.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Dificultad para acceder a sistemas propios, credenciales caducadas y clientes sin</tspan></text><text x="600" y="429.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">acceso al panel ni a la API</tspan></text><rect x="10" y="457.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="482.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el propio post mortem rechaza una causa única y dice que fue una convergencia improbable de varios factores.</tspan></text><text x="470" y="499.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Verde: documentado por Cloudflare.</tspan></text><text x="470" y="546.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019.</tspan></text></svg>
