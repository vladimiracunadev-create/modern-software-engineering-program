<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" width="940" height="570" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo crecen los pasos de la expresión regular con el tamaño de la entrada</title><desc id="d">Líneas en escala logarítmica con los pasos del motor para emparejar la cadena x= seguida de varias x: con el patrón de ejemplo sin punto y coma, de 23 pasos con una x a 555 con veinte; con el punto y coma final, de 90 a 5 353.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="570" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo crecen los pasos de la expresión regular con el tamaño de la entrada</tspan></text><circle cx="22" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Patrón .*.*=.*</tspan></text><rect x="169.56" y="45" width="12" height="12" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Patrón .*.*=.*; (con punto y coma)</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="387" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="391.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="287" x2="910" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="287" x2="101.24" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="187" x2="910" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="187" x2="101.24" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="87" x2="910" y2="87" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="87" x2="101.24" y2="87" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="91.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="87" x2="101.24" y2="387" stroke="#5b7280" stroke-width="1.6"/><line x1="119.24" y1="87" x2="119.24" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="119.24" y1="387" x2="119.24" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="119.24" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="119.24" dy="0">1</tspan></text><line x1="159.912" y1="87" x2="159.912" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="159.912" y1="387" x2="159.912" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="159.912" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="159.912" dy="0">2</tspan></text><line x1="200.583" y1="87" x2="200.583" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="200.583" y1="387" x2="200.583" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="200.583" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="200.583" dy="0">3</tspan></text><line x1="485.284" y1="87" x2="485.284" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="485.284" y1="387" x2="485.284" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="485.284" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="485.284" dy="0">10</tspan></text><line x1="892" y1="87" x2="892" y2="387" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="387" x2="892" y2="392" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="408" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">20</tspan></text><line x1="101.24" y1="387" x2="910" y2="387" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 237)">Pasos del motor (escala logarítmica) (escala logarítmica)</text><text x="505.62" y="433" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="505.62" dy="0">Número de x después del signo igual</tspan></text><polyline points="119.24,350.827 159.912,335.149 200.583,321.679 892,212.571" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="119.24" cy="350.827" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="119.24" y="339.827" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">23</tspan></text><circle cx="159.912" cy="335.149" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="159.912" y="324.149" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="159.912" dy="0">33</tspan></text><circle cx="200.583" cy="321.679" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="200.583" y="310.679" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="200.583" dy="0">45</tspan></text><circle cx="892" cy="212.571" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="201.571" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">555</tspan></text><polyline points="119.24,291.576 892,114.14" fill="none" stroke="#c0432f" stroke-width="2.4" stroke-dasharray="7 4"/><rect x="113.74" y="286.076" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="119.24" y="280.576" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="119.24" dy="0">90</tspan></text><rect x="886.5" y="108.64" width="11" height="11" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="103.14" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">5 353</tspan></text><rect x="10" y="447" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Son los ejemplos del apéndice del post mortem, de una versión simplificada de la expresión real, que tenía tres bloques de</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«cualquier cosa». El crecimiento no es lineal: con 20 x el motor necesita 555 pasos, y con el punto y coma final, 5 353. La</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">expresión real nunca se midió así: es una ilustración del mecanismo.</tspan></text><text x="470" y="552.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, post mortem oficial del 2 de julio de 2019. Apéndice.</tspan></text></svg>
