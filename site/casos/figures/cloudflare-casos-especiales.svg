<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 638" width="940" height="638" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Casos especiales documentados y cómo se resuelven</title><desc id="d">Cinco tarjetas: una regla mala que llega a toda la red en segundos, un archivo de configuración que supera un límite, un centro de datos con energía por generadores sin aviso, ataques de más de un terabit por segundo y código de clientes ajeno que debe aislarse; cada una con su mecanismo y veredicto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="638" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Casos especiales documentados y cómo se resuelven</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Una regla de cortafuegos con regex que retrocede</tspan></text><text x="30" y="117.6" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">sin límite</tspan></text><polyline points="402,105.64 438,105.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="77" width="478" height="57.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="109.28" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">CPU agotada en todo el mundo durante 27 minutos (2019)</tspan></text><text x="24" y="151.28" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">El despliegue global rápido es una ventaja y un riesgo a la vez.</tspan></text><rect x="20" y="172.92" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="196.88" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Un archivo de configuración mayor que el límite</tspan></text><text x="30" y="213.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">del software</tspan></text><polyline points="402,201.56 438,201.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="172.92" width="478" height="57.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="452" y="196.88" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">Fallo del tráfico principal y recuperación con el archivo</tspan></text><text x="452" y="213.52" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="452" dy="0">anterior (2025)</tspan></text><text x="24" y="247.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Los datos internos deben validarse como si vinieran de un usuario.</tspan></text><rect x="20" y="268.84" width="378" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="292.8" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Un centro de datos que pasa a generadores sin</tspan></text><text x="30" y="309.44" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">avisar</tspan></text><polyline points="402,297.48 438,297.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="268.84" width="478" height="57.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="292.8" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">Panel y análisis caídos casi dos días; el tráfico siguió</tspan></text><text x="452" y="309.44" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">(2023)</tspan></text><text x="24" y="343.12" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">La alta disponibilidad no cubría servicios nuevos ni dependencias no obvias.</tspan></text><rect x="20" y="364.76" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="388.72" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Ataques de más de 1 Tbps de forma rutinaria</tspan></text><polyline points="402,385.08 438,385.08" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="364.76" width="478" height="40.64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="452" y="388.72" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="452" dy="0">Absorción en la red distribuida</tspan></text><text x="24" y="422.4" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Máximos de 29,7 Tbps medidos en 2025.</tspan></text><rect x="20" y="444.04" width="378" height="40.64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="468" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Código de miles de clientes en un solo proceso</tspan></text><polyline points="402,464.36 438,464.36" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="442" y="444.04" width="478" height="40.64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="452" y="468" font-size="13" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="452" dy="0">Aislados de V8 con límites de CPU y memoria</tspan></text><text x="24" y="501.68" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Menos aislamiento que una máquina virtual, a cambio de arranque rápido.</tspan></text><rect x="10" y="525.32" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="550.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada tarjeta enlaza un hecho citado con el mecanismo. Color: coral falla, teal se sostiene, gold depende. Dónde deja de</tspan></text><text x="470" y="566.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: son casos documentados por Cloudflare, que cuenta sus propios fallos.</tspan></text><text x="470" y="610.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de Cloudflare (blog.cloudflare.com), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
