<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 546" width="940" height="546" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cloudflare entre los sitios, los usuarios y el resto de Internet</title><desc id="d">Diagrama de contexto: los clientes ponen sus sitios y aplicaciones detrás de la red de Cloudflare; los usuarios finales llegan a ella en vez de al origen; la red se interconecta con proveedores de acceso y nubes; los desarrolladores ejecutan código en ella; los atacantes la prueban con ataques de denegación de servicio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="546" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cloudflare entre los sitios, los usuarios y el resto de Internet</tspan></text><rect x="24" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="131" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">Clientes: sitios y</tspan></text><text x="131" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">aplicaciones, de gratis a</tspan></text><text x="131" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">grandes empresas</tspan></text><rect x="250" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Usuarios finales: llegan</tspan></text><text x="357" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">por la red más cercana</tspan></text><rect x="476" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="583" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">Desarrolladores: Workers,</tspan></text><text x="583" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">almacenamiento y datos</tspan></text><rect x="702" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="809" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">Proveedores de acceso,</tspan></text><text x="809" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">nubes y empresas: más de</tspan></text><text x="809" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">13 000 redes</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="221.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Cloudflare: red global entre usuarios y</tspan></text><text x="470" y="239.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">orígenes</tspan></text><polyline points="131,125 334.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">contratan</tspan></text><polyline points="357,125 424.8,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">visitan</tspan></text><polyline points="583,125 515.2,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">programan</tspan></text><polyline points="809,125 605.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">se interconectan</tspan></text><rect x="24" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="131" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">Servidores de origen del</tspan></text><text x="131" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">cliente</tspan></text><rect x="250" y="345" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="357" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="357" dy="0">Atacantes: botnets y</tspan></text><text x="357" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="357" dy="0">ataques volumétricos</tspan></text><rect x="476" y="345" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="583" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="583" dy="0">Reguladores y gobiernos:</tspan></text><text x="583" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="583" dy="0">privacidad y soberanía de</tspan></text><text x="583" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="583" dy="0">datos</tspan></text><rect x="702" y="345" width="214" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="809" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="809" dy="0">Competidores: otras redes</tspan></text><text x="809" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="809" dy="0">de distribución y de</tspan></text><text x="809" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="809" dy="0">seguridad</tspan></text><polyline points="334.4,259 131,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">proxy hacia</tspan></text><polyline points="424.8,259 357,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">atacan</tspan></text><polyline points="515.2,259 583,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">exigen</tspan></text><polyline points="605.6,259 809,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">disputan</tspan></text><rect x="10" y="439" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el 10-K de 2025: la red cubre más de 330 ciudades en más de 125 países y se interconecta con más de 13 000</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">redes, incluidos proveedores de acceso, nubes y empresas. Dónde deja de valer: no muestra volúmenes de tráfico por actor.</tspan></text><text x="470" y="528.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Cloudflare del año terminado el 31 de diciembre de 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
