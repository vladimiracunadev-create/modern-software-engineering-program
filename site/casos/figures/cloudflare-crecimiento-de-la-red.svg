<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 504" width="940" height="504" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Crecimiento de la red de Cloudflare entre el prospecto de 2019 y el informe de 2025</title><desc id="d">Barras con ciudades de la red: 194 en 2019 y más de 330 en 2025; los países pasan de más de 90 a más de 125 y las redes interconectadas de más de 8 000 a más de 13 000.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="504" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Crecimiento de la red de Cloudflare entre el prospecto de 2019 y el informe de 2025</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">2019 (prospecto)</tspan></text><rect x="184.64" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="204.64" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="204.64" dy="0">2025 (10-K)</tspan></text><line x1="78.62" y1="345" x2="920" y2="345" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="345" x2="78.62" y2="345" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="349.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="282.5" x2="920" y2="282.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="282.5" x2="78.62" y2="282.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="287" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="220" x2="920" y2="220" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="220" x2="78.62" y2="220" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="157.5" x2="920" y2="157.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="157.5" x2="78.62" y2="157.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="162" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="345" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 220)">ciudades, países y cientos de redes</text><rect x="106.666" y="223.75" width="110.184" height="121.25" rx="3" fill="#6b7c86"/><text x="161.758" y="217.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">194</tspan></text><rect x="220.85" y="138.75" width="110.184" height="206.25" rx="3" fill="#087f8c"/><text x="275.942" y="132.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">330</tspan></text><text x="218.85" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Ciudades</tspan></text><rect x="387.126" y="288.75" width="110.184" height="56.25" rx="3" fill="#6b7c86"/><text x="442.218" y="282.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">90</tspan></text><rect x="501.31" y="266.875" width="110.184" height="78.125" rx="3" fill="#087f8c"/><text x="556.402" y="260.875" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">125</tspan></text><text x="499.31" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Países</tspan></text><rect x="667.586" y="295" width="110.184" height="50" rx="3" fill="#6b7c86"/><text x="722.678" y="289" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">80</tspan></text><rect x="781.77" y="263.75" width="110.184" height="81.25" rx="3" fill="#087f8c"/><text x="836.862" y="257.75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">130</tspan></text><text x="779.77" y="366" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Redes interconectadas (cientos)</tspan></text><rect x="10" y="397" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="421.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los valores son mínimos («más de»): 2019 informa 194 ciudades, más de 90 países y más de 8 000 redes; 2025, más de 330, más</tspan></text><text x="470" y="438.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 125 y más de 13 000. Dónde deja de valer: la tercera categoría está expresada en cientos de redes para compartir escala.</tspan></text><text x="470" y="486.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: prospecto 424B4 de septiembre de 2019 y 10-K de 2025 de Cloudflare (SEC).</tspan></text></svg>
