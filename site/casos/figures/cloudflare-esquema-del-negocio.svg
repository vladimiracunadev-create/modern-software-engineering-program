<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se financia Cloudflare: suscripciones a una red que crece</title><desc id="d">Flujo del negocio: los clientes pagan suscripciones por acceder a la red y a sus productos de seguridad, rendimiento y desarrollo; el ingreso se reparte en coste de la red, ventas, ingeniería y administración; la escala de la red baja el coste por unidad y atrae más clientes; el negocio es todavía deficitario en resultado contable pero positivo en caja.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="14" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Clientes gratuitos y de</tspan></text><text x="111" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">pago: 332 466 de pago</tspan></text><rect x="256" y="14" width="202" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Suscripciones por acceso</tspan></text><text x="357" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">a la red y productos</tspan></text><polyline points="212,56 256,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="603" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="603" dy="0">Ingreso de 2 168</tspan></text><text x="603" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="603" dy="0">millones de USD en 2025</tspan></text><polyline points="458,56 502,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Retención neta de</tspan></text><text x="849" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">dólares del 120 %</tspan></text><polyline points="704,56 748,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="202" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="111" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">Coste de ingresos: 25 %</tspan></text><rect x="256" y="138" width="202" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="357" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="357" dy="0">Ventas y marketing: 42 %</tspan></text><polyline points="212,180 256,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="138" width="202" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="603" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="603" dy="0">I+D y administración: 42</tspan></text><text x="603" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="603" dy="0">%</tspan></text><polyline points="458,180 502,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="138" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Flujo de caja libre: 12</tspan></text><text x="849" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">% del ingreso</tspan></text><polyline points="704,180 748,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="849,98 849,118 111,118 111,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado en el 10-K de 2025: el ingreso proviene principalmente de suscripciones a la red y a los productos, con servicios</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">de soporte; no se entrega el software de la red. Inferido: la lectura del círculo virtuoso de escala; el 10-K lo describe en</tspan></text><text x="480" y="294.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">términos de dinámicas de coste.</tspan></text><text x="480" y="335.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuente: 10-K de Cloudflare del año terminado el 31 de diciembre de 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
