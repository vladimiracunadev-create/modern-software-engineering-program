<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cloudflare de 2009 a 2026: empresa, escala y fallos</title><desc id="d">Línea de tiempo con tres carriles: la empresa (constituida en julio de 2009, cotizada desde septiembre de 2019), la red (194 ciudades en 2019 y más de 330 en 2025) y los fallos publicados (julio de 2019, noviembre de 2023 y noviembre de 2025).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cloudflare de 2009 a 2026: empresa, escala y fallos</tspan></text><line x1="88.42" y1="83" x2="88.42" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="88.42" y1="221" x2="88.42" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="88.42" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="88.42" dy="0">2009</tspan></text><line x1="271.438" y1="83" x2="271.438" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="271.438" y1="221" x2="271.438" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="271.438" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="271.438" dy="0">2013</tspan></text><line x1="454.456" y1="83" x2="454.456" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="454.456" y1="221" x2="454.456" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="454.456" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="454.456" dy="0">2017</tspan></text><line x1="637.473" y1="83" x2="637.473" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="637.473" y1="221" x2="637.473" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="637.473" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="637.473" dy="0">2021</tspan></text><line x1="820.491" y1="83" x2="820.491" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="820.491" y1="221" x2="820.491" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="820.491" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="820.491" dy="0">2025</tspan></text><line x1="912" y1="83" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="221" x2="912" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2027</tspan></text><line x1="88.42" y1="221" x2="912" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="78.42" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="78.42" dy="0">Empresa</tspan></text><text x="78.42" y="156.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="78.42" dy="0">Red</tspan></text><text x="78.42" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="78.42" dy="0">Fallos</tspan></text><line x1="111.297" y1="75" x2="111.297" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="111.297" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="111.297" dy="0">constitución</tspan></text><line x1="577.993" y1="75" x2="577.993" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="577.993" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="577.993" dy="0">IPO</tspan></text><line x1="767.873" y1="75" x2="767.873" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="767.873" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="767.873" dy="0">Oregón</tspan></text><line x1="860.755" y1="75" x2="860.755" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="860.755" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="860.755" dy="0">18 nov</tspan></text><rect x="111.297" y="92" width="466.695" height="28" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="344.645" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="344.645" dy="0">Empresa privada</tspan></text><rect x="577.993" y="92" width="288.253" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="722.119" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722.119" dy="0">Cotizada (NYSE: NET)</tspan></text><line x1="14" y1="129" x2="912" y2="129" stroke="#d5dde1" stroke-width="1"/><rect x="577.993" y="138" width="288.253" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="722.119" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722.119" dy="0">194 a más de 330 ciudades</tspan></text><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="568.842" y="184" width="2.28772" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="767.873" y="184" width="2.28772" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="860.755" y="184" width="2.28772" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="500.21" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="500.21" dy="0">año</tspan></text><rect x="10" y="279" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hechos con fuente: constitución en Delaware en julio de 2009 y oferta pública a 15 dólares por acción con símbolo NET</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(prospecto de septiembre de 2019); red de 194 ciudades en 2019 y más de 330 en 2025; caídas del 2 de julio de 2019, del 2</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de noviembre de 2023 y del 18 de noviembre de 2025. Dónde deja de valer: el lanzamiento comercial de 2010 no figura en las</tspan></text><text x="470" y="353.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fuentes consultadas y no se dibuja.</tspan></text><text x="470" y="401.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: prospecto de 2019, 10-K de 2025 y blog de Cloudflare.</tspan></text></svg>
