<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pares clave-valor de configuración que Cloudflare distribuye con Quicksilver</title><desc id="d">Línea con 100 millones de pares clave-valor en 2015, más de 200 millones en 2017, más de 500 millones en 2018 y más de 1 000 millones en 2019: el volumen se multiplica por diez en cuatro años.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pares clave-valor de configuración que Cloudflare distribuye con Quicksilver</tspan></text><line x1="93.7" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="359" x2="93.7" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="299" x2="910" y2="299" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="299" x2="93.7" y2="299" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="303.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">200</tspan></text><line x1="93.7" y1="239" x2="910" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="239" x2="93.7" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">400</tspan></text><line x1="93.7" y1="179" x2="910" y2="179" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="179" x2="93.7" y2="179" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="183.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">600</tspan></text><line x1="93.7" y1="119" x2="910" y2="119" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="119" x2="93.7" y2="119" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="123.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">800</tspan></text><line x1="93.7" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="59" x2="93.7" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1000</tspan></text><line x1="93.7" y1="59" x2="93.7" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="111.7" y1="59" x2="111.7" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="111.7" y1="359" x2="111.7" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="111.7" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111.7" dy="0">2015</tspan></text><line x1="501.85" y1="59" x2="501.85" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="501.85" y1="359" x2="501.85" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="501.85" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="501.85" dy="0">2017</tspan></text><line x1="696.925" y1="59" x2="696.925" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="696.925" y1="359" x2="696.925" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="696.925" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696.925" dy="0">2018</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">2019</tspan></text><line x1="93.7" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Millones de pares clave-valor</text><text x="501.85" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="501.85" dy="0">Año</tspan></text><polyline points="111.7,329 501.85,299 696.925,209 892,59" fill="none" stroke="#102a43" stroke-width="2.4"/><circle cx="111.7" cy="329" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="111.7" y="318" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="111.7" dy="0">100</tspan></text><circle cx="501.85" cy="299" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="501.85" y="288" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="501.85" dy="0">200</tspan></text><circle cx="696.925" cy="209" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="696.925" y="198" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="696.925" dy="0">500</tspan></text><circle cx="892" cy="59" r="5.5" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="892" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">1000</tspan></text><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El post cuenta que en 2015 había ocho instancias de Kyoto Tycoon con unos 200 cambios por segundo, que el proyecto no tenía</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mantenedor y que se construyó Quicksilver, que hoy sirve 2,5 billones de lecturas al día con latencia de microsegundos.</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: los valores de 2017 a 2019 son «más de»; no hay serie anual completa.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Quicksilver: Configuration Distribution at Internet Scale», blog.cloudflare.com.</tspan></text></svg>
