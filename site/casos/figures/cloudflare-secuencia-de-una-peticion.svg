<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 529" width="940" height="529" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una petición de un usuario a través de Cloudflare</title><desc id="d">Secuencia de una petición: el usuario resuelve el nombre y llega por anycast a la ciudad más cercana; el proxy aplica las reglas de seguridad y de caché; si hay un Worker lo ejecuta; si falta, consulta el origen reutilizando una conexión del grupo común; devuelve la respuesta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="529" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una petición de un usuario a través de Cloudflare</tspan></text><rect x="26" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="110" dy="0">Usuario</tspan></text><rect x="206" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="290" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290" dy="0">Ciudad más cercana</tspan></text><rect x="386" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Proxy</tspan></text><rect x="566" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="650" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="650" dy="0">Reglas y Workers</tspan></text><rect x="746" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">Origen</tspan></text><line x1="110" y1="104" x2="110" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="290" y1="104" x2="290" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="470" y1="104" x2="470" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="650" y1="104" x2="650" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="830" y1="104" x2="830" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="113,138 287,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="200" y="114" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="200" dy="0">1. llega por la dirección</tspan><tspan x="200" dy="16.64">anycast</tspan></text><polyline points="293,184 467,184" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380" y="176" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="380" dy="0">2. entrega al proxy HTTP</tspan></text><polyline points="473,230 647,230" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="206" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="560" dy="0">3. cortafuegos, bots, caché y</tspan><tspan x="560" dy="16.64">código</tspan></text><polyline points="473,276 827,276" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="650" y="268" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="650" dy="0">4. si falta, pide al origen con conexión reutilizada</tspan></text><polyline points="827,322 473,322" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="650" y="314" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="650" dy="0">5. respuesta del origen</tspan></text><polyline points="467,368 113,368" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="290" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="290" dy="0">6. respuesta al usuario</tspan></text><rect x="10" y="420" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado por partes: el proxy Pingora y su reutilización de conexiones, las reglas de borde y los Workers vienen de</tspan></text><text x="470" y="461.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">posts distintos. Inferido: el orden exacto de las etapas. Dónde deja de valer: omite TLS, DNS, límites de tasa y las rutas</tspan></text><text x="470" y="478.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de Tunnel y R2.</tspan></text><text x="470" y="515.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de Cloudflare (blog.cloudflare.com), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
