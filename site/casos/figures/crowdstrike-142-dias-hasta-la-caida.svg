<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 398" width="940" height="398" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">142 días entre la disponibilidad del sensor 7.11 y la caída</title><desc id="d">Línea de tiempo en días desde el 28 de febrero de 2024. El sensor 7.11 está disponible desde el día 0. La primera instancia IPC se despliega el día 6, tres más entre los días 40 y 56, todas sin incidentes. El día 142 se despliegan dos instancias, una con el criterio no comodín en el campo 21, y se produce la caída.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="398" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">142 días entre la disponibilidad del sensor 7.11 y la caída</tspan></text><line x1="144.84" y1="83" x2="144.84" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="144.84" y1="233" x2="144.84" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="144.84" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="144.84" dy="0">0</tspan></text><line x1="298.272" y1="83" x2="298.272" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="298.272" y1="233" x2="298.272" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="298.272" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="298.272" dy="0">30</tspan></text><line x1="451.704" y1="83" x2="451.704" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="451.704" y1="233" x2="451.704" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="451.704" 