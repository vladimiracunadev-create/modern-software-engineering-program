5.17" dy="0">5 mar</tspan></text><line x1="349.416" y1="75" x2="349.416" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="349.416" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="349.416" dy="0">8 abr</tspan></text><line x1="431.246" y1="75" x2="431.246" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="431.246" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="431.246" dy="0">24 abr</tspan></text><line x1="871.085" y1="75" x2="871.085" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="871.085" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="871.085" dy="0">19 jul</tspan></text><rect x="144.84" y="92" width="726.245" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="507.962" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="507.962" dy="0">Disponible con el Template Type IPC compilado</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="175.526" y="142" width="10.2288" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="349.416" y="142" width="81.8304" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="390.331" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="390.331" dy="0">3</tspan></text><rect x="871.085" y="142" width="10.2288" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="175.526" y="192" width="255.72" height="32" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="303.386" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="303.386" dy="0">sin incidentes en producción</tspan></text><rect x="871.085" y="192" width="40.9152" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="528.42" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="528.42" dy="0">días desde el 28 de febrero de 2024 (sensor 7.11)</tspan></text><rect x="10" y="291" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Que cuatro despliegues funcionaran no probó que el quinto lo hiciera: los anteriores usaban un comodín en el campo 21 y la</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entrada que faltaba nunca se leyó. Los días son cálculo propio a partir de las fechas del informe.</tspan></text><text x="470" y="380.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: revisión preliminar del incidente de CrowdStrike (julio de 2024) y análisis de causa raíz (6 ago 2024).</tspan></text></svg>
