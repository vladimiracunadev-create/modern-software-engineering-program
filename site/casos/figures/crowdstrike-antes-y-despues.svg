<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 538" width="940" height="538" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del reparto a toda la flota a un despliegue por anillos con control del cliente</title><desc id="d">Dos filas de cajas. La fila superior muestra el recorrido del 19 de julio: validador, publicación a todos los sensores conectados y caída de los equipos. La fila inferior muestra el recorrido prometido en el análisis de causa raíz: validador con comprobaciones nuevas, pruebas por instancia, canary, anillos con tiempo de observación y control del cliente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="538" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Del reparto a toda la flota a un despliegue por anillos con control del cliente</tspan></text><text x="14" y="63" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="14" dy="0">Antes (19 de julio de 2024)</tspan></text><rect x="10" y="75" width="262" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="141" y="103.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="141" dy="0">Validador: acepta la instancia</tspan></text><text x="141" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="141" dy="0">con un campo 21 sin respaldo</tspan></text><rect x="312" y="75" width="262" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="443" y="103.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="443" dy="0">Publicación a todos los sensores</tspan></text><text x="443" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="443" dy="0">conectados</tspan></text><polyline points="272,108 312,108" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="614" y="75" width="262" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="745" y="103.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="745" dy="0">Caída de los equipos Windows</tspan></text><text x="745" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="745" dy="0">7.11+ que recibieron el archivo</tspan></text><polyline points="574,108 614,108" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="14" y="179" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="14" dy="0">Después (compromisos del análisis de causa raíz)</tspan></text><rect x="10" y="193" width="168" height="88" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="94" y="215.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="94" dy="0">Validador con</tspan></text><text x="94" y="232.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="94" dy="0">comprobación de</tspan></text><text x="94" y="248.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="94" dy="0">campos pedidos y</tspan></text><text x="94" y="265.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="94" dy="0">entregados</tspan></text><rect x="198" y="193" width="168" height="88" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="282" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="282" dy="0">Prueba de cada</tspan></text><text x="282" y="240.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="282" dy="0">instancia con</tspan></text><text x="282" y="257.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="282" dy="0">criterios no comodín</tspan></text><polyline points="178,237 198,237" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="386" y="193" width="168" height="88" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="232.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Canary: un grupo</tspan></text><text x="470" y="248.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">pequeño primero</tspan></text><polyline points="366,237 386,237" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="574" y="193" width="168" height="88" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="658" y="224" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="658" dy="0">Anillos más amplios</tspan></text><text x="658" y="240.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="658" dy="0">con tiempo de</tspan></text><text x="658" y="257.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="658" dy="0">observación</tspan></text><polyline points="554,237 574,237" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="762" y="193" width="168" height="88" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="846" y="232.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="846" dy="0">El cliente elige</tspan></text><text x="846" y="248.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="846" dy="0">dónde y cuándo</tspan></text><polyline points="742,237 762,237" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="301" width="920" height="108" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="323" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Defensas en el propio sensor</tspan></text><rect x="24" y="333" width="280" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="359.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="164" dy="0">Comprobación de límites del arreglo</tspan></text><text x="164" y="375.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="164" dy="0">(25 jul)</tspan></text><rect x="330" y="333" width="280" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="359.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">El compilador valida el número de</tspan></text><text x="470" y="375.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">entradas (27 jul)</tspan></text><rect x="636" y="333" width="280" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="776" y="359.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="776" dy="0">Fuzzing de los manejadores de</tspan></text><text x="776" y="375.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="776" dy="0">contenido</tspan></text><rect x="10" y="431" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="455.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las fechas son las que informa CrowdStrike como implantadas o comprometidas al 6 de agosto de 2024. Que cada compromiso se</tspan></text><text x="470" y="472.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cumpliera y fuera suficiente no lo documenta el informe: es lo que el programa llama una afirmación por verificar.</tspan></text><text x="470" y="520.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
