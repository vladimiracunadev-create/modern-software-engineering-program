<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" width="940" height="512" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arquitectura posterior: el contenido pasa por puertas y las señales de salud deciden si avanza</title><desc id="d">Pipeline de contenido con puertas: creación, validación ampliada, prueba de cada instancia contra el intérprete, canary y anillos sucesivos hasta toda la flota. Un bucle de señales de salud decide promover o retroceder y el cliente elige dónde y cuándo. En el sensor: comprobación de límites y de cuenta, versión buena de respaldo y análisis fuera del kernel.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="512" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Arquitectura posterior: el contenido pasa por puertas y las señales de salud deciden si avanza</tspan></text><rect x="10" y="53" width="140" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="80" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="80" dy="0">Crear instancia</tspan></text><rect x="166" y="53" width="140" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="236" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236" dy="0">Validación</tspan></text><text x="236" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="236" dy="0">ampliada</tspan></text><polyline points="150,86 166,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="322" y="53" width="140" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="392" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="392" dy="0">Probar contra el</tspan></text><text x="392" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="392" dy="0">intérprete real</tspan></text><polyline points="306,86 322,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="53" width="140" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="548" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="548" dy="0">Canary</tspan></text><polyline points="462,86 478,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="634" y="53" width="140" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="704" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="704" dy="0">Anillos con</tspan></text><text x="704" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="704" dy="0">observación</tspan></text><polyline points="618,86 634,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="790" y="53" width="140" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="860" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="860" dy="0">Toda la flota</tspan></text><polyline points="774,86 790,86" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="165" width="300" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="160" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">Señales de salud: caídas, reinicios,</tspan></text><text x="160" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">latencia del anillo</tspan></text><polyline points="160,165 160,119" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="340" y="165" width="280" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Regla: promover o retroceder de</tspan></text><text x="480" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">forma automática</tspan></text><polyline points="310,198 340,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="480,165 480,119" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="650" y="165" width="280" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">El cliente decide dónde y cuándo se</tspan></text><text x="790" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">entrega</tspan></text><polyline points="790,165 790,119" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="261" width="920" height="118" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="283" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">En el equipo</tspan></text><rect x="24" y="293" width="280" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="164" y="321.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164" dy="0">Comprobación de límites y de cuenta</tspan></text><text x="164" y="337.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="164" dy="0">de entradas</tspan></text><rect x="330" y="293" width="280" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Volver a la última versión buena</tspan></text><text x="470" y="337.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del archivo</tspan></text><rect x="636" y="293" width="280" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="776" y="321.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="776" dy="0">Kernel mínimo: análisis de</tspan></text><text x="776" y="337.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="776" dy="0">contenido en modo usuario</tspan></text><rect x="10" y="405" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="429.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Teal: comprometido o implantado por CrowdStrike o Microsoft según sus publicaciones. Dorado: propuesta de este programa que</tspan></text><text x="470" y="446.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las fuentes no documentan. Vigencia actual sin verificar.</tspan></text><text x="470" y="494.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
