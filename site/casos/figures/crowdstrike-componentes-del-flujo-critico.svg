<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 630" width="940" height="630" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una cuenta, seis creencias: qué suponía cada componente sobre el número de entradas</title><desc id="d">Cadena vertical de seis componentes unidos por flechas. La definición de tipos declara 21 campos; la interfaz de creación y el validador suponen 21; el código de integración del sensor entrega 20; el intérprete pide el índice 21 sin comprobar límites; Windows detiene el sistema. Cada componente muestra el número que creía y si comprobaba la cuenta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="630" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una cuenta, seis creencias: qué suponía cada componente sobre el número de entradas</tspan></text><rect x="10" y="49" width="400" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="210" y="73.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">Archivo Template Type Definitions: define los campos</tspan></text><text x="210" y="89.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">del tipo</tspan></text><rect x="440" y="55" width="130" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="505" y="81.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="505" dy="0">declara 21</tspan></text><rect x="600" y="55" width="330" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="765" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765" dy="0">sin comprobación al compilar</tspan></text><polyline points="210,107 210,127" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="127" width="400" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="210" y="151.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">Interfaz de creación de instancias, generada de esa</tspan></text><text x="210" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">definición</tspan></text><rect x="440" y="133" width="130" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="505" y="159.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="505" dy="0">ofrece 21</tspan></text><rect x="600" y="133" width="330" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="765" y="159.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765" dy="0">usa la misma definición</tspan></text><polyline points="210,185 210,205" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="205" width="400" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="210" y="229.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">Content Validator: evalúa cada instancia contra la</tspan></text><text x="210" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">definición</tspan></text><rect x="440" y="211" width="130" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="505" y="237.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="505" dy="0">asume 21</tspan></text><rect x="600" y="211" width="330" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="765" y="237.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="765" dy="0">no comprueba lo que entrega el código</tspan></text><polyline points="210,263 210,283" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="283" width="400" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="210" y="307.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">Código de integración del sensor: arma el arreglo de</tspan></text><text x="210" y="323.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">entradas</tspan></text><rect x="440" y="289" width="130" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="505" y="315.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="505" dy="0">entrega 20</tspan></text><rect x="600" y="289" width="330" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="765" y="315.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="765" dy="0">no se comparaba con la definición</tspan></text><polyline points="210,341 210,361" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="361" width="400" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="210" y="393.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">Content Interpreter: lee la entrada por índice</tspan></text><rect x="440" y="367" width="130" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="505" y="393.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="505" dy="0">pide el 21</tspan></text><rect x="600" y="367" width="330" height="46" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="765" y="393.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="765" dy="0">sin comprobación de límites</tspan></text><polyline points="210,419 210,439" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="439" width="400" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="210" y="471.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="210" dy="0">Windows: ante lectura inválida en kernel</tspan></text><rect x="440" y="445" width="130" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="505" y="463.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="505" dy="0">detiene el</tspan></text><text x="505" y="479.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="505" dy="0">sistema</tspan></text><rect x="600" y="445" width="330" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="765" y="471.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="765" dy="0">regla del sistema operativo</tspan></text><rect x="10" y="523" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="547.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El desajuste nace entre las filas 1 y 4 y se vuelve daño en la 5. Las tres primeras filas comparten la misma suposición;</tspan></text><text x="470" y="564.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por eso sumar controles que la comparten no agrega protección.</tspan></text><text x="470" y="612.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
