<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 518" width="940" height="518" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contenedores: lo que vive en la nube y lo que vive, con distinto privilegio, en el equipo</title><desc id="d">Diagrama de contenedores. En la nube: sistema de configuración de contenido, validador y distribución de archivos de canal. En el equipo Windows: aplicaciones de negocio en modo usuario; en modo kernel, el controlador csagent.sys y el intérprete de contenido con el motor de detección; y, en disco, los archivos de canal que el intérprete lee.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="518" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Contenedores: lo que vive en la nube y lo que vive, con distinto privilegio, en el equipo</tspan></text><rect x="10" y="45" width="320" height="262" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Nube de CrowdStrike</tspan></text><rect x="28" y="85" width="284" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="170" y="108.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170" dy="0">Content Configuration System: crea</tspan></text><text x="170" y="124.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170" dy="0">Template Instances</tspan></text><rect x="28" y="161" width="284" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="170" y="184.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="170" dy="0">Content Validator: comprueba la</tspan></text><text x="170" y="200.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="170" dy="0">instancia</tspan></text><rect x="28" y="237" width="284" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="170" y="268.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="170" dy="0">Distribución de archivos de canal</tspan></text><polyline points="170,141 170,161" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="170,217 170,237" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="350" y="45" width="580" height="340" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="364" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="364" dy="0">Equipo Windows del cliente</tspan></text><rect x="366" y="81" width="548" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="640" y="104.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="640" dy="0">Aplicaciones de negocio (modo usuario)</tspan></text><rect x="366" y="137" width="548" height="170" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="380" y="159" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="380" dy="0">Modo kernel</tspan></text><rect x="382" y="171" width="250" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="507" y="213" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">csagent.sys: controlador de</tspan></text><text x="507" y="229.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">filtro que recibe las</tspan></text><text x="507" y="246.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="507" dy="0">notificaciones de Windows</tspan></text><rect x="652" y="171" width="246" height="110" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="775" y="213" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="775" dy="0">Content Interpreter y Sensor</tspan></text><text x="775" y="229.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="775" dy="0">Detection Engine: código C++</tspan></text><text x="775" y="246.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="775" dy="0">del sensor</tspan></text><polyline points="632,226 652,226" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="366" y="325" width="548" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="640" y="350.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="640" dy="0">Archivos de canal en disco, carpeta de CrowdStrike en System32 drivers</tspan></text><polyline points="775,325 775,281" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="312,265 336,265 336,347 366,347" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="411" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="435.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Solo el rectángulo coral, el intérprete, detiene el sistema operativo entero cuando lee mal. Todo lo demás, incluida la</tspan></text><text x="470" y="452.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">nube, puede fallar sin parar el equipo.</tspan></text><text x="470" y="500.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
