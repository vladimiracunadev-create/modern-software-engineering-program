<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 298" width="940" height="298" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Gastos atribuidos al incidente del 19 de julio en el ejercicio fiscal 2025: unos 60 millones</title><desc id="d">Una barra apilada en millones de dólares: 21,4 de ventas y marketing, 6,8 de investigación y desarrollo y 31,9 de gastos generales y de administración, unos 60,1 en total.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="298" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Gastos atribuidos al incidente del 19 de julio en el ejercicio fiscal 2025: unos 60 millones</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ventas y marketing</tspan></text><rect x="199.72" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="219.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="219.72" dy="0">Investigación y desarrollo</tspan></text><rect x="443.76" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="463.76" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="463.76" dy="0">Generales y de administración</tspan></text><line x1="194" y1="77" x2="194" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="117" x2="194" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><line x1="364.425" y1="77" x2="364.425" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="364.425" y1="117" x2="364.425" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="364.425" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="364.425" dy="0">20</tspan></text><line x1="534.85" y1="77" x2="534.85" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="534.85" y1="117" x2="534.85" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="534.85" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="534.85" dy="0">40</tspan></text><line x1="705.275" y1="77" x2="705.275" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="705.275" y1="117" x2="705.275" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="705.275" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705.275" dy="0">60</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="117" x2="875.7" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">80</tspan></text><line x1="194" y1="117" x2="875.7" y2="117" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="184" dy="0">Gastos por función</tspan></text><rect x="194" y="84" width="182.355" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="285.177" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="285.177" dy="0">21,4</tspan></text><rect x="376.355" y="84" width="57.9445" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="405.327" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="405.327" dy="0">6,8</tspan></text><rect x="434.299" y="84" width="271.828" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="570.213" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="570.213" dy="0">31,9</tspan></text><text x="713.127" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="713.127" dy="0">60,1</tspan></text><text x="534.85" y="161" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="534.85" dy="0">millones de dólares</tspan></text><rect x="10" y="175" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Es el costo reconocido por la empresa en ese ejercicio, no el costo total. El importe de los paquetes de compromiso con</tspan></text><text x="470" y="216.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">clientes no es público; las pérdidas de los clientes (estimación de Parametrix: 5.400 millones para las 500 mayores</tspan></text><text x="470" y="233.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">empresas de EE. UU.) son de otro orden.</tspan></text><text x="470" y="280.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe anual 10-K de CrowdStrike (ejercicio fiscal 2025); esquema propio.</tspan></text></svg>
