<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 448" width="940" height="448" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Infraestructura de entrega: de la nube de CrowdStrike a la flota, sin etapas intermedias</title><desc id="d">Diagrama de izquierda a derecha. En AWS y centros de colocación: sistema de configuración, validador y distribución de archivos de canal; aparte, un entorno de pruebas con varios sistemas operativos. En el centro, la distribución a sensores en línea. A la derecha, la flota de clientes. Una flecha punteada marca la ausencia de etapas intermedias en julio de 2024.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="448" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Infraestructura de entrega: de la nube de CrowdStrike a la flota, sin etapas intermedias</tspan></text><rect x="10" y="45" width="300" height="270" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">AWS y centros de colocación</tspan></text><rect x="26" y="85" width="268" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="108.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Sistema de configuración y</tspan></text><text x="160" y="124.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">validador</tspan></text><rect x="26" y="155" width="268" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Distribución de archivos de canal</tspan></text><rect x="26" y="235" width="268" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="160" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">Entorno de pruebas: varios</tspan></text><text x="160" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">sistemas y cargas</tspan></text><polyline points="160,141 160,155" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="340" y="45" width="250" height="270" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="354" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="354" dy="0">Entrega</tspan></text><rect x="356" y="85" width="218" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="120.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Sensores en línea reciben</tspan></text><text x="465" y="136.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">el archivo al conectarse</tspan></text><rect x="356" y="195" width="218" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="465" y="230.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Sin canary, anillos ni</tspan></text><text x="465" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">elección del cliente</tspan></text><rect x="620" y="45" width="310" height="270" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="634" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="634" dy="0">Flota de clientes</tspan></text><rect x="636" y="85" width="278" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="775" y="108.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="775" dy="0">Equipos Windows con sensor 7.11 o</tspan></text><text x="775" y="124.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="775" dy="0">superior</tspan></text><rect x="636" y="155" width="278" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="775" y="186.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="775" dy="0">Equipos Mac y Linux: sin afectación</tspan></text><rect x="636" y="235" width="278" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="775" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="775" dy="0">Política de versión del cliente:</tspan></text><text x="775" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="775" dy="0">solo sensor</tspan></text><polyline points="294,183 340,125" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="590,125 636,113" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="341" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="365.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Capacidad, regiones y topología de red no son públicas. Lo documentado es que el archivo llegó a todos los sensores en</tspan></text><text x="470" y="382.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">línea durante 78 minutos y que el control del cliente sobre el contenido rápido se añadió después.</tspan></text><text x="470" y="430.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: RCA de CrowdStrike, revisión preliminar y 10-K del ejercicio fiscal 2025; esquema propio.</tspan></text></svg>
