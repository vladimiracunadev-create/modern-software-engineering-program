<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 574" width="940" height="574" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Veintiuna entradas pedidas, veinte entregadas: la lectura que no existía</title><desc id="d">Fila de 21 casillas numeradas del 1 al 21. Las casillas 1 a 20 son punteros válidos que entrega el sensor; la casilla 21 queda fuera del arreglo y no apunta a memoria válida. El intérprete de contenido pide el índice 0x14, es decir la entrada 21, lee una dirección inválida y Windows detiene el sistema con el código PAGE_FAULT_IN_NONPAGED_AREA.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="574" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Veintiuna entradas pedidas, veinte entregadas: la lectura que no existía</tspan></text><text x="40" y="59" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="40" dy="0">Arreglo de entradas que el sensor arma para el Template Type IPC</tspan></text><rect x="40" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="58" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="58" dy="0">1</tspan></text><rect x="80" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="98" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="98" dy="0">2</tspan></text><rect x="120" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="138" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="138" dy="0">3</tspan></text><rect x="160" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="178" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="178" dy="0">4</tspan></text><rect x="200" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="218" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="218" dy="0">5</tspan></text><rect x="240" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="258" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="258" dy="0">6</tspan></text><rect x="280" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="298" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="298" dy="0">7</tspan></text><rect x="320" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="338" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="338" dy="0">8</tspan></text><rect x="360" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="378" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="378" dy="0">9</tspan></text><rect x="400" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="418" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="418" dy="0">10</tspan></text><rect x="440" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="458" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="458" dy="0">11</tspan></text><rect x="480" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="498" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="498" dy="0">12</tspan></text><rect x="520" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="538" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="538" dy="0">13</tspan></text><rect x="560" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="578" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="578" dy="0">14</tspan></text><rect x="600" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="618" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="618" dy="0">15</tspan></text><rect x="640" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="658" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="658" dy="0">16</tspan></text><rect x="680" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="698" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="698" dy="0">17</tspan></text><rect x="720" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="738" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="738" dy="0">18</tspan></text><rect x="760" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="778" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="778" dy="0">19</tspan></text><rect x="800" y="71" width="36" height="40" rx="4" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="818" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="818" dy="0">20</tspan></text><rect x="840" y="71" width="36" height="40" rx="4" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="858" y="94.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="858" dy="0">21</tspan></text><line x1="36" y1="123" x2="832" y2="123" stroke="#087f8c" stroke-width="2"/><text x="436" y="143" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="436" dy="0">20 entradas válidas: lo que entrega el código del sensor</tspan></text><polyline points="854,157 854,117" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="830" y="173" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="830" dy="0">entrada 21: no hay puntero válido</tspan></text><rect x="40" y="203" width="410" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="245" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="245" dy="0">La definición del Template Type declaraba 21 campos.</tspan></text><text x="245" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="245" dy="0">El validador y las instancias del archivo 291 asumían</tspan></text><text x="245" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="245" dy="0">21.</tspan></text><rect x="490" y="203" width="410" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="695" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="695" dy="0">El código del sensor pasaba 20 al intérprete. Con un</tspan></text><text x="695" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="695" dy="0">comodín en el campo 21 nunca se leía; con un criterio</tspan></text><text x="695" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="695" dy="0">real, sí.</tspan></text><polyline points="245,277 245,303" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="695,277 695,303" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="303" width="860" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="332.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Content Interpreter lee el índice 0x14 (la entrada 21) → lee una dirección inválida en csagent.sys</tspan></text><polyline points="470,355 470,379" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="40" y="379" width="860" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="408.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="470" dy="0">Windows detiene el sistema (pantalla azul): PAGE_FAULT_IN_NONPAGED_AREA (0x50), módulo csagent.sys.</tspan></text><rect x="10" y="451" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="475.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La lectura fuera de límites no escribe memoria: el informe indica que no es una escritura arbitraria y que fue revisada de</tspan></text><text x="470" y="492.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">forma independiente. Documentado: el desajuste 21 frente a 20, el índice 0x14 y la excepción no recuperable. El bucle de</tspan></text><text x="470" y="509.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reinicios aparece en la guía de remediación de CrowdStrike, no en el análisis de causa raíz.</tspan></text><text x="470" y="556.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
