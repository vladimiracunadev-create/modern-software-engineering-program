<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 508" width="940" height="508" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Modelo de datos: tipo, instancia, archivo y arreglo de entradas, con sus cardinalidades</title><desc id="d">Cuatro entidades. Template Type: definición de 21 campos compilada también en el sensor. Template Instance: criterios por campo, muchas por tipo. Channel File 291: agrupa instancias de un tipo. Arreglo de entradas: se crea en cada evento de Windows con 20 punteros a estructuras de búfer y tamaño. El intérprete compara el arreglo con las instancias y el campo 21 no tiene entrada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="508" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Modelo de datos: tipo, instancia, archivo y arreglo de entradas, con sus cardinalidades</tspan></text><rect x="10" y="51" width="280" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="71.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Template Type</tspan></text><rect x="10" y="85" width="280" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="120" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">21 campos declarados</tspan></text><text x="150" y="136.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">se compila en el sensor</tspan></text><text x="150" y="153.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">cambiar exige nuevo sensor</tspan></text><rect x="330" y="51" width="280" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="71.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Template Instance</tspan></text><rect x="330" y="85" width="280" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="120" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">criterios regex por campo</tspan></text><text x="470" y="136.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">campo 21: comodín o criterio real</tspan></text><text x="470" y="153.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">es contenido, no código</tspan></text><rect x="650" y="51" width="280" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="790" y="71.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="790" dy="0">Channel File 291</tspan></text><rect x="650" y="85" width="280" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="790" y="120" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">agrupa instancias IPC</tspan></text><text x="790" y="136.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">se escribe en disco</tspan></text><text x="790" y="153.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">se lee en cada evento</tspan></text><polyline points="290,115 330,115" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="310" y="103" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">1 a n</tspan></text><polyline points="610,115 650,115" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="630" y="103" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630" dy="0">n a 1</tspan></text><rect x="10" y="245" width="280" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="265.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Código de integración</tspan></text><rect x="10" y="279" width="280" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="150" y="322.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">entrega 20 entradas al intérprete</tspan></text><text x="150" y="338.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">no se comparaba con el tipo</tspan></text><rect x="330" y="245" width="280" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="265.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Arreglo de entradas</tspan></text><rect x="330" y="279" width="280" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="314" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">se crea por evento de Windows</tspan></text><text x="470" y="330.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">20 punteros; cada uno apunta a</tspan></text><text x="470" y="347.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">búfer y tamaño</tspan></text><rect x="650" y="245" width="280" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="790" y="265.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="790" dy="0">Content Interpreter</tspan></text><rect x="650" y="279" width="280" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="790" y="314" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">compara arreglo e instancias</tspan></text><text x="790" y="330.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">lee por índice; 0x14 es la</tspan></text><text x="790" y="347.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">entrada 21</tspan></text><polyline points="290,310 330,310" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="310" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310" dy="0">arma</tspan></text><polyline points="610,310 650,310" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="630" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630" dy="0">lee</tspan></text><polyline points="150,181 150,245" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="162" y="217" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="162" dy="0">debía coincidir</tspan></text><polyline points="790,181 790,245" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="802" y="217" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="802" dy="0">le indica el índice</tspan></text><rect x="10" y="401" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="425.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las dos flechas verticales son las relaciones que importan. La de la izquierda, punteada, nadie la comprobaba; la de la</tspan></text><text x="470" y="442.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">derecha trae el índice 0x14 desde el contenido hasta el intérprete.</tspan></text><text x="470" y="490.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
