<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 322" width="940" height="322" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto de una pérdida estimada de 5.400 millones estaba asegurada</title><desc id="d">Dos barras horizontales de 5.400 millones de dólares cada una, la pérdida directa estimada por Parametrix para las 500 mayores empresas de Estados Unidos sin contar a Microsoft. En el escenario bajo, 540 millones están asegurados y 4.860 no; en el escenario alto, 1.080 millones asegurados y 4.320 no.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="322" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto de una pérdida estimada de 5.400 millones estaba asegurada</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Asegurada</tspan></text><rect x="131.86" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="151.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="151.86" dy="0">No asegurada</tspan></text><line x1="254" y1="77" x2="254" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="157" x2="254" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="461.233" y1="77" x2="461.233" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="461.233" y1="157" x2="461.233" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="461.233" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="461.233" dy="0">2 000</tspan></text><line x1="668.467" y1="77" x2="668.467" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="668.467" y1="157" x2="668.467" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="668.467" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="668.467" dy="0">4 000</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">6 000</tspan></text><line x1="254" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Escenario bajo de cobertura</tspan></text><text x="244" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="244" dy="0">Escenario alto de cobertura</tspan></text><rect x="254" y="84" width="55.953" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="281.976" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="281.976" dy="0">540</tspan></text><rect x="309.953" y="84" width="503.577" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="561.742" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="561.742" dy="0">4 860</tspan></text><text x="820.53" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.53" dy="0">5 400</tspan></text><rect x="254" y="124" width="111.906" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="309.953" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="309.953" dy="0">1 080</tspan></text><rect x="365.906" y="124" width="447.624" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="589.718" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="589.718" dy="0">4 320</tspan></text><text x="820.53" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="820.53" dy="0">5 400</tspan></text><text x="564.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="564.85" dy="0">millones de dólares</tspan></text><rect x="10" y="215" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Delta Air Lines declaró por separado un costo de más de 500 millones de dólares y demandó a CrowdStrike: es una cifra de</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una empresa, no se suma a la estimación de Parametrix y la demanda sigue siendo una alegación, no un hecho probado.</tspan></text><text x="470" y="304.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: BBC News (24 jul 2024) sobre estimación de Parametrix; CNBC (17 dic 2024) sobre la demanda de Delta.</tspan></text></svg>
