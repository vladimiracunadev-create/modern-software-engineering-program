<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 592" width="940" height="592" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Recuperación por equipo: cada rama que no se resuelve sola termina en una persona frente a una máquina</title><desc id="d">Árbol de decisión de la recuperación. Un equipo con pantalla azul puede recuperarse solo si al reiniciar descarga el archivo revertido; si no, hay que arrancar en un entorno de recuperación, y si el disco está cifrado hace falta la clave de recuperación; luego se elimina el archivo de canal defectuoso y se reinicia. La automatización y los medios de arranque reducen pasos manuales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="592" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Recuperación por equipo: cada rama que no se resuelve sola termina en una persona frente a una máquina</tspan></text><rect x="330" y="49" width="280" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Equipo Windows con pantalla azul</tspan></text><polyline points="470,99 470,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="129" width="340" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="154.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">¿Reinicia y descarga el archivo revertido</tspan></text><text x="470" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">antes de leer el malo?</tspan></text><polyline points="300,159 190,159" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="151" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">sí</tspan></text><rect x="10" y="129" width="180" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="100" y="154.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100" dy="0">Recuperado sin</tspan></text><text x="100" y="170.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="100" dy="0">intervención</tspan></text><polyline points="470,189 470,219" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="486" y="209" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="486" dy="0">no</tspan></text><rect x="300" y="219" width="340" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="252.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">¿El disco está cifrado con BitLocker?</tspan></text><polyline points="640,249 730,249" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="685" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685" dy="0">sí</tspan></text><rect x="730" y="219" width="200" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="244.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Conseguir la clave de</tspan></text><text x="830" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">recuperación</tspan></text><polyline points="470,279 470,319" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="486" y="307" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="486" dy="0">no</tspan></text><polyline points="830,279 830,349 640,349" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="319" width="340" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="344.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Entorno de recuperación: eliminar el</tspan></text><text x="470" y="360.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">archivo C-00000291 y reiniciar</tspan></text><polyline points="470,379 470,409" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="300" y="409" width="340" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="437.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Equipo restablecido, uno por uno</tspan></text><rect x="10" y="319" width="250" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="351" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">Reducen los pasos: técnicas</tspan></text><text x="135" y="367.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">automatizadas (22 jul), ISO de</tspan></text><text x="135" y="384.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">recuperación y USB de arranque</tspan></text><polyline points="260,349 300,349" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="485" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="509.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Coral: pasos que exigen una persona en el equipo o su clave. Es una síntesis de la guía de CrowdStrike a julio de 2024, no</tspan></text><text x="470" y="526.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">un procedimiento operativo.</tspan></text><text x="470" y="574.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
