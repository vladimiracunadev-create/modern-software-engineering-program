<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 432" width="940" height="432" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la reversión a la reforma: 123 días entre la caída y la respuesta de la plataforma</title><desc id="d">Línea de tiempo en días desde el 19 de julio de 2024 con cuatro carriles. Contención: la reversión el día 0. Recuperación: técnicas automatizadas el día 3 y cerca del 99 por ciento de sensores en línea el día 10. Explicación: la revisión preliminar el día 5 y el análisis de causa raíz el día 18. Reforma: la iniciativa de resiliencia de Microsoft el día 123.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="432" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la reversión a la reforma: 123 días entre la caída y la respuesta de la plataforma</tspan></text><line x1="224" y1="83" x2="224" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="224" y1="267" x2="224" y2="272" stroke="#5b7280" stroke-width="1.4"/><text x="224" y="288" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="224" dy="0">0</tspan></text><line x1="322.286" y1="83" x2="322.286" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="322.286" y1="267" x2="322.286" y2="272" stroke="#5b7280" stroke-width="1.4"/><text x="322.286" y="288" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="322.286" dy="0">20</tspan></text><line x1="420.571" y1="83" x2="420.571" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="420.571" y1="267" 