eight="700" fill="#142231"><tspan x="214" dy="0">Recuperación</tspan></text><text x="214" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Explicación</tspan></text><text x="214" y="248.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="214" dy="0">Reforma de la plataforma</tspan></text><line x1="224" y1="75" x2="224" y2="267" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="224" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="224" dy="0">19 jul</tspan></text><line x1="312.457" y1="75" x2="312.457" y2="267" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="312.457" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="312.457" dy="0">6 ago</tspan></text><line x1="828.457" y1="75" x2="828.457" y2="267" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="828.457" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="828.457" dy="0">19 nov</tspan></text><rect x="224" y="92" width="7.37143" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="129" x2="912" y2="129" stroke="#d5dde1" stroke-width="1"/><rect x="224" y="138" width="14.7429" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="238.743" y="138" width="34.4" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="248.571" y="184" width="7.37143" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="312.457" y="184" width="7.37143" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="221" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><rect x="828.457" y="230" width="9.82857" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="568" y="311" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="568" dy="0">días desde el 19 de julio de 2024</tspan></text><rect x="10" y="325" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="349.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El daño se detuvo en horas, la explicación llegó en semanas y la reforma de plataforma en meses. Los días son cálculo</tspan></text><text x="470" y="366.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">propio a partir de fechas publicadas; la barra dorada de recuperación va hasta la técnica automatizada del día 3.</tspan></text><text x="470" y="414.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: CrowdStrike (hub, 24 jul y 6 ago 2024) y Microsoft (19 nov 2024).</tspan></text></svg>
