<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 788" width="940" height="788" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuencia del 19 de julio de 2024: del archivo publicado a la pantalla azul</title><desc id="d">Diagrama de secuencia con cuatro líneas de vida: ingeniería de detección, sistema de configuración con validador, sensor en el equipo y Windows. Se crean dos instancias, el validador las aprueba, a las 04:09 UTC se publica el archivo de canal 291, el sensor lo guarda, Windows notifica una tubería con nombre, el intérprete lee la entrada 21 y Windows detiene el sistema; a las 05:27 UTC se revierte el archivo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="788" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Secuencia del 19 de julio de 2024: del archivo publicado a la pantalla azul</tspan></text><rect x="10" y="45" width="200" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="70.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="110" dy="0">Ingeniería de detección</tspan></text><line x1="110" y1="89" x2="110" y2="655" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="245" y="45" width="200" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="345" y="62.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">Configuración y</tspan></text><text x="345" y="78.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">validador</tspan></text><line x1="345" y1="89" x2="345" y2="655" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="500" y="45" width="200" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="600" y="70.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="600" dy="0">Sensor en el equipo</tspan></text><line x1="600" y1="89" x2="600" y2="655" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="730" y="45" width="200" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="70.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">Windows</tspan></text><line x1="830" y1="89" x2="830" y2="655" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="110,141 345,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="227.5" y="119" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="227.5" dy="0">1  crea dos instancias IPC</tspan><tspan x="227.5" dy="16.64">una con criterio real en el campo 21</tspan></text><rect x="245" y="157" width="200" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="345" y="177.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="345" dy="0">2 el validador aprueba:</tspan></text><text x="345" y="193.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="345" dy="0">supone 21</tspan></text><polyline points="345,259 600,259" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="472.5" y="237" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="472.5" dy="0">3  04:09 UTC publica el</tspan><tspan x="472.5" dy="16.64">archivo de canal 291</tspan></text><rect x="500" y="275" width="200" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">4 guarda el archivo en</tspan></text><text x="600" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">disco</tspan></text><polyline points="830,375 600,375" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="715" y="353" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="715" dy="0">5  notifica una tubería</tspan><tspan x="715" dy="16.64">con nombre (evento IPC)</tspan></text><rect x="500" y="391" width="200" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="600" y="411.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="600" dy="0">6 el intérprete pide la</tspan></text><text x="600" y="427.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="600" dy="0">entrada 21 de 20</tspan></text><polyline points="600,495 830,495" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="715" y="473" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="715" dy="0">7  lectura de dirección inválida</tspan></text><rect x="730" y="511" width="200" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="531.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">8 detiene el sistema</tspan></text><text x="830" y="547.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">(0x50)</tspan></text><rect x="245" y="585" width="200" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="345" y="605.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="345" dy="0">9 05:27 UTC revierte (78</tspan></text><text x="345" y="621.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="345" dy="0">min)</tspan></text><rect x="10" y="681" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="705.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El defecto no se activa al llegar el archivo sino en el siguiente evento de tubería con nombre. El intervalo entre el paso</tspan></text><text x="470" y="722.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">3 y el 5 no es público y varía por equipo.</tspan></text><text x="470" y="770.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: análisis de causa raíz de CrowdStrike (6 ago 2024) y revisión preliminar del incidente; lectura propia.</tspan></text></svg>
