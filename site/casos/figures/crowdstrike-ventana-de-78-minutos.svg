<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 426" width="940" height="426" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una ventana de 78 minutos bastó para alcanzar a 8,5 millones de equipos</title><desc id="d">Línea de tiempo en minutos desde las 04:00 UTC del 19 de julio de 2024. El archivo defectuoso se publica a las 04:09, minuto 9, y se revierte a las 05:27, minuto 87. Los equipos Windows con sensor 7.11 o superior conectados en esos 78 minutos lo recibieron; los que se conectaron después no.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="426" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una ventana de 78 minutos bastó para alcanzar a 8,5 millones de equipos</tspan></text><line x1="274" y1="83" x2="274" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="245" x2="274" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="380.333" y1="83" x2="380.333" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="380.333" y1="245" x2="380.333" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="380.333" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380.333" dy="0">20</tspan></text><line x1="486.667" y1="83" x2="486.667" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="486.667" y1="245" x2="486.667" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="486.667" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.667" dy="0">40</tspan></text><line x1="593" y1="83" x2="593" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="593" y1="245" x2="593" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="593" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593" dy="0">60</tspan></text><line x1="699.333" y1="83" x2="699.333" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="699.333" y1="245" x2="699.333" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="699.333" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="699.333" dy="0">80</tspan></text><line x1="805.667" y1="83" x2="805.667" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="805.667" y1="245" x2="805.667" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="805.667" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805.667" dy="0">100</tspan></text><line x1="912" y1="83" x2="912" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="245" x2="912" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">120</tspan></text><line x1="274" y1="245" x2="912" y2="245" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="114.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Archivo 291 defectuoso</tspan></text><text x="264" y="168.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Equipos en línea con sensor 7.11+</tspan></text><text x="264" y="222.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Equipos que se conectan después</tspan></text><line x1="321.85" y1="75" x2="321.85" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="321.85" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="321.85" dy="0">04:09 publicación</tspan></text><line x1="736.55" y1="75" x2="736.55" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="736.55" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="736.55" dy="0">05:27 reversión</tspan></text><rect x="321.85" y="92" width="414.7" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="529.2" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="529.2" dy="0">78 min publicado</tspan></text><line x1="14" y1="137" x2="912" y2="137" stroke="#d5dde1" stroke-width="1"/><rect x="321.85" y="146" width="414.7" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="529.2" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="529.2" dy="0">reciben el archivo y caen</tspan></text><line x1="14" y1="191" x2="912" y2="191" stroke="#d5dde1" stroke-width="1"/><rect x="736.55" y="200" width="175.45" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="824.275" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="824.275" dy="0">no afectados</tspan></text><text x="593" y="289" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">minutos desde las 04:00 UTC del 19 de julio de 2024</tspan></text><rect x="10" y="303" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="327.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La reversión protegió a los equipos que se conectaron después. Los que ya habían caído solo se recuperaban si lograban</tspan></text><text x="470" y="344.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">descargar el archivo corregido al reiniciar; si seguían cayendo, hacía falta intervención manual (guía de remediación de</tspan></text><text x="470" y="361.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">CrowdStrike). Cifra de Microsoft: unos 8,5 millones de equipos Windows, menos del 1 % del total.</tspan></text><text x="470" y="408.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: CrowdStrike (revisión preliminar) y Microsoft (20 jul 2024). Esquema temporal propio.</tspan></text></svg>
