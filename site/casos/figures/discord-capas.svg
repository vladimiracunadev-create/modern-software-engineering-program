<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 662" width="940" height="662" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Capas de Discord que su ingeniería describió</title><desc id="d">Pila de capas: clientes web, de escritorio, móviles y de consola; puerta de enlace con WebSocket y procesos de sesión en Elixir; procesos de servidor (guild) y relays en Elixir; API monolítica en Python; servicios de datos en Rust; ScyllaDB para mensajes; servidores de voz con WebRTC.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="662" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Capas de Discord que su ingeniería describió</tspan></text><rect x="10" y="53" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Clientes</tspan></text><rect x="214" y="53" width="430" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">Web, escritorio y móvil; motor C++ nativo sobre WebRTC</tspan></text><text x="429" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">en las aplicaciones instaladas</tspan></text><rect x="10" y="133" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="169.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Puerta de enlace</tspan></text><rect x="214" y="133" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="161.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">WebSocket por usuario con un proceso de sesión</tspan></text><text x="429" y="177.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">(GenServer) en Elixir</tspan></text><rect x="10" y="213" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="249.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Tiempo real</tspan></text><rect x="214" y="213" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="241.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Un proceso de servidor (guild) por comunidad y relays</tspan></text><text x="429" y="257.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">que reparten el envío a las sesiones</tspan></text><rect x="10" y="293" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="321.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">API y servicios de</tspan></text><text x="105" y="337.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">datos</tspan></text><rect x="214" y="293" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="321.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">API monolítica; servicios de datos en Rust con una</tspan></text><text x="429" y="337.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">consulta gRPC por operación</tspan></text><rect x="10" y="373" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="409.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Almacenes</tspan></text><rect x="214" y="373" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="401.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">ScyllaDB para mensajes (antes Cassandra y MongoDB); no</tspan></text><text x="429" y="417.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">más de lo publicado</tspan></text><rect x="10" y="453" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="489.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Voz y vídeo</tspan></text><rect x="214" y="453" width="430" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="429" y="481.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="429" dy="0">Servidores de medios que reenvían el audio; señalización</tspan></text><text x="429" y="497.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="429" dy="0">en Elixir</tspan></text><rect x="668" y="53" width="262" height="141.333" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="118.987" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Documentado en posts de 2017 a</tspan></text><text x="799" y="135.627" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">2023</tspan></text><rect x="668" y="208.333" width="262" height="141.333" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="799" y="274.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">No se sabe: proveedor de nube,</tspan></text><text x="799" y="290.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">regiones y tamaño de flota</tspan></text><rect x="668" y="363.667" width="262" height="141.333" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="799" y="429.653" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">Inferido: la API monolítica sigue</tspan></text><text x="799" y="446.293" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">siendo la puerta de negocio</tspan></text><rect x="10" y="539" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="563.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en los posts de Elixir (2017 y 2019), de Rust (2020), de mensajes (2017 y 2023), de servidores grandes (2022) y</tspan></text><text x="470" y="580.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de voz (2018). Dónde deja de valer: el detalle de 2023 en adelante sobre la API y las regiones no es público en las fuentes</tspan></text><text x="470" y="597.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consultadas.</tspan></text><text x="470" y="644.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de ingeniería de Discord (discord.com/blog), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
