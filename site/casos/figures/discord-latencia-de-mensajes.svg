<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="940" height="510" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Latencia en el percentil 99 de la base de mensajes, antes y después</title><desc id="d">Barras agrupadas en milisegundos: leer mensajes históricos pasó de un percentil 99 de 40 a 125 milisegundos en Cassandra a 15 milisegundos en ScyllaDB, y escribir un mensaje de 5 a 70 milisegundos a unos 5 milisegundos estables.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="510" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Latencia en el percentil 99 de la base de mensajes, antes y después</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Cassandra (extremo alto del rango)</tspan></text><rect x="320.36" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="340.36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="340.36" dy="0">ScyllaDB</tspan></text><line x1="78.62" y1="335" x2="920" y2="335" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="335" x2="78.62" y2="335" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="287" x2="920" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="239" x2="920" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="191" x2="920" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="191" x2="78.62" y2="191" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="195.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="143" x2="920" y2="143" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="143" x2="78.62" y2="143" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">125</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="335" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="215" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 215)">milisegundos, percentil 99</text><rect x="120.689" y="95" width="166.276" height="240" rx="3" fill="#c0432f"/><text x="203.827" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="203.827" dy="0">125</tspan></text><rect x="290.965" y="306.2" width="166.276" height="28.8" rx="3" fill="#087f8c"/><text x="374.103" y="300.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374.103" dy="0">15</tspan></text><text x="288.965" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Leer historial (peor caso)</tspan></text><rect x="541.379" y="200.6" width="166.276" height="134.4" rx="3" fill="#c0432f"/><text x="624.517" y="194.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="624.517" dy="0">70</tspan></text><rect x="711.655" y="325.4" width="166.276" height="9.6" rx="3" fill="#087f8c"/><text x="794.793" y="319.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.793" dy="0">5</tspan></text><text x="709.655" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Insertar mensaje (peor caso)</tspan></text><rect x="10" y="387" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="411.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cassandra se muestra con el extremo alto de los rangos que Discord publica (40-125 ms y 5-70 ms) porque el problema era la</tspan></text><text x="470" y="428.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">variabilidad. Mire que la diferencia más grande es de la lectura: 8 veces. Dónde deja de valer: son mediciones del propio</tspan></text><text x="470" y="445.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Discord en su carga real, no un banco de pruebas neutral.</tspan></text><text x="470" y="492.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «How Discord Stores Trillions of Messages», discord.com/blog, 2023.</tspan></text></svg>
