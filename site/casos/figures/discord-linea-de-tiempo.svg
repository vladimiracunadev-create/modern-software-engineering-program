<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 402" width="940" height="402" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Discord de 2012 a 2026: empresa, producto e ingeniería</title><desc id="d">Línea de tiempo con tres carriles: empresa (estudio Phoenix Guild en 2012, Discord en mayo de 2015, nuevo consejero delegado en abril de 2025), producto (overlay en 2016, Nitro en 2017, Go Live y Boosts en 2019, Activities en 2023, Social SDK en 2025) y almacén de mensajes (MongoDB hasta 2015, Cassandra de 2015 a 2022 y ScyllaDB desde mayo de 2022).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="402" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Discord de 2012 a 2026: empresa, producto e ingeniería</tspan></text><line x1="96.48" y1="83" x2="96.48" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="96.48" y1="221" x2="96.48" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="96.48" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.48" dy="0">2012</tspan></text><line x1="259.584" y1="83" x2="259.584" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="259.584" y1="221" x2="259.584" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="259.584" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="259.584" dy="0">2015</tspan></text><line x1="422.688" y1="83" x2="422.688" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="422.688" y1="221" x2="422.688" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="422.688" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="422.688" dy="0">2018</tspan></text><line x1="585.792" y1="83" x2="585.792" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="585.792" y1="221" x2="585.792" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="585.792" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="585.792" dy="0">2021</tspan></text><line x1="748.896" y1="83" x2="748.896" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="748.896" y1="221" x2="748.896" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="748.896" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="748.896" dy="0">2024</tspan></text><line x1="912" y1="83" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="221" x2="912" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2027</tspan></text><line x1="96.48" y1="221" x2="912" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="86.48" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="86.48" dy="0">Empresa</tspan></text><text x="86.48" y="156.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="86.48" dy="0">Mensajes</tspan></text><text x="86.48" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="86.48" dy="0">Producto</tspan></text><line x1="281.331" y1="75" x2="281.331" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="281.331" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="281.331" dy="0">Discord</tspan></text><line x1="373.757" y1="75" x2="373.757" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="373.757" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="373.757" dy="0">Nitro</tspan></text><line x1="504.24" y1="75" x2="504.24" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="504.24" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="504.24" dy="0">Go Live</tspan></text><line x1="819.574" y1="75" x2="819.574" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="819.574" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="819.574" dy="0">SDK</tspan></text><rect x="112.79" y="92" width="168.541" height="28" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="197.061" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="197.061" dy="0">Estudio de juegos</tspan></text><rect x="281.331" y="92" width="538.243" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="550.453" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="550.453" dy="0">Discord con sus fundadores</tspan></text><rect x="819.574" y="92" width="38.0576" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="129" x2="912" y2="129" stroke="#d5dde1" stroke-width="1"/><rect x="259.584" y="138" width="48.9312" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="308.515" y="138" width="353.392" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="485.211" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="485.211" dy="0">Cassandra</tspan></text><rect x="661.907" y="138" width="195.725" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="759.77" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="759.77" dy="0">ScyllaDB</tspan></text><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="373.757" y="184" width="10.8736" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="504.24" y="184" width="10.8736" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="710.838" y="184" width="10.8736" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="819.574" y="184" width="10.8736" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="504.24" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="504.24" dy="0">año</tspan></text><rect x="10" y="279" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hechos con fuente: línea de tiempo oficial de Discord (2012 a 2025) y los posts de 2017 y 2023 sobre mensajes. Dónde deja</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de valer: el cambio de MongoDB a Cassandra se sitúa en 2015-2016 y los segmentos de producto son marcadores de lanzamiento,</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no periodos.</tspan></text><text x="470" y="384.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: discord.com/company y blog de ingeniería de Discord.</tspan></text></svg>
