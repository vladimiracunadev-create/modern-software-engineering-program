<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mensajes por día que Discord anunció en 2016 y 2017</title><desc id="d">Barras con 40 millones de mensajes al día en julio de 2016, 100 millones en diciembre de 2016 y más de 120 millones a comienzos de 2017: el volumen se triplica en medio año.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mensajes por día que Discord anunció en 2016 y 2017</tspan></text><line x1="78.62" y1="297" x2="920" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="297" x2="78.62" y2="297" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="251" x2="920" y2="251" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="251" x2="78.62" y2="251" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="255.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">25</tspan></text><line x1="78.62" y1="205" x2="920" y2="205" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="205" x2="78.62" y2="205" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="209.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="159" x2="920" y2="159" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="159" x2="78.62" y2="159" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">75</tspan></text><line x1="78.62" y1="113" x2="920" y2="113" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="113" x2="78.62" y2="113" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="117.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">125</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 182)">millones de mensajes por día</text><rect x="106.666" y="223.4" width="224.368" height="73.6" rx="3" fill="#087f8c"/><text x="218.85" y="217.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">40</tspan></text><text x="218.85" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Julio de 2016</tspan></text><rect x="387.126" y="113" width="224.368" height="184" rx="3" fill="#087f8c"/><text x="499.31" y="107" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">100</tspan></text><text x="499.31" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Diciembre de 2016</tspan></text><rect x="667.586" y="76.2" width="224.368" height="220.8" rx="3" fill="#087f8c"/><text x="779.77" y="70.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">120</tspan></text><text x="779.77" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Enero de 2017</tspan></text><rect x="10" y="349" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La última barra es «más de 120 millones»: es un mínimo. Mire el salto de julio a diciembre: 2,5 veces en cinco meses, que</tspan></text><text x="470" y="390.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es lo que empujó a cambiar de base de datos. Dónde deja de valer: son cifras de hace diez años; el post de 2023 habla de</tspan></text><text x="470" y="407.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">billones de mensajes almacenados.</tspan></text><text x="470" y="454.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «How Discord Stores Billions of Messages», discord.com/blog, enero de 2017.</tspan></text></svg>
