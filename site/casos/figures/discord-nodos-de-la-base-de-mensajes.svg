<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuántos servidores necesitó guardar los mensajes: de Cassandra a ScyllaDB</title><desc id="d">Barras con 12 nodos de Cassandra en 2017, 177 nodos de Cassandra a comienzos de 2022 y 72 nodos de ScyllaDB tras migrar en mayo de 2022; los nodos nuevos tienen 9 teras de disco frente a 4 de los anteriores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuántos servidores necesitó guardar los mensajes: de Cassandra a ScyllaDB</tspan></text><line x1="78.62" y1="297" x2="920" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="297" x2="78.62" y2="297" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="239.5" x2="920" y2="239.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239.5" x2="78.62" y2="239.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="244" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="182" x2="920" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="182" x2="78.62" y2="182" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="124.5" x2="920" y2="124.5" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="124.5" x2="78.62" y2="124.5" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="129" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">150</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 182)">nodos</text><rect x="106.666" y="283.2" width="224.368" height="13.8" rx="3" fill="#102a43"/><text x="218.85" y="277.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">12</tspan></text><text x="218.85" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Cassandra 2017</tspan></text><rect x="387.126" y="93.45" width="224.368" height="203.55" rx="3" fill="#102a43"/><text x="499.31" y="87.45" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">177</tspan></text><text x="499.31" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Cassandra 2022</tspan></text><rect x="667.586" y="214.2" width="224.368" height="82.8" rx="3" fill="#102a43"/><text x="779.77" y="208.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">72</tspan></text><text x="779.77" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">ScyllaDB 2023</tspan></text><rect x="10" y="349" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El número de nodos pasó de 12 a 177 al crecer de miles de millones a billones de mensajes, y bajó a 72 con la migración;</tspan></text><text x="470" y="390.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">además, cada nodo de ScyllaDB tiene 9 TB de disco en lugar de unos 4 TB. Dónde deja de valer: el volumen de mensajes</tspan></text><text x="470" y="407.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">también cambió entre fechas; no es una comparación a datos iguales.</tspan></text><text x="470" y="454.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «How Discord Stores Trillions of Messages», discord.com/blog, 2023.</tspan></text></svg>
