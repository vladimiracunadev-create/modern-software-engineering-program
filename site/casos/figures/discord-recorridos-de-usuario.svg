<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 521" width="940" height="521" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro recorridos en Discord y su caso límite</title><desc id="d">Cuatro filas de pasos: un jugador que entra a un servidor, un administrador que crea una comunidad, un desarrollador que integra el chat en su juego y una persona que se une a una comunidad de más de un millón de conectados; cada fila termina en un caso límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="521" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro recorridos en Discord y su caso límite</tspan></text><rect x="10" y="56" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Jugador</tspan></text><rect x="174" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263.25" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.25" dy="0">Recibe una invitación</tspan></text><text x="263.25" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.25" dy="0">a un servidor</tspan></text><rect x="366.5" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455.75" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">Entra a canales de</tspan></text><text x="455.75" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">texto y voz</tspan></text><polyline points="352.5,94 366.5,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648.25" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">Habla mientras juega</tspan></text><polyline points="545,94 559,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="56" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Aviso a @everyone:</tspan></text><text x="840.75" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">todos leen a la vez</tspan></text><polyline points="737.5,94 751.5,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="144" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="185.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Administrador</tspan></text><rect x="174" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="263.25" y="185.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="263.25" dy="0">Crea un servidor</tspan></text><rect x="366.5" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455.75" y="177.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">Define canales, roles</tspan></text><text x="455.75" y="193.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">y permisos</tspan></text><polyline points="352.5,182 366.5,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648.25" y="185.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">Invita y modera</tspan></text><polyline points="545,182 559,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="144" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Servidor de decenas</tspan></text><text x="840.75" y="185.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">de miles de</tspan></text><text x="840.75" y="202.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">conectados</tspan></text><polyline points="737.5,182 751.5,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="232" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="273.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Desarrollador</tspan></text><rect x="174" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="263.25" y="273.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="263.25" dy="0">Usa la API o los bots</tspan></text><rect x="366.5" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="455.75" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="455.75" dy="0">Enlaza cuentas de</tspan></text><text x="455.75" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="455.75" dy="0">juego y de Discord</tspan></text><polyline points="352.5,270 366.5,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="648.25" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="648.25" dy="0">Chat de voz y texto</tspan></text><text x="648.25" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="648.25" dy="0">dentro del juego</tspan></text><polyline points="545,270 559,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="232" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Millones de eventos</tspan></text><text x="840.75" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">por segundo</tspan></text><polyline points="737.5,270 751.5,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="320" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="361.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Comunidad enorme</tspan></text><rect x="174" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="345" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Se une a un servidor</tspan></text><text x="263.25" y="361.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">con millones de</tspan></text><text x="263.25" y="378.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">miembros</tspan></text><rect x="366.5" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="455.75" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">Recibe solo lo del</tspan></text><text x="455.75" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">servidor activo</tspan></text><polyline points="352.5,358 366.5,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="648.25" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">Hace clic y pasa a</tspan></text><text x="648.25" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">conexión activa</tspan></text><polyline points="545,358 559,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="320" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Un millón de</tspan></text><text x="840.75" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">conectados a la vez</tspan></text><polyline points="737.5,358 751.5,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="412" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="436.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada fila se lee de izquierda a derecha y la caja coral es el borde. Los bordes del jugador y de la comunidad enorme salen</tspan></text><text x="470" y="453.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de los posts sobre Elixir y sobre servidores de un millón de conectados; el del desarrollador, de la línea de tiempo</tspan></text><text x="470" y="470.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">oficial de Discord. Dónde deja de valer: no mide cuántos usuarios llegan a cada borde.</tspan></text><text x="470" y="507.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Esquema del autor sobre el blog de ingeniería de Discord y su página de empresa.</tspan></text></svg>
