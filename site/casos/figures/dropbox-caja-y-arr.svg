<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Flujo de caja libre y recompras: la caja que genera Dropbox</title><desc id="d">Barras con flujo de caja libre de 871,6 millones de dólares en 2024 y 930,8 millones en 2025, 35 por ciento y 37 por ciento del ingreso; el ingreso recurrente anual total fue de 2 574 millones a fines de 2024 y 2 526 millones a fines de 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Flujo de caja libre y recompras: la caja que genera Dropbox</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Flujo de caja libre</tspan></text><rect x="207.26" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="227.26" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="227.26" dy="0">Ingreso recurrente anual total (ARR)</tspan></text><line x1="93.7" y1="335" x2="920" y2="335" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="335" x2="93.7" y2="335" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="255" x2="920" y2="255" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="255" x2="93.7" y2="255" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="259.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1000</tspan></text><line x1="93.7" y1="175" x2="920" y2="175" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="175" x2="93.7" y2="175" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="179.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2000</tspan></text><line x1="93.7" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="95" x2="93.7" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="95" x2="93.7" y2="335" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="215" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 215)">millones de USD</text><rect x="135.015" y="265.272" width="163.26" height="69.728" rx="3" fill="#087f8c"/><text x="216.645" y="259.272" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="216.645" dy="0">872</tspan></text><rect x="302.275" y="129.08" width="163.26" height="205.92" rx="3" fill="#102a43"/><text x="383.905" y="123.08" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="383.905" dy="0">2574</tspan></text><text x="300.275" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300.275" dy="0">2024</tspan></text><rect x="548.165" y="260.536" width="163.26" height="74.464" rx="3" fill="#087f8c"/><text x="629.795" y="254.536" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="629.795" dy="0">931</tspan></text><rect x="715.425" y="132.92" width="163.26" height="202.08" rx="3" fill="#102a43"/><text x="797.055" y="126.92" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="797.055" dy="0">2526</tspan></text><text x="713.425" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="713.425" dy="0">2025</tspan></text><rect x="10" y="387" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="411.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El flujo de caja libre es la caja operativa menos las inversiones de capital (21,0 millones en 2025). Cálculo propio de</tspan></text><text x="470" y="428.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">proporción: 930,8 sobre 2 521,0 es 36,9 %. Dónde deja de valer: es una medida no contable que Dropbox define en su 10-K.</tspan></text><text x="470" y="476.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Dropbox del año terminado el 31 de diciembre de 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
