<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ingresos de Dropbox: la etapa previa a la oferta pública y la actual</title><desc id="d">Barras con 603,8 millones de dólares en 2015, 844,8 en 2016, 1 106,8 en 2017, 2 548,2 en 2024 y 2 521,0 en 2025; no se muestran 2018 a 2023 porque no se consultaron esos informes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="492" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ingresos de Dropbox: la etapa previa a la oferta pública y la actual</tspan></text><line x1="93.7" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="317" x2="93.7" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="233.667" x2="920" y2="233.667" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="233.667" x2="93.7" y2="233.667" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="238.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1000</tspan></text><line x1="93.7" y1="150.333" x2="920" y2="150.333" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="150.333" x2="93.7" y2="150.333" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="154.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2000</tspan></text><line x1="93.7" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="67" x2="93.7" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="67" x2="93.7" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">millones de USD</text><rect x="110.226" y="266.683" width="132.208" height="50.3167" rx="3" fill="#087f8c"/><text x="176.33" y="260.683" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="176.33" dy="0">603,8</tspan></text><text x="176.33" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="176.33" dy="0">2015</tspan></text><rect x="275.486" y="246.6" width="132.208" height="70.4" rx="3" fill="#087f8c"/><text x="341.59" y="240.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="341.59" dy="0">844,8</tspan></text><text x="341.59" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="341.59" dy="0">2016</tspan></text><rect x="440.746" y="224.767" width="132.208" height="92.2333" rx="3" fill="#087f8c"/><text x="506.85" y="218.767" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">1 106,8</tspan></text><text x="506.85" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">2017</tspan></text><rect x="606.006" y="104.65" width="132.208" height="212.35" rx="3" fill="#087f8c"/><text x="672.11" y="98.65" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="672.11" dy="0">2 548,2</tspan></text><text x="672.11" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="672.11" dy="0">2024</tspan></text><rect x="771.266" y="106.917" width="132.208" height="210.083" rx="3" fill="#087f8c"/><text x="837.37" y="100.917" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="837.37" dy="0">2 521,0</tspan></text><text x="837.37" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837.37" dy="0">2025</tspan></text><rect x="10" y="369" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Mire el cambio de ritmo: de 2015 a 2017 el crecimiento fue de 40 % y 31 % anual; entre 2024 y 2025 el ingreso bajó 1 %</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(cálculo propio). Dónde deja de valer: hay un salto de seis años sin datos consultados; no se afirma qué ocurrió entre</tspan></text><text x="470" y="427.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">medias.</tspan></text><text x="470" y="474.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: prospecto de 2018 y 10-K de 2025 de Dropbox (SEC).</tspan></text></svg>
