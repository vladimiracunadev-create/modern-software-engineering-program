<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dropbox de 2007 a 2026: empresa, infraestructura y producto</title><desc id="d">Línea de tiempo con tres carriles: la empresa (constituida en mayo de 2007 como Evenflow, renombrada Dropbox en octubre de 2009, cotizada desde marzo de 2018), la infraestructura (etapa previa, migración a infraestructura propia en 2015 y 2016, SMR en 2018) y el producto (sincronización en beta en 2008, Smart Sync, nuevo motor Nucleus en 2020).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dropbox de 2007 a 2026: empresa, infraestructura y producto</tspan></text><line x1="152.9" y1="83" x2="152.9" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="152.9" y1="221" x2="152.9" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="152.9" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152.9" dy="0">2007</tspan></text><line x1="304.72" y1="83" x2="304.72" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="304.72" y1="221" x2="304.72" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="304.72" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="304.72" dy="0">2011</tspan></text><line x1="456.54" y1="83" x2="456.54" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="456.54" y1="221" x2="456.54" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="456.54" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="456.54" dy="0">2015</tspan></text><line x1="608.36" y1="83" x2="608.36" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="608.36" y1="221" x2="608.36" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="608.36" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="608.36" dy="0">2019</tspan></text><line x1="760.18" y1="83" x2="760.18" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="760.18" y1="221" x2="760.18" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="760.18" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="760.18" dy="0">2023</tspan></text><line x1="912" y1="83" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="221" x2="912" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2027</tspan></text><line x1="152.9" y1="221" x2="912" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="142.9" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="142.9" dy="0">Empresa</tspan></text><text x="142.9" y="156.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="142.9" dy="0">Infraestructura</tspan></text><text x="142.9" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="142.9" dy="0">Producto</tspan></text><line x1="168.082" y1="75" x2="168.082" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="168.082" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="168.082" dy="0">constitución</tspan></text><line x1="209.833" y1="75" x2="209.833" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="238.562" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="238.562" dy="0">beta</tspan></text><line x1="577.996" y1="75" x2="577.996" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="577.996" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="577.996" dy="0">IPO</tspan></text><line x1="653.906" y1="75" x2="653.906" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="653.906" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="653.906" dy="0">Nucleus</tspan></text><rect x="168.082" y="92" width="409.914" height="28" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="373.039" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="373.039" dy="0">Empresa privada</tspan></text><rect x="577.996" y="92" width="296.049" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="726.021" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="726.021" dy="0">Cotizada (Nasdaq: DBX)</tspan></text><line x1="14" y1="129" x2="912" y2="129" stroke="#d5dde1" stroke-width="1"/><rect x="168.082" y="138" width="288.458" height="28" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="312.311" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="312.311" dy="0">Previa</tspan></text><rect x="456.54" y="138" width="75.91" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="494.495" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="494.495" dy="0">Cambio</tspan></text><rect x="532.45" y="138" width="341.595" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="703.247" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="703.247" dy="0">Magic Pocket + AWS</tspan></text><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="209.833" y="184" width="7.591" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="587.485" y="184" width="3.7955" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="652.008" y="184" width="3.7955" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="532.45" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="532.45" dy="0">año</tspan></text><rect x="10" y="279" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hechos con fuente: constitución en mayo de 2007 como Evenflow y cambio de nombre en octubre de 2009 (prospecto de 2018);</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">oferta pública a 21 dólares en marzo de 2018; migración de la mayoría del contenido en 2015 y 2016; sincronización en beta</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en 2008 y Nucleus en marzo de 2020 (posts). Dónde deja de valer: las fuentes consultadas no describen la infraestructura</tspan></text><text x="470" y="353.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">anterior a 2015; la etapa «previa» no se detalla.</tspan></text><text x="470" y="401.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: prospecto de 2018, 10-K de 2025 y blog técnico de Dropbox.</tspan></text></svg>
