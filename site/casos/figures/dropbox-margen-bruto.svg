<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Margen bruto de Dropbox, antes y después de su propia infraestructura</title><desc id="d">Barras con 54 por ciento en 2015, 67 por ciento en 2016 y 76 por ciento en 2017, y 82,5 por ciento en 2024 y 80,1 por ciento en 2025; la mejora de 2015 a 2017 coincide con la migración a infraestructura propia.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Margen bruto de Dropbox, antes y después de su propia infraestructura</tspan></text><line x1="78.62" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="307" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="259" x2="920" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="259" x2="78.62" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="211" x2="920" y2="211" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="211" x2="78.62" y2="211" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="163" x2="920" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="163" x2="78.62" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="115" x2="920" y2="115" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="115" x2="78.62" y2="115" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">% del ingreso</text><rect x="95.4476" y="177.4" width="134.621" height="129.6" rx="3" fill="#102a43"/><text x="162.758" y="171.4" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162.758" dy="0">54,0</tspan></text><text x="162.758" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="162.758" dy="0">2015</tspan></text><rect x="263.724" y="146.2" width="134.621" height="160.8" rx="3" fill="#102a43"/><text x="331.034" y="140.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="331.034" dy="0">67,0</tspan></text><text x="331.034" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="331.034" dy="0">2016</tspan></text><rect x="432" y="124.6" width="134.621" height="182.4" rx="3" fill="#102a43"/><text x="499.31" y="118.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">76,0</tspan></text><text x="499.31" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">2017</tspan></text><rect x="600.276" y="109" width="134.621" height="198" rx="3" fill="#102a43"/><text x="667.586" y="103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="667.586" dy="0">82,5</tspan></text><text x="667.586" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.586" dy="0">2024</tspan></text><rect x="768.552" y="114.76" width="134.621" height="192.24" rx="3" fill="#102a43"/><text x="835.862" y="108.76" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835.862" dy="0">80,1</tspan></text><text x="835.862" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.862" dy="0">2025</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo propio para 2024 y 2025: 2 103,1 sobre 2 548,2 y 2 020,2 sobre 2 521,0. El prospecto atribuye el descenso del coste</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de ingresos de 2017 a una reducción de 35,1 millones en costes de infraestructura por la «Infrastructure Optimization».</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: el margen sube por varias causas; el prospecto solo cita esa para 2017.</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: prospecto de 2018 y 10-K de 2025 de Dropbox (SEC).</tspan></text></svg>
