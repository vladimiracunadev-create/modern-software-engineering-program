<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Resultado neto de Dropbox: de pérdidas a beneficios</title><desc id="d">Barras en millones de dólares: pérdidas netas de 325,9; 210,2 y 111,7 millones en 2015, 2016 y 2017 y beneficios netos de 453,6; 452,3 y 508,4 millones en 2023, 2024 y 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Resultado neto de Dropbox: de pérdidas a beneficios</tspan></text><line x1="86.16" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="317" x2="86.16" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">−400</tspan></text><line x1="86.16" y1="267" x2="920" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="267" x2="86.16" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">−200</tspan></text><line x1="86.16" y1="217" x2="920" y2="217" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="217" x2="86.16" y2="217" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">0</tspan></text><line x1="86.16" y1="167" x2="920" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="167" x2="86.16" y2="167" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="171.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">200</tspan></text><line x1="86.16" y1="117" x2="920" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="117" x2="86.16" y2="117" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="121.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">400</tspan></text><line x1="86.16" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="81.16" y1="67" x2="86.16" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="77.16" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="77.16" dy="0">600</tspan></text><line x1="86.16" y1="67" x2="86.16" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">millones de USD</text><rect x="100.057" y="315" width="111.179" height="2" rx="3" fill="#087f8c"/><text x="155.647" y="309" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="155.647" dy="0">−325,9</tspan></text><text x="155.647" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155.647" dy="0">2015</tspan></text><rect x="239.031" y="315" width="111.179" height="2" rx="3" fill="#087f8c"/><text x="294.62" y="309" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="294.62" dy="0">−210,2</tspan></text><text x="294.62" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294.62" dy="0">2016</tspan></text><rect x="378.004" y="315" width="111.179" height="2" rx="3" fill="#087f8c"/><text x="433.593" y="309" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.593" dy="0">−111,7</tspan></text><text x="433.593" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="433.593" dy="0">2017</tspan></text><rect x="516.977" y="103.6" width="111.179" height="213.4" rx="3" fill="#087f8c"/><text x="572.567" y="97.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="572.567" dy="0">453,6</tspan></text><text x="572.567" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="572.567" dy="0">2023</tspan></text><rect x="655.951" y="103.925" width="111.179" height="213.075" rx="3" fill="#087f8c"/><text x="711.54" y="97.925" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="711.54" dy="0">452,3</tspan></text><text x="711.54" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="711.54" dy="0">2024</tspan></text><rect x="794.924" y="89.9" width="111.179" height="227.1" rx="3" fill="#087f8c"/><text x="850.513" y="83.9" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="850.513" dy="0">508,4</tspan></text><text x="850.513" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="850.513" dy="0">2025</tspan></text><rect x="10" y="369" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La pérdida se redujo a la mitad cada año antes de la oferta pública, en paralelo con la migración de infraestructura; los</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">últimos tres años son beneficios. Dónde deja de valer: 2018 a 2022 no se consultaron; las barras negativas son pérdidas.</tspan></text><text x="470" y="458.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: prospecto de 2018 y 10-K de 2025 de Dropbox (SEC).</tspan></text></svg>
