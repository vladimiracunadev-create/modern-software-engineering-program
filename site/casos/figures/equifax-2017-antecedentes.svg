<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 488" width="940" height="488" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la publicación del parche a las 148 millones de personas, en nueve hitos</title><desc id="d">Eje no proporcional con nueve hitos: 7 de marzo de 2017 sale el parche; 9 de marzo el correo interno; 13 de mayo la intrusión; 29 de julio se detecta; 2 de agosto se contrata a Mandiant; 7 de septiembre el aviso público; 2 de octubre 2,5 millones más; 1 de marzo de 2018 2,4 millones más; 25 de junio de 2018 la orden de consentimiento de ocho estados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="488" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la publicación del parche a las 148 millones de personas, en nueve hitos</tspan></text><line x1="30" y1="195" x2="910" y2="195" stroke="#32505f" stroke-width="2"/><line x1="80" y1="195" x2="80" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="80" cy="195" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="80" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="80" dy="0"></tspan></text><rect x="6" y="55" width="170" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="91" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">7 mar 2017: sale el</tspan></text><text x="91" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">parche de Struts</tspan></text><line x1="177.5" y1="195" x2="177.5" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="177.5" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="177.5" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="177.5" dy="0"></tspan></text><rect x="92.5" y="235" width="170" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="177.5" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="177.5" dy="0">9 mar: correo</tspan></text><text x="177.5" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="177.5" dy="0">interno, 48 horas</tspan></text><line x1="275" y1="195" x2="275" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="275" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="275" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="275" dy="0"></tspan></text><rect x="190" y="55" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="275" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="275" dy="0">13 may: intrusión</tspan></text><text x="275" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="275" dy="0">por ACIS</tspan></text><line x1="372.5" y1="195" x2="372.5" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="372.5" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="372.5" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="372.5" dy="0"></tspan></text><rect x="287.5" y="235" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="372.5" y="272" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="372.5" dy="0">29 jul: se renueva</tspan></text><text x="372.5" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="372.5" dy="0">el certificado y se</tspan></text><text x="372.5" y="305.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="372.5" dy="0">detecta</tspan></text><line x1="470" y1="195" x2="470" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="470" cy="195" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0"></tspan></text><rect x="385" y="55" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">2 ago: Mandiant y</tspan></text><text x="470" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">asesores externos</tspan></text><line x1="567.5" y1="195" x2="567.5" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="567.5" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="567.5" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="567.5" dy="0"></tspan></text><rect x="482.5" y="235" width="170" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="567.5" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="567.5" dy="0">7 sep: aviso público</tspan></text><line x1="665" y1="195" x2="665" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="665" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="665" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="665" dy="0"></tspan></text><rect x="580" y="55" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="665" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="665" dy="0">2 oct: 2,5 millones</tspan></text><text x="665" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="665" dy="0">más</tspan></text><line x1="762.5" y1="195" x2="762.5" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="762.5" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="762.5" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="762.5" dy="0"></tspan></text><rect x="677.5" y="235" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="762.5" y="272" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="762.5" dy="0">1 mar 2018: 2,4</tspan></text><text x="762.5" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="762.5" dy="0">millones más; total</tspan></text><text x="762.5" y="305.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="762.5" dy="0">148</tspan></text><line x1="860" y1="195" x2="860" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="860" cy="195" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="860" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="860" dy="0"></tspan></text><rect x="764" y="55" width="170" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">25 jun 2018: orden</tspan></text><text x="849" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">de consentimiento de</tspan></text><text x="849" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">ocho estados</tspan></text><rect x="10" y="365" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="389.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: pasaron 67 días entre el parche y la entrada, y 76 de intrusión hasta la detección; después tardó 39 días en</tspan></text><text x="470" y="406.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hacerse público. Mira que el aviso público fue 38 días después de que se supiera, el 31 de julio, que podían haberse</tspan></text><text x="470" y="423.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">filtrado datos personales.</tspan></text><text x="470" y="470.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018).</tspan></text></svg>
