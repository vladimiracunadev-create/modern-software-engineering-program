<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 336" width="940" height="336" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El ataque en seis pasos, del 10 de marzo al 30 de julio de 2017</title><desc id="d">Cadena del ataque: primeras señales de explotación el 10 de marzo; entrada el 13 de mayo por Struts en ACIS con puertas traseras web; credenciales sin cifrar que abren 48 bases de datos; 9 000 consultas y 265 hallazgos de datos personales sin cifrar; exfiltración sin que el monitoreo lo viera; detección el 29 de julio al renovar el certificado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="336" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El ataque en seis pasos, del 10 de marzo al 30 de julio de 2017</tspan></text><rect x="10" y="51" width="280" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">10 mar: primera evidencia de</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">explotación de Struts en servidores</tspan></text><text x="150" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="150" dy="0">conectados a la red</tspan></text><rect x="330" y="51" width="280" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">13 may: entran por ACIS y colocan</tspan></text><text x="470" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">puertas traseras web</tspan></text><rect x="650" y="51" width="280" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="790" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">Hallan credenciales sin cifrar;</tspan></text><text x="790" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">acceden a 48 bases de datos</tspan></text><polyline points="290,82.96 330,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,82.96 650,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,114.92 790,129.92 150,129.92 150,148.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="148.92" width="280" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="150" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">Unas 9 000 consultas; localizan</tspan></text><text x="150" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">datos personales sin cifrar 265</tspan></text><text x="150" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">veces</tspan></text><rect x="330" y="148.92" width="280" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Sacan los datos sin que el</tspan></text><text x="470" y="184.52" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">monitoreo lo vea: certificado</tspan></text><text x="470" y="201.16" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">vencido</tspan></text><rect x="650" y="148.92" width="280" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="176.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">29 jul: se renueva el certificado y</tspan></text><text x="790" y="192.84" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">aparece tráfico sospechoso</tspan></text><polyline points="290,180.88 330,180.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,180.88 650,180.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="228.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="253.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el ataque duró 76 días y se detuvo cuando una renovación rutinaria devolvió la vista a un monitor que</tspan></text><text x="470" y="270.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">llevaba 19 meses apagado. Mira la quinta caja: la visibilidad faltó justo en el camino de salida.</tspan></text><text x="470" y="318.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Cronología y apartado III.</tspan></text></svg>
