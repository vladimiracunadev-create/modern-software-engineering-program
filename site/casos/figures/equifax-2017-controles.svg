<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 458" width="940" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cada eslabón de la cadena y el control que lo corta</title><desc id="d">Ocho pares de causa y control propuesto: parche sin aplicar, aviso sin dueño, inventario ausente, escaneo que no detecta, monitor ciego, credenciales en un archivo, datos sin cifrar y acceso sin segmentar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cada eslabón de la cadena y el control que lo corta</tspan></text><rect x="10" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Parche crítico sin aplicar</tspan></text><text x="117.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">a ACIS</tspan></text><rect x="10" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Verificación automática</tspan></text><text x="117.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">del parche con plazo, y</tspan></text><text x="117.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">escalado si no se cumple</tspan></text><polyline points="117.5,98.28 117.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="245" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Aviso por correo sin dueño</tspan></text><rect x="245" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">Un dueño por sistema y</tspan></text><text x="352.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">confirmación explícita de</tspan></text><text x="352.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">aplicación</tspan></text><polyline points="352.5,98.28 352.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="480" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">No saber dónde corría</tspan></text><text x="587.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">Struts</tspan></text><rect x="480" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">Inventario de componentes</tspan></text><text x="587.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">con alertas cuando aparece</tspan></text><text x="587.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">una vulnerabilidad</tspan></text><polyline points="587.5,98.28 587.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="715" y="51" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822.5" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">Escaneo que no detectó la</tspan></text><text x="822.5" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">vulnerabilidad</tspan></text><rect x="715" y="126.28" width="215" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822.5" y="145.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">Escaneo autenticado y</tspan></text><text x="822.5" y="161.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">comparación con el</tspan></text><text x="822.5" y="178.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">inventario</tspan></text><polyline points="822.5,98.28 822.5,126.28" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="117.5" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">Monitor con certificado</tspan></text><text x="117.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="117.5" dy="0">vencido</tspan></text><rect x="10" y="281.48" width="215" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117.5" y="300.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">Alerta cuando un sensor de</tspan></text><text x="117.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117.5" dy="0">seguridad deja de informar</tspan></text><polyline points="117.5,253.48 117.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="245" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352.5" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">Credenciales sin cifrar en</tspan></text><text x="352.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352.5" dy="0">un archivo</tspan></text><rect x="245" y="281.48" width="215" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352.5" y="300.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">Gestor de secretos y</tspan></text><text x="352.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352.5" dy="0">rotación</tspan></text><polyline points="352.5,253.48 352.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="480" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.5" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">Datos personales sin</tspan></text><text x="587.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587.5" dy="0">cifrar</tspan></text><rect x="480" y="281.48" width="215" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="587.5" y="300.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">Cifrado y tokenización de</tspan></text><text x="587.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="587.5" dy="0">los campos sensibles</tspan></text><polyline points="587.5,253.48 587.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="715" y="206.2" width="215" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822.5" y="225.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">48 bases accesibles desde</tspan></text><text x="822.5" y="241.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822.5" dy="0">ACIS</tspan></text><rect x="715" y="281.48" width="215" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="822.5" y="300.44" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">Segmentación y mínimo</tspan></text><text x="822.5" y="317.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="822.5" dy="0">privilegio por aplicación</tspan></text><polyline points="822.5,253.48 822.5,281.48" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="350.76" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="375.72" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: son controles de proceso, de visibilidad y de datos; ninguno exige tecnología exótica. La columna inferior</tspan></text><text x="470" y="392.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">es análisis propio.</tspan></text><text x="470" y="440.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio, no conclusión del Comité ni de la GAO.</tspan></text></svg>
