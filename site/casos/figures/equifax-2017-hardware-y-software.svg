<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 461" width="940" height="461" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se sabe de la pila técnica</title><desc id="d">Capas de la pila técnica: aplicación ACIS heredada, Apache Struts, servidores web con puertas traseras, bases de datos con datos personales, dispositivo de monitoreo; lenguaje, sistema operativo y arquitectura de red no se publican en las fuentes consultadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="461" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se sabe de la pila técnica</tspan></text><rect x="10" y="51" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Aplicación</tspan></text><rect x="270" y="51" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="74.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">ACIS, portal a medida con origen en los años setenta</tspan></text><rect x="10" y="99" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="122.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Marco web</tspan></text><rect x="270" y="99" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="122.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Apache Struts, un marco de código abierto, con la vulnerabilidad CVE-2017-5638</tspan></text><rect x="10" y="147" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="170.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Acceso del atacante</tspan></text><rect x="270" y="147" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="170.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Puertas traseras web («web shells») para controlar remotamente el sistema</tspan></text><rect x="10" y="195" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="218.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Datos</tspan></text><rect x="270" y="195" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="218.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">48 bases de datos con tablas de distintos esquemas y datos personales sin cifrar</tspan></text><rect x="10" y="243" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="266.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Monitoreo</tspan></text><rect x="270" y="243" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="266.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Dispositivo que inspeccionaba el tráfico de ACIS, inactivo por un certificado vencido</tspan></text><rect x="10" y="291" width="250" height="47.28" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="309.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">Lenguaje, sistema operativo,</tspan></text><text x="135" y="326.6" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">red, centros de datos</tspan></text><rect x="270" y="291" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="318.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">No constan con detalle en las fuentes consultadas; este caso no los inventa</tspan></text><rect x="10" y="354.28" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="379.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el nivel de detalle público basta para entender el fallo, no para reconstruir el sistema. Verde:</tspan></text><text x="470" y="395.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">documentado; gris: no se sabe.</tspan></text><text x="470" y="443.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Apartados II a V.</tspan></text></svg>
