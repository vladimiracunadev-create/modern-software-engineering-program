<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 238" width="940" height="238" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo funciona un buró de crédito: de los datos al informe</title><desc id="d">Cadena del modelo de un buró de crédito: las entidades que otorgan crédito aportan datos; el buró los reúne y analiza; crea informes y puntuaciones; los vende a terceros; el consumidor no puede optar por salirse.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="238" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo funciona un buró de crédito: de los datos al informe</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Entidades aportan datos</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">de pagos, empleo,</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">seguros y otros</tspan></text><rect x="250" y="51" width="200" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="350" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="350" dy="0">El buró los reúne y los</tspan></text><text x="350" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="350" dy="0">analiza</tspan></text><rect x="490" y="51" width="200" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">Genera informes y</tspan></text><text x="590" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">puntuaciones de crédito</tspan></text><rect x="730" y="51" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">Vende a prestamistas,</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">aseguradoras,</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">empleadores y agencias</tspan></text><polyline points="210,82.96 250,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,82.96 490,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,82.96 730,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="130.92" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="155.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: quien aporta los datos y quien los compra son clientes; el consumidor, dueño de los datos, no lo es. La</tspan></text><text x="470" y="172.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">seguridad de los datos protege a alguien que no paga ni elige.</tspan></text><text x="470" y="220.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Apartado I.A.</tspan></text></svg>
