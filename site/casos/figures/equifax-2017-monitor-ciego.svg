<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El monitor ciego: cómo un certificado vencido apagó la vigilancia durante 19 meses</title><desc id="d">Cadena del monitoreo: un dispositivo inspeccionaba el tráfico de ACIS; su certificado de seguridad venció; el dispositivo dejó de inspeccionar durante 19 meses; los atacantes sacaron datos sin ser vistos; al renovar el certificado el 29 de julio de 2017 apareció tráfico sospechoso hacia una dirección en China y se bloqueó.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El monitor ciego: cómo un certificado vencido apagó la vigilancia durante 19 meses</tspan></text><rect x="10" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">Un dispositivo inspecciona el</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">tráfico de ACIS</tspan></text><rect x="330" y="51" width="280" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Su certificado de seguridad vence y</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">nadie lo renueva</tspan></text><rect x="650" y="51" width="280" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="790" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">Durante 19 meses no inspecciona el</tspan></text><text x="790" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">tráfico</tspan></text><polyline points="290,74.64 330,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,74.64 650,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,98.28 790,113.28 150,113.28 150,132.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132.28" width="280" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="150" y="159.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">La exfiltración pasa desapercibida</tspan></text><rect x="330" y="132.28" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">29 jul 2017: se renueva y se ve</tspan></text><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">tráfico sospechoso</tspan></text><polyline points="290,155.92 330,155.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="195.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="220.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: un control de seguridad puede fallar en silencio. No había una alerta de que el monitor estaba ciego; quien</tspan></text><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lo detectó fue una renovación rutinaria. Mira que el sistema de vigilancia necesita su propia vigilancia.</tspan></text><text x="470" y="284.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Apartados III y V.B.2.</tspan></text></svg>
