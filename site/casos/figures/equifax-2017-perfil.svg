<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 393" width="940" height="393" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Equifax en cifras de 2017 y 2018 según el informe del Comité</title><desc id="d">Tres columnas: identidad de la empresa fundada en 1899 en Atlanta; escala de datos, con 820 millones de consumidores y más de 91 millones de empresas en sus bases; tamaño de plantilla y valor de mercado en octubre de 2018.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="393" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Equifax en cifras de 2017 y 2018 según el informe del Comité</tspan></text><rect x="10" y="51" width="294.667" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="157.333" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="157.333" dy="0">Empresa</tspan></text><rect x="10" y="101" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Fundada en 1899 en Atlanta (Georgia)</tspan></text><rect x="10" y="149" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Cotiza desde 1965; símbolo EFX en la</tspan></text><text x="157.333" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">bolsa de Nueva York</tspan></text><rect x="10" y="204.28" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="227.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Parte del índice S&amp;P 500</tspan></text><rect x="322.667" y="51" width="294.667" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Datos</tspan></text><rect x="322.667" y="101" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Información de unos 820 millones de</tspan></text><text x="470" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">consumidores</tspan></text><rect x="322.667" y="156.28" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="179.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Más de 91 millones de empresas</tspan></text><rect x="322.667" y="204.28" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="227.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Opera en 24 países</tspan></text><rect x="635.333" y="51" width="294.667" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782.667" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="782.667" dy="0">Tamaño</tspan></text><rect x="635.333" y="101" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">10 300 empleados en todo el mundo</tspan></text><rect x="635.333" y="149" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Valor de mercado de 11 720 millones</tspan></text><text x="782.667" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">de dólares el 26 de octubre de 2018</tspan></text><rect x="635.333" y="204.28" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="223.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Contrato de 7,25 millones del IRS</tspan></text><text x="782.667" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">para verificar identidad de</tspan></text><text x="782.667" y="256.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">contribuyentes</tspan></text><rect x="10" y="286.2" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="311.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: es una empresa grande y cotizada con una base de datos de escala nacional; el tamaño de la plantilla y de</tspan></text><text x="470" y="327.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los datos explica por qué la escala del incidente fue tan grande.</tspan></text><text x="470" y="375.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informe del personal de la mayoría del Comité de Supervisión de la Cámara (dic 2018). Apartado I.</tspan></text></svg>
