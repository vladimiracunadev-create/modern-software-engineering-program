<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Mapa de los fallos: cómo se rompió cada sistema y qué parte del curso lo previene</title><desc id="d">Diagrama de cuatro columnas: cada una nombra una familia de fallo, enlaza con flechas a los casos que la ilustran y señala las partes del curso que dan las defensas. Cambio sin control en producción: Knight Capital y CrowdStrike. Migración o lanzamiento sin ensayo: HealthCare.gov y TSB. Operación y recuperación: la caída de Meta y el incidente de GitLab. Seguridad crítica y negocio: Therac-25 y Quibi.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="1000" height="400" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Mapa de los fallos: cómo se rompió cada sistema y qué parte del curso lo previene</tspan></text><rect x="10" y="46" width="228.5" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="124.25" y="72.96" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="124.25" dy="0">Cambio sin control en</tspan></text><text x="124.25" y="90.88" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="124.25" dy="0">producción</tspan></text><polyline points="124.25,112 124.25,134" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="24" y="136" width="200.5" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="124.25" y="159.92" font-s