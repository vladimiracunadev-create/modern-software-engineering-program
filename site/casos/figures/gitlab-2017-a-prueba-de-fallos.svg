<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 544" width="940" height="544" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</title><desc id="d">Cuatro columnas. Existían y funcionaron: instantánea LVM manual, repositorios en otro almacenamiento, sistema de monitoreo interno. Existían y fallaron: réplica, respaldo lógico, avisos por correo, resincronización manual. No existían: archivado de WAL, instantáneas de Azure en bases, pruebas de restauración, propietario de la durabilidad. Debieron existir: confirmación con el nombre del host, alerta por ausencia, restauración rápida y ensayada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="544" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</tspan></text><rect x="10" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="120.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120.5" dy="0">Existían y funcionaron</tspan></text><rect x="10" y="111" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Instantánea LVM manual de</tspan></text><text x="120.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">las 17:20</tspan></text><rect x="10" y="191" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Repositorios en NFS: sin</tspan></text><text x="120.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">pérdida</tspan></text><rect x="10" y="271" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Monitoreo interno sin</tspan></text><text x="120.5" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">afectación</tspan></text><rect x="243" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="353.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.5" dy="0">Existían y fallaron</tspan></text><rect x="243" y="111" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Réplica db2: atrasada y</tspan></text><text x="353.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">vaciada</tspan></text><rect x="243" y="191" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Respaldo pg_dump: vacío por</tspan></text><text x="353.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">versión</tspan></text><rect x="243" y="271" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Avisos por correo</tspan></text><text x="353.5" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">rechazados por DMARC</tspan></text><rect x="243" y="351" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Resincronización manual sin</tspan></text><text x="353.5" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">documentar</tspan></text><rect x="476" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="586.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="586.5" dy="0">No existían (documentado)</tspan></text><rect x="476" y="111" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Archivado de WAL</tspan></text><rect x="476" y="191" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Instantáneas de Azure en</tspan></text><text x="586.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">bases</tspan></text><rect x="476" y="271" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Pruebas periódicas de</tspan></text><text x="586.5" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">restauración</tspan></text><rect x="476" y="351" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Propietario de la</tspan></text><text x="586.5" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">durabilidad</tspan></text><rect x="709" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="819.5" y="72.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="819.5" dy="0">Debieron existir (análisis</tspan></text><text x="819.5" y="88.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="819.5" dy="0">propio)</tspan></text><rect x="709" y="111" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Confirmación con el nombre</tspan></text><text x="819.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">del host</tspan></text><rect x="709" y="191" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Alerta por ausencia sin</tspan></text><text x="819.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">depender del correo</tspan></text><rect x="709" y="271" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Restauración rápida y</tspan></text><text x="819.5" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">ensayada</tspan></text><rect x="709" y="351" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">RPO y RTO escritos y</tspan></text><text x="819.5" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">verificados</tspan></text><rect x="10" y="437" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las tres primeras columnas son del postmortem; la cuarta es análisis propio. Diez de doce capas de control no cumplieron su</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">función según la sección de defensa en profundidad.</tspan></text><text x="470" y="526.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017) y S-1 de 2021; esquema propio.</tspan></text></svg>
