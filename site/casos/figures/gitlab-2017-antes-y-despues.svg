<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cada debilidad del 31 de enero con el compromiso que GitLab publicó</title><desc id="d">Cinco pares de cajas unidos por flechas. Un respaldo sin supervisión se acompaña de monitoreo de respaldos en Prometheus. Un respaldo nunca probado, de pruebas automáticas de restauración. Ausencia de instantáneas de base de datos, de instantáneas por hora y de disco en Azure. Una réplica única, de recuperar réplicas y de investigar archivado continuo con recuperación a un punto en el tiempo. Procedimiento sin dueño, de asignar un responsable de la durabilidad de los datos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cada debilidad del 31 de enero con el compromiso que GitLab publicó</tspan></text><text x="10" y="61" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="10" dy="0">Debilidad documentada</tspan></text><text x="520" y="61" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="520" dy="0">Compromiso publicado por GitLab</tspan></text><rect x="10" y="73" width="420" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="220" y="105.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">Los avisos de fallo del respaldo se perdían por correo</tspan></text><rect x="520" y="73" width="410" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725" y="97.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">Monitoreo de respaldos con Prometheus y un panel</tspan></text><text x="725" y="113.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">público</tspan></text><polyline points="430,102 520,102" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="147" width="420" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="220" y="179.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">El respaldo nunca se probaba: nadie era responsable</tspan></text><rect x="520" y="147" width="410" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725" y="171.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">Pruebas automáticas de restauración y un dueño de la</tspan></text><text x="725" y="187.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">durabilidad</tspan></text><polyline points="430,176 520,176" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="221" width="420" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="220" y="245.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">Solo instantáneas diarias y ninguna de disco para las</tspan></text><text x="220" y="261.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">bases de datos</tspan></text><rect x="520" y="221" width="410" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725" y="245.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">Instantáneas LVM cada hora; investigar instantáneas</tspan></text><text x="725" y="261.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">de disco en Azure</tspan></text><polyline points="430,250 520,250" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="295" width="420" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="220" y="319.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">Una réplica que, al vaciarse, dejaba sin camino de</tspan></text><text x="220" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">recuperación</tspan></text><rect x="520" y="295" width="410" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725" y="319.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">Recuperar réplicas; investigar archivado continuo y</tspan></text><text x="725" y="335.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">punto en el tiempo</tspan></text><polyline points="430,324 520,324" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="369" width="420" height="58" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="220" y="401.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">Dos servidores casi idénticos en la terminal</tspan></text><rect x="520" y="369" width="410" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725" y="393.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">Mensaje del intérprete que distingue servidor y</tspan></text><text x="725" y="409.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">entorno</tspan></text><polyline points="430,398 520,398" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los compromisos son los que GitLab enumeró en su postmortem como incidencias abiertas, no resultados verificados: el</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">artículo no dice si se completaron ni cuándo. La conclusión de qué habría bastado es análisis propio y se desarrolla en la</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sección de mejoras del caso.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
