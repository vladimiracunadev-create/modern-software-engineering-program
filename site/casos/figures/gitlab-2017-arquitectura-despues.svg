<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arquitectura posterior: más caminos de recuperación, cada uno vigilado y con un responsable</title><desc id="d">Tres niveles. Arriba, la primaria con varias réplicas. En medio, cinco caminos de recuperación: archivado de WAL con recuperación a un punto en el tiempo, instantáneas LVM horarias, instantáneas de Azure de las bases, respaldo lógico supervisado y un entorno de restauración rápido. Abajo, pruebas automáticas de restauración que alimentan un panel, y un responsable de la durabilidad; propuestas propias: confirmación con el nombre del host, alertas por ausencia y objetivos de punto y tiempo de recuperación escritos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="492" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Arquitectura posterior: más caminos de recuperación, cada uno vigilado y con un responsable</tspan></text><rect x="10" y="51" width="300" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="160" y="74.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">Primaria con varias réplicas y</tspan></text><text x="160" y="90.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">balanceo (#259, #1101)</tspan></text><rect x="340" y="51" width="280" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="74.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Confirmación con el nombre del host</tspan></text><text x="480" y="90.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">antes de vaciar un directorio</tspan></text><rect x="650" y="51" width="280" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="790" y="82.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">RPO y RTO escritos y verificados</tspan></text><rect x="10" y="155" width="174" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="97" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">Archivado de WAL y</tspan></text><text x="97" y="200.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">recuperación a un</tspan></text><text x="97" y="217.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="97" dy="0">punto en el tiempo</tspan></text><polyline points="97,107 97,155" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="196" y="155" width="174" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="283" y="192.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="283" dy="0">Instantáneas LVM cada</tspan></text><text x="283" y="208.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="283" dy="0">hora (#1098)</tspan></text><polyline points="283,107 283,155" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="382" y="155" width="174" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="469" y="192.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="469" dy="0">Instantáneas de Azure</tspan></text><text x="469" y="208.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="469" dy="0">de las bases (#1099)</tspan></text><polyline points="469,107 469,155" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="568" y="155" width="174" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="655" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="655" dy="0">Respaldo lógico con</tspan></text><text x="655" y="200.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="655" dy="0">versión correcta y</tspan></text><text x="655" y="217.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="655" dy="0">monitoreo (#1095)</tspan></text><polyline points="655,107 655,155" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="754" y="155" width="174" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="841" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="841" dy="0">Entorno de</tspan></text><text x="841" y="200.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="841" dy="0">restauración rápido</tspan></text><text x="841" y="217.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="841" dy="0">(#1100)</tspan></text><polyline points="841,107 841,155" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="295" width="300" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="160" y="322.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">Pruebas automáticas de restauración</tspan></text><text x="160" y="338.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="160" dy="0">(#1102)</tspan></text><rect x="340" y="295" width="280" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="322.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Panel de estado y edad de los</tspan></text><text x="480" y="338.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">respaldos; alerta por ausencia</tspan></text><rect x="650" y="295" width="280" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="322.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="790" dy="0">Responsable de la durabilidad de</tspan></text><text x="790" y="338.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="790" dy="0">los datos</tspan></text><polyline points="310,327 340,327" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="650,327 620,327" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,295 470,239 560,239" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="385" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="409.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Teal: compromisos publicados en el postmortem (con el número de incidencia que da GitLab). Dorado: propuestas de este</tspan></text><text x="470" y="426.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">programa. Es un objetivo de diseño; el postmortem no dice qué se implantó ni cuándo.</tspan></text><text x="470" y="474.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
