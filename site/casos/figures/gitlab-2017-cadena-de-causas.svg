<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 454" width="940" height="454" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De una cuenta marcada por spam a un borrado en el servidor equivocado</title><desc id="d">Seis pasos encadenados. Una cuenta de empleado fue marcada por abuso y programada para borrado, lo que sumado a spam elevó la carga de la base de datos. La replicación se retrasó porque la primaria eliminó segmentos de registro que la réplica aún necesitaba. Resincronizar exigía vaciar el directorio de la réplica. pg_basebackup se quedó esperando sin mensajes. Tras varios intentos, el borrado se ejecutó en la primaria y eliminó unos 300 GB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="454" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De una cuenta marcada por spam a un borrado en el servidor equivocado</tspan></text><rect x="10" y="53" width="288" height="92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="154" y="94.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="154" dy="0">Cuenta marcada por abuso y borrado</tspan></text><text x="154" y="110.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="154" dy="0">programado, más spam: sube la carga</tspan></text><rect x="326" y="53" width="288" height="92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="86" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La primaria elimina segmentos WAL</tspan></text><text x="470" y="102.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que la réplica aún necesitaba: la</tspan></text><text x="470" y="119.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">réplica se retrasa</tspan></text><polyline points="298,99 326,99" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="53" width="288" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="786" y="86" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="786" dy="0">Resincronizar es manual: hay que</tspan></text><text x="786" y="102.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="786" dy="0">vaciar el directorio de datos de la</tspan></text><text x="786" y="119.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="786" dy="0">réplica</tspan></text><polyline points="614,99 642,99" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="183" width="288" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="154" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">pg_basebackup espera en silencio; se</tspan></text><text x="154" y="232.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">prueban max_wal_senders y</tspan></text><text x="154" y="249.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">max_connections</tspan></text><rect x="326" y="183" width="288" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El borrado del directorio se ejecuta</tspan></text><text x="470" y="232.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">en la primaria: unos 300 GB</tspan></text><text x="470" y="249.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">eliminados</tspan></text><polyline points="298,229 326,229" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="183" width="288" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="786" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="786" dy="0">Los respaldos no existían o no</tspan></text><text x="786" y="232.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="786" dy="0">servían: hay que copiar desde</tspan></text><text x="786" y="249.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="786" dy="0">staging</tspan></text><polyline points="614,229 642,229" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="786,145 786,163 154,163 154,183" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="331" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="355.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ningún paso, por sí solo, era un error evidente en su momento: cada uno tenía una explicación local. Lo documentado es la</tspan></text><text x="470" y="372.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">secuencia; la ausencia de automatización y de documentación del procedimiento de resincronización es la causa que el propio</tspan></text><text x="470" y="389.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">postmortem señala en su análisis de los cinco porqués.</tspan></text><text x="470" y="436.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
