<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 408" width="940" height="408" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cadena del respaldo vacío: ocho pasos razonables que dejaron el depósito de S3 sin nada</title><desc id="d">Dos filas de cuatro cajas. pg_dump se ejecuta en un servidor de aplicación; el paquete Omnibus elige la versión por el directorio de datos, que allí no existe, y usa PostgreSQL 9.2; la base corre 9.6; pg_dump termina con error; el aviso se envía por correo; el servidor receptor lo rechaza porque no está firmado con DMARC; nadie se entera; el depósito de S3 está vacío.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="408" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cadena del respaldo vacío: ocho pasos razonables que dejaron el depósito de S3 sin nada</tspan></text><rect x="10" y="55" width="214" height="82" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="117" y="91.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117" dy="0">1 pg_dump corre en un</tspan></text><text x="117" y="107.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="117" dy="0">servidor de aplicación</tspan></text><rect x="245" y="55" width="214" height="82" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="352" y="83" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352" dy="0">2 Omnibus elige la versión</tspan></text><text x="352" y="99.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352" dy="0">por el directorio de</tspan></text><text x="352" y="116.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="352" dy="0">datos; allí no existe</tspan></text><polyline points="224,96 245,96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="55" width="214" height="82" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="587" y="91.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587" dy="0">3 Usa PostgreSQL 9.2</tspan></text><text x="587" y="107.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="587" dy="0">mientras la base corre 9.6</tspan></text><polyline points="459,96 480,96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="715" y="55" width="214" height="82" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822" y="91.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822" dy="0">4 pg_dump termina con</tspan></text><text x="822" y="107.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822" dy="0">error</tspan></text><polyline points="694,96 715,96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="822,137 822,165 117,165 117,193" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="193" width="214" height="82" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="117" y="229.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="117" dy="0">5 El aviso del error se</tspan></text><text x="117" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="117" dy="0">envía por correo</tspan></text><rect x="245" y="193" width="214" height="82" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="352" y="221" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352" dy="0">6 El receptor lo rechaza:</tspan></text><text x="352" y="237.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352" dy="0">el correo no estaba</tspan></text><text x="352" y="254.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="352" dy="0">firmado con DMARC</tspan></text><polyline points="224,234 245,234" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="193" width="214" height="82" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587" y="229.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587" dy="0">7 Nadie sabe que el</tspan></text><text x="587" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="587" dy="0">respaldo falla</tspan></text><polyline points="459,234 480,234" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="715" y="193" width="214" height="82" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="822" y="229.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822" dy="0">8 El depósito de S3 está</tspan></text><text x="822" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="822" dy="0">vacío el 31 de enero</tspan></text><polyline points="694,234 715,234" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="301" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los pasos 1 a 3 son decisiones locales razonables; los pasos 4 a 6 son los puntos donde el sistema pudo quejarse. El</tspan></text><text x="470" y="342.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">proceso era automático y no tenía otro medio de reportar errores, según el postmortem.</tspan></text><text x="470" y="390.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
