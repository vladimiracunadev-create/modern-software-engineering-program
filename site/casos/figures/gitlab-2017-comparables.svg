<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres incidentes de operación: de unas 4 horas a hasta 14 días</title><desc id="d">Barras horizontales en horas con eje logarítmico. Amazon S3 en 2017: unas 4,3 horas de afectación. GitLab.com en 2017: unas 18 horas de indisponibilidad. Atlassian en 2022: hasta 336 horas de recuperación para algunos clientes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres incidentes de operación: de unas 4 horas a hasta 14 días</tspan></text><line x1="274" y1="49" x2="274" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="163" x2="274" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">1</tspan></text><line x1="479.94" y1="49" x2="479.94" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="479.94" y1="163" x2="479.94" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="479.94" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="479.94" dy="0">10</tspan></text><line x1="685.88" y1="49" x2="685.88" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="685.88" y1="163" x2="685.88" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="685.88" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685.88" dy="0">100</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="163" x2="891.82" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">1 000</tspan></text><line x1="274" y1="163" x2="891.82" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">AWS S3, 28 feb 2017</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">GitLab.com, 31 ene 2017</tspan></text><text x="264" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Atlassian, abril de 2022</tspan></text><rect x="274" y="55" width="130.456" height="26" rx="3" fill="#102a43"/><text x="411.456" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="411.456" dy="0">4,3</tspan></text><rect x="274" y="93" width="258.511" height="26" rx="3" fill="#102a43"/><text x="539.511" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="539.511" dy="0">18</tspan></text><rect x="274" y="131" width="520.274" height="26" rx="3" fill="#102a43"/><text x="801.274" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="801.274" dy="0">336</tspan></text><text x="582.91" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="582.91" dy="0">horas (aproximadas) (escala logarítmica)</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las tres duraciones miden cosas distintas: afectación de un servicio, indisponibilidad del servicio y recuperación de los</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">casos peores. Las 4,3 horas son cálculo propio entre las 9:37 y las 13:54 (hora del Pacífico); las 336, 14 días de la</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fuente.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: AWS (28 feb 2017), postmortem de GitLab (10 feb 2017) y Atlassian (abril de 2022).</tspan></text></svg>
