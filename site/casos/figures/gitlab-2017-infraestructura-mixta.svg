<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 438" width="940" height="438" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Infraestructura mixta: servicio en Azure, respaldos en S3 y una restauración que cruzó discos lentos</title><desc id="d">Zonas: Azure con aplicación, bases y NFS; otra región de Azure con staging de discos lentos; Amazon S3 con respaldos vacíos; y monitoreo interno y público. Flechas continuas de datos y una flecha punteada de restauración de staging a producción durante unas 18 horas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="438" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Infraestructura mixta: servicio en Azure, respaldos en S3 y una restauración que cruzó discos lentos</tspan></text><rect x="10" y="45" width="420" height="260" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Azure: región de producción</tspan></text><rect x="26" y="85" width="388" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="220" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="220" dy="0">Aplicación y servidores de base de datos db1 y db2</tspan></text><rect x="26" y="151" width="388" height="50" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220" y="179.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220" dy="0">Servidores NFS: repositorios y wikis</tspan></text><rect x="26" y="217" width="388" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="220" y="250.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="220" dy="0">Monitoreo interno; sitio público de paneles</tspan></text><rect x="470" y="45" width="460" height="120" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="484" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="484" dy="0">Azure: otra región</tspan></text><rect x="486" y="85" width="428" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="118.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">Staging con discos clásicos de unos 60 Mbps</tspan></text><rect x="470" y="185" width="460" height="120" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="484" y="207" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="484" dy="0">Amazon S3</tspan></text><rect x="486" y="225" width="428" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="258.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Respaldos lógicos diarios: depósito vacío</tspan></text><polyline points="414,101 486,101" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="486,129 414,129" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><text x="450" y="149" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="450" dy="0">18 h</tspan></text><polyline points="414,125 486,245" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="331" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="355.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dos nubes aislaban los respaldos del servicio, pero el contenido de una de ellas estaba vacío y la otra era lenta. Red,</tspan></text><text x="470" y="372.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">capacidad y dependencias externas: no se sabe.</tspan></text><text x="470" y="420.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017) y S-1 de 2021; esquema propio.</tspan></text></svg>
