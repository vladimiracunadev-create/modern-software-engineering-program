<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 456" width="940" height="456" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Casi 25 horas entre la instantánea manual y el cierre de la restauración</title><desc id="d">Línea de tiempo en horas desde las 17:00 UTC del 31 de enero de 2017. Instantánea manual a las 17:20. Carga alta por spam desde las 19:00. Fallo de replicación hacia las 23:00. Borrado de la primaria hacia las 23:30. La base se restaura sin webhooks a las 17:00 del 1 de febrero, hora 24, y los últimos pasos terminan hacia las 18:00, hora 25.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="456" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Casi 25 horas entre la instantánea manual y el cierre de la restauración</tspan></text><line x1="254" y1="83" x2="254" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="275" x2="254" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="348" y1="83" x2="348" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="348" y1="275" x2="348" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="348" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="348" dy="0">4</tspan></text><line x1="442" y1="83" x2="442" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="442" y1="275" x2="442" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="442" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="442" dy="0">8</tspan></text><line x1="536" y1="83" x2="536" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="536" y1="275" x2="536" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="536" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="536" dy="0">12</tspan></text><line x1="630" y1="83" x2="630" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="630" y1="275" x2="630" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="630" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="630" dy="0">16</tspan></text><line x1="724" y1="83" x2="724" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="724" y1="275" x2="724" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="724" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="724" dy="0">20</tspan></text><line x1="818" y1="83" x2="818" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="818" y1="275" x2="818" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="818" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="818" dy="0">24</tspan></text><line x1="912" y1="83" x2="912" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="275" x2="912" y2="280" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="296" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">28</tspan></text><line x1="254" y1="275" x2="912" y2="275" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="111.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Carga alta por spam</tspan></text><text x="244" y="159.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Réplica y resincronización</tspan></text><text x="244" y="207.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">GitLab.com no disponible</tspan></text><text x="244" y="255.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Datos que se pierden</tspan></text><line x1="261.755" y1="75" x2="261.755" y2="275" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="261.755" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="261.755" dy="0">17:20 instantánea</tspan></text><line x1="406.75" y1="75" x2="406.75" y2="275" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="406.75" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="406.75" dy="0">≈23:30 borrado</tspan></text><line x1="818" y1="75" x2="818" y2="275" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="818" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="818" dy="0">17:00 restaurada</tspan></text><rect x="301" y="92" width="94" height="30" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="348" y="111.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="348" dy="0">carga alta</tspan></text><line x1="14" y1="131" x2="912" y2="131" stroke="#d5dde1" stroke-width="1"/><rect x="395" y="140" width="11.75" height="30" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="406.75" y="140" width="411.25" height="30" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="612.375" y="159.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="612.375" dy="0">intentos fallidos y copia desde staging</tspan></text><line x1="14" y1="179" x2="912" y2="179" stroke="#d5dde1" stroke-width="1"/><rect x="406.75" y="188" width="434.75" height="30" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="624.125" y="207.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="624.125" dy="0">unas 18 horas sin servicio</tspan></text><line x1="14" y1="227" x2="912" y2="227" stroke="#d5dde1" stroke-width="1"/><rect x="261.755" y="236" width="144.995" height="30" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="334.252" y="255.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="334.252" dy="0">17:20 a 23:30</tspan></text><text x="583" y="319" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="583" dy="0">horas desde las 17:00 UTC del 31 de enero de 2017</tspan></text><rect x="10" y="333" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="357.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: las horas citadas y que la copia de datos desde staging tomó unas 18 horas por discos de red limitados a unos</tspan></text><text x="470" y="374.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">60 Mbps. El postmortem da dos cierres para la ventana de datos perdidos, 23:30 y 00:00 UTC; la figura usa 23:30, el de la</tspan></text><text x="470" y="391.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sección de impacto.</tspan></text><text x="470" y="438.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017). Barra de resincronización: la fuente no da su inicio exacto.</tspan></text></svg>
