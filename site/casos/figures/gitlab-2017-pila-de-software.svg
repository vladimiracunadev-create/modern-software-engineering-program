<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 561" width="940" height="561" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pila de software: de la aplicación Rails al cliente de respaldo que no coincidía con la base</title><desc id="d">Cinco capas: aplicación GitLab con Rails; paquete Omnibus que elige las versiones; PostgreSQL 9.6 en producción; herramientas de respaldo y replicación pg_dump, pg_basebackup y LVM; y servicios de nube Azure y S3. A la derecha, las herramientas evaluadas después del incidente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="561" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pila de software: de la aplicación Rails al cliente de respaldo que no coincidía con la base</tspan></text><rect x="10" y="53" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Aplicación GitLab</tspan></text><rect x="214" y="53" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Rails; migraciones; reportes de abuso</tspan></text><rect x="10" y="133" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="169.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Paquete Omnibus</tspan></text><rect x="214" y="133" width="430" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="429" y="161.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">Elige la versión de PostgreSQL por el directorio de</tspan></text><text x="429" y="177.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">datos</tspan></text><rect x="10" y="213" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="249.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">PostgreSQL 9.6</tspan></text><rect x="214" y="213" width="430" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="249.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">Primaria y secundaria; WAL por streaming</tspan></text><rect x="10" y="293" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Respaldo y replicación</tspan></text><rect x="214" y="293" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">pg_dump 9.2, pg_basebackup, LVM y instantáneas de Azure</tspan></text><rect x="10" y="373" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="409.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Nube</tspan></text><rect x="214" y="373" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="409.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Azure para el servicio; Amazon S3 para los respaldos</tspan></text><rect x="668" y="53" width="262" height="114.667" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="105.653" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Evaluadas: pgpool-II 3.6.1,</tspan></text><text x="799" y="122.293" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">pgbarman y WAL-E</tspan></text><rect x="668" y="181.667" width="262" height="114.667" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="234.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Monitoreo de respaldos con</tspan></text><text x="799" y="250.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Prometheus</tspan></text><rect x="668" y="310.333" width="262" height="114.667" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="799" y="362.987" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">No se sabe: versiones de Ruby y</tspan></text><text x="799" y="379.627" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">del sistema operativo</tspan></text><rect x="10" y="459" width="920" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="489.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Software nombrado por el postmortem; no es un inventario completo.</tspan></text><text x="470" y="543" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017) y S-1 de 2021; esquema propio.</tspan></text></svg>
