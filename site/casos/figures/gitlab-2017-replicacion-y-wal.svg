<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 468" width="940" height="468" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Replicación y WAL: el camino normal y el que tomó la noche del 31 de enero</title><desc id="d">Dos filas de cajas. Camino normal: db1 escribe segmentos de WAL, db2 los lee por streaming y la réplica queda al día. Camino de la noche del 31: la carga sube, db2 se atrasa, db1 recicla los segmentos que db2 necesitaba, sin archivado de WAL no se pueden recuperar, la réplica debe reconstruirse vaciando su directorio y pg_basebackup espera en silencio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="468" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Replicación y WAL: el camino normal y el que tomó la noche del 31 de enero</tspan></text><text x="14" y="63" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="14" dy="0">Funcionamiento normal</tspan></text><rect x="10" y="75" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">db1 escribe cada cambio en segmentos</tspan></text><text x="158" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">de WAL</tspan></text><rect x="326" y="75" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="474" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="474" dy="0">db2 lee los segmentos por streaming</tspan></text><polyline points="306,105 326,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="75" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">La réplica queda al día y sirve para</tspan></text><text x="790" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">conmutar</tspan></text><polyline points="622,105 642,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="14" y="171" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="14" dy="0">Noche del 31 de enero</tspan></text><rect x="10" y="183" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="158" y="216.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="158" dy="0">La carga sube y db2 se atrasa</tspan></text><rect x="326" y="183" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="474" y="208.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="474" dy="0">db1 recicla segmentos que db2 aún</tspan></text><text x="474" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="474" dy="0">necesitaba</tspan></text><polyline points="306,213 326,213" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="183" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="790" y="208.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">Sin archivado de WAL: no se pueden</tspan></text><text x="790" y="224.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="790" dy="0">recuperar</tspan></text><polyline points="622,213 642,213" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="778,243 778,273" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="632" y="273" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="780" y="298.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="780" dy="0">Reconstrucción: vaciar el directorio</tspan></text><text x="780" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="780" dy="0">de db2 y correr pg_basebackup</tspan></text><polyline points="632,303 606,303" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="316" y="273" width="290" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="461" y="298.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="461" dy="0">La herramienta espera en silencio a</tspan></text><text x="461" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="461" dy="0">que db1 envíe datos</tspan></text><polyline points="316,303 290,303" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="273" width="280" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="150" y="298.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="150" dy="0">Parece un fallo: se repite el</tspan></text><text x="150" y="314.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="150" dy="0">vaciado, esta vez en db1</tspan></text><rect x="10" y="361" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="385.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La caja «sin archivado de WAL» convierte un atraso en una reconstrucción. El silencio de la herramienta es normal según el</tspan></text><text x="470" y="402.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">postmortem y no figuraba en los runbooks ni en la documentación oficial.</tspan></text><text x="470" y="450.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: postmortem público de GitLab (10 feb 2017); esquema propio.</tspan></text></svg>
