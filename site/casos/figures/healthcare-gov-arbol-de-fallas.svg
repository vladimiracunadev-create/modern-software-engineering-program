<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 544" width="940" height="544" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: qué tuvo que coincidir para que el 1 de octubre no funcionara</title><desc id="d">Árbol de fallas con tres ramas bajo el evento principal: el sistema no sostenía la demanda, los defectos conocidos no estaban corregidos y se lanzó sin criterio de salida; cada rama con sus condiciones documentadas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="544" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: qué tuvo que coincidir para que el 1 de octubre no funcionara</tspan></text><rect x="300" y="51" width="340" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="72.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Muchos usuarios no pueden inscribirse el 1</tspan></text><text x="470" y="88.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">de octubre</tspan></text><circle cx="470" cy="127" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="132" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">O</tspan></text><polyline points="470,103 470,115" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="470" y1="139" x2="160" y2="161" stroke="#8a9aa3" stroke-width="1.4"/><line x1="470" y1="139" x2="470" y2="161" st