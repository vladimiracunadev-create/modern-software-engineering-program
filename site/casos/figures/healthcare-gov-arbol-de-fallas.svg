 dy="0">Sin plan</tspan></text><text x="160" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">de</tspan></text><text x="160" y="362.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">capacidad</tspan></text><line x1="160" y1="253" x2="160" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="212" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="256" y="337.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="256" dy="0">Identidad</tspan></text><text x="256" y="353.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="256" dy="0">saturada</tspan></text><line x1="160" y1="253" x2="256" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="470" cy="241" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><line x1="470" y1="217" x2="470" y2="229" stroke="#8a9aa3" stroke-width="1.4"/><rect x="330" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="374" y="320.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="374" dy="0">45</tspan></text><text x="374" y="337.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="374" dy="0">críticos</tspan></text><text x="374" y="353.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="374" dy="0">y 324</tspan></text><text x="374" y="370.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="374" dy="0">graves</tspan></text><line x1="470" y1="253" x2="374" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="426" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="312.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Sin</tspan></text><text x="470" y="329" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pruebas</tspan></text><text x="470" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de</tspan></text><text x="470" y="362.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">extremo a</tspan></text><text x="470" y="378.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">extremo</tspan></text><line x1="470" y1="253" x2="470" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="522" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="566" y="320.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="566" dy="0">Pruebas</tspan></text><text x="566" y="337.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="566" dy="0">con</tspan></text><text x="566" y="353.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="566" dy="0">aseguradoras</tspan></text><text x="566" y="370.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="566" dy="0">incompletas</tspan></text><line x1="470" y1="253" x2="566" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="780" cy="241" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="780" y="246" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="780" dy="0">Y</tspan></text><line x1="780" y1="217" x2="780" y2="229" stroke="#8a9aa3" stroke-width="1.4"/><rect x="640" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="684" y="329" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="684" dy="0">Fecha</tspan></text><text x="684" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="684" dy="0">legal</tspan></text><text x="684" y="362.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="684" dy="0">fija</tspan></text><line x1="780" y1="253" x2="684" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="736" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="780" y="329" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="780" dy="0">Revisión</tspan></text><text x="780" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="780" dy="0">movida a</tspan></text><text x="780" y="362.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="780" dy="0">septiembre</tspan></text><line x1="780" y1="253" x2="780" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="832" y="277" width="88" height="130" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="876" y="329" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="876" dy="0">Sin</tspan></text><text x="876" y="345.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="876" dy="0">verificar</tspan></text><text x="876" y="362.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="876" dy="0">rendimiento</tspan></text><line x1="780" y1="253" x2="876" y2="277" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="421" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="445.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: «O» en la cima indica que bastaba una de las tres ramas para que fallara, y se dieron las tres a la vez; en</tspan></text><text x="470" y="462.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cada rama las condiciones se combinan («Y»). Cortar solo una (por ejemplo, ampliar capacidad) no habría evitado los</tspan></text><text x="470" y="479.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">defectos sin corregir.</tspan></text><text x="470" y="526.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en GAO-14-694, GAO-15-238 y OEI-06-14-00350; no es una conclusión de esas fuentes.</tspan></text></svg>
