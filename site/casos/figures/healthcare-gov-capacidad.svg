<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 355" width="940" height="355" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La capacidad subió a 400 TB, pero las fuentes parten de bases distintas</title><desc id="d">Puntos huecos y rellenos: GAO-14-694 informa un aumento de 50 a 400 terabytes con una obligación de 1,5 millones de dólares; GAO-15-238 informa que la capacidad mensual para usuarios de internet pasó de 25 a 400 terabytes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="355" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La capacidad subió a 400 TB, pero las fuentes parten de bases distintas</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Antes</tspan></text><circle cx="107.7" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="121.7" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="121.7" dy="0">Después</tspan></text><line x1="406.18" y1="77" x2="406.18" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="406.18" y1="157" x2="406.18" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="406.18" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="406.18" dy="0">0</tspan></text><line x1="513.545" y1="77" x2="513.545" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="513.545" y1="157" x2="513.545" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="513.545" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="513.545" dy="0">100</tspan></text><line x1="620.91" y1="77" x2="620.91" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="620.91" y1="157" x2="620.91" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="620.91" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="620.91" dy="0">200</tspan></text><line x1="728.275" y1="77" x2="728.275" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="728.275" y1="157" x2="728.275" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="728.275" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="728.275" dy="0">300</tspan></text><line x1="835.64" y1="77" x2="835.64" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="835.64" y1="157" x2="835.64" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="835.64" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.64" dy="0">400</tspan></text><line x1="406.18" y1="157" x2="835.64" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="354" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">GAO-14-694: durante el desarrollo (TB)</tspan></text><text x="354" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="354" dy="0">GAO-15-238: capacidad mensual de internet (TB)</tspan></text><line x1="459.863" y1="97" x2="835.64" y2="97" stroke="#087f8c" stroke-width="4"/><circle cx="459.863" cy="97" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="835.64" cy="97" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="447.863" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="447.863" dy="0">50</tspan></text><text x="847.64" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="847.64" dy="0">400</tspan></text><text x="926" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×8</tspan></text><line x1="433.021" y1="137" x2="835.64" y2="137" stroke="#087f8c" stroke-width="4"/><circle cx="433.021" cy="137" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="835.64" cy="137" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="421.021" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="421.021" dy="0">25</tspan></text><text x="847.64" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="847.64" dy="0">400</tspan></text><text x="926" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#5c1f14"><tspan x="926" dy="0">×16</tspan></text><text x="620.91" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="620.91" dy="0">Terabytes</tspan></text><rect x="10" y="215" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las dos fuentes coinciden en el destino (400 TB) y difieren en el punto de partida (50 y 25 TB); pueden medir cosas</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">distintas y las mostramos ambas. Lo importante es el orden de magnitud: un factor de 8 a 16 se necesitó después de abrir,</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no antes. Además, CMS duplicó el número de servidores, añadió máquinas virtuales y sustituyó una base de datos virtual por</tspan></text><text x="470" y="289.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">una física en identidad.</tspan></text><text x="470" y="337.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: GAO-14-694 y GAO-15-238 (cifras de capacidad y actuaciones de CMS).</tspan></text></svg>
