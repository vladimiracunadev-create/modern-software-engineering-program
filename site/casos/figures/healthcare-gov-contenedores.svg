<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 518" width="940" height="518" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Contenedores: qué sistema hacía qué, y quién lo construyó</title><desc id="d">Diagrama de contenedores de Healthcare.gov: el consumidor entra por el sitio y la gestión de identidad, el mercado federal FFM con sus tres módulos de elegibilidad e inscripción, gestión de planes y financiero, y el centro de servicios de datos que consulta fuentes federales; las aseguradoras envían planes y reciben inscripciones. Debajo, los contratistas de cada pieza.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="518" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Contenedores: qué sistema hacía qué, y quién lo construyó</tspan></text><rect x="10" y="91" width="130" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="75" y="129.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="75" dy="0">Consumidor</tspan></text><rect x="165" y="51" width="560" height="252" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="179" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="179" dy="0">Sistemas federales (CMS)</tspan></text><rect x="185" y="91" width="120" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="245" y="121.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="245" dy="0">Sitio</tspan></text><text x="245" y="137.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="245" dy="0">Healthcare.gov</tspan></text><rect x="325" y="91" width="150" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="400" y="113" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="400" dy="0">Gestión de</tspan></text><text x="400" y="129.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="400" dy="0">identidad (EIDM):</tspan></text><text x="400" y="146.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="400" dy="0">cuentas y acceso</tspan></text><rect x="495" y="59" width="225" height="214" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="509" y="81" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="509" dy="0">FFM (CGI Federal)</tspan></text><rect x="510" y="87" width="195" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="607.5" y="108.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="607.5" dy="0">Elegibilidad e</tspan></text><text x="607.5" y="124.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="607.5" dy="0">inscripción</tspan></text><rect x="510" y="147" width="195" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="607.5" y="176.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="607.5" dy="0">Gestión de planes</tspan></text><rect x="510" y="207" width="195" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="607.5" y="236.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="607.5" dy="0">Financiero (aplazado)</tspan></text><rect x="310" y="201" width="150" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="385" y="223" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="385" dy="0">Centro de</tspan></text><text x="385" y="239.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="385" dy="0">servicios de</tspan></text><text x="385" y="256.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="385" dy="0">datos (Hub)</tspan></text><rect x="765" y="61" width="165" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847.5" y="89.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847.5" dy="0">Aseguradoras:</tspan></text><text x="847.5" y="106.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847.5" dy="0">envían planes y</tspan></text><text x="847.5" y="122.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847.5" dy="0">reciben</tspan></text><text x="847.5" y="139.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847.5" dy="0">inscripciones</tspan></text><rect x="765" y="201" width="165" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="847.5" y="228" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847.5" dy="0">Fuentes federales</tspan></text><text x="847.5" y="244.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847.5" dy="0">(por ejemplo IRS y</tspan></text><text x="847.5" y="261.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="847.5" dy="0">seguridad social)</tspan></text><polyline points="140,126 185,126" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="305,126 325,126" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="475,126 495,126" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="495,236 460,236" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="705,173 765,131" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="385,271 385,291 847,291 847,281" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="317" width="300" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="340.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">FFM: CGI Federal (órdenes de</tspan></text><text x="160" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">septiembre de 2011)</tspan></text><rect x="330" y="317" width="300" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="340.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">Hub: QSSI (septiembre de 2011);</tspan></text><text x="480" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">integrador desde octubre de 2013</tspan></text><rect x="650" y="317" width="280" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="790" y="340.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">Accenture: contrato de enero de</tspan></text><text x="790" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="790" dy="0">2014 para completar el FFM</tspan></text><rect x="10" y="395" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="419.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: toda persona atravesaba primero la identidad y luego la verificación sobre otros sistemas de otras agencias.</tspan></text><text x="470" y="436.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El flujo crítico dependía de tres contratistas y de fuentes que CMS no controlaba, y el módulo financiero ya estaba</tspan></text><text x="470" y="453.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aplazado antes de abrir.</tspan></text><text x="470" y="500.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: GAO-14-694, GAO-15-238 y CMS (1 de diciembre de 2013). Modelo funcional propio.</tspan></text></svg>
