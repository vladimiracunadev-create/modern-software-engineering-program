<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 454" width="940" height="454" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién construyó qué: un mercado federal armado con contratistas y varias agencias</title><desc id="d">Diagrama de contexto: los ciudadanos usan el sitio Healthcare.gov; detrás está el mercado federal FFM, desarrollado por un contratista bajo CMS, que consulta el centro de servicios de datos federal, desarrollado por otro contratista, para verificar a los solicitantes con fuentes federales; las aseguradoras reciben las inscripciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="454" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién construyó qué: un mercado federal armado con contratistas y varias agencias</tspan></text><rect x="10" y="89" width="170" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="95" y="116" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="95" dy="0">Consumidores que</tspan></text><text x="95" y="132.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="95" dy="0">comparan y eligen un</tspan></text><text x="95" y="149.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="95" dy="0">plan</tspan></text><rect x="215" y="89" width="170" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="300" y="132.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="300" dy="0">Sitio Healthcare.gov</tspan></text><rect x="420" y="89" width="170" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="505" y="107.68" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="505" dy="0">FFM: mercado federal</tspan></text><text x="505" y="124.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="505" dy="0">(cuentas,</tspan></text><text x="505" y="140.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="505" dy="0">elegibilidad,</tspan></text><text x="505" y="157.6" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="505" dy="0">inscripción)</tspan></text><rect x="625" y="89" width="140" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="695" y="116" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="695" dy="0">Centro de</tspan></text><text x="695" y="132.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="695" dy="0">servicios de</tspan></text><text x="695" y="149.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="695" dy="0">datos federal</tspan></text><rect x="795" y="49" width="135" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862.5" y="64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862.5" dy="0">Fuentes</tspan></text><text x="862.5" y="80.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862.5" dy="0">federales (p.</tspan></text><text x="862.5" y="97.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862.5" dy="0">ej., IRS, SSA)</tspan></text><rect x="795" y="125" width="135" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="862.5" y="140" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862.5" dy="0">Aseguradoras</tspan></text><text x="862.5" y="156.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862.5" dy="0">(planes y</tspan></text><text x="862.5" y="173.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="862.5" dy="0">primas)</tspan></text><polyline points="180,129 215,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="385,129 420,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="590,129 625,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="765,115 795,89" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="590,149 600,199 860,199 860,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="720" y="193" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="720" dy="0">inscripciones</tspan></text><text x="14" y="239" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">CMS (dentro de HHS) contrata y supervisa; en 2011 se emitieron dos órdenes de trabajo y en enero de 2014 un contrato adicional</tspan></text><rect x="14" y="253" width="290" height="74" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="159" y="285.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="159" dy="0">FFM: orden de trabajo a CGI Federal</tspan></text><text x="159" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="159" dy="0">(septiembre de 2011)</tspan></text><rect x="325" y="253" width="290" height="74" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="285.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="470" dy="0">Centro de datos: orden de trabajo a</tspan></text><text x="470" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="470" dy="0">QSSI (septiembre de 2011)</tspan></text><rect x="636" y="253" width="290" height="74" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="781" y="285.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="781" dy="0">Contrato a Accenture Federal Services</tspan></text><text x="781" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="781" dy="0">(enero de 2014) para completar el FFM</tspan></text><rect x="10" y="347" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="371.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: no era un sitio web, era una cadena de sistemas de varias organizaciones que debían funcionar juntas el</tspan></text><text x="470" y="388.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mismo día. Un punto débil en cualquiera aparecía para el usuario como un único «no funciona».</tspan></text><text x="470" y="436.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: GAO-14-694 (julio de 2014). Descripción funcional; la distribución de módulos es la que GAO resume.</tspan></text></svg>
