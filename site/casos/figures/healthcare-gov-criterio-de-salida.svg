<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 512" width="940" height="512" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diseño de la barrera de lanzamiento: un criterio de salida con cinco preguntas y veto</title><desc id="d">Diagrama de decisión de un criterio de salida: cinco preguntas en cadena sobre extremo a extremo, defectos críticos, capacidad con margen, ensayo de reversión y canal de malas noticias; si alguna es no, el lanzamiento pasa a alcance reducido o apertura gradual, no se aplaza en bloque.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="512" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diseño de la barrera de lanzamiento: un criterio de salida con cinco preguntas y veto</tspan></text><rect x="10" y="71" width="156" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="88" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="88" dy="0">¿Pasó el recorrido</tspan></text><text x="88" y="124.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="88" dy="0">extremo a extremo</tspan></text><text x="88" y="141.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="88" dy="0">con terceros?</tspan></text><polyline points="166,121 202,121" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="184" y="109" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="184" dy="0">sí</tspan></text><polyline points="88,171 88,221" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="102" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="102" dy="0">no</tspan></text><rect x="202" y="71" width="156" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="280" y="116.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="280" dy="0">¿Cero defectos</tspan></text><text x="280" y="132.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="280" dy="0">críticos abiertos?</tspan></text><polyline points="358,121 394,121" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="376" y="109" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="376" dy="0">sí</tspan></text><polyline points="280,171 280,221" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="294" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">no</tspan></text><rect x="394" y="71" width="156" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="472" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">¿La prueba de</tspan></text><text x="472" y="124.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">carga cubre 2× la</tspan></text><text x="472" y="141.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="472" dy="0">demanda esperada?</tspan></text><polyline points="550,121 586,121" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="568" y="109" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="568" dy="0">sí</tspan></text><polyline points="472,171 472,221" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="486" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486" dy="0">no</tspan></text><rect x="586" y="71" width="156" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="664" y="116.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="664" dy="0">¿Hay vuelta atrás</tspan></text><text x="664" y="132.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="664" dy="0">ensayada?</tspan></text><polyline points="742,121 778,121" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="760" y="109" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="760" dy="0">sí</tspan></text><polyline points="664,171 664,221" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="678" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="678" dy="0">no</tspan></text><rect x="778" y="71" width="156" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="856" y="108" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="856" dy="0">¿Alguien con veto</tspan></text><text x="856" y="124.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="856" dy="0">ha oído las malas</tspan></text><text x="856" y="141.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="856" dy="0">noticias?</tspan></text><polyline points="856,171 856,221" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="870" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="870" dy="0">no</tspan></text><rect x="10" y="221" width="900" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="460" y="257.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="460" dy="0">Salida «no»: reducir alcance o abrir por cohortes y regiones, con vuelta atrás; no empezar para todos con la fecha fija</tspan></text><rect x="10" y="309" width="900" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="460" y="342.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="460" dy="0">Salida «sí» en las cinco: lanzamiento completo con monitoreo y sala de crisis activos desde el primer día</tspan></text><rect x="10" y="389" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="413.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: la barrera no pide perfección, pide que cada «no» tenga una alternativa menor que lanzar para todos. Con</tspan></text><text x="470" y="430.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">fecha legal fija, lo que se mueve es el alcance, y eso se decide antes de que llegue la fecha. Las cinco preguntas son</tspan></text><text x="470" y="447.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">diseño propio; los umbrales se calibran por sistema.</tspan></text><text x="470" y="494.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en GAO-14-694, GAO-15-238 y OEI-06-14-00350; no es una conclusión de esas fuentes.</tspan></text></svg>
