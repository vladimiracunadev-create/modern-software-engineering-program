<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 612" width="940" height="612" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién era quién: organizaciones y contratistas del mercado federal</title><desc id="d">Esquema de actores: HHS, que creó en 2010 una oficina nueva y en enero de 2011 trasladó el proyecto a CMS; dentro de CMS, la oficina de información y la de adquisiciones; los contratistas CGI Federal para el mercado federal, QSSI para el centro de datos y luego como integrador, Terremark para la infraestructura de cómputo y Accenture desde 2014; y las fuentes federales y los estados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="612" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién era quién: organizaciones y contratistas del mercado federal</tspan></text><rect x="300" y="51" width="340" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="72.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">HHS: crea en marzo de 2010 una oficina</tspan></text><text x="470" y="88.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">nueva para los mercados</tspan></text><rect x="300" y="131" width="340" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="154.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">CMS: el proyecto pasa a CMS en enero de</tspan></text><text x="470" y="170.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">2011</tspan></text><polyline points="470,103 470,131" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="221" width="280" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="246.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">Oficina de información de CMS:</tspan></text><text x="150" y="262.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">programa y tecnología</tspan></text><rect x="330" y="221" width="280" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="246.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Oficina de adquisiciones y</tspan></text><text x="470" y="262.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">subvenciones de CMS: contratos</tspan></text><rect x="650" y="221" width="280" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="790" y="246.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">Centro de operaciones del mercado</tspan></text><text x="790" y="262.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">(XOC): creado tras el lanzamiento</tspan></text><polyline points="470,187 150,221" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,187 470,221" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,187 790,221" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="321" width="218" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="119" y="354.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="119" dy="0">CGI Federal: mercado</tspan></text><text x="119" y="370.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="119" dy="0">federal (FFM)</tspan></text><polyline points="470,281 119,321" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="242" y="321" width="218" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="351" y="346" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="351" dy="0">QSSI: centro de datos;</tspan></text><text x="351" y="362.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="351" dy="0">integrador desde octubre de</tspan></text><text x="351" y="379.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="351" dy="0">2013</tspan></text><polyline points="470,281 351,321" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="474" y="321" width="218" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="583" y="354.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="583" dy="0">Terremark: infraestructura</tspan></text><text x="583" y="370.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="583" dy="0">y capacidad de cómputo</tspan></text><polyline points="470,281 583,321" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="706" y="321" width="218" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="815" y="354.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="815" dy="0">Accenture: continuación del</tspan></text><text x="815" y="370.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="815" dy="0">FFM desde enero de 2014</tspan></text><polyline points="470,281 815,321" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="427" width="450" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="458.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Fuentes federales: por ejemplo IRS y seguridad social</tspan></text><rect x="480" y="427" width="450" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="458.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Estados con mercado propio o asociado; aseguradoras</tspan></text><rect x="10" y="505" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="529.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: un mismo producto dependía de varias organizaciones con contratos distintos y, hasta octubre, sin un</tspan></text><text x="470" y="546.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">integrador único. Los nombres son los que dan las auditorías; no se asigna responsabilidad a personas.</tspan></text><text x="470" y="594.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: OEI-06-14-00350 y GAO-14-694. Plantilla y organigrama interno de CMS: no se sabe.</tspan></text></svg>
