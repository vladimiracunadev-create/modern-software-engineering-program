<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El recorrido del usuario y el estado de cada módulo al terminar la orden de trabajo</title><desc id="d">Recorrido de cuatro pasos: crear cuenta, verificar elegibilidad, elegir plan e inscribirse, y pago de primas; GAO resume que a febrero de 2014 solo el módulo de gestión de planes estaba completo, el de elegibilidad e inscripción tenía solo parte de sus elementos y el financiero estaba sin terminar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El recorrido del usuario y el estado de cada módulo al terminar la orden de trabajo</tspan></text><rect x="10" y="51" width="205" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="112.5" y="91.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="112.5" dy="0">1. Crear cuenta e iniciar</tspan></text><text x="112.5" y="107.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="112.5" dy="0">sesión</tspan></text><rect x="10" y="171" width="205" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="112.5" y="199.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="112.5" dy="0">Capacidad insuficiente:</tspan></text><text x="112.5" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="112.5" dy="0">dificultad para crear</tspan></text><text x="112.5" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="112.5" dy="0">cuentas y entrar</tspan></text><text x="112.5" y="249.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="112.5" dy="0">(GAO-15-238)</tspan></text><polyline points="112.5,141 112.5,171" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="215,96 245,96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="245" y="51" width="205" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="347.5" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="347.5" dy="0">2. Verificar identidad e</tspan></text><text x="347.5" y="99.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="347.5" dy="0">ingresos con fuentes</tspan></text><text x="347.5" y="116.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="347.5" dy="0">federales</tspan></text><rect x="245" y="171" width="205" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="347.5" y="199.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347.5" dy="0">Parte de los elementos</tspan></text><text x="347.5" y="216.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347.5" dy="0">del módulo de</tspan></text><text x="347.5" y="232.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347.5" dy="0">elegibilidad e</tspan></text><text x="347.5" y="249.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="347.5" dy="0">inscripción</tspan></text><polyline points="347.5,141 347.5,171" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="450,96 480,96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="480" y="51" width="205" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="582.5" y="91.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="582.5" dy="0">3. Comparar y elegir</tspan></text><text x="582.5" y="107.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="582.5" dy="0">plan; inscribirse</tspan></text><rect x="480" y="171" width="205" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="582.5" y="208" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582.5" dy="0">Módulo de gestión de</tspan></text><text x="582.5" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582.5" dy="0">planes completo (según</tspan></text><text x="582.5" y="241.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="582.5" dy="0">funcionarios de CMS)</tspan></text><polyline points="582.5,141 582.5,171" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="685,96 715,96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="715" y="51" width="205" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="817.5" y="91.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="817.5" dy="0">4. Pagos y conciliación</tspan></text><text x="817.5" y="107.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="817.5" dy="0">con aseguradoras</tspan></text><rect x="715" y="171" width="205" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817.5" y="208" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817.5" dy="0">Módulo financiero sin</tspan></text><text x="817.5" y="224.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817.5" dy="0">terminar y aplazado al</tspan></text><text x="817.5" y="241.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817.5" dy="0">final del plazo</tspan></text><polyline points="817.5,141 817.5,171" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="14" y="163" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Estado según GAO</tspan></text><rect x="10" y="291" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: CMS priorizó para el lanzamiento lo que se necesitaba para inscribirse y aplazó lo que se necesitaba</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">después. La decisión es defendible; el problema es que aun lo priorizado salió sin verificarse con carga ni de extremo a</tspan></text><text x="470" y="349.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">extremo.</tspan></text><text x="470" y="396.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: GAO-14-694 (julio de 2014). GAO-15-238 para capacidad y pruebas.</tspan></text></svg>
