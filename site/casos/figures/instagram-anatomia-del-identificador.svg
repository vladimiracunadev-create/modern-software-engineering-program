<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 298" width="940" height="298" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Anatomía de un identificador de Instagram: 64 bits con la hora y el fragmento dentro</title><desc id="d">Barra apilada de 64 bits: 41 bits de tiempo en milisegundos, 13 bits con el identificador del fragmento lógico y 10 bits de una secuencia que da hasta 1 024 identificadores por fragmento y milisegundo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="298" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Anatomía de un identificador de Instagram: 64 bits con la hora y el fragmento dentro</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Tiempo en ms (41 bits)</tspan></text><rect x="229.88" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="249.88" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="249.88" dy="0">Fragmento lógico (13 bits)</tspan></text><rect x="473.92" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="493.92" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="493.92" dy="0">Secuencia (10 bits)</tspan></text><line x1="212.96" y1="77" x2="212.96" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="212.96" y1="117" x2="212.96" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="212.96" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="212.96" dy="0">0</tspan></text><line x1="378.645" y1="77" x2="378.645" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="378.645" y1="117" x2="378.645" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="378.645" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="378.645" dy="0">20</tspan></text><line x1="544.33" y1="77" x2="544.33" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="544.33" y1="117" x2="544.33" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="544.33" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.33" dy="0">40</tspan></text><line x1="710.015" y1="77" x2="710.015" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="710.015" y1="117" x2="710.015" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="710.015" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="710.015" dy="0">60</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="117" x2="875.7" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">80</tspan></text><line x1="212.96" y1="117" x2="875.7" y2="117" stroke="#5b7280" stroke-width="1.6"/><text x="202.96" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="202.96" dy="0">Identificador de 64 bits</tspan></text><rect x="212.96" y="84" width="339.654" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="382.787" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="382.787" dy="0">41</tspan></text><rect x="552.614" y="84" width="107.695" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="606.462" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="606.462" dy="0">13</tspan></text><rect x="660.31" y="84" width="82.8425" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="701.731" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="701.731" dy="0">10</tspan></text><text x="750.152" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="750.152" dy="0">64</tspan></text><text x="544.33" y="161" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.33" dy="0">bits</tspan></text><rect x="10" y="175" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: con una época propia, 41 bits dan unos 41 años de identificadores; 13 bits permiten hasta 8 192 fragmentos</tspan></text><text x="470" y="216.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">lógicos; la secuencia módulo 1 024 da 1 024 identificadores por fragmento por milisegundo. Cálculo propio: 2^13 = 8 192.</tspan></text><text x="470" y="233.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: es el diseño de la época de PostgreSQL (2011-2012).</tspan></text><text x="470" y="280.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Sharding &amp; IDs at Instagram», Instagram Engineering (copia archivada fechada el 30 de diciembre de 2012).</tspan></text></svg>
