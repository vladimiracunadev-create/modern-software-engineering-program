<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 582" width="940" height="582" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Capas de Instagram que su ingeniería describió</title><desc id="d">Pila de capas: clientes iOS y Android; un nivel web sin estado en Django con Python; servicios de apoyo con Cassandra, TAO y Memcached; trabajos asíncronos con Celery y la infraestructura de Meta en centros de datos de Estados Unidos y Europa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="582" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Capas de Instagram que su ingeniería describió</tspan></text><rect x="10" y="53" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Clientes</tspan></text><rect x="214" y="53" width="430" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">Aplicaciones para iOS y Android y la web</tspan></text><rect x="10" y="133" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="169.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Nivel web</tspan></text><rect x="214" y="133" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="161.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Django en Python, servidor con procesos pre-bifurcados y</tspan></text><text x="429" y="177.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">asyncio por proceso; sin estado</tspan></text><rect x="10" y="213" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="249.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Servicios y trabajos</tspan></text><rect x="214" y="213" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="249.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Trabajos asíncronos con Celery; el grafo social en TAO</tspan></text><rect x="10" y="293" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Datos</tspan></text><rect x="214" y="293" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="321.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">PostgreSQL fragmentado (primeras etapas), Cassandra como</tspan></text><text x="429" y="337.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">clave-valor general y Memcached</tspan></text><rect x="10" y="373" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="409.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Infraestructura</tspan></text><rect x="214" y="373" width="430" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="429" y="409.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="429" dy="0">Centros de datos de Meta en EE. UU. y Europa; antes, AWS</tspan></text><rect x="668" y="53" width="262" height="114.667" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="113.973" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Documentado entre 2012 y 2023</tspan></text><rect x="668" y="181.667" width="262" height="114.667" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="799" y="234.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">No se sabe: pila actual de cada</tspan></text><text x="799" y="250.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">servicio</tspan></text><rect x="668" y="310.333" width="262" height="114.667" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="799" y="354.667" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">Inferido: Reels y vídeo usan</tspan></text><text x="799" y="371.307" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">sistemas de Meta no descritos</tspan></text><text x="799" y="387.947" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">aquí</tspan></text><rect x="10" y="459" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="483.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el post de fragmentación (copia de 2012), la charla de LISA 2018 resumida por InfoQ y los posts de</tspan></text><text x="470" y="500.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Engineering at Meta de 2020 a 2023. Dónde deja de valer: las etapas son de años distintos; la pila de 2012 (PostgreSQL) y</tspan></text><text x="470" y="517.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la de 2018 (Cassandra y TAO) no son simultáneas.</tspan></text><text x="470" y="564.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Engineering at Meta, copia archivada del blog de Instagram Engineering e InfoQ (consulta 2026-11-23). Esquema del autor.</tspan></text></svg>
