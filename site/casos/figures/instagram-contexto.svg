<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Instagram dentro de la familia de aplicaciones de Meta</title><desc id="d">Diagrama de contexto: personas y creadores usan Instagram para fotos, vídeo, mensajes y compras; los anunciantes pagan por alcanzarlos a través de la plataforma publicitaria de Meta; Instagram comparte infraestructura y personas con Meta, desde el centro de datos hasta el sistema de anuncios, y compite con otras aplicaciones de vídeo y de redes sociales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Instagram dentro de la familia de aplicaciones de Meta</tspan></text><rect x="24" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="131" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">Personas y creadores:</tspan></text><text x="131" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">Feed, Stories, Reels, Live</tspan></text><text x="131" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">y mensajes</tspan></text><rect x="250" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Negocios: descubrimiento y</tspan></text><text x="357" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">compras desde la</tspan></text><text x="357" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">aplicación</tspan></text><rect x="476" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="583" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">Anunciantes: pagan por</tspan></text><text x="583" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">alcance mediante la</tspan></text><text x="583" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">plataforma de Meta</tspan></text><rect x="702" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="809" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">Meta: infraestructura,</tspan></text><text x="809" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">personal y sistema de</tspan></text><text x="809" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">anuncios comunes</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="221.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Instagram: producto de Meta desde agosto</tspan></text><text x="470" y="239.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">de 2012</tspan></text><polyline points="131,125 334.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">usan</tspan></text><polyline points="357,125 424.8,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">venden</tspan></text><polyline points="583,125 515.2,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">pagan</tspan></text><polyline points="809,125 605.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">aloja</tspan></text><rect x="24" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="131" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">Tiendas de aplicaciones:</tspan></text><text x="131" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">distribución en iOS y</tspan></text><text x="131" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">Android</tspan></text><rect x="250" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Threads: aplicación</tspan></text><text x="357" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">hermana que reutiliza el</tspan></text><text x="357" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">grafo social</tspan></text><rect x="476" y="345" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="583" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="583" dy="0">Reguladores y menores:</tspan></text><text x="583" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="583" dy="0">seguridad, privacidad,</tspan></text><text x="583" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="583" dy="0">competencia</tspan></text><rect x="702" y="345" width="214" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="809" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="809" dy="0">Competidores: otras redes</tspan></text><text x="809" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="809" dy="0">de vídeo y mensajería</tspan></text><polyline points="334.4,259 131,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">distribuyen</tspan></text><polyline points="424.8,259 357,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">comparte</tspan></text><polyline points="515.2,259 583,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">exigen</tspan></text><polyline points="605.6,259 809,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">disputan</tspan></text><rect x="10" y="439" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: el 10-K de Meta describe Instagram como lugar donde personas y creadores se conectan mediante fotos, vídeo y</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mensajes, con Feed, Stories, Reels, Live y mensajería, y agrupa sus cifras de usuarios y de ingresos en la familia de</tspan></text><text x="470" y="497.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aplicaciones. Dónde deja de valer: Meta no publica ingresos ni usuarios de Instagram por separado.</tspan></text><text x="470" y="544.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Meta Platforms del año 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
