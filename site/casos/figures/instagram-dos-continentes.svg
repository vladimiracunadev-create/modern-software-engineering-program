<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Partir Instagram entre Estados Unidos y Europa</title><desc id="d">Esquema de la partición por continentes: el nivel web sin estado en Django; Cassandra partida con la herramienta Akkio para que los datos de cada usuario estén cerca; TAO con un maestro local en Europa; y un 20 por ciento de holgura en cada región para absorber la caída de un centro de datos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Partir Instagram entre Estados Unidos y Europa</tspan></text><rect x="137" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="244" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">Django sin estado delante</tspan></text><text x="244" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">de los datos</tspan></text><rect x="363" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Cassandra: datos del</tspan></text><text x="470" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">usuario en su continente</tspan></text><text x="470" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">con Akkio</tspan></text><rect x="589" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="696" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="696" dy="0">TAO: grafo social con un</tspan></text><text x="696" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="696" dy="0">maestro local en cada</tspan></text><text x="696" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="696" dy="0">región</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="221.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Instagram en dos continentes (charla de</tspan></text><text x="470" y="239.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">LISA 2018)</tspan></text><polyline points="244,125 379.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">atiende</tspan></text><polyline points="470,125 470,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">parte</tspan></text><polyline points="696,125 560.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="696" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">escribe local</tspan></text><rect x="137" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">Hash social: enruta a los</tspan></text><text x="244" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">cubos correctos</tspan></text><rect x="363" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Holgura de 20 % por centro</tspan></text><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">de datos</tspan></text><rect x="589" y="345" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="696" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="696" dy="0">Sin recuperación entre</tspan></text><text x="696" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="696" dy="0">océanos: latencia y datos</tspan></text><text x="696" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="696" dy="0">distintos</tspan></text><polyline points="379.6,259 244,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">enruta</tspan></text><polyline points="470,259 470,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">reserva</tspan></text><polyline points="560.4,259 696,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="696" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">límite</tspan></text><rect x="10" y="439" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado por InfoQ a partir de la charla de LISA 2018: Instagram pasó de AWS a los centros de datos de Facebook, tuvo</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que repartirse entre EE. UU. y Europa por espacio de almacenamiento, y rediseñó la recuperación ante desastres. Dónde deja</tspan></text><text x="470" y="497.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de valer: es una charla de 2018 resumida por una fuente secundaria.</tspan></text><text x="470" y="544.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: InfoQ, «Splitting Stateful Services across Continents at Instagram» (29 de noviembre de 2018).</tspan></text></svg>
