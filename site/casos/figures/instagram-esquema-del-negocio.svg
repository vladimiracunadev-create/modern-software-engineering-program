<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se monetiza Instagram: dentro de la publicidad de Meta</title><desc id="d">Flujo del negocio: personas y creadores aportan atención; Instagram la entrega a la plataforma de anuncios de Meta; los anunciantes pagan por impresiones; el ingreso se registra en la familia de aplicaciones y se reinvierte en infraestructura y en investigación; en 2012 Instagram aún no tenía ingresos directos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="14" width="202" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="111" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">2012: Instagram aún no</tspan></text><text x="111" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="111" dy="0">genera ingresos directos</tspan></text><rect x="256" y="14" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Personas y creadores</tspan></text><text x="357" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">aportan atención</tspan></text><polyline points="212,56 256,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="603" y="43" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="603" dy="0">Meta vende anuncios en</tspan></text><text x="603" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="603" dy="0">la familia de</tspan></text><text x="603" y="76.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="603" dy="0">aplicaciones</tspan></text><polyline points="458,56 502,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">Publicidad: 196 175</tspan></text><text x="849" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">millones de USD en 2025</tspan></text><polyline points="704,56 748,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="202" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="111" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="111" dy="0">Coste de ingresos: 18 %</tspan></text><rect x="256" y="138" width="202" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="357" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="357" dy="0">Investigación y</tspan></text><text x="357" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="357" dy="0">desarrollo: 29 %</tspan></text><polyline points="212,180 256,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="138" width="202" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="603" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="603" dy="0">Marketing, ventas y</tspan></text><text x="603" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="603" dy="0">administración: 12 %</tspan></text><polyline points="458,180 502,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="138" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">Resultado operativo: 41</tspan></text><text x="849" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">%</tspan></text><polyline points="704,180 748,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="849,98 849,118 111,118 111,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado: el 10-K de 2012 dice que Facebook no obtenía ingresos directos de Instagram; el de 2025 agrupa los ingresos en la</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">familia de aplicaciones. Inferido: que hoy Instagram genera una parte sustancial de la publicidad de Meta; Meta no lo</tspan></text><text x="480" y="294.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">cuantifica.</tspan></text><text x="480" y="335.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuente: 10-K de Meta Platforms del año 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
