<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Fragmentos lógicos sobre pocos servidores físicos</title><desc id="d">Dos filas: varios miles de fragmentos lógicos son esquemas de PostgreSQL asignados en código a pocos servidores físicos; al crecer, se mueven conjuntos de fragmentos lógicos a más servidores sin reubicar datos; cada tabla del fragmento genera sus propios identificadores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="14" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="152" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">Varios miles de fragmentos lógicos</tspan></text><text x="152" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="152" dy="0">(esquemas)</tspan></text><rect x="338" y="14" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="480" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">Asignados en código a pocos</tspan></text><text x="480" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="480" dy="0">servidores físicos</tspan></text><polyline points="294,56 338,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="14" width="284" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="808" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">Crecer: mover conjuntos de esquemas</tspan></text><text x="808" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="808" dy="0">a más servidores</tspan></text><polyline points="622,56 666,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="152" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">Cada tabla genera sus</tspan></text><text x="152" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="152" dy="0">identificadores con PL/pgSQL</tspan></text><rect x="338" y="138" width="284" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="480" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">El identificador lleva el fragmento</tspan></text><text x="480" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">dentro</tspan></text><polyline points="294,180 338,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="666" y="138" width="284" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="808" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">Sin reubicar datos ni nuevas piezas</tspan></text><text x="808" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="808" dy="0">móviles</tspan></text><polyline points="622,180 666,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="808,98 808,118 152,118 152,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado en el post de 2012: el criterio era tener pocas piezas móviles, porque el equipo escalaba Instagram con muy pocos</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">ingenieros. Dónde deja de valer: la clave de partición del ejemplo era el identificador de usuario; otras tablas pueden usar</tspan></text><text x="480" y="294.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">otras.</tspan></text><text x="480" y="335.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuente: «Sharding &amp; IDs at Instagram» (copia archivada de 2012).</tspan></text></svg>
