<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 576" width="940" height="576" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: lo que existía, lo que falló y lo que debió existir</title><desc id="d">Tres columnas: mecanismos que existían en Knight (controles en la entrada de órdenes, tope de precio del 9,5 por ciento, límite de la cuenta 33, apagado de algunas estrategias, PMON), mecanismos que fallaron o faltaron (revisión de despliegue, control de salida, parada propia, capital en línea, alerta, guion) y mecanismos que debieron existir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="576" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: lo que existía, lo que falló y lo que debió existir</tspan></text><rect x="10" y="51" width="296" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="158" dy="0">Existían (documentado)</tspan></text><rect x="10" y="103" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="120" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Controles contra órdenes erróneas en</tspan></text><text x="158" y="136.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">la interfaz, el gestor y la ejecución</tspan></text><text x="158" y="153.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">interna</tspan></text><rect x="10" y="171" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Tope de precio del 9,5 % en órdenes</tspan></text><text x="158" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">madre de sesión</tspan></text><rect x="10" y="239" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Límite bruto de 2 M en la cuenta 33</tspan></text><rect x="10" y="307" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="332.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Apagado automático de ciertas</tspan></text><text x="158" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">estrategias por pérdidas</tspan></text><rect x="10" y="375" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="408.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">PMON: monitor posterior de posiciones</tspan></text><rect x="316" y="51" width="296" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="464" dy="0">Fallaron o faltaban (documentado)</tspan></text><rect x="316" y="103" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="128.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Revisión de segunda persona del</tspan></text><text x="464" y="144.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">despliegue</tspan></text><rect x="316" y="171" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Control de salida de SMARS y parada</tspan></text><text x="464" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">ante actividad anómala</tspan></text><rect x="316" y="239" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="264.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Capital agregado enlazado al envío de</tspan></text><text x="464" y="280.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">órdenes</tspan></text><rect x="316" y="307" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="340.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Alerta sobre los 97 correos</tspan></text><rect x="316" y="375" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="400.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Guion de incidente y desconexión del</tspan></text><text x="464" y="416.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">mercado</tspan></text><rect x="622" y="51" width="296" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="770" dy="0">Debieron existir (análisis propio)</tspan></text><rect x="622" y="103" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="128.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Despliegue automatizado y verificado</tspan></text><text x="770" y="144.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">por nodo</tspan></text><rect x="622" y="171" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Puerta independiente antes de las</tspan></text><text x="770" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">bolsas</tspan></text><rect x="622" y="239" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Interruptor de parada con dueño</tspan></text><rect x="622" y="307" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="340.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Alertas con responsable</tspan></text><rect x="622" y="375" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="408.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Retiro o retest del código muerto</tspan></text><rect x="10" y="453" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="477.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la columna del medio no es una lista de fallos de personas, sino de capas que no existían; la de la</tspan></text><text x="470" y="494.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">izquierda muestra que Knight tenía controles reales, pero en la entrada y después de ejecutar. La columna de la derecha es</tspan></text><text x="470" y="511.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">análisis propio.</tspan></text><text x="470" y="558.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694, párr. 19 a 27 y notas 7 y 8; la tercera columna es análisis propio.</tspan></text></svg>
