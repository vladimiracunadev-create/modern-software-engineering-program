<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 592" width="940" height="592" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: qué tuvo que coincidir para perder más de 460 millones</title><desc id="d">Árbol de fallas con el evento principal arriba, la pérdida de capital, que requiere dos ramas a la vez: que se enviaran órdenes erróneas y que nada las detuviera. La primera rama combina despliegue incompleto, código muerto invocable e indicador reutilizado, y la segunda cinco barreras que faltaron.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="592" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: qué tuvo que coincidir para perder más de 460 millones</tspan></text><rect x="340" y="51" width="260" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="72.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Pérdida de más de 460 M de</tspan></text><text x="470" y="88.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">dólares</tspan></text><circle cx="470" cy="127" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="132" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><polyline points="470,103 470,115" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="120" y="151" width="280" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="260" y="172.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="260" dy="0">A. SMARS envía órdenes que nadie</tspan></text><text x="260" y="188.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="260" dy="0">pidió</tspan></text><rect x="540" y="151" width="330" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="180.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="705" dy="0">B. Nada lo limita ni lo detiene a tiempo</tspan></text><line x1="470" y1="139" x2="260" y2="151" stroke="#8a9aa3" stroke-width="1.4"/><line x1="470" y1="139" x2="705" y2="151" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="260" cy="227" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="260" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="260" dy="0">Y</tspan></text><line x1="260" y1="203" x2="260" y2="215" stroke="#8a9aa3" stroke-width="1.4"/><rect x="20" y="261" width="140" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="90" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="90" dy="0">A1. Servidor sin</tspan></text><text x="90" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="90" dy="0">código nuevo</tspan></text><line x1="260" y1="239" x2="90" y2="261" stroke="#8a9aa3" stroke-width="1.4"/><rect x="170" y="261" width="140" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="240" y="285" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">A2. Power Peg</tspan></text><text x="240" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">invocable desde</tspan></text><text x="240" y="318.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">2003</tspan></text><line x1="260" y1="239" x2="240" y2="261" stroke="#8a9aa3" stroke-width="1.4"/><rect x="320" y="261" width="140" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="390" y="285" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">A3. Indicador</tspan></text><text x="390" y="301.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">con dos</tspan></text><text x="390" y="318.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">significados</tspan></text><line x1="260" y1="239" x2="390" y2="261" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="705" cy="227" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="705" y="232" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="705" dy="0">O</tspan></text><line x1="705" y1="203" x2="705" y2="215" stroke="#8a9aa3" stroke-width="1.4"/><line x1="705" y1="239" x2="705" y2="363" stroke="#8a9aa3" stroke-width="1.4"/><line x1="105" y1="363" x2="825" y2="363" stroke="#8a9aa3" stroke-width="1.4"/><rect x="20" y="381" width="170" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="105" y="411.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="105" dy="0">B1. Sin control de</tspan></text><text x="105" y="427.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="105" dy="0">salida en SMARS</tspan></text><line x1="105" y1="363" x2="105" y2="381" stroke="#8a9aa3" stroke-width="1.4"/><rect x="204" y="381" width="170" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="289" y="411.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="289" dy="0">B2. Sin límite de</tspan></text><text x="289" y="427.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="289" dy="0">capital que bloquee</tspan></text><line x1="289" y1="363" x2="289" y2="381" stroke="#8a9aa3" stroke-width="1.4"/><rect x="388" y="381" width="170" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="473" y="411.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="473" dy="0">B3. Alerta no</tspan></text><text x="473" y="427.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="473" dy="0">atendida</tspan></text><line x1="473" y1="363" x2="473" y2="381" stroke="#8a9aa3" stroke-width="1.4"/><rect x="572" y="381" width="170" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="657" y="411.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="657" dy="0">B4. Monitoreo humano</tspan></text><text x="657" y="427.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="657" dy="0">tardío</tspan></text><line x1="657" y1="363" x2="657" y2="381" stroke="#8a9aa3" stroke-width="1.4"/><rect x="756" y="381" width="170" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="841" y="411.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="841" dy="0">B5. Reversión sin</tspan></text><text x="841" y="427.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="841" dy="0">guion empeora</tspan></text><line x1="841" y1="363" x2="841" y2="381" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="469" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="493.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: «Y» exige que ocurran todas las ramas; «O» que baste una. Aquí A necesita tres condiciones a la vez, pero B</tspan></text><text x="470" y="510.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se activa con la ausencia de cualquiera de cinco barreras: por eso hay tantas formas de cortar el árbol. Cortar A1 habría</tspan></text><text x="470" y="527.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">evitado el incidente; cortar B1 o B2 lo habría acotado.</tspan></text><text x="470" y="574.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en el informe de la SEC; no es una conclusión del regulador. La estructura lógica es nuestra; los hechos de cada hoja son de la SEC.</tspan></text></svg>
