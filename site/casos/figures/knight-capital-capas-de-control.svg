<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 466" width="940" height="466" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cadena de la orden dentro de Knight: dónde había control y dónde no</title><desc id="d">Cadena horizontal de cinco etapas por las que pasa una orden: interfaz de cliente, gestor interno de órdenes, ejecución interna, router SMARS y bolsa; las tres primeras llevan control contra órdenes erróneas, SMARS no controla su propia salida, y debajo la capa de monitoreo posterior PMON y la cuenta 33 observan sin poder bloquear.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="466" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cadena de la orden dentro de Knight: dónde había control y dónde no</tspan></text><rect x="10" y="53" width="160" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="90" y="96.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="90" dy="0">Interfaz de cliente</tspan></text><rect x="10" y="153" width="160" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="90" y="183.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">control de entrada</tspan></text><text x="90" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="90" dy="0">de órdenes erróneas</tspan></text><polyline points="90,133 90,153" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="170,93 198,93" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="198" y="53" width="160" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="278" y="88.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="278" dy="0">Gestor interno de</tspan></text><text x="278" y="104.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="278" dy="0">órdenes</tspan></text><rect x="198" y="153" width="160" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="278" y="183.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="278" dy="0">control de entrada</tspan></text><text x="278" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="278" dy="0">de órdenes erróneas</tspan></text><polyline points="278,133 278,153" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="358,93 386,93" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="386" y="53" width="160" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="466" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="466" dy="0">Ejecución interna</tspan></text><text x="466" y="96.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="466" dy="0">de órdenes de</tspan></text><text x="466" y="113.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="466" dy="0">clientes</tspan></text><rect x="386" y="153" width="160" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="466" y="183.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="466" dy="0">control de entrada</tspan></text><text x="466" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="466" dy="0">de órdenes erróneas</tspan></text><polyline points="466,133 466,153" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="546,93 574,93" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="574" y="53" width="160" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="654" y="80" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="654" dy="0">SMARS: router</tspan></text><text x="654" y="96.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="654" dy="0">(órdenes madre →</tspan></text><text x="654" y="113.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="654" dy="0">hijas)</tspan></text><rect x="574" y="153" width="160" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="654" y="175" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="654" dy="0">sin control de</tspan></text><text x="654" y="191.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="654" dy="0">salida ni parada</tspan></text><text x="654" y="208.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="654" dy="0">propia</tspan></text><polyline points="654,133 654,153" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="734,93 762,93" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="762" y="53" width="160" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="842" y="88.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">Bolsas y centros de</tspan></text><text x="842" y="104.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="842" dy="0">negociación</tspan></text><rect x="762" y="153" width="160" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="842" y="183.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="842" dy="0">validaciones del</tspan></text><text x="842" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="842" dy="0">propio mercado</tspan></text><polyline points="842,133 842,153" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="14" y="253" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Después de ejecutar (no está en la ruta de salida):</tspan></text><rect x="10" y="267" width="300" height="72" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="160" y="290" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">PMON: monitor de posiciones; depende</tspan></text><text x="160" y="306.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">de una persona, sin alertas</tspan></text><text x="160" y="323.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="160" dy="0">automáticas</tspan></text><rect x="330" y="267" width="300" height="72" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="298.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Cuenta 33: límite bruto de 2 millones</tspan></text><text x="480" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">sin enlace a controles automáticos</tspan></text><rect x="650" y="267" width="280" height="72" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="790" y="298.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">Correos «Power Peg disabled»: no</tspan></text><text x="790" y="314.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">eran alertas</tspan></text><polyline points="560,267 620,223" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><rect x="10" y="359" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: los controles de Knight estaban donde las órdenes entraban y donde se medían las posiciones, no en el único</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">punto por el que todo lo erróneo salía al mercado. La SEC exige un control inmediatamente antes de enviar al mercado.</tspan></text><text x="470" y="448.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafos 20 a 25, 38.</tspan></text></svg>
