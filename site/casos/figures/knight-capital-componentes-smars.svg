<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 446" width="940" height="446" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dentro de SMARS: qué hacía cada pieza y cuál se había quedado sin su freno</title><desc id="d">Diagrama de componentes de SMARS: recepción de órdenes madre, selector de funcionalidad por indicador, código nuevo del RLP, código antiguo Power Peg, función de cantidad acumulada movida en 2005, emisor de órdenes hijas y receptor de ejecuciones. El indicador activa Power Peg en el servidor sin el código nuevo y la cantidad acumulada ya no frena el emisor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="446" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dentro de SMARS: qué hacía cada pieza y cuál se había quedado sin su freno</tspan></text><rect x="10" y="51" width="920" height="270" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Un servidor SMARS (modelo funcional construido con lo que describe la SEC)</tspan></text><rect x="30" y="101" width="160" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="131.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="110" dy="0">Recepción de</tspan></text><text x="110" y="147.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="110" dy="0">órdenes madre</tspan></text><rect x="230" y="101" width="170" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="315" y="123" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="315" dy="0">Selector por</tspan></text><text x="315" y="139.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="315" dy="0">indicador (flag</tspan></text><text x="315" y="156.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="315" dy="0">reutilizado)</tspan></text><rect x="450" y="91" width="200" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="550" y="114.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="550" dy="0">Código RLP nuevo (7</tspan></text><text x="550" y="130.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="550" dy="0">servidores)</tspan></text><rect x="450" y="159" width="200" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="550" y="182.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="550" dy="0">Código Power Peg de 2003</tspan></text><text x="550" y="198.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="550" dy="0">(8.º servidor)</tspan></text><rect x="700" y="101" width="200" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="800" y="131.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="800" dy="0">Emisor de órdenes hijas</tspan></text><text x="800" y="147.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="800" dy="0">hacia los centros</tspan></text><rect x="450" y="241" width="200" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="550" y="258" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">Cantidad acumulada</tspan></text><text x="550" y="274.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">(movida en 2005, sin</tspan></text><text x="550" y="291.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="550" dy="0">retest)</tspan></text><rect x="700" y="241" width="200" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="800" y="266.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">Receptor de ejecuciones</tspan></text><text x="800" y="282.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="800" dy="0">de los centros</tspan></text><polyline points="190,136 230,136" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="400,121 450,119" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="425" y="107" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="425" dy="0">sí</tspan></text><polyline points="400,151 450,187" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="412" y="179" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="412" dy="0">sí</tspan></text><polyline points="650,119 700,129" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="650,187 700,151" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><polyline points="800,241 800,171" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="836" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="836" dy="0">relleno</tspan></text><polyline points="700,271 650,271" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="550,241 550,215" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><text x="600" y="231" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">ya no frena</tspan></text><rect x="10" y="339" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: la parada de Power Peg dependía de una función interna, no de un invariante del router. Al moverla de sitio</tspan></text><text x="470" y="380.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">sin repetir pruebas, el emisor quedó sin freno; el selector por indicador decidía en cada servidor qué código despertaba.</tspan></text><text x="470" y="428.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafos 12 a 16. Esquema funcional propio; la orden no publica el diseño interno.</tspan></text></svg>
