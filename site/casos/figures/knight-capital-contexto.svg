<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde estaba Knight: entre los clientes y las bolsas</title><desc id="d">Diagrama de contexto: brokers y clientes institucionales envían órdenes a Knight; dentro de Knight el router SMARS divide cada orden madre en órdenes hijas y las envía a las bolsas y otros centros de negociación. Knight representaba cerca del diez por ciento de la negociación de acciones cotizadas en Estados Unidos y SMARS cerca del uno por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde estaba Knight: entre los clientes y las bolsas</tspan></text><rect x="10" y="59" width="210" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="91" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115" dy="0">Brokers y clientes</tspan></text><text x="115" y="107.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115" dy="0">(minoristas e</tspan></text><text x="115" y="124.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="115" dy="0">institucionales)</tspan></text><rect x="270" y="49" width="400" height="190" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="284" y="71" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="284" dy="0">Knight Capital Americas (Jersey City)</tspan></text><rect x="290" y="85" width="170" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="375" y="108.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="375" dy="0">Interfaz de cliente</tspan></text><text x="375" y="124.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="375" dy="0">y gestor de órdenes</tspan></text><rect x="480" y="85" width="170" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="565" y="108.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="565" dy="0">SMARS: router</tspan></text><text x="565" y="124.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="565" dy="0">algorítmico</tspan></text><rect x="290" y="161" width="170" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="375" y="176" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="375" dy="0">PMON: monitor de</tspan></text><text x="375" y="192.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="375" dy="0">posiciones (después</tspan></text><text x="375" y="209.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="375" dy="0">de ejecutar)</tspan></text><rect x="480" y="161" width="170" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="565" y="176" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="565" dy="0">Cuenta 33</tspan></text><text x="565" y="192.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="565" dy="0">(posiciones sin</tspan></text><text x="565" y="209.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="565" dy="0">casar)</tspan></text><rect x="720" y="59" width="210" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="825" y="99.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="825" dy="0">NYSE, Nasdaq y otros</tspan></text><text x="825" y="115.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="825" dy="0">centros de negociación</tspan></text><polyline points="220,104 270,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="89" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">órdenes</tspan></text><polyline points="670,113 720,113" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="695" y="99" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="695" dy="0">hijas</tspan></text><polyline points="720,133 670,133" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="695" y="163" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="695" dy="0">ejecuciones</tspan></text><rect x="10" y="169" width="250" height="92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="135" y="193.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="135" dy="0">Knight ≈ 10 % de toda la</tspan></text><text x="135" y="210.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="135" dy="0">negociación de acciones</tspan></text><text x="135" y="226.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="135" dy="0">cotizadas en EE. UU.; SMARS ≈ 1</tspan></text><text x="135" y="243.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="135" dy="0">% o más</tspan></text><rect x="10" y="277" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el router era un componente interno entre la entrada de órdenes y el mercado. Un error ahí sale directamente</tspan></text><text x="470" y="318.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">al exterior, sin que ningún control posterior lo retenga. Los controles previos (interfaz, gestor de órdenes) protegían la</tspan></text><text x="470" y="335.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entrada, no la salida de SMARS.</tspan></text><text x="470" y="382.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafos 11, 12 y 20. Participaciones de 2011 y 2012.</tspan></text></svg>
