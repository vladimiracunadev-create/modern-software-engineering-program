<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 556" width="940" height="556" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware y software de SMARS: lo que se sabe y lo que no es público</title><desc id="d">Pila de seis capas del sistema de enrutamiento de Knight, desde el despliegue hasta los centros de datos: solo dos están documentadas, el router SMARS con sus ocho servidores y el despliegue manual con código de 2003 y de 2012; el lenguaje, el sistema operativo, el middleware, el modelo de servidores, la red y los centros de datos no constan en las fuentes públicas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="556" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware y software de SMARS: lo que se sabe y lo que no es público</tspan></text><rect x="10" y="51" width="640" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="73.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">Despliegue: un técnico copia el código servidor a servidor, sin revisión</tspan></text><text x="330" y="89.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">(documentado)</tspan></text><rect x="670" y="51" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="81.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">SEC, párr. 15 y 26</tspan></text><rect x="10" y="113" width="640" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="135.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">Aplicación: router SMARS algorítmico; código Power Peg de 2003 y RLP de 2012</tspan></text><text x="330" y="151.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">(documentado)</tspan></text><rect x="670" y="113" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="143.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">SEC, párr. 12 a 14</tspan></text><rect x="10" y="175" width="640" height="54" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="330" y="205.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="330" dy="0">Lenguaje, framework y middleware (no se sabe)</tspan></text><rect x="670" y="175" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="205.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">no consta</tspan></text><rect x="10" y="237" width="640" height="54" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="330" y="267.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="330" dy="0">Sistema operativo y base de datos (no se sabe)</tspan></text><rect x="670" y="237" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="267.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">no consta</tspan></text><rect x="10" y="299" width="640" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="330" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="330" dy="0">Servidores: ocho en SMARS; modelo y capacidad (no se sabe)</tspan></text><rect x="670" y="299" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">SEC, párr. 15; resto no consta</tspan></text><rect x="10" y="361" width="640" height="54" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="330" y="383.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="330" dy="0">Red y centros de datos: «instalaciones de negociación y de datos alternativas»;</tspan></text><text x="330" y="399.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="330" dy="0">ubicación y topología (no se sabe)</tspan></text><rect x="670" y="361" width="250" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="391.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">10-K, Item 1; resto no consta</tspan></text><rect x="10" y="433" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="457.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: de la pila técnica solo el despliegue y la aplicación están descritos. Para el caso no hace falta más: el</tspan></text><text x="470" y="474.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fallo fue de proceso y de lógica, no de un componente de hardware. Aquí no se inventa ninguna marca, lenguaje ni sistema</tspan></text><text x="470" y="491.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">operativo.</tspan></text><text x="470" y="538.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: SEC, Release No. 34-70694 y el 10-K de 2012. Verde: documentado; dorado: en parte; gris: no se sabe.</tspan></text></svg>
