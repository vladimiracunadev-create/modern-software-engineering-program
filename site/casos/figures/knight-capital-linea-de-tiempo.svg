<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">1 de agosto de 2012: de los correos de las 8:01 al final de los 45 minutos</title><desc id="d">Línea de tiempo en minutos desde las 8:00 de la mañana hora de Nueva York: a las 8:01 empiezan 97 correos automáticos con el texto Power Peg disabled; a las 9:30 abre el mercado y comienzan los 45 minutos aproximados de ejecuciones erróneas; el final exacto no consta en la orden de la SEC.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">1 de agosto de 2012: de los correos de las 8:01 al final de los 45 minutos</tspan></text><line x1="274" y1="83" x2="274" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="233" x2="274" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="401.6" y1="83" x2="401.6" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="401.6" y1="233" x2="401.6" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="401.6" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="401.6" dy="0">30</tspan></text><line x1="529.2" y1="83" x2="529.2" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="529.2" y1="233" x2="529.2" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="529.2" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="529.2" dy="0">60</tspan></text><line x1="656.8" y1="83" x2="656.8" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="656.8" y1="233" x2="656.8" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="656.8" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="656.8" dy="0">90</tspan></text><line x1="784.4" y1="83" x2="784.4" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="784.4" y1="233" x2="784.4" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="784.4" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784.4" dy="0">120</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">150</tspan></text><line x1="274" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Correos BNET «Power Peg disabled»</tspan></text><text x="264" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Ejecuciones erróneas de SMARS</tspan></text><text x="264" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Contención (hora no documentada)</tspan></text><line x1="656.8" y1="75" x2="656.8" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="656.8" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="656.8" dy="0">9:30 apertura</tspan></text><rect x="278.253" y="92" width="378.547" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="467.527" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="467.527" dy="0">97 correos sin revisar</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="656.8" y="142" width="191.4" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="752.5" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752.5" dy="0">≈ 45 min</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="656.8" y="192" width="191.4" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="752.5" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="752.5" dy="0">retiran el RLP</tspan></text><text x="593" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">Minutos desde las 8:00 (hora de la costa este de EE. UU.)</tspan></text><rect x="10" y="291" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El final de la barra roja (≈ 135 min) es 9:30 más los «aproximadamente 45 minutos» de la SEC: la hora exacta de la parada</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no figura en la orden. Los correos de las 8:01 fueron la ocasión documentada de detectar el despliegue defectuoso antes de</tspan></text><text x="470" y="349.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">abrir. Un aviso que nadie lee no es una alerta.</tspan></text><text x="470" y="396.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafos 1, 17, 19 y 27.</tspan></text></svg>
