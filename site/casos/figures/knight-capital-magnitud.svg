<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La exposición fue de miles de millones; la pérdida realizada, de cientos</title><desc id="d">Barras horizontales en millones de dólares: posición larga neta de unos 3 500 en 80 acciones, posición corta neta de unos 3 150 en 74 acciones y pérdida realizada de más de 460 millones tras liquidar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La exposición fue de miles de millones; la pérdida realizada, de cientos</tspan></text><line x1="294" y1="49" x2="294" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="163" x2="294" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">0</tspan></text><line x1="439.425" y1="49" x2="439.425" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="439.425" y1="163" x2="439.425" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="439.425" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="439.425" dy="0">1 000</tspan></text><line x1="584.85" y1="49" x2="584.85" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="584.85" y1="163" x2="584.85" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="584.85" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="584.85" dy="0">2 000</tspan></text><line x1="730.275" y1="49" x2="730.275" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="730.275" y1="163" x2="730.275" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="730.275" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730.275" dy="0">3 000</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="163" x2="875.7" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">4 000</tspan></text><line x1="294" y1="163" x2="875.7" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Posición larga neta (80 acciones)</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Posición corta neta (74 acciones)</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Pérdida realizada</tspan></text><rect x="294" y="55" width="508.988" height="26" rx="3" fill="#c0432f"/><text x="809.988" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="809.988" dy="0">3 500</tspan></text><rect x="294" y="93" width="458.089" height="26" rx="3" fill="#c0432f"/><text x="759.089" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="759.089" dy="0">3 150</tspan></text><rect x="294" y="131" width="66.8955" height="26" rx="3" fill="#c0432f"/><text x="367.896" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="367.896" dy="0">460</tspan></text><text x="584.85" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="584.85" dy="0">Millones de dólares de EE. UU. (cifras aproximadas de la SEC)</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Knight acumuló posiciones que no quería por unos 6 650 millones brutos y las liquidó con una pérdida de más de 460</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">millones. La diferencia entre exposición y pérdida (inferencia: lo comprado y lo vendido se compensó en gran parte al</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">liquidar) no tranquiliza: el capital de la firma no soportaba la diferencia: la SEC habla de problemas de capital neto.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). La suma 3 500 + 3 150 es aritmética propia.</tspan></text></svg>
