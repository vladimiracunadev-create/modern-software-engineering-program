<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 424" width="940" height="424" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Modelo de datos: la orden madre, sus hijas y la cuenta que acumuló lo que nadie casaba</title><desc id="d">Esquema de datos: una orden madre con cantidad y bandera genera muchas órdenes hijas; cada ejecución vuelve y se imputa a la madre en el gestor de órdenes; las ejecuciones que no se pueden casar con la cantidad pendiente de una madre caen en la cuenta 33, que PMON muestra sin los límites.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="424" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Modelo de datos: la orden madre, sus hijas y la cuenta que acumuló lo que nadie casaba</tspan></text><rect x="10" y="51" width="220" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="120" y="79.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">Orden madre: valor,</tspan></text><text x="120" y="96.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">cantidad, precio límite,</tspan></text><text x="120" y="112.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">bandera; ya estaba</tspan></text><text x="120" y="129.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120" dy="0">completada en el gestor</tspan></text><rect x="300" y="51" width="220" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="410" y="79.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">Orden hija: porción enviada</tspan></text><text x="410" y="96.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">a un centro; en el servidor</tspan></text><text x="410" y="112.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">8, sin tope de cantidad</tspan></text><text x="410" y="129.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="410" dy="0">total</tspan></text><rect x="600" y="51" width="150" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="675" y="79.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675" dy="0">Ejecución</tspan></text><text x="675" y="96.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675" dy="0">(relleno)</tspan></text><text x="675" y="112.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675" dy="0">devuelta por el</tspan></text><text x="675" y="129.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675" dy="0">centro</tspan></text><rect x="790" y="51" width="140" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="860" y="79.68" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="860" dy="0">Cuenta 33: lo</tspan></text><text x="860" y="96.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="860" dy="0">que no casa;</tspan></text><text x="860" y="112.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="860" dy="0">tope bruto de 2</tspan></text><text x="860" y="129.6" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="860" dy="0">M</tspan></text><polyline points="230,101 300,101" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="265" y="89" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="265" dy="0">1 a N</tspan></text><polyline points="520,101 600,101" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="89" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">1 a N</tspan></text><polyline points="750,101 790,101" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="201" width="330" height="78" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="175" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="175" dy="0">Gestor de órdenes: sabe que la madre está</tspan></text><text x="175" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="175" dy="0">completa, pero no se lo dice a SMARS</tspan></text><rect x="400" y="201" width="250" height="78" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="525" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">PMON: muestra posiciones, no</tspan></text><text x="525" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">muestra los límites; con</tspan></text><text x="525" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="525" dy="0">retardo y cifras inexactas</tspan></text><rect x="700" y="201" width="230" height="78" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="815" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">Límite de 2 M sin enlace a</tspan></text><text x="815" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">capital agregado</tspan></text><polyline points="120,151 120,201" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="860,151 860,201" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="790,131 650,221" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="301" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="325.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el dato correcto («la madre está completa») existía en el sistema, pero en un lugar que no tenía permiso</tspan></text><text x="470" y="342.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">para frenar al router. Un dato que no viaja al punto de decisión no protege. La cuenta 33 mezclaba orígenes: por eso el</tspan></text><text x="470" y="359.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">personal tardó en identificar la fuente.</tspan></text><text x="470" y="406.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafos 16, 23 a 25. Los nombres de campos son descriptivos, no los del sistema real.</tspan></text></svg>
