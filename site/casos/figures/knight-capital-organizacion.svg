<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Organización de Knight en 2012: estructura pública de alto nivel</title><desc id="d">Esquema de organización: el consejo de Knight Capital Group con cuatro comités, el consejero delegado y presidente del consejo, la filial Knight Capital Americas que era el bróker-dealer, cuatro segmentos de negocio, y la plantilla de 1 524 empleados, 1 361 en EE. UU. y 163 fuera, sobre todo en Londres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Organización de Knight en 2012: estructura pública de alto nivel</tspan></text><rect x="10" y="51" width="910" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="465" y="74.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465" dy="0">Consejo de Knight Capital Group, con cuatro comités: Finanzas y Auditoría, Riesgos, Compensación y Nominaciones y Gobierno</tspan></text><text x="465" y="90.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="465" dy="0">corporativo</tspan></text><rect x="260" y="127" width="410" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="465" y="150.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="465" dy="0">Consejero delegado y presidente del consejo</tspan></text><text x="465" y="166.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="465" dy="0">(comunicado de 2012)</tspan></text><polyline points="465,107 465,131" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="310" y="201" width="310" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="216" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="465" dy="0">Knight Capital Americas LLC: el</tspan></text><text x="465" y="232.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="465" dy="0">bróker-dealer, Jersey City, miembro de</tspan></text><text x="465" y="249.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="465" dy="0">FINRA</tspan></text><polyline points="465,181 465,201" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="287" width="218" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="119" y="320.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="119" dy="0">Creación de mercado</tspan></text><polyline points="465,257 119,287" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="242" y="287" width="218" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="351" y="312.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="351" dy="0">Ventas y negociación</tspan></text><text x="351" y="328.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="351" dy="0">institucional</tspan></text><polyline points="465,257 351,287" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="474" y="287" width="218" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="583" y="320.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="583" dy="0">Ejecución electrónica</tspan></text><polyline points="465,257 583,287" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="706" y="287" width="218" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="815" y="320.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="815" dy="0">Corporativo y otros</tspan></text><polyline points="465,257 815,287" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="371" width="440" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="230" y="397.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="230" dy="0">1 524 empleados a 31 de diciembre de 2012 (1 423 un año</tspan></text><text x="230" y="413.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="230" dy="0">antes)</tspan></text><rect x="480" y="371" width="440" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="405.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">1 361 en EE. UU. y 163 fuera, sobre todo en Londres</tspan></text><rect x="10" y="455" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="479.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el organigrama público llega al consejo, al consejero delegado, a los segmentos y a la filial regulada; no</tspan></text><text x="470" y="496.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">muestra quién respondía de SMARS, de despliegue o de cumplimiento, y eso es lo que importa para el caso. La SEC solo</tspan></text><text x="470" y="513.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">menciona funciones (cumplimiento, grupo de control de supervisión, tecnología) sin organigrama.</tspan></text><text x="470" y="560.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de 2012; comunicado de Knight de 2012; SEC, párr. 11 y 28 a 34.</tspan></text></svg>
