<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias y puntos únicos de fallo de la ruta de salida</title><desc id="d">Mapa de dependencias: el router SMARS es el único camino hacia las bolsas y depende de un indicador, de la versión desplegada en cada servidor y de una función de parada; el monitoreo depende de una persona y de PMON; las alertas dependen de correos que nadie lee. Cada punto único aparece marcado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dependencias y puntos únicos de fallo de la ruta de salida</tspan></text><rect x="380" y="51" width="180" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">Mercado (bolsas)</tspan></text><rect x="380" y="151" width="180" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="179.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">SMARS: único camino</tspan></text><text x="470" y="195.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">de salida</tspan></text><rect x="60" y="151" width="220" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="170" y="179.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="170" dy="0">Indicador reutilizado: dos</tspan></text><text x="170" y="195.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="170" dy="0">significados</tspan></text><rect x="660" y="151" width="240" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="780" y="179.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="780" dy="0">Función de cantidad acumulada:</tspan></text><text x="780" y="195.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="780" dy="0">único freno</tspan></text><rect x="60" y="261" width="220" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="170" y="289.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="170" dy="0">Versión por servidor:</tspan></text><text x="170" y="305.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="170" dy="0">verificada a mano</tspan></text><rect x="380" y="261" width="180" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="289.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Capital: sin enlace a</tspan></text><text x="470" y="305.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la salida</tspan></text><rect x="660" y="261" width="240" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="780" y="297.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="780" dy="0">PMON y una persona mirando</tspan></text><polyline points="470,151 470,111" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="280,184 380,184" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="330" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="330" dy="0">decide</tspan></text><polyline points="660,184 560,184" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="610" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">frena</tspan></text><polyline points="170,261 170,217" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,261 470,217" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="520" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="520" dy="0">no bloquea</tspan></text><polyline points="780,261 780,217" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="830" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">solo observa</tspan></text><rect x="10" y="347" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="371.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: rojo son puntos únicos de fallo con consecuencias directas sobre el mercado; dorado son dependencias de</tspan></text><text x="470" y="388.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">proceso. Había cuatro elementos de los que dependía todo y ninguno tenía respaldo independiente. El mismo diseño con un</tspan></text><text x="470" y="405.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">segundo frenos en la salida habría sido más robusto.</tspan></text><text x="470" y="452.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en el informe de la SEC; no es una conclusión del regulador.</tspan></text></svg>
