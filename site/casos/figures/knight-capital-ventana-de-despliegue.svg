<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del 27 de julio al 1 de agosto de 2012: lo que consta y lo que no se sabe</title><desc id="d">Línea de tiempo en días: el despliegue escalonado del código RLP empieza el 27 de julio y avanza servidor a servidor en días sucesivos; los días exactos de cada servidor no constan; el 1 de agosto empieza el programa de la NYSE y fallan las órdenes en el octavo servidor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Del 27 de julio al 1 de agosto de 2012: lo que consta y lo que no se sabe</tspan></text><line x1="274" y1="83" x2="274" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="233" x2="274" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="380.333" y1="83" x2="380.333" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="380.333" y1="233" x2="380.333" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="380.333" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380.333" dy="0">1</tspan></text><line x1="486.667" y1="83" x2="486.667" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="486.667" y1="233" x2="486.667" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="486.667" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.667" dy="0">2</tspan></text><line x1="593" y1="83" x2="593" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="593" y1="233" x2="593" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="593" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593" dy="0">3</tspan></text><line x1="699.333" y1="83" x2="699.333" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="699.333" y1="233" x2="699.333" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="699.333" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="699.333" dy="0">4</tspan></text><line x1="805.667" y1="83" x2="805.667" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="805.667" y1="233" x2="805.667" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="805.667" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805.667" dy="0">5</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">6</tspan></text><line x1="274" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Despliegue en 7 servidores</tspan></text><text x="264" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Servidor 8</tspan></text><text x="264" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Revisión de segunda persona</tspan></text><line x1="274" y1="75" x2="274" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="274" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="274" dy="0">27 jul: empieza</tspan></text><line x1="805.667" y1="75" x2="805.667" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="805.667" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="805.667" dy="0">1 ago: RLP vivo</tspan></text><rect x="274" y="92" width="531.667" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="539.833" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="539.833" dy="0">días sucesivos sin detallar</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="274" y="142" width="531.667" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="539.833" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="539.833" dy="0">no recibe el código, nadie lo nota</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="274" y="192" width="531.667" height="32" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="539.833" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="539.833" dy="0">no existía el procedimiento</tspan></text><text x="593" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">Días desde el 27 de julio de 2012</tspan></text><rect x="10" y="291" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cuántos servidores se actualizaron cada día no consta en la orden de la SEC. Lo documentado es el inicio, el final, que un</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">técnico omitió el octavo y que no había revisión. La ventana de cinco días era una oportunidad de verificar versión en cada</tspan></text><text x="470" y="349.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">nodo.</tspan></text><text x="470" y="396.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SEC, Release No. 34-70694 (16 de octubre de 2013). Párrafo 15.</tspan></text></svg>
