<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 601" width="940" height="601" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alternativas descartadas: cuatro bifurcaciones y su coste probable (análisis propio)</title><desc id="d">Cuatro filas de decisión con la opción elegida y la alternativa: celdas frente a un sistema monolítico; logística propia frente a transportistas puros; Go frente a seguir con Groovy y Grails; y crédito propio frente a socios financieros.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="601" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Alternativas descartadas: cuatro bifurcaciones y su coste probable (análisis propio)</tspan></text><rect x="10" y="56" width="110" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="65" y="107.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="65" dy="0">Estructura</tspan></text><rect x="134" y="56" width="262" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="265" y="99.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="265" dy="0">Elegida: celdas con equipo, datos</tspan></text><text x="265" y="115.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="265" dy="0">y código propios</tspan></text><rect x="412" y="56" width="250" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="537" y="91" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Alternativa: un monolito</tspan></text><text x="537" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">compartido por todos los</tspan></text><text x="537" y="124.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">equipos</tspan></text><rect x="678" y="56" width="252" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="804" y="91" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">Despliegues lentos y acoplados</tspan></text><text x="804" y="107.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">entre países y productos; menos</tspan></text><text x="804" y="124.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">autonomía por equipo</tspan></text><polyline points="396,104 412,104" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="662,104 678,104" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="164" width="110" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="65" y="215.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="65" dy="0">Logística</tspan></text><rect x="134" y="164" width="262" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="265" y="207.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="265" dy="0">Elegida: red propia con centros,</tspan></text><text x="265" y="223.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="265" dy="0">aviones y terceros</tspan></text><rect x="412" y="164" width="250" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="537" y="207.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Alternativa: depender solo de</tspan></text><text x="537" y="223.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">transportistas externos</tspan></text><rect x="678" y="164" width="252" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="804" y="199" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">Menos capital, pero menos</tspan></text><text x="804" y="215.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">control de plazos y de la</tspan></text><text x="804" y="232.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">experiencia de entrega</tspan></text><polyline points="396,212 412,212" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="662,212 678,212" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="272" width="110" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="65" y="323.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="65" dy="0">Lenguaje</tspan></text><rect x="134" y="272" width="262" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="265" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="265" dy="0">Elegida: Go para servicios con</tspan></text><text x="265" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="265" dy="0">mucho tráfico (2015)</tspan></text><rect x="412" y="272" width="250" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="537" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Alternativa: afinar Groovy y</tspan></text><text x="537" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Grails</tspan></text><rect x="678" y="272" width="252" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="804" y="298.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">Construcciones, pruebas y</tspan></text><text x="804" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">despliegues lentos; más</tspan></text><text x="804" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">servidores para el mismo</tspan></text><text x="804" y="348.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">tráfico</tspan></text><polyline points="396,320 412,320" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="662,320 678,320" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="380" width="110" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="65" y="431.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="65" dy="0">Crédito</tspan></text><rect x="134" y="380" width="262" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="265" y="423.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="265" dy="0">Elegida: crédito propio con</tspan></text><text x="265" y="439.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="265" dy="0">fondeo mixto</tspan></text><rect x="412" y="380" width="250" height="96" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="537" y="423.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Alternativa: derivar el crédito</tspan></text><text x="537" y="439.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">a bancos aliados</tspan></text><rect x="678" y="380" width="252" height="96" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="804" y="415" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">Menos riesgo propio y menos</tspan></text><text x="804" y="431.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">ingreso; sin datos de pago</tspan></text><text x="804" y="448.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">aprovechados</tspan></text><polyline points="396,428 412,428" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="662,428 678,428" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="492" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="516.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Es un análisis propio, no un hecho: la empresa no publica las alternativas que evaluó. Lo documentado son las opciones</tspan></text><text x="470" y="533.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">elegidas (celdas, red logística propia, Go, crédito propio) y los motivos que da el informe; los costes de las alternativas</tspan></text><text x="470" y="550.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">son hipótesis razonadas con la teoría del curso.</tspan></text><text x="470" y="587.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Esquema pedagógico: las cajas punteadas son inferencia del curso, no arquitectura confirmada por Mercado Libre.</tspan></text></svg>
