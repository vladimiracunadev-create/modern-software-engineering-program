<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 494" width="940" height="494" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 2, contenedores: seis servicios integrados sobre una plataforma común</title><desc id="d">Diagrama de contenedores: aplicaciones y sitios por país; servicios de comercio, pagos, envíos, publicidad y crédito; celdas autónomas; la plataforma interna Fury; las nubes de AWS y Google Cloud como proveedores principales; y los sistemas externos de bancos, transportistas y reguladores.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="494" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 2, contenedores: seis servicios integrados sobre una plataforma común</tspan></text><rect x="10" y="80" width="170" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="95" y="107.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="95" dy="0">Apps y sitios por</tspan></text><text x="95" y="123.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="95" dy="0">país</tspan></text><rect x="10" y="164" width="170" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="95" y="191.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="95" dy="0">API pública y</tspan></text><text x="95" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="95" dy="0">desarrolladores</tspan></text><rect x="210" y="52" width="540" height="296" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="224" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="224" dy="0">Plataforma Mercado Libre (documentado en 2019-2025)</tspan></text><rect x="228" y="90" width="160" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="308" y="123.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="308" dy="0">Marketplace</tspan></text><rect x="402" y="90" width="160" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="482" y="123.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="482" dy="0">Mercado Pago</tspan></text><rect x="576" y="90" width="160" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="656" y="123.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="656" dy="0">Mercado Envíos</tspan></text><rect x="228" y="164" width="160" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="308" y="197.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="308" dy="0">Mercado Ads</tspan></text><rect x="402" y="164" width="160" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="482" y="197.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="482" dy="0">Crédito y ahorro</tspan></text><rect x="576" y="164" width="160" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="656" y="189.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="656" dy="0">Celdas con equipo y</tspan></text><text x="656" y="205.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="656" dy="0">datos propios</tspan></text><rect x="228" y="240" width="508" height="92" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="482" y="273" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="482" dy="0">Fury: plataforma interna para construir, desplegar y operar</tspan></text><text x="482" y="289.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="482" dy="0">servicios, independiente de la nube; sobre ella AWS y Google Cloud,</tspan></text><text x="482" y="306.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="482" dy="0">los proveedores más grandes</tspan></text><rect x="780" y="52" width="150" height="296" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="794" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="794" dy="0">Externos</tspan></text><rect x="792" y="90" width="126" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="855" y="120.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="855" dy="0">Bancos y</tspan></text><text x="855" y="136.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="855" dy="0">emisores</tspan></text><rect x="792" y="174" width="126" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="855" y="204.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="855" dy="0">Transportistas</tspan></text><text x="855" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="855" dy="0">y MELI Places</tspan></text><rect x="792" y="258" width="126" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="855" y="296.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="855" dy="0">Reguladores</tspan></text><polyline points="180,112 228,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="180,196 228,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="388,120 402,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="562,120 576,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="736,120 792,124" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="736,204 792,208" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="368" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="392.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: seis servicios integrados, celdas con equipo, hardware, datos y código propios que se comunican por API, la</tspan></text><text x="470" y="409.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">plataforma Fury, AWS y Google Cloud como mayores proveedores de nube, la red logística con transportistas externos y la API</tspan></text><text x="470" y="426.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pública con OAuth y notificaciones. Inferido: la ubicación exacta de cada servicio. No se sabe cuántas celdas ni cuántos</tspan></text><text x="470" y="442.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">servicios existen.</tspan></text><text x="470" y="480.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informes anuales y comunicados de Mercado Libre y el caso publicado por Go, citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
