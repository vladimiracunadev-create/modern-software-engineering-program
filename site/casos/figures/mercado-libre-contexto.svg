<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 409" width="940" height="409" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un ecosistema de seis servicios alrededor del mercado: cada uno alimenta a los demás</title><desc id="d">Diagrama de contexto: compradores y vendedores se encuentran en el marketplace; Mercado Pago cobra, Mercado Envíos entrega, Mercado Ads financia la visibilidad de los vendedores, Mercado Shops da tiendas propias y los clasificados atraen tráfico; todo se integra con el crédito y la cuenta digital.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="409" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un ecosistema de seis servicios alrededor del mercado: cada uno alimenta a los demás</tspan></text><rect x="10" y="52" width="250" height="230" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Personas y negocios</tspan></text><rect x="30" y="90" width="210" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="121.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="135" dy="0">Comprador en Latinoamérica</tspan></text><rect x="30" y="158" width="210" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="135" y="173" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="135" dy="0">Vendedor del marketplace</tspan></text><text x="135" y="189.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="135" dy="0">(individuos, pymes y</tspan></text><text x="135" y="206.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="135" dy="0">marcas)</tspan></text><rect x="30" y="226" width="210" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="135" y="243.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">Desarrollador que usa las</tspan></text><text x="135" y="259.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="135" dy="0">API</tspan></text><rect x="300" y="52" width="630" height="230" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="314" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="314" dy="0">Ecosistema Mercado Libre</tspan></text><rect x="320" y="90" width="180" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="410" y="113.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="410" dy="0">Marketplace: publicar</tspan></text><text x="410" y="129.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="410" dy="0">y comprar</tspan></text><rect x="520" y="90" width="180" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="610" y="113.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">Mercado Pago: cobros,</tspan></text><text x="610" y="129.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">billetera y crédito</tspan></text><rect x="720" y="90" width="190" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="815" y="113.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">Mercado Envíos:</tspan></text><text x="815" y="129.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">logística y entrega</tspan></text><rect x="320" y="166" width="180" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="410" y="181" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410" dy="0">Mercado Ads:</tspan></text><text x="410" y="197.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410" dy="0">publicidad de</tspan></text><text x="410" y="214.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="410" dy="0">vendedores</tspan></text><rect x="520" y="166" width="180" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="610" y="189.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">Mercado Shops:</tspan></text><text x="610" y="205.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="610" dy="0">tiendas propias</tspan></text><rect x="720" y="166" width="190" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="815" y="189.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">Clasificados: autos,</tspan></text><text x="815" y="205.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="815" dy="0">inmuebles, servicios</tspan></text><rect x="320" y="234" width="590" height="36" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="615" y="255.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="615" dy="0">Programa de lealtad por puntos y niveles que une el marketplace y Mercado Pago</tspan></text><polyline points="240,118 320,118" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="240,186 320,186" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="240,248 300,248" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="300" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="324.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo documentado: el informe anual de 2022 describe seis servicios integrados, el marketplace, Mercado Pago, Mercado Envíos,</tspan></text><text x="470" y="341.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Mercado Ads, los clasificados y Mercado Shops, y un programa de lealtad de seis niveles. Las flechas resumen el uso; cómo</tspan></text><text x="470" y="358.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se reparte el tráfico entre servicios no se publica.</tspan></text><text x="470" y="395.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informes anuales y comunicados de Mercado Libre y el caso publicado por Go, citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
