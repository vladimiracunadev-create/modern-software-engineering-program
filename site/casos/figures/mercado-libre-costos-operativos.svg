<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Costos operativos de Mercado Libre por rubro, 2023-2025 (porcentaje de los ingresos)</title><desc id="d">Barras apiladas al cien por ciento: el costo de ingresos sube de 49,8 a 53,9 y a 55,5 por ciento de los ingresos; la provisión por incobrables de 7,0 a 8,9 y a 10,7; el marketing de 11,5 a 10,5 y a 11,1; y el resultado operativo baja de 14,6 a 12,7 y a 11,1 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Costos operativos de Mercado Libre por rubro, 2023-2025 (porcentaje de los ingresos)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Costo de ingresos y gastos financieros</tspan></text><rect x="350.52" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="370.52" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="370.52" dy="0">Provisión para cuentas dudosas</tspan></text><rect x="624.72" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="644.72" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="644.72" dy="0">Marketing</tspan></text><rect x="16" y="69" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Desarrollo, tecnología y administración</tspan></text><rect x="358.06" y="69" width="12" height="12" rx="2" fill="#946512"/><text x="378.06" y="80" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="378.06" dy="0">Resultado operativo</tspan></text><line x1="94" y1="101" x2="94" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="94" y1="221" x2="94" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="94" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="94" dy="0">0</tspan></text><line x1="289.425" y1="101" x2="289.425" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="289.425" y1="221" x2="289.425" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="289.425" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="289.425" dy="0">25</tspan></text><line x1="484.85" y1="101" x2="484.85" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="484.85" y1="221" x2="484.85" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="484.85" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.85" dy="0">50</tspan></text><line x1="680.275" y1="101" x2="680.275" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="680.275" y1="221" x2="680.275" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="680.275" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="680.275" dy="0">75</tspan></text><line x1="875.7" y1="101" x2="875.7" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="221" x2="875.7" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="94" y1="221" x2="875.7" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="84" y="125.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspa