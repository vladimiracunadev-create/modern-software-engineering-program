idth="1.5"/><text x="550.579" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="550.579" dy="0">9 %</tspan></text><rect x="585.399" y="148" width="82.1607" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="626.479" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="626.479" dy="0">11 %</tspan></text><rect x="667.56" y="148" width="108.765" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="721.942" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="721.942" dy="0">14 %</tspan></text><rect x="776.325" y="148" width="99.3753" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="826.012" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="826.012" dy="0">13 %</tspan></text><text x="882.7" y="165.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="94" y="188" width="433.844" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="310.922" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="310.922" dy="0">56 %</tspan></text><rect x="527.844" y="188" width="83.6419" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="569.664" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="569.664" dy="0">11 %</tspan></text><rect x="611.485" y="188" width="86.7687" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="654.87" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="654.87" dy="0">11 %</tspan></text><rect x="698.254" y="188" width="90.6772" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="743.593" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="743.593" dy="0">12 %</tspan></text><rect x="788.931" y="188" width="86.7687" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="832.316" y="205.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="832.316" dy="0">11 %</tspan></text><text x="882.7" y="205.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="484.85" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="484.85" dy="0">% del total</tspan></text><rect x="10" y="279" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El costo de 2023 se obtiene por diferencia (ingresos menos gastos operativos menos resultado operativo, cálculo propio);</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">los de 2024 y 2025 son del 10-K. El costo de ingresos incluye envíos y bodegas, transportistas, costo de bienes vendidos,</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comisiones de cobro, impuestos, fondeo del negocio fintech, prevención de fraude y alojamiento. La provisión crece más</tspan></text><text x="470" y="353.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rápido que los ingresos por el peso del crédito.</tspan></text><text x="470" y="401.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Mercado Libre, Form 10-K de 2019, 2021, 2024 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
