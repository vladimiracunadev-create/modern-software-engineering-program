<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 549" width="940" height="549" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El crédito crece y su riesgo también: ingresos por crédito y provisión por incobrables (miles de millones de USD)</title><desc id="d">Barras agrupadas de 2023, 2024 y 2025: ingresos por crédito de 2,5, 3,6 y 5,9 miles de millones y provisión para cuentas dudosas de 1,1, 1,9 y 3,1; el margen de interés neto tras pérdidas bajó de 36,2 a 28,2 y a 22,4 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="549" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El crédito crece y su riesgo también: ingresos por crédito y provisión por incobrables (miles de millones de</tspan></text><text x="14" y="46" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">USD)</tspan></text><rect x="16" y="64" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Ingresos por crédito</tspan></text><rect x="214.8" y="64" width="12" height="12" rx="2" fill="#c0432f"/><text x="234.8" y="75" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Provisión para cuentas dudosas</tspan></text><line x1="63.54" y1="374" x2="920" y2="374" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="374" x2="63.54" y2="374" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="378.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="287.333" x2="920" y2="287.333" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="287.333" x2="63.54" y2="287.333" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="291.833" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="200.667" x2="920" y2="200.667" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="200.667" x2="63.54" y2="200.667" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="205.167" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="114" x2="920" y2="114" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="114" x2="63.54" y2="114" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="118.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="114" x2="63.54" y2="374" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="244" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 244)">miles de millones de USD</text><rect x="92.0887" y="263.673" width="112.195" height="110.327" rx="3" fill="#087f8c"/><text x="148.186" y="257.673" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="148.186" dy="0">2,5</tspan></text><rect x="208.283" y="328.5" width="112.195" height="45.5" rx="3" fill="#c0432f"/><text x="264.381" y="322.5" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="264.381" dy="0">1,1</tspan></text><text x="206.283" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="206.283" dy="0">2023</tspan></text><rect x="377.575" y="218" width="112.195" height="156" rx="3" fill="#087f8c"/><text x="433.673" y="212" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="433.673" dy="0">3,6</tspan></text><rect x="493.77" y="293.487" width="112.195" height="80.5133" rx="3" fill="#c0432f"/><text x="549.867" y="287.487" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="549.867" dy="0">1,9</tspan></text><text x="491.77" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="491.77" dy="0">2024</tspan></text><rect x="663.062" y="120.153" width="112.195" height="253.847" rx="3" fill="#087f8c"/><text x="719.159" y="114.153" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="719.159" dy="0">5,9</tspan></text><rect x="779.257" y="240.057" width="112.195" height="133.943" rx="3" fill="#c0432f"/><text x="835.354" y="234.057" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835.354" dy="0">3,1</tspan></text><text x="777.257" y="395" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.257" dy="0">2025</tspan></text><rect x="10" y="426" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="450.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La provisión pasó de 41 a 53 por ciento de los ingresos por crédito entre 2023 y 2025 (cálculo propio) y el indicador NIMAL</tspan></text><text x="470" y="467.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de la empresa cayó de 36,2 a 28,2 y a 22,4 por ciento. Crecer en crédito exige reservar más contra pérdidas. Los ingresos</tspan></text><text x="470" y="484.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de crédito de 2023 son los recompuestos en el 10-K de 2025.</tspan></text><text x="470" y="531.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Mercado Libre, Form 10-K de 2019, 2021, 2024 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
