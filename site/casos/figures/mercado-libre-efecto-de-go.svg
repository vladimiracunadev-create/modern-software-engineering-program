<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Efecto de pasar un servicio de Grails a Go (según el caso de Go)</title><desc id="d">Puntos antes y después en escala logarítmica para un servicio grande: servidores de 32 a 4, núcleos por servidor de 4 a 2 y núcleos totales de 128 a 8, una reducción de 94 por ciento en capacidad de cómputo para el mismo servicio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Efecto de pasar un servicio de Grails a Go (según el caso de Go)</tspan></text><circle cx="22" cy="51" r="6" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Antes (Grails)</tspan></text><circle cx="175.56" cy="51" r="6" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Después (Go)</tspan></text><line x1="286.18" y1="77" x2="286.18" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="286.18" y1="197" x2="286.18" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="286.18" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="286.18" dy="0">1</tspan></text><line x1="482.06" y1="77" x2="482.06" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="482.06" y1="197" x2="482.06" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="482.06" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="482.06" dy="0">10</tspan></text><line x1="677.94" y1="77" x2="677.94" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="677.94" y1="197" x2="677.94" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="677.94" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="677.94" dy="0">100</tspan></text><line x1="873.82" y1="77" x2="873.82" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="873.82" y1="197" x2="873.82" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="873.82" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="873.82" dy="0">1 000</tspan></text><line x1="286.18" y1="197" x2="873.82" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="234" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">Servidores</tspan></text><text x="234" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">Núcleos por servidor</tspan></text><text x="234" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="234" dy="0">Núcleos totales (cálculo)</tspan></text><line x1="581.009" y1="97" x2="404.112" y2="97" stroke="#087f8c" stroke-width="4"/><circle cx="581.009" cy="97" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="404.112" cy="97" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="593.009" y="101.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="593.009" dy="0">32</tspan></text><text x="392.112" y="101.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="392.112" dy="0">4</tspan></text><line x1="404.112" y1="137" x2="345.146" y2="137" stroke="#087f8c" stroke-width="4"/><circle cx="404.112" cy="137" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="345.146" cy="137" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="416.112" y="141.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="416.112" dy="0">4</tspan></text><text x="333.146" y="141.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="333.146" dy="0">2</tspan></text><line x1="698.94" y1="177" x2="463.077" y2="177" stroke="#087f8c" stroke-width="4"/><circle cx="698.94" cy="177" r="7" fill="#ffffff" stroke="#6b7c86" stroke-width="2"/><circle cx="463.077" cy="177" r="7" fill="#102a43" stroke="#102a43" stroke-width="2"/><text x="710.94" y="181.5" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="710.94" dy="0">128</tspan></text><text x="451.077" y="181.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="451.077" dy="0">8</tspan></text><text x="580" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="580" dy="0">Cantidad (escala logarítmica)</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Los 128 y 8 núcleos son el producto de las dos cifras publicadas (32 × 4 y 4 × 2), no una medida directa; Go señala que</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">desapareció el 88 por ciento de los servidores y que cada uno usa la mitad de CPU. Es un servicio elegido por la propia</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">compañía de un caso publicado por el proyecto Go: puede no ser representativo y no incluye el coste de reescribir.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: The Go Programming Language, «MercadoLibre Grows with Go», 10 de noviembre de 2019.</tspan></text></svg>
