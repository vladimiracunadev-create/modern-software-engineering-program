<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo evolucionó el negocio y la arquitectura: tres etapas</title><desc id="d">Tres columnas: de 1999 a 2007 un marketplace por país con plataforma común y pagos con custodia en 2003; de 2008 a 2019 una plataforma abierta, Go desde 2015 y envíos propios; de 2020 en adelante un ecosistema con aviones, crédito, banca y más de veinte mil empleados de tecnología.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo evolucionó el negocio y la arquitectura: tres etapas</tspan></text><rect x="10" y="56" width="292" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="156" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="156" dy="0">1999-2007: marketplace por país</tspan></text><rect x="10" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Una plataforma tecnológica y un</tspan></text><text x="156" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">marketplace separado por país</tspan></text><rect x="10" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Mercado Pago nace como custodia en</tspan></text><text x="156" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">2003</tspan></text><rect x="10" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Alianza con eBay en 2001 y bolsa en</tspan></text><text x="156" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">2007</tspan></text><rect x="324" y="56" width="292" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">2008-2019: plataforma abierta</tspan></text><rect x="324" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Groovy y Grails alcanzan su límite;</tspan></text><text x="470" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">migración a Go desde 2015</tspan></text><rect x="324" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="232.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Celdas, API abiertas y Fury</tspan></text><rect x="324" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Mercado Envíos y crédito crecen sobre</tspan></text><text x="470" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">el marketplace</tspan></text><rect x="638" y="56" width="292" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="784" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="784" dy="0">2020 en adelante: ecosistema</tspan></text><rect x="638" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Meli Air en 2020; red de tiendas</tspan></text><text x="784" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">aliadas</tspan></text><rect x="638" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="216" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Crédito como línea mayor; solicitud</tspan></text><text x="784" y="232.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">de licencia bancaria en Argentina</tspan></text><text x="784" y="249.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">(2025)</tspan></text><rect x="638" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">20 347 empleados de tecnología en</tspan></text><text x="784" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">2025</tspan></text><polyline points="302,78 324,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="616,78 638,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="368" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="392.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Periodización del curso sobre hechos de los 10-K de 2007, 2019, 2022 y 2025 y del caso de Go. Las fronteras son</tspan></text><text x="470" y="409.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aproximadas: la migración a Go empezó en 2015 y convivió con la pila anterior. No se sabe qué parte de cada etapa se rehízo</tspan></text><text x="470" y="426.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por completo ni cuándo se introdujeron las celdas.</tspan></text><text x="470" y="463.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informes anuales y comunicados de Mercado Libre y el caso publicado por Go, citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
