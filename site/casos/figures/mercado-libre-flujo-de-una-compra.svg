<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 389" width="940" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una compra de principio a fin: encontrar, pagar, enviar y cerrar</title><desc id="d">Diagrama de flujo en seis pasos: el comprador encuentra y compra un producto; Mercado Pago procesa el pago; el vendedor prepara el envío; Mercado Envíos recoge y entrega, a veces desde un centro de cumplimiento; el comprador confirma la recepción; y se cierra la operación con la liquidación al vendedor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="389" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una compra de principio a fin: encontrar, pagar, enviar y cerrar</tspan></text><rect x="10" y="66" width="134" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="77" dy="0">1. Encontrar</tspan></text><rect x="10" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="77" y="149.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="77" dy="0">El comprador</tspan></text><text x="77" y="166.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="77" dy="0">busca y elige</tspan></text><text x="77" y="182.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="77" dy="0">un producto del</tspan></text><text x="77" y="199.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="77" dy="0">marketplace</tspan></text><rect x="166" y="66" width="134" height="38" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="233" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="233" dy="0">2. Pagar</tspan></text><rect x="166" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="233" y="149.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="233" dy="0">Mercado Pago</tspan></text><text x="233" y="166.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="233" dy="0">procesa el pago</tspan></text><text x="233" y="182.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="233" dy="0">en el</tspan></text><text x="233" y="199.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="233" dy="0">marketplace</tspan></text><polyline points="144,85 166,85" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="322" y="66" width="134" height="38" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="389" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="389" dy="0">3. Preparar</tspan></text><rect x="322" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="389" y="149.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389" dy="0">El vendedor</tspan></text><text x="389" y="166.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389" dy="0">empaca o usa el</tspan></text><text x="389" y="182.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389" dy="0">cumplimiento de</tspan></text><text x="389" y="199.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="389" dy="0">Mercado Libre</tspan></text><polyline points="300,85 322,85" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="66" width="134" height="38" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="545" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="545" dy="0">4. Entregar</tspan></text><rect x="478" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="545" y="149.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545" dy="0">Mercado Envíos</tspan></text><text x="545" y="166.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545" dy="0">transporta con</tspan></text><text x="545" y="182.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545" dy="0">red propia o</tspan></text><text x="545" y="199.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="545" dy="0">terceros</tspan></text><polyline points="456,85 478,85" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="634" y="66" width="134" height="38" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="701" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="701" dy="0">5. Recibir</tspan></text><rect x="634" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="701" y="149.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701" dy="0">El comprador</tspan></text><text x="701" y="166.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701" dy="0">recibe y puede</tspan></text><text x="701" y="182.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701" dy="0">calificar o</tspan></text><text x="701" y="199.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="701" dy="0">reclamar</tspan></text><polyline points="612,85 634,85" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="790" y="66" width="134" height="38" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="857" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="857" dy="0">6. Liquidar</tspan></text><rect x="790" y="112" width="134" height="118" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="857" y="158" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">El dinero queda</tspan></text><text x="857" y="174.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">disponible para</tspan></text><text x="857" y="191.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="857" dy="0">el vendedor</tspan></text><polyline points="768,85 790,85" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="14" y="262" font-size="13" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="14" dy="0">Trazo continuo: respaldado por el informe anual. Trazo punteado: inferido.</tspan></text><rect x="10" y="280" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="304.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">El informe anual documenta que Mercado Pago procesa y liquida las transacciones del marketplace en la mayoría de los países</tspan></text><text x="470" y="321.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">y que Mercado Envíos ofrece transporte y cumplimiento. Las reglas de calificación, reclamo y el momento de liberar el</tspan></text><text x="470" y="338.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">dinero al vendedor se infieren: no están descritas en las fuentes consultadas.</tspan></text><text x="470" y="375.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Esquema pedagógico: las cajas punteadas son inferencia del curso, no arquitectura confirmada por Mercado Libre.</tspan></text></svg>
