<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 535" width="940" height="535" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware y software documentados de Mercado Libre, por capa</title><desc id="d">Diagrama de capas: la aplicación con servicios en Go y la pila anterior de Groovy y Grails; la plataforma interna Fury con plantillas, imágenes de contenedor y canalizaciones; la nube con AWS y Google Cloud; el hardware de logística y de cobro, con aviones, camiones, furgonetas y terminales de pago; y los servidores, no publicados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="535" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware y software documentados de Mercado Libre, por capa</tspan></text><rect x="10" y="56" width="190" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Lenguajes y servicios</tspan></text><rect x="212" y="56" width="718" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="571" y="82.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">Go en servicios con mucho tráfico desde 2015; Groovy y Grails antes; Go atiende aproximadamente</tspan></text><text x="571" y="98.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">la mitad del tráfico</tspan></text><rect x="10" y="130" width="190" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="164.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Plataforma interna</tspan></text><rect x="212" y="130" width="718" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="571" y="156.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="571" dy="0">Fury: plantillas de servicios en Go, repositorios iniciales de GitHub, imágenes de Docker y</tspan></text><text x="571" y="172.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="571" dy="0">canalizaciones de despliegue</tspan></text><rect x="10" y="204" width="190" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Nube</tspan></text><rect x="212" y="204" width="718" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="571" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">AWS y Google Cloud, los proveedores mayores; plataforma independiente de la nube</tspan></text><rect x="10" y="278" width="190" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="312.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Hardware de negocio</tspan></text><rect x="212" y="278" width="718" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="571" y="304.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">Aviones dedicados, camiones y furgonetas (mayoría de terceros); terminales de cobro que se</tspan></text><text x="571" y="320.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">venden</tspan></text><rect x="10" y="352" width="190" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="386.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Servidores y red</tspan></text><rect x="212" y="352" width="718" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="571" y="386.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="571" dy="0">No se sabe: tipo de servidores, regiones, redes y bases de datos no se publican</tspan></text><rect x="10" y="426" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="450.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el caso de Go (2019), el informe de 2022 y el 10-K de 2025. Los lenguajes son los de los servicios citados,</tspan></text><text x="470" y="467.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no un inventario completo. No se sabe qué bases de datos, colas ni orquestadores usan los servicios; Docker y GitHub se</tspan></text><text x="470" y="484.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">citan por las plantillas de Fury.</tspan></text><text x="470" y="521.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informes anuales y comunicados de Mercado Libre y el caso publicado por Go, citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
