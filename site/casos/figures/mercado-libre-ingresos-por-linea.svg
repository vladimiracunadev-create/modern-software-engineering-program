<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 363" width="940" height="363" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De qué viven los ingresos: comercio y fintech por línea (2024 y 2025, miles de millones de USD)</title><desc id="d">Barras apiladas de ingresos por línea: en 2024, servicios de comercio 10,1, venta de producto 2,1, servicios financieros 5,0 y crédito 3,6; en 2025, servicios de comercio 12,8, venta de producto 3,5, servicios financieros 6,7 y crédito 5,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="363" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De qué viven los ingresos: comercio y fintech por línea (2024 y 2025, miles de millones de USD)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Servicios de comercio</tspan></text><rect x="222.34" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Venta de producto</tspan></text><rect x="398.52" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="418.52" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="418.52" dy="0">Servicios financieros</tspan></text><rect x="604.86" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="624.86" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="624.86" dy="0">Crédito</tspan></text><line x1="154" y1="77" x2="154" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="154" y1="165" x2="154" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="154" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">0</tspan></text><line x1="394.567" y1="77" x2="394.567" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="394.567" y1="165" x2="394.567" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="394.567" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="394.567" dy="0">10</tspan></text><line x1="635.133" y1="77" x2="635.133" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="635.133" y1="165" x2="635.133" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="635.133" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="635.133" dy="0">20</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="165" x2="875.7" y2="170" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">30</tspan></text><line x1="154" y1="165" x2="875.7" y2="165" stroke="#5b7280" stroke-width="1.6"/><text x="144" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">2024 (20,8 en</tspan></text><text x="144" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">total)</tspan></text><text x="144" y="139" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">2025 (28,9 en</tspan></text><text x="144" y="156" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="144" dy="0">total)</tspan></text><rect x="154" y="84" width="242.395" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="275.197" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="275.197" dy="0">10,1</tspan></text><rect x="396.395" y="84" width="50.11" height="30" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="421.45" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="421.45" dy="0">2,1</tspan></text><rect x="446.505" y="84" width="119.369" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="506.19" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="506.19" dy="0">5,0</tspan></text><rect x="565.874" y="84" width="86.604" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="609.176" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="609.176" dy="0">3,6</tspan></text><text x="659.478" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="659.478" dy="0">20,7</tspan></text><rect x="154" y="128" width="306.723" height="30" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="307.361" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="307.361" dy="0">12,8</tspan></text><rect x="460.723" y="128" width="85.2568" height="30" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="503.351" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="503.351" dy="0">3,5</tspan></text><rect x="545.979" y="128" width="160.65" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="626.305" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="626.305" dy="0">6,7</tspan></text><rect x="706.63" y="128" width="140.924" height="30" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="777.092" y="147.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="777.092" dy="0">5,9</tspan></text><text x="854.554" y="147.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="854.554" dy="0">28,8</tspan></text><text x="514.85" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="514.85" dy="0">miles de millones de USD</tspan></text><rect x="10" y="223" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Fintech (servicios financieros más crédito, más 0,06 de productos) pasó de 8,6 a 12,6 miles de millones y es 44 por ciento</tspan></text><text x="470" y="264.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de los ingresos de 2025 (cálculo propio); el crédito creció 63 por ciento en el año. Los ingresos de comercio incluyen</tspan></text><text x="470" y="281.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">comisiones, envíos netos de costes de transportistas, publicidad y venta propia; el 10-K no separa la publicidad en este</tspan></text><text x="470" y="297.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuadro.</tspan></text><text x="470" y="345.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Mercado Libre, Form 10-K de 2019, 2021, 2024 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
