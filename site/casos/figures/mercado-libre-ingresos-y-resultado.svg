do operativo creció de 0,4 a 3,2 miles de millones entre 2021 y 2025. El margen operativo subió de 6,2 por ciento</tspan></text><text x="470" y="488.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en 2021 a 14,6 en 2023 y bajó a 12,7 en 2024 y 11,1 en 2025 (cálculo propio): desde 2023 el resultado crece menos que los</tspan></text><text x="470" y="505.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ingresos, a la vez que pesan más la provisión de crédito y el marketing. Las cifras de 2022 y 2023 están recompuestas en el</tspan></text><text x="470" y="521.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">10-K de 2024 por un cambio de presentación.</tspan></text><text x="470" y="569.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Mercado Libre, Form 10-K de 2019, 2021, 2024 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
