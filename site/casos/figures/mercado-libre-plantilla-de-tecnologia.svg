00" fill="#142231"><tspan x="612.965" dy="0">18 282</tspan></text><text x="612.965" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612.965" dy="0">2024</tspan></text><rect x="735.779" y="111.669" width="163.752" height="195.331" rx="3" fill="#102a43"/><text x="817.655" y="105.669" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="817.655" dy="0">20 347</tspan></text><text x="817.655" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817.655" dy="0">2025</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Crece 2,1 veces entre 2021 y 2025 (cálculo propio) mientras los ingresos crecen 4,1 veces (7 069 a 28 893 millones). El</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">10-K de 2025 no publica la plantilla total ni por país; solo la de tecnología y producto. No se grafica 2023 porque el</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cierre de ese año no está en los documentos usados.</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Mercado Libre, Form 10-K de 2019, 2021, 2024 y 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
