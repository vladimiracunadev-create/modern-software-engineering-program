<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 436" width="940" height="436" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 3, componente: la red logística, de las bodegas a la última milla</title><desc id="d">Diagrama de flujo logístico: el vendedor deja inventario en centros de cumplimiento propios, que atienden más de la mitad de los envíos, o entrega los artículos vendidos en tiendas aliadas o los recoge Mercado Libre; luego una red de aviones dedicados, camiones y furgonetas operados en su mayoría por transportistas externos lleva el paquete al comprador.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="436" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 3, componente: la red logística, de las bodegas a la última milla</tspan></text><rect x="10" y="60" width="210" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="115" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="115" dy="0">Vendedor con inventario en</tspan></text><text x="115" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="115" dy="0">un centro de cumplimiento</tspan></text><rect x="10" y="160" width="210" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="178.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">Vendedor que entrega el</tspan></text><text x="115" y="195.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">artículo vendido en una</tspan></text><text x="115" y="211.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">tienda aliada (MELI</tspan></text><text x="115" y="228.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">Places) o a recogida</tspan></text><rect x="270" y="110" width="200" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="370" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="370" dy="0">Cross-docking: se recoge</tspan></text><text x="370" y="158.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="370" dy="0">y se mete a la red</tspan></text><text x="370" y="175.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="370" dy="0">logística</tspan></text><rect x="270" y="220" width="200" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="370" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="370" dy="0">Más de la mitad de los</tspan></text><text x="370" y="258.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="370" dy="0">envíos salen de centros</tspan></text><text x="370" y="275.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="370" dy="0">de cumplimiento</tspan></text><rect x="520" y="60" width="190" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="615" y="83.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="615" dy="0">Transporte: aviones</tspan></text><text x="615" y="100.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="615" dy="0">dedicados, camiones y</tspan></text><text x="615" y="116.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="615" dy="0">furgonetas (en su</tspan></text><text x="615" y="133.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="615" dy="0">mayoría de terceros)</tspan></text><rect x="520" y="180" width="190" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="615" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615" dy="0">Última milla a</tspan></text><text x="615" y="228.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615" dy="0">domicilio, o recogida</tspan></text><text x="615" y="245.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="615" dy="0">en un MELI Place</tspan></text><rect x="760" y="110" width="170" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="845" y="155.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="845" dy="0">Comprador: recibe,</tspan></text><text x="845" y="171.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="845" dy="0">devuelve o reclama</tspan></text><polyline points="220,100 270,135" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="220,200 270,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="220,110 270,250" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,155 520,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,255 520,225" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="710,110 760,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="710,225 760,185" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="310" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="334.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el 10-K de 2025: los centros de cumplimiento (más de la mitad de los envíos), el cross-docking con una red</tspan></text><text x="470" y="351.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de miles de tiendas aliadas, que también sirven para recogida y devoluciones, y la red de transporte con aviones dedicados,</tspan></text><text x="470" y="368.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">camiones y miles de furgonetas, en su gran mayoría de transportistas externos. No se sabe el número de centros ni cómo se</tspan></text><text x="470" y="384.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">asigna cada envío.</tspan></text><text x="470" y="422.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: informes anuales y comunicados de Mercado Libre y el caso publicado por Go, citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
