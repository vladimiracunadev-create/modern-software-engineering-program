<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 576" width="940" height="576" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: lo que existía, lo que falló y lo que debió existir</title><desc id="d">Tres columnas: mecanismos que existían (auditoría de comandos, regla de salud del DNS, acceso primario y fuera de banda, ejercicios de tormenta, seguridad física, reinicio gradual), los que fallaron o faltaban (auditoría con error, red fuera de banda independiente, herramientas sin DNS, límite de alcance) y los que debieron existir.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="576" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: lo que existía, lo que falló y lo que debió existir</tspan></text><rect x="10" y="51" width="296" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="158" dy="0">Existían (documentado)</tspan></text><rect x="10" y="103" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="128.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Auditoría de comandos de</tspan></text><text x="158" y="144.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">mantenimiento</tspan></text><rect x="10" y="171" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="204.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Regla de salud del DNS</tspan></text><rect x="10" y="239" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Acceso primario y red fuera de banda</tspan></text><rect x="10" y="307" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="332.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Ejercicios de «tormenta» desde hace</tspan></text><text x="158" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">tiempo</tspan></text><rect x="10" y="375" width="296" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="158" y="408.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="158" dy="0">Reinicio gradual de la carga</tspan></text><rect x="316" y="51" width="296" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="464" dy="0">Fallaron o faltaban (documentado)</tspan></text><rect x="316" y="103" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="136.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Auditoría con un error propio</tspan></text><rect x="316" y="171" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Acceso primario y fuera de banda</tspan></text><text x="464" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">caídos</tspan></text><rect x="316" y="239" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="264.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Herramientas rotas por la pérdida del</tspan></text><text x="464" y="280.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">DNS</tspan></text><rect x="316" y="307" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="332.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Ejercicio de pérdida de la red</tspan></text><text x="464" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">troncal global</tspan></text><rect x="316" y="375" width="296" height="60" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="464" y="408.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="464" dy="0">Acceso físico lento por diseño</tspan></text><rect x="622" y="51" width="296" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="770" dy="0">Debieron existir (análisis propio)</tspan></text><rect x="622" y="103" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="136.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Límite de alcance por comando</tspan></text><rect x="622" y="171" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Gestión independiente de la red</tspan></text><text x="770" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">afectada</tspan></text><rect x="622" y="239" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Suelo global en la regla de salud</tspan></text><rect x="622" y="307" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="332.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Ejercicio de pérdida total y</tspan></text><text x="770" y="348.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">recuperación sin DNS</tspan></text><rect x="622" y="375" width="296" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="770" y="408.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="770" dy="0">Acceso de emergencia preautorizado</tspan></text><rect x="10" y="453" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="477.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: casi todos los mecanismos existían, pero compartían el mismo camino que lo que protegían. Lo único que</tspan></text><text x="470" y="494.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">funcionó como se esperaba fue el reinicio gradual, el único que se había ensayado. La columna de la derecha es análisis</tspan></text><text x="470" y="511.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">propio.</tspan></text><text x="470" y="558.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Meta Engineering (4 y 5 de octubre de 2021) y Cloudflare; tercera columna: análisis propio.</tspan></text></svg>
