<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 446" width="940" height="446" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Diseño de la barrera: un comando de red que simula su impacto antes de ejecutarse</title><desc id="d">Flujo de una barrera de alcance: el comando propuesto se simula, se calcula cuánta capacidad y cuántas regiones quita, si supera un umbral exige doble aprobación y ejecución por región, y tras ejecutar una comprobación automática verifica que el DNS y el acceso fuera de banda siguen alcanzables o revierte.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="446" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Diseño de la barrera: un comando de red que simula su impacto antes de ejecutarse</tspan></text><rect x="10" y="61" width="164" height="110" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="92" y="111.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">1. Comando</tspan></text><text x="92" y="127.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="92" dy="0">propuesto</tspan></text><polyline points="174,116 204,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="204" y="61" width="164" height="110" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="286" y="94.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="286" dy="0">2. Simulación de</tspan></text><text x="286" y="111.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="286" dy="0">impacto: ¿qué</tspan></text><text x="286" y="127.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="286" dy="0">enlaces y regiones</tspan></text><text x="286" y="144.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="286" dy="0">quita?</tspan></text><polyline points="368,116 398,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="398" y="61" width="164" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="94.68" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="480" dy="0">3. ¿Supera el</tspan></text><text x="480" y="111.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="480" dy="0">umbral de capacidad</tspan></text><text x="480" y="127.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="480" dy="0">o aísla una región</tspan></text><text x="480" y="144.6" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="480" dy="0">entera?</tspan></text><polyline points="562,116 592,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="592" y="61" width="164" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="674" y="103" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="674" dy="0">4. Ejecución</tspan></text><text x="674" y="119.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="674" dy="0">limitada a una</tspan></text><text x="674" y="136.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="674" dy="0">región</tspan></text><polyline points="756,116 786,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="786" y="61" width="164" height="110" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="868" y="94.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="868" dy="0">5. Comprobación:</tspan></text><text x="868" y="111.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="868" dy="0">¿siguen alcanzables</tspan></text><text x="868" y="127.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="868" dy="0">DNS y acceso fuera</tspan></text><text x="868" y="144.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="868" dy="0">de banda?</tspan></text><rect x="398" y="221" width="164" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="480" y="248" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="480" dy="0">Sí: doble</tspan></text><text x="480" y="264.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="480" dy="0">aprobación, ventana</tspan></text><text x="480" y="281.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="480" dy="0">y plan de vuelta</tspan></text><polyline points="480,171 480,221" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="496" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="496" dy="0">sí</tspan></text><rect x="786" y="221" width="164" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="868" y="256.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="868" dy="0">No: reversión</tspan></text><text x="868" y="272.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="868" dy="0">automática y alerta</tspan></text><polyline points="868,171 868,221" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="884" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="884" dy="0">no</tspan></text><rect x="10" y="323" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="347.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: la barrera no confía en que quien manda el comando haya acertado ni en que la auditoría clásica no tenga</tspan></text><text x="470" y="364.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">errores: simula antes y comprueba después, con una señal independiente (alcanzabilidad del DNS y del acceso de emergencia).</tspan></text><text x="470" y="381.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Es diseño propio; los umbrales dependen de cada red.</tspan></text><text x="470" y="428.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en las publicaciones de Meta y Cloudflare; no es una conclusión de esas fuentes.</tspan></text></svg>
