<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 402" width="940" height="402" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El círculo que dificultó la recuperación: lo que se necesitaba para arreglar dependía de lo roto</title><desc id="d">Cuatro obstáculos que Meta describe para recuperar: la red de acceso normal y la fuera de banda estaban caídas; la pérdida del DNS rompió herramientas internas de diagnóstico; el acceso físico a los centros de datos requería activar protocolos de seguridad; y el hardware estaba diseñado para ser difícil de modificar incluso con acceso físico.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="402" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El círculo que dificultó la recuperación: lo que se necesitaba para arreglar dependía de lo roto</tspan></text><rect x="10" y="61" width="210" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="115" y="94.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="115" dy="0">Red troncal caída (causa</tspan></text><text x="115" y="110.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="115" dy="0">original)</tspan></text><rect x="255" y="61" width="210" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="360" y="94.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="360" dy="0">Acceso normal y red fuera</tspan></text><text x="360" y="110.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="360" dy="0">de banda sin servicio</tspan></text><rect x="500" y="61" width="210" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="605" y="86" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="605" dy="0">DNS perdido: herramientas</tspan></text><text x="605" y="102.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="605" dy="0">internas de diagnóstico</tspan></text><text x="605" y="119.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="605" dy="0">rotas</tspan></text><rect x="745" y="61" width="185" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="837.5" y="86" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="837.5" dy="0">Hace falta ir en</tspan></text><text x="837.5" y="102.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="837.5" dy="0">persona a los centros</tspan></text><text x="837.5" y="119.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="837.5" dy="0">de datos</tspan></text><polyline points="220,99 255,99" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="465,99 500,99" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="710,99 745,99" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="255" y="181" width="210" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="360" y="206" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360" dy="0">Instalaciones con alta</tspan></text><text x="360" y="222.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360" dy="0">seguridad física y de</tspan></text><text x="360" y="239.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="360" dy="0">sistemas</tspan></text><rect x="500" y="181" width="210" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="605" y="206" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="605" dy="0">Hardware difícil de</tspan></text><text x="605" y="222.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="605" dy="0">modificar aun con acceso</tspan></text><text x="605" y="239.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="605" dy="0">físico</tspan></text><rect x="745" y="181" width="185" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="837.5" y="206" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="837.5" dy="0">Activar protocolos de</tspan></text><text x="837.5" y="222.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="837.5" dy="0">acceso seguro: más</tspan></text><text x="837.5" y="239.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="837.5" dy="0">tiempo</tspan></text><polyline points="837,137 837,181" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="465,219 500,219" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="710,219 745,219" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="181" width="210" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="115" y="206" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="115" dy="0">Meta: la dureza ante</tspan></text><text x="115" y="222.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="115" dy="0">accesos no autorizados</tspan></text><text x="115" y="239.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="115" dy="0">frenó la recuperación</tspan></text><rect x="10" y="279" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: cuanto más seguro y más acoplado es un sistema, más importa que su vía de emergencia no comparta</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dependencias con él. Meta valora que la compensación entre seguridad diaria y recuperación más lenta es aceptable; es una</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">posición de la empresa, no un hecho universal.</tspan></text><text x="470" y="384.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Meta Engineering, «More details about the October 4 outage» (5 de octubre de 2021).</tspan></text></svg>
