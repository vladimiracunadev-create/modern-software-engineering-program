<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo llega una petición a Facebook: DNS, borde y red troncal</title><desc id="d">Diagrama de contexto: el dispositivo del usuario pregunta a un resolvedor DNS la dirección; los servidores DNS autoritativos de Facebook, alojados en instalaciones pequeñas de borde y anunciados al resto de internet con BGP, responden; la petición viaja al borde más cercano y de ahí, por la red troncal propia, a un centro de datos grande donde se procesa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="400" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo llega una petición a Facebook: DNS, borde y red troncal</tspan></text><rect x="10" y="81" width="140" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="80" y="122.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="80" dy="0">Aplicación del</tspan></text><text x="80" y="138.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="80" dy="0">usuario</tspan></text><rect x="180" y="81" width="150" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="255" y="105.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255" dy="0">Resolvedor DNS</tspan></text><text x="255" y="122.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255" dy="0">(1.1.1.1,</tspan></text><text x="255" y="138.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255" dy="0">8.8.8.8, del</tspan></text><text x="255" y="155.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255" dy="0">operador)</tspan></text><rect x="360" y="81" width="170" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="445" y="105.68" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="445" dy="0">DNS autoritativo de</tspan></text><text x="445" y="122.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="445" dy="0">Facebook, en el</tspan></text><text x="445" y="138.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="445" dy="0">borde, anunciado por</tspan></text><text x="445" y="155.6" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="445" dy="0">BGP</tspan></text><rect x="560" y="81" width="160" height="92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="640" y="122.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="640" dy="0">Instalación de</tspan></text><text x="640" y="138.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="640" dy="0">borde cercana</tspan></text><rect x="750" y="81" width="180" height="92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="840" y="114" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">Centro de datos</tspan></text><text x="840" y="130.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">grande (datos y</tspan></text><text x="840" y="147.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">cómputo)</tspan></text><polyline points="150,127 180,127" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="330,127 360,127" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="530,127 560,127" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="720,127 750,127" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="540" y="201" width="390" height="70" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="554" y="223" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="554" dy="0">Red troncal propia de Facebook</tspan></text><polyline points="640,173 640,201" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="840,173 840,201" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="201" width="500" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="260" y="231.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="260" dy="0">Si el DNS no responde, la aplicación no sabe adónde ir aunque los</tspan></text><text x="260" y="247.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="260" dy="0">servidores sigan encendidos</tspan></text><rect x="10" y="293" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el nombre es lo primero que se necesita y depende de dos cosas: un servidor DNS vivo y una ruta anunciada</tspan></text><text x="470" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hacia él. Ambas dependían, en Facebook, del estado de la red troncal.</tspan></text><text x="470" y="382.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Meta Engineering, «More details about the October 4 outage» (5 de octubre de 2021). Descripción funcional según la publicación.</tspan></text></svg>
