<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defensa en profundidad: siete barreras que no frenaron y una que sí funcionó</title><desc id="d">Láminas con huecos: auditoría de comandos con un error, límite de alcance del cambio que no consta, regla de salud del DNS que amplificó, acceso primario caído, red fuera de banda caída, herramientas de diagnóstico rotas por el DNS y acceso físico endurecido; la octava, el reinicio gradual preparado con ejercicios, sí funcionó.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defensa en profundidad: siete barreras que no frenaron y una que sí funcionó</tspan></text><rect x="30" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="42" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="9" y="231" width="104" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="61" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">Auditoría</tspan></text><text x="61" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">de comandos</tspan></text><text x="61" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">(con un</tspan></text><text x="61" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="61" dy="0">error)</tspan></text><rect x="143" y="51" width="62" height="170" rx="14" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><rect x="155" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="122" y="231" width="104" height="150" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="174" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="174" dy="0">Límite de</tspan></text><text x="174" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="174" dy="0">alcance de</tspan></text><text x="174" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="174" dy="0">un cambio</tspan></text><text x="174" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="174" dy="0">(no consta)</tspan></text><rect x="256" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="268" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="235" y="231" width="104" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="287" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287" dy="0">Regla de</tspan></text><text x="287" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287" dy="0">salud del</tspan></text><text x="287" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287" dy="0">DNS</tspan></text><text x="287" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="287" dy="0">(amplificó)</tspan></text><rect x="369" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="381" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="348" y="231" width="104" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="400" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">Acceso</tspan></text><text x="400" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">primario</tspan></text><text x="400" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="400" dy="0">(caído)</tspan></text><rect x="482" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="494" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="461" y="231" width="104" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="513" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">Red fuera</tspan></text><text x="513" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">de banda</tspan></text><text x="513" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="513" dy="0">(caída)</tspan></text><rect x="595" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="607" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="574" y="231" width="104" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="626" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">Herramientas</tspan></text><text x="626" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">de</tspan></text><text x="626" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">diagnóstico</tspan></text><text x="626" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">(rotas sin</tspan></text><text x="626" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="626" dy="0">DNS)</tspan></text><rect x="708" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="720" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="687" y="231" width="104" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="739" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">Acceso</tspan></text><text x="739" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">físico</tspan></text><text x="739" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">seguro</tspan></text><text x="739" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">(lento por</tspan></text><text x="739" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="739" dy="0">diseño)</tspan></text><rect x="821" y="51" width="62" height="170" rx="14" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><rect x="833" y="69" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="800" y="231" width="104" height="150" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="852" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="852" dy="0">Reinicio</tspan></text><text x="852" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="852" dy="0">gradual con</tspan></text><text x="852" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="852" dy="0">ejercicios</tspan></text><text x="852" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="852" dy="0">de tormenta</tspan></text><text x="852" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="852" dy="0">(funcionó)</tspan></text><polyline points="10,136 808,136" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="399" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: el fallo atravesó siete capas porque todas compartían la red; la octava funcionó porque se había ensayado.</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Rojo: falló; gris: no consta en las fuentes; dorado: funcionó con coste de tiempo; verde azulado: funcionó. La flecha se</tspan></text><text x="470" y="457.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">detiene en la barrera ensayada.</tspan></text><text x="470" y="504.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en las publicaciones de Meta y Cloudflare; no es una conclusión de esas fuentes. Hechos de Meta Engineering (5 de octubre de 2021).</tspan></text></svg>
