<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 496" width="940" height="496" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dependencias y puntos únicos de fallo de la red de Meta ese día</title><desc id="d">Mapa de dependencias: la red troncal global es el centro; de ella dependen el DNS en el borde, la regla de salud del DNS, el acceso primario, el acceso fuera de banda, las herramientas internas que usan DNS, y el acceso físico a las instalaciones, endurecido por diseño; la auditoría de comandos es la única barrera antes del cambio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="496" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dependencias y puntos únicos de fallo de la red de Meta ese día</tspan></text><rect x="340" y="161" width="260" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="191.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Red troncal global: único camino</tspan></text><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">entre instalaciones</tspan></text><rect x="340" y="51" width="260" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">Auditoría de comandos: barrera</tspan></text><text x="470" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">única</tspan></text><rect x="20" y="71" width="250" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="145" y="101.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="145" dy="0">DNS en el borde y regla de</tspan></text><text x="145" y="117.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="145" dy="0">salud</tspan></text><rect x="670" y="71" width="250" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="795" y="101.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="795" dy="0">Acceso primario y fuera de</tspan></text><text x="795" y="117.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="795" dy="0">banda</tspan></text><rect x="20" y="261" width="250" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="145" y="291.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="145" dy="0">Herramientas internas que</tspan></text><text x="145" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="145" dy="0">dependen del DNS</tspan></text><rect x="340" y="281" width="260" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="311.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Acceso físico endurecido por</tspan></text><text x="470" y="327.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">diseño</tspan></text><rect x="670" y="261" width="250" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="795" y="291.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">Reinicio gradual: depende de la</tspan></text><text x="795" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">energía y de las cachés</tspan></text><polyline points="470,111 470,161" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="340,186 270,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="600,186 670,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="340,211 270,286" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,281 470,231" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="600,211 670,286" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="373" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: las cajas rojas dependen directamente de la red troncal; sin ella no hay datos, ni DNS, ni acceso para</tspan></text><text x="470" y="414.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">operarla, ni herramientas. El único camino de recuperación que no pasaba por la red era el acceso físico, y estaba diseñado</tspan></text><text x="470" y="431.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">para ser lento.</tspan></text><text x="470" y="478.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en las publicaciones de Meta y Cloudflare; no es una conclusión de esas fuentes.</tspan></text></svg>
