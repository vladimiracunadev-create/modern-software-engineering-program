<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 506" width="940" height="506" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Radio de explosión: un comando sobre toda la red frente a un comando limitado a una región</title><desc id="d">Dos cuadrículas de veinte círculos que representan instalaciones: a la izquierda, el comando afecta a todas y quedan todas desconectadas; a la derecha, con un límite de alcance, el mismo comando solo afecta a una región de cuatro instalaciones y las demás siguen operativas. Modelo didáctico con valores ilustrativos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="506" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Radio de explosión: un comando sobre toda la red frente a un comando limitado a una región</tspan></text><text x="14" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Como ocurrió: el comando alcanzó todas las conexiones de la red troncal</tspan></text><text x="490" y="63" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="490" dy="0">Con límite de alcance (ilustrativo): una región cada vez</tspan></text><circle cx="40" cy="107" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="40" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="40" dy="0"></tspan></text><circle cx="520" cy="107" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="520" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="520" dy="0"></tspan></text><circle cx="94" cy="107" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="94" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="94" dy="0"></tspan></text><circle cx="574" cy="107" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="574" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="574" dy="0"></tspan></text><circle cx="148" cy="107" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="148" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="148" dy="0"></tspan></text><circle cx="628" cy="107" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="628" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="628" dy="0"></tspan></text><circle cx="202" cy="107" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="202" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="202" dy="0"></tspan></text><circle cx="682" cy="107" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="682" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="682" dy="0"></tspan></text><circle cx="256" cy="107" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="256" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="256" dy="0"></tspan></text><circle cx="736" cy="107" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="736" y="112" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="736" dy="0"></tspan></text><circle cx="40" cy="153" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="40" y="158" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="40" dy="0"></tspan></text><circle cx="520" cy="153" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520" y="158" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="520" dy="0"></tspan></text><circle cx="94" cy="153" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="94" y="158" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="94" dy="0"></tspan></text><circle cx="574" cy="153" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="574" y="158" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="574" dy="0"></tspan></text><circle cx="148" cy="153" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="148" y="158" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="148" dy="0"></tspan></text><circle cx="628" cy="153" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="628" y="158" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="628" dy="0"></tspan></text><circle cx="202" cy="153" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="202" y="158" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="202" dy="0"></tspan></text><circle cx="682" cy="153" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="682" y="158" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="682" dy="0"></tspan></text><circle cx="256" cy="153" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="256" y="158" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="256" dy="0"></tspan></text><circle cx="736" cy="153" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="736" y="158" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="736" dy="0"></tspan></text><circle cx="40" cy="199" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="40" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="40" dy="0"></tspan></text><circle cx="520" cy="199" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="520" dy="0"></tspan></text><circle cx="94" cy="199" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="94" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="94" dy="0"></tspan></text><circle cx="574" cy="199" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="574" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="574" dy="0"></tspan></text><circle cx="148" cy="199" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="148" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="148" dy="0"></tspan></text><circle cx="628" cy="199" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="628" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="628" dy="0"></tspan></text><circle cx="202" cy="199" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="202" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="202" dy="0"></tspan></text><circle cx="682" cy="199" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="682" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="682" dy="0"></tspan></text><circle cx="256" cy="199" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="256" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="256" dy="0"></tspan></text><circle cx="736" cy="199" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="736" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="736" dy="0"></tspan></text><circle cx="40" cy="245" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="40" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="40" dy="0"></tspan></text><circle cx="520" cy="245" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="520" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="520" dy="0"></tspan></text><circle cx="94" cy="245" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="94" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="94" dy="0"></tspan></text><circle cx="574" cy="245" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="574" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="574" dy="0"></tspan></text><circle cx="148" cy="245" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="148" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="148" dy="0"></tspan></text><circle cx="628" cy="245" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="628" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="628" dy="0"></tspan></text><circle cx="202" cy="245" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="202" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="202" dy="0"></tspan></text><circle cx="682" cy="245" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="682" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="682" dy="0"></tspan></text><circle cx="256" cy="245" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="256" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="256" dy="0"></tspan></text><circle cx="736" cy="245" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="736" y="250" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="736" dy="0"></tspan></text><rect x="10" y="301" width="440" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="230" y="324.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="230" dy="0">20 de 20 instalaciones desconectadas: ninguna queda para</tspan></text><text x="230" y="340.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="230" dy="0">operar a las demás</tspan></text><rect x="490" y="301" width="440" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="710" y="324.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="710" dy="0">4 de 20 desconectadas: quedan 16 con red y herramientas</tspan></text><text x="710" y="340.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="710" dy="0">para recuperar</tspan></text><rect x="10" y="383" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="407.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el tamaño del daño lo fija el alcance máximo que un solo comando puede tener, no la probabilidad del error.</tspan></text><text x="470" y="424.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Con un límite de alcance, el mismo error habría sido un incidente regional. Los números son ilustrativos: Meta no publicó</tspan></text><text x="470" y="441.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuántas instalaciones tiene ni su reparto.</tspan></text><text x="470" y="488.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Modelo didáctico con valores ilustrativos; no son datos de Meta. Hecho de base: Meta Engineering (5 de octubre de 2021).</tspan></text></svg>
