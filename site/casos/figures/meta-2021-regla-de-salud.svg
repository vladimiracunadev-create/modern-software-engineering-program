<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La regla de salud del DNS como máquina de estados</title><desc id="d">Máquina de estados con dos estados: anunciando, donde el servidor DNS anuncia sus rutas BGP, y retirado, donde las ha retirado; la pérdida de contacto con los centros de datos lleva a retirado y la recuperación de la red troncal debe devolver a anunciando, mientras en retirado el DNS es inalcanzable aunque funcione.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La regla de salud del DNS como máquina de estados</tspan></text><rect x="60" y="111" width="260" height="100" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="190" y="148" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="190" dy="0">Anunciando: el servidor DNS</tspan></text><text x="190" y="164.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="190" dy="0">anuncia sus rutas por BGP y</tspan></text><text x="190" y="181.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="190" dy="0">responde consultas</tspan></text><rect x="560" y="111" width="260" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="690" y="148" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="690" dy="0">Retirado: ha quitado sus</tspan></text><text x="690" y="164.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="690" dy="0">anuncios; sigue operativo pero</tspan></text><text x="690" y="181.28" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="690" dy="0">nadie puede alcanzarlo</tspan></text><polyline points="320,141 560,141" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="440" y="123" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="440" dy="0">pierde contacto con los centros de datos</tspan></text><polyline points="560,186 320,186" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="440" y="211" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="440" dy="0">vuelve la conectividad de la red troncal</tspan></text><rect x="60" y="251" width="400" height="72" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="260" y="282.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="260" dy="0">Intención de diseño: no enviar usuarios a un sitio</tspan></text><text x="260" y="298.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="260" dy="0">roto si el servidor se cree aislado</tspan></text><rect x="500" y="251" width="420" height="72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="710" y="282.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="710" dy="0">Efecto emergente: si todos los servidores se creen</tspan></text><text x="710" y="298.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="710" dy="0">aislados a la vez, internet pierde todos los DNS</tspan></text><rect x="10" y="347" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="371.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la regla es local y razonable; el problema es que su señal («no veo los centros de datos») era la misma para</tspan></text><text x="470" y="388.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">todos cuando la causa estaba en la red troncal global. La transición de regreso es lo que se vio como actividad BGP a las</tspan></text><text x="470" y="405.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">21:00 UTC. Los nombres de los estados son nuestros.</tspan></text><text x="470" y="452.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Meta Engineering (5 de octubre de 2021) y Cloudflare, «Understanding how Facebook disappeared from the Internet» (4 de octubre de 2021). Máquina de estados: modelo propio.</tspan></text></svg>
