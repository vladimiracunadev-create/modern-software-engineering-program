<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 306" width="940" height="306" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La tormenta de reintentos: lo que le costó a terceros que Facebook cayera</title><desc id="d">Barras horizontales: las consultas DNS en los resolvedores de todo el mundo, expresadas como múltiplo de lo habitual, pasan de uno a unas treinta veces durante el apagón, según Cloudflare.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="306" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La tormenta de reintentos: lo que le costó a terceros que Facebook cayera</tspan></text><line x1="274" y1="49" x2="274" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="125" x2="274" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="430.47" y1="49" x2="430.47" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="430.47" y1="125" x2="430.47" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="430.47" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="430.47" dy="0">10</tspan></text><line x1="586.94" y1="49" x2="586.94" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="586.94" y1="125" x2="586.94" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="586.94" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="586.94" dy="0">20</tspan></text><line x1="743.41" y1="49" x2="743.41" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="743.41" y1="125" x2="743.41" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="743.41" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="743.41" dy="0">30</tspan></text><line x1="899.88" y1="49" x2="899.88" y2="125" stroke="#d5dde1" stroke-width="1"/><line x1="899.88" y1="125" x2="899.88" y2="130" stroke="#5b7280" stroke-width="1.4"/><text x="899.88" y="146" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="899.88" dy="0">40</tspan></text><line x1="274" y1="125" x2="899.88" y2="125" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Consultas DNS habituales</tspan></text><text x="264" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="264" dy="0">Durante el apagón de Facebook</tspan></text><rect x="274" y="55" width="15.647" height="26" rx="3" fill="#c0432f"/><text x="296.647" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="296.647" dy="0">1</tspan></text><rect x="274" y="93" width="469.41" height="26" rx="3" fill="#c0432f"/><text x="750.41" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="750.41" dy="0">30</tspan></text><text x="586.94" y="169" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="586.94" dy="0">Veces las consultas habituales (Cloudflare)</tspan></text><rect x="10" y="183" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="207.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El aumento lo causan los reintentos agresivos de aplicaciones y usuarios ante errores SERVFAIL. Cloudflare dice que su</tspan></text><text x="470" y="224.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resolvedor 1.1.1.1 siguió sirviendo con impacto mínimo: la mayoría de las consultas se resolvían en menos de 10 ms. La</tspan></text><text x="470" y="241.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">caída de un gran servicio se transforma en carga para el resto de internet.</tspan></text><text x="470" y="288.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Cloudflare, «Understanding how Facebook disappeared from the Internet» (4 de octubre de 2021). La cifra es la que da Cloudflare («30x»).</tspan></text></svg>
