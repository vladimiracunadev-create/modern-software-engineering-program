<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 497" width="940" height="497" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Alternativas descartadas: tres bifurcaciones y qué habrían costado (análisis propio)</title><desc id="d">Tres filas de decisión con la opción elegida y la alternativa: reconstruir el centro de datos o migrar a la nube; comprar CDN comercial o construir Open Connect; seguir con licencias o producir contenido propio; cada alternativa lleva su coste probable.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="497" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Alternativas descartadas: tres bifurcaciones y qué habrían costado (análisis propio)</tspan></text><rect x="10" y="56" width="120" height="92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="70" y="105.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="70" dy="0">Plataforma</tspan></text><rect x="146" y="56" width="250" height="92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="271" y="97.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="271" dy="0">Elegida: mover todo a AWS</tspan></text><text x="271" y="113.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="271" dy="0">(2008-2016)</tspan></text><rect x="412" y="56" width="250" height="92" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="537" y="97.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Alternativa: ampliar el centro</tspan></text><text x="537" y="113.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">de datos con más servidores</tspan></text><rect x="678" y="56" width="252" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="804" y="80.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">Habría conservado el punto</tspan></text><text x="804" y="97.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">único de fallo de 2008 y</tspan></text><text x="804" y="113.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">exigido comprar capacidad para</tspan></text><text x="804" y="130.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">el pico</tspan></text><polyline points="396,102 412,102" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="662,102 678,102" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="164" width="120" height="92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="70" y="205.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="70" dy="0">Entrega de</tspan></text><text x="70" y="221.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="70" dy="0">vídeo</tspan></text><rect x="146" y="164" width="250" height="92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="271" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="271" dy="0">Elegida: red propia Open</tspan></text><text x="271" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="271" dy="0">Connect (2012)</tspan></text><rect x="412" y="164" width="250" height="92" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="537" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Alternativa: contratar CDN</tspan></text><text x="537" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">comerciales con pago por GB</tspan></text><rect x="678" y="164" width="252" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="804" y="188.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">Coste variable alto al crecer</tspan></text><text x="804" y="205.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">el streaming y menos control;</tspan></text><text x="804" y="221.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">solo con datos internos se</tspan></text><text x="804" y="238.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">podría comparar</tspan></text><polyline points="396,210 412,210" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="662,210 678,210" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="272" width="120" height="92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="70" y="321.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="70" dy="0">Contenido</tspan></text><rect x="146" y="272" width="250" height="92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="271" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="271" dy="0">Elegida: producir originales</tspan></text><text x="271" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="271" dy="0">(2013)</tspan></text><rect x="412" y="272" width="250" height="92" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="537" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">Alternativa: seguir licenciando</tspan></text><text x="537" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="537" dy="0">catálogo ajeno</tspan></text><rect x="678" y="272" width="252" height="92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="804" y="296.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">Dependencia de estudios que</tspan></text><text x="804" y="313.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">endurecen licencias; ahorra</tspan></text><text x="804" y="329.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">caja inicial pero no crea un</tspan></text><text x="804" y="346.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="804" dy="0">activo propio</tspan></text><polyline points="396,318 412,318" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="662,318 678,318" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="388" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="412.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Es un análisis propio, no un hecho: Netflix no publica qué evaluó y descartó ni sus números internos. Lo documentado es la</tspan></text><text x="470" y="429.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">opción elegida y el motivo declarado de cada una (fallo de 2008, red propia, originales desde 2013). Los costes de la</tspan></text><text x="470" y="446.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">alternativa son hipótesis razonadas con la teoría de decisiones reversibles del curso.</tspan></text><text x="470" y="483.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Esquema pedagógico: las cajas punteadas son inferencia del curso, no arquitectura confirmada por Netflix.</tspan></text></svg>
