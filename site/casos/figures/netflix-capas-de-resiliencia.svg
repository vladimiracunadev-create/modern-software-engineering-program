<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 487" width="940" height="487" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Capas de resiliencia que Netflix describió en su blog (2011-2016)</title><desc id="d">Diagrama por capas de la plataforma de control: una puerta de entrada que reparte tráfico entre regiones, servicios que envuelven cada dependencia con un interruptor y una respuesta alternativa, cachés y bases de datos replicadas entre regiones, y herramientas que apagan instancias a propósito para comprobar que nada se rompe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="487" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Capas de resiliencia que Netflix describió en su blog (2011-2016)</tspan></text><rect x="10" y="52" width="190" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="87.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Puerta de entrada</tspan></text><rect x="212" y="52" width="718" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="571" y="79.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="571" dy="0">Zuul 2: filtros asíncronos y no bloqueantes que dirigen el tráfico, y DNS que mueve usuarios</tspan></text><text x="571" y="95.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="571" dy="0">entre regiones</tspan></text><rect x="10" y="132" width="190" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="167.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Servicios</tspan></text><rect x="212" y="132" width="718" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="571" y="159.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">Cada llamada a una dependencia se envuelve con medición de fallos, interruptor y respuesta</tspan></text><text x="571" y="175.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">alternativa (Hystrix)</tspan></text><rect x="10" y="212" width="190" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="247.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Datos y caché</tspan></text><rect x="212" y="212" width="718" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="571" y="239.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">EVCache (memcached en RAM) y Cassandra replicada entre regiones; el estado vive fuera de los</tspan></text><text x="571" y="255.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">servicios</tspan></text><rect x="10" y="292" width="190" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="327.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Verificación</tspan></text><rect x="212" y="292" width="718" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="571" y="327.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="571" dy="0">Chaos Monkey apaga instancias en producción; el chaos engineering formaliza el experimento</tspan></text><polyline points="105,116 105,132" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="105,196 105,212" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="105,276 105,292" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="378" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="402.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Todo lo dibujado aparece en artículos del blog técnico de Netflix; el orden por capas es una simplificación del curso.</tspan></text><text x="470" y="419.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cuántos servicios hay, cómo se agrupan hoy y qué ha sustituido a cada herramienta no está en estas fuentes, y el blog</tspan></text><text x="470" y="436.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">advierte que sus entradas retratan un momento concreto.</tspan></text><text x="470" y="473.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
