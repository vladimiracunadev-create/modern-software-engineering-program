<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 2, contenedores: de la puerta de entrada a los datos y a la red de vídeo</title><desc id="d">Diagrama de contenedores: dispositivos llegan a una puerta de entrada Zuul; detrás hay una capa de API y servicios con Hystrix y descubrimiento Eureka, cachés EVCache, bases de datos replicadas, telemetría y el pipeline de codificación; el vídeo sale de las Open Connect Appliances.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 2, contenedores: de la puerta de entrada a los datos y a la red de vídeo</tspan></text><rect x="10" y="80" width="170" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="95" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="95" dy="0">Dispositivos: TV,</tspan></text><text x="95" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="95" dy="0">móvil, web, consola</tspan></text><rect x="200" y="48" width="540" height="262" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="214" y="70" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="214" dy="0">Nube de AWS (documentado: la mayor parte del cómputo)</tspan></text><rect x="218" y="84" width="150" height="64" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="293" y="103" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">Zuul: puerta de</tspan></text><text x="293" y="119.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">entrada con</tspan></text><text x="293" y="136.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="293" dy="0">filtros</tspan></text><rect x="386" y="84" width="170" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="471" y="111.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="471" dy="0">API y servicios de</tspan></text><text x="471" y="127.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="471" dy="0">negocio</tspan></text><rect x="574" y="84" width="150" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="649" y="111.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="649" dy="0">Eureka: registro</tspan></text><text x="649" y="127.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="649" dy="0">de instancias</tspan></text><rect x="218" y="172" width="150" height="64" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="293" y="191" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="293" dy="0">Hystrix:</tspan></text><text x="293" y="207.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="293" dy="0">interruptor y</tspan></text><text x="293" y="224.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="293" dy="0">alternativa</tspan></text><rect x="386" y="172" width="170" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="471" y="199.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="471" dy="0">EVCache: memcached</tspan></text><text x="471" y="215.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="471" dy="0">en RAM</tspan></text><rect x="574" y="172" width="150" height="64" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="649" y="199.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="649" dy="0">Cassandra y otras</tspan></text><text x="649" y="215.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="649" dy="0">bases</tspan></text><rect x="218" y="246" width="506" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="471" y="267.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="471" dy="0">Telemetría, recomendación y codificación de vídeo (inferido por</tspan></text><text x="471" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="471" dy="0">función)</tspan></text><rect x="760" y="48" width="170" height="262" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="774" y="70" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="774" dy="0">Red de entrega</tspan></text><rect x="772" y="84" width="146" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="845" y="104.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="845" dy="0">Open Connect:</tspan></text><text x="845" y="121" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="845" dy="0">appliances dentro</tspan></text><text x="845" y="137.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="845" dy="0">de ISP y en</tspan></text><text x="845" y="154.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="845" dy="0">puntos de</tspan></text><text x="845" y="170.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="845" dy="0">intercambio</tspan></text><rect x="772" y="196" width="146" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="845" y="235.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="845" dy="0">Vídeo en</tspan></text><text x="845" y="251.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="845" dy="0">segmentos</tspan></text><polyline points="180,110 218,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="368,116 386,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="556,116 574,116" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="470,148 470,172" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="556,204 574,204" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="95,140 95,330 845,330 845,310" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="470" y="324" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">vídeo</tspan></text><polyline points="845,180 845,196" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="350" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: Zuul como puerta de entrada de todas las peticiones (wiki de Zuul), Hystrix con interruptor y respuesta</tspan></text><text x="470" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">alternativa (wiki de Hystrix), Eureka para localizar servicios de la capa intermedia (wiki de Eureka), EVCache como caché</tspan></text><text x="470" y="408.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">volátil, que la mayor parte del cómputo corre sobre AWS y que Open Connect es una red propia. Inferido: dónde están las</tspan></text><text x="470" y="424.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">bases hoy y los servicios de negocio y de telemetría; el número de servicios es desconocido.</tspan></text><text x="470" y="462.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
