<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 378" width="940" height="378" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se amortiza cada año: contenido licenciado y producido (miles de millones de USD)</title><desc id="d">Barras apiladas de la amortización de contenido de Netflix en 2023, 2024 y 2025: el contenido licenciado pasa de 7,1 a 7,7 y a 8,7 miles de millones, el producido de 7,1 a 7,6 y a 7,7; el total sube de 14,2 a 15,3 y a 16,4.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="378" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se amortiza cada año: contenido licenciado y producido (miles de millones de USD)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Licenciado</tspan></text><rect x="139.4" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="159.4" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="159.4" dy="0">Producido</tspan></text><line x1="94" y1="77" x2="94" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="94" y1="197" x2="94" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="94" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="94" dy="0">0</tspan></text><line x1="289.425" y1="77" x2="289.425" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="289.425" y1="197" x2="289.425" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="289.425" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="289.425" dy="0">5</tspan></text><line x1="484.85" y1="77" x2="484.85" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="484.85" y1="197" x2="484.85" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="484.85" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="484.85" dy="0">10</tspan></text><line x1="680.275" y1="77" x2="680.275" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="680.275" y1="197" x2="680.275" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="680.275" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="680.275" dy="0">15</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="197" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="197" x2="875.7" y2="202" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="218" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">20</tspan></text><line x1="94" y1="197" x2="875.7" y2="197" stroke="#5b7280" stroke-width="1.6"/><text x="84" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84" dy="0">2023</tspan></text><text x="84" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84" dy="0">2024</tspan></text><text x="84" y="181.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84" dy="0">2025</tspan></text><rect x="94" y="84" width="279.262" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="233.631" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="233.631" dy="0">7,1</tspan></text><rect x="373.262" y="84" width="275.627" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="511.076" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="511.076" dy="0">7,1</tspan></text><text x="655.89" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="655.89" dy="0">14,2</tspan></text><rect x="94" y="124" width="300.525" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="244.262" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="244.262" dy="0">7,7</tspan></text><rect x="394.525" y="124" width="297.554" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="543.302" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="543.302" dy="0">7,6</tspan></text><text x="699.079" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="699.079" dy="0">15,3</tspan></text><rect x="94" y="164" width="340.587" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="264.293" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="264.293" dy="0">8,7</tspan></text><rect x="434.587" y="164" width="301.306" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="585.24" y="181.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="585.24" dy="0">7,7</tspan></text><text x="742.893" y="181.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="742.893" dy="0">16,4</tspan></text><text x="484.85" y="241" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="484.85" dy="0">miles de millones de USD</tspan></text><rect x="10" y="255" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="279.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La amortización de contenido es 42 por ciento de los ingresos en 2023, 39 en 2024 y 36 en 2025 (cálculo propio con los</tspan></text><text x="470" y="296.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ingresos del 10-K). Las adiciones a activos de contenido fueron 12,6, 16,2 y 17,1 miles de millones: la caja sale antes que</tspan></text><text x="470" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el gasto contable en el contenido propio.</tspan></text><text x="470" y="360.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Netflix, Form 10-K de 2025, de 2016 y de 2007 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
