<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 457" width="940" height="457" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 6, datos: qué vive dónde y cuánta inconsistencia tolera cada pieza</title><desc id="d">Diagrama de modelo de datos y flujos: la caché EVCache guarda datos efímeros con caducidad y puede perderlos; las bases replicadas guardan el estado de cuenta y perfil con consistencia eventual; la facturación y los datos de clientes viajaron al final por un camino seguro y duradero; los eventos de uso alimentan recomendación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="457" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 6, datos: qué vive dónde y cuánta inconsistencia tolera cada pieza</tspan></text><rect x="10" y="60" width="290" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="155" y="84.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="155" dy="0">Efímero y volátil: EVCache (TTL,</tspan></text><text x="155" y="100.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="155" dy="0">puede evictarse)</tspan></text><rect x="325" y="60" width="290" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="470" y="84.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">Replicado: cuenta y perfil (eventual,</tspan></text><text x="470" y="100.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">inferido)</tspan></text><rect x="640" y="60" width="290" height="58" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="785" y="84.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785" dy="0">Duradero y seguro: facturación y</tspan></text><text x="785" y="100.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785" dy="0">datos de clientes</tspan></text><rect x="10" y="130" width="290" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="158.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">Si se pierde: se vuelve a calcular o</tspan></text><text x="155" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">leer del origen. Tolera datos algo</tspan></text><text x="155" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">viejos y no exige consistencia fuerte</tspan></text><text x="155" y="208.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">(blog de 2016)</tspan></text><rect x="325" y="130" width="290" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="470" y="158.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Si divergen: se elige seguir</tspan></text><text x="470" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">sirviendo y reconciliar después. La</tspan></text><text x="470" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">política exacta por tipo de dato no</tspan></text><text x="470" y="208.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">se sabe</tspan></text><rect x="640" y="130" width="290" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="167" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">Si falla: cobro o cuenta incorrectos;</tspan></text><text x="785" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">por eso fue lo último en migrar a la</tspan></text><text x="785" y="200.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">nube (carta de 2016)</tspan></text><polyline points="155,118 155,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,118 470,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="785,118 785,130" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="250" width="920" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="470" y="275.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Flujo: la reproducción genera eventos de uso, que alimentan recomendación y operación (inferido) y vuelven al catálogo que</tspan></text><text x="470" y="291.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">ve el miembro, siempre a través de una caché que prioriza velocidad</tspan></text><text x="14" y="336" font-size="13" text-anchor="start" font-weight="400" fill="#32505f"><tspan x="14" dy="0">Trazo continuo: documentado en una fuente citada. Trazo punteado: inferido por el curso.</tspan></text><rect x="10" y="348" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada columna ordena un tipo de dato por el coste de equivocarse, de menor a mayor. Documentado: la naturaleza efímera de</tspan></text><text x="470" y="389.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">EVCache y que la facturación migró al final y por un camino seguro y duradero. Inferido: dónde viven cuenta y perfil. No se</tspan></text><text x="470" y="406.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sabe: el modelo de datos real, los esquemas y el volumen almacenado.</tspan></text><text x="470" y="443.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
