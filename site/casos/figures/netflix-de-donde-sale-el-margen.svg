<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 338" width="940" height="338" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde va cada dólar de ingresos de Netflix (2023 y 2024, miles de millones de USD)</title><desc id="d">Barras apiladas al 100 por ciento para 2023 y 2024: el coste de los ingresos pasa de 19,7 a 21,0 miles de millones, marketing más tecnología y desarrollo de 5,3 a 5,8, administración estable en 1,7 y el resultado operativo de 7,0 a 10,4, de modo que el margen sube de 21 a 27 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="338" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde va cada dólar de ingresos de Netflix (2023 y 2024, miles de millones de USD)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Coste de los ingresos</tspan></text><rect x="222.34" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="242.34" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="242.34" dy="0">Marketing + tecnología y desarrollo</tspan></text><rect x="534.24" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="554.24" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="554.24" dy="0">Administración</tspan></text><rect x="687.8" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="707.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="707.8" dy="0">Resultado operativo</tspan></text><line x1="214" y1="77" x2="214" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="157" x2="214" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="379.425" y1="77" x2="379.425" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="379.425" y1="157" x2="379.425" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="379.425" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="379.425" dy="0">25</tspan></text><line x1="544.85" y1="77" x2="544.85" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="544.85" y1="157" x2="544.85" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="544.85" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="544.85" dy="0">50</tspan></text><line x1="710.275" y1="77" x2="710.275" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="710.275" y1="157" x2="710.275" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="710.275" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="710.275" dy="0">75</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="157" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="157" x2="875.7" y2="162" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">100</tspan></text><line x1="214" y1="157" x2="875.7" y2="157" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">2023 (ingresos 33,7)</tspan></text><text x="204" y="141.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="204" dy="0">2024 (ingresos 39,0)</tspan></text><rect x="214" y="84" width="386.973" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="407.486" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="407.486" dy="0">58 %</tspan></text><rect x="600.973" y="84" width="104.593" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="653.269" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="653.269" dy="0">16 %</tspan></text><rect x="705.565" y="84" width="33.7522" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="722.441" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="722.441" dy="0">5 %</tspan></text><rect x="739.318" y="84" width="136.382" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="807.509" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="807.509" dy="0">21 %</tspan></text><text x="882.7" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><rect x="214" y="124" width="356.979" height="26" fill="#102a43" stroke="#ffffff" stroke-width="1.5"/><text x="392.489" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392.489" dy="0">54 %</tspan></text><rect x="570.979" y="124" width="99.0853" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="620.521" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="620.521" dy="0">15 %</tspan></text><rect x="670.064" y="124" width="28.8433" height="26" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><rect x="698.907" y="124" width="176.793" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="787.304" y="141.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="787.304" dy="0">27 %</tspan></text><text x="882.7" y="141.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="882.7" dy="0">100 %</tspan></text><text x="544.85" y="201" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="544.85" dy="0">% del total</tspan></text><rect x="10" y="215" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La mejora de margen viene de que los ingresos crecieron 16 por ciento y el coste de los ingresos solo 7 por ciento.</tspan></text><text x="470" y="256.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«Marketing + tecnología y desarrollo» agrupa dos líneas del estado de resultados. No se conoce el reparto interno entre</tspan></text><text x="470" y="273.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">infraestructura y contenido.</tspan></text><text x="470" y="320.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Netflix, Q4&#x27;24 Earnings 8-K (estado de resultados). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
