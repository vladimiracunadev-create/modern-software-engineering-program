<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 5, despliegue: tres capas geográficas que no se mezclan</title><desc id="d">Diagrama de despliegue: el DNS dirige al miembro hacia una de varias regiones de nube donde corre el plano de control con datos replicados entre regiones; el vídeo sale de appliances Open Connect dentro de más de mil proveedores de internet y puntos de intercambio, rellenados cada noche desde centros de datos de Netflix.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 5, despliegue: tres capas geográficas que no se mezclan</tspan></text><rect x="10" y="50" width="300" height="130" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="72" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Miembro y su red</tspan></text><rect x="26" y="88" width="126" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="89" y="118.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89" dy="0">Aplicación del</tspan></text><text x="89" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89" dy="0">miembro</tspan></text><rect x="166" y="88" width="130" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="231" y="110" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231" dy="0">DNS: decide la</tspan></text><text x="231" y="126.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231" dy="0">región de</tspan></text><text x="231" y="143.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="231" dy="0">control</tspan></text><rect x="340" y="50" width="590" height="130" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="354" y="72" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="354" dy="0">Plano de control: varias regiones de AWS (documentado en 2013)</tspan></text><rect x="356" y="88" width="170" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="441" y="118.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="441" dy="0">Región A: Zuul,</tspan></text><text x="441" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="441" dy="0">servicios, EVCache</tspan></text><rect x="540" y="88" width="170" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="625" y="118.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="625" dy="0">Región B: la misma</tspan></text><text x="625" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="625" dy="0">pila</tspan></text><rect x="724" y="88" width="190" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="819" y="110" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="819" dy="0">Datos replicados entre</tspan></text><text x="819" y="126.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="819" dy="0">regiones (Cassandra y</tspan></text><text x="819" y="143.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="819" dy="0">EVCache)</tspan></text><polyline points="296,123 356,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="526,123 540,123" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="710,123 724,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="210" width="560" height="120" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="232" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="24" dy="0">Plano de datos: Open Connect dentro de la red del ISP</tspan></text><rect x="26" y="248" width="160" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="106" y="268" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="106" dy="0">Appliance dentro</tspan></text><text x="106" y="284.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="106" dy="0">del ISP, sin cargo</tspan></text><text x="106" y="301.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="106" dy="0">si califica</tspan></text><rect x="200" y="248" width="170" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="285" y="268" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="285" dy="0">Punto de intercambio</tspan></text><text x="285" y="284.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="285" dy="0">con interconexión</tspan></text><text x="285" y="301.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="285" dy="0">sin liquidación</tspan></text><rect x="384" y="248" width="170" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="469" y="268" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="469" dy="0">Más de mil ISP con</tspan></text><text x="469" y="284.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="469" dy="0">appliances (página</tspan></text><text x="469" y="301.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="469" dy="0">oficial)</tspan></text><rect x="600" y="210" width="330" height="120" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="614" y="232" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="614" dy="0">Abastecimiento</tspan></text><rect x="616" y="248" width="298" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="765" y="276.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765" dy="0">Centros de datos de Netflix (más de</tspan></text><text x="765" y="292.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="765" dy="0">60) rellenan los appliances cada noche</tspan></text><polyline points="616,280 554,280" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="89,158 89,210" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="350" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="374.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en openconnect.netflix.com: appliances embebidos sin cargo para ISP calificados, interconexión en puntos de</tspan></text><text x="470" y="391.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">intercambio, relleno nocturno, más de mil ISP y más de 60 centros de datos; y en el artículo de 2013, la pila en varias</tspan></text><text x="470" y="408.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">regiones con datos replicados. No se sabe cuántas regiones activas hay hoy ni el reparto del tráfico entre appliances y</tspan></text><text x="470" y="424.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">puntos de intercambio.</tspan></text><text x="470" y="462.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
