<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La economía del DVD: suscriptores a fin de año antes del streaming (millones)</title><desc id="d">Línea de suscriptores de Netflix a fin de año de 2003 a 2007: 1,5; 2,6; 4,2; 6,3 y 7,5 millones; el coste de adquirir un suscriptor se movió entre 32,80 y 42,96 dólares y la rotación fue 4,3 por ciento en 2007.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="492" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La economía del DVD: suscriptores a fin de año antes del streaming (millones)</tspan></text><line x1="63.54" y1="309" x2="910" y2="309" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="309" x2="63.54" y2="309" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="313.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">0</tspan></text><line x1="63.54" y1="246.5" x2="910" y2="246.5" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="246.5" x2="63.54" y2="246.5" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="251" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">2</tspan></text><line x1="63.54" y1="184" x2="910" y2="184" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="184" x2="63.54" y2="184" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="188.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">4</tspan></text><line x1="63.54" y1="121.5" x2="910" y2="121.5" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="121.5" x2="63.54" y2="121.5" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="126" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">6</tspan></text><line x1="63.54" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="58.54" y1="59" x2="63.54" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="54.54" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="54.54" dy="0">8</tspan></text><line x1="63.54" y1="59" x2="63.54" y2="309" stroke="#5b7280" stroke-width="1.6"/><line x1="81.54" y1="59" x2="81.54" y2="309" stroke="#d5dde1" stroke-width="1"/><line x1="81.54" y1="309" x2="81.54" y2="314" stroke="#5b7280" stroke-width="1.4"/><text x="81.54" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="81.54" dy="0">2003</tspan></text><line x1="284.155" y1="59" x2="284.155" y2="309" stroke="#d5dde1" stroke-width="1"/><line x1="284.155" y1="309" x2="284.155" y2="314" stroke="#5b7280" stroke-width="1.4"/><text x="284.155" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284.155" dy="0">2004</tspan></text><line x1="486.77" y1="59" x2="486.77" y2="309" stroke="#d5dde1" stroke-width="1"/><line x1="486.77" y1="309" x2="486.77" y2="314" stroke="#5b7280" stroke-width="1.4"/><text x="486.77" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.77" dy="0">2005</tspan></text><line x1="689.385" y1="59" x2="689.385" y2="309" stroke="#d5dde1" stroke-width="1"/><line x1="689.385" y1="309" x2="689.385" y2="314" stroke="#5b7280" stroke-width="1.4"/><text x="689.385" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="689.385" dy="0">2006</tspan></text><line x1="892" y1="59" x2="892" y2="309" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="309" x2="892" y2="314" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="330" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">2007</tspan></text><line x1="63.54" y1="309" x2="910" y2="309" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 184)">Millones de suscriptores</text><text x="486.77" y="355" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="486.77" dy="0">Fin de año</tspan></text><polyline points="81.54,262.531 284.155,227.438 486.77,178.406 689.385,111.625 892,75.2812" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="81.54" cy="262.531" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="81.54" y="251.531" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="81.54" dy="0">1,5</tspan></text><circle cx="284.155" cy="227.438" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="284.155" y="216.438" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="284.155" dy="0">2,6</tspan></text><circle cx="486.77" cy="178.406" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="486.77" y="167.406" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="486.77" dy="0">4,2</tspan></text><circle cx="689.385" cy="111.625" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="689.385" y="100.625" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="689.385" dy="0">6,3</tspan></text><circle cx="892" cy="75.2812" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="64.2812" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">7,5</tspan></text><rect x="10" y="369" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Coste de adquisición por suscriptor: 32,80 USD en 2003, 37,02 en 2004, 38,77 en 2005, 42,96 en 2006 y 40,88 en 2007; margen</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">bruto de 34,8 por ciento en 2007 y rotación de 4,3 por ciento (el 10-K la rotula «anualizada»). Se ve la economía previa al</tspan></text><text x="470" y="427.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">streaming: crecer cuesta unos 40 dólares por suscriptor nuevo.</tspan></text><text x="470" y="474.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Netflix, Form 10-K de 2025, de 2016 y de 2007 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
