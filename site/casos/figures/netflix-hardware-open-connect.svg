<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="940" height="510" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos clases de servidor Open Connect: la pequeña como porcentaje de la de almacenamiento</title><desc id="d">Barras del servidor global relativo al de almacenamiento: rendimiento 40 por ciento (80 frente a 200 gigabits por segundo), capacidad 50 por ciento (60 frente a 120 terabytes) y potencia pico 62,5 por ciento (250 frente a 400 vatios).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="510" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos clases de servidor Open Connect: la pequeña como porcentaje de la de almacenamiento</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Servidor global (relativo)</tspan></text><rect x="260.04" y="45" width="12" height="12" rx="2" fill="#102a43"/><text x="280.04" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="280.04" dy="0">Servidor de almacenamiento (base)</tspan></text><line x1="78.62" y1="335" x2="920" y2="335" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="335" x2="78.62" y2="335" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="287" x2="920" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="239" x2="920" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="239" x2="78.62" y2="239" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="243.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="191" x2="920" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="191" x2="78.62" y2="191" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="195.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="143" x2="920" y2="143" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="143" x2="78.62" y2="143" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="147.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="335" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="215" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 215)">% del servidor de almacenamiento</text><rect x="106.666" y="239" width="110.184" height="96" rx="3" fill="#087f8c"/><text x="161.758" y="233" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="161.758" dy="0">40,0</tspan></text><rect x="220.85" y="95" width="110.184" height="240" rx="3" fill="#102a43"/><text x="275.942" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="275.942" dy="0">100,0</tspan></text><text x="218.85" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">Rendimiento</tspan></text><rect x="387.126" y="215" width="110.184" height="120" rx="3" fill="#087f8c"/><text x="442.218" y="209" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="442.218" dy="0">50,0</tspan></text><rect x="501.31" y="95" width="110.184" height="240" rx="3" fill="#102a43"/><text x="556.402" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="556.402" dy="0">100,0</tspan></text><text x="499.31" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Capacidad en bruto</tspan></text><rect x="667.586" y="185" width="110.184" height="150" rx="3" fill="#087f8c"/><text x="722.678" y="179" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="722.678" dy="0">62,5</tspan></text><rect x="781.77" y="95" width="110.184" height="240" rx="3" fill="#102a43"/><text x="836.862" y="89" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="836.862" dy="0">100,0</tspan></text><text x="779.77" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">Potencia pico</tspan></text><rect x="10" y="387" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="411.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Valores absolutos de la ficha oficial: almacenamiento hasta 120 TB, unos 200 Gbps y unos 400 W; global hasta 60 TB, unos 80</tspan></text><text x="470" y="428.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Gbps y unos 250 W. Ambos son servidores 2U con procesador AMD, memoria Micron, discos de estado sólido de Kioxia o Micron y</tspan></text><text x="470" y="445.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tarjetas de red Mellanox y Broadcom. Se aprecia que el servidor pequeño ofrece menos prestaciones por vatio.</tspan></text><text x="470" y="492.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Netflix Open Connect, página de appliances. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
