<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 448" width="940" height="448" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pila de software documentada: tres entornos y sus lenguajes</title><desc id="d">Diagrama de tres entornos: el servidor Open Connect con FreeBSD, NGINX y BIRD; el plano de control en AWS con herramientas de código abierto en Java como Eureka, Zuul, Hystrix y EVCache; y herramientas auxiliares en otros lenguajes: Chaos Monkey en Go, Atlas en Scala, Metaflow en Python y VMAF en C.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="448" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pila de software documentada: tres entornos y sus lenguajes</tspan></text><rect x="10" y="52" width="290" height="250" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="24" dy="0">Servidor de vídeo (Open Connect)</tspan></text><rect x="26" y="92" width="258" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="155" y="115.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="155" dy="0">Sistema operativo: FreeBSD</tspan></text><text x="155" y="131.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="155" dy="0">(versión de desarrollo)</tspan></text><rect x="26" y="158" width="258" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="181.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">Servidor web: NGINX, vídeo por</tspan></text><text x="155" y="197.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">HTTP</tspan></text><rect x="26" y="224" width="258" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="252.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">BIRD: encaminamiento por BGP</tspan></text><text x="155" y="268.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">hacia el control en AWS</tspan></text><rect x="320" y="52" width="300" height="250" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="334" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="334" dy="0">Plano de control en AWS (Java)</tspan></text><rect x="336" y="92" width="268" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="115.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Zuul: puerta de entrada</tspan></text><rect x="336" y="140" width="268" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="163.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Eureka: registro de servicios</tspan></text><rect x="336" y="188" width="268" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="211.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Hystrix: interruptor y alternativa</tspan></text><rect x="336" y="236" width="268" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="258.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">EVCache sobre memcached; Cassandra</tspan></text><text x="470" y="274.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">con Priam</tspan></text><rect x="640" y="52" width="290" height="250" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="654" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="654" dy="0">Herramientas de operación y datos</tspan></text><rect x="656" y="92" width="258" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="115.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">Chaos Monkey (Go, 2016)</tspan></text><rect x="656" y="140" width="258" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="163.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">Atlas: series temporales (Scala)</tspan></text><rect x="656" y="188" width="258" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="213.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">Metaflow: IA y datos (Python)</tspan></text><rect x="656" y="236" width="258" height="54" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="258.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">VMAF: calidad de vídeo percibida</tspan></text><text x="785" y="274.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">(C)</tspan></text><rect x="10" y="322" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="346.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en la página de Open Connect (sistema operativo y servidores), en los repositorios oficiales de GitHub</tspan></text><text x="470" y="363.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(lenguaje y año de creación de cada uno) y en las wikis de Hystrix, Eureka y Zuul. El hecho de que un repositorio exista no</tspan></text><text x="470" y="380.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">prueba que se use hoy con ese nombre: Conductor, Titus y Dispatch figuran como archivados. No se sabe qué bases de datos,</tspan></text><text x="470" y="396.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">colas y orquestadores usa la plataforma actual.</tspan></text><text x="470" y="434.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Netflix citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
