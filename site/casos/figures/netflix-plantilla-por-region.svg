<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 516" width="940" height="516" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde trabaja el personal de Netflix: empleados a tiempo completo por región (31 de diciembre de 2025)</title><desc id="d">Barras de empleados a tiempo completo por región: 10 900 en Estados Unidos y Canadá, 2 500 en Europa, Oriente Medio y África, 1 900 en Asia-Pacífico y 700 en Latinoamérica, de unos 16 000 en total.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="516" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde trabaja el personal de Netflix: empleados a tiempo completo por región (31 de diciembre de 2025)</tspan></text><line x1="101.24" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="307" x2="101.24" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="259" x2="920" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="259" x2="101.24" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">2 500</tspan></text><line x1="101.24" y1="211" x2="920" y2="211" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="211" x2="101.24" y2="211" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">5 000</tspan></text><line x1="101.24" y1="163" x2="920" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="163" x2="101.24" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">7 500</tspan></text><line x1="101.24" y1="115" x2="920" y2="115" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="115" x2="101.24" y2="115" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="67" x2="101.24" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">12 500</tspan></text><line x1="101.24" y1="67" x2="101.24" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">personas</text><rect x="121.709" y="97.72" width="163.752" height="209.28" rx="3" fill="#102a43"/><text x="203.585" y="91.72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="203.585" dy="0">10 900</tspan></text><text x="203.585" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="203.585" dy="0">EE. UU. y Canadá</tspan></text><rect x="326.399" y="259" width="163.752" height="48" rx="3" fill="#102a43"/><text x="408.275" y="253" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="408.275" dy="0">2 500</tspan></text><text x="408.275" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="408.275" dy="0">Europa, Oriente Medio y</tspan></text><text x="408.275" y="345" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="408.275" dy="0">África</tspan></text><rect x="531.089" y="270.52" width="163.752" height="36.48" rx="3" fill="#102a43"/><text x="612.965" y="264.52" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="612.965" dy="0">1 900</tspan></text><text x="612.965" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612.965" dy="0">Asia-Pacífico</tspan></text><rect x="735.779" y="293.56" width="163.752" height="13.44" rx="3" fill="#102a43"/><text x="817.655" y="287.56" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="817.655" dy="0">700</tspan></text><text x="817.655" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817.655" dy="0">Latinoamérica</tspan></text><rect x="10" y="376" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="400.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Representan 68, 16, 12 y 4 por ciento de unos 16 000; no incluyen al personal de producción temporal o a tiempo parcial.</tspan></text><text x="470" y="417.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los ingresos de 2025 se reparten 44, 32, 12 y 12 por ciento entre las mismas regiones (UCAN, EMEA, APAC y LATAM, ver la</tspan></text><text x="470" y="434.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">figura de ingresos): la plantilla está más concentrada en Norteamérica que los ingresos. El 10-K no publica la plantilla</tspan></text><text x="470" y="450.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por función (ingeniería, contenido).</tspan></text><text x="470" y="498.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Netflix, Form 10-K de 2025, de 2016 y de 2007 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
