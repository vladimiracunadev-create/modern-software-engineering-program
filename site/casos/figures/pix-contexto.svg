<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El Pix entre pagadores, instituciones y el Banco Central</title><desc id="d">Diagrama de contexto: el pagador inicia el pago desde la aplicación de su institución; la institución del pagador consulta el directorio de claves y envía la orden al sistema de liquidación del Banco Central; la institución del receptor acredita; el Banco Central regula el arreglo y opera el sistema de liquidación y el directorio; los iniciadores de pago y Open Finance se conectan a las instituciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El Pix entre pagadores, instituciones y el Banco Central</tspan></text><rect x="24" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="131" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">Pagador: persona, empresa</tspan></text><text x="131" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">o gobierno con cuenta en</tspan></text><text x="131" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">un participante</tspan></text><rect x="250" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Receptor: acredita en</tspan></text><text x="357" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">segundos, a cualquier hora</tspan></text><rect x="476" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="583" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">Participantes del Pix: 214</tspan></text><text x="583" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">directos y 693 indirectos</tspan></text><text x="583" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">en 2025</tspan></text><rect x="702" y="51" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="809" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">SPI: sistema de</tspan></text><text x="809" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">liquidación del Banco</tspan></text><text x="809" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">Central (24 horas, 7 días)</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="221.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Pix: arreglo de pagos instantáneos</tspan></text><text x="470" y="239.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">regulado y operado por el Banco Central</tspan></text><polyline points="131,125 334.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">inicia</tspan></text><polyline points="357,125 424.8,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">recibe</tspan></text><polyline points="583,125 515.2,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">operan cuentas</tspan></text><polyline points="809,125 605.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">liquida</tspan></text><rect x="24" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="131" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">DICT: directorio de claves</tspan></text><text x="131" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">vinculadas a cuentas</tspan></text><rect x="250" y="345" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="357" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Iniciadores de pago y Open</tspan></text><text x="357" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="357" dy="0">Finance</tspan></text><rect x="476" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="583" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">Foro Pix: gobernanza con</tspan></text><text x="583" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">los agentes del mercado</tspan></text><rect x="702" y="345" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="809" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="809" dy="0">Fraude y estafas: riesgo</tspan></text><text x="809" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="809" dy="0">que el diseño debe</tspan></text><text x="809" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="809" dy="0">contener</tspan></text><polyline points="334.4,259 131,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">resuelve</tspan></text><polyline points="424.8,259 357,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">inician</tspan></text><polyline points="515.2,259 583,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">consulta</tspan></text><polyline points="605.6,259 809,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">amenaza</tspan></text><rect x="10" y="439" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en los informes del Banco Central: el Banco Central definió las reglas y además desarrolla, opera y gestiona la</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">infraestructura del Pix (SPI y DICT); los participantes proveen cuentas, y existen iniciadores de pago y liquidantes</tspan></text><text x="470" y="497.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">especiales. Dónde deja de valer: no muestra volúmenes por actor.</tspan></text><text x="470" y="544.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Banco Central do Brasil, Relatório de Gestão do Pix 2020-2022, consulta 2026-11-23.</tspan></text></svg>
