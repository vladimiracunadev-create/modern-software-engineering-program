<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se financia el Pix: sin comisión para el pagador, con recuperación de costes en el SPI</title><desc id="d">Flujo del dinero: el pagador no paga por el Pix en el SPI; los participantes directos que reciben el crédito pagan al Banco Central un centavo de real por cada diez Pix liquidados; el Banco Central fija las tarifas solo para recuperar costes de las tecnologías que operan el SPI; las instituciones deciden qué cobran a empresas y qué servicios ofrecen.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="14" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Pagador: gratuito para</tspan></text><text x="111" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">las personas</tspan></text><rect x="256" y="14" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="43" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Institución del pagador:</tspan></text><text x="357" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">no se tarifa por emitir</tspan></text><text x="357" y="76.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">un Pix</tspan></text><polyline points="212,56 256,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="603" y="34.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">Institución del</tspan></text><text x="603" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">receptor: paga R$ 0,01</tspan></text><text x="603" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">por cada diez Pix</tspan></text><text x="603" y="84.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">recibidos</tspan></text><polyline points="458,56 502,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="43" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">Banco Central: recupera</tspan></text><text x="849" y="59.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">los costes del SPI, sin</tspan></text><text x="849" y="76.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">buscar beneficio</tspan></text><polyline points="704,56 748,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="202" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="111" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">Los Pix que fallan no se</tspan></text><text x="111" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">tarifan</tspan></text><rect x="256" y="138" width="202" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="167" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Extracto de la cuenta de</tspan></text><text x="357" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">liquidación: R$ 3,00 por</tspan></text><text x="357" y="200.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">MB</tspan></text><polyline points="212,180 256,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="138" width="202" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="603" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">Empresas: coste menor</tspan></text><text x="603" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="603" dy="0">que con otros medios</tspan></text><polyline points="458,180 502,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="138" width="202" height="84" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="849" y="167" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="849" dy="0">Costes y márgenes de</tspan></text><text x="849" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="849" dy="0">cada institución: no</tspan></text><text x="849" y="200.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="849" dy="0">publicados</tspan></text><polyline points="704,180 748,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="849,98 849,118 111,118 111,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado en el informe anual del SPI de 2025 (tarifas) y en el informe de gestión (gratuito para personas y de menor coste</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">para empresas). No se sabe: los ingresos y costes de las instituciones por el Pix. Dónde deja de valer: la tarifa es de la</tspan></text><text x="480" y="294.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">liquidación en el SPI, no de lo que cobra cada banco a sus clientes.</tspan></text><text x="480" y="335.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuentes: Relatório Anual do SPI 2025 y Relatório de Gestão do Pix 2020-2022 (Banco Central do Brasil).</tspan></text></svg>
