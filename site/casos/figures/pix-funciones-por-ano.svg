<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué funciones sumó el Pix de 2020 a 2025</title><desc id="d">Línea de tiempo por años con tres carriles: arranque (lanzamiento en noviembre de 2020), seguridad (bloqueo cautelar y MED en 2021, límites nocturnos en 2022, MED de autoservicio en 2025) y productos (retiro y vuelto en 2021, Pix Agendado en 2024, Pix por aproximación y Pix Automático en 2025).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué funciones sumó el Pix de 2020 a 2025</tspan></text><line x1="104.54" y1="83" x2="104.54" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="104.54" y1="221" x2="104.54" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="104.54" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="104.54" dy="0">2020</tspan></text><line x1="239.117" y1="83" x2="239.117" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="239.117" y1="221" x2="239.117" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="239.117" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="239.117" dy="0">2021</tspan></text><line x1="373.693" y1="83" x2="373.693" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="373.693" y1="221" x2="373.693" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="373.693" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="373.693" dy="0">2022</tspan></text><line x1="508.27" y1="83" x2="508.27" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="508.27" y1="221" x2="508.27" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="508.27" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="508.27" dy="0">2023</tspan></text><line x1="642.847" y1="83" x2="642.847" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="642.847" y1="221" x2="642.847" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="642.847" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642.847" dy="0">2024</tspan></text><line x1="777.423" y1="83" x2="777.423" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="777.423" y1="221" x2="777.423" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="777.423" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="777.423" dy="0">2025</tspan></text><line x1="912" y1="83" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="221" x2="912" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2026</tspan></text><line x1="104.54" y1="221" x2="912" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="94.54" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="94.54" dy="0">Arranque</tspan></text><text x="94.54" y="156.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="94.54" dy="0">Seguridad</tspan></text><text x="94.54" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="94.54" dy="0">Productos</tspan></text><line x1="222.967" y1="75" x2="222.967" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="222.967" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="222.967" dy="0">lanzamiento</tspan></text><line x1="357.544" y1="75" x2="357.544" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="357.544" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="357.544" dy="0">MED</tspan></text><line x1="440.982" y1="75" x2="440.982" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="444.144" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="444.144" dy="0">límites nocturnos</tspan></text><line x1="817.796" y1="75" x2="817.796" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="817.796" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="817.796" dy="0">Automático</tspan></text><rect x="222.967" y="92" width="16.1492" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="129" x2="912" y2="129" stroke="#d5dde1" stroke-width="1"/><rect x="357.544" y="138" width="16.1492" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="440.982" y="138" width="26.9153" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="817.796" y="138" width="26.9153" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="279.49" y="184" width="26.9153" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="683.22" y="184" width="26.9153" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><rect x="804.339" y="184" width="26.9153" height="28" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="508.27" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="508.27" dy="0">año</tspan></text><rect x="10" y="279" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en la línea de tiempo oficial del informe de gestión 2023-2025: 2021 retiro y vuelto, bloqueo cautelar, MED e</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">iniciación de pago por Open Finance; 2022 límites nocturnos y código QR dinámico; 2023 mayor integración con Open Finance;</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2024 recorrido sin redirección y Pix Agendado; 2025 Pix por aproximación, Pix Automático y MED de autoservicio. Dónde deja</tspan></text><text x="470" y="353.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de valer: los marcadores indican el año y no el mes.</tspan></text><text x="470" y="401.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Banco Central do Brasil, Relatório de Gestão do Pix 2023-2025, consulta 2026-11-23.</tspan></text></svg>
