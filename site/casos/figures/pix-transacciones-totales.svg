<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Transacciones del Pix, todos los canales, 2024 y 2025</title><desc id="d">Barras en miles de millones: unas 63 en 2024 y casi 80 en 2025, un aumento de 25,7 por ciento; el valor de 2025 superó 35 billones de reales, 33,8 por ciento más.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Transacciones del Pix, todos los canales, 2024 y 2025</tspan></text><line x1="71.08" y1="297" x2="920" y2="297" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="297" x2="71.08" y2="297" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="301.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="239.5" x2="920" y2="239.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="239.5" x2="71.08" y2="239.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="244" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="182" x2="920" y2="182" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="182" x2="71.08" y2="182" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="124.5" x2="920" y2="124.5" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="124.5" x2="71.08" y2="124.5" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="129" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">60</tspan></text><line x1="71.08" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="67" x2="71.08" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">80</tspan></text><line x1="71.08" y1="67" x2="71.08" y2="297" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="182" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 182)">miles de millones de transacciones</text><rect x="113.526" y="114.438" width="339.568" height="182.562" rx="3" fill="#087f8c"/><text x="283.31" y="108.438" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="283.31" dy="0">63,5</tspan></text><text x="283.31" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">2024 (cálculo propio)</tspan></text><rect x="537.986" y="67.575" width="339.568" height="229.425" rx="3" fill="#087f8c"/><text x="707.77" y="61.575" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="707.77" dy="0">79,8</tspan></text><text x="707.77" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">2025</tspan></text><rect x="10" y="349" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El informe da casi 80 mil millones en 2025 y un aumento de 25,7 %; la cifra de 2024 es el cálculo propio 79,8 entre 1,257.</tspan></text><text x="470" y="390.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El récord diario fue de 313 339 328 transacciones el 5 de diciembre de 2025. Dónde deja de valer: la cifra de 2025 es «casi</tspan></text><text x="470" y="407.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">80», no un recuento exacto.</tspan></text><text x="470" y="454.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Banco Central do Brasil, Relatório de Gestão do Pix 2023-2025, consulta 2026-11-23.</tspan></text></svg>
