<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 466" width="940" height="466" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién usó el Pix en diciembre de 2025 y cuántas claves hay</title><desc id="d">Barras en millones: 148 millones de personas físicas y 12 millones de empresas hicieron o recibieron un Pix en diciembre de 2025, y había más de 920 millones de claves Pix registradas, 67 por ciento más que en diciembre de 2022.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="466" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién usó el Pix en diciembre de 2025 y cuántas claves hay</tspan></text><line x1="93.7" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="307" x2="93.7" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="259" x2="920" y2="259" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="259" x2="93.7" y2="259" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="263.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">200</tspan></text><line x1="93.7" y1="211" x2="920" y2="211" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="211" x2="93.7" y2="211" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="215.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">400</tspan></text><line x1="93.7" y1="163" x2="920" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="163" x2="93.7" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">600</tspan></text><line x1="93.7" y1="115" x2="920" y2="115" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="115" x2="93.7" y2="115" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">800</tspan></text><line x1="93.7" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="67" x2="93.7" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="67" x2="93.7" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">millones</text><rect x="121.243" y="271.48" width="220.347" height="35.52" rx="3" fill="#087f8c"/><text x="231.417" y="265.48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.417" dy="0">148</tspan></text><text x="231.417" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Personas físicas activas</tspan></text><rect x="396.677" y="304.12" width="220.347" height="2.88" rx="3" fill="#087f8c"/><text x="506.85" y="298.12" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">12</tspan></text><text x="506.85" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Empresas activas</tspan></text><rect x="672.11" y="86.2" width="220.347" height="220.8" rx="3" fill="#087f8c"/><text x="782.283" y="80.2" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="782.283" dy="0">920</tspan></text><text x="782.283" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Claves registradas</tspan></text><rect x="10" y="359" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Una persona o empresa puede tener varias claves (hasta cinco por cuenta para personas físicas y hasta veinte para</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">empresas), por eso hay más claves que usuarios. Dónde deja de valer: «más de 920 millones» es un mínimo.</tspan></text><text x="470" y="448.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Banco Central do Brasil, Relatório de Gestão do Pix 2023-2025, consulta 2026-11-23.</tspan></text></svg>
