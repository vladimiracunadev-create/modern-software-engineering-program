<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El Pix típico es pequeño: percentiles del valor en diciembre de 2025</title><desc id="d">Barras en reales y escala logarítmica: la mitad de los Pix liquidados vale menos de 36 reales, el 90 por ciento menos de 400 y el 99 por ciento menos de 3 900; el valor medio fue de 443,29 reales y el mayor Pix individual liquidado fue de 3 500 millones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El Pix típico es pequeño: percentiles del valor en diciembre de 2025</tspan></text><line x1="101.24" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="307" x2="101.24" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10</tspan></text><line x1="101.24" y1="227" x2="920" y2="227" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="227" x2="101.24" y2="227" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="231.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">100</tspan></text><line x1="101.24" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="147" x2="101.24" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">1 000</tspan></text><line x1="101.24" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="67" x2="101.24" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="67" x2="101.24" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">reales (escala logarítmica) (escala logarítmica)</text><rect x="121.709" y="262.496" width="163.752" height="44.5042" rx="3" fill="#946512"/><text x="203.585" y="256.496" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="203.585" dy="0">36</tspan></text><text x="203.585" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="203.585" dy="0">Mediana (50 %)</tspan></text><rect x="326.399" y="178.835" width="163.752" height="128.165" rx="3" fill="#946512"/><text x="408.275" y="172.835" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="408.275" dy="0">400</tspan></text><text x="408.275" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="408.275" dy="0">Percentil 90</tspan></text><rect x="531.089" y="175.265" width="163.752" height="131.735" rx="3" fill="#946512"/><text x="612.965" y="169.265" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="612.965" dy="0">443</tspan></text><text x="612.965" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="612.965" dy="0">Valor medio</tspan></text><rect x="735.779" y="99.7148" width="163.752" height="207.285" rx="3" fill="#946512"/><text x="817.655" y="93.7148" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="817.655" dy="0">3 900</tspan></text><text x="817.655" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817.655" dy="0">Percentil 99</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El valor medio (443 reales) es mucho mayor que la mediana (36) porque unos pocos pagos grandes arrastran el promedio. Mire</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la distancia entre la primera y la última barra: más de 100 veces. Dónde deja de valer: son Pix interbancarios liquidados</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">por el SPI en un mes.</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Banco Central do Brasil, Relatório Anual do SPI 2025, consulta 2026-11-23.</tspan></text></svg>
