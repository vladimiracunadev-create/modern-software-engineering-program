<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 508" width="940" height="508" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De Pathway a la ley de 2024, en nueve hitos</title><desc id="d">Eje no proporcional con nueve hitos: 1996-1999 proyecto Pathway; 2000 Legacy Horizon; 2005 error de Callendar Square; 2009 informe de Computer Weekly; agosto de 2010 informe interno sobre integridad del sistema; 2010 Horizon Online; julio de 2012 revisión de Second Sight; diciembre de 2019 sentencia Bates; abril de 2021 anulación de 39 condenas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="508" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De Pathway a la ley de 2024, en nueve hitos</tspan></text><line x1="30" y1="205" x2="910" y2="205" stroke="#32505f" stroke-width="2"/><line x1="80" y1="205" x2="80" y2="165" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="80" cy="205" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="80" y="210" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="80" dy="0"></tspan></text><rect x="6" y="55" width="170" height="110" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="91" y="80.36" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">1996-1999: proyecto</tspan></text><text x="91" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">Pathway con ICL, el</tspan></text><text x="91" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">Post Office y la</tspan></text><text x="91" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">Agencia de</tspan></text><text x="91" y="146.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="91" dy="0">Prestaciones</tspan></text><line x1="177.5" y1="205" x2="177.5" y2="245" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="177.5" cy="205" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177.5" y="210" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="177.5" dy="0"></tspan></text><rect x="92.5" y="245" width="170" height="110" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="177.5" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="177.5" dy="0">2000: Legacy Horizon</tspan></text><text x="177.5" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="177.5" dy="0">en uso (hasta 2010)</tspan></text><line x1="275" y1="205" x2="275" y2="165" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="275" cy="205" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="275" y="210" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="275" dy="0"></tspan></text><rect x="190" y="55" width="170" height="110" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="275" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="275" dy="0">2005: error de</tspan></text><text x="275" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="275" dy="0">Callendar Square</tspan></text><line x1="372.5" y1="205" x2="372.5" y2="245" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="372.5" cy="205" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="372.5" y="210" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="372.5" dy="0"></tspan></text><rect x="287.5" y="245" width="170" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="372.5" y="287" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="372.5" dy="0">2009: Computer</tspan></text><text x="372.5" y="303.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="372.5" dy="0">Weekly informa de</tspan></text><text x="372.5" y="320.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="372.5" dy="0">problemas</tspan></text><line x1="470" y1="205" x2="470" y2="165" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="470" cy="205" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="210" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0"></tspan></text><rect x="385" y="55" width="170" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Ago 2010: informe</tspan></text><text x="470" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">interno afirma que</tspan></text><text x="470" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Horizon es robusto</tspan></text><line x1="567.5" y1="205" x2="567.5" y2="245" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="567.5" cy="205" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567.5" y="210" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="567.5" dy="0"></tspan></text><rect x="482.5" y="245" width="170" height="110" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="567.5" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="567.5" dy="0">2010: entra Horizon</tspan></text><text x="567.5" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="567.5" dy="0">Online</tspan></text><line x1="665" y1="205" x2="665" y2="165" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="665" cy="205" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="665" y="210" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="665" dy="0"></tspan></text><rect x="580" y="55" width="170" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="665" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="665" dy="0">Jul 2012: Second</tspan></text><text x="665" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="665" dy="0">Sight revisa el</tspan></text><text x="665" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="665" dy="0">sistema</tspan></text><line x1="762.5" y1="205" x2="762.5" y2="245" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="762.5" cy="205" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="762.5" y="210" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="762.5" dy="0"></tspan></text><rect x="677.5" y="245" width="170" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="762.5" y="287" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="762.5" dy="0">16 dic 2019:</tspan></text><text x="762.5" y="303.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="762.5" dy="0">sentencia Bates (n.º</tspan></text><text x="762.5" y="320.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="762.5" dy="0">6)</tspan></text><line x1="860" y1="205" x2="860" y2="165" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="860" cy="205" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="860" y="210" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="860" dy="0"></tspan></text><rect x="764" y="55" width="170" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="849" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">23 abr 2021: se</tspan></text><text x="849" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="849" dy="0">anulan 39 condenas</tspan></text><rect x="10" y="385" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="409.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: pasaron seis años entre la primera señal pública en 2009 y las primeras solicitudes a la CCRC en 2015, y más</tspan></text><text x="470" y="426.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de diez hasta la sentencia. Mira que la revisión de 2012 llegó dos años después de un informe interno que ponderó las</tspan></text><text x="470" y="443.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consecuencias de dudar.</tspan></text><text x="470" y="490.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Bates v Post Office (n.º 6), [2019] EWHC 3408 (QB). Fuente: Hamilton v Post Office, [2021] EWCA Crim 577.</tspan></text></svg>
