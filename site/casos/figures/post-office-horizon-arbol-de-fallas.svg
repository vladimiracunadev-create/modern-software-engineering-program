<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 634" width="940" height="634" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: qué tuvo que coincidir para que las discrepancias fueran condenas</title><desc id="d">Árbol de fallas con condenas y deudas erróneas arriba y dos ramas necesarias: que Horizon mostrara discrepancias que no existían, con tres condiciones, y que la organización las tratara como hechos probados, con cinco.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="634" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: qué tuvo que coincidir para que las discrepancias fueran condenas</tspan></text><rect x="270" y="51" width="400" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Condenas y deudas erróneas</tspan></text><circle cx="470" cy="115" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="120" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><polyline points="470,91 470,103" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="155" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="232.5" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="232.5" dy="0">A. Horizon muestra faltantes que no eran reales</tspan></text><line x1="470" y1="127" x2="232.5" y2="155" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="232.5" cy="217" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232.5" y="222" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232.5" dy="0">Y</tspan></text><line x1="232.5" y1="195" x2="232.5" y2="207" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="239" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="257.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Errores y defectos con riesgo material de</tspan></text><text x="232.5" y="274.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">inexactitud</tspan></text><line x1="232.5" y1="231" x2="232.5" y2="239" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="294.28" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Acceso remoto que podía modificar cuentas sin</tspan></text><text x="232.5" y="329.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">conocimiento del subpostmaster</tspan></text><line x1="232.5" y1="286.28" x2="232.5" y2="294.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="349.56" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="368.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Sin forma de detectar y registrar la discrepancia</tspan></text><text x="232.5" y="385.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">como discutida</tspan></text><line x1="232.5" y1="341.56" x2="232.5" y2="349.56" stroke="#8a9aa3" stroke-width="1.4"/><rect x="485" y="155" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="707.5" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="707.5" dy="0">B. La organización los trata como hechos</tspan></text><line x1="470" y1="127" x2="707.5" y2="155" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="707.5" cy="217" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707.5" y="222" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707.5" dy="0">Y</tspan></text><line x1="707.5" y1="195" x2="707.5" y2="207" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="239" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="262.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Contrato y práctica: el faltante debía cubrirse</tspan></text><line x1="707.5" y1="231" x2="707.5" y2="239" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="287" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="310.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Posición de que el sistema era fiable</tspan></text><line x1="707.5" y1="279" x2="707.5" y2="287" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="335" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="358.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Errores conocidos no divulgados a la defensa</tspan></text><line x1="707.5" y1="327" x2="707.5" y2="335" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="383" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="401.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Investigación pobre; carga de la prueba sobre el</tspan></text><text x="707.5" y="418.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">subpostmaster</tspan></text><line x1="707.5" y1="375" x2="707.5" y2="383" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="438.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="461.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Quien reclamaba era también quien perseguía</tspan></text><line x1="707.5" y1="430.28" x2="707.5" y2="438.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="494.28" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="519.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: cortar cualquier condición de A o de B habría debilitado la cadena. Mira que A es técnica y B es</tspan></text><text x="470" y="535.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">institucional, y que B tiene más condiciones: es más fácil cortarla por B. Estructura lógica propia sobre lo que los</tspan></text><text x="470" y="552.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tribunales establecen.</tspan></text><text x="470" y="600.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Hamilton v Post Office, [2021] EWCA Crim 577. Fuente: Bates v Post Office (n.º 6), [2019] EWHC 3408 (QB). Análisis propio,</tspan></text><text x="470" y="616" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">no conclusión de los tribunales ni de la investigación.</tspan></text></svg>
