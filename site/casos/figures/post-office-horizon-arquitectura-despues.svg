<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La arquitectura «después»: el sistema y su entorno cuando el sistema puede equivocarse</title><desc id="d">Cadena objetivo: estado de disputa por discrepancia, registro de cambios remotos visible, errores conocidos publicados a los usuarios afectados, investigación independiente antes de reclamar, decisión de perseguir fuera del organismo reclamante y revisión periódica independiente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La arquitectura «después»: el sistema y su entorno cuando el sistema puede equivocarse</tspan></text><rect x="10" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">Cada discrepancia tiene estado «en</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">disputa» y un registro</tspan></text><rect x="330" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Acciones remotas sobre cuentas</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">visibles para el usuario afectado</tspan></text><rect x="650" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">Errores conocidos accesibles a los</tspan></text><text x="790" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">usuarios afectados y a la defensa</tspan></text><polyline points="290,74.64 330,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,74.64 650,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,98.28 790,113.28 150,113.28 150,132.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132.28" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">Investigación independiente antes</tspan></text><text x="150" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">de reclamar</tspan></text><rect x="330" y="132.28" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Decisión de perseguir fuera de</tspan></text><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">quien reclama</tspan></text><rect x="650" y="132.28" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">Revisión independiente periódica</tspan></text><text x="790" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">con resultados públicos</tspan></text><polyline points="290,155.92 330,155.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,155.92 650,155.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="195.56" width="920" height="59.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="220.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: son controles de diseño, de datos y de gobierno; ninguno exige una tecnología nueva. Diseño didáctico</tspan></text><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">apoyado en lo que los tribunales y la investigación señalan; no describe lo que el Post Office haya implantado.</tspan></text><text x="470" y="284.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio, no conclusión de los tribunales ni de la investigación.</tspan></text></svg>
