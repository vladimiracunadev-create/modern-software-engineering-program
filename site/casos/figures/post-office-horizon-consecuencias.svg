<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" width="940" height="270" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Consecuencias fechadas: de la sentencia civil a la reparación</title><desc id="d">Cadena de consecuencias: sentencia de la High Court el 16 de diciembre de 2019; anulación de 39 condenas el 23 de abril de 2021; ley que anula condenas el 24 de mayo de 2024; volumen 1 del informe de la investigación pública el 8 de julio de 2025, con 19 recomendaciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="270" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Consecuencias fechadas: de la sentencia civil a la reparación</tspan></text><rect x="10" y="51" width="200" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">16 dic 2019: la High</tspan></text><text x="110" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Court examina el sistema</tspan></text><text x="110" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">(n.º 6)</tspan></text><rect x="250" y="51" width="200" height="80.56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="350" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="350" dy="0">23 abr 2021: el Court of</tspan></text><text x="350" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="350" dy="0">Appeal anula 39 condenas</tspan></text><rect x="490" y="51" width="200" height="80.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="590" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">24 may 2024: ley que</tspan></text><text x="590" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">anula condenas en su</tspan></text><text x="590" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">ámbito</tspan></text><rect x="730" y="51" width="200" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">8 jul 2025: volumen 1</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">del informe de la</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">investigación, con 19</tspan></text><text x="830" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="830" dy="0">recomendaciones</tspan></text><polyline points="210,91.28 250,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,91.28 490,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,91.28 730,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="147.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="172.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: cada etapa cierra una parte del daño y deja otra abierta; los demás volúmenes del informe de la</tspan></text><text x="470" y="189.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">investigación están pendientes. Mira que las etapas son de tribunales, Parlamento e investigación, no de la empresa.</tspan></text><text x="470" y="236.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Bates v Post Office (n.º 6), [2019] EWHC 3408 (QB). Fuente: Hamilton v Post Office, [2021] EWCA Crim 577. Fuente: Post</tspan></text><text x="470" y="252" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">Office (Horizon System) Offences Act 2024. Fuente: Post Office Horizon IT Inquiry, informe final, vol. 1 (jul 2025).</tspan></text></svg>
