<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién estaba en cada lado del mostrador de Horizon</title><desc id="d">Diagrama de contexto: el Post Office contrata a subpostmasters que atienden sucursales; el sistema Horizon, proporcionado por Fujitsu, registra las transacciones y produce las cuentas de cada sucursal; el propio Post Office usaba esas cuentas para reclamar faltantes y, en algunos casos, para perseguir penalmente; tribunales, Parlamento e investigación pública revisaron lo ocurrido.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="410" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién estaba en cada lado del mostrador de Horizon</tspan></text><rect x="10" y="51" width="200" height="80.56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">Post Office: operador de</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">la red, empleador o</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">contratante y, en estos</tspan></text><text x="110" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="110" dy="0">casos, acusador</tspan></text><rect x="10" y="145.56" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="164.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Subpostmasters, gerentes</tspan></text><text x="110" y="181.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">y ayudantes de mostrador</tspan></text><rect x="10" y="206.84" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="225.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Clientes de las</tspan></text><text x="110" y="242.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">sucursales</tspan></text><rect x="730" y="51" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Fujitsu: proveedor y</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">soporte técnico</tspan></text><rect x="730" y="112.28" width="200" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="830" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">Tribunales: High Court y</tspan></text><text x="830" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">Court of Appeal</tspan></text><rect x="730" y="173.56" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="192.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">Parlamento, Gobierno</tspan></text><text x="830" y="209.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">como accionista e</tspan></text><text x="830" y="225.8" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">investigación pública</tspan></text><rect x="280" y="51" width="370" height="221.84" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">Sistema Horizon</tspan></text><rect x="300" y="91" width="330" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="109.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Terminales en los mostradores de las</tspan></text><text x="465" y="126.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">sucursales</tspan></text><rect x="300" y="148.28" width="330" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="175.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Cuentas de la sucursal y balance periódico</tspan></text><rect x="300" y="205.56" width="330" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="224.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Servicio de asistencia y registros</tspan></text><text x="465" y="241.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">internos del proveedor</tspan></text><polyline points="210,91.28 280,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="83.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">contrata</tspan></text><polyline points="210,169.2 280,169.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="161.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">opera</tspan></text><polyline points="210,230.48 280,230.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="222.48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">atiende</tspan></text><polyline points="650,74.64 730,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">suministra</tspan></text><polyline points="650,135.92 730,135.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="127.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">juzgan</tspan></text><polyline points="650,205.52 730,205.52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="197.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">supervisan</tspan></text><rect x="10" y="286.84" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="311.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: quien operaba la red, quien reclamaba el dinero y, a veces, quien perseguía penalmente era la misma</tspan></text><text x="470" y="328.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">organización, y la prueba central era un sistema que el otro lado no podía examinar. La caja roja es la que los tribunales</tspan></text><text x="470" y="345.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sometieron a examen.</tspan></text><text x="470" y="392.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Bates v Post Office (n.º 6), [2019] EWHC 3408 (QB). Fuente: Hamilton v Post Office, [2021] EWCA Crim 577.</tspan></text></svg>
