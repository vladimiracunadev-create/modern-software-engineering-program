<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 336" width="940" height="336" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se llegaba de una transacción a una deuda: el flujo de una sucursal</title><desc id="d">Cadena del flujo contable de una sucursal: cada transacción se registra en el terminal; Horizon acumula las cuentas; al cierre del periodo la sucursal acepta el balance; si aparece un faltante, el contrato o la práctica del Post Office lo trataba como deuda del subpostmaster; el subpostmaster podía llamar a la asistencia, pero no había función de disputa en el sistema.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="336" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo se llegaba de una transacción a una deuda: el flujo de una sucursal</tspan></text><rect x="10" y="51" width="200" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Transacciones</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">registradas en el</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">terminal de la sucursal</tspan></text><rect x="250" y="51" width="200" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="350" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="350" dy="0">Horizon acumula las</tspan></text><text x="350" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="350" dy="0">cuentas de la sucursal</tspan></text><rect x="490" y="51" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="590" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">Cierre de periodo: el</tspan></text><text x="590" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">subpostmaster acepta el</tspan></text><text x="590" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="590" dy="0">balance</tspan></text><rect x="730" y="51" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">Aparece un faltante en</tspan></text><text x="830" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">las cuentas</tspan></text><polyline points="210,82.96 250,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,82.96 490,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,82.96 730,82.96" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="830,114.92 830,129.92 110,129.92 110,148.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="148.92" width="200" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="167.88" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="110" dy="0">Llamada a la asistencia;</tspan></text><text x="110" y="184.52" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="110" dy="0">sin función de disputa</tspan></text><text x="110" y="201.16" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="110" dy="0">en el sistema</tspan></text><rect x="250" y="148.92" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="350" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">El faltante se trata</tspan></text><text x="350" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">como deuda que hay que</tspan></text><text x="350" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">cubrir</tspan></text><rect x="490" y="148.92" width="200" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="590" y="176.2" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">Descuentos de la</tspan></text><text x="590" y="192.84" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">remuneración o cese</tspan></text><polyline points="210,180.88 250,180.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,180.88 490,180.88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="228.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="253.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el sistema no ofrecía a quien veía un faltante un camino para marcarlo como disputado; el único modo de</tspan></text><text x="470" y="270.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">plantear un problema era una llamada. Mira la quinta caja: fue una decisión de diseño documentada, no una omisión.</tspan></text><text x="470" y="318.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Bates v Post Office (n.º 6), [2019] EWHC 3408 (QB). Fuente: Hamilton v Post Office, [2021] EWCA Crim 577.</tspan></text></svg>
