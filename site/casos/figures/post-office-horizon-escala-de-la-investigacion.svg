<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 328" width="940" height="328" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La escala de la investigación pública: días, testigos y documentos</title><desc id="d">Barras horizontales en escala logarítmica con la actividad de la investigación hasta el informe de julio de 2025: 226 días de audiencias, 298 testigos con declaración oral y unos 274 604 documentos aportados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="328" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La escala de la investigación pública: días, testigos y documentos</tspan></text><line x1="294" y1="49" x2="294" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="294" y1="163" x2="294" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="294" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="294" dy="0">100</tspan></text><line x1="435.395" y1="49" x2="435.395" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="435.395" y1="163" x2="435.395" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="435.395" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435.395" dy="0">1 000</tspan></text><line x1="576.79" y1="49" x2="576.79" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="576.79" y1="163" x2="576.79" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="576.79" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="576.79" dy="0">10 000</tspan></text><line x1="718.185" y1="49" x2="718.185" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="718.185" y1="163" x2="718.185" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="718.185" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="718.185" dy="0">100 000</tspan></text><line x1="859.58" y1="49" x2="859.58" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="163" x2="859.58" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">1 000 000</tspan></text><line x1="294" y1="163" x2="859.58" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="284" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Días de audiencias</tspan></text><text x="284" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Testigos con declaración oral</tspan></text><text x="284" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="284" dy="0">Documentos aportados</tspan></text><rect x="294" y="55" width="50.0692" height="26" rx="3" fill="#102a43"/><text x="351.069" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="351.069" dy="0">226</tspan></text><rect x="294" y="93" width="67.0518" height="26" rx="3" fill="#102a43"/><text x="368.052" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="368.052" dy="0">298</tspan></text><rect x="294" y="131" width="486.216" height="26" rx="3" fill="#102a43"/><text x="787.216" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="787.216" dy="0">274 604</tspan></text><text x="576.79" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="576.79" dy="0">Cantidad (escala logarítmica) (escala logarítmica)</tspan></text><rect x="10" y="221" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La escala es logarítmica porque el número de documentos es mil veces mayor que los otros dos; no compares longitudes. Son</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cifras de actividad del proceso, no de resultados.</tspan></text><text x="470" y="310.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Post Office Horizon IT Inquiry, informe final, vol. 1 (jul 2025).</tspan></text></svg>
