<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 384" width="940" height="384" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El impacto humano según el volumen 1 del informe final</title><desc id="d">Tres columnas con lo que recoge el volumen 1 a partir de 17 relatos de primera mano: salud y bienestar, situación económica y consecuencias legales y reputacionales, incluido que algunas personas fallecieron antes de recibir una compensación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="384" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El impacto humano según el volumen 1 del informe final</tspan></text><rect x="10" y="51" width="294.667" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="157.333" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="157.333" dy="0">Salud y vida personal</tspan></text><rect x="10" y="101" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Algunas personas enfermaron</tspan></text><text x="157.333" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">gravemente</tspan></text><rect x="10" y="156.28" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Problemas de salud mental, incluida</tspan></text><text x="157.333" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">adicción al alcohol</tspan></text><rect x="10" y="211.56" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Algunas personas fallecieron antes de</tspan></text><text x="157.333" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">recibir compensación</tspan></text><rect x="322.667" y="51" width="294.667" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">Situación económica</tspan></text><rect x="322.667" y="101" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Quiebra de algunas personas</tspan></text><rect x="322.667" y="149" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Responsabilidad por pequeñas sumas</tspan></text><text x="470" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">supuestamente perdidas</tspan></text><rect x="322.667" y="204.28" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="227.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Impacto financiero en las familias</tspan></text><rect x="635.333" y="51" width="294.667" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782.667" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="782.667" dy="0">Consecuencias legales y</tspan></text><text x="782.667" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="782.667" dy="0">reputacionales</tspan></text><rect x="635.333" y="108.28" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="127.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Algunas personas fueron encarceladas</tspan></text><text x="782.667" y="143.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">injustamente</tspan></text><rect x="635.333" y="163.56" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="187.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Daño reputacional en sus comunidades</tspan></text><rect x="635.333" y="211.56" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">El presidente de la investigación</tspan></text><text x="782.667" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">califica el impacto de «desastroso»</tspan></text><rect x="10" y="276.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="301.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: detrás de cada cifra hay una persona. Este caso recuerda el impacto con respeto y sin detalles personales:</tspan></text><text x="470" y="318.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las fuentes recogen los relatos y este caso solo resume el informe.</tspan></text><text x="470" y="366.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Post Office Horizon IT Inquiry, informe final, vol. 1 (jul 2025).</tspan></text></svg>
