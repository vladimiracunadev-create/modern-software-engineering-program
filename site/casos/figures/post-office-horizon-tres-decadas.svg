<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 514" width="940" height="514" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres décadas: versiones del sistema, litigio y reparación</title><desc id="d">Línea de tiempo en años de 1996 a 2026: desarrollo de Pathway de 1996 a 1999; Legacy Horizon de 2000 a 2010; Horizon Online desde 2010; el litigio civil y penal entre 2012 y 2021; la ley de 2024 y la investigación pública hasta 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="514" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres décadas: versiones del sistema, litigio y reparación</tspan></text><line x1="214" y1="83" x2="214" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="333" x2="214" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">1 996</tspan></text><line x1="310.276" y1="83" x2="310.276" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="310.276" y1="333" x2="310.276" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="310.276" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="310.276" dy="0">2 000</tspan></text><line x1="430.621" y1="83" x2="430.621" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="430.621" y1="333" x2="430.621" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="430.621" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="430.621" dy="0">2 005</tspan></text><line x1="550.966" y1="83" x2="550.966" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="550.966" y1="333" x2="550.966" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="550.966" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="550.966" dy="0">2 010</tspan></text><line x1="671.31" y1="83" x2="671.31" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="671.31" y1="333" x2="671.31" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="671.31" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="671.31" dy="0">2 015</tspan></text><line x1="791.655" y1="83" x2="791.655" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="791.655" y1="333" x2="791.655" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="791.655" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="791.655" dy="0">2 020</tspan></text><line x1="912" y1="83" x2="912" y2="333" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="333" x2="912" y2="338" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="354" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2 025</tspan></text><line x1="214" y1="333" x2="912" y2="333" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Desarrollo (Pathway)</tspan></text><text x="204" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Legacy Horizon</tspan></text><text x="204" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Horizon Online</tspan></text><text x="204" y="262.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Revisión y litigio</tspan></text><text x="204" y="312.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Reparación</tspan></text><line x1="790.692" y1="75" x2="790.692" y2="333" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="790.692" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="790.692" dy="0">2019</tspan></text><line x1="897.559" y1="75" x2="897.559" y2="333" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="897.559" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="897.559" dy="0">2024</tspan></text><rect x="214" y="92" width="93.869" height="32" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="260.934" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="260.934" dy="0">Pathway</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="310.276" y="142" width="240.69" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="430.621" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="430.621" dy="0">Legacy Horizon (2000-2010)</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="550.966" y="192" width="373.069" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="737.5" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="737.5" dy="0">Horizon Online desde 2010</tspan></text><line x1="14" y1="233" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><rect x="611.138" y="242" width="214.214" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="718.245" y="262.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="718.245" dy="0">litigio y apelación</tspan></text><line x1="14" y1="283" x2="912" y2="283" stroke="#d5dde1" stroke-width="1"/><rect x="897.559" y="292" width="28.8828" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="563" y="377" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="563" dy="0">Año</tspan></text><rect x="10" y="391" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="415.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los años de inicio y fin de cada versión son los que dan los tribunales (2000-2010 para Legacy Horizon). Horizon Online</tspan></text><text x="470" y="432.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">aparece hasta 2025 como barra de presencia, no como fecha de retirada: las fuentes verificadas no dan una fecha de</tspan></text><text x="470" y="449.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sustitución. Las marcas son la sentencia de 2019 y la ley de 2024.</tspan></text><text x="470" y="496.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Bates v Post Office (n.º 6), [2019] EWHC 3408 (QB). Fuente: Hamilton v Post Office, [2021] EWCA Crim 577.</tspan></text></svg>
