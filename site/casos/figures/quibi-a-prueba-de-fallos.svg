<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 544" width="940" height="544" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Resiliencia del negocio: qué existía, qué falló, qué no existía y qué debió existir</title><desc id="d">Cuatro columnas. Existían y funcionaron: preventa de publicidad, cierre ordenado con devolución del capital, venta de derechos a Roku. Existían y fallaron: pruebas de cambio de modelo en el verano, prueba gratuita larga, revisión tardía de solo móvil. No existían de forma pública: lanzamiento escalonado, criterios de abandono, tramos de capital. Debieron existir: pruebas por supuesto, tramos de capital, criterios firmados, estudio de alternativas gratuitas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="544" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Resiliencia del negocio: qué existía, qué falló, qué no existía y qué debió existir</tspan></text><rect x="10" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="120.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120.5" dy="0">Existían y funcionaron</tspan></text><rect x="10" y="111" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Preventa de unos 150</tspan></text><text x="120.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">millones de publicidad</tspan></text><rect x="10" y="191" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Cierre ordenado: devolución</tspan></text><text x="120.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">de unos 350 millones</tspan></text><rect x="10" y="271" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Venta del catálogo a Roku</tspan></text><rect x="243" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="353.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.5" dy="0">Existían y fallaron</tspan></text><rect x="243" y="111" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Variantes del verano:</tspan></text><text x="353.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">ninguna cambió la respuesta</tspan></text><rect x="243" y="191" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Prueba gratuita de 90 días:</tspan></text><text x="353.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">datos tardíos</tspan></text><rect x="243" y="271" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Restricción solo móvil</tspan></text><text x="353.5" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">revisada tarde</tspan></text><rect x="476" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="586.5" y="72.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="586.5" dy="0">No existían de forma</tspan></text><text x="586.5" y="88.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="586.5" dy="0">pública</tspan></text><rect x="476" y="111" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Lanzamiento escalonado</tspan></text><text x="586.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">(descartado)</tspan></text><rect x="476" y="191" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Criterios de abandono</tspan></text><text x="586.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">escritos</tspan></text><rect x="476" y="271" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Capital por tramos</tspan></text><rect x="476" y="351" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Estudio público de</tspan></text><text x="586.5" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">alternativas gratuitas</tspan></text><rect x="709" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="819.5" y="72.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="819.5" dy="0">Debieron existir (análisis</tspan></text><text x="819.5" y="88.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="819.5" dy="0">propio)</tspan></text><rect x="709" y="111" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Una prueba barata por</tspan></text><text x="819.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">supuesto</tspan></text><rect x="709" y="191" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Tramos de capital ligados a</tspan></text><text x="819.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">hitos</tspan></text><rect x="709" y="271" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Criterios firmados antes</tspan></text><text x="819.5" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">del gasto</tspan></text><rect x="709" y="351" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Análisis del antecedente</tspan></text><text x="819.5" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Go90</tspan></text><rect x="10" y="437" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La cuarta columna es análisis propio. De resiliencia técnica (disponibilidad y recuperación) no hay datos públicos; ninguna</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fuente reporta caídas.</tspan></text><text x="470" y="526.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: prensa especializada citada en el caso (2018 a 2021); esquema propio.</tspan></text></svg>
