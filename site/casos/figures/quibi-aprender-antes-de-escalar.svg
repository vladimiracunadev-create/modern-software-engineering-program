<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una forma de aprender antes de gastar todo (análisis propio)</title><desc id="d">Dos recorridos. Arriba, el recorrido seguido: financiar, producir una gran cartera de contenido, lanzar a gran escala y medir después. Abajo, un recorrido alternativo con pasos de aprendizaje: probar el supuesto de uso en movimiento con una cohorte, medir conversión tras la prueba gratuita, medir uso en televisor y ampliar solo si el dato lo respalda.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una forma de aprender antes de gastar todo (análisis propio)</tspan></text><text x="14" y="63" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="14" dy="0">Recorrido seguido (según la prensa)</tspan></text><rect x="10" y="75" width="212" height="72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="116" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116" dy="0">Financiar 1.750 M$ y</tspan></text><text x="116" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116" dy="0">producir un catálogo</tspan></text><text x="116" y="131.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="116" dy="0">grande</tspan></text><rect x="242" y="75" width="212" height="72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="348" y="106.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="348" dy="0">Lanzar a gran escala con</tspan></text><text x="348" y="122.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="348" dy="0">mucha atención</tspan></text><polyline points="222,111 242,111" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="474" y="75" width="212" height="72" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="580" y="106.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="580" dy="0">Medir la audiencia y la</tspan></text><text x="580" y="122.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="580" dy="0">conversión</tspan></text><polyline points="454,111 474,111" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="706" y="75" width="212" height="72" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="812" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="812" dy="0">Ajustar durante el verano:</tspan></text><text x="812" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="812" dy="0">pruebas, precios,</tspan></text><text x="812" y="131.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="812" dy="0">marketing</tspan></text><polyline points="686,111 706,111" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="14" y="185" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="14" dy="0">Recorrido alternativo (propuesta de análisis, no un hecho)</tspan></text><rect x="10" y="197" width="212" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="116" y="228.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="116" dy="0">Declarar el supuesto: uso</tspan></text><text x="116" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="116" dy="0">en movimiento</tspan></text><rect x="242" y="197" width="212" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="348" y="228.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="348" dy="0">Probar con una cohorte y</tspan></text><text x="348" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="348" dy="0">medir conversión</tspan></text><polyline points="222,233 242,233" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="474" y="197" width="212" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="580" y="228.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="580" dy="0">Medir el uso en televisor</tspan></text><text x="580" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="580" dy="0">y el abandono</tspan></text><polyline points="454,233 474,233" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="706" y="197" width="212" height="72" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="812" y="228.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="812" dy="0">Ampliar solo si cada</tspan></text><text x="812" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="812" dy="0">medición se cumple</tspan></text><polyline points="686,233 706,233" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="291" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El recorrido seguido es el que describen Whitman y Katzenberg y la prensa: decidieron lanzar con atención masiva por</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">considerar que creaban una categoría. El alternativo es una propuesta de este programa para estudiar la decisión; no</tspan></text><text x="470" y="349.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sabemos si habría funcionado ni si los inversionistas lo habrían aceptado.</tspan></text><text x="470" y="396.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: prensa especializada citada en el caso; esquema propio.</tspan></text></svg>
