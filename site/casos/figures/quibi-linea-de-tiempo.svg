<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Veintinueve meses entre el anuncio y la venta del catálogo</title><desc id="d">Línea de tiempo en meses desde agosto de 2018. El anuncio de 1.000 millones de dólares es el mes 0. El lanzamiento del 6 de abril de 2020 es el mes 20. El 21 de octubre de 2020 se anuncia el cierre, el 1 de diciembre la aplicación deja de funcionar y el 8 de enero de 2021 Roku adquiere los derechos de más de 75 programas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Veintinueve meses entre el anuncio y la venta del catálogo</tspan></text><line x1="194" y1="83" x2="194" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="233" x2="194" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">0</tspan></text><line x1="283.75" y1="83" x2="283.75" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="283.75" y1="233" x2="283.75" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="283.75" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.75" dy="0">4</tspan></text><line x1="373.5" y1="83" x2="373.5" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="373.5" y1="233" x2="373.5" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="373.5" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="373.5" dy="0">8</tspan></text><line x1="463.25" y1="83" x2="463.25" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="463.25" y1="233" x2="463.25" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="463.25" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463.25" dy="0">12</tspan></text><line x1="553" y1="83" x2="553" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="553" y1="233" x2="553" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="553" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="553" dy="0">16</tspan></text><line x1="642.75" y1="83" x2="642.75" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="642.75" y1="233" x2="642.75" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="642.75" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642.75" dy="0">20</tspan></text><line x1="732.5" y1="83" x2="732.5" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="732.5" y1="233" x2="732.5" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="732.5" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.5" dy="0">24</tspan></text><line x1="822.25" y1="83" x2="822.25" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="822.25" y1="233" x2="822.25" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="822.25" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822.25" dy="0">28</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">32</tspan></text><line x1="194" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Preparación</tspan></text><text x="184" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Servicio en operación</tspan></text><text x="184" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Tras el cierre</tspan></text><line x1="194" y1="75" x2="194" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="194" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="194" dy="0">ago 2018: 1.000 M$</tspan></text><line x1="646.564" y1="75" x2="646.564" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="646.564" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="646.564" dy="0">6 abr 2020: lanzamiento</tspan></text><line x1="792.408" y1="75" x2="792.408" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="801.674" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="801.674" dy="0">21 oct: cierre</tspan></text><rect x="194" y="92" width="452.564" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="420.282" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="420.282" dy="0">desde el anuncio hasta el lanzamiento (20 meses)</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="646.564" y="142" width="175.686" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="734.407" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="734.407" dy="0">abr a dic de 2020</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="792.408" y="192" width="57.44" height="32" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="821.128" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.128" dy="0">venta</tspan></text><text x="553" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="553" dy="0">meses desde agosto de 2018 (12 = agosto de 2019, 24 = agosto de 2020)</tspan></text><rect x="10" y="291" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El servicio funcionó unos ocho meses, del 6 de abril al 1 de diciembre de 2020. En octubre de 2019, antes de lanzar, ya</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tenía vendido el inventario publicitario de su primer año, unos 150 millones de dólares según TechCrunch. Los meses son</tspan></text><text x="470" y="349.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cálculo propio a partir de las fechas de prensa.</tspan></text><text x="470" y="396.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Variety (2018), TechCrunch (2019), Deadline y Variety (2020), The Verge (2021).</tspan></text></svg>
