<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete meses de operación: cuándo llegaron el producto, los datos y las decisiones de capital</title><desc id="d">Línea de tiempo en días desde el 6 de abril de 2020 con tres carriles: producto, datos y capital. Producto: AirPlay y Chromecast en junio y aplicaciones de televisor el día 197. Datos: primer cobro posible el día 90, informe de Sensor Tower el día 93 y estimaciones de Kantar al final de cada trimestre. Capital: gasto esperado de 1.000 millones hacia el tercer trimestre, decisión de cerrar hacia el día 184 y anuncio el día 198.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Siete meses de operación: cuándo llegaron el producto, los datos y las decisiones de capital</tspan></text><line x1="284" y1="83" x2="284" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="284" y1="239" x2="284" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="284" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="284" dy="0">0</tspan></text><line x1="409.6" y1="83" x2="409.6" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="409.6" y1="239" x2="409.6" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="409.6" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="409.6" dy="0">50</tspan></text><line x1="535.2" y1="83" x2="535.2" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="535.2" y1="239" x2="535.2" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="535.2" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="535.2" dy="0">100</tspan></text><line x1="660.8" y1="83" x2="660.8" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="660.8" y1="239" x2="660.8" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="660.8" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="660.8" dy="0">150</tspan></text><line x1="786.4" y1="83" x2="786.4" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="786.4" y1="239" x2="786.4" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="786.4" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="786.4" dy="0">200</tspan></text><line x1="912" y1="83" x2="912" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="239" x2="912" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">250</tspan></text><line x1="284" y1="239" x2="912" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="274" y="113.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Producto: acceso al televisor</tspan></text><text x="274" y="165.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Datos que decidían el negocio</tspan></text><text x="274" y="217.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="274" dy="0">Capital</tspan></text><line x1="510.08" y1="75" x2="510.08" y2="239" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="510.08" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="510.08" dy="0">5 jul</tspan></text><line x1="781.376" y1="75" x2="781.376" y2="239" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="781.376" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="781.376" dy="0">21 oct</tspan></text><rect x="284" y="92" width="175.84" height="34" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="371.92" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="371.92" dy="0">solo teléfono</tspan></text><rect x="459.84" y="92" width="319.024" height="34" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="619.352" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="619.352" dy="0">AirPlay y Chromecast</tspan></text><rect x="778.864" y="92" width="105.504" height="34" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="831.616" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="831.616" dy="0">apps</tspan></text><line x1="14" y1="135" x2="912" y2="135" stroke="#d5dde1" stroke-width="1"/><rect x="510.08" y="144" width="7.536" height="34" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><rect x="497.52" y="144" width="5.024" height="34" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><rect x="728.624" y="144" width="5.024" height="34" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><line x1="14" y1="187" x2="912" y2="187" stroke="#d5dde1" stroke-width="1"/><rect x="284" y="196" width="444.624" height="34" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="506.312" y="217.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="506.312" dy="0">gasto esperado: 1.000 millones</tspan></text><rect x="746.208" y="196" width="35.168" height="34" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="598" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="598" dy="0">días desde el 6 de abril de 2020</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los días son cálculo propio a partir de fechas de prensa. En el carril de datos: primer cobro (día 90), informe de Sensor</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Tower (93) y cierres de trimestre con las estimaciones de Kantar (85 y 177). El paso de «solo teléfono» a AirPlay y</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Chromecast se sitúa en junio (Variety); Whitman habló de pocas semanas.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Variety (1 dic 2020), NBC News (22 oct 2020), Deadline (21 oct 2020) y The Verge (8 jul 2020).</tspan></text></svg>
