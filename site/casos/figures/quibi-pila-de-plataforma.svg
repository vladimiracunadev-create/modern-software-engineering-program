<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 486" width="940" height="486" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Plataforma de Quibi: del teléfono al televisor, con la infraestructura de entrega sin datos públicos</title><desc id="d">Cuatro capas de abajo arriba: teléfono y tiendas de aplicaciones; aplicación con Turnstyle, protección de derechos y capturas propias; acceso al televisor por AirPlay, Chromecast y aplicaciones nativas; y entrega de vídeo cuya infraestructura no es pública.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="486" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Plataforma de Quibi: del teléfono al televisor, con la infraestructura de entrega sin datos públicos</tspan></text><rect x="10" y="53" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Entrega y servidor</tspan></text><rect x="214" y="53" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="89.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Infraestructura y software de servidor: no son públicos</tspan></text><rect x="10" y="133" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="169.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Acceso al televisor</tspan></text><rect x="214" y="133" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="161.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">AirPlay y Chromecast (junio); aplicaciones nativas (20</tspan></text><text x="429" y="177.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">de octubre)</tspan></text><rect x="10" y="213" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="249.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Aplicación móvil</tspan></text><rect x="214" y="213" width="430" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="249.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">Turnstyle, protección de derechos y capturas propias</tspan></text><rect x="10" y="293" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Teléfono y tiendas</tspan></text><rect x="214" y="293" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="321.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Descarga, preinscripción y compra dentro de la</tspan></text><text x="429" y="337.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">aplicación</tspan></text><rect x="668" y="53" width="262" height="88" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="92.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Turnstyle: dos versiones de vídeo</tspan></text><text x="799" y="108.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">según la patente (The Verge)</tspan></text><rect x="668" y="155" width="262" height="88" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="799" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">Derechos digitales: bloquean</tspan></text><text x="799" y="202.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">capturas; método propio</tspan></text><text x="799" y="219.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">(Engadget)</tspan></text><rect x="668" y="257" width="262" height="88" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="799" y="296.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="799" dy="0">No se sabe: lenguajes, nube, base</tspan></text><text x="799" y="312.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="799" dy="0">de datos y proveedor de vídeo</tspan></text><rect x="10" y="379" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que la prensa y los responsables dicen; no es una arquitectura técnica. Los datos de servidor no son públicos y no se</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">infieren.</tspan></text><text x="470" y="468.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: prensa especializada citada en el caso (2018 a 2021); esquema propio.</tspan></text></svg>
