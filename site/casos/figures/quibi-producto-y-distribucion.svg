<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 532" width="940" height="532" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué ofrecía Quibi y por dónde llegaba al espectador</title><desc id="d">Diagrama del producto. Estudios y creadores producen series, películas y programas de menos de diez minutos que se entregan por la aplicación móvil. Dentro de la aplicación, Turnstyle cambia entre vertical y horizontal al girar el teléfono y una función propia permite capturas de pantalla. Dos planes, con anuncios y sin ellos. Al inicio solo teléfonos; AirPlay y Chromecast llegaron en junio y las aplicaciones de Apple TV, Fire TV y Android TV el 20 de octubre de 2020.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="532" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué ofrecía Quibi y por dónde llegaba al espectador</tspan></text><rect x="10" y="51" width="300" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="160" y="78" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">Estudios y creadores: series,</tspan></text><text x="160" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">documentales y programas de bocados</tspan></text><text x="160" y="111.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="160" dy="0">rápidos</tspan></text><rect x="360" y="51" width="330" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="525" y="86.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="525" dy="0">App móvil de Quibi: episodios de 10</tspan></text><text x="525" y="102.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="525" dy="0">minutos o menos</tspan></text><rect x="740" y="51" width="190" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="835" y="94.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835" dy="0">Teléfono del espectador</tspan></text><polyline points="310,91 360,91" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,91 740,91" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="163" width="290" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="155" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">Turnstyle: cambia entre vertical y</tspan></text><text x="155" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">horizontal al girar el teléfono</tspan></text><rect x="325" y="163" width="290" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Capturas de pantalla con un método</tspan></text><text x="470" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">propio por las restricciones de DRM</tspan></text><rect x="640" y="163" width="290" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="785" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785" dy="0">Plan con anuncios o sin anuncios; 90</tspan></text><text x="785" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="785" dy="0">días gratis al inicio</tspan></text><polyline points="525,131 525,163" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="267" width="920" height="118" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="289" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Llegada a la pantalla grande</tspan></text><rect x="24" y="301" width="284" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="166" y="339.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="166" dy="0">Abril de 2020: solo teléfono</tspan></text><rect x="328" y="301" width="284" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="339.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Junio: AirPlay y Chromecast</tspan></text><rect x="632" y="301" width="284" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="774" y="331.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="774" dy="0">20 oct: apps de Apple TV, Fire TV y</tspan></text><text x="774" y="347.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="774" dy="0">Android TV</tspan></text><polyline points="308,336 328,336" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="612,336 632,336" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="409" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="433.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Turnstyle fue objeto de una disputa de patentes y secretos industriales con Eko; Quibi calificó las demandas de infundadas.</tspan></text><text x="470" y="450.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El caso no toma partido: lo que importa para el curso es que una función diferencial no sustituyó a la distribución en</tspan></text><text x="470" y="467.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">televisores.</tspan></text><text x="470" y="514.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: prensa especializada citada en el caso; esquema propio.</tspan></text></svg>
