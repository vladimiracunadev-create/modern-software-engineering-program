<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Shopify entre el comerciante, el comprador y el resto del comercio</title><desc id="d">Diagrama de contexto: el comerciante monta y administra su tienda; el comprador paga en línea, en tienda física o en redes sociales; Shopify Payments y Shop Pay procesan el pago; los desarrolladores venden aplicaciones y temas; los socios de envío, las redes de tarjetas y los canales externos completan el ecosistema; Google Cloud aloja la mayor parte de la plataforma.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Shopify entre el comerciante, el comprador y el resto del comercio</tspan></text><rect x="24" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="131" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">Comerciante: de un</tspan></text><text x="131" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">emprendedor solo a una</tspan></text><text x="131" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">marca global</tspan></text><rect x="250" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Comprador: web, tienda</tspan></text><text x="357" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">física, redes sociales,</tspan></text><text x="357" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">aplicación Shop</tspan></text><rect x="476" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="583" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">Shopify Payments y Shop</tspan></text><text x="583" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">Pay: cobro y pago</tspan></text><text x="583" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">acelerado</tspan></text><rect x="702" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="809" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="809" dy="0">Desarrolladores y socios:</tspan></text><text x="809" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="809" dy="0">aplicaciones, temas,</tspan></text><text x="809" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="809" dy="0">agencias</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="221.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Shopify: plataforma de comercio de</tspan></text><text x="470" y="239.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">múltiples inquilinos</tspan></text><polyline points="131,125 334.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">administra</tspan></text><polyline points="357,125 424.8,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">compra</tspan></text><polyline points="583,125 515.2,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">procesa</tspan></text><polyline points="809,125 605.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">extienden</tspan></text><rect x="24" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="131" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">Redes de tarjetas, bancos</tspan></text><text x="131" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">y procesadores</tspan></text><rect x="250" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Transportistas y</tspan></text><text x="357" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">proveedores de envío</tspan></text><rect x="476" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="583" y="369" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">Google Cloud: aloja la</tspan></text><text x="583" y="385.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">mayor parte de las</tspan></text><text x="583" y="402.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">operaciones</tspan></text><rect x="702" y="345" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="809" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="809" dy="0">Reguladores: pagos,</tspan></text><text x="809" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="809" dy="0">privacidad, impuestos</tspan></text><polyline points="334.4,259 131,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">liquidan</tspan></text><polyline points="424.8,259 357,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">entregan</tspan></text><polyline points="515.2,259 583,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">aloja</tspan></text><polyline points="605.6,259 809,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">exigen</tspan></text><rect x="10" y="439" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el 10-K de 2025: plataforma multi-inquilino en la nube, pagos integrados con Shopify Payments, comerciantes</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en más de 175 países y uso de Google Cloud para la mayor parte de las operaciones. Dónde deja de valer: no cuantifica la</tspan></text><text x="470" y="497.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dependencia de cada socio.</tspan></text><text x="470" y="544.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Shopify Inc. del año terminado el 31 de diciembre de 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
