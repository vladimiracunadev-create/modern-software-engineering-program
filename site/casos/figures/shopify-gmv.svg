<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Volumen bruto de mercancías (GMV) que fluye por la plataforma</title><desc id="d">Barras con 235,9 miles de millones de dólares en 2023, 292,3 en 2024 y 378,4 en 2025; el crecimiento anual es 24 por ciento y 29 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Volumen bruto de mercancías (GMV) que fluye por la plataforma</tspan></text><line x1="78.62" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="307" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="247" x2="920" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="247" x2="78.62" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="187" x2="920" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="187" x2="78.62" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="127" x2="920" y2="127" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="127" x2="78.62" y2="127" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="131.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">300</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">miles de millones de USD</text><rect x="106.666" y="165.46" width="224.368" height="141.54" rx="3" fill="#087f8c"/><text x="218.85" y="159.46" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="218.85" dy="0">235,9</tspan></text><text x="218.85" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="218.85" dy="0">2023</tspan></text><rect x="387.126" y="131.62" width="224.368" height="175.38" rx="3" fill="#087f8c"/><text x="499.31" y="125.62" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">292,3</tspan></text><text x="499.31" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">2024</tspan></text><rect x="667.586" y="79.96" width="224.368" height="227.04" rx="3" fill="#087f8c"/><text x="779.77" y="73.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="779.77" dy="0">378,4</tspan></text><text x="779.77" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="779.77" dy="0">2025</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El GMV es el valor total de los pedidos facilitados, neto de reembolsos y con envío e impuestos. Cálculo propio: el ingreso</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de Shopify equivale a 2,99 % del GMV en 2023 y 3,05 % en 2025 (7 060 y 11 556 millones sobre 235,9 y 378,4 mil millones).</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: Shopify no es dueño de ese dinero; es el volumen de sus comerciantes.</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Shopify Inc. del año terminado el 31 de diciembre de 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
