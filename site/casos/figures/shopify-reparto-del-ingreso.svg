<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 475" width="940" height="475" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se reparte cada dólar de ingreso en 2025</title><desc id="d">Barras horizontales como porcentaje del ingreso de 11 556 millones: coste de ingresos 52 por ciento, ventas y marketing 14 por ciento, investigación y desarrollo 13 por ciento, administración 4 por ciento, pérdidas por transacciones y préstamos 4 por ciento y utilidad neta 11 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="475" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo se reparte cada dólar de ingreso en 2025</tspan></text><line x1="318.52" y1="49" x2="318.52" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="318.52" y1="277" x2="318.52" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="318.52" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="318.52" dy="0">0</tspan></text><line x1="506.933" y1="49" x2="506.933" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="506.933" y1="277" x2="506.933" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="506.933" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.933" dy="0">20</tspan></text><line x1="695.347" y1="49" x2="695.347" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="695.347" y1="277" x2="695.347" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="695.347" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="695.347" dy="0">40</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="277" x2="883.76" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">60</tspan></text><line x1="318.52" y1="277" x2="883.76" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="308.52" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="308.52" dy="0">Coste de ingresos</tspan></text><text x="308.52" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="308.52" dy="0">Ventas y marketing</tspan></text><text x="308.52" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="308.52" dy="0">Investigación y desarrollo</tspan></text><text x="308.52" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="308.52" dy="0">Administración general</tspan></text><text x="308.52" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="308.52" dy="0">Pérdidas por transacciones y préstamos</tspan></text><text x="308.52" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="308.52" dy="0">Utilidad neta</tspan></text><rect x="318.52" y="55" width="488.933" height="26" rx="3" fill="#c0432f"/><text x="814.453" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="814.453" dy="0">51,9</tspan></text><rect x="318.52" y="93" width="135.658" height="26" rx="3" fill="#c0432f"/><text x="461.178" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="461.178" dy="0">14,4</tspan></text><rect x="318.52" y="131" width="125.295" height="26" rx="3" fill="#c0432f"/><text x="450.815" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="450.815" dy="0">13,3</tspan></text><rect x="318.52" y="169" width="38.6247" height="26" rx="3" fill="#c0432f"/><text x="364.145" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="364.145" dy="0">4,1</tspan></text><rect x="318.52" y="207" width="33.9144" height="26" rx="3" fill="#c0432f"/><text x="359.434" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="359.434" dy="0">3,6</tspan></text><rect x="318.52" y="245" width="100.801" height="26" rx="3" fill="#c0432f"/><text x="426.321" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="426.321" dy="0">10,7</tspan></text><text x="601.14" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="601.14" dy="0">% del ingreso</tspan></text><rect x="10" y="335" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo propio sobre el 10-K: 6 001; 1 663; 1 536; 471; 417 y 1 231 millones sobre 11 556. Las partidas no suman 100 %</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">porque hay ingresos y gastos no operativos y impuestos. Mire la primera barra: más de la mitad del ingreso es coste de</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">procesar pagos y otras soluciones. Dónde deja de valer: el coste de ingresos de pagos incluye comisiones de interbancarias</tspan></text><text x="470" y="409.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que no son de Shopify.</tspan></text><text x="470" y="457.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Shopify Inc. del año terminado el 31 de diciembre de 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
