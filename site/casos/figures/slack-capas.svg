<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 662" width="940" height="662" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Capas de Slack que su ingeniería describió, de la pantalla al almacenamiento</title><desc id="d">Pila de capas: clientes con una conexión WebSocket; borde regional con Envoy; servidores de pasarela, de canales, de presencia y de administración en Java; aplicación web en Hack; Vitess sobre MySQL como almacén; cola de trabajos; y AWS como infraestructura.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="662" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Capas de Slack que su ingeniería describió, de la pantalla al almacenamiento</tspan></text><rect x="10" y="53" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Clientes</tspan></text><rect x="214" y="53" width="430" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">Aplicaciones web, de escritorio y móviles con una</tspan></text><text x="429" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">conexión WebSocket persistente</tspan></text><rect x="10" y="133" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="169.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Borde</tspan></text><rect x="214" y="133" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="161.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Red de borde global; Envoy termina TLS y reparte hacia</tspan></text><text x="429" y="177.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">las pasarelas</tspan></text><rect x="10" y="213" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="241.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Mensajería en tiempo</tspan></text><text x="105" y="257.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">real</tspan></text><rect x="214" y="213" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="241.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Servidores de pasarela, de canales, de presencia y de</tspan></text><text x="429" y="257.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">administración, escritos en Java</tspan></text><rect x="10" y="293" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Aplicación web</tspan></text><rect x="214" y="293" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="321.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Webapp en Hack: todas las API que llaman los clientes y</tspan></text><text x="429" y="337.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">el código de interfaz</tspan></text><rect x="10" y="373" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="409.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Datos</tspan></text><rect x="214" y="373" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="401.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">Vitess sobre MySQL, con keyspaces; Memcached con</tspan></text><text x="429" y="417.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">Mcrouter; Redis para la cola</tspan></text><rect x="10" y="453" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="489.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Infraestructura</tspan></text><rect x="214" y="453" width="430" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="429" y="481.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="429" dy="0">AWS: núcleo en us-east-1 en varias zonas de</tspan></text><text x="429" y="497.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="429" dy="0">disponibilidad; Consul para descubrimiento</tspan></text><rect x="668" y="53" width="262" height="141.333" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="110.667" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Documentado: lenguajes,</tspan></text><text x="799" y="127.307" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">componentes y números en posts de</tspan></text><text x="799" y="143.947" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">2020 a 2022</tspan></text><rect x="668" y="208.333" width="262" height="141.333" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="799" y="274.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">No se sabe: topología actual tras</tspan></text><text x="799" y="290.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">2022 ni el reparto por región</tspan></text><rect x="668" y="363.667" width="262" height="141.333" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="799" y="429.653" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">Inferido: un servicio nuevo</tspan></text><text x="799" y="446.293" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">reutiliza estas capas</tspan></text><rect x="10" y="539" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="563.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en los posts de mensajería en tiempo real, Vitess, cola de trabajos y arquitectura celular. Dónde deja de</tspan></text><text x="470" y="580.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: los posts son de 2020 a 2022 y Slack ha seguido cambiando; el blog de 2026 anuncia trabajo multi-nube que este caso</tspan></text><text x="470" y="597.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no cubre.</tspan></text><text x="470" y="644.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de ingeniería de Slack (slack.engineering), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
