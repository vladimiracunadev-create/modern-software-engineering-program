<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Carga de consultas de Vitess en hora punta (2020)</title><desc id="d">Barras horizontales: 2,3 millones de consultas por segundo en hora punta, de las cuales 2,0 millones son lecturas y 0,3 millones escrituras; la latencia mediana es 2 milisegundos y el percentil 99 es 11 milisegundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="344" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Carga de consultas de Vitess en hora punta (2020)</tspan></text><line x1="107.4" y1="49" x2="107.4" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="107.4" y1="163" x2="107.4" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="107.4" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="107.4" dy="0">0</tspan></text><line x1="264.284" y1="49" x2="264.284" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="264.284" y1="163" x2="264.284" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="264.284" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="264.284" dy="0">0,5</tspan></text><line x1="421.168" y1="49" x2="421.168" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="421.168" y1="163" x2="421.168" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="421.168" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="421.168" dy="0">1</tspan></text><line x1="578.052" y1="49" x2="578.052" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="578.052" y1="163" x2="578.052" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="578.052" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="578.052" dy="0">1,5</tspan></text><line x1="734.936" y1="49" x2="734.936" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="734.936" y1="163" x2="734.936" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="734.936" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="734.936" dy="0">2</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="163" x2="891.82" y2="168" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="184" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">2,5</tspan></text><line x1="107.4" y1="163" x2="891.82" y2="163" stroke="#5b7280" stroke-width="1.6"/><text x="97.4" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="97.4" dy="0">Total</tspan></text><text x="97.4" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="97.4" dy="0">Lecturas</tspan></text><text x="97.4" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="97.4" dy="0">Escrituras</tspan></text><rect x="107.4" y="55" width="721.666" height="26" rx="3" fill="#087f8c"/><text x="836.066" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="836.066" dy="0">2,3</tspan></text><rect x="107.4" y="93" width="627.536" height="26" rx="3" fill="#087f8c"/><text x="741.936" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="741.936" dy="0">2,0</tspan></text><rect x="107.4" y="131" width="94.1304" height="26" rx="3" fill="#087f8c"/><text x="208.53" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="208.53" dy="0">0,3</tspan></text><text x="499.61" y="207" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="499.61" dy="0">millones de consultas por segundo</tspan></text><rect x="10" y="221" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="245.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Mire la proporción: de cada ocho consultas, siete son lecturas. Eso explica la inversión en cachés (Memcached) y en</tspan></text><text x="470" y="262.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">réplicas de lectura. La latencia citada es 2 ms de mediana y 11 ms en el percentil 99. Dónde deja de valer: es una medición</tspan></text><text x="470" y="279.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de hora punta de 2020, no un promedio.</tspan></text><text x="470" y="326.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: «Scaling Datastores at Slack with Vitess», slack.engineering, 1 de diciembre de 2020.</tspan></text></svg>
