<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 462" width="940" height="462" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Compromiso mínimo con AWS por año contratado (mayo de 2020 a abril de 2025)</title><desc id="d">Barras con el compromiso mínimo anual de 75 millones de dólares en el primer periodo que crece 5 millones cada año hasta 95 millones en el quinto, con un total mínimo de 425 millones; quedaban 353,7 millones por pagar al 31 de enero de 2021.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="462" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Compromiso mínimo con AWS por año contratado (mayo de 2020 a abril de 2025)</tspan></text><line x1="78.62" y1="287" x2="920" y2="287" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="287" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="291.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="243" x2="920" y2="243" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="243" x2="78.62" y2="243" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="247.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">20</tspan></text><line x1="78.62" y1="199" x2="920" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="199" x2="78.62" y2="199" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="203.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">40</tspan></text><line x1="78.62" y1="155" x2="920" y2="155" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="155" x2="78.62" y2="155" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="159.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">60</tspan></text><line x1="78.62" y1="111" x2="920" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="111" x2="78.62" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">80</tspan></text><line x1="78.62" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="67" x2="78.62" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="67" x2="78.62" y2="287" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="177" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 177)">millones de USD</text><rect x="95.4476" y="122" width="134.621" height="165" rx="3" fill="#102a43"/><text x="162.758" y="116" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="162.758" dy="0">75</tspan></text><text x="162.758" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="162.758" dy="0">Año 1</tspan></text><rect x="263.724" y="111" width="134.621" height="176" rx="3" fill="#102a43"/><text x="331.034" y="105" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="331.034" dy="0">80</tspan></text><text x="331.034" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="331.034" dy="0">Año 2</tspan></text><rect x="432" y="100" width="134.621" height="187" rx="3" fill="#102a43"/><text x="499.31" y="94" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="499.31" dy="0">85</tspan></text><text x="499.31" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="499.31" dy="0">Año 3</tspan></text><rect x="600.276" y="89" width="134.621" height="198" rx="3" fill="#102a43"/><text x="667.586" y="83" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="667.586" dy="0">90</tspan></text><text x="667.586" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.586" dy="0">Año 4</tspan></text><rect x="768.552" y="78" width="134.621" height="209" rx="3" fill="#102a43"/><text x="835.862" y="72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="835.862" dy="0">95</tspan></text><text x="835.862" y="308" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="835.862" dy="0">Año 5</tspan></text><rect x="10" y="339" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="363.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo propio a partir de la regla del 10-K (75 millones más 5 millones cada año, total de 425 millones). Mire que el</tspan></text><text x="470" y="380.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">compromiso es un piso, no el gasto real. Dónde deja de valer: el gasto real en nube de Slack no es público y el 10-K no lo</tspan></text><text x="470" y="397.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">desglosa.</tspan></text><text x="470" y="444.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Slack Technologies, año fiscal terminado el 31 de enero de 2021 (SEC).</tspan></text></svg>
