<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 582" width="940" height="582" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware y software que Slack hace público</title><desc id="d">Pila de lo que se sabe: no hay hardware propio publicado; el núcleo corre en máquinas virtuales de AWS en varias zonas de disponibilidad de us-east-1; el software documentado incluye Hack, Java, Go, C++, Envoy, Consul, Vitess, MySQL, Memcached con Mcrouter y Redis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="582" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware y software que Slack hace público</tspan></text><rect x="10" y="53" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Hardware</tspan></text><rect x="214" y="53" width="430" height="66" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="429" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="429" dy="0">Sin hardware propio publicado: instancias de AWS en</tspan></text><text x="429" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="429" dy="0">varias zonas de us-east-1</tspan></text><rect x="10" y="133" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="169.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Red</tspan></text><rect x="214" y="133" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="161.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Pasarelas de tránsito de AWS entre cuentas y VPC; borde</tspan></text><text x="429" y="177.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">regional propio</tspan></text><rect x="10" y="213" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="249.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Descubrimiento</tspan></text><rect x="214" y="213" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="249.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Consul; Envoy y su API xDS; DNS</tspan></text><rect x="10" y="293" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Servicios</tspan></text><rect x="214" y="293" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="321.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Webapp en Hack; pasarela, canal y presencia en Java;</tspan></text><text x="429" y="337.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">piezas en Go y C++</tspan></text><rect x="10" y="373" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="409.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Datos y caché</tspan></text><rect x="214" y="373" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="401.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">Vitess sobre MySQL; Memcached con Mcrouter y Mcrib;</tspan></text><text x="429" y="417.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">Redis en la cola</tspan></text><rect x="668" y="53" width="262" height="179" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="137.82" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Documentado en posts de 2020 a</tspan></text><text x="799" y="154.46" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">2022</tspan></text><rect x="668" y="246" width="262" height="179" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="799" y="330.82" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">No se sabe: tipos de instancia,</tspan></text><text x="799" y="347.46" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="799" dy="0">tamaños y costes por componente</tspan></text><rect x="10" y="459" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="483.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que Slack revela es software y topología, no equipos físicos: el 10-K dice que alquila oficinas y que su infraestructura</tspan></text><text x="470" y="500.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">vive en proveedores de nube. Dónde deja de valer: ni el número de servidores ni la cuenta de AWS se publican; el compromiso</tspan></text><text x="470" y="517.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mínimo con AWS es la única magnitud económica de infraestructura.</tspan></text><text x="470" y="564.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de ingeniería de Slack (slack.engineering), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
