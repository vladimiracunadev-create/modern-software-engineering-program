<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 402" width="940" height="402" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Slack de 2009 a 2022: empresa, datos y resiliencia</title><desc id="d">Línea de tiempo con tres carriles: la empresa (Tiny Speck desde 2009, Slack desde 2014, parte de Salesforce desde julio de 2021), los datos (migración a Vitess desde 2017 hasta 2020) y la resiliencia (incidentes de enero de 2021, junio de 2021 y febrero de 2022).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="402" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Slack de 2009 a 2022: empresa, datos y resiliencia</tspan></text><line x1="120.66" y1="83" x2="120.66" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="120.66" y1="221" x2="120.66" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="120.66" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="120.66" dy="0">2009</tspan></text><line x1="252.55" y1="83" x2="252.55" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="252.55" y1="221" x2="252.55" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="252.55" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="252.55" dy="0">2012</tspan></text><line x1="384.44" y1="83" x2="384.44" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="384.44" y1="221" x2="384.44" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="384.44" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231">