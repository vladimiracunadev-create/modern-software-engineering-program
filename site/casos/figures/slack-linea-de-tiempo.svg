x="648.22" y="184" width="4.39633" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="670.202" y="184" width="4.39633" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="696.58" y="184" width="4.39633" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="516.33" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="516.33" dy="0">año</tspan></text><rect x="10" y="279" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hechos con fuente: constitución en 2009 y cambio de nombre en 2014 (10-K); acuerdo de fusión del 1 de diciembre de 2020 y</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cierre del 21 de julio de 2021 (8-K); incidentes del 4 de enero de 2021, 30 de junio de 2021 y 22 de febrero de 2022</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(blog). Dónde deja de valer: la fecha de la cotización directa es aproximada en el eje (año fiscal 2020).</tspan></text><text x="470" y="384.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: 10-K FY2021, 8-K del 21 de julio de 2021 y blog de ingeniería de Slack.</tspan></text></svg>
