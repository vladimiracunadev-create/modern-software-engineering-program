<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 575" width="940" height="575" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Conectarse a Slack: del arranque al primer mensaje en tiempo real</title><desc id="d">Secuencia de conexión: el cliente pide la configuración a la aplicación web, abre un WebSocket al borde más cercano, Envoy lo envía a un servidor de pasarela, que consulta los canales del usuario y se suscribe a los servidores de canal que los alojan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="575" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Conectarse a Slack: del arranque al primer mensaje en tiempo real</tspan></text><rect x="26" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="110" dy="0">Cliente</tspan></text><rect x="206" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="290" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290" dy="0">Webapp (Hack)</tspan></text><rect x="386" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Envoy</tspan></text><rect x="566" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="650" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="650" dy="0">Pasarela</tspan></text><rect x="746" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">Servidor de canal</tspan></text><line x1="110" y1="104" x2="110" y2="452" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="290" y1="104" x2="290" y2="452" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="470" y1="104" x2="470" y2="452" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="650" y1="104" x2="650" y2="452" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="830" y1="104" x2="830" y2="452" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="113,138 287,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="200" y="114" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="200" dy="0">1. pide token y datos de</tspan><tspan x="200" dy="16.64">conexión</tspan></text><polyline points="287,184 113,184" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="200" y="160" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="200" dy="0">2. devuelve token y URL del</tspan><tspan x="200" dy="16.64">WebSocket</tspan></text><polyline points="113,230 467,230" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="290" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="290" dy="0">3. abre WebSocket en la región más cercana</tspan></text><polyline points="473,276 647,276" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="268" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="560" dy="0">4. reenvía la conexión</tspan></text><polyline points="647,322 293,322" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="314" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">5. pide usuario y lista de canales</tspan></text><polyline points="653,368 827,368" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="740" y="344" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="740" dy="0">6. se suscribe según hash de</tspan><tspan x="740" dy="16.64">cada canal</tspan></text><polyline points="827,414 113,414" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="470" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">7. envía mensajes y eventos (por la pasarela)</tspan></text><rect x="10" y="466" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="490.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el post de mensajería en tiempo real. La pasarela mantiene suscripciones y usuarios; el servidor de canal</tspan></text><text x="470" y="507.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">guarda historial reciente en memoria y se elige por hash consistente del identificador del canal. Dónde deja de valer:</tspan></text><text x="470" y="524.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">omite autenticación, presencia y el arranque incremental del cliente.</tspan></text><text x="470" y="561.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: blog de ingeniería de Slack (slack.engineering), consulta 2026-11-23. Esquema del autor.</tspan></text></svg>
