<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</title><desc id="d">Cuatro columnas: mecanismos que existían y funcionaron (la directiva de emergencia, la coordinación federal, el análisis forense), que existían y no bastaron (firma, verificación del cliente, monitoreo), que no existían o no constan (compilación reproducible, atestación de procedencia) y que debieron existir (análisis propio).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</tspan></text><rect x="10" y="51" width="216.5" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="118.25" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="118.25" dy="0">Existía y funcionó</tspan></text><rect x="10" y="101" width="216.5" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">SolarWinds es informado</tspan></text><text x="118.25" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">del ataque el 12 de</tspan></text><text x="118.25" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">diciembre de 2020 y actúa</tspan></text><rect x="10" y="172.92" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Directiva de emergencia en</tspan></text><text x="118.25" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">un día</tspan></text><rect x="10" y="228.2" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Coordinación entre FBI,</tspan></text><text x="118.25" y="263.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">CISA y ODNI</tspan></text><rect x="10" y="283.48" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="118.25" y="302.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">Análisis forense con</tspan></text><text x="118.25" y="319.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="118.25" dy="0">terceros</tspan></text><rect x="244.5" y="51" width="216.5" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="352.75" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="352.75" dy="0">Existía y no bastó</tspan></text><rect x="244.5" y="101" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Firma con el certificado</tspan></text><text x="352.75" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">legítimo</tspan></text><rect x="244.5" y="156.28" width="216.5" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="179.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Verificación del cliente</tspan></text><rect x="244.5" y="204.28" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="223.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Monitoreo del</tspan></text><text x="352.75" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">comportamiento</tspan></text><rect x="244.5" y="259.56" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="352.75" y="278.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">Procesos de desarrollo</tspan></text><text x="352.75" y="295.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="352.75" dy="0">habituales</tspan></text><rect x="479" y="51" width="216.5" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="587.25" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="587.25" dy="0">No existía o no consta</tspan></text><rect x="479" y="101" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Compilación reproducible y</tspan></text><text x="587.25" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">verificable</tspan></text><rect x="479" y="156.28" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="175.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Atestación de procedencia</tspan></text><text x="587.25" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">del artefacto</tspan></text><rect x="479" y="211.56" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="230.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Detección de cambios en el</tspan></text><text x="587.25" y="247.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">entorno de compilación</tspan></text><rect x="479" y="266.84" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="587.25" y="285.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">Verificación independiente</tspan></text><text x="587.25" y="302.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="587.25" dy="0">por el cliente</tspan></text><rect x="713.5" y="51" width="216.5" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="821.75" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.75" dy="0">Debió existir (análisis</tspan></text><text x="821.75" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="821.75" dy="0">propio)</tspan></text><rect x="713.5" y="108.28" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="127.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Entorno de compilación</tspan></text><text x="821.75" y="143.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">aislado y vigilado</tspan></text><rect x="713.5" y="163.56" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="182.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Compilación reproducible y</tspan></text><text x="821.75" y="199.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">atestada</tspan></text><rect x="713.5" y="218.84" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="237.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Comparación del binario</tspan></text><text x="821.75" y="254.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">con las fuentes</tspan></text><rect x="713.5" y="274.12" width="216.5" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="821.75" y="293.08" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">Segmentación de Orion en</tspan></text><text x="821.75" y="309.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.75" dy="0">el cliente</tspan></text><rect x="10" y="348.76" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.72" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: lo que funcionó fue la respuesta; lo que faltó estaba en la producción del artefacto. La cuarta columna es</tspan></text><text x="470" y="390.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">análisis propio y coincide con lo que SolarWinds dijo querer reforzar.</tspan></text><text x="470" y="438.04" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SolarWinds, aviso de seguridad y blog (ene 2021). Fuente: CISA, directiva de emergencia ED 21-01 (13 dic 2020). Análisis</tspan></text><text x="470" y="454" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">propio, no conclusión de las fuentes.</tspan></text></svg>
