<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 352" width="940" height="352" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El ataque en siete pasos, de septiembre de 2019 a diciembre de 2020</title><desc id="d">Cadena del ataque: primera actividad sospechosa en septiembre de 2019; prueba de inserción de código en octubre de 2019; inserción de SUNBURST desde el 20 de febrero de 2020; distribución a clientes en versiones firmadas; puerta trasera inactiva durante unos días; segunda fase con herramientas adicionales; descubrimiento y aviso en diciembre de 2020.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="352" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El ataque en siete pasos, de septiembre de 2019 a diciembre de 2020</tspan></text><rect x="10" y="51" width="200" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">Sep 2019: primera</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">actividad sospechosa en</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">los sistemas de</tspan></text><text x="110" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">SolarWinds</tspan></text><rect x="250" y="51" width="200" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="350" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">Oct 2019: una versión</tspan></text><text x="350" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">contiene modificaciones</tspan></text><text x="350" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">de prueba de inserción</tspan></text><text x="350" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">de código</tspan></text><rect x="490" y="51" width="200" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="590" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">20 feb 2020: empieza la</tspan></text><text x="590" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">inserción de SUNBURST en</tspan></text><text x="590" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="590" dy="0">las compilaciones</tspan></text><rect x="730" y="51" width="200" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">La actualización firmada</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">llega a los clientes</tspan></text><polyline points="210,91.28 250,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,91.28 490,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,91.28 730,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="830,131.56 830,146.56 110,146.56 110,165.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="165.56" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">La puerta trasera espera</tspan></text><text x="110" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">de 12 a 14 días antes de</tspan></text><text x="110" y="217.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">actuar</tspan></text><rect x="250" y="165.56" width="200" height="63.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="350" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">Segunda fase: cargas</tspan></text><text x="350" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">adicionales y movimiento</tspan></text><text x="350" y="217.8" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="350" dy="0">en la red del cliente</tspan></text><rect x="490" y="165.56" width="200" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="590" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">12 dic 2020: SolarWinds</tspan></text><text x="590" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">es informado; 13 dic:</tspan></text><text x="590" y="217.8" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="590" dy="0">directiva de emergencia</tspan></text><polyline points="210,197.52 250,197.52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,197.52 490,197.52" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="245.48" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="270.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el atacante dedicó meses a probar antes de insertar y diseñó la puerta trasera para tardar en actuar. Mira</tspan></text><text x="470" y="287.08" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que desde la inserción hasta el aviso pasaron unos diez meses.</tspan></text><text x="470" y="334.76" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SolarWinds, aviso de seguridad y blog (ene 2021). Fuente: Microsoft, análisis técnico (dic 2020).</tspan></text></svg>
