<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 369" width="940" height="369" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué consta sobre quién y qué es una inferencia</title><desc id="d">Tres columnas: lo documentado (el gobierno de EE. UU. atribuye la actividad al Servicio de Inteligencia Exterior de Rusia, SVR, en abril de 2021), lo que dice SolarWinds (no verificó de forma independiente la atribución) y lo que este caso no sabe (la identidad de las personas y la lista completa de víctimas).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="369" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué consta sobre quién y qué es una inferencia</tspan></text><rect x="10" y="51" width="294.667" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="157.333" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="157.333" dy="0">Documentado</tspan></text><rect x="10" y="101" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">15 de abril de 2021: el gobierno de</tspan></text><text x="157.333" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">EE. UU. atribuye la actividad a la</tspan></text><text x="157.333" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">SVR rusa</tspan></text><rect x="10" y="172.92" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="157.333" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">Un grupo de coordinación de FBI, CISA</tspan></text><text x="157.333" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="157.333" dy="0">y ODNI se formó en diciembre de 2020</tspan></text><rect x="322.667" y="51" width="294.667" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">Según SolarWinds</tspan></text><rect x="322.667" y="101" width="294.667" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Dice que sus investigaciones no</tspan></text><text x="470" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">verificaron de forma independiente la</tspan></text><text x="470" y="153.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">atribución</tspan></text><rect x="322.667" y="172.92" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="191.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Habla de un actor estatal según el</tspan></text><text x="470" y="208.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">gobierno y expertos</tspan></text><rect x="635.333" y="51" width="294.667" height="40" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="782.667" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="782.667" dy="0">No se sabe</tspan></text><rect x="635.333" y="101" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">La lista completa de víctimas</tspan></text><rect x="635.333" y="149" width="294.667" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="172.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Qué datos se obtuvieron en cada una</tspan></text><rect x="635.333" y="197" width="294.667" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782.667" y="215.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">Los detalles de inteligencia detrás</tspan></text><text x="782.667" y="232.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.667" dy="0">de la atribución</tspan></text><rect x="10" y="262.28" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="287.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: este caso se centra en el proceso de construcción y entrega; la atribución es relevante para la respuesta</tspan></text><text x="470" y="303.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">política, no para el diseño de controles.</tspan></text><text x="470" y="351.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: CISA, alerta AA20-352A (actualizada 2021). Fuente: SolarWinds, aviso de seguridad y blog (ene 2021).</tspan></text></svg>
