<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 319" width="940" height="319" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué ordenó CISA a las agencias federales el 13 de diciembre de 2020</title><desc id="d">Cadena de acciones de la directiva: capturar memoria y analizar cuentas y tráfico en los equipos con Orion, desconectarlos, bloquear el tráfico hacia ellos, eliminar cuentas y persistencia del atacante, informar de los indicadores a CISA a las 12 horas del 14 de diciembre y tratar como comprometidos los equipos monitorizados por Orion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="319" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué ordenó CISA a las agencias federales el 13 de diciembre de 2020</tspan></text><rect x="10" y="51" width="280" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">Si hay capacidad: copiar memoria y</tspan></text><text x="150" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">analizar cuentas y tráfico</tspan></text><rect x="330" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Desconectar o apagar Orion 2019.4 a</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">2020.2.1 HF1</tspan></text><rect x="650" y="51" width="280" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="790" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">Bloquear el tráfico hacia y desde</tspan></text><text x="790" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="790" dy="0">hosts con Orion</tspan></text><polyline points="290,74.64 330,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,74.64 650,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,98.28 790,113.28 150,113.28 150,132.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="132.28" width="280" height="63.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="150" y="159.56" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">Eliminar cuentas y mecanismos de</tspan></text><text x="150" y="176.2" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="150" dy="0">persistencia del atacante</tspan></text><rect x="330" y="132.28" width="280" height="63.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="151.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Informar de los indicadores a CISA</tspan></text><text x="470" y="167.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">antes del mediodía del 14 de</tspan></text><text x="470" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">diciembre</tspan></text><rect x="650" y="132.28" width="280" height="63.92" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="790" y="159.56" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="790" dy="0">Tratar como comprometidos los hosts</tspan></text><text x="790" y="176.2" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="790" dy="0">monitorizados y reconstruirlos</tspan></text><polyline points="290,164.24 330,164.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,164.24 650,164.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="212.2" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="237.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: desconectar era la única medida conocida; CISA dice expresamente que no se debía reinstalar hasta recibir</tspan></text><text x="470" y="253.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">guía. Mira la última caja: el radio de impacto incluye todo lo que Orion monitorizaba.</tspan></text><text x="470" y="301.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: CISA, directiva de emergencia ED 21-01 (13 dic 2020).</tspan></text></svg>
