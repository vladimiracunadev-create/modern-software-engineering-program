<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 424" width="940" height="424" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué aprender y qué no generalizar</title><desc id="d">Dos columnas: lo que se transfiere, como proteger el entorno de compilación, exigir procedencia verificable y limitar el acceso de las herramientas de gestión, y lo que no se generaliza, como culpar al proveedor o suponer que el código abierto es más seguro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="424" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué aprender y qué no generalizar</tspan></text><rect x="10" y="51" width="451" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235.5" dy="0">Se transfiere</tspan></text><rect x="10" y="101" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">La firma garantiza el origen, no el contenido</tspan></text><rect x="10" y="149" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="172.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">El entorno de compilación es un activo crítico</tspan></text><rect x="10" y="197" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="220.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Las herramientas de monitoreo son objetivos de alto valor</tspan></text><rect x="10" y="245" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="268.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Prepara la respuesta antes de necesitarla</tspan></text><rect x="479" y="51" width="451" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="704.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="704.5" dy="0">No se generaliza</tspan></text><rect x="479" y="101" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">No prueba que el software comercial sea más inseguro que el</tspan></text><text x="704.5" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">libre</tspan></text><rect x="479" y="156.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="179.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">No es el fallo de una persona ni solo del proveedor</tspan></text><rect x="479" y="204.28" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="227.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">No describe todas las vías de la campaña</tspan></text><rect x="479" y="252.28" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="271.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">La atribución es del gobierno de EE. UU.; este caso no la</tspan></text><text x="704.5" y="287.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">valida</tspan></text><rect x="10" y="317.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="342.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el aprendizaje es de integridad de la cadena de suministro. Mira la columna derecha: el caso se usa mal</tspan></text><text x="470" y="359.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuando se reduce a una empresa descuidada.</tspan></text><text x="470" y="406.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio, no conclusión de las fuentes.</tspan></text></svg>
