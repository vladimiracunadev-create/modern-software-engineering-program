<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quince meses: de la primera actividad al aviso</title><desc id="d">Línea de tiempo en meses desde septiembre de 2019: actividad sospechosa desde septiembre de 2019; prueba de inserción en octubre; inserción de SUNBURST desde el 20 de febrero de 2020; el atacante retira el código de los sistemas de SolarWinds en junio de 2020; CISA sabe de compromisos desde al menos marzo de 2020; el 12 de diciembre SolarWinds es informado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quince meses: de la primera actividad al aviso</tspan></text><line x1="254" y1="83" x2="254" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="254" y1="233" x2="254" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="254" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="254" dy="0">0</tspan></text><line x1="377.375" y1="83" x2="377.375" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="377.375" y1="233" x2="377.375" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="377.375" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="377.375" dy="0">3</tspan></text><line x1="500.75" y1="83" x2="500.75" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="500.75" y1="233" x2="500.75" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="500.75" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="500.75" dy="0">6</tspan></text><line x1="624.125" y1="83" x2="624.125" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="624.125" y1="233" x2="624.125" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="624.125" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="624.125" dy="0">9</tspan></text><line x1="747.5" y1="83" x2="747.5" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="747.5" y1="233" x2="747.5" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="747.5" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="747.5" dy="0">12</tspan></text><line x1="870.875" y1="83" x2="870.875" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="870.875" y1="233" x2="870.875" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="870.875" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="870.875" dy="0">15</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">16</tspan></text><line x1="254" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="244" y="104" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Actividad en los sistemas de</tspan></text><text x="244" y="121" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">SolarWinds</tspan></text><text x="244" y="154" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Código SUNBURST en las</tspan></text><text x="244" y="171" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">compilaciones</tspan></text><text x="244" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="244" dy="0">Compromisos en clientes (CISA)</tspan></text><line x1="295.125" y1="75" x2="295.125" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="295.125" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="295.125" dy="0">oct 2019</tspan></text><line x1="484.3" y1="75" x2="484.3" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="484.3" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="484.3" dy="0">20 feb 2020</tspan></text><line x1="887.325" y1="75" x2="887.325" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="887.325" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="887.325" dy="0">12 dic 2020</tspan></text><rect x="254" y="92" width="370.125" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="439.062" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="439.062" dy="0">sep 2019 a jun 2020</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="484.3" y="142" width="139.825" height="32" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="554.212" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="554.212" dy="0">desde 20 feb</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="500.75" y="192" width="386.575" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="694.038" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="694.038" dy="0">desde marzo de 2020</tspan></text><text x="583" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="583" dy="0">Meses desde septiembre de 2019</tspan></text><rect x="10" y="291" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La barra de actividad termina en junio de 2020, cuando los atacantes retiraron el código de los sistemas de SolarWinds; los</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">compromisos en clientes siguieron hasta el aviso. La barra de SUNBURST se dibuja hasta junio por la misma razón. Las fechas</tspan></text><text x="470" y="349.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">son las que dan SolarWinds y CISA.</tspan></text><text x="470" y="396.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: SolarWinds, aviso de seguridad y blog (ene 2021). Fuente: CISA, alerta AA20-352A (actualizada 2021).</tspan></text></svg>
