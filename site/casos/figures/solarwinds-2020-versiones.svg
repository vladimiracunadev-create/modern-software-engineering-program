<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 490" width="940" height="490" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué versiones se vieron afectadas y qué se sabe de la compilación</title><desc id="d">Capas de lo que consta: las versiones de Orion con SUNBURST según SolarWinds, el rango que CISA ordenó desconectar, la firma con el certificado legítimo y lo que no se sabe, como el lenguaje y la herramienta de compilación.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="490" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué versiones se vieron afectadas y qué se sabe de la compilación</tspan></text><rect x="10" y="51" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="69.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Versiones con SUNBURST</tspan></text><text x="135" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">(SolarWinds)</tspan></text><rect x="270" y="51" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Orion Platform 2019.4 HF 5, 2020.2 sin hotfix y 2020.2 HF 1</tspan></text><rect x="10" y="106.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="125.24" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Rango ordenado desconectar</tspan></text><text x="135" y="141.88" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">(CISA)</tspan></text><rect x="270" y="106.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="133.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Versiones 2019.4 a 2020.2.1 HF1 de Orion</tspan></text><rect x="10" y="161.56" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="188.84" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Archivo comprometido</tspan></text><rect x="270" y="161.56" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="180.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">La biblioteca SolarWinds.Orion.Core.BusinessLayer.dll, firmada con el certificado</tspan></text><text x="600" y="197.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">legítimo</tspan></text><rect x="10" y="216.84" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="244.12" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Origen de la inserción</tspan></text><rect x="270" y="216.84" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="235.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Un código de inyección «novedoso» desplegado en el entorno de compilación para insertar</tspan></text><text x="600" y="252.44" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">SUNBURST sin que lo advirtieran los equipos de desarrollo</tspan></text><rect x="10" y="272.12" width="250" height="40" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="295.76" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">Número de clientes afectados</tspan></text><rect x="270" y="272.12" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="295.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">No se verificó una cifra en fuentes primarias de esta sesión; este caso no la da</tspan></text><rect x="10" y="320.12" width="250" height="47.28" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="339.08" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">Lenguaje, herramienta de</tspan></text><text x="135" y="355.72" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">compilación, repositorios</tspan></text><rect x="270" y="320.12" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="347.4" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">No constan con detalle en las fuentes consultadas</tspan></text><rect x="10" y="383.4" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="408.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: lo documentado es lo mínimo para actuar: qué versiones desconectar y qué archivo buscar. Verde: documentado;</tspan></text><text x="470" y="425" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">gris: no se sabe.</tspan></text><text x="470" y="472.68" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: CISA, directiva de emergencia ED 21-01 (13 dic 2020). Fuente: SolarWinds, aviso de seguridad y blog (ene 2021).</tspan></text></svg>
