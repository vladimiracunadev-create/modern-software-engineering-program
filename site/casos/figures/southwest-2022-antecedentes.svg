<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la política de septiembre de 2022 a la sanción de diciembre de 2023, en seis hitos</title><desc id="d">Eje no proporcional con seis hitos: septiembre de 2022 Southwest cambia su plan de atención al cliente; 21 de diciembre una tormenta golpea a varias aerolíneas; 24 de diciembre la reasignación de tripulaciones está desbordada; una semana más para recuperarse; 9 de febrero de 2023 audiencia del Senado; 18 de diciembre de 2023 sanción del DOT.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="472" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la política de septiembre de 2022 a la sanción de diciembre de 2023, en seis hitos</tspan></text><line x1="30" y1="195" x2="910" y2="195" stroke="#32505f" stroke-width="2"/><line x1="80" y1="195" x2="80" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="80" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="80" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="80" dy="0"></tspan></text><rect x="6" y="55" width="170" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="91" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="91" dy="0">Sep 2022: Southwest</tspan></text><text x="91" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="91" dy="0">cambia su plan de</tspan></text><text x="91" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="91" dy="0">atención al cliente</tspan></text><line x1="236" y1="195" x2="236" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="236" cy="195" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="236" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="236" dy="0"></tspan></text><rect x="151" y="235" width="170" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="236" y="263.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="236" dy="0">21 dic 2022:</tspan></text><text x="236" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="236" dy="0">tormenta; otras</tspan></text><text x="236" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="236" dy="0">aerolíneas se</tspan></text><text x="236" y="313.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="236" dy="0">recuperan</tspan></text><line x1="392" y1="195" x2="392" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="392" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="392" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="392" dy="0"></tspan></text><rect x="307" y="55" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="392" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="392" dy="0">24 dic: reasignación</tspan></text><text x="392" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="392" dy="0">de tripulaciones</tspan></text><text x="392" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="392" dy="0">desbordada</tspan></text><line x1="548" y1="195" x2="548" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="548" cy="195" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="548" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="548" dy="0"></tspan></text><rect x="463" y="235" width="170" height="100" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="548" y="272" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="548" dy="0">Una semana más para</tspan></text><text x="548" y="288.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="548" dy="0">recuperar la</tspan></text><text x="548" y="305.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="548" dy="0">operación</tspan></text><line x1="704" y1="195" x2="704" y2="155" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="704" cy="195" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="704" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="704" dy="0"></tspan></text><rect x="619" y="55" width="170" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="704" y="92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="704" dy="0">9 feb 2023:</tspan></text><text x="704" y="108.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="704" dy="0">audiencia del Comité</tspan></text><text x="704" y="125.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="704" dy="0">de Comercio</tspan></text><line x1="860" y1="195" x2="860" y2="235" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="860" cy="195" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="860" y="200" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="860" dy="0"></tspan></text><rect x="764" y="235" width="170" height="100" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="849" y="280.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">18 dic 2023: sanción</tspan></text><text x="849" y="296.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="849" dy="0">del DOT</tspan></text><rect x="10" y="365" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="389.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el colapso duró unos diez días y su respuesta regulatoria, un año. Mira que el cambio de política de</tspan></text><text x="470" y="406.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">septiembre de 2022 es lo que obligó a Southwest a reembolsar gastos de pasajeros durante el colapso.</tspan></text><text x="470" y="454.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DOT, comunicado del 18 de diciembre de 2023. Fuentes: CNN y AP sobre la audiencia del Senado (9 feb 2023).</tspan></text></svg>
