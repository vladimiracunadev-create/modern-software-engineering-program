<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 553" width="940" height="553" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Árbol de fallas: qué tuvo que coincidir para que una tormenta paralizara una aerolínea</title><desc id="d">Árbol de fallas con el colapso operativo arriba y dos ramas necesarias: una perturbación grande que requería muchos cambios de tripulación, con dos condiciones, y una capacidad de recuperación insuficiente, con cuatro.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="553" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Árbol de fallas: qué tuvo que coincidir para que una tormenta paralizara una aerolínea</tspan></text><rect x="270" y="51" width="400" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Colapso operativo con unos 16 900 vuelos cancelados</tspan></text><circle cx="470" cy="115" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="120" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Y</tspan></text><polyline points="470,91 470,103" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="155" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="232.5" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="232.5" dy="0">A. Una perturbación exige muchos cambios</tspan></text><line x1="470" y1="127" x2="232.5" y2="155" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="232.5" cy="217" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="232.5" y="222" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="232.5" dy="0">Y</tspan></text><line x1="232.5" y1="195" x2="232.5" y2="207" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="239" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="257.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Una tormenta invernal severa desde el 21 de</tspan></text><text x="232.5" y="274.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">diciembre</tspan></text><line x1="232.5" y1="231" x2="232.5" y2="239" stroke="#8a9aa3" stroke-width="1.4"/><rect x="40" y="294.28" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="232.5" y="313.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Problemas locales en aeropuertos de Denver y</tspan></text><text x="232.5" y="329.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="232.5" dy="0">Chicago</tspan></text><line x1="232.5" y1="286.28" x2="232.5" y2="294.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="485" y="155" width="445" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="707.5" y="178.64" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="707.5" dy="0">B. La recuperación no da abasto</tspan></text><line x1="470" y1="127" x2="707.5" y2="155" stroke="#8a9aa3" stroke-width="1.4"/><circle cx="707.5" cy="217" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="707.5" y="222" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="707.5" dy="0">Y</tspan></text><line x1="707.5" y1="195" x2="707.5" y2="207" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="239" width="385" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="257.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Software de reasignación superado por el volumen</tspan></text><text x="707.5" y="274.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">de cambios</tspan></text><line x1="707.5" y1="231" x2="707.5" y2="239" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="294.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="317.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Procesos manuales que no escalan</tspan></text><line x1="707.5" y1="286.28" x2="707.5" y2="294.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="342.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="365.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Tripulaciones sin comunicación fiable con despacho</tspan></text><line x1="707.5" y1="334.28" x2="707.5" y2="342.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="515" y="390.28" width="385" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="707.5" y="413.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="707.5" dy="0">Avisos y atención al cliente desbordados</tspan></text><line x1="707.5" y1="382.28" x2="707.5" y2="390.28" stroke="#8a9aa3" stroke-width="1.4"/><rect x="10" y="446.28" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="471.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la tormenta fue común a varias aerolíneas; lo específico estaba en la rama B. Estructura propia sobre lo que</tspan></text><text x="470" y="487.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuentan las fuentes, con la causa técnica en discusión entre las partes.</tspan></text><text x="470" y="535.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: CNN y AP sobre la audiencia del Senado (9 feb 2023). Análisis propio, no conclusión del DOT ni del Senado.</tspan></text></svg>
