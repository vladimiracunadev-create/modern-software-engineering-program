<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 386" width="940" height="386" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una red de vuelos punto a punto con tripulaciones que hay que reasignar</title><desc id="d">Diagrama de contexto: Southwest opera aviones, tripulaciones y aeropuertos; ante una tormenta, la programación de tripulaciones debe reasignar pilotos y auxiliares a vuelos cambiados; un software de reasignación y procesos manuales de la aerolínea lo hacen; los pasajeros dependen de la información de estado y del servicio de atención.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="386" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una red de vuelos punto a punto con tripulaciones que hay que reasignar</tspan></text><rect x="10" y="51" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="110" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">Pasajeros: más de dos</tspan></text><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="110" dy="0">millones afectados</tspan></text><rect x="10" y="112.28" width="200" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">Tripulaciones: pilotos y</tspan></text><text x="110" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="110" dy="0">auxiliares de vuelo</tspan></text><rect x="730" y="51" width="200" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Aeropuertos y sus</tspan></text><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">servicios</tspan></text><rect x="730" y="112.28" width="200" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="131.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">DOT: regulador de</tspan></text><text x="830" y="147.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">protección al consumidor</tspan></text><rect x="730" y="173.56" width="200" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="192.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">Senado: audiencia del</tspan></text><text x="830" y="209.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="830" dy="0">comité de Comercio</tspan></text><rect x="280" y="51" width="370" height="214.56" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="294" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="294" dy="0">Operación de Southwest</tspan></text><rect x="300" y="91" width="330" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Aviones y aeropuertos</tspan></text><rect x="300" y="141" width="330" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="465" y="159.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">Programación de tripulaciones y software</tspan></text><text x="465" y="176.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="465" dy="0">de reasignación</tspan></text><rect x="300" y="198.28" width="330" height="47.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="465" y="217.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">Atención al cliente: llamadas, avisos y</tspan></text><text x="465" y="233.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="465" dy="0">reembolsos</tspan></text><polyline points="210,74.64 280,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">esperan</tspan></text><polyline points="210,135.92 280,135.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="127.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="245" dy="0">dependen</tspan></text><polyline points="650,74.64 730,74.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="66.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">sirven</tspan></text><polyline points="650,135.92 730,135.92" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="127.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">regula</tspan></text><polyline points="650,197.2 730,197.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="690" y="189.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="690" dy="0">investiga</tspan></text><rect x="10" y="279.56" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="304.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: cuando falla la reasignación de tripulaciones, la red entera se bloquea aunque haya aviones y pasajeros. La</tspan></text><text x="470" y="321.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">caja roja es el elemento que más se discute en las fuentes.</tspan></text><text x="470" y="368.84" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DOT, comunicado del 18 de diciembre de 2023. Fuentes: CNN y AP sobre la audiencia del Senado (9 feb 2023).</tspan></text></svg>
