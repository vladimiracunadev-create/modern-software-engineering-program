"114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="589.857" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="645.286" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="645.286" dy="0">Atención y</tspan></text><text x="645.286" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="645.286" dy="0">reembolsos</tspan></text><text x="645.286" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="645.286" dy="0">(insuficientes)</tspan></text><rect x="731.143" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="743.143" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="706.714" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="762.143" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="762.143" dy="0">Señales</tspan></text><text x="762.143" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="762.143" dy="0">previas</tspan></text><text x="762.143" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="762.143" dy="0">(según el</tspan></text><text x="762.143" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="762.143" dy="0">sindicato,</tspan></text><text x="762.143" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="762.143" dy="0">ignoradas)</tspan></text><rect x="848" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="860" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="823.571" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="879" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">Recuperación</tspan></text><text x="879" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">(tardó otra</tspan></text><text x="879" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="879" dy="0">semana)</tspan></text><polyline points="10,136 930,136" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><rect x="10" y="399" width="920" height="59.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="423.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: las barreras que fallaron son de capacidad de recuperación, no de prevención de la tormenta. Rojo:</tspan></text><text x="470" y="440.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">insuficiente según las fuentes; dorado: existía con límites o está en discusión. Es una metáfora.</tspan></text><text x="470" y="488.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DOT, comunicado del 18 de diciembre de 2023. Fuentes: CNN y AP sobre la audiencia del Senado (9 feb 2023). Análisis</tspan></text><text x="470" y="504" font-size="12" text-anchor="middle" font-weight="400" fill="#7a2e1d"><tspan x="470" dy="0">propio, no conclusión del DOT ni del Senado.</tspan></text></svg>
