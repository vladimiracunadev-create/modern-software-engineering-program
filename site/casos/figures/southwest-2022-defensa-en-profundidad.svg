<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 522" width="940" height="522" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Defensa en profundidad: ocho barreras y por qué un problema local se volvió nacional</title><desc id="d">Láminas con huecos alineados: plan ante tormentas, recursos en aeropuertos, software de reasignación, procesos manuales, comunicación con tripulaciones, información a pasajeros, atención y reembolsos, y señales previas; una flecha las atraviesa.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="522" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Defensa en profundidad: ocho barreras y por qué un problema local se volvió nacional</tspan></text><rect x="30" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="42" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="5.57143" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="61" y="276.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">Plan ante</tspan></text><text x="61" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">tormentas</tspan></text><text x="61" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">(existía, la</tspan></text><text x="61" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">tormenta fue</tspan></text><text x="61" y="342.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="61" dy="0">peor)</tspan></text><rect x="146.857" y="51" width="62" height="170" rx="14" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><rect x="158.857" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="122.429" y="231" width="110.857" height="150" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="177.857" y="284.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="177.857" dy="0">Recursos en</tspan></text><text x="177.857" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="177.857" dy="0">aeropuertos</tspan></text><text x="177.857" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="177.857" dy="0">(descongelación</tspan></text><text x="177.857" y="334.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="177.857" dy="0">y pasarelas)</tspan></text><rect x="263.714" y="51" width="62" height="170" rx="14" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><rect x="275.714" y="114" width="38" height="44" rx="10" fill="#ffffff" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 3"/><rect x="239.286" y="231" width="110.857" height="150" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="294.714" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">Software de</tspan></text><text x="294.714" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">reasignación</tspan></text><text x="294.714" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="294.714" dy="0">(superado)</tspan></text><rect x="380.571" y="51" widt