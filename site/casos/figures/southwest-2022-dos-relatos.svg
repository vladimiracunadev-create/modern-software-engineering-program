<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 393" width="940" height="393" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dos relatos de la causa: la aerolínea y el sindicato de pilotos</title><desc id="d">Dos columnas con posiciones distintas expresadas en el Senado: el director de operaciones de Southwest dijo que la tormenta creó una cantidad y frecuencia sin precedentes de cambios de tripulaciones que desbordaron sus procesos y tecnología; el sindicato de pilotos dijo que los fallos eran previsibles y evitables y que se ignoraron avisos durante años.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="393" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dos relatos de la causa: la aerolínea y el sindicato de pilotos</tspan></text><rect x="10" y="51" width="451" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235.5" dy="0">Según Southwest (director de operaciones)</tspan></text><rect x="10" y="101" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">La tormenta fue peor de lo esperado</tspan></text><rect x="10" y="149" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Una cantidad y frecuencia sin precedentes de cambios de</tspan></text><text x="235.5" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">tripulación desbordaron procesos y tecnología</tspan></text><rect x="10" y="204.28" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235.5" y="223.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">Se actualizará el software de reasignación, se ha creado un</tspan></text><text x="235.5" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235.5" dy="0">equipo en el centro de mando y se mejoran los teléfonos</tspan></text><rect x="479" y="51" width="451" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="704.5" y="74.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="704.5" dy="0">Según el sindicato de pilotos (SWAPA)</tspan></text><rect x="479" y="101" width="451" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="124.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Los fallos eran previsibles y evitables</tspan></text><rect x="479" y="149" width="451" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="167.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Dice que desde 2011 hubo un fallo operativo grave cada 18</tspan></text><text x="704.5" y="184.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">meses de media</tspan></text><rect x="479" y="204.28" width="451" height="63.92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="704.5" y="223.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">Dice que se ignoraron avisos y que hubo más de 500 vuelos</tspan></text><text x="704.5" y="239.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">vacíos para recolocar aviones y más de 10 000 pilotos</tspan></text><text x="704.5" y="256.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="704.5" dy="0">viajando como pasajeros</tspan></text><rect x="10" y="286.2" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="311.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: son posiciones de parte, expresadas ante el Senado; Southwest no comentó las afirmaciones del sindicato</tspan></text><text x="470" y="327.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">antes de la audiencia, según CNN. Este caso no decide entre ambas.</tspan></text><text x="470" y="375.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: CNN y AP sobre la audiencia del Senado (9 feb 2023).</tspan></text></svg>
