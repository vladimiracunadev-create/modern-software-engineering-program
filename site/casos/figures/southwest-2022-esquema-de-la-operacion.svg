<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 271" width="940" height="271" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Esquema de la operación: de la tormenta a la sanción</title><desc id="d">Esquema de la operación: una aerolínea sin recuperación rápida pierde vuelos, ingresos y reputación; el DOT investiga y sanciona por consumo; el Senado investiga las causas; la aerolínea invierte en tecnología y procesos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="271" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Esquema de la operación: de la tormenta a la sanción</tspan></text><rect x="10" y="51" width="200" height="97.2" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="110" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">Tormenta y colapso</tspan></text><text x="110" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">operativo: unos 16 900</tspan></text><text x="110" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="110" dy="0">vuelos cancelados</tspan></text><rect x="250" y="51" width="200" height="97.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="350" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">Costes: más de 1 000</tspan></text><text x="350" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">millones según AP;</tspan></text><text x="350" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">reembolsos y reintegros</tspan></text><text x="350" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">de más de 600 millones</tspan></text><text x="350" y="136.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="350" dy="0">según el DOT</tspan></text><rect x="490" y="51" width="200" height="97.2" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="590" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">DOT: sanción de 140</tspan></text><text x="590" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">millones y sistema de</tspan></text><text x="590" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="590" dy="0">compensación futura</tspan></text><rect x="730" y="51" width="200" height="97.2" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="830" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">Inversión en software,</tspan></text><text x="830" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">centro de mando y</tspan></text><text x="830" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="830" dy="0">teléfonos</tspan></text><polyline points="210,99.6 250,99.6" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="450,99.6 490,99.6" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="690,99.6 730,99.6" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="164.2" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="189.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el coste de no poder recuperar una red es mayor que el de la tormenta. Las cifras de coste son de AP y del</tspan></text><text x="470" y="205.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">DOT; no se contrastaron con las cuentas de la empresa en esta sesión.</tspan></text><text x="470" y="253.48" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DOT, comunicado del 18 de diciembre de 2023. Fuentes: CNN y AP sobre la audiencia del Senado (9 feb 2023).</tspan></text></svg>
