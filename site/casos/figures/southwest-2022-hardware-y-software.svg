<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 476" width="940" height="476" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué se sabe de la pila técnica</title><desc id="d">Capas de lo que consta: software de reasignación de tripulaciones de General Electric, procesos manuales de comunicación con tripulaciones, mensajes a cabinas, sitio web de reembolsos y centro de llamadas; lenguaje, infraestructura y arquitectura no se publican.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="476" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué se sabe de la pila técnica</tspan></text><rect x="10" y="51" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="78.28" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Reasignación de tripulaciones</tspan></text><rect x="270" y="51" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Software de General Electric que sugiere cómo reasignar tripulaciones a vuelos tras una</tspan></text><text x="600" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">perturbación; superado por el número de cambios, según el director de operaciones</tspan></text><rect x="10" y="106.28" width="250" height="47.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="133.56" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Comunicación con tripulaciones</tspan></text><rect x="270" y="106.28" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="125.24" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Mensajes a ordenadores de cabina y procesos manuales; el sindicato dice que quedaron</tspan></text><text x="600" y="141.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">sin poder hablar con programación</tspan></text><rect x="10" y="161.56" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="185.2" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Avisos a pasajeros</tspan></text><rect x="270" y="161.56" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="185.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Política de avisos por texto o correo que el DOT dice que se rompió</tspan></text><rect x="10" y="209.56" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="233.2" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Reembolsos</tspan></text><rect x="270" y="209.56" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="233.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Un sitio web de solicitudes con errores que no se avisaron a los clientes</tspan></text><rect x="10" y="257.56" width="250" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="135" y="281.2" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="135" dy="0">Centro de llamadas</tspan></text><rect x="270" y="257.56" width="660" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="281.2" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">Desbordado; tono de ocupado y colas de horas</tspan></text><rect x="10" y="305.56" width="250" height="47.28" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="135" y="324.52" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">Lenguajes, infraestructura,</tspan></text><text x="135" y="341.16" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="135" dy="0">base de datos, arquitectura</tspan></text><rect x="270" y="305.56" width="660" height="47.28" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="600" y="332.84" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="600" dy="0">No constan en las fuentes consultadas; este caso no los inventa</tspan></text><rect x="10" y="368.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: las fuentes describen los síntomas visibles en cada capa, no el diseño. Verde: documentado; gris: no se</tspan></text><text x="470" y="410.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sabe.</tspan></text><text x="470" y="458.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DOT, comunicado del 18 de diciembre de 2023. Fuentes: CNN y AP sobre la audiencia del Senado (9 feb 2023).</tspan></text></svg>
