<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 298" width="940" height="298" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se compone la sanción de 140 millones de dólares</title><desc id="d">Barra apilada con los tres componentes de la sanción del DOT: 35 millones que Southwest paga al Tesoro, 72 millones que se compensan con un sistema de compensación de 90 millones y 33 millones que se acreditan por entregar 25 000 puntos a los pasajeros afectados.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="298" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo se compone la sanción de 140 millones de dólares</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#c0432f"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Pago al Tesoro</tspan></text><rect x="169.56" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="189.56" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="189.56" dy="0">Compensado con el sistema de 90 millones</tspan></text><rect x="519.16" y="45" width="12" height="12" rx="2" fill="#946512"/><text x="539.16" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="539.16" dy="0">Crédito por puntos Rapid Rewards</tspan></text><line x1="184" y1="77" x2="184" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="184" y1="117" x2="184" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="184" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="184" dy="0">0</tspan></text><line x1="414.567" y1="77" x2="414.567" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="414.567" y1="117" x2="414.567" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="414.567" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="414.567" dy="0">50</tspan></text><line x1="645.133" y1="77" x2="645.133" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="645.133" y1="117" x2="645.133" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="645.133" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="645.133" dy="0">100</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="117" x2="875.7" y2="122" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="138" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">150</tspan></text><line x1="184" y1="117" x2="875.7" y2="117" stroke="#5b7280" stroke-width="1.6"/><text x="174" y="101.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="174" dy="0">Sanción del DOT</tspan></text><rect x="184" y="84" width="161.397" height="26" fill="#c0432f" stroke="#ffffff" stroke-width="1.5"/><text x="264.698" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="264.698" dy="0">35</tspan></text><rect x="345.397" y="84" width="332.016" height="26" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="511.405" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="511.405" dy="0">72</tspan></text><rect x="677.413" y="84" width="152.174" height="26" fill="#946512" stroke="#ffffff" stroke-width="1.5"/><text x="753.5" y="101.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="753.5" dy="0">33</tspan></text><text x="836.587" y="101.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="836.587" dy="0">140</tspan></text><text x="529.85" y="161" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="529.85" dy="0">Millones de dólares de EE. UU.</tspan></text><rect x="10" y="175" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="199.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La suma es 140. Aparte de la sanción, el DOT dice que logró más de 600 millones en reembolsos y reintegros a los pasajeros</tspan></text><text x="470" y="216.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">y que Southwest pagará más de 750 millones en total por el colapso. Los 90 millones son vales de 75 dólares para pasajeros</tspan></text><text x="470" y="233.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">futuros con retrasos de tres horas o más controlables por la aerolínea.</tspan></text><text x="470" y="280.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: DOT, comunicado del 18 de diciembre de 2023. Cifras de la orden de consentimiento.</tspan></text></svg>
