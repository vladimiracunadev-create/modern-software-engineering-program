<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 336" width="940" height="336" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del 21 de diciembre a la recuperación: la secuencia según el relato de la audiencia</title><desc id="d">Cadena de la secuencia: una tormenta invernal afecta a varias aerolíneas el 21 de diciembre; Southwest tiene problemas con descongelación y pasarelas en Denver y Chicago y cancela la mayor parte de los vuelos en esos aeropuertos; el 24 la reasignación de tripulaciones está desbordada; las tripulaciones quedan varadas igual que los pasajeros; la recuperación tarda otra semana.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="336" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Del 21 de diciembre a la recuperación: la secuencia según el relato de la audiencia</tspan></text><rect x="10" y="51" width="280" height="80.56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="150" y="78.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">21 dic: tormenta invernal; otras</tspan></text><text x="150" y="94.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">aerolíneas se recuperan, Southwest</tspan></text><text x="150" y="111.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">no</tspan></text><rect x="330" y="51" width="280" height="80.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="69.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Problemas de descongelación y</tspan></text><text x="470" y="86.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pasarelas en Denver y Chicago; se</tspan></text><text x="470" y="103.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cancela la mayor parte de los</tspan></text><text x="470" y="119.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">vuelos allí</tspan></text><rect x="650" y="51" width="280" height="80.56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="790" y="86.6" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="790" dy="0">24 dic: la capacidad de reasignar</tspan></text><text x="790" y="103.24" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="790" dy="0">tripulaciones está desbordada</tspan></text><polyline points="290,91.28 330,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,91.28 650,91.28" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="790,131.56 790,146.56 150,146.56 150,165.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="165.56" width="280" height="47.28" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="150" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">Pilotos y auxiliares quedan varados</tspan></text><text x="150" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="150" dy="0">como los pasajeros</tspan></text><rect x="330" y="165.56" width="280" height="47.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="184.52" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="470" dy="0">Otra semana hasta recuperar la</tspan></text><text x="470" y="201.16" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="470" dy="0">operación</tspan></text><polyline points="290,189.2 330,189.2" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="228.84" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="253.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: un problema local de aeropuerto se propaga a toda la red cuando no se pueden reasignar tripulaciones. Mira</tspan></text><text x="470" y="270.44" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la tercera caja: ese es el cuello de botella que la audiencia sitúa. Es el relato de AP; no es una reconstrucción oficial.</tspan></text><text x="470" y="318.12" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: CNN y AP sobre la audiencia del Senado (9 feb 2023).</tspan></text></svg>
