<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 302" width="940" height="302" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuarto trimestre de 2025: cuántos de los 751 millones de usuarios pagan</title><desc id="d">Barra apilada: de 751 millones de usuarios activos mensuales, 290 millones son suscriptores Premium y los restantes 461 millones (cálculo propio) no pagan suscripción; más del 60 por ciento de los suscriptores que se suman por primera vez empieza en el nivel gratuito.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="302" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuarto trimestre de 2025: cuántos de los 751 millones de usuarios pagan</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">Suscriptores Premium</tspan></text><rect x="214.8" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="234.8" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="234.8" dy="0">Resto de usuarios activos (cálculo propio)</tspan></text><line x1="174" y1="77" x2="174" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="121" x2="174" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">0</tspan></text><line x1="349.425" y1="77" x2="349.425" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="349.425" y1="121" x2="349.425" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="349.425" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="349.425" dy="0">200</tspan></text><line x1="524.85" y1="77" x2="524.85" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="524.85" y1="121" x2="524.85" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="524.85" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524.85" dy="0">400</tspan></text><line x1="700.275" y1="77" x2="700.275" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="700.275" y1="121" x2="700.275" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="700.275" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700.275" dy="0">600</tspan></text><line x1="875.7" y1="77" x2="875.7" y2="121" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="121" x2="875.7" y2="126" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="142" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">800</tspan></text><line x1="174" y1="121" x2="875.7" y2="121" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="95" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">Usuarios activos</tspan></text><text x="164" y="112" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="164" dy="0">mensuales</tspan></text><rect x="174" y="84" width="254.366" height="30" fill="#087f8c" stroke="#ffffff" stroke-width="1.5"/><text x="301.183" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="301.183" dy="0">290</tspan></text><rect x="428.366" y="84" width="404.355" height="30" fill="#6b7c86" stroke="#ffffff" stroke-width="1.5"/><text x="630.544" y="103.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="630.544" dy="0">461</tspan></text><text x="839.721" y="103.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="839.721" dy="0">751</tspan></text><text x="524.85" y="165" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="524.85" dy="0">Millones de usuarios, T4 2025</tspan></text><rect x="10" y="179" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="203.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el nivel gratuito es la mayor parte de la audiencia y también el embudo: Spotify declara que más del 60 % de los</tspan></text><text x="470" y="220.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">suscriptores nuevos empezó allí. Dónde deja de valer: la resta 751 − 290 es del autor y agrupa a todos los usuarios que no</tspan></text><text x="470" y="237.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">son suscriptores; no es una cifra publicada de usuarios del nivel gratuito.</tspan></text><text x="470" y="284.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: comunicado T4 2025 (F2); Loud &amp; Clear (F3) para el 60 %.</tspan></text></svg>
