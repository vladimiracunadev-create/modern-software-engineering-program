<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 439" width="940" height="439" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Piezas públicas de la plataforma de datos y de ingeniería de Spotify</title><desc id="d">Diagrama de componentes basado en blogs de ingeniería de Spotify: los clientes emiten eventos que se entregan por Google Cloud Pub/Sub, se separan por tipo de evento y alimentan almacenamiento y análisis en BigQuery; la plataforma de experimentación y Backstage cierran el ciclo hacia los equipos; los servicios de reproducción no están descritos en detalle.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="439" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Piezas públicas de la plataforma de datos y de ingeniería de Spotify</tspan></text><rect x="20" y="60" width="170" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">Clientes</tspan></text><text x="105" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">(móvil, escritorio,</tspan></text><text x="105" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="105" dy="0">web)</tspan></text><rect x="240" y="60" width="190" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="335" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="335" dy="0">Entrega de eventos</tspan></text><text x="335" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="335" dy="0">(Pub/Sub, un flujo</tspan></text><text x="335" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="335" dy="0">por tipo de evento)</tspan></text><rect x="480" y="60" width="190" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="575" y="87" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="575" dy="0">ETL por horas</tspan></text><text x="575" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="575" dy="0">(particiones cerradas</tspan></text><text x="575" y="120.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="575" dy="0">y definitivas)</tspan></text><rect x="720" y="60" width="200" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="820" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="820" dy="0">Análisis y modelos</tspan></text><text x="820" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="820" dy="0">(BigQuery, Dataproc)</tspan></text><polyline points="190,100 240,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="430,100 480,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="670,100 720,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="240" y="200" width="190" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="335" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="335" dy="0">Plataforma de</tspan></text><text x="335" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="335" dy="0">experimentación</tspan></text><text x="335" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="335" dy="0">(sustituyó a ABBA)</tspan></text><rect x="480" y="200" width="190" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="575" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="575" dy="0">Backstage</tspan></text><text x="575" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="575" dy="0">(portal interno,</tspan></text><text x="575" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="575" dy="0">código abierto)</tspan></text><rect x="20" y="200" width="170" height="80" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="105" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="105" dy="0">Servicios de</tspan></text><text x="105" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="105" dy="0">reproducción y</tspan></text><text x="105" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="105" dy="0">catálogo</tspan></text><polyline points="815,140 815,170 335,170 335,200" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="430,240 480,240" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="105,200 105,140" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="720" y="200" width="200" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="820" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="820" dy="0">Equipos autónomos</tspan></text><text x="820" y="243.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="820" dy="0">(escuadras) que</tspan></text><text x="820" y="260.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="820" dy="0">deciden con datos</tspan></text><polyline points="670,240 720,240" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="305" width="920" height="92.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="338.2" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: líneas continuas = documentado en blogs de ingeniería; líneas y cajas discontinuas = no descrito o inferido. Lo</tspan></text><text x="470" y="354.84" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">documentado es una canalización de datos y herramientas, no el camino de audio. Dónde deja de valer: los blogs son de 2016</tspan></text><text x="470" y="371.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">a 2021; la infraestructura actual puede haber cambiado y no se sabe cómo se sirven hoy los archivos de audio.</tspan></text><text x="470" y="425.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Spotify Engineering (event delivery 2016/2019/2021; experimentación 2020); Google Cloud (2016); docs de Backstage.</tspan></text></svg>
