<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 379" width="940" height="379" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuánto creció cada magnitud entre las dos observaciones que publica Spotify (veces)</title><desc id="d">Barras horizontales con factores de crecimiento calculados con cifras citadas: usuarios de 75 a 232 millones (3,1 veces), eventos diarios de 100 a 500 mil millones entre abril de 2017 y el primer trimestre de 2019 (5 veces) y el pico de eventos por segundo de 1,5 a más de 8 millones (5,3 veces).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="379" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuánto creció cada magnitud entre las dos observaciones que publica Spotify (veces)</tspan></text><line x1="354" y1="49" x2="354" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="181" x2="354" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="533.273" y1="49" x2="533.273" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="533.273" y1="181" x2="533.273" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="533.273" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="533.273" dy="0">2</tspan></text><line x1="712.547" y1="49" x2="712.547" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="712.547" y1="181" x2="712.547" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="712.547" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="712.547" dy="0">4</tspan></text><line x1="891.82" y1="49" x2="891.82" y2="181" stroke="#d5dde1" stroke-width="1"/><line x1="891.82" y1="181" x2="891.82" y2="186" stroke="#5b7280" stroke-width="1.4"/><text x="891.82" y="202" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="891.82" dy="0">6</tspan></text><line x1="354" y1="181" x2="891.82" y2="181" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="75.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Usuarios (2016 → 2019)</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Eventos diarios (abr. 2017 → T1 2019)</tspan></text><text x="344" y="155" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Pico de eventos por segundo (entrada en</tspan></text><text x="344" y="172" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">producción → T1 2019)</tspan></text><rect x="354" y="55" width="277.874" height="32" rx="3" fill="#c0432f"/><text x="638.874" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="638.874" dy="0">3,1</tspan></text><rect x="354" y="99" width="448.183" height="32" rx="3" fill="#c0432f"/><text x="809.183" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="809.183" dy="0">5,0</tspan></text><rect x="354" y="143" width="475.074" height="32" rx="3" fill="#c0432f"/><text x="836.074" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="836.074" dy="0">5,3</tspan></text><text x="622.91" y="225" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="622.91" dy="0">Veces (cifra final ÷ cifra inicial)</tspan></text><rect x="10" y="239" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="263.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: los datos crecieron más deprisa que los usuarios, lo que Spotify explica porque el crecimiento depende también de</tspan></text><text x="470" y="280.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuántos equipos instrumentan y cuántos analistas piden datos. Dónde deja de valer: son factores del autor entre cifras de</tspan></text><text x="470" y="297.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fuentes distintas y con definiciones distintas (usuarios de 2016 frente a MAU de 2019; el pico inicial es 1,5 M y el final</tspan></text><text x="470" y="313.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">es «más de 8 M»); sirven como orden de magnitud, no como medición.</tspan></text><text x="470" y="361.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Google Cloud 2016; Spotify Engineering 2019 (F4, F5); cálculo propio.</tspan></text></svg>
