<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del año en música a Discover Weekly: cómo se validó antes de lanzarse a todos</title><desc id="d">Flujo del origen de Discover Weekly según Spotify: de Year in Music en 2011 y de la lista Play it Forward de 2014 más la página Discover surgió la primera versión; se probó con empleados, luego con una prueba pequeña de usuarios con más de 1.500 respuestas a una encuesta y un grupo de control con imagen por defecto, y después se lanzó a todos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="530" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Del año en música a Discover Weekly: cómo se validó antes de lanzarse</tspan></text><rect x="20" y="60" width="140" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="90" y="95" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="90" dy="0">2011</tspan></text><text x="90" y="111.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="90" dy="0">Year in Music</tspan></text><text x="90" y="128.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="90" dy="0">(recap anual)</tspan></text><rect x="170" y="60" width="140" height="96" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="86.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">2014</tspan></text><text x="240" y="103.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Play it Forward</tspan></text><text x="240" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">(lista de música</tspan></text><text x="240" y="136.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">nueva)</tspan></text><rect x="320" y="60" width="140" height="96" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="390" y="78.36" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">Se fusiona con</tspan></text><text x="390" y="95" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">la</tspan></text><text x="390" y="111.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">página Discover</tspan></text><text x="390" y="128.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">→ primera</tspan></text><text x="390" y="144.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="390" dy="0">versión</tspan></text><rect x="470" y="60" width="140" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="540" y="103.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="540" dy="0">Prueba interna:</tspan></text><text x="540" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="540" dy="0">empleados</tspan></text><rect x="620" y="60" width="140" height="96" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="690" y="78.36" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690" dy="0">Prueba con</tspan></text><text x="690" y="95" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690" dy="0">usuarios:</tspan></text><text x="690" y="111.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690" dy="0">+1.500</tspan></text><text x="690" y="128.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690" dy="0">respuestas</tspan></text><text x="690" y="144.92" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="690" dy="0">y control</tspan></text><rect x="770" y="60" width="140" height="96" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="840" y="103.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">Lanzamiento</tspan></text><text x="840" y="119.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">a todos</tspan></text><polyline points="160,108 170,108" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="310,108 320,108" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="460,108 470,108" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="610,108 620,108" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="760,108 770,108" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="185" width="440" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Decisiones de diseño: dos horas de duración y una</tspan></text><text x="240" y="228.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">actualización semanal, para que cada canción se sintiera</tspan></text><text x="240" y="245.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">especial y se formara el hábito.</tspan></text><rect x="480" y="185" width="440" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="220.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">Un error que se conservó: un fallo que dejaba pasar</tspan></text><text x="700" y="236.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">contenido semiconocido generaba confianza y se mantuvo.</tspan></text><rect x="20" y="280" width="440" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="298.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Sesgo evitado: los empleados son superusuarios, así que</tspan></text><text x="240" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">se hizo una prueba con usuarios; el grupo de control con</tspan></text><text x="240" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">imagen por defecto mostró el efecto de la imagen</tspan></text><text x="240" y="348.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">personalizada.</tspan></text><rect x="480" y="280" width="440" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="315.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Límite: la fuente de 2015 no publica cuántos usuarios</tspan></text><text x="700" y="331.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">tuvo la prueba ni los resultados numéricos de retención.</tspan></text><rect x="10" y="376" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="398.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: de izquierda a derecha el camino del producto; la mayor parte de la tecnología de personalización ya existía y</tspan></text><text x="470" y="415.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">estaba escondida varias capas dentro del producto, y lo nuevo fue el formato (la lista, el ritmo semanal, la imagen). Dónde</tspan></text><text x="470" y="432.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">deja de valer: es un relato de Spotify sobre su éxito; las cifras de 75 millones de listas semanales las da la propia</tspan></text><text x="470" y="448.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">empresa y no se verificaron aparte.</tspan></text><text x="470" y="492.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify Engineering, «What made Discover Weekly one of our most successful feature launches to date?», noviembre de 2015</tspan></text><text x="470" y="507.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">(F7).</tspan></text></svg>
