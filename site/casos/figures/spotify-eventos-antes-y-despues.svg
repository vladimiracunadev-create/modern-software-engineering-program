<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" width="940" height="650" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La infraestructura de eventos antes y después del rediseño de 2021</title><desc id="d">Comparación de la infraestructura de eventos heredada y la nueva según Spotify: antes, eventos en texto separado por tabuladores guardados en disco del perímetro, servicios con estado y un esquema difícil de propagar; después, SDK con modelo de datos nuevo, receptor disponible, plano de control para declarar eventos, deduplicación con identificadores y Dataflow gestionado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="650" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La infraestructura de eventos antes y después del rediseño de 2021</tspan></text><rect x="20" y="55" width="440" height="40" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="78.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="240" dy="0">Antes (heredada)</tspan></text><rect x="480" y="55" width="440" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="78.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="700" dy="0">Después (nueva, anunciada en 2021)</tspan></text><rect x="20" y="105" width="440" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="128.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Formato: cadenas TSV convertidas a Avro con una</tspan></text><text x="240" y="144.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">biblioteca de 2007</tspan></text><rect x="480" y="105" width="440" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="128.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Modelo de datos nuevo con SDK y esquemas declarados en un</tspan></text><text x="700" y="144.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">plano de control</tspan></text><polyline points="460,133 480,133" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="171" width="440" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="194.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Eventos en disco del perímetro y reenviados: servicio con</tspan></text><text x="240" y="210.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">estado</tspan></text><rect x="480" y="171" width="440" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="202.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Receptor como API disponible; el cliente guarda y reenvía</tspan></text><polyline points="460,199 480,199" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="237" width="440" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Móviles «dispara y olvida»: pérdida pequeña en casi todos</tspan></text><text x="240" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">los datos</tspan></text><rect x="480" y="237" width="440" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="260.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Reenvíos del cliente y deduplicación por identificador de</tspan></text><text x="700" y="276.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">mensaje</tspan></text><polyline points="460,265 480,265" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="303" width="440" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="326.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Propagar un esquema tardaba horas; instrumentar tardaba</tspan></text><text x="240" y="342.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">una semana</tspan></text><rect x="480" y="303" width="440" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="326.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Control de eventos declarativo; adoptar sin intervención</tspan></text><text x="700" y="342.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">del equipo</tspan></text><polyline points="460,331 480,331" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="369" width="440" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="400.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Trabajo pesado de Hadoop trasladado a Dataproc</tspan></text><rect x="480" y="369" width="440" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="400.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Scio sobre Dataflow gestionado, sin Hadoop</tspan></text><polyline points="460,397 480,397" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="439" width="900" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="454" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Restricción de la migración: la «cola larga» — las versiones antiguas de la app tardan meses en actualizarse y algunos</tspan></text><text x="470" y="470.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dispositivos nunca lo harán —, por lo que ambas infraestructuras convivieron con un exportador que convierte lo</tspan></text><text x="470" y="487.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">heredado.</tspan></text><rect x="10" y="511" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="533.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cada fila contrasta una limitación heredada con su corrección; la flecha une las dos columnas. Lo heredado se</tspan></text><text x="470" y="550.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mantuvo por una razón estratégica de 2016: migrar rápido a la nube compatible hacia atrás. Dónde deja de valer: son</tspan></text><text x="470" y="567.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">afirmaciones de Spotify sobre su propio sistema; no hay medición independiente del resultado ni cifras de pérdida</tspan></text><text x="470" y="583.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">posteriores.</tspan></text><text x="470" y="627.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify Engineering, «Changing the Wheels on a Moving Bus» (octubre de 2021). Dibujo propio.</tspan></text></svg>
