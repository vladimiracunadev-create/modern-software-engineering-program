<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 575" width="940" height="575" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Entrega de eventos en Google Cloud: un tema, un ETL y un destino por cada tipo de evento</title><desc id="d">Diagrama de la arquitectura de entrega de eventos de Spotify en 2019: los clientes y los servicios envían eventos al servicio de eventos, que reconoce el tipo y rechaza los mal formados; cada tipo tiene su propio tema de Pub/Sub, su ETL y su destino; un compositor central crea esos recursos; los tipos se clasifican en importancia alta, media y baja con objetivos de entrega distintos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="575" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Entrega de eventos en Google Cloud: un tema, un ETL y un destino por tipo de evento</tspan></text><rect x="20" y="60" width="170" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="105" y="90.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="105" dy="0">Clientes y servicios</tspan></text><text x="105" y="106.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="105" dy="0">(emiten eventos)</tspan></text><rect x="230" y="60" width="170" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="315" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="315" dy="0">Servicio de eventos</tspan></text><text x="315" y="98.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="315" dy="0">(reconoce el tipo;</tspan></text><text x="315" y="115.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="315" dy="0">rechaza los malos)</tspan></text><polyline points="190,95 230,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="440" y="45" width="480" height="180" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="454" y="67" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="454" dy="0">Un carril por cada tipo de evento (más de 500 tipos)</tspan></text><rect x="460" y="80" width="130" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="525" y="103.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="525" dy="0">Tema de</tspan></text><text x="525" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="525" dy="0">Pub/Sub</tspan></text><rect x="610" y="80" width="130" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="675" y="103.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675" dy="0">ETL (un clúster</tspan></text><text x="675" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="675" dy="0">por tipo)</tspan></text><rect x="760" y="80" width="140" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="103.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Destino: GCS</tspan></text><text x="830" y="119.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">o BigQuery</tspan></text><polyline points="590,108 610,108" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="740,108 760,108" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="460" y="150" width="440" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="680" y="173.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="680" dy="0">Particiones por hora o por día, inmutables una vez</tspan></text><text x="680" y="189.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="680" dy="0">cerradas</tspan></text><polyline points="400,95 460,108" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="245" width="280" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="160" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">Importancia ALTA: pagan regalías o</tspan></text><text x="160" y="293.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">calculan métricas clave; objetivo</tspan></text><text x="160" y="310.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="160" dy="0">de entrega de pocas horas</tspan></text><rect x="330" y="245" width="280" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Importancia MEDIA: objetivo de 24</tspan></text><text x="470" y="293.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">horas, para datos que se necesitan</tspan></text><text x="470" y="310.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">al día siguiente</tspan></text><rect x="640" y="245" width="280" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="780" y="285.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="780" dy="0">Importancia BAJA: objetivo de 72</tspan></text><text x="780" y="301.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="780" dy="0">horas, uso mayormente interno</tspan></text><rect x="20" y="350" width="440" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="372" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">Compositor central: por cada tipo nuevo crea tema y</tspan></text><text x="240" y="388.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">suscripción, clúster ETL, distribuye el esquema, registra</tspan></text><text x="240" y="405.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="240" dy="0">el SLO y configura monitoreo; limpia al retirar el tipo.</tspan></text><rect x="480" y="350" width="440" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="372" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">Cerca de 15 microservicios en unas 2 500 máquinas</tspan></text><text x="700" y="388.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">virtuales; algunos con autoescalado, lo que alarga a tres</tspan></text><text x="700" y="405.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">horas el despliegue de toda la flota.</tspan></text><rect x="10" y="436" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="458.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el servicio de eventos es la única puerta; a partir de ahí cada tipo viaja solo, así un tipo ruidoso o roto no</tspan></text><text x="470" y="475.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">frena a los demás. Los tres escalones de importancia fijan qué se atiende primero en un incidente y a quién se despierta.</tspan></text><text x="470" y="492.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en F5 para 2019. Dónde deja de valer: es el sistema de 2016-2019; la fuente de 2021 (F5-bis) describe otro</tspan></text><text x="470" y="508.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">rediseño y no se sabe qué parte sigue vigente hoy.</tspan></text><text x="470" y="552.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify Engineering, «Spotify&#x27;s Event Delivery – Life in the Cloud» (noviembre de 2019). Dibujo propio.</tspan></text></svg>
