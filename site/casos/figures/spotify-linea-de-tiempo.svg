<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 443" width="940" height="443" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Spotify: producto, plataforma de datos y práctica de experimentación</title><desc id="d">Línea de tiempo de 2006 a 2026 con tres carriles: producto (música, podcasts, audiolibros), plataforma (centros de datos propios y Google Cloud desde 2016, con Kafka apagado en febrero de 2017) y práctica de datos (ABBA en 2013, nueva plataforma de experimentación en 2020); marcadores de fundación, lanzamiento, nube y audiolibros.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="443" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Spotify: producto, plataforma de datos y práctica de experimentación</tspan></text><line x1="174" y1="83" x2="174" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="174" y1="245" x2="174" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="174" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="174" dy="0">2 006</tspan></text><line x1="321.6" y1="83" x2="321.6" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="321.6" y1="245" x2="321.6" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="321.6" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="321.6" dy="0">2 010</tspan></text><line x1="469.2" y1="83" x2="469.2" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="469.2" y1="245" x2="469.2" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="469.2" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="469.2" dy="0">2 014</tspan></text><line x1="616.8" y1="83" x2="616.8" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="616.8" y1="245" x2="616.8" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="616.8" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="616.8" dy="0">2 018</tspan></text><line x1="764.4" y1="83" x2="764.4" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="764.4" y1="245" x2="764.4" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="764.4" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="764.4" dy="0">2 022</tspan></text><line x1="912" y1="83" x2="912" y2="245" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="245" x2="912" y2="250" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="266" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2 026</tspan></text><line x1="174" y1="245" x2="912" y2="245" stroke="#5b7280" stroke-width="1.6"/><text x="164" y="114.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">Producto</tspan></text><text x="164" y="168.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">Plataforma</tspan></text><text x="164" y="222.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="164" dy="0">Datos y experimentos</tspan></text><line x1="247.8" y1="75" x2="247.8" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="247.8" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="247.8" dy="0">Lanzamiento</tspan></text><line x1="432.3" y1="75" x2="432.3" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="432.3" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="432.3" dy="0">ABBA</tspan></text><line x1="543" y1="75" x2="543" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="543" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="543" dy="0">Nube</tspan></text><line x1="579.9" y1="75" x2="579.9" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="601.39" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="601.39" dy="0">Kafka off</tspan></text><line x1="764.4" y1="75" x2="764.4" y2="245" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="764.4" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="764.4" dy="0">Audiolibros</tspan></text><rect x="247.8" y="92" width="258.3" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="376.95" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="376.95" dy="0">Música en streaming</tspan></text><rect x="506.1" y="92" width="258.3" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="635.25" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="635.25" dy="0">Podcasts y descubrimiento</tspan></text><rect x="764.4" y="92" width="147.6" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="838.2" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="838.2" dy="0">Audiolibros</tspan></text><line x1="14" y1="137" x2="912" y2="137" stroke="#d5dde1" stroke-width="1"/><rect x="247.8" y="146" width="295.2" height="36" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="395.4" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="395.4" dy="0">Centros de datos propios</tspan></text><rect x="543" y="146" width="369" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="727.5" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="727.5" dy="0">Google Cloud (datos y servicios)</tspan></text><line x1="14" y1="191" x2="912" y2="191" stroke="#d5dde1" stroke-width="1"/><rect x="432.3" y="200" width="258.3" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="561.45" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="561.45" dy="0">ABBA y eventos</tspan></text><rect x="690.6" y="200" width="221.4" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="801.3" y="222.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="801.3" dy="0">Plataforma nueva</tspan></text><text x="543" y="289" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="543" dy="0">Año</tspan></text><rect x="10" y="303" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="327.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: lanzamiento en 2008 y audiolibros en 2022 (Spotify Newsroom); decisión de ir a Google Cloud en febrero de 2016</tspan></text><text x="470" y="344.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(Google Cloud); apagado del sistema basado en Kafka en febrero de 2017 (F5); ABBA en 2013 y nueva plataforma en 2020 (F6).</tspan></text><text x="470" y="361.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Fuente secundaria: fundación en 2006 y bolsa en 2018. Dónde deja de valer: las eras son síntesis del autor; la migración</tspan></text><text x="470" y="377.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">fue gradual y no hubo un corte único en 2016.</tspan></text><text x="470" y="425.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1, F4, F5, F6 y F13; síntesis propia de las eras.</tspan></text></svg>
