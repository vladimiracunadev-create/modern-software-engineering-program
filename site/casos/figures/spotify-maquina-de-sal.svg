<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 519" width="940" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La «máquina de sal»: cuánto hay que sobreasignar cuando se rebarajan usuarios libres</title><desc id="d">Gráfico de líneas: el factor de compensación es la inversa de la fracción de usuarios que recibe una nueva sal; con la mitad es 2, con una cuarta parte es 4 y con una quinta parte es 5, el umbral por encima del cual Spotify recomienda no iniciar experimentos nuevos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="519" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La «máquina de sal»: cuánto hay que sobreasignar cuando se rebarajan usuarios libres</tspan></text><line x1="71.08" y1="319" x2="910" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="319" x2="71.08" y2="319" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="323.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="267" x2="910" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="267" x2="71.08" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">2</tspan></text><line x1="71.08" y1="215" x2="910" y2="215" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="215" x2="71.08" y2="215" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="219.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">4</tspan></text><line x1="71.08" y1="163" x2="910" y2="163" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="163" x2="71.08" y2="163" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="167.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">6</tspan></text><line x1="71.08" y1="111" x2="910" y2="111" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="111" x2="71.08" y2="111" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="115.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">8</tspan></text><line x1="71.08" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="59" x2="71.08" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="59" x2="71.08" y2="319" stroke="#5b7280" stroke-width="1.6"/><line x1="89.08" y1="59" x2="89.08" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="89.08" y1="319" x2="89.08" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="89.08" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="89.08" dy="0">0,1</tspan></text><line x1="289.81" y1="59" x2="289.81" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="289.81" y1="319" x2="289.81" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="289.81" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="289.81" dy="0">0,2</tspan></text><line x1="390.175" y1="59" x2="390.175" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="390.175" y1="319" x2="390.175" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="390.175" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="390.175" dy="0">0,25</tspan></text><line x1="892" y1="59" x2="892" y2="319" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="319" x2="892" y2="324" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="340" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">0,5</tspan></text><line x1="71.08" y1="319" x2="910" y2="319" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="189" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 189)">Factor de compensación (veces)</text><text x="490.54" y="365" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="490.54" dy="0">Fracción de los usuarios que cae en la nueva sal</tspan></text><line x1="71.08" y1="189" x2="910" y2="189" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="5 4"/><text x="77.08" y="183" font-size="13" text-anchor="start" font-weight="700" fill="#5c1f14" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="77.08" dy="0">umbral práctico de Spotify: 5</tspan></text><polyline points="892,267 390.175,215 289.81,189 89.08,59" fill="none" stroke="#c0432f" stroke-width="2.4"/><circle cx="892" cy="267" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="892" y="256" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">2</tspan></text><circle cx="390.175" cy="215" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="390.175" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="390.175" dy="0">4</tspan></text><circle cx="289.81" cy="189" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="289.81" y="178" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="289.81" dy="0">5</tspan></text><circle cx="89.08" cy="59" r="5.5" fill="#c0432f" stroke="#c0432f" stroke-width="2"/><text x="89.08" y="48" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="89.08" dy="0">10</tspan></text><rect x="10" y="379" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cuantos menos usuarios reciben la sal nueva, más cubos hay que asignar para obtener la misma población, y más</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">espacio se desperdicia. Documentado: el ejemplo de la fuente (mitad de los usuarios, factor 2, cuatro de ocho cubos para el</tspan></text><text x="470" y="437.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">25 %) y la regla de no empezar experimentos con factor superior a 5. Dónde deja de valer: la serie 0,25, 0,2 y 0,1 es</tspan></text><text x="470" y="453.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cálculo propio con la misma fórmula; Spotify dice que trabaja en una segunda iteración del esquema de asignación.</tspan></text><text x="470" y="501.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify Engineering, «Spotify&#x27;s New Experimentation Platform (Part 2)», noviembre de 2020 (F13); fórmula 1/f.</tspan></text></svg>
