<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" width="940" height="510" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Margen bruto por segmento de Spotify: nueve meses de 2024 y de 2025 (porcentaje del ingreso)</title><desc id="d">Barras agrupadas: el margen bruto del segmento Premium pasa de 31,7 por ciento en los nueve primeros meses de 2024 a 33,2 en 2025, y el del segmento financiado con publicidad de 11,2 a 17,4 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="510" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Margen bruto por segmento de Spotify: nueve meses de 2024 y de 2025 (porcentaje del ingreso)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">9 meses de 2024</tspan></text><rect x="177.1" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="197.1" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="197.1" dy="0">9 meses de 2025</tspan></text><line x1="71.08" y1="335" x2="920" y2="335" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="335" x2="71.08" y2="335" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="339.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">0</tspan></text><line x1="71.08" y1="275" x2="920" y2="275" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="275" x2="71.08" y2="275" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="279.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">10</tspan></text><line x1="71.08" y1="215" x2="920" y2="215" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="215" x2="71.08" y2="215" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="219.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">20</tspan></text><line x1="71.08" y1="155" x2="920" y2="155" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="155" x2="71.08" y2="155" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="159.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">30</tspan></text><line x1="71.08" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="66.08" y1="95" x2="71.08" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="62.08" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="62.08" dy="0">40</tspan></text><line x1="71.08" y1="95" x2="71.08" y2="335" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="215" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 215)">Margen bruto (porcentaje del ingreso del segmento)</text><rect x="113.526" y="144.8" width="167.784" height="190.2" rx="3" fill="#6b7c86"/><text x="197.418" y="138.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="197.418" dy="0">31,7</tspan></text><rect x="285.31" y="135.8" width="167.784" height="199.2" rx="3" fill="#087f8c"/><text x="369.202" y="129.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="369.202" dy="0">33,2</tspan></text><text x="283.31" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.31" dy="0">Premium</tspan></text><rect x="537.986" y="267.8" width="167.784" height="67.2" rx="3" fill="#6b7c86"/><text x="621.878" y="261.8" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="621.878" dy="0">11,2</tspan></text><rect x="709.77" y="230.6" width="167.784" height="104.4" rx="3" fill="#087f8c"/><text x="793.662" y="224.6" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="793.662" dy="0">17,4</tspan></text><text x="707.77" y="356" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="707.77" dy="0">Ad-Supported (publicidad)</tspan></text><rect x="10" y="387" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="411.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el nivel gratuito deja mucho menos margen bruto que la suscripción, aunque mejora; la suscripción pesa 90 % del</tspan></text><text x="470" y="428.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ingreso. Dónde deja de valer: cálculo propio sobre cifras del 6-K (ganancia bruta dividida por ingreso del segmento); los</tspan></text><text x="470" y="445.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">gastos de operación no se asignan a segmentos.</tspan></text><text x="470" y="492.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify, formulario 6-K del tercer trimestre de 2025, nota de segmentos (F14); cálculo propio.</tspan></text></svg>
