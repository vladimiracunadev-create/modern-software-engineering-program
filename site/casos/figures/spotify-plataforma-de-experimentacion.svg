<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 519" width="940" height="519" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La plataforma de experimentación: configuración remota, catálogo de métricas y planificador</title><desc id="d">Diagrama de la plataforma de experimentación de Spotify de 2020: la configuración remota entrega propiedades a los clientes y registra eventos de asignación y aplicación; el catálogo de métricas ingiere métricas en un almacén; el planificador, con interfaz en Backstage, crea, lanza y analiza experimentos y avisa de problemas de validez.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="519" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La plataforma de experimentación: configuración remota, catálogo de métricas y planificador</tspan></text><rect x="20" y="60" width="190" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="115" y="90.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="115" dy="0">Cliente</tspan></text><text x="115" y="106.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="115" dy="0">(app o servicio)</tspan></text><rect x="260" y="60" width="220" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="370" y="90.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="370" dy="0">Configuración remota</tspan></text><text x="370" y="106.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="370" dy="0">(propiedades y políticas)</tspan></text><polyline points="210,85 260,85" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="235" y="72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">pide</tspan></text><polyline points="260,110 210,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="235" y="128" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">valores</tspan></text><rect x="530" y="60" width="190" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="625" y="90.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="625" dy="0">Eventos «asignada» y</tspan></text><text x="625" y="106.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="625" dy="0">«aplicada»</tspan></text><polyline points="480,95 530,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="760" y="60" width="160" height="70" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="840" y="82" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">Catálogo de</tspan></text><text x="840" y="98.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">métricas (SQL a un</tspan></text><text x="840" y="115.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="840" dy="0">almacén)</tspan></text><polyline points="720,95 760,95" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="170" width="900" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="198.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Planificador de experimentos (interfaz en Backstage): crea, lanza, detiene y analiza; exige definir de antemano</tspan></text><text x="470" y="214.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">hipótesis, métricas de éxito y de guardia, y ofrece una calculadora de tamaño de muestra.</tspan></text><polyline points="840,130 840,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="370,130 370,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="255" width="290" height="110" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="165" y="288.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">Propiedad: variable con tipo y valor</tspan></text><text x="165" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">por defecto, declarada en un archivo</tspan></text><text x="165" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">junto al código. Solo se transfieren</tspan></text><text x="165" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">los valores que difieren del defecto.</tspan></text><rect x="325" y="255" width="290" height="110" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="288.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Los valores se descargan en segundo</tspan></text><text x="470" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">plano pero solo se aplican al</tspan></text><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">relanzar la app: la experiencia no</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">cambia a mitad de sesión.</tspan></text><rect x="630" y="255" width="290" height="110" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="775" y="288.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="775" dy="0">Exposición: asignada Y aplicada (y,</tspan></text><text x="775" y="305.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="775" dy="0">opcionalmente, una fuente de</tspan></text><text x="775" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="775" dy="0">exposición propia, como visitar una</tspan></text><text x="775" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="775" dy="0">página).</tspan></text><rect x="10" y="380" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="402.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el cliente pide su configuración; la política decide qué valores recibe y registra dos eventos; esos eventos y las</tspan></text><text x="470" y="419.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">métricas alimentan al planificador. El valor por defecto da una experiencia predecible si el cliente no logra descargar</tspan></text><text x="470" y="436.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">nada. Dónde deja de valer: Spotify describe la plataforma de 2020; no se sabe cuántos experimentos corren a la vez ni</tspan></text><text x="470" y="452.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuántos se descartan.</tspan></text><text x="470" y="496.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify Engineering, «Spotify&#x27;s New Experimentation Platform (Part 1)», octubre de 2020 (F6). Dibujo propio.</tspan></text></svg>
