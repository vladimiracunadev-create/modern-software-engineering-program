<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 407" width="940" height="407" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde tiene Spotify entidades y oficinas que su propia página de contacto publica</title><desc id="d">Diagrama por regiones de las entidades de Spotify con dirección publicada: sede en Estocolmo y sociedad matriz en Luxemburgo; en Europa Bruselas, Berlín, Copenhague, Madrid, Helsinki, París, Milán, Ámsterdam y Londres; en América Nueva York, Toronto y Ciudad de México; en Asia Mumbai e Israel.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="407" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde tiene Spotify entidades y oficinas que su propia página de contacto publica</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Europa</tspan></text><rect x="10" y="92" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: sede del servicio en Estocolmo; Spotify</tspan></text><text x="235" y="129.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Technology S.A. en Luxemburgo; entidades en Bruselas,</tspan></text><text x="235" y="146.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Berlín, Copenhague, Madrid, Helsinki, París, Milán,</tspan></text><text x="235" y="162.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Ámsterdam y Londres (F12).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">América</tspan></text><rect x="480" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: Spotify USA en Nueva York, que presta el</tspan></text><text x="705" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">servicio en Estados Unidos; entidades en Toronto y Ciudad</tspan></text><text x="705" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">de México (F12).</tspan></text><rect x="10" y="192.4" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="213.32" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Asia y Oriente Medio</tspan></text><rect x="10" y="234.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="255.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: Spotify India en Mumbai y una entidad en</tspan></text><text x="235" y="271.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Israel, sin dirección en la página (F12).</tspan></text><rect x="480" y="175.8" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="196.72" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Lo que no se sabe</tspan></text><rect x="480" y="217.8" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="238.7" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: años de apertura de cada oficina, dónde están</tspan></text><text x="705" y="255.34" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">los centros de ingeniería y cuántas personas trabajan en</tspan></text><text x="705" y="271.98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">cada una.</tspan></text><rect x="10" y="301.6" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="324.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: son entidades legales con dirección de contacto, no necesariamente centros de ingeniería. Dónde deja de valer: la</tspan></text><text x="470" y="341.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">página no fecha las aperturas ni cuenta plantilla; el servicio opera en 184 mercados con muchas menos oficinas.</tspan></text><text x="470" y="384.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F1 y F12.</tspan></text></svg>
