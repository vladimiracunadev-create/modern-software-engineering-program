<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 622" width="940" height="622" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un evento desde un móvil sin conexión: reenvíos, duplicados y su deduplicación</title><desc id="d">Secuencia de un evento del cliente móvil en la nueva infraestructura de eventos de Spotify: el SDK lo guarda si no hay conexión, lo reenvía según una política, el receptor lo acepta y lo publica, y el trabajo de deduplicación usa el identificador del mensaje para eliminar duplicados con una ventana de semanas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="622" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un evento desde un móvil sin conexión: reenvíos, duplicados y deduplicación</tspan></text><rect x="20" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">App del</tspan></text><text x="95" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">usuario (SDK)</tspan></text><rect x="270" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="345" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">Receptor</tspan></text><text x="345" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">(API disponible)</tspan></text><rect x="520" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="595" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595" dy="0">Entrega y</tspan></text><text x="595" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595" dy="0">deduplicación</tspan></text><rect x="770" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="845" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845" dy="0">Conjunto de</tspan></text><text x="845" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845" dy="0">datos</tspan></text><line x1="95" y1="98" x2="95" y2="456" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="345" y1="98" x2="345" y2="456" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="595" y1="98" x2="595" y2="456" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="845" y1="98" x2="845" y2="456" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="103" y="115.32" width="234" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="220" y="125.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="220" dy="0">1. sin conexión: el evento</tspan></text><text x="220" y="142.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="220" dy="0">queda guardado</tspan></text><polyline points="95,176.32 345,176.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="169.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">2. al volver la red, reenvía el evento</tspan></text><polyline points="345,220.32 95,220.32" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="220" y="213.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">3. confirma</tspan></text><polyline points="345,264.32 595,264.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="257.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">4. publica con identificador de mensaje</tspan></text><polyline points="95,308.32 345,308.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">5. si no llegó la confirmación, reenvía otra vez</tspan></text><polyline points="345,352.32 595,352.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="345.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">6. llega un duplicado</tspan></text><rect x="603" y="379.32" width="234" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="720" y="389.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">7. busca el identificador;</tspan></text><text x="720" y="406.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">descarta</tspan></text><polyline points="595,440.32 845,440.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="720" y="433.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="720" dy="0">8. escribe una sola copia</tspan></text><rect x="10" y="466" width="920" height="105" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="488.86" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la flecha continua es un envío y la discontinua una confirmación. Los reenvíos pueden ocurrir de inmediato, en</tspan></text><text x="470" y="505.5" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">minutos o días después, o no ocurrir nunca; por eso un duplicado no se distingue de un evento nuevo sin identificador. En</tspan></text><text x="470" y="522.14" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la nueva infraestructura el identificador permite mirar hacia atrás varias semanas, frente a las pocas horas de la</tspan></text><text x="470" y="538.78" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">anterior. Si el receptor cae, los eventos esperan en el cliente. Dónde deja de valer: describe el diseño anunciado en 2021</tspan></text><text x="470" y="555.42" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(F5-bis); no se sabe el porcentaje de pérdida residual y es imposible saber si un evento nunca existió o se perdió.</tspan></text><text x="470" y="599" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify Engineering, «Changing the Wheels on a Moving Bus» (octubre de 2021). Secuencia propia.</tspan></text></svg>
