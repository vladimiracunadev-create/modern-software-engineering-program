<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 545" width="940" height="545" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo fluye el dinero de Spotify hasta los titulares de derechos</title><desc id="d">Diagrama del flujo de dinero según Loud and Clear: suscripciones Premium y publicidad del nivel gratuito forman el ingreso; unas dos terceras partes van a un fondo de regalías que se reparte por cuota de reproducciones; Spotify paga a los titulares de derechos y estos pagan a artistas y compositores según sus contratos; reglas como el mínimo de mil reproducciones y la exclusión de reproducciones artificiales moldean el reparto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="545" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo fluye el dinero de Spotify hasta los titulares de derechos</tspan></text><rect x="20" y="55" width="200" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120" y="83.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="120" dy="0">Oyentes Premium</tspan></text><text x="120" y="99.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="120" dy="0">(suscripción)</tspan></text><rect x="20" y="140" width="200" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="120" y="168.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="120" dy="0">Anunciantes</tspan></text><text x="120" y="184.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="120" dy="0">(nivel gratuito)</tspan></text><rect x="290" y="85" width="180" height="90" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="380" y="125.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="380" dy="0">Ingreso de Spotify</tspan></text><text x="380" y="141.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="380" dy="0">(Premium + anuncios)</tspan></text><rect x="540" y="55" width="180" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="83.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">Fondo de regalías</tspan></text><text x="630" y="99.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="630" dy="0">(≈ dos tercios)</tspan></text><rect x="540" y="140" width="180" height="66" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="630" y="168.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="630" dy="0">Resto: costos y</tspan></text><text x="630" y="184.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="630" dy="0">resultado de Spotify</tspan></text><rect x="760" y="55" width="160" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="840" y="75" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="840" dy="0">Titulares de</tspan></text><text x="840" y="91.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="840" dy="0">derechos</tspan></text><text x="840" y="108.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="840" dy="0">(sellos, editoras)</tspan></text><rect x="760" y="140" width="160" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="840" y="168.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="840" dy="0">Artistas y</tspan></text><text x="840" y="184.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="840" dy="0">compositores</tspan></text><polyline points="220,88 290,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="220,173 290,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,115 540,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,145 540,170" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="720,88 760,88" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="840,121 840,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="230" width="440" height="92" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="254.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Reparto por «cuota de reproducciones» (streamshare): cada</tspan></text><text x="240" y="271.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">titular recibe su porcentaje del total de reproducciones,</tspan></text><text x="240" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">no una tarifa fija por reproducción, porque el oyente</tspan></text><text x="240" y="304.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">paga una suscripción y no por escucha.</tspan></text><rect x="480" y="230" width="440" height="92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="254.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">Reglas que mueven el reparto: una pista necesita al menos</tspan></text><text x="700" y="271.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">1 000 reproducciones al año para generar regalías de</tspan></text><text x="700" y="287.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">grabación, y las reproducciones artificiales detectadas</tspan></text><text x="700" y="304.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">no generan regalías (política declarada por Spotify).</tspan></text><rect x="20" y="336" width="900" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="359.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Cifras de Spotify: más de 11 mil millones de dólares pagados en 2025 y cerca de 70 mil millones acumulados desde la</tspan></text><text x="470" y="375.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">fundación. Son datos de la empresa, publicados para defender su modelo.</tspan></text><rect x="10" y="406" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="428.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: de izquierda a derecha, el dinero entra por dos puertas y sale en su mayor parte hacia el fondo de regalías; lo</tspan></text><text x="470" y="445.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">que queda cubre todo lo demás. Spotify no paga a artistas directamente sino a titulares de derechos. Dónde deja de valer:</tspan></text><text x="470" y="462.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Spotify no publica el cálculo contractual con cada sello ni el desglose entre regalías de grabación y de edición; «dos</tspan></text><text x="470" y="478.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">tercios» es una cifra redondeada de su sitio y no un contrato.</tspan></text><text x="470" y="522.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify, Loud &amp; Clear, preguntas frecuentes, actualizado el 11 de marzo de 2026 (F3). Dibujo propio.</tspan></text></svg>
