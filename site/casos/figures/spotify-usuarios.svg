<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 542" width="940" height="542" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Usuarios de Spotify según cada fuente pública (millones)</title><desc id="d">Línea con cuatro puntos: más de 75 millones de usuarios en febrero de 2016, 232 millones de usuarios activos mensuales en agosto de 2019, 713 millones en el tercer trimestre de 2025 y 751 millones en el cuarto; el crecimiento más fuerte en cifras absolutas ocurre en la última década.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="542" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Usuarios de Spotify según cada fuente pública (millones)</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="359" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="363.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="284" x2="910" y2="284" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="284" x2="78.62" y2="284" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="288.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="209" x2="910" y2="209" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="209" x2="78.62" y2="209" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="213.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">400</tspan></text><line x1="78.62" y1="134" x2="910" y2="134" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="134" x2="78.62" y2="134" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="138.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">600</tspan></text><line x1="78.62" y1="59" x2="910" y2="59" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="59" x2="78.62" y2="59" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="63.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">800</tspan></text><line x1="78.62" y1="59" x2="78.62" y2="359" stroke="#5b7280" stroke-width="1.6"/><line x1="96.62" y1="59" x2="96.62" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="96.62" y1="359" x2="96.62" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="96.62" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.62" dy="0">2016</tspan></text><line x1="255.696" y1="59" x2="255.696" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="255.696" y1="359" x2="255.696" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="255.696" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="255.696" dy="0">2018</tspan></text><line x1="414.772" y1="59" x2="414.772" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="414.772" y1="359" x2="414.772" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="414.772" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="414.772" dy="0">2020</tspan></text><line x1="573.848" y1="59" x2="573.848" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="573.848" y1="359" x2="573.848" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="573.848" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="573.848" dy="0">2022</tspan></text><line x1="732.924" y1="59" x2="732.924" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="732.924" y1="359" x2="732.924" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="732.924" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.924" dy="0">2024</tspan></text><line x1="892" y1="59" x2="892" y2="359" stroke="#d5dde1" stroke-width="1"/><line x1="892" y1="359" x2="892" y2="364" stroke="#5b7280" stroke-width="1.4"/><text x="892" y="380" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="892" dy="0">2026</tspan></text><line x1="78.62" y1="359" x2="910" y2="359" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="209" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 209)">Millones de usuarios</text><text x="494.31" y="405" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="494.31" dy="0">Año</tspan></text><polyline points="104.574,330.875 382.957,272 876.092,91.625 892,77.375" fill="none" stroke="#087f8c" stroke-width="2.4"/><circle cx="104.574" cy="330.875" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="104.574" y="319.875" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="104.574" dy="0">75</tspan></text><circle cx="382.957" cy="272" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="382.957" y="261" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="382.957" dy="0">232</tspan></text><circle cx="876.092" cy="91.625" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="876.092" y="80.625" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="876.092" dy="0">713</tspan></text><circle cx="892" cy="77.375" r="5.5" fill="#087f8c" stroke="#087f8c" stroke-width="2"/><text x="892" y="66.375" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="892" dy="0">751</tspan></text><text x="134.574" y="270.875" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="134.574" dy="0">2016: más de 75 M (Google</tspan></text><text x="134.574" y="287.875" font-size="13" text-anchor="start" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="134.574" dy="0">Cloud)</tspan></text><line x1="106.334" y1="325.675" x2="126.574" y2="265.875" stroke="#5c1f14" stroke-width="1.2"/><text x="352.957" y="202" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="352.957" dy="0">2019: 232 M MAU (Spotify</tspan></text><text x="352.957" y="219" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="352.957" dy="0">Eng.)</tspan></text><line x1="381.197" y1="266" x2="360.957" y2="197" stroke="#5c1f14" stroke-width="1.2"/><text x="852" y="137.375" font-size="13" text-anchor="end" font-weight="400" fill="#5c1f14" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="852" dy="0">T4 2025: 751 M MAU</tspan></text><line x1="889.44" y1="81.775" x2="860" y2="132.375" stroke="#5c1f14" stroke-width="1.2"/><rect x="10" y="419" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="443.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los puntos no son comparables al milímetro: 2016 habla de «más de 75 millones de usuarios» (Google Cloud) y los demás de</tspan></text><text x="470" y="460.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">usuarios activos mensuales (MAU). La línea une cuatro observaciones; no mide el crecimiento intermedio. Dónde deja de</tspan></text><text x="470" y="477.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: no sirve para estimar años sin dato.</tspan></text><text x="470" y="524.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Google Cloud (23-feb-2016); Spotify Engineering (2019); comunicados T3 y T4 2025.</tspan></text></svg>
