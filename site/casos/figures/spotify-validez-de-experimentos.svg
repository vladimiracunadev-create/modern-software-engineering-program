<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Controles de validez de un experimento: qué vigila la plataforma y qué avisa</title><desc id="d">Diagrama de los cuatro controles de validez continuos de la plataforma de experimentación de Spotify (desajuste en la proporción de muestra, actividad previa a la exposición, aumento de caídas y colisión de propiedades) y de las dos clases de métricas: de éxito con prueba de superioridad y de guardia con prueba de no inferioridad.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Controles de validez de un experimento: qué vigila la plataforma y qué avisa</tspan></text><rect x="20" y="55" width="440" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="85.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">Desajuste de proporción de muestra: la exposición real no</tspan></text><text x="240" y="101.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">coincide con la repartición prevista entre grupos</tspan></text><rect x="480" y="55" width="440" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="85.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Actividad previa: los grupos ya se comportaban distinto</tspan></text><text x="700" y="101.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">antes de que empezara el experimento</tspan></text><rect x="20" y="140" width="440" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="240" y="178.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="240" dy="0">Aumento de caídas del cliente en algún grupo</tspan></text><rect x="480" y="140" width="440" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="170.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Colisión de propiedades: dos experimentos no exclusivos</tspan></text><text x="700" y="186.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">tocan la misma propiedad de configuración</tspan></text><rect x="20" y="235" width="440" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="275.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="240" dy="0">Métricas de éxito: prueba de superioridad con efecto</tspan></text><text x="240" y="291.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="240" dy="0">mínimo detectable y cálculo de potencia</tspan></text><rect x="480" y="235" width="440" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="275.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="700" dy="0">Métricas de guardia: prueba de no inferioridad con un</tspan></text><text x="700" y="291.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="700" dy="0">margen declarado de antemano</tspan></text><rect x="20" y="340" width="900" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="363.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Si hay un problema se avisa al equipo dueño, que decide qué hacer; las pruebas con test estadístico usan secuencial y</tspan></text><text x="470" y="379.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">corrigen comparaciones múltiples.</tspan></text><rect x="10" y="412" width="920" height="71.8" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="434.9" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: arriba, los controles que protegen la validez; abajo, las dos clases de métricas con su prueba. Los experimentos</tspan></text><text x="470" y="451.54" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">deben correr el periodo planificado y detenerse antes solo por efectos dañinos, para no sesgar por día de la semana. Dónde</tspan></text><text x="470" y="468.18" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">deja de valer: son controles declarados por Spotify en 2020; la plataforma no se evalúa de forma independiente aquí.</tspan></text><text x="470" y="511.8" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Spotify Engineering, «Spotify&#x27;s New Experimentation Platform (Part 2)», noviembre de 2020 (F13).</tspan></text></svg>
