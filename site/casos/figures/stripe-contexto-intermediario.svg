<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Stripe entre el comercio, el cliente y el sistema financiero</title><desc id="d">Diagrama de contexto: el comercio integra la API de Stripe; el cliente paga con tarjeta o billetera; Stripe se coloca entre ambos y dialoga con las redes de tarjetas, los bancos emisores y los adquirentes, y cumple la normativa de pagos y de datos de tarjeta; el comercio recibe el neto menos la comisión.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Stripe entre el comercio, el cliente y el sistema financiero</tspan></text><rect x="20" y="70" width="210" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="125" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">Comercio o plataforma</tspan></text><text x="125" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="125" dy="0">(desarrolladores)</tspan></text><rect x="335" y="70" width="270" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="88.68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Stripe</tspan></text><text x="470" y="105.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">API · pagos · fraude ·</tspan></text><text x="470" y="121.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">cobro recurrente · pagos a</tspan></text><text x="470" y="138.6" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">terceros</tspan></text><rect x="710" y="70" width="210" height="80" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="815" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="815" dy="0">Redes de tarjetas,</tspan></text><text x="815" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="815" dy="0">bancos emisores y</tspan></text><text x="815" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="815" dy="0">adquirentes</tspan></text><rect x="20" y="215" width="210" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="125" y="245.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="125" dy="0">Cliente final</tspan></text><text x="125" y="261.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="125" dy="0">(tarjeta o billetera)</tspan></text><rect x="710" y="215" width="210" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="815" y="228.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">Reguladores</tspan></text><text x="815" y="245.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">(PCI DSS, autenticación</tspan></text><text x="815" y="261.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">fuerte, dinero</tspan></text><text x="815" y="278.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="815" dy="0">electrónico)</tspan></text><polyline points="230,110 335,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="283" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283" dy="0">integra la API</tspan></text><polyline points="605,110 710,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="657" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="657" dy="0">autoriza y liquida</tspan></text><polyline points="125,215 125,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="150" y="190" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="150" dy="0">paga</tspan></text><polyline points="710,250 560,150" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="310" width="920" height="125.6" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="351.48" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: Stripe vende abstracción. El comercio nunca habla con las redes de tarjetas; habla con una API estable y Stripe</tspan></text><text x="470" y="368.12" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">asume las conexiones, el cumplimiento y parte del fraude. Documentado: certificación PCI nivel 1 de proveedor de servicios;</tspan></text><text x="470" y="384.76" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Stripe.js tokeniza los datos de tarjeta sin que toquen el servidor del comercio. Dónde deja de valer: Stripe no es la red</tspan></text><text x="470" y="401.4" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de tarjetas ni el banco; sigue sujeto a sus reglas y a sus costos (interchange).</tspan></text><text x="470" y="463.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: docs.stripe.com/security y /payments/elements (consulta 2026-11-16). Esquema del autor.</tspan></text></svg>
