<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 555" width="940" height="555" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Los estados de una intención de pago: de la creación al cobro, con la autenticación de por medio</title><desc id="d">Diagrama de estados de una PaymentIntent de Stripe: requiere método de pago, requiere confirmación (que la mayoría de las integraciones omite), requiere acción (por ejemplo 3D Secure), procesando (métodos asíncronos como débitos bancarios, que pueden tardar días) o requiere captura, y finalmente realizado; si el intento falla, vuelve al estado de requerir método de pago para reintentar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="555" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Los estados de una intención de pago</tspan></text><rect x="20" y="70" width="190" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="115" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">requires_payment_method</tspan></text><text x="115" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="115" dy="0">(creada, sin método)</tspan></text><rect x="250" y="70" width="190" height="70" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="345" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="345" dy="0">requires_confirmation</tspan></text><text x="345" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="345" dy="0">(lista para confirmar)</tspan></text><rect x="480" y="70" width="190" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="575" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="575" dy="0">requires_action</tspan></text><text x="575" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="575" dy="0">(p. ej. 3D Secure)</tspan></text><rect x="710" y="70" width="210" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="815" y="100.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="815" dy="0">processing</tspan></text><text x="815" y="116.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="815" dy="0">(métodos asíncronos)</tspan></text><rect x="710" y="190" width="210" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="815" y="220.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="815" dy="0">succeeded</tspan></text><text x="815" y="236.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="815" dy="0">(fondos en la cuenta)</tspan></text><rect x="480" y="190" width="190" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="575" y="220.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">requires_capture</tspan></text><text x="575" y="236.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="575" dy="0">(autorizar y capturar)</tspan></text><polyline points="210,105 250,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="440,105 480,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="670,105 710,105" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="815,140 815,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="670,225 710,225" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="580,140 580,190" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="815,70 815,54 115,54 115,70" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><text x="470" y="48" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">si el intento falla, vuelve a reintentar</tspan></text><rect x="20" y="320" width="440" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="347" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Crear la intención en cuanto se conoce el importe, para</tspan></text><text x="240" y="363.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">que Stripe registre todos los intentos de pago;</tspan></text><text x="240" y="380.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">típicamente una intención por carrito o sesión.</tspan></text><rect x="480" y="320" width="440" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="700" y="338.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">Promesa de la API: autenticación automática, sin doble</tspan></text><text x="700" y="355.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">cobro y sin problemas de claves de idempotencia, además</tspan></text><text x="700" y="371.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">de compatibilidad con la autenticación fuerte del</tspan></text><text x="700" y="388.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="700" dy="0">cliente.</tspan></text><rect x="10" y="416" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="438.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: las cajas son estados; las flechas, transiciones; la discontinua roja es lo que ocurre ante un rechazo. El estado</tspan></text><text x="470" y="455.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">«requires_confirmation» se dibuja discontinuo porque la mayoría de las integraciones lo omite. Dónde deja de valer: no</tspan></text><text x="470" y="472.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">incluye cancelaciones ni disputas posteriores, ni los métodos con redirección; los nombres de estado cambiaron en 2019</tspan></text><text x="470" y="488.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(antes, «requires_source»).</tspan></text><text x="470" y="532.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Stripe Docs, «The Payment Intents API» (F12) y «How PaymentIntents and SetupIntents work» (F12-bis). Dibujo propio.</tspan></text></svg>
