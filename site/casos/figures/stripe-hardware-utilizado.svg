<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 509" width="940" height="509" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware de Stripe: lo publicado y lo que no</title><desc id="d">Diagrama del hardware de Stripe según sus fuentes: lectores de tarjetas Stripe Reader M2 de 59 dólares y S710, S700 y T600 de 299 a 329 dólares con datos móviles; llaves de seguridad físicas para el acceso de empleados; una flota de bases en la nube y un entorno aislado en AWS para la bóveda de tarjetas; sin datos públicos de servidores ni de redes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="509" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware de Stripe: lo publicado y lo que no</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Dispositivos de pago</tspan></text><rect x="10" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: lectores Stripe Reader M2 (59 dólares), S710 y</tspan></text><text x="235" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">S700 (299 dólares) y T600 (329 dólares), con datos</tspan></text><text x="235" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">celulares y administración en la nube (F9).</tspan></text><rect x="10" y="167.8" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="188.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: todas las transacciones de Terminal van</tspan></text><text x="235" y="205.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">cifradas de extremo a extremo por defecto (F9).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Seguridad física y de acceso</tspan></text><rect x="480" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: el panel admite llaves de seguridad físicas y</tspan></text><text x="705" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">claves de acceso, y las recomienda por ser resistentes al</tspan></text><text x="705" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">phishing (F13).</tspan></text><rect x="480" y="167.8" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="188.72" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: la bóveda de tarjetas vive en un entorno</tspan></text><text x="705" y="205.36" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">aislado de Amazon Web Services separado del resto (F13).</tspan></text><rect x="10" y="235" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="255.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Servidores y bases</tspan></text><rect x="10" y="277" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="297.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: MongoDB en una flota propia «en la nube»</tspan></text><text x="235" y="314.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">porque en 2011 no existía Atlas (F8).</tspan></text><rect x="10" y="336.2" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="357.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">No se sabe: tipos de máquina, proveedor de cada servicio y</tspan></text><text x="235" y="373.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">centros de datos.</tspan></text><rect x="480" y="235" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="255.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Red</tspan></text><rect x="480" y="277" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="297.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: TLS 1.2 como mínimo y TLS mutuo entre</tspan></text><text x="705" y="314.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">servidores (F13).</tspan></text><rect x="480" y="336.2" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="357.14" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: topología y capacidad de red.</tspan></text><rect x="10" y="403.4" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="426.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cuatro recuadros con lo documentado. Dónde deja de valer: los precios de lectores son de una lista consultada en</tspan></text><text x="470" y="442.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2026; no se conocen costos de fabricación ni cantidades.</tspan></text><text x="470" y="486.6" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F8, F9, F13.</tspan></text></svg>
