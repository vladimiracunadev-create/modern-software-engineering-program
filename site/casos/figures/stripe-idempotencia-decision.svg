<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 589" width="940" height="589" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué hace la capa de idempotencia con cada petición que llega con una clave</title><desc id="d">Diagrama de decisión del comportamiento documentado de las claves de idempotencia de Stripe en la API v1: una clave nueva se procesa normalmente; una clave repetida con los mismos parámetros devuelve el resultado guardado, incluidos los errores 500, si la ejecución ya había empezado; una clave repetida con parámetros distintos devuelve un error; una clave antigua, de más de 24 horas, puede haberse eliminado y entonces se genera una petición nueva.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="589" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué hace la capa de idempotencia con cada petición que llega con una clave</tspan></text><rect x="330" y="55" width="280" height="56" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="86.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Llega un POST con clave K</tspan></text><rect x="20" y="160" width="270" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="155" y="200.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">K nunca vista: se procesa como una</tspan></text><text x="155" y="216.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">petición nueva</tspan></text><rect x="335" y="160" width="270" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="183.68" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">K vista, mismos parámetros, la</tspan></text><text x="470" y="200.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">ejecución ya empezó: se devuelve</tspan></text><text x="470" y="216.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">el resultado guardado (también si</tspan></text><text x="470" y="233.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">fue un 500)</tspan></text><rect x="650" y="160" width="270" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="785" y="200.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">K vista, parámetros distintos:</tspan></text><text x="785" y="216.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="785" dy="0">error, para evitar un uso erróneo</tspan></text><polyline points="400,111 155,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,111 470,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="540,111 785,160" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="20" y="270" width="440" height="90" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="302" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">Si los parámetros fallan la validación o la petición</tspan></text><text x="240" y="318.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">choca con otra en ejecución con la misma clave, no se</tspan></text><text x="240" y="335.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">guarda un resultado, y puede reintentarse.</tspan></text><rect x="480" y="270" width="440" height="90" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="302" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">Las claves pueden eliminarse tras 24 horas como mínimo en</tspan></text><text x="700" y="318.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">la API v1; si se reutiliza una clave podada, se genera</tspan></text><text x="700" y="335.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="700" dy="0">una petición nueva.</tspan></text><rect x="20" y="375" width="900" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="400.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Otros límites: las claves miden hasta 255 caracteres, se recomienda un UUID v4, no deben llevar datos sensibles y no se</tspan></text><text x="470" y="416.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">envían en GET ni DELETE (ya son idempotentes por definición).</tspan></text><rect x="10" y="450" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="472.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: una sola decisión (qué pasó antes con esta clave) y cuatro desenlaces. La API v2 cambia el contrato: los</tspan></text><text x="470" y="489.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reintentos no repiten operaciones exitosas, y el trabajo fallido o a medias se reintenta hasta completarse cuando es</tspan></text><text x="470" y="506.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">posible. Dónde deja de valer: es el comportamiento documentado en 2026 para v1 y v2; la ventana de 24 horas es un mínimo y</tspan></text><text x="470" y="522.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no una garantía de retención exacta.</tspan></text><text x="470" y="566.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Stripe Docs, «Idempotent requests» (F10).</tspan></text></svg>
