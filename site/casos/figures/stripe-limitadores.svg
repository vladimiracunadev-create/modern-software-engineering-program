<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 545" width="940" height="545" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro limitadores en producción: dos preventivos y dos para emergencias</title><desc id="d">Diagrama de los cuatro tipos de limitadores que Stripe describe: de tasa de peticiones por usuario y de peticiones concurrentes (preventivos), y dos que descartan carga según el estado de la flota y de los trabajadores (el primero reserva una fracción de la flota para peticiones críticas y rechaza con 503; el segundo, de última línea, descarta primero el tráfico de prueba, luego las lecturas y las escrituras, y por último lo crítico).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="545" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro limitadores en producción: dos preventivos y dos para emergencias</tspan></text><rect x="20" y="50" width="440" height="36" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="240" y="71.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="240" dy="0">Preventivos (miran al usuario)</tspan></text><rect x="480" y="50" width="440" height="36" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="700" y="71.92" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="700" dy="0">Descarte de carga (miran al sistema)</tspan></text><rect x="20" y="96" width="440" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="124.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">1. De tasa de peticiones: cada usuario puede hacer N por</tspan></text><text x="240" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">segundo, con una ráfaga breve por encima del tope. Es el</tspan></text><text x="240" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">más importante y rechaza millones de peticiones al mes,</tspan></text><text x="240" y="174.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">sobre todo de prueba.</tspan></text><rect x="20" y="206" width="440" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="240" y="234.68" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">2. De peticiones concurrentes: máximo de peticiones en</tspan></text><text x="240" y="251.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">curso a la vez (por ejemplo 20). Protege los puntos</tspan></text><text x="240" y="267.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">finales costosos de que los reintentos de usuarios</tspan></text><text x="240" y="284.6" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="240" dy="0">impacientes empeoren la contención.</tspan></text><rect x="480" y="96" width="440" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="133" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">3. Por uso de la flota: reserva una fracción (por ejemplo</tspan></text><text x="700" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">20 %) para métodos críticos como crear cobros; el resto</tspan></text><text x="700" y="166.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">se rechaza con 503 si supera su 80 %.</tspan></text><rect x="480" y="206" width="440" height="100" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="700" y="243" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">4. Por uso de trabajadores: última línea. Descarta por</tspan></text><text x="700" y="259.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">orden: tráfico de prueba, GET, POST y, al final, métodos</tspan></text><text x="700" y="276.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="700" dy="0">críticos; sube y baja despacio para no oscilar.</tspan></text><rect x="20" y="320" width="440" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="240" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">Frecuencia declarada: el primero se activa</tspan></text><text x="240" y="358.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">constantemente; el segundo, miles de veces al mes; el</tspan></text><text x="240" y="375.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="240" dy="0">cuarto, solo en incidentes mayores.</tspan></text><rect x="480" y="320" width="440" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="700" y="342" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">Idea clave: el limitador de tasa pide a los clientes</tspan></text><text x="700" y="358.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">repartir sus peticiones; el descarte de carga mantiene</tspan></text><text x="700" y="375.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="700" dy="0">vivo el núcleo cuando el resto se quema.</tspan></text><rect x="10" y="406" width="920" height="88.4" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="428.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la columna izquierda protege de un usuario que se excede; la derecha, de un sistema que ya no da abasto. Las</tspan></text><text x="470" y="445.52" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cifras de los ejemplos (20 peticiones, 20 %) son las del artículo de 2017. Dónde deja de valer: los volúmenes y los</tspan></text><text x="470" y="462.16" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">umbrales actuales no son públicos; la documentación de hoy fija límites propios por cuenta (por ejemplo, 100 peticiones por</tspan></text><text x="470" y="478.8" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">segundo en modo real).</tspan></text><text x="470" y="522.4" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Tarjan, «Scaling your API with rate limiters», Stripe Blog, 30 de marzo de 2017 (F5). Resumen propio.</tspan></text></svg>
