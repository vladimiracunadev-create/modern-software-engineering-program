<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 389" width="940" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Stripe: de una API para desarrolladores a infraestructura financiera</title><desc id="d">Línea de tiempo de 2010 a 2026: origen entre 2009 y 2010 según la fuente, beta privada y lanzamiento público en septiembre de 2011, artículos de ingeniería sobre idempotencia, límites y versionado en 2017, y volumen de pagos de 1,0 billones de dólares en 2023, 1,4 en 2024 y 1,9 en 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="389" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Stripe: de una API para desarrolladores a infraestructura financiera</tspan></text><line x1="184" y1="83" x2="184" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="184" y1="191" x2="184" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="184" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="184" dy="0">2 010</tspan></text><line x1="366" y1="83" x2="366" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="366" y1="191" x2="366" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="366" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="366" dy="0">2 014</tspan></text><line x1="548" y1="83" x2="548" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="548" y1="191" x2="548" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="548" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="548" dy="0">2 018</tspan></text><line x1="730" y1="83" x2="730" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="730" y1="191" x2="730" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="730" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="730" dy="0">2 022</tspan></text><line x1="912" y1="83" x2="912" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="191" x2="912" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2 026</tspan></text><line x1="184" y1="191" x2="912" y2="191" stroke="#5b7280" stroke-width="1.6"/><text x="174" y="114.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="174" dy="0">Etapa</tspan></text><text x="174" y="160" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="174" dy="0">Volumen (billones</tspan></text><text x="174" y="177" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="174" dy="0">USD)</tspan></text><line x1="261.35" y1="75" x2="261.35" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="261.35" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="261.35" dy="0">Lanzamiento</tspan></text><rect x="184" y="92" width="77.35" height="36" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="222.675" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="222.675" dy="0">Beta</tspan></text><rect x="261.35" y="92" width="241.15" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="381.925" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="381.925" dy="0">API para desarrolladores</tspan></text><rect x="502.5" y="92" width="273" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="639" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="639" dy="0">Plataforma amplia</tspan></text><rect x="775.5" y="92" width="136.5" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="843.75" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="843.75" dy="0">Escala</tspan></text><line x1="14" y1="137" x2="912" y2="137" stroke="#d5dde1" stroke-width="1"/><rect x="775.5" y="146" width="45.5" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="798.25" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="798.25" dy="0">1,0</tspan></text><rect x="821" y="146" width="45.5" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="843.75" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="843.75" dy="0">1,4</tspan></text><rect x="866.5" y="146" width="45.5" height="36" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="889.25" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="889.25" dy="0">1,9</tspan></text><text x="548" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="548" dy="0">Año</tspan></text><rect x="10" y="249" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="273.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado por Stripe: 1 billón de dólares de volumen en 2023 (blog de DocDB), 1,4 billones en 2024 (+38 %) y 1,9 billones</tspan></text><text x="470" y="290.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">en 2025 (+34 %) según sus cartas anuales; un billón aquí es 10^12. Fuente secundaria: lanzamiento público del 29 de</tspan></text><text x="470" y="307.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">septiembre de 2011 y origen entre 2009 y 2010 (las fuentes discrepan). Dónde deja de valer: volumen no es ingreso de</tspan></text><text x="470" y="323.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Stripe, solo el dinero que pasa por la plataforma.</tspan></text><text x="470" y="371.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: Stripe Newsroom (2024, 2025); blog de Stripe (2024); Wikipedia (fechas secundarias).</tspan></text></svg>
