<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 389" width="940" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Stripe: de la API a la infraestructura económica, con el volumen de pagos</title><desc id="d">Línea de tiempo de 2010 a 2026 con dos carriles: plataforma (API y MongoDB desde 2011, artículos de ingeniería de 2017, DocDB a gran escala hasta 2024) y volumen anual de pagos de 1,0, 1,4 y 1,9 billones de dólares en 2023, 2024 y 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="389" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Stripe: de la API a la infraestructura económica, con el volumen de pagos</tspan></text><line x1="194" y1="83" x2="194" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="194" y1="191" x2="194" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="194" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="194" dy="0">2 010</tspan></text><line x1="283.75" y1="83" x2="283.75" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="283.75" y1="191" x2="283.75" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="283.75" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="283.75" dy="0">2 012</tspan></text><line x1="373.5" y1="83" x2="373.5" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="373.5" y1="191" x2="373.5" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="373.5" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="373.5" dy="0">2 014</tspan></text><line x1="463.25" y1="83" x2="463.25" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="463.25" y1="191" x2="463.25" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="463.25" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="463.25" dy="0">2 016</tspan></text><line x1="553" y1="83" x2="553" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="553" y1="191" x2="553" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="553" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="553" dy="0">2 018</tspan></text><line x1="642.75" y1="83" x2="642.75" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="642.75" y1="191" x2="642.75" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="642.75" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="642.75" dy="0">2 020</tspan></text><line x1="732.5" y1="83" x2="732.5" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="732.5" y1="191" x2="732.5" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="732.5" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="732.5" dy="0">2 022</tspan></text><line x1="822.25" y1="83" x2="822.25" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="822.25" y1="191" x2="822.25" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="822.25" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="822.25" dy="0">2 024</tspan></text><line x1="912" y1="83" x2="912" y2="191" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="191" x2="912" y2="196" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="212" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2 026</tspan></text><line x1="194" y1="191" x2="912" y2="191" stroke="#5b7280" stroke-width="1.6"/><text x="184" y="114.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Plataforma</tspan></text><text x="184" y="168.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="184" dy="0">Volumen (billones)</tspan></text><line x1="238.875" y1="75" x2="238.875" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="238.875" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="238.875" dy="0">Lanzamiento</tspan></text><line x1="508.125" y1="75" x2="508.125" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="508.125" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="508.125" dy="0">Cuatro artículos</tspan></text><line x1="602.362" y1="75" x2="602.362" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="639.055" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="639.055" dy="0">Estados de pago</tspan></text><line x1="840.2" y1="75" x2="840.2" y2="191" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="840.2" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="840.2" dy="0">DocDB</tspan></text><rect x="238.875" y="92" width="269.25" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="373.5" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="373.5" dy="0">API y MongoDB</tspan></text><rect x="508.125" y="92" width="269.25" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="642.75" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="642.75" dy="0">Productos y escala</tspan></text><rect x="777.375" y="92" width="134.625" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="844.688" y="114.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="844.688" dy="0">DocDB</tspan></text><line x1="14" y1="137" x2="912" y2="137" stroke="#d5dde1" stroke-width="1"/><rect x="777.375" y="146" width="44.875" height="36" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="799.812" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="799.812" dy="0">1,0</tspan></text><rect x="822.25" y="146" width="44.875" height="36" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="844.688" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="844.688" dy="0">1,4</tspan></text><rect x="867.125" y="146" width="44.875" height="36" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="889.562" y="168.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="889.562" dy="0">1,9</tspan></text><text x="553" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="553" dy="0">Año</tspan></text><rect x="10" y="249" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="273.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: MongoDB elegido al lanzar en 2011 (F8); cuatro artículos de 2017 (F4 a F7); cambio de nombres de estado el 11</tspan></text><text x="470" y="290.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de febrero de 2019 (F12-bis); volúmenes de 2023, 2024 y 2025 (F8, F3, F2), en billones (10^12) de dólares. El lanzamiento</tspan></text><text x="470" y="307.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">público de 2011 es dato secundario (F16). Las eras son síntesis del autor. Dónde deja de valer: no hay series publicadas</tspan></text><text x="470" y="323.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del volumen antes de 2023 en las fuentes de este caso.</tspan></text><text x="470" y="371.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F2, F3, F4 a F8, F12-bis y F16; síntesis propia de las eras.</tspan></text></svg>
