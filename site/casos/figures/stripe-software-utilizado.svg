<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 493" width="940" height="493" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Software de Stripe que sus propias fuentes documentan</title><desc id="d">Diagrama del software documentado de Stripe: MongoDB Community como base de DocDB con proxies en Go, Kafka y almacenamiento de objetos para cambios, Redis para limitadores, Ruby en el código de versiones, Hadoop con Scalding para migraciones, la biblioteca Scientist de GitHub, Stripe.js y componentes de interfaz.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="493" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Software de Stripe que sus propias fuentes documentan</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Bases de datos y mensajería</tspan></text><rect x="10" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: DocDB es una extensión de MongoDB Community</tspan></text><text x="235" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">con servicios propios; los cambios van a Kafka y se</tspan></text><text x="235" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">archivan en un almacén de objetos como Amazon S3 (F8).</tspan></text><rect x="10" y="167.8" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="188.74" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: limitadores con Redis (F5).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Lenguajes y marcos</tspan></text><rect x="480" y="92" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.9" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: proxies de base de datos en Go (F8); código de</tspan></text><text x="705" y="129.54" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">versionado y biblioteca de cliente en Ruby (F4, F6);</tspan></text><text x="705" y="146.18" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Scalding en Scala para trabajos de datos (F7).</tspan></text><rect x="480" y="167.8" width="450" height="34.6" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="188.74" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: lenguajes de otros servicios.</tspan></text><rect x="10" y="218.4" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="235" y="239.32" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="235" dy="0">Herramientas de código abierto</tspan></text><rect x="10" y="260.4" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="281.3" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: Scientist de GitHub para comparar rutas de</tspan></text><text x="235" y="297.94" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">código en producción (F7); MapReduce con Hadoop para</tspan></text><text x="235" y="314.58" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">relleno offline (F7).</tspan></text><rect x="10" y="336.2" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="357.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: Stripe.js y componentes de interfaz (Elements)</tspan></text><text x="235" y="373.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">para la tokenización en el navegador (F14).</tspan></text><rect x="480" y="218.4" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="239.32" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Seguridad y protocolos</tspan></text><rect x="480" y="260.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="281.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: HTTPS, HSTS, TLS mutuo, AES-256, claves PGP</tspan></text><text x="705" y="297.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">para correos (F13).</tspan></text><rect x="480" y="319.6" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="340.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: orquestación, sistema operativo y herramientas</tspan></text><text x="705" y="357.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">de despliegue internas.</tspan></text><rect x="10" y="403.4" width="920" height="38.6" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="426.34" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: grupos por función con su fuente. Dónde deja de valer: son blogs de 2017 y 2024; no cubren el resto de servicios.</tspan></text><text x="470" y="470" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F4, F5, F6, F7, F8, F13, F14.</tspan></text></svg>
