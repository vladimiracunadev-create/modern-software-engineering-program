<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué pasa cuando cae cada componente en lo que Stripe documenta</title><desc id="d">Diagrama de la tolerancia a fallos documentada de Stripe: una respuesta perdida se cubre con claves de idempotencia; un cliente que se excede se frena con limitadores; una sobrecarga se maneja con descarte de carga; un receptor de webhooks caído recibe reintentos durante tres días; un fragmento se mueve con compuerta por versión y réplica bidireccional; el limitador que falla lo hace abierto; no se documentan pruebas de caos ni recuperación ante desastres.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué pasa cuando cae cada componente en lo que Stripe documenta</tspan></text><rect x="10" y="50" width="450" height="34" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="235" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="235" dy="0">Se pierde una respuesta</tspan></text><rect x="10" y="92" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="112.92" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: clave de idempotencia y resultado guardado</tspan></text><text x="235" y="129.56" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">(F4, F10).</tspan></text><rect x="480" y="50" width="450" height="34" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="70.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="705" dy="0">Un cliente se excede o hay sobrecarga</tspan></text><rect x="480" y="92" width="450" height="84.4" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="112.88" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: cuatro limitadores, con descarte de carga que</tspan></text><text x="705" y="129.52" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">protege lo crítico y que falla abierto si cae Redis;</tspan></text><text x="705" y="146.16" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">interruptores para apagarlos y lanzamiento en modo oscuro</tspan></text><text x="705" y="162.8" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">(F5).</tspan></text><rect x="10" y="159.2" width="450" height="34" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="235" y="180.12" font-size="14" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="235" dy="0">Cae el receptor de eventos</tspan></text><rect x="10" y="201.2" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="222.12" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: reintentos hasta tres días con espera</tspan></text><text x="235" y="238.76" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">exponencial en modo real (F11).</tspan></text><rect x="480" y="192.4" width="450" height="34" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="705" y="213.32" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="705" dy="0">Un fragmento debe moverse o falla</tspan></text><rect x="480" y="234.4" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="255.3" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Documentado: replicación bidireccional para volver atrás,</tspan></text><text x="705" y="271.94" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">compuerta por versión y traspaso en menos de dos segundos</tspan></text><text x="705" y="288.58" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">con reintentos (F8).</tspan></text><rect x="10" y="268.4" width="450" height="34" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="289.32" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="235" dy="0">Una migración de datos se desvía</tspan></text><rect x="10" y="310.4" width="450" height="51.2" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="331.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Documentado: escritura doble, experimentos de comparación</tspan></text><text x="235" y="347.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">en producción y cambios de pocos cientos de líneas (F7).</tspan></text><rect x="480" y="318.2" width="450" height="34" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="705" y="339.12" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="705" dy="0">Lo que no se documenta</tspan></text><rect x="480" y="360.2" width="450" height="67.8" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="381.1" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">No se sabe: pruebas de caos, recuperación ante desastres y</tspan></text><text x="705" y="397.74" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">copias de seguridad más allá del archivo de cambios, y SLO</tspan></text><text x="705" y="414.38" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">internos.</tspan></text><rect x="10" y="444" width="920" height="55.2" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="466.92" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: cada recuadro es un fallo y su defensa. Dónde deja de valer: la disponibilidad de 99,999 % se afirma en el título</tspan></text><text x="470" y="483.56" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de un artículo y no se define.</tspan></text><text x="470" y="527.2" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: F4, F5, F7, F8, F10, F11.</tspan></text></svg>
