<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 534" width="940" height="534" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El traspaso de tráfico de un fragmento a otro en menos de dos segundos: compuerta por versión</title><desc id="d">Secuencia del traspaso de tráfico de la plataforma de movimiento de datos de Stripe: el coordinador sube el número de versión del fragmento origen, que rechaza lecturas y escrituras; espera a que el servicio de replicación vuelque lo pendiente; actualiza la ruta y la versión en el servicio de metadatos; los proxies recogen la ruta nueva y las peticiones fallidas tienen éxito al reintentar; el protocolo dura menos de dos segundos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="534" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El traspaso de tráfico: compuerta por versión en menos de dos segundos</tspan></text><rect x="20" y="52" width="130" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Coordinador</tspan></text><rect x="212.5" y="52" width="130" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="277.5" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="277.5" dy="0">Fragmento</tspan></text><text x="277.5" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="277.5" dy="0">origen</tspan></text><rect x="405" y="52" width="130" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Servicio de</tspan></text><text x="470" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">replicación</tspan></text><rect x="597.5" y="52" width="130" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="662.5" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662.5" dy="0">Metadatos de</tspan></text><text x="662.5" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="662.5" dy="0">fragmentos</tspan></text><rect x="790" y="52" width="130" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="855" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="855" dy="0">Proxies</tspan></text><line x1="85" y1="98" x2="85" y2="368" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="277.5" y1="98" x2="277.5" y2="368" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="470" y1="98" x2="470" y2="368" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="662.5" y1="98" x2="662.5" y2="368" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="855" y1="98" x2="855" y2="368" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="85,132.32 277.5,132.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="181.25" y="125.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="181.25" dy="0">1. sube el número de versión: rechaza todo</tspan></text><polyline points="855,176.32 277.5,176.32" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="566.25" y="169.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="566.25" dy="0">2. peticiones rechazadas (se reintentan)</tspan></text><polyline points="85,220.32 470,220.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="277.5" y="213.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="277.5" dy="0">3. espera a replicar lo pendiente</tspan></text><polyline points="470,264.32 85,264.32" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="277.5" y="257.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="277.5" dy="0">4. sin pendientes</tspan></text><polyline points="85,308.32 662.5,308.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="373.75" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="373.75" dy="0">5. nueva ruta y nueva versión</tspan></text><polyline points="855,352.32 662.5,352.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="758.75" y="345.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="758.75" dy="0">6. consultan la ruta nueva; desde aquí envían al fragmento destino</tspan></text><rect x="10" y="378" width="920" height="105" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="400.86" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: el origen deja de aceptar tráfico en el paso 1; mientras tanto, el servicio de replicación termina de copiar;</tspan></text><text x="470" y="417.5" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">luego la ruta cambia y los proxies redirigen. Cada petición lleva un número de versión y el fragmento exige que sea más</tspan></text><text x="470" y="434.14" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">reciente que el que conoce. Dónde deja de valer: el objetivo de la fase clave es durar menos que una conmutación</tspan></text><text x="470" y="450.78" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">planificada del primario (unos segundos, dentro del presupuesto de reintentos de las aplicaciones); la duración «menos de</tspan></text><text x="470" y="467.42" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dos segundos» es la que da el artículo y no una garantía.</tspan></text><text x="470" y="511" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Morzaria y Narkhede (F8), paso 5 de la plataforma de movimiento de datos. Secuencia propia a partir del texto.</tspan></text></svg>
