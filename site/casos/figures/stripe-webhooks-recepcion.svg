<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 578" width="940" height="578" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un webhook bien recibido: verificar, responder rápido, deduplicar y no suponer el orden</title><desc id="d">Secuencia de la entrega de un evento por webhook: Stripe envía el evento firmado; el receptor verifica la firma con el cuerpo en crudo y una tolerancia de tiempo, devuelve 2xx antes de la lógica compleja, guarda el identificador del evento para ignorar duplicados y procesa después; si no responde, Stripe reintenta hasta tres días con espera exponencial en modo real.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="578" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un webhook bien recibido: verificar, responder rápido, deduplicar</tspan></text><rect x="20" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="78.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Stripe</tspan></text><rect x="270" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="345" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">Receptor del</tspan></text><text x="345" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="345" dy="0">comercio</tspan></text><rect x="520" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="595" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595" dy="0">Almacén de</tspan></text><text x="595" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595" dy="0">identificadores</tspan></text><rect x="770" y="52" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="845" y="70.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845" dy="0">Lógica de</tspan></text><text x="845" y="86.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="845" dy="0">negocio</tspan></text><line x1="95" y1="98" x2="95" y2="412" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="345" y1="98" x2="345" y2="412" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="595" y1="98" x2="595" y2="412" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="845" y1="98" x2="845" y2="412" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="95,132.32 345,132.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="125.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">1. POST del evento con firma</tspan></text><rect x="353" y="159.32" width="234" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="169.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2. verifica firma (cuerpo</tspan></text><text x="470" y="186.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">crudo, tolerancia de 5 min)</tspan></text><polyline points="345,220.32 595,220.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="213.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">3. ¿ya vi este id de evento?</tspan></text><polyline points="345,264.32 95,264.32" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="220" y="257.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">4. 2xx rápido, antes de la lógica</tspan></text><polyline points="345,308.32 845,308.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="595" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="595" dy="0">5. procesa después, en segundo plano</tspan></text><polyline points="95,352.32 345,352.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="345.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="220" dy="0">6. si no hubo 2xx: reintento con espera exponencial</tspan></text><polyline points="345,396.32 595,396.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="389.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">7. id repetido: ignorar el duplicado</tspan></text><rect x="10" y="422" width="920" height="105" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="444.86" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lectura: la flecha continua es una petición y la discontinua una respuesta. Stripe no garantiza el orden de entrega (por</tspan></text><text x="470" y="461.5" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">ejemplo, la factura pagada puede llegar antes que la factura creada), así que el receptor no debe depender de él; para eso</tspan></text><text x="470" y="478.14" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">puede recuperar los objetos por la API. No se debe usar la marca de tiempo de creación para decidir orden o si ya se</tspan></text><text x="470" y="494.78" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">procesó, sino el identificador del evento. Dónde deja de valer: en el entorno de pruebas los reintentos son tres, en unas</tspan></text><text x="470" y="511.42" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">horas; la secuencia es una lectura de la documentación, no un diagrama de Stripe.</tspan></text><text x="470" y="555" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Stripe Docs, «Webhooks» (F11). Secuencia propia.</tspan></text></svg>
