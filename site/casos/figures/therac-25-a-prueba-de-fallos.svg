<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 544" width="940" height="544" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</title><desc id="d">Cuatro columnas de mecanismos de tolerancia a fallos. Existían y funcionaron: interlocks de hardware en el Therac-20, suspensión tras cinco pausas, interlock que retira la alimentación ante fallos de hardware. Existían y fallaron: dosimetría saturada, comprobaciones de software, pausas con una tecla, análisis de 1983. No existían: interlock de la plataforma, registro de auditoría, notificación obligatoria, aviso de saturación. Debieron existir: suspensión con reingreso, apagado de un pulso, mensajes claros, registro de peligros.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="544" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">A prueba de fallos: qué existía, qué falló, qué no existía y qué debió existir</tspan></text><rect x="10" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="120.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="120.5" dy="0">Existían y funcionaron</tspan></text><rect x="10" y="111" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Interlocks de hardware del</tspan></text><text x="120.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Therac-20</tspan></text><rect x="10" y="191" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Suspensión tras cinco</tspan></text><text x="120.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">pausas seguidas</tspan></text><rect x="10" y="271" width="221" height="70" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="120.5" y="293" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">Interlock que retira la</tspan></text><text x="120.5" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">alimentación ante fallos de</tspan></text><text x="120.5" y="326.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="120.5" dy="0">hardware</tspan></text><rect x="243" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="353.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="353.5" dy="0">Existían y fallaron</tspan></text><rect x="243" y="111" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Dosimetría saturada:</tspan></text><text x="353.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">mostraba dosis baja</tspan></text><rect x="243" y="191" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Comprobaciones de software</tspan></text><text x="353.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">de la plataforma</tspan></text><rect x="243" y="271" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Pausa con una tecla como</tspan></text><text x="353.5" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">rutina</tspan></text><rect x="243" y="351" width="221" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="353.5" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">Análisis de peligros de</tspan></text><text x="353.5" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="353.5" dy="0">1983</tspan></text><rect x="476" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="586.5" y="80.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="586.5" dy="0">No existían (documentado)</tspan></text><rect x="476" y="111" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Interlock independiente de</tspan></text><text x="586.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">la plataforma</tspan></text><rect x="476" y="191" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Registro de auditoría del</tspan></text><text x="586.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">estado interno</tspan></text><rect x="476" y="271" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Aviso de cámaras saturadas</tspan></text><rect x="476" y="351" width="221" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="586.5" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">Notificación obligatoria</tspan></text><text x="586.5" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="586.5" dy="0">hasta 1990</tspan></text><rect x="709" y="51" width="221" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="819.5" y="72.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="819.5" dy="0">Debieron existir (análisis</tspan></text><text x="819.5" y="88.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="819.5" dy="0">propio)</tspan></text><rect x="709" y="111" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="141.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Suspensión con reingreso de</tspan></text><text x="819.5" y="157.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">parámetros</tspan></text><rect x="709" y="191" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="221.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Apagado tras un pulso alto</tspan></text><text x="819.5" y="237.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">sin software</tspan></text><rect x="709" y="271" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="309.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Mensajes comprensibles</tspan></text><rect x="709" y="351" width="221" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="819.5" y="381.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">Registro de peligros con</tspan></text><text x="819.5" y="397.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="819.5" dy="0">dueño</tspan></text><rect x="10" y="437" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las tres primeras columnas se apoyan en Leveson y Turner y en el plan final de 1987. La cuarta es análisis propio: varias</tspan></text><text x="470" y="478.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">medidas coinciden con el plan final, que llegó tras los accidentes.</tspan></text><text x="470" y="526.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
