<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 388" width="940" height="388" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">El bucle de pausas: cada pausa inocua refuerza el hábito que vuelve peligrosa la pausa grave</title><desc id="d">Diagrama de lazo con seis estados. Una pausa inocua frecuente lleva al operador a pulsar P de inmediato; no pasa nada y el hábito se confirma; la atención a cada mensaje baja; un mensaje de fallo grave se trata igual; resulta una sobredosis con una dosis aparente baja. Una flecha de refuerzo vuelve del hábito al inicio.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="388" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">El bucle de pausas: cada pausa inocua refuerza el hábito que vuelve peligrosa la pausa grave</tspan></text><rect x="10" y="55" width="296" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="158" y="85.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">A Pausa inocua frecuente, por ejemplo</tspan></text><text x="158" y="101.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="158" dy="0">por baja tasa de dosis</tspan></text><rect x="326" y="55" width="296" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="474" y="93.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="474" dy="0">B El operador pulsa P para continuar</tspan></text><polyline points="306,90 326,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="55" width="296" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="790" y="93.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">C No pasa nada: P parece seguro</tspan></text><polyline points="622,90 642,90" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="778,125 778,185" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="642" y="185" width="296" height="70" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="790" y="223.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="790" dy="0">D Menos atención a cada mensaje</tspan></text><rect x="326" y="185" width="296" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="474" y="215.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="474" dy="0">E Un mensaje de fallo grave se trata</tspan></text><text x="474" y="231.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="474" dy="0">igual</tspan></text><polyline points="642,220 622,220" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="185" width="296" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="158" y="223.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="158" dy="0">F Sobredosis con dosis aparente baja</tspan></text><polyline points="326,220 306,220" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="474,185 474,125" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="490" y="163" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="490" dy="0">refuerza el hábito</tspan></text><rect x="10" y="281" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="305.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada paso es razonable con la información del operador. Hasta cinco pausas seguidas eran posibles antes de una suspensión.</tspan></text><text x="470" y="322.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Es un modelo didáctico de lo que el artículo describe; no mide la frecuencia de cada paso.</tspan></text><text x="470" y="370.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
