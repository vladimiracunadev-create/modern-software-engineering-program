<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 456" width="940" height="456" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La misma secuencia de teclas, dos resultados: solo importa el momento de la edición</title><desc id="d">Dos pares de carriles en una escala de 0 a 12 segundos. En el orden seguro el operador edita antes de que comience el ajuste de imanes y la máquina se reconfigura. En el orden peligroso, el ajuste de imanes dura unos 8 segundos y el operador edita dentro de esa ventana, después de la primera comprobación, y la máquina queda inconsistente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="456" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La misma secuencia de teclas, dos resultados: solo importa el momento de la edición</tspan></text><line x1="274" y1="83" x2="274" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="291" x2="274" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="380.333" y1="83" x2="380.333" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="380.333" y1="291" x2="380.333" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="380.333" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380.333" dy="0">2</tspan></text><line x1="486.667" y1="83" x2="486.667" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="486.667" y1="291" x2="486.667" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="486.667" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.667" dy="0">4</tspan></text><line x1="593" y1="83" x2="593" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="593" y1="291" x2="593" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="593" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593" dy="0">6</tspan></text><line x1="699.333" y1="83" x2="699.333" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="699.333" y1="291" x2="699.333" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="699.333" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="699.333" dy="0">8</tspan></text><line x1="805.667" y1="83" x2="805.667" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="805.667" y1="291" x2="805.667" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="805.667" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805.667" dy="0">10</tspan></text><line x1="912" y1="83" x2="912" y2="291" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="291" x2="912" y2="296" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="312" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">12</tspan></text><line x1="274" y1="291" x2="912" y2="291" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="113.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Seguro: operador</tspan></text><text x="264" y="165.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Seguro: ajuste de imanes</tspan></text><text x="264" y="217.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Peligroso: operador</tspan></text><text x="264" y="269.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Peligroso: ajuste de imanes</tspan></text><line x1="725.917" y1="75" x2="725.917" y2="291" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="725.917" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="725.917" dy="0">fin del ajuste (peligroso)</tspan></text><rect x="274" y="92" width="95.7" height="34" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="321.85" y="113.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="321.85" dy="0">edita</tspan></text><line x1="14" y1="135" x2="912" y2="135" stroke="#d5dde1" stroke-width="1"/><rect x="390.967" y="144" width="425.333" height="34" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="603.633" y="165.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="603.633" dy="0">ajuste de unos 8 s</tspan></text><line x1="14" y1="187" x2="912" y2="187" stroke="#d5dde1" stroke-width="1"/><rect x="486.667" y="196" width="95.7" height="34" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="534.517" y="217.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="534.517" dy="0">edita</tspan></text><line x1="14" y1="239" x2="912" y2="239" stroke="#d5dde1" stroke-width="1"/><rect x="300.583" y="248" width="425.333" height="34" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="513.25" y="269.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="513.25" dy="0">ajuste de unos 8 s</tspan></text><text x="593" y="335" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">segundos (esquema ilustrativo)</tspan></text><rect x="10" y="349" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="373.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El resultado depende solo del instante de la edición respecto de la ventana de unos 8 segundos. Solo ese tope es un dato</tspan></text><text x="470" y="390.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">del artículo; los instantes son ilustrativos y no se estima la probabilidad de cada orden.</tspan></text><text x="470" y="438.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
