<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 486" width="940" height="486" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Pila de software: ensamblador, ejecutivo propio y tareas que hablan por variables compartidas</title><desc id="d">Cuatro capas de arriba abajo: tareas de tratamiento críticas y no críticas; ejecutivo de tiempo real propio con planificador cada 0,1 segundos; servicios de interrupción; y lenguaje ensamblador de PDP-11. A la derecha, lo heredado del Therac-6 y del Therac-20 y lo que no consta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="486" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Pila de software: ensamblador, ejecutivo propio y tareas que hablan por variables compartidas</tspan></text><rect x="10" y="53" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="89.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Tareas de tratamiento</tspan></text><rect x="214" y="53" width="430" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="429" y="81.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">Monitor, servos y ama de llaves; procesador de teclado y</tspan></text><text x="429" y="97.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="429" dy="0">pantalla</tspan></text><rect x="10" y="133" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="161.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Ejecutivo de tiempo</tspan></text><text x="105" y="177.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">real</tspan></text><rect x="214" y="133" width="430" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="429" y="161.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">Escrito para esta máquina; planificador expropiativo de</tspan></text><text x="429" y="177.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="429" dy="0">0,1 s</tspan></text><rect x="10" y="213" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="241.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Servicios de</tspan></text><text x="105" y="257.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">interrupción</tspan></text><rect x="214" y="213" width="430" height="66" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="429" y="249.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="429" dy="0">Reloj, barrido, teclados, pantalla, impresora y trampas</tspan></text><rect x="10" y="293" width="190" height="66" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="329.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Ensamblador de PDP-11</tspan></text><rect x="214" y="293" width="430" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="429" y="329.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="429" dy="0">Un solo programador durante varios años</tspan></text><rect x="668" y="53" width="262" height="88" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="799" y="92.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">Heredado: paquete del Therac-6 y</tspan></text><text x="799" y="108.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="799" dy="0">rutinas del Therac-20</tspan></text><rect x="668" y="155" width="262" height="88" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="799" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">Plan final: copia del programa</tspan></text><text x="799" y="202.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">impedida en el sitio y 23 cambios</tspan></text><text x="799" y="219.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="799" dy="0">de software</tspan></text><rect x="668" y="257" width="262" height="88" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="799" y="288" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">No se sabe: herramientas, control</tspan></text><text x="799" y="304.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">de versiones y procesos de</tspan></text><text x="799" y="321.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="799" dy="0">construcción</tspan></text><rect x="10" y="379" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="403.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El artículo advierte que su descripción es aproximada porque el fabricante reclamó propiedad sobre el diseño y no se pudo</tspan></text><text x="470" y="420.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">examinar el código.</tspan></text><text x="470" y="468.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
