<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Una plataforma giratoria decide qué haz recibe el paciente</title><desc id="d">Tres posiciones de la plataforma giratoria. En modo electrones, imanes de barrido esparcen el haz y una cámara de ionización lo mide. En modo rayos X, un blanco, un aplanador del haz y una cámara miden y moldean un haz con una corriente unas cien veces mayor. En la posición de luz de campo hay un espejo y ningún haz. Si la plataforma está en la posición equivocada, el haz llega concentrado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="470" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Una plataforma giratoria decide qué haz recibe el paciente</tspan></text><rect x="10" y="51" width="290" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="155" y="74.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="155" dy="0">Electrones (5 a 25 MeV)</tspan></text><rect x="10" y="107" width="290" height="90" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="155" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">Imanes de barrido esparcen el haz</tspan></text><text x="155" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">hasta una concentración terapéutica</tspan></text><rect x="325" y="51" width="290" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="74.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Rayos X (25 MeV)</tspan></text><rect x="325" y="107" width="290" height="90" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="139" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Blanco y aplanador del haz; corriente</tspan></text><text x="470" y="155.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cerca de 100 veces mayor para</tspan></text><text x="470" y="172.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">compensar el atenuador</tspan></text><rect x="640" y="51" width="290" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="785" y="74.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785" dy="0">Luz de campo</tspan></text><rect x="640" y="107" width="290" height="90" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="785" y="147.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">Espejo de acero y luz que simula el</tspan></text><text x="785" y="163.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="785" dy="0">haz; no se espera haz</tspan></text><text x="10" y="223" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="10" dy="0">Las tres posiciones las informan tres microinterruptores como un número de 3 bits que lee el computador.</tspan></text><rect x="10" y="243" width="440" height="78" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="230" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">Falla 1 (columna de rayos X): haz de rayos X sin</tspan></text><text x="230" y="285.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">aplanador en su sitio, con corriente alta. Es el riesgo</tspan></text><text x="230" y="302.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="230" dy="0">básico de una máquina de dos modos.</tspan></text><rect x="480" y="243" width="450" height="78" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="705" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">Falla 2 (columnas de electrones y luz de campo): haz de</tspan></text><text x="705" y="285.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">electrones de energía plena sin barrido, o con la</tspan></text><text x="705" y="302.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="705" dy="0">plataforma en luz de campo: un haz estrecho y muy intenso.</tspan></text><rect x="10" y="347" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="371.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">En máquinas anteriores, interlocks electromecánicos aseguraban la posición. En la Therac-25, comprobaciones de software</tspan></text><text x="470" y="388.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sustituyeron a muchos de esos interlocks. La figura describe la geometría de la máquina según Leveson y Turner; no es un</tspan></text><text x="470" y="405.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">plano ni un valor de ingeniería.</tspan></text><text x="470" y="452.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
