<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 818" width="940" height="818" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuencia de la edición rápida: la marca de entrada completa llega antes que la corrección</title><desc id="d">Diagrama de secuencia con cuatro líneas de vida: operador, procesador de teclado, rutina de entrada de datos con el ajuste de imanes y la máquina. El operador teclea X y va a la línea de comandos; el teclado marca la entrada como completa; el ajuste de imanes comienza con X y dura unos 8 segundos; dentro de esa ventana el operador corrige a E; el modo y la energía cambian pero el ajuste no vuelve a comprobar ediciones; el haz se enciende con la plataforma en electrones y los parámetros de rayos X.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="818" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Secuencia de la edición rápida: la marca de entrada completa llega antes que la corrección</tspan></text><rect x="10" y="45" width="200" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="73.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="110" dy="0">Operador</tspan></text><line x1="110" y1="95" x2="110" y2="685" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="230" y="45" width="200" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="330" y="73.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="330" dy="0">Procesador de teclado</tspan></text><line x1="330" y1="95" x2="330" y2="685" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="480" y="45" width="200" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="580" y="65.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="580" dy="0">Entrada de datos y</tspan></text><text x="580" y="81.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="580" dy="0">ajuste de imanes</tspan></text><line x1="580" y1="95" x2="580" y2="685" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="730" y="45" width="200" height="50" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="73.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">Máquina</tspan></text><line x1="830" y1="95" x2="830" y2="685" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><polyline points="110,149 330,149" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="220" y="127" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="220" dy="0">1  teclea X y baja</tspan><tspan x="220" dy="16.64">a la línea de comandos</tspan></text><polyline points="330,217 580,217" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="455" y="195" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455" dy="0">2  marca la entrada</tspan><tspan x="455" dy="16.64">como completa</tspan></text><polyline points="580,285 830,285" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="705" y="263" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">3  ajusta imanes con X</tspan><tspan x="705" dy="16.64">(unos 8 segundos)</tspan></text><polyline points="110,353 330,353" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="220" y="331" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="220" dy="0">4  sube el cursor y corrige</tspan><tspan x="220" dy="16.64">a E dentro de esos 8 s</tspan></text><rect x="230" y="369" width="200" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="330" y="389" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">5 el byte bajo de MEOS</tspan></text><text x="330" y="405.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">pasa a E; el alto sigue</tspan></text><text x="330" y="422.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="330" dy="0">en X</tspan></text><rect x="480" y="455" width="200" height="66" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="580" y="475" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="580" dy="0">6 la espera ya no mira</tspan></text><text x="580" y="491.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="580" dy="0">ediciones: nadie detecta</tspan></text><text x="580" y="508.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="580" dy="0">el cambio</tspan></text><polyline points="110,565 830,565" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="470" y="543" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">7  pulsa B: haz encendido</tspan></text><rect x="730" y="585" width="200" height="80" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="830" y="612" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">8 plataforma en</tspan></text><text x="830" y="628.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">electrones con</tspan></text><text x="830" y="645.28" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="830" dy="0">parámetros de rayos X</tspan></text><rect x="10" y="711" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="735.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La comprobación de ediciones se hacía en un punto del tiempo y no de forma continua. Los tiempos entre teclas no constan en</tspan></text><text x="470" y="752.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el artículo; solo la ventana de unos 8 segundos.</tspan></text><text x="470" y="800.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
