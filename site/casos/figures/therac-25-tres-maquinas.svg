<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres aceleradores, un cambio de reparto: quién protegía al paciente</title><desc id="d">Tres columnas: Therac-6, Therac-20 y Therac-25. En las dos primeras, el computador PDP-11 se añadió a máquinas que ya funcionaban solas y conservaron los interlocks y circuitos protectores de hardware. En el Therac-25, diseñado desde el inicio para control por computador, el software asumió más responsabilidad de seguridad y no se duplicaron todos los interlocks de hardware.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="520" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres aceleradores, un cambio de reparto: quién protegía al paciente</tspan></text><rect x="10" y="51" width="290" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="155" y="74.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="155" dy="0">Therac-6</tspan></text><rect x="10" y="107" width="290" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="155" y="136" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">Máquina independiente con historial</tspan></text><text x="155" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">clínico; el computador añadió</tspan></text><text x="155" y="169.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="155" dy="0">comodidad</tspan></text><rect x="10" y="209" width="290" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="155" y="246.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">Interlocks y seguridad de hardware</tspan></text><text x="155" y="262.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">conservados</tspan></text><polyline points="155,91 155,107" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="155,191 155,209" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="325" y="51" width="290" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="74.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Therac-20</tspan></text><rect x="325" y="107" width="290" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="136" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Misma base de software; circuitos</tspan></text><text x="470" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">protectores independientes y topes</tspan></text><text x="470" y="169.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">mecánicos</tspan></text><rect x="325" y="209" width="290" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="246.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">El mismo error de edición existía,</tspan></text><text x="470" y="262.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">pero el hardware impedía la dosis</tspan></text><polyline points="470,91 470,107" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="470,191 470,209" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="300,71 325,71" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="640" y="51" width="290" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="785" y="74.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="785" dy="0">Therac-25</tspan></text><rect x="640" y="107" width="290" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="785" y="136" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">Doble paso compacto; prototipo de</tspan></text><text x="785" y="152.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">1976 y versión computarizada a fines</tspan></text><text x="785" y="169.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="785" dy="0">de 1982</tspan></text><rect x="640" y="209" width="290" height="84" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="246.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">El software vigilaba y controlaba; no</tspan></text><text x="785" y="262.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">se duplicaron todos los interlocks</tspan></text><polyline points="785,91 785,107" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="785,191 785,209" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="615,71 640,71" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="315" width="920" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="341.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Marzo de 1983: análisis de seguridad por árbol de fallos. Supuso que los errores de programación estaban reducidos por</tspan></text><text x="470" y="357.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">pruebas y modeló los fallos del computador como fallos de hardware o ruido.</tspan></text><rect x="10" y="397" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="421.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: que parte del software se reutilizó entre las tres máquinas y que el análisis de 1983 no consideró errores de</tspan></text><text x="470" y="438.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">software. La lectura de que ese reparto de responsabilidad fue la decisión de arquitectura de mayor consecuencia es el</tspan></text><text x="470" y="455.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">análisis de Leveson y Turner, no un dato medido.</tspan></text><text x="470" y="502.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Leveson y Turner, IEEE Computer 26(7), 1993; esquema propio.</tspan></text></svg>
