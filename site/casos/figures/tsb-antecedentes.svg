<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 508" width="940" height="508" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro años de decisiones hasta el fin de semana de la migración</title><desc id="d">Eje no proporcional con nueve hitos: la escisión de junio de 2014, la compra de Sabadell en julio de 2015, el plan maestro de marzo de 2016, la decisión de replanificar el 20 de septiembre de 2017, el anuncio público nueve días después, la reducción de pruebas en febrero de 2018, el fin de las pruebas el día antes de la decisión, la migración del 20 al 22 de abril y la vuelta a la normalidad el 10 de diciembre.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="508" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro años de decisiones hasta el fin de semana de la migración</tspan></text><line x1="30" y1="201" x2="910" y2="201" stroke="#32505f" stroke-width="2"/><line x1="84" y1="201" x2="84" y2="161" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="84" cy="201" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="84" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="84" dy="0"></tspan></text><rect x="6" y="53" width="168" height="108" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="90" y="77.36" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="90" dy="0">Jun 2014: TSB se</tspan></text><text x="90" y="94" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="90" dy="0">escinde de Lloyds;</tspan></text><text x="90" y="110.64" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="90" dy="0">sigue en su</tspan></text><text x="90" y="127.28" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="90" dy="0">plataforma hasta</tspan></text><text x="90" y="143.92" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="90" dy="0">2024</tspan></text><line x1="180.5" y1="201" x2="180.5" y2="241" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="180.5" cy="201" r="12" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="180.5" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="180.5" dy="0"></tspan></text><rect x="96.5" y="241" width="168" height="108" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="180.5" y="273.68" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="180.5" dy="0">Jul 2015: Sabadell</tspan></text><text x="180.5" y="290.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="180.5" dy="0">compra TSB; meta:</tspan></text><text x="180.5" y="306.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="180.5" dy="0">migrar a fines de</tspan></text><text x="180.5" y="323.6" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="180.5" dy="0">2017</tspan></text><line x1="277" y1="201" x2="277" y2="161" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="277" cy="201" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="277" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="277" dy="0"></tspan></text><rect x="193" y="53" width="168" height="108" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="277" y="94" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="277" dy="0">Mar 2016: plan</tspan></text><text x="277" y="110.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="277" dy="0">maestro con meses de</tspan></text><text x="277" y="127.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="277" dy="0">retraso</tspan></text><line x1="373.5" y1="201" x2="373.5" y2="241" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="373.5" cy="201" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="373.5" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="373.5" dy="0"></tspan></text><rect x="289.5" y="241" width="168" height="108" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="373.5" y="290.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="373.5" dy="0">20 sep 2017: se</tspan></text><text x="373.5" y="306.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="373.5" dy="0">decide replanificar</tspan></text><line x1="470" y1="201" x2="470" y2="161" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="470" cy="201" r="12" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0"></tspan></text><rect x="386" y="53" width="168" height="108" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="85.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">29 sep 2017: anuncio</tspan></text><text x="470" y="102.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">público de migrar en</tspan></text><text x="470" y="118.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el 1.er trim. de</tspan></text><text x="470" y="135.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2018</tspan></text><line x1="566.5" y1="201" x2="566.5" y2="241" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="566.5" cy="201" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="566.5" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="566.5" dy="0"></tspan></text><rect x="482.5" y="241" width="168" height="108" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="566.5" y="273.68" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="566.5" dy="0">Feb 2018: se reducen</tspan></text><text x="566.5" y="290.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="566.5" dy="0">pruebas y</tspan></text><text x="566.5" y="306.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="566.5" dy="0">documentos; cambia</tspan></text><text x="566.5" y="323.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="566.5" dy="0">la atestación</tspan></text><line x1="663" y1="201" x2="663" y2="161" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="663" cy="201" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="663" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="663" dy="0"></tspan></text><rect x="579" y="53" width="168" height="108" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="663" y="102.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="663" dy="0">Víspera de decidir:</tspan></text><text x="663" y="118.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="663" dy="0">terminan las pruebas</tspan></text><line x1="759.5" y1="201" x2="759.5" y2="241" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="759.5" cy="201" r="12" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="759.5" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="759.5" dy="0"></tspan></text><rect x="675.5" y="241" width="168" height="108" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="759.5" y="290.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="759.5" dy="0">20-22 abr 2018:</tspan></text><text x="759.5" y="306.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="759.5" dy="0">migración principal</tspan></text><line x1="856" y1="201" x2="856" y2="161" stroke="#8a9aa3" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="856" cy="201" r="12" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="856" y="206" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="856" dy="0"></tspan></text><rect x="766" y="53" width="168" height="108" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="850" y="102.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="850" dy="0">10 dic 2018: vuelta</tspan></text><text x="850" y="118.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="850" dy="0">a la normalidad</tspan></text><rect x="10" y="385" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="409.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: el anuncio público llegó nueve días después de decidir que había que replanificar y antes de acabar de</tspan></text><text x="470" y="426.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">replanificar: la fecha pasó a ser un compromiso externo antes de ser un plan. El riesgo se acumula entre 2017 y febrero de</tspan></text><text x="470" y="443.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2018.</tspan></text><text x="470" y="490.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FCA, Final Notice a TSB Bank plc (20 de diciembre de 2022). Párrafos 2.1, 2.2, 2.10 a 2.15, 2.7 y 2.13. Espaciado uniforme, no a escala de meses.</tspan></text></svg>
