<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Arquitectura de migración «después»: oleadas, coexistencia y retorno ensayado</title><desc id="d">Arquitectura objetivo propuesta: una capa de enrutamiento que lleva a cada cliente a la plataforma antigua o a la nueva, oleadas sucesivas de clientes con comprobaciones de datos, un camino de vuelta atrás ensayado, observabilidad compartida con el proveedor y criterios de entrada de cada oleada.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="450" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Arquitectura de migración «después»: oleadas, coexistencia y retorno ensayado</tspan></text><rect x="10" y="71" width="150" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="85" y="106.32" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="85" dy="0">Clientes por</tspan></text><text x="85" y="122.96" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="85" dy="0">oleadas</tspan></text><rect x="200" y="71" width="190" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="295" y="98" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="295" dy="0">Capa de enrutamiento:</tspan></text><text x="295" y="114.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="295" dy="0">cada cliente en una</tspan></text><text x="295" y="131.28" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="295" dy="0">sola plataforma</tspan></text><rect x="440" y="51" width="220" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="550" y="76.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="550" dy="0">Plataforma de Lloyds</tspan></text><text x="550" y="92.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="550" dy="0">(origen)</tspan></text><rect x="440" y="121" width="220" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="550" y="154.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="550" dy="0">Proteo4UK (destino)</tspan></text><rect x="710" y="71" width="220" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="820" y="106.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">Comprobación de datos y</tspan></text><text x="820" y="122.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="820" dy="0">reconciliación por oleada</tspan></text><polyline points="160,111 200,111" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="390,91 440,81" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="390,131 440,151" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="660,151 710,121" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><polyline points="440,151 390,151" fill="none" stroke="#c0432f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-coral)"/><text x="300" y="173" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="300" dy="0">vuelta atrás ensayada</tspan></text><rect x="10" y="231" width="290" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="155" y="256" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">Criterio de entrada de cada oleada:</tspan></text><text x="155" y="272.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">carga al doble, activo-activo</tspan></text><text x="155" y="289.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="155" dy="0">probado, retorno ensayado</tspan></text><rect x="320" y="231" width="290" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="465" y="264.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">Observabilidad y guion de incidente</tspan></text><text x="465" y="280.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="465" dy="0">compartidos con el proveedor</tspan></text><rect x="630" y="231" width="300" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="780" y="264.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="780" dy="0">Capacidad de contacto y de quejas</tspan></text><text x="780" y="280.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="780" dy="0">escalable desde la primera oleada</tspan></text><rect x="10" y="327" width="920" height="75.92" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="351.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Lo que enseña: cada oleada es un experimento acotado con retorno. La capa de enrutamiento hace posible la coexistencia, y</tspan></text><text x="470" y="368.6" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">la comprobación de datos detecta errores antes de la siguiente oleada. Es análisis propio apoyado en las deficiencias del</tspan></text><text x="470" y="385.24" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Final Notice; no describe lo que TSB adoptó después.</tspan></text><text x="470" y="432.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Análisis propio apoyado en el Final Notice de la FCA; no es una conclusión del regulador.</tspan></text></svg>
