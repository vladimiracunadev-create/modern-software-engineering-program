<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" width="940" height="410" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la plataforma de Lloyds a Proteo4UK: una migración sin vuelta atrás</title><desc id="d">Diagrama de antes y después: hasta abril de 2018 TSB recibía sus servicios informáticos de la plataforma de Lloyds Banking Group; el fin de semana del 20 al 22 de abril de 2018 migró a Proteo4UK, una versión nueva de la plataforma de Sabadell construida y operada por SABIS, que a su vez dependía de 85 terceros; tras la migración no se podía volver a la plataforma de Lloyds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="410" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la plataforma de Lloyds a Proteo4UK: una migración sin vuelta atrás</tspan></text><rect x="10" y="51" width="420" height="232" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Antes (hasta el 20 de abril de 2018)</tspan></text><rect x="30" y="91" width="380" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="220" y="114.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="220" dy="0">Plataforma de Lloyds Banking Group, bajo contrato</tspan></text><text x="220" y="130.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="220" dy="0">de externalización hasta julio de 2024</tspan></text><rect x="30" y="163" width="380" height="56" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="220" y="186.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220" dy="0">Servicios de TSB: sucursales, teléfono, banca por</tspan></text><text x="220" y="202.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="220" dy="0">internet y móvil</tspan></text><polyline points="220,147 220,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="30" y="229" width="380" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="220" y="254.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="220" dy="0">Operación a cargo de Lloyds, ya en producción</tspan></text><rect x="510" y="51" width="420" height="232" rx="16" fill="#fbe4de" fill-opacity="0.45" stroke="#c0432f" stroke-width="1.6" stroke-dasharray="8 5"/><text x="524" y="73" font-size="14" text-anchor="start" font-weight="700" fill="#5c1f14"><tspan x="524" dy="0">Después (desde el 22 de abril de 2018)</tspan></text><rect x="530" y="91" width="380" height="56" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="720" y="114.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="720" dy="0">Proteo4UK: versión nueva de la plataforma de</tspan></text><text x="720" y="130.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="720" dy="0">Sabadell, construida y operada por SABIS</tspan></text><rect x="530" y="163" width="380" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="720" y="186.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">SABIS depende de 85 terceros (cuartas partes</tspan></text><text x="720" y="202.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="720" dy="0">desde TSB)</tspan></text><polyline points="720,147 720,163" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="530" y="229" width="380" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="720" y="254.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="720" dy="0">Sin vuelta atrás a la plataforma de Lloyds</tspan></text><polyline points="430,167 510,167" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="151" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">migración</tspan></text><rect x="10" y="303" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="327.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: la migración cambió de una vez el sistema, el operador y la cadena de proveedores, y eliminó la posibilidad</tspan></text><text x="470" y="344.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de volver. Eso convierte cualquier defecto en un incidente sin salida, porque solo se puede arreglar hacia delante.</tspan></text><text x="470" y="392.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FCA, Final Notice a TSB Bank plc (20 de diciembre de 2022). Secciones 2.1 a 2.4, 2.22 y 2.27.</tspan></text></svg>
