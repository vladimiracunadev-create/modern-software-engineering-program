<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 406" width="940" height="406" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Lo que el regulador cuantifica: compensación y multas</title><desc id="d">Barras horizontales en millones de libras: compensación pagada a clientes 32,7; multa de la FCA 29,75 tras el descuento del 30 %; multa de la FCA antes del descuento 42,5; y multa de la PRA 18,9.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="406" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Lo que el regulador cuantifica: compensación y multas</tspan></text><line x1="354" y1="49" x2="354" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="354" y1="225" x2="354" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="354" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="354" dy="0">0</tspan></text><line x1="458.34" y1="49" x2="458.34" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="458.34" y1="225" x2="458.34" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="458.34" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="458.34" dy="0">10</tspan></text><line x1="562.68" y1="49" x2="562.68" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="562.68" y1="225" x2="562.68" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="562.68" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="562.68" dy="0">20</tspan></text><line x1="667.02" y1="49" x2="667.02" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="667.02" y1="225" x2="667.02" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="667.02" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="667.02" dy="0">30</tspan></text><line x1="771.36" y1="49" x2="771.36" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="771.36" y1="225" x2="771.36" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="771.36" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.36" dy="0">40</tspan></text><line x1="875.7" y1="49" x2="875.7" y2="225" stroke="#d5dde1" stroke-width="1"/><line x1="875.7" y1="225" x2="875.7" y2="230" stroke="#5b7280" stroke-width="1.4"/><text x="875.7" y="246" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="875.7" dy="0">50</tspan></text><line x1="354" y1="225" x2="875.7" y2="225" stroke="#5b7280" stroke-width="1.6"/><text x="344" y="67" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Compensación a clientes (22 abr 2018 a 7 abr</tspan></text><text x="344" y="84" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">2019)</tspan></text><text x="344" y="119.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Multa FCA tras el 30 % de descuento</tspan></text><text x="344" y="163.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Multa FCA sin descuento</tspan></text><text x="344" y="207.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="344" dy="0">Multa PRA</tspan></text><rect x="354" y="55" width="341.192" height="32" rx="3" fill="#c0432f"/><text x="702.192" y="75.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="702.192" dy="0">32,70</tspan></text><rect x="354" y="99" width="310.411" height="32" rx="3" fill="#c0432f"/><text x="671.411" y="119.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="671.411" dy="0">29,75</tspan></text><rect x="354" y="143" width="443.445" height="32" rx="3" fill="#c0432f"/><text x="804.445" y="163.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="804.445" dy="0">42,50</tspan></text><rect x="354" y="187" width="197.203" height="32" rx="3" fill="#c0432f"/><text x="558.203" y="207.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="558.203" dy="0">18,90</tspan></text><text x="614.85" y="269" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="614.85" dy="0">Millones de libras esterlinas (£)</tspan></text><rect x="10" y="283" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La multa total fue de 48,65 millones (FCA 29,75 más PRA 18,9). La compensación pagada fue de 32 705 762 libras por</tspan></text><text x="470" y="324.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">distintos conceptos (reparación, gastos, molestias). No incluye el costo interno del programa de remediación ni la pérdida</tspan></text><text x="470" y="341.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de clientes, que las fuentes consultadas no cuantifican.</tspan></text><text x="470" y="388.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FCA, Final Notice a TSB Bank plc (20 de diciembre de 2022). y comunicado conjunto FCA/PRA del 20 de diciembre de 2022.</tspan></text></svg>
