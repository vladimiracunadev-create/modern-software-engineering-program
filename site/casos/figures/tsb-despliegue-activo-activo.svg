<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" width="940" height="620" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">La prueba que se recortó: la configuración «activo-activo» de los centros de datos</title><desc id="d">Esquema de despliegue con dos centros de datos que atienden banca digital en configuración activo-activo, un balanceo entre ambos, y la prueba no funcional de esa configuración que se redujo de alcance en febrero de 2018; un problema de configuración en ciertos componentes dejó sin disponibilidad a internet y móvil tras la migración.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="620" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">La prueba que se recortó: la configuración «activo-activo» de los centros de datos</tspan></text><rect x="340" y="51" width="260" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="470" dy="0">Clientes de banca digital</tspan></text><rect x="340" y="141" width="260" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="166.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">Reparto de tráfico entre los dos</tspan></text><text x="470" y="182.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="470" dy="0">centros</tspan></text><rect x="60" y="241" width="330" height="170" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="74" y="263" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="74" dy="0">Centro de datos A</tspan></text><rect x="550" y="241" width="330" height="170" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="564" y="263" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="564" dy="0">Centro de datos B</tspan></text><rect x="80" y="281" width="290" height="110" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="225" y="331.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="225" dy="0">Componentes de banca digital en</tspan></text><text x="225" y="347.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="225" dy="0">configuración activo-activo</tspan></text><rect x="570" y="281" width="290" height="110" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="715" y="331.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="715" dy="0">Componentes de banca digital en</tspan></text><text x="715" y="347.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="715" dy="0">configuración activo-activo</tspan></text><polyline points="470,111 470,141" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="400,201 225,281" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="540,201 715,281" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="390,336 570,336" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="480" y="323" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="480" dy="0">sincronía</tspan></text><rect x="660" y="61" width="270" height="100" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="795" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">Febrero de 2018: se reduce el</tspan></text><text x="795" y="114.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">alcance de esta prueba, fuera del</tspan></text><text x="795" y="131.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">foro de gobierno adecuado</tspan></text><rect x="160" y="423" width="620" height="54" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="445.32" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">Problema de configuración de ciertos componentes; según TSB (2019), los dos</tspan></text><text x="470" y="461.96" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="470" dy="0">centros no quedaron idénticos</tspan></text><rect x="10" y="497" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="521.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: la FCA dice que, de haberse hecho esa prueba, probablemente se habría encontrado el problema de</tspan></text><text x="470" y="538.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">configuración que dejó sin disponibilidad a internet y móvil. TSB solo consideró el riesgo de la prueba sobre servicios ya</tspan></text><text x="470" y="555.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">activos y la trató como una decisión técnica; el riesgo de no hacerla no se identificó.</tspan></text><text x="470" y="602.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FCA, Final Notice a TSB Bank plc (20 de diciembre de 2022). Párrafo 2.14. La topología es un modelo didáctico: el Final Notice no describe los componentes concretos.</tspan></text></svg>
