<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 414" width="940" height="414" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del 22 de abril de 2018 al 7 de abril de 2019: servicio, quejas y reparación</title><desc id="d">Línea de tiempo en meses desde abril de 2018: servicios afectados hasta el 10 de diciembre de 2018, quejas recibidas durante casi doce meses, programa de reparación desde mayo de 2018 y compensación pagada durante el periodo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="414" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Del 22 de abril de 2018 al 7 de abril de 2019: servicio, quejas y reparación</tspan></text><line x1="274" y1="83" x2="274" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="274" y1="233" x2="274" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="274" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="274" dy="0">0</tspan></text><line x1="380.333" y1="83" x2="380.333" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="380.333" y1="233" x2="380.333" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="380.333" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380.333" dy="0">2</tspan></text><line x1="486.667" y1="83" x2="486.667" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="486.667" y1="233" x2="486.667" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="486.667" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="486.667" dy="0">4</tspan></text><line x1="593" y1="83" x2="593" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="593" y1="233" x2="593" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="593" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="593" dy="0">6</tspan></text><line x1="699.333" y1="83" x2="699.333" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="699.333" y1="233" x2="699.333" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="699.333" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="699.333" dy="0">8</tspan></text><line x1="805.667" y1="83" x2="805.667" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="805.667" y1="233" x2="805.667" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="805.667" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="805.667" dy="0">10</tspan></text><line x1="912" y1="83" x2="912" y2="233" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="233" x2="912" y2="238" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="254" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">12</tspan></text><line x1="274" y1="233" x2="912" y2="233" stroke="#5b7280" stroke-width="1.6"/><text x="264" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Servicio degradado</tspan></text><text x="264" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Quejas recibidas</tspan></text><text x="264" y="212.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="264" dy="0">Programa «Putting Things Right»</tspan></text><line x1="274" y1="75" x2="274" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="274" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="274" dy="0">22 abr</tspan></text><line x1="678.067" y1="75" x2="678.067" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="678.067" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="678.067" dy="0">10 dic</tspan></text><line x1="885.417" y1="75" x2="885.417" y2="233" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="885.417" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="885.417" dy="0">7 abr 2019</tspan></text><rect x="274" y="92" width="404.067" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="476.033" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="476.033" dy="0">hasta el 10 de diciembre de 2018</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="274" y="142" width="611.417" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="579.708" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="579.708" dy="0">225 492 quejas en 12 meses</tspan></text><line x1="14" y1="183" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><rect x="327.167" y="192" width="558.25" height="32" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="606.292" y="212.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="606.292" dy="0">desde mayo de 2018</tspan></text><text x="593" y="277" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="593" dy="0">Meses desde el 22 de abril de 2018</tspan></text><rect x="10" y="291" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="315.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">La FCA da el inicio, el fin del servicio degradado y el cierre del periodo de quejas; no da el reparto de las quejas por</tspan></text><text x="470" y="332.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mes ni la carga diaria. Los 32 705 762 de compensación son del conjunto del periodo. «Casi doce meses» es el plazo que,</tspan></text><text x="470" y="349.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">según la FCA, tardó en gestionar las quejas.</tspan></text><text x="470" y="396.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FCA, Final Notice a TSB Bank plc (20 de diciembre de 2022). Párrafos 2.7, 2.8, 2.31 y 2.32.</tspan></text></svg>
