<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 580" width="940" height="580" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware y software de TSB: lo que se sabe y lo que no es público</title><desc id="d">Pila de seis capas: aplicaciones bancarias de la plataforma Proteo4UK, derivada de la plataforma española Proteo; migración de datos; documentación de diseño sustituida por documentos de configuración; dos centros de datos en configuración activo-activo con una configuración incoherente; lenguajes, sistemas operativos y hardware no constan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="580" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware y software de TSB: lo que se sabe y lo que no es público</tspan></text><rect x="10" y="51" width="640" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="75.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">Aplicación: plataforma bancaria Proteo4UK, versión británica de Proteo, aún no</tspan></text><text x="330" y="91.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">probada en el Reino Unido (documentado)</tspan></text><rect x="670" y="51" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="83.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">FCA, 2.3</tspan></text><rect x="10" y="117" width="640" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="141.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">Migración: evento principal del 20 al 22 de abril de 2018; datos de clientes</tspan></text><text x="330" y="157.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">(documentado)</tspan></text><rect x="670" y="117" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">FCA, 2.5</tspan></text><rect x="10" y="183" width="640" height="58" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="330" y="215.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="330" dy="0">Diseño y configuración: documentos de configuración en lugar de diseño (documentado)</tspan></text><rect x="670" y="183" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="215.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">FCA, 2.21</tspan></text><rect x="10" y="249" width="640" height="58" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="330" y="273.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="330" dy="0">Dos centros de datos en activo-activo, configurados de forma incoherente según TSB</tspan></text><text x="330" y="289.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="330" dy="0">(parcial)</tspan></text><rect x="670" y="249" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="281.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">FCA, 2.14; TSB, 2019</tspan></text><rect x="10" y="315" width="640" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="330" y="347.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="330" dy="0">Lenguajes, frameworks, bases de datos, sistemas operativos (no se sabe)</tspan></text><rect x="670" y="315" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="347.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">no consta</tspan></text><rect x="10" y="381" width="640" height="58" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="330" y="413.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="330" dy="0">Hardware, red, ubicación de los centros de datos y proveedores de nube (no se sabe)</tspan></text><rect x="670" y="381" width="250" height="58" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="413.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">no consta</tspan></text><rect x="10" y="457" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="481.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo que enseña: lo documentado de la tecnología es su procedencia, su configuración y su proceso de migración, no su</tspan></text><text x="470" y="498.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">implementación. El único detalle de infraestructura es la configuración activo-activo, con el relato de TSB sobre centros</tspan></text><text x="470" y="515.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">no idénticos. No se inventa ningún dato de hardware ni de lenguajes.</tspan></text><text x="470" y="562.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: FCA, Final Notice y TSB, comunicado del 19 de noviembre de 2019. Verde: documentado; dorado: en parte; gris: no se sabe.</tspan></text></svg>
