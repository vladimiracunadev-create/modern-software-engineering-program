<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 364" width="940" height="364" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De la compra por Sabadell al regreso a la normalidad: 54 meses</title><desc id="d">Línea de tiempo en meses desde junio de 2014: TSB se escinde de Lloyds en junio de 2014, Sabadell la adquiere en julio de 2015, el plan maestro de marzo de 2016 apuntaba a migrar a finales de 2017, en septiembre de 2017 se decide replantear el plan, el fin de semana del 20 al 22 de abril de 2018 se migra y TSB no vuelve a la normalidad operativa hasta el 10 de diciembre de 2018.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="364" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De la compra por Sabadell al regreso a la normalidad: 54 meses</tspan></text><line x1="214" y1="83" x2="214" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="214" y1="183" x2="214" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="214" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="214" dy="0">0</tspan></text><line x1="369.111" y1="83" x2="369.111" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="369.111" y1="183" x2="369.111" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="369.111" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="369.111" dy="0">12</tspan></text><line x1="524.222" y1="83" x2="524.222" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="524.222" y1="183" x2="524.222" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="524.222" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="524.222" dy="0">24</tspan></text><line x1="679.333" y1="83" x2="679.333" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="679.333" y1="183" x2="679.333" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="679.333" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="679.333" dy="0">36</tspan></text><line x1="834.444" y1="83" x2="834.444" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="834.444" y1="183" x2="834.444" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="834.444" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="834.444" dy="0">48</tspan></text><line x1="912" y1="83" x2="912" y2="183" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="183" x2="912" y2="188" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="204" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">54</tspan></text><line x1="214" y1="183" x2="912" y2="183" stroke="#5b7280" stroke-width="1.6"/><text x="204" y="112.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Programa de migración</tspan></text><text x="204" y="162.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="204" dy="0">Después de la migración</tspan></text><line x1="382.037" y1="75" x2="382.037" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="382.037" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="382.037" dy="0">Jul 2015</tspan></text><line x1="485.444" y1="75" x2="485.444" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="485.444" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="485.444" dy="0">Mar 2016</tspan></text><line x1="718.111" y1="75" x2="718.111" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="718.111" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="718.111" dy="0">Sep 2017</tspan></text><line x1="808.593" y1="75" x2="808.593" y2="183" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="808.593" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="808.593" dy="0">Abr 2018</tspan></text><rect x="382.037" y="92" width="426.556" height="32" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="595.315" y="112.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="595.315" dy="0">Diseño, construcción y pruebas</tspan></text><line x1="14" y1="133" x2="912" y2="133" stroke="#d5dde1" stroke-width="1"/><rect x="808.593" y="142" width="103.407" height="32" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="860.296" y="162.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="860.296" dy="0">Incidente</tspan></text><text x="563" y="227" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="563" dy="0">Meses desde junio de 2014 (0 = junio de 2014)</tspan></text><rect x="10" y="241" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="265.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Julio de 2015: Sabadell adquiere TSB. Marzo de 2016: plan maestro con migración a finales de 2017 pese a ir meses atrasado.</tspan></text><text x="470" y="282.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Septiembre de 2017: se decide replantear el plan y nueve días después se anuncia migración en el primer trimestre de 2018.</tspan></text><text x="470" y="299.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Abril de 2018: migración. Diciembre de 2018: fin del incidente, según el regulador. Las posiciones son aproximadas al mes.</tspan></text><text x="470" y="346.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FCA, Final Notice a TSB Bank plc (20 de diciembre de 2022). Párrafos 2.1 a 2.12 y 2.7.</tspan></text></svg>
