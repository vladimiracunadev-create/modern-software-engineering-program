<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 838" width="940" height="838" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Siete decisiones del caso y la mejora que las habría cambiado</title><desc id="d">Siete tarjetas con una situación documentada y la mejora propuesta: plan realista con incertidumbre, criterios de salida de pruebas, prueba de configuración de centros de datos, diligencia sobre el proveedor, migración por etapas con vuelta atrás, plan de crisis de semanas y comunicación a clientes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="838" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Siete decisiones del caso y la mejora que las habría cambiado</tspan></text><rect x="14" y="47" width="14" height="14" rx="3" fill="#c0432f"/><text x="36" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">falla o sorprende</tspan></text><rect x="183.2" y="47" width="14" height="14" rx="3" fill="#087f8c"/><text x="205.2" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="205.2" dy="0">se sostiene</tspan></text><rect x="306.8" y="47" width="14" height="14" rx="3" fill="#946512"/><text x="328.8" y="59" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="328.8" dy="0">depende</tspan></text><rect x="20" y="77" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="100.96" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Plan maestro de izquierda a derecha con fecha pública,</tspan></text><text x="30" y="117.6" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">ya atrasado</tspan></text><polyline points="438,105.64 474,105.64" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="77" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="100.96" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Plan con la incertidumbre explícita y fecha no</tspan></text><text x="488" y="117.6" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">comprometida</tspan></text><text x="24" y="151.28" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">La fecha pública redujo el margen para decidir con evidencia.</tspan></text><rect x="20" y="172.92" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="196.88" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Pruebas en paralelo y terminadas el día antes de</tspan></text><text x="30" y="213.52" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">decidir</tspan></text><polyline points="438,201.56 474,201.56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="172.92" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="205.2" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Criterios de salida de pruebas y tiempo para corregir</tspan></text><text x="24" y="247.2" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Las pruebas se comprimieron para cumplir los plazos.</tspan></text><rect x="20" y="268.84" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="292.8" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Pruebas de configuración de los centros de datos</tspan></text><text x="30" y="309.44" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">reducidas en febrero de 2018</tspan></text><polyline points="438,297.48 474,297.48" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="268.84" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="292.8" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Mantener la prueba, o registrar el riesgo ante el comité</tspan></text><text x="488" y="309.44" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">adecuado</tspan></text><text x="24" y="343.12" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Según la FCA, probablemente habría detectado el problema de configuración.</tspan></text><rect x="20" y="364.76" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="388.72" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Capacidad de SABIS y de sus 85 terceros sin evaluación</tspan></text><text x="30" y="405.36" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">formal</tspan></text><polyline points="438,393.4 474,393.4" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="364.76" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="388.72" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Diligencia formal y ejercicios conjuntos de incidente con</tspan></text><text x="488" y="405.36" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">el proveedor</tspan></text><text x="24" y="439.04" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">No se identificó de forma explícita el riesgo de incumplimiento del proveedor.</tspan></text><rect x="20" y="460.68" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="484.64" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Migración casi total en un fin de semana y sin vuelta</tspan></text><text x="30" y="501.28" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">atrás</tspan></text><polyline points="438,489.32 474,489.32" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="460.68" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="492.96" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Migración por oleadas con vuelta atrás probada</tspan></text><text x="24" y="534.96" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Sin retorno posible, cualquier defecto se arregla en caliente.</tspan></text><rect x="20" y="556.6" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="580.56" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Guías para las primeras 48 horas y ejercicios de unos</tspan></text><text x="30" y="597.2" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">días</tspan></text><polyline points="438,585.24 474,585.24" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="556.6" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="580.56" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Plan para semanas, con ampliación de capacidad y</tspan></text><text x="488" y="597.2" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">comunicación</tspan></text><text x="24" y="630.88" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Muchos incidentes duraron semanas.</tspan></text><rect x="20" y="652.52" width="414" height="57.28" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="30" y="676.48" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">Mensajes genéricos y clientes vulnerables sin</tspan></text><text x="30" y="693.12" font-size="13" text-anchor="start" font-weight="400" fill="#ffffff"><tspan x="30" dy="0">identificar</tspan></text><polyline points="438,681.16 474,681.16" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="478" y="652.52" width="442" height="57.28" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="488" y="676.48" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">Guion de comunicación y registro de clientes vulnerables</tspan></text><text x="488" y="693.12" font-size="13" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="488" dy="0">antes de migrar</tspan></text><text x="24" y="726.8" font-size="13" text-anchor="start" font-weight="400" fill="#4a5d68"><tspan x="24" dy="0">Los mensajes no reflejaban la experiencia real del cliente.</tspan></text><rect x="10" y="750.44" width="920" height="54" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="781.08" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">Análisis propio apoyado en el Final Notice de la FCA; no es una conclusión del regulador.</tspan></text></svg>
