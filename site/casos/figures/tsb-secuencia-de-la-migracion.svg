<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 596" width="940" height="596" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Secuencia del fin de semana de migración y de la primera semana</title><desc id="d">Diagrama de secuencia con consejo de TSB, SABIS, plataforma Proteo4UK, clientes y plataforma de Lloyds: terminan las pruebas el día antes de decidir, se migra el 20 al 22 de abril, fallan los canales, los clientes pasan del móvil al teléfono y a las sucursales, y no se puede volver a la plataforma de Lloyds.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="596" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Secuencia del fin de semana de migración y de la primera semana</tspan></text><rect x="35" y="51" width="150" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="110" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="110" dy="0">Consejo y</tspan></text><text x="110" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="110" dy="0">dirección de TSB</tspan></text><rect x="215" y="51" width="150" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="290" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290" dy="0">SABIS</tspan></text><rect x="395" y="51" width="150" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="470" dy="0">Proteo4UK</tspan></text><rect x="575" y="51" width="150" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="650" y="77.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="650" dy="0">Clientes</tspan></text><rect x="755" y="51" width="150" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="830" y="69.32" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="830" dy="0">Plataforma de</tspan></text><text x="830" y="85.96" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="830" dy="0">Lloyds</tspan></text><line x1="110" y1="97" x2="110" y2="461" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="290" y1="97" x2="290" y2="461" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="470" y1="97" x2="470" y2="461" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="650" y1="97" x2="650" y2="461" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="830" y1="97" x2="830" y2="461" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="290,130.5 110,130.5" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="200" y="122.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="200" dy="0">1. carta</tspan></text><polyline points="110,165.5 290,165.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="200" y="157.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="200" dy="0">2. decide migrar</tspan></text><polyline points="290,200.5 470,200.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380" y="192.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380" dy="0">3. migra datos</tspan></text><polyline points="470,235.5 650,235.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="227.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">4. abre el 22 abr</tspan></text><polyline points="650,270.5 470,270.5" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="560" y="262.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="560" dy="0">5. canales fallan</tspan></text><rect x="525" y="286.5" width="250" height="30" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="650" y="305.14" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="650" dy="0">6. pasan al teléfono</tspan></text><polyline points="650,340.5 110,340.5" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="380" y="332.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380" dy="0">7. colas y quejas</tspan></text><polyline points="110,375.5 830,375.5" fill="none" stroke="#c0432f" stroke-width="1.8" marker-end="url(#arrow-coral)"/><text x="470" y="367.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">8. sin vuelta</tspan></text><polyline points="110,410.5 290,410.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="200" y="402.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="200" dy="0">9. pide arreglar</tspan></text><polyline points="290,445.5 470,445.5" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380" y="437.5" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="380" dy="0">10. correcciones</tspan></text><rect x="10" y="473" width="920" height="75.92" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="470" y="497.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Lo que enseña: el consejo decidió con una carta del proveedor que era en parte una declaración de intención, y desde el</tspan></text><text x="470" y="514.6" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">primer día no tenía retorno. La figura es un modelo del orden de hechos que describe la FCA; el Final Notice no da horas</tspan></text><text x="470" y="531.24" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">por paso.</tspan></text><text x="470" y="578.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: FCA, Final Notice a TSB Bank plc (20 de diciembre de 2022). Párrafos 2.5 a 2.7, 2.13, 2.24, 2.25 y 2.27. Orden de pasos: reconstrucción propia.</tspan></text></svg>
