<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 489" width="940" height="489" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 3, componente: el anillo de Ringpop reparte claves y reenvía peticiones</title><desc id="d">Diagrama de un anillo de hashing consistente con cuatro nodos: una clave cae en el arco del nodo propietario; una petición que llega a otro nodo se reenvía al dueño; si un nodo cae, solo sus claves pasan al vecino.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="489" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 3, componente: el anillo de Ringpop reparte claves y reenvía peticiones</tspan></text><circle cx="250.0" cy="205.0" r="120.0" fill="none" stroke="#8a9aa3" stroke-width="2" stroke-dasharray="6 4"/><rect x="208" y="65" width="84" height="40" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="250" y="88.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="250" dy="0">Nodo A</tspan></text><rect x="328" y="185" width="84" height="40" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="370" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="370" dy="0">Nodo B</tspan></text><rect x="208" y="305" width="84" height="40" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="250" y="328.64" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="250" dy="0">Nodo C</tspan></text><rect x="88" y="185" width="84" height="40" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="130" y="208.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="130" dy="0">Nodo D</tspan></text><text x="250" y="199" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="250" dy="0">Clave «viaje 42»</tspan></text><text x="250" y="217" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="250" dy="0">cae en el arco de C</tspan></text><polyline points="355,223 270,305" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="520" y="60" width="410" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="725" y="86.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725" dy="0">1. Una petición por el viaje 42 llega a cualquier</tspan></text><text x="725" y="102.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="725" dy="0">nodo, por ejemplo B</tspan></text><rect x="520" y="136" width="410" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="725" y="162.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="725" dy="0">2. B calcula el dueño con la función de hash y</tspan></text><text x="725" y="178.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="725" dy="0">reenvía la petición a C</tspan></text><rect x="520" y="212" width="410" height="62" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="725" y="238.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">3. C procesa la petición en su turno, una a la vez</tspan></text><text x="725" y="254.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="725" dy="0">para esa clave</tspan></text><rect x="520" y="288" width="410" height="62" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="725" y="314.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="725" dy="0">4. Si C cae, el protocolo de pertenencia lo detecta y</tspan></text><text x="725" y="330.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="725" dy="0">solo sus claves pasan al vecino</tspan></text><rect x="10" y="380" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="404.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el artículo de 2016 sobre Ringpop: pertenencia con una variante del protocolo SWIM sobre TCP, hashing</tspan></text><text x="470" y="421.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">consistente con FarmHash y reenvío de peticiones al propietario. El artículo de 2021 añade que el diseño entre pares</tspan></text><text x="470" y="438.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">limitaba el tamaño de cada pod en ciudades con mucha concurrencia. El ejemplo de la clave es didáctico.</tspan></text><text x="470" y="475.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
