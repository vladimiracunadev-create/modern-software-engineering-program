<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 481" width="940" height="481" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 2, contenedores: de las aplicaciones a la plataforma de cumplimiento y los datos</title><desc id="d">Diagrama de contenedores: las aplicaciones de quien pide y de quien conduce llegan a puertas de entrada por dominio; la plataforma de cumplimiento gestiona viajes y ofertas con almacenamiento transaccional; servicios de ubicación usan una rejilla hexagonal y un anillo de nodos; Cadence orquesta procesos largos; una plataforma de datos en tiempo real alimenta decisiones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="481" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 2, contenedores: de las aplicaciones a la plataforma de cumplimiento y los datos</tspan></text><rect x="10" y="70" width="170" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="95" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="95" dy="0">App de quien pide</tspan></text><rect x="10" y="150" width="170" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="95" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="95" dy="0">App de quien conduce</tspan></text><text x="95" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="95" dy="0">o reparte</tspan></text><rect x="210" y="52" width="720" height="300" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="224" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="224" dy="0">Plataforma de Uber (documentado en artículos 2016-2021; inferido donde se indica)</tspan></text><rect x="228" y="90" width="200" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="328" y="118.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328" dy="0">Puertas de entrada por</tspan></text><text x="328" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328" dy="0">dominio (DOMA)</tspan></text><rect x="446" y="90" width="220" height="66" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="556" y="118.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="556" dy="0">Plataforma de cumplimiento:</tspan></text><text x="556" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="556" dy="0">Viaje y Oferta, estados</tspan></text><rect x="684" y="90" width="228" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="798" y="118.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="798" dy="0">Almacén transaccional</tspan></text><text x="798" y="134.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="798" dy="0">(Spanner desde 2021)</tspan></text><rect x="228" y="174" width="200" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="328" y="194" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328" dy="0">Ubicación y rejilla H3;</tspan></text><text x="328" y="210.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328" dy="0">anillo de nodos con</tspan></text><text x="328" y="227.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="328" dy="0">Ringpop</tspan></text><rect x="446" y="174" width="220" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="556" y="202.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="556" dy="0">Cadence: orquestación de</tspan></text><text x="556" y="218.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="556" dy="0">procesos largos</tspan></text><rect x="684" y="174" width="228" height="66" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="798" y="202.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="798" dy="0">Datos en tiempo real,</tspan></text><text x="798" y="218.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="798" dy="0">precios y mapas (inferido)</tspan></text><rect x="228" y="258" width="684" height="76" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="570" y="291.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="570" dy="0">Pagos, verificación de identidad, seguros y detección de fraude: existen y se rigen por</tspan></text><text x="570" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="570" dy="0">reglas locales, pero las fuentes consultadas no los describen</tspan></text><polyline points="180,100 228,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="180,180 228,140" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="428,123 446,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="666,123 684,123" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="328,156 328,174" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="556,156 556,174" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="372" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="396.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: dominios con puertas de entrada (DOMA, 2020), la plataforma de cumplimiento con Viaje y Oferta sobre Spanner</tspan></text><text x="470" y="413.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(2021), H3 (2018), Ringpop (2016) y Cadence (2019). Inferido: la ubicación de los datos en tiempo real, el cálculo de</tspan></text><text x="470" y="430.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">precios y los pagos. No se sabe el número de servicios actuales ni cómo se reparten por región.</tspan></text><text x="470" y="467.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
