<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 389" width="940" height="389" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Un mercado de tres lados: quien pide, quien presta el servicio y la plataforma que los casa</title><desc id="d">Diagrama de contexto: la persona usuaria pide un viaje, un pedido o un envío desde la aplicación; la plataforma de Uber casa esa demanda con la oferta (conductores, repartidores, comercios), calcula el precio y cobra; los conductores y repartidores reciben ingresos; en torno hay mapas, medios de pago y reguladores locales.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="389" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Un mercado de tres lados: quien pide, quien presta el servicio y la plataforma que los casa</tspan></text><rect x="10" y="52" width="270" height="210" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="24" dy="0">Demanda</tspan></text><rect x="30" y="90" width="230" height="60" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="145" y="115.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="145" dy="0">Persona que pide un viaje,</tspan></text><text x="145" y="131.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="145" dy="0">un pedido o un envío</tspan></text><rect x="30" y="166" width="230" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6" stroke-dasharray="6 4"/><text x="145" y="188" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">Empresa que usa Uber for</tspan></text><text x="145" y="204.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">Business o Uber Direct</tspan></text><text x="145" y="221.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="145" dy="0">(inferido)</tspan></text><rect x="330" y="52" width="280" height="210" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="344" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="344" dy="0">Plataforma Uber</tspan></text><rect x="350" y="90" width="240" height="60" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="115.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Casar demanda y oferta, fijar</tspan></text><text x="470" y="131.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">precio y seguir el viaje</tspan></text><rect x="350" y="166" width="240" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Cobro, comisión y pago a quien</tspan></text><text x="470" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">presta el servicio</tspan></text><rect x="660" y="52" width="270" height="210" rx="16" fill="#eef1f2" fill-opacity="0.45" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="8 5"/><text x="674" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#2b3a44"><tspan x="674" dy="0">Oferta</tspan></text><rect x="680" y="90" width="230" height="60" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="795" y="115.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">Conductor o repartidor que</tspan></text><text x="795" y="131.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="795" dy="0">decide qué aceptar</tspan></text><rect x="680" y="166" width="230" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="795" y="196.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">Restaurante o comercio del</tspan></text><text x="795" y="212.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="795" dy="0">que sale el pedido</tspan></text><polyline points="260,120 350,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="590,120 680,120" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="590,200 680,200" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="305" y="106" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="305" dy="0">pide</tspan></text><text x="635" y="106" font-size="13" text-anchor="middle" font-weight="700" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="635" dy="0">oferta</tspan></text><rect x="10" y="280" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="304.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Lo documentado: Uber conecta a quien consume con quien presta el servicio en movilidad y reparto, y el informe de</tspan></text><text x="470" y="321.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">resultados separa Mobility y Delivery. Que la empresa y el comercio sean actores distintos del mismo mercado de tres lados</tspan></text><text x="470" y="338.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se ve en la descripción pública del reparto; los flujos de pago internos no se publican.</tspan></text><text x="470" y="375.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
