pan></text><text x="865" y="149.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="865" dy="0">otras</tspan></text><text x="865" y="166.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="865" dy="0">ciudades</tspan></text><rect x="724" y="186" width="186" height="46" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="817" y="204.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">Ciudades a pods según</tspan></text><text x="817" y="220.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="817" dy="0">criterios</tspan></text><rect x="10" y="272" width="920" height="56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="295.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cumplimiento nuevo (2021): corre en regiones operativas de América del Norte y llama a una configuración multirregión de</tspan></text><text x="470" y="311.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Spanner para cada transacción</tspan></text><rect x="10" y="348" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="372.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el artículo de 2021: el diseño con dos dominios de fallo y dos regiones independientes por dominio, los pods</tspan></text><text x="470" y="389.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">con servicios fundamentales para reducir el radio del impacto y la asignación de ciudades a pods. No se sabe cuántos pods</tspan></text><text x="470" y="406.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">hay ni cómo se asignan hoy; es la foto de ese año.</tspan></text><text x="470" y="443.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
