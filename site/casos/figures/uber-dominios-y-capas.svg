<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 536" width="940" height="536" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">DOMA: dominios, capas y puertas de entrada para domar la complejidad de miles de microservicios</title><desc id="d">Diagrama por capas del modelo DOMA: en la capa superior las experiencias concretas afectan a pocos servicios, en la inferior el negocio general (cuentas, viajes) afecta a muchos; cada dominio es un conjunto de microservicios con una puerta de entrada; las flechas solo bajan: una capa no depende de la de arriba.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="536" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">DOMA: dominios, capas y puertas de entrada para domar la complejidad de miles de microservicios</tspan></text><rect x="10" y="52" width="920" height="100" rx="16" fill="#dff1ee" fill-opacity="0.45" stroke="#087f8c" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#0b3f45"><tspan x="24" dy="0">Capa alta: experiencias concretas (afectan a pocos servicios)</tspan></text><rect x="30" y="90" width="270" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="165" y="110.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">Función de la app móvil para quien</tspan></text><text x="165" y="126.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">pide</tspan></text><rect x="320" y="90" width="270" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="455" y="110.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455" dy="0">Función de la app para quien</tspan></text><text x="455" y="126.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455" dy="0">conduce</tspan></text><rect x="610" y="90" width="300" height="50" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="760" y="110.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="760" dy="0">Cada dominio expone una puerta de</tspan></text><text x="760" y="126.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="760" dy="0">entrada</tspan></text><rect x="10" y="172" width="920" height="100" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="194" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="24" dy="0">Capa media: dominios compartidos entre productos</tspan></text><rect x="30" y="210" width="270" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="165" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">Dominio con su puerta de entrada</tspan></text><rect x="320" y="210" width="270" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="455" y="238.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455" dy="0">Dominio con su puerta de entrada</tspan></text><rect x="610" y="210" width="300" height="50" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="760" y="230.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">Puntos de extensión para la lógica de</tspan></text><text x="760" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="760" dy="0">otro equipo</tspan></text><rect x="10" y="292" width="920" height="100" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="314" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="24" dy="0">Capa baja: negocio general (afecta a muchos servicios)</tspan></text><rect x="30" y="330" width="270" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="165" y="358.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="165" dy="0">Gestión de cuentas</tspan></text><rect x="320" y="330" width="270" height="50" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="455" y="358.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455" dy="0">Viajes del mercado</tspan></text><rect x="610" y="330" width="300" height="50" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="760" y="350.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">Una falla aquí tiene el mayor radio de</tspan></text><text x="760" y="366.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="760" dy="0">impacto</tspan></text><polyline points="520,140 520,172" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="520,260 520,292" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="410" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="434.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El artículo de 2020 define dominios (colecciones de microservicios), capas (qué puede depender de qué), puertas de entrada</tspan></text><text x="470" y="451.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(un único punto de entrada por dominio) y extensiones para lógica de otro equipo, y dice que hacia arriba los dominios</tspan></text><text x="470" y="468.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">afectan a menos servicios. Los nombres de los dominios intermedios y su número no se publican en esa fuente; la figura los</tspan></text><text x="470" y="484.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">deja genéricos.</tspan></text><text x="470" y="522.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
