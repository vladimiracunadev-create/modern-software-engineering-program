<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 535" width="940" height="535" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware y software documentados de Uber, por capa</title><desc id="d">Diagrama de cuatro capas: datos con Postgres, MySQL y Schemaless, Cassandra, Redis y Spanner; servicios con Python, Node.js, Go y Java; infraestructura de coordinación con Ringpop, Cadence y H3 en C; y centros de datos compartidos o arrendados más la nube de Google para Spanner; hardware concreto no publicado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="535" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware y software documentados de Uber, por capa</tspan></text><rect x="10" y="56" width="190" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="90.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Datos</tspan></text><rect x="212" y="56" width="718" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="571" y="90.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">Postgres (monolito), MySQL con Schemaless, Cassandra y Redis (2014), Spanner (2021); Protobuf</tspan></text><rect x="10" y="130" width="190" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="164.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Servicios</tspan></text><rect x="212" y="130" width="718" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="571" y="156.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">Python (monolito), Node.js (Ringpop), Go (Cadence), Java (marco de estados de la plataforma de</tspan></text><text x="571" y="172.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">cumplimiento)</tspan></text><rect x="10" y="204" width="190" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="238.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Coordinación y espacio</tspan></text><rect x="212" y="204" width="718" height="62" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="571" y="230.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="571" dy="0">Ringpop (SWIM y hashing consistente), Cadence (orquestación), H3 (rejilla hexagonal en C con</tspan></text><text x="571" y="246.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="571" dy="0">enlaces a Java y JavaScript)</tspan></text><rect x="10" y="278" width="190" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="312.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Infraestructura</tspan></text><rect x="212" y="278" width="718" height="62" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="571" y="304.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">Centros de datos en coubicación (10-K de 2025) y, para Spanner, la nube de Google (artículo de</tspan></text><text x="571" y="320.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="571" dy="0">2021)</tspan></text><rect x="10" y="352" width="190" height="62" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="105" y="386.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="105" dy="0">Hardware</tspan></text><rect x="212" y="352" width="718" height="62" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="571" y="378.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="571" dy="0">No se sabe: servidores, red, almacenamiento y aceleradores no se publican en las fuentes</tspan></text><text x="571" y="394.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="571" dy="0">consultadas</tspan></text><rect x="10" y="426" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="450.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en los artículos de ingeniería de 2016, 2018, 2019, 2020 y 2021 y en el 10-K de 2025 (coubicación y oficinas).</tspan></text><text x="470" y="467.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los lenguajes citados son los de componentes concretos; no se sabe cuáles dominan hoy. El 10-K reconoce que depende de</tspan></text><text x="470" y="484.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">centros de datos en coubicación, lo que contrasta con la elección de Spanner en la nube de Google para una parte.</tspan></text><text x="470" y="521.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
