<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Del prototipo de 2009 a una empresa cotizada con 171 millones de consumidores al mes</title><desc id="d">Línea de tiempo con dos carriles: en negocio, el prototipo va de 2009 a mayo de 2010, la empresa es privada hasta la salida a bolsa de mayo de 2019 y cotiza después; en arquitectura, el monolito inicial en Python da paso a microservicios hacia 2012-2013 y desde 2018 se organizan por dominios. Hitos: lanzamiento en San Francisco el 31 de mayo de 2010, plataforma de cumplimiento de 2014 y salida a bolsa en 2019.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="380" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Del prototipo de 2009 a una empresa cotizada con 171 millones de consumidores al mes</tspan></text><line x1="144" y1="83" x2="144" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="144" y1="199" x2="144" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="144" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="144" dy="0">2009</tspan></text><line x1="279.529" y1="83" x2="279.529" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="279.529" y1="199" x2="279.529" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="279.529" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="279.529" dy="0">2012</tspan></text><line x1="415.059" y1="83" x2="415.059" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="415.059" y1="199" x2="415.059" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="415.059" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="415.059" dy="0">2015</tspan></text><line x1="550.588" y1="83" x2="550.588" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="550.588" y1="199" x2="550.588" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="550.588" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="550.588" dy="0">2018</tspan></text><line x1="686.118" y1="83" x2="686.118" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="686.118" y1="199" x2="686.118" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="686.118" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="686.118" dy="0">2021</tspan></text><line x1="821.647" y1="83" x2="821.647" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="821.647" y1="199" x2="821.647" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="821.647" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="821.647" dy="0">2024</tspan></text><line x1="912" y1="83" x2="912" y2="199" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="199" x2="912" y2="204" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="220" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2026</tspan></text><line x1="144" y1="199" x2="912" y2="199" stroke="#5b7280" stroke-width="1.6"/><text x="134" y="116.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">Negocio</tspan></text><text x="134" y="174.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="134" dy="0">Arquitectura</tspan></text><line x1="189.176" y1="75" x2="189.176" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="189.176" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="189.176" dy="0">Lanzamiento SF</tspan></text><line x1="369.882" y1="75" x2="369.882" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="369.882" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="369.882" dy="0">Fulfillment v1</tspan></text><line x1="595.765" y1="75" x2="595.765" y2="199" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="595.765" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="595.765" dy="0">IPO</tspan></text><rect x="144" y="92" width="45.1765" height="40" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><rect x="189.176" y="92" width="406.588" height="40" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="392.471" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="392.471" dy="0">Empresa privada en hipercrecimiento</tspan></text><rect x="595.765" y="92" width="316.235" height="40" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="753.882" y="116.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="753.882" dy="0">Cotizada (NYSE)</tspan></text><line x1="14" y1="141" x2="912" y2="141" stroke="#d5dde1" stroke-width="1"/><rect x="189.176" y="150" width="135.529" height="40" rx="4" fill="#946512" stroke="#ffffff" stroke-width="1"/><text x="256.941" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="256.941" dy="0">Monolito Python</tspan></text><rect x="324.706" y="150" width="225.882" height="40" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="437.647" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="437.647" dy="0">Microservicios</tspan></text><rect x="550.588" y="150" width="361.412" height="40" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><text x="731.294" y="174.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="731.294" dy="0">Dominios (DOMA)</tspan></text><text x="528" y="243" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="528" dy="0">Año</tspan></text><rect x="10" y="257" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las fronteras del carril de arquitectura son aproximadas: Uber dice que adoptó microservicios «alrededor de 2012-2013», que</tspan></text><text x="470" y="298.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la arquitectura de fulfillment es de 2014 y que DOMA se formalizó en 2020 con trabajo previo; no publica fechas exactas de</tspan></text><text x="470" y="315.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">corte. La barra corta gris de 2009 es el prototipo, anterior al lanzamiento.</tspan></text><text x="470" y="362.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
