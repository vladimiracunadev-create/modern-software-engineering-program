<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 465" width="940" height="465" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién soporta el riesgo del precio: precio fijo por adelantado y pago por tiempo y distancia</title><desc id="d">Diagrama de dos flujos: quien pide ve un precio fijo por adelantado antes de aceptar; a quien conduce se le paga por el tiempo y la distancia reales; Uber reconoce la diferencia, positiva o negativa, y por eso soporta el riesgo cuando el viaje dura más de lo previsto.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="465" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién soporta el riesgo del precio: precio fijo por adelantado y pago por tiempo y distancia</tspan></text><rect x="10" y="70" width="200" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="105.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">Quien pide: ve y acepta</tspan></text><text x="110" y="121.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="110" dy="0">un precio fijo</tspan></text><rect x="370" y="70" width="200" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="105.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Uber: recibe el pago y</tspan></text><text x="470" y="121.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">cubre la diferencia</tspan></text><rect x="730" y="70" width="200" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="830" y="97" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">Quien conduce: cobra</tspan></text><text x="830" y="113.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">tiempo y distancia</tspan></text><text x="830" y="130.28" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="830" dy="0">reales</tspan></text><polyline points="210,110 370,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="290" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="290" dy="0">precio fijo</tspan></text><polyline points="570,110 730,110" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="650" y="98" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="650" dy="0">pago real</tspan></text><rect x="10" y="180" width="290" height="72" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="155" y="211.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="155" dy="0">Si el viaje es más corto de lo</tspan></text><text x="155" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="155" dy="0">previsto, Uber retiene más</tspan></text><rect x="325" y="180" width="290" height="72" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="211.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Si coincide, Uber retiene el margen</tspan></text><text x="470" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">planeado</tspan></text><rect x="640" y="180" width="290" height="72" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="785" y="211.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">Si el viaje se alarga, Uber retiene</tspan></text><text x="785" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="785" dy="0">menos o pierde</tspan></text><rect x="10" y="276" width="920" height="60" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="470" y="301.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">Efecto de diseño: el pasajero conoce el coste antes de pedir, y el riesgo de tráfico, desvíos y demora pasa del usuario a</tspan></text><text x="470" y="317.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="470" dy="0">la plataforma, que lo gestiona con su modelo de precios</tspan></text><rect x="10" y="356" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="380.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el 10-K de 2025: en los mercados donde Uber gana la diferencia entre lo que paga el usuario y lo que gana el</tspan></text><text x="470" y="397.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">conductor, el usuario recibe un precio fijo por adelantado y al conductor se le paga según el tiempo y la distancia reales.</tspan></text><text x="470" y="414.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los tres escenarios y su lectura económica son análisis propio.</tspan></text><text x="470" y="451.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
