<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 541" width="940" height="541" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Qué pasa cuando cae cada componente de Uber: de lo pequeño a lo grande</title><desc id="d">Seis filas de falla creciente: un nodo del anillo, un flujo largo a medias, una escritura concurrente, un pod de ciudades, una región y los centros de datos en coubicación completos; efecto y mecanismo con rótulo de documentado o no se sabe.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="541" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Qué pasa cuando cae cada componente de Uber: de lo pequeño a lo grande</tspan></text><rect x="10" y="56" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="85.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un nodo del anillo de Ringpop</tspan></text><rect x="330" y="56" width="600" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="77.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">El protocolo de pertenencia lo detecta; sus claves pasan a otro nodo</tspan></text><text x="630" y="93.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">(documentado)</tspan></text><polyline points="290,82 330,82" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="118" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="147.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un flujo largo a medias</tspan></text><rect x="330" y="118" width="600" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="147.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">Cadence registra cada acción y recupera el estado tras reiniciar (documentado)</tspan></text><polyline points="290,144 330,144" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="180" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="209.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Dos escrituras sobre el mismo viaje</tspan></text><rect x="330" y="180" width="600" height="52" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="630" y="209.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="630" dy="0">Antes, el último gana; desde 2021, una transacción (documentado)</tspan></text><polyline points="290,206 330,206" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="242" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="271.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Un pod de ciudades</tspan></text><rect x="330" y="242" width="600" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="271.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">El impacto queda limitado a las ciudades asignadas (documentado)</tspan></text><polyline points="290,268 330,268" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="304" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="333.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Una región</tspan></text><rect x="330" y="304" width="600" height="52" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="630" y="325.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">Dos dominios de fallo con dos regiones independientes cada uno (documentado,</tspan></text><text x="630" y="341.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="630" dy="0">2021)</tspan></text><polyline points="290,330 330,330" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="366" width="280" height="52" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="150" y="395.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="150" dy="0">Los centros de datos en coubicación</tspan></text><rect x="330" y="366" width="600" height="52" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="630" y="395.64" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="630" dy="0">El 10-K dice que sus usuarios podrían sufrir caída; no hay plan público</tspan></text><polyline points="290,392 330,392" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="432" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="456.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en los artículos de Ringpop (2016), Cadence (2019) y de la plataforma de cumplimiento (2021) y en el 10-K de</tspan></text><text x="470" y="473.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2025, que reconoce que ha sufrido caídas por limitaciones de software y que depende de centros de datos en coubicación. No</tspan></text><text x="470" y="490.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">se publican objetivos de recuperación ni pruebas de caos.</tspan></text><text x="470" y="527.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
