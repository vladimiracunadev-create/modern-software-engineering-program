<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 475" width="940" height="475" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 3, componente: la rejilla hexagonal H3 que mide oferta y demanda por celda</title><desc id="d">Siete hexágonos: una celda central y sus seis vecinas, todas a la misma distancia del centro; en cada celda se cuentan solicitudes y conductores disponibles, y la comparación indica dónde hay más demanda que oferta; a la derecha, las resoluciones, cada una con celdas de un séptimo del área de la anterior.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="475" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 3, componente: la rejilla hexagonal H3 que mide oferta y demanda por celda</tspan></text><polygon points="269.8,167.0 269.8,213.0 230.0,236.0 190.2,213.0 190.2,167.0 230.0,144.0" fill="#fbe4de" stroke="#c0432f" stroke-width="1.8"/><text x="230" y="188" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="230" dy="0">8 solic.</tspan></text><text x="230" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="230" dy="0">3 cond.</tspan></text><polygon points="349.5,167.0 349.5,213.0 309.7,236.0 269.8,213.0 269.8,167.0 309.7,144.0" fill="#dff1ee" stroke="#087f8c" stroke-width="1.8"/><text x="309.674" y="188" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="309.674" dy="0">2 solic.</tspan></text><text x="309.674" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="309.674" dy="0">4 cond.</tspan></text><polygon points="309.7,236.0 309.7,282.0 269.8,305.0 230.0,282.0 230.0,236.0 269.8,213.0" fill="#fbe4de" stroke="#c0432f" stroke-width="1.8"/><text x="269.837" y="257" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="269.837" dy="0">5 solic.</tspan></text><text x="269.837" y="273" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="269.837" dy="0">2 cond.</tspan></text><polygon points="230.0,236.0 230.0,282.0 190.2,305.0 150.3,282.0 150.3,236.0 190.2,213.0" fill="#dff1ee" stroke="#087f8c" stroke-width="1.8"/><text x="190.163" y="257" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="190.163" dy="0">1 solic.</tspan></text><text x="190.163" y="273" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="190.163" dy="0">3 cond.</tspan></text><polygon points="190.2,167.0 190.2,213.0 150.3,236.0 110.5,213.0 110.5,167.0 150.3,144.0" fill="#ffffff" stroke="#5b7280" stroke-width="1.8"/><text x="150.326" y="188" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="150.326" dy="0">3 solic.</tspan></text><text x="150.326" y="204" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="150.326" dy="0">3 cond.</tspan></text><polygon points="230.0,98.0 230.0,144.0 190.2,167.0 150.3,144.0 150.3,98.0 190.2,75.0" fill="#ffffff" stroke="#5b7280" stroke-width="1.8"/><text x="190.163" y="119" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="190.163" dy="0">2 solic.</tspan></text><text x="190.163" y="135" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="190.163" dy="0">2 cond.</tspan></text><polygon points="309.7,98.0 309.7,144.0 269.8,167.0 230.0,144.0 230.0,98.0 269.8,75.0" fill="#fbe4de" stroke="#c0432f" stroke-width="1.8"/><text x="269.837" y="119" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="269.837" dy="0">4 solic.</tspan></text><text x="269.837" y="135" font-size="13" text-anchor="middle" font-weight="700" fill="#5c1f14"><tspan x="269.837" dy="0">1 cond.</tspan></text><text x="230" y="345" font-size="13" text-anchor="middle" font-weight="400" fill="#32505f"><tspan x="230" dy="0">Ilustrativo: números inventados para mostrar el mecanismo</tspan></text><rect x="440" y="56" width="490" height="64" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="685" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="685" dy="0">Cada celda cuenta solicitudes y conductores disponibles; donde</tspan></text><text x="685" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="685" dy="0">sobran solicitudes hay precio dinámico o se ofrece a conductores</tspan></text><text x="685" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="685" dy="0">cercanos</tspan></text><rect x="440" y="130" width="490" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="685" y="153.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685" dy="0">Una sola distancia del centro a sus seis vecinas simplifica el</tspan></text><text x="685" y="169.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685" dy="0">análisis y el suavizado</tspan></text><rect x="440" y="200" width="490" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="685" y="223.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685" dy="0">16 resoluciones (0 a 15); cada una tiene celdas de un séptimo</tspan></text><text x="685" y="239.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685" dy="0">del área de la anterior</tspan></text><rect x="440" y="270" width="490" height="56" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="685" y="293.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685" dy="0">Un vecindario es un conjunto de celdas; pertenecer a él es una</tspan></text><text x="685" y="309.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="685" dy="0">consulta de conjunto</tspan></text><rect x="10" y="366" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="390.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el artículo de 2018 sobre H3: la rejilla hexagonal jerárquica, sus 16 resoluciones, el uso para precios</tspan></text><text x="470" y="407.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dinámicos y despacho, y la ventaja de la distancia uniforme. Los números de las celdas son un ejemplo inventado; Uber no</tspan></text><text x="470" y="424.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">publica cómo calcula el precio.</tspan></text><text x="470" y="461.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
