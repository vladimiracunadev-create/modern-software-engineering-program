<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 550" width="940" height="550" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Reservas brutas e ingresos de Uber, 2023 y 2024 (miles de millones de USD)</title><desc id="d">Barras agrupadas: las reservas brutas pasan de 137,9 a 162,8 miles de millones de dólares y los ingresos de 37,3 a 44,0 entre 2023 y 2024; los ingresos equivalen a algo más de una cuarta parte de las reservas, de modo que la plataforma retiene una parte pequeña del dinero que mueve.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="550" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Reservas brutas e ingresos de Uber, 2023 y 2024 (miles de millones de USD)</tspan></text><rect x="16" y="45" width="12" height="12" rx="2" fill="#6b7c86"/><text x="36" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="36" dy="0">2023</tspan></text><rect x="94.16" y="45" width="12" height="12" rx="2" fill="#087f8c"/><text x="114.16" y="56" font-size="13" text-anchor="start" font-weight="400" fill="#142231"><tspan x="114.16" dy="0">2024</tspan></text><line x1="78.62" y1="375" x2="920" y2="375" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="375" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="379.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">0</tspan></text><line x1="78.62" y1="305" x2="920" y2="305" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="305" x2="78.62" y2="305" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="309.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">50</tspan></text><line x1="78.62" y1="235" x2="920" y2="235" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="235" x2="78.62" y2="235" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="239.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">100</tspan></text><line x1="78.62" y1="165" x2="920" y2="165" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="165" x2="78.62" y2="165" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="169.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">150</tspan></text><line x1="78.62" y1="95" x2="920" y2="95" stroke="#d5dde1" stroke-width="1"/><line x1="73.62" y1="95" x2="78.62" y2="95" stroke="#5b7280" stroke-width="1.4"/><text x="69.62" y="99.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="69.62" dy="0">200</tspan></text><line x1="78.62" y1="95" x2="78.62" y2="375" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="235" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 235)">Miles de millones de USD</text><rect x="120.689" y="181.989" width="166.276" height="193.011" rx="3" fill="#6b7c86"/><text x="203.827" y="175.989" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="203.827" dy="0">137,9</tspan></text><rect x="290.965" y="147.118" width="166.276" height="227.882" rx="3" fill="#087f8c"/><text x="374.103" y="141.118" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="374.103" dy="0">162,8</tspan></text><text x="288.965" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="288.965" dy="0">Reservas brutas (Gross Bookings)</tspan></text><rect x="541.379" y="322.807" width="166.276" height="52.1934" rx="3" fill="#6b7c86"/><text x="624.517" y="316.807" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="624.517" dy="0">37,3</tspan></text><rect x="711.655" y="313.431" width="166.276" height="61.5692" rx="3" fill="#087f8c"/><text x="794.793" y="307.431" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="794.793" dy="0">44,0</tspan></text><text x="709.655" y="396" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="709.655" dy="0">Ingresos (Revenue)</tspan></text><rect x="10" y="427" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="451.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Los ingresos son 27,0 % de las reservas brutas en 2024 y 27,0 % en 2023 (cálculo propio sobre las dos cifras): lo que mueve</tspan></text><text x="470" y="468.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">la plataforma es mucho mayor que lo que reconoce como ingreso, porque una parte va a quien presta el servicio. «Reservas</tspan></text><text x="470" y="485.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">brutas» es una métrica propia de Uber, no un ingreso contable.</tspan></text><text x="470" y="532.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Uber, «Uber Announces Results for Fourth Quarter and Full Year 2024», 5 de febrero de 2025.</tspan></text></svg>
