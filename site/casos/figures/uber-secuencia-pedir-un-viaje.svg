<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 617" width="940" height="617" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 4, secuencia: pedir un viaje y completarlo</title><desc id="d">Diagrama de secuencia entre quien pide, la plataforma de cumplimiento, el servicio de ubicación, quien conduce y el almacén: se crea el Viaje, se buscan Ofertas cercanas con la rejilla, se ofrece el trabajo, se acepta, se cambian los estados y se cierra el viaje.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="617" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 4, secuencia: pedir un viaje y completarlo</tspan></text><rect x="26" y="58" width="168" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="110" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="110" dy="0">Quien pide</tspan></text><rect x="206" y="58" width="168" height="46" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="290" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="290" dy="0">Cumplimiento</tspan></text><text x="290" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="290" dy="0">(demanda)</tspan></text><rect x="386" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Ubicación y oferta</tspan></text><rect x="566" y="58" width="168" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="650" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="650" dy="0">Quien conduce</tspan></text><rect x="746" y="58" width="168" height="46" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="830" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="830" dy="0">Almacén</tspan></text><line x1="110" y1="104" x2="110" y2="494" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="290" y1="104" x2="290" y2="494" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="470" y1="104" x2="470" y2="494" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="650" y1="104" x2="650" y2="494" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="830" y1="104" x2="830" y2="494" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="113,150 287,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="200" y="126" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="200" dy="0">1. Solicita viaje con origen y</tspan><tspan x="200" dy="16.64">destino</tspan></text><polyline points="293,194 827,194" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="560" dy="0">2. Crea la entidad Viaje</tspan></text><polyline points="293,238 467,238" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="380" y="214" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="380" dy="0">3. Busca ofertas cercanas</tspan><tspan x="380" dy="16.64">(inferido)</tspan></text><polyline points="473,282 647,282" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="560" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="560" dy="0">4. Ofrece el trabajo</tspan></text><polyline points="647,326 293,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">5. Acepta: Viaje y Oferta quedan unidos</tspan></text><polyline points="293,370 827,370" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="560" dy="0">6. Cambia estados en una transacción</tspan></text><polyline points="647,414 113,414" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="380" y="406" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="380" dy="0">7. Recoge y lleva a destino</tspan></text><polyline points="293,458 827,458" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="560" y="450" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="560" dy="0">8. Cierra el viaje y registra el cobro</tspan></text><rect x="10" y="508" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="532.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el artículo de 2021: las entidades Viaje y Oferta, los estados jerárquicos y que el almacén transaccional</tspan></text><text x="470" y="549.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">sustituyó al modelo de mejor esfuerzo. Inferido: el orden exacto de la búsqueda y de la oferta, y el momento del cobro.</tspan></text><text x="470" y="566.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Uber no publica el algoritmo de emparejamiento ni el cálculo del precio.</tspan></text><text x="470" y="603.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de Uber citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
