<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 486" width="940" height="486" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Dónde llega el cifrado de extremo a extremo y dónde no (definición oficial)</title><desc id="d">Diagrama de tres escenarios de conversación: entre dos personas todo se cifra de extremo a extremo; con una empresa que usa la aplicación Business en su dispositivo también; con una empresa que usa la Cloud API de Meta, los mensajes usan el protocolo Signal pero WhatsApp no los considera de extremo a extremo porque terminan en un servidor de Meta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="486" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Dónde llega el cifrado de extremo a extremo y dónde no (definición oficial)</tspan></text><rect x="10" y="60" width="170" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="103.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Persona a persona</tspan></text><rect x="196" y="60" width="150" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="271" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="271" dy="0">Teléfono A</tspan></text><rect x="372" y="60" width="190" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467" y="95.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467" dy="0">Servidor: solo texto</tspan></text><text x="467" y="111.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467" dy="0">cifrado</tspan></text><rect x="588" y="60" width="150" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="663" y="103.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="663" dy="0">Teléfono B</tspan></text><rect x="756" y="60" width="174" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="843" y="103.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="843" dy="0">Extremo a extremo</tspan></text><polyline points="346,100 372,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="562,100 588,100" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="738,100 756,100" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="158" width="170" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="193.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Persona a empresa</tspan></text><text x="95" y="209.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">pequeña</tspan></text><rect x="196" y="158" width="150" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="271" y="201.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="271" dy="0">Teléfono</tspan></text><rect x="372" y="158" width="190" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="467" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467" dy="0">Servidor: solo texto</tspan></text><text x="467" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="467" dy="0">cifrado</tspan></text><rect x="588" y="158" width="150" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="663" y="193.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="663" dy="0">Dispositivo de la</tspan></text><text x="663" y="209.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="663" dy="0">empresa</tspan></text><rect x="756" y="158" width="174" height="80" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="843" y="201.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="843" dy="0">Extremo a extremo</tspan></text><polyline points="346,198 372,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="562,198 588,198" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="738,198 756,198" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="256" width="170" height="80" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="95" y="291.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">Persona a empresa</tspan></text><text x="95" y="307.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="95" dy="0">con Cloud API</tspan></text><rect x="196" y="256" width="150" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="271" y="299.64" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="271" dy="0">Teléfono</tspan></text><rect x="372" y="256" width="190" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="467" y="291.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="467" dy="0">Servidor y Cloud API de</tspan></text><text x="467" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="467" dy="0">Meta</tspan></text><rect x="588" y="256" width="150" height="80" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="663" y="291.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="663" dy="0">Sistemas de la</tspan></text><text x="663" y="307.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="663" dy="0">empresa</tspan></text><rect x="756" y="256" width="174" height="80" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="843" y="283" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="843" dy="0">No es extremo a</tspan></text><text x="843" y="299.64" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="843" dy="0">extremo según</tspan></text><text x="843" y="316.28" font-size="13" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="843" dy="0">WhatsApp</tspan></text><polyline points="346,296 372,296" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="562,296 588,296" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="738,296 756,296" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="10" y="360" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="384.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el libro blanco: todas las conversaciones usan el protocolo Signal, pero WhatsApp no considera de extremo a</tspan></text><text x="470" y="401.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">extremo la comunicación con empresas que usan la Cloud API, porque no llega a un punto final controlado por la empresa; el</tspan></text><text x="470" y="418.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">chat lo indica con un mensaje del sistema. No cubre los metadatos (con quién y cuándo), cuyo tratamiento detallado no es</tspan></text><text x="470" y="434.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">público.</tspan></text><text x="470" y="472.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
