<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo se probó la capacidad en 2012: tres clases de carga y sus límites</title><desc id="d">Diagrama de tres clases de carga usadas para medir el clúster: carga sintética, útil para subsistemas con interfaz simple y de poco valor para sistemas de cara al usuario; carga duplicada, extremadamente útil donde los efectos se pueden contener; y carga desviada desde producción, que añade tráfico real a un servidor pero puede provocar problemas con DNS, tiempos de vida y fallos del núcleo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo se probó la capacidad en 2012: tres clases de carga y sus límites</tspan></text><rect x="10" y="60" width="288" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="154" y="85.92" font-size="14" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="154" dy="0">Sintética</tspan></text><rect x="10" y="116" width="288" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="154" y="146.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">Qué es: tráfico generado por un</tspan></text><text x="154" y="162.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">programa</tspan></text><rect x="10" y="198" width="288" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="154" y="228.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">Sirve: para subsistemas con interfaz</tspan></text><text x="154" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="154" dy="0">simple</tspan></text><rect x="10" y="280" width="288" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="154" y="310.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="154" dy="0">Límite: poco valor en un sistema de</tspan></text><text x="154" y="326.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="154" dy="0">cara al usuario</tspan></text><polyline points="154,104 154,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="324" y="60" width="288" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="468" y="85.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="468" dy="0">Duplicada (tee)</tspan></text><rect x="324" y="116" width="288" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="468" y="146.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="468" dy="0">Qué es: se copia el tráfico real a</tspan></text><text x="468" y="162.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="468" dy="0">un servidor de prueba</tspan></text><rect x="324" y="198" width="288" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="468" y="228.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="468" dy="0">Sirve: extremadamente útil para</tspan></text><text x="468" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="468" dy="0">afinar</tspan></text><rect x="324" y="280" width="288" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="468" y="310.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="468" dy="0">Límite: solo donde los efectos</tspan></text><text x="468" y="326.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="468" dy="0">secundarios se pueden contener</tspan></text><polyline points="468,104 468,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="638" y="60" width="288" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="782" y="85.92" font-size="14" text-anchor="middle" font-weight="700" fill="#4a3209"><tspan x="782" dy="0">Desviada de producción</tspan></text><rect x="638" y="116" width="288" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="146.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Qué es: se suma tráfico real a un</tspan></text><text x="782" y="162.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">servidor</tspan></text><rect x="638" y="198" width="288" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="782" y="228.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">Sirve: lleva el servidor a</tspan></text><text x="782" y="244.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782" dy="0">conexiones altas</tspan></text><rect x="638" y="280" width="288" height="70" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="782" y="310.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="782" dy="0">Límite: DNS con TTL, reenvío IPFW y</tspan></text><text x="782" y="326.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="782" dy="0">algunos fallos del núcleo</tspan></text><polyline points="782,104 782,116" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="368" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="392.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en la charla de Rick Reed (2012): las tres clases de carga y su valoración. La carga desviada llevó el servidor</tspan></text><text x="470" y="409.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">a 2,8 millones de conexiones en un intento de récord no intencionado en febrero. No se sabe cómo se prueba hoy; es una foto</tspan></text><text x="470" y="426.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de 2012, no una práctica vigente.</tspan></text><text x="470" y="463.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
