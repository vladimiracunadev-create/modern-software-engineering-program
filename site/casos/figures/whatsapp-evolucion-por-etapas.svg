<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 477" width="940" height="477" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo evolucionó el producto y la arquitectura: tres etapas</title><desc id="d">Tres columnas: de 2009 a 2013 una aplicación de pago pequeña con servidores Erlang sobre FreeBSD; de 2014 a 2020 dentro de Facebook, cifrado de extremo a extremo por defecto en 2016 y fin de la cuota en 2016; desde 2021 varios dispositivos, copias cifradas y una API para empresas.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="477" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cómo evolucionó el producto y la arquitectura: tres etapas</tspan></text><rect x="10" y="56" width="292" height="44" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="156" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#2b3a44"><tspan x="156" dy="0">2009-2013: app de pago pequeña</tspan></text><rect x="10" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Una cuota anual tras el primer año y</tspan></text><text x="156" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">sin publicidad (2012)</tspan></text><rect x="10" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">Servidores Erlang sobre FreeBSD con</tspan></text><text x="156" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">millones de conexiones (2012)</tspan></text><rect x="10" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="156" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">El teléfono es la fuente de verdad</tspan></text><text x="156" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="156" dy="0">del historial</tspan></text><rect x="324" y="56" width="292" height="44" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">2014-2020: dentro de Facebook</tspan></text><rect x="324" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Compra anunciada en febrero de 2014 y</tspan></text><text x="470" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">cerrada en octubre</tspan></text><rect x="324" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Cifrado de extremo a extremo por</tspan></text><text x="470" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">defecto en abril de 2016</tspan></text><rect x="324" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="470" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">Sin cuota desde enero de 2016;</tspan></text><text x="470" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">negocios como vía de ingreso</tspan></text><rect x="638" y="56" width="292" height="44" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="784" y="81.92" font-size="14" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="784" dy="0">2021 en adelante: plataforma</tspan></text><rect x="638" y="112" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="142.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Varios dispositivos con claves por</tspan></text><text x="784" y="158.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">dispositivo (2021)</tspan></text><rect x="638" y="194" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="224.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Copias de seguridad cifradas con</tspan></text><text x="784" y="240.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">bóveda de claves (2021)</tspan></text><rect x="638" y="276" width="292" height="70" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="784" y="306.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">Cloud API y pagos de mensajería de</tspan></text><text x="784" y="322.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="784" dy="0">empresas</tspan></text><polyline points="302,78 324,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="616,78 638,78" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="368" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="392.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Las etapas son una periodización del curso sobre hechos citados (blog de 2012, blog de 2016, comunicado de 2014, artículos</tspan></text><text x="470" y="409.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de ingeniería de 2021). El año de inicio de 2009 se apoya solo en la frase «hace tres años» de un texto de 2012. No se sabe</tspan></text><text x="470" y="426.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">cuándo ni cómo cambió la infraestructura interna tras la compra.</tspan></text><text x="470" y="463.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
