<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 441" width="940" height="441" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Hardware y software documentados de WhatsApp, por época</title><desc id="d">Diagrama de dos épocas: en 2012, un servidor de doble procesador Westmere con 24 CPU lógicas, 100 GB de RAM, SSD y dos tarjetas de red, con FreeBSD, Erlang y su base Mnesia; en 2021, un servicio de conexiones llamado ChatD, protocolo Signal y canal Noise Pipes, y una bóveda de claves con módulos de seguridad de hardware repartida entre centros de datos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="441" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Hardware y software documentados de WhatsApp, por época</tspan></text><rect x="10" y="52" width="450" height="260" rx="16" fill="#f7ebc8" fill-opacity="0.45" stroke="#a8761a" stroke-width="1.6" stroke-dasharray="8 5"/><text x="24" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#4a3209"><tspan x="24" dy="0">2012: servidor de conexiones (charla de Rick Reed)</tspan></text><rect x="26" y="90" width="418" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="235" y="107.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235" dy="0">Hardware: 2 procesadores Westmere de 6 núcleos (24 CPU</tspan></text><text x="235" y="123.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="235" dy="0">lógicas), 100 GB de RAM, SSD</tspan></text><rect x="26" y="142" width="418" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="159.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Red: dos tarjetas, una hacia usuarios y otra hacia el</tspan></text><text x="235" y="175.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">interior</tspan></text><rect x="26" y="194" width="418" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="211.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Sistema operativo: FreeBSD 8.3 con parches y ajustes</tspan></text><text x="235" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">de red</tspan></text><rect x="26" y="246" width="418" height="52" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="235" y="267.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">Lenguaje y plataforma: Erlang OTP R14B03; Mnesia, ETS</tspan></text><text x="235" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="235" dy="0">y pg2 particionados</tspan></text><rect x="480" y="52" width="450" height="260" rx="16" fill="#102a43" fill-opacity="0.45" stroke="#102a43" stroke-width="1.6" stroke-dasharray="8 5"/><text x="494" y="74" font-size="14" text-anchor="start" font-weight="700" fill="#ffffff"><tspan x="494" dy="0">2021: servicios de claves y conexiones (artículos de Meta)</tspan></text><rect x="496" y="90" width="418" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="107.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">ChatD: servicio de conexiones y autenticación de</tspan></text><text x="705" y="123.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">clientes</tspan></text><rect x="496" y="142" width="418" height="44" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="705" y="159.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">Protocolo Signal y canal Noise Pipes con Curve25519 y</tspan></text><text x="705" y="175.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="705" dy="0">AES-GCM</tspan></text><rect x="496" y="194" width="418" height="44" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="705" y="211.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">Bóveda de claves de respaldo: módulos de seguridad de</tspan></text><text x="705" y="227.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="705" dy="0">hardware (HSM)</tspan></text><rect x="496" y="246" width="418" height="52" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6" stroke-dasharray="6 4"/><text x="705" y="267.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="705" dy="0">Distribución geográfica en varios centros de datos;</tspan></text><text x="705" y="283.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="705" dy="0">hardware y lenguajes de ChatD: no se sabe</tspan></text><rect x="10" y="332" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="356.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: la configuración de 2012 (charla de marzo de 2012 y blog de enero de 2012), ChatD y la bóveda (artículo de</tspan></text><text x="470" y="373.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2021) y el canal Noise Pipes (libro blanco). No se sabe el hardware, los lenguajes ni las bases de datos de hoy, ni cuánto</tspan></text><text x="470" y="390.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de la infraestructura es de Meta compartida. Un servicio de 2012 no describe el actual.</tspan></text><text x="470" y="427.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
