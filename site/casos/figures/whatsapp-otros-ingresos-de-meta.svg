<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 482" width="940" height="482" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Otros ingresos de la familia de aplicaciones de Meta, donde cuenta el pago por mensajería de WhatsApp</title><desc id="d">Barras de los otros ingresos de la familia de aplicaciones de Meta: 1 058 millones de dólares en 2023, 1 722 en 2024 y 2 584 en 2025; incluyen el pago por mensajería de WhatsApp, las suscripciones Meta Verified, tarifas de pagos y otras fuentes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="482" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Otros ingresos de la familia de aplicaciones de Meta, donde cuenta el pago por mensajería de WhatsApp</tspan></text><line x1="93.7" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="307" x2="93.7" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="227" x2="920" y2="227" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="227" x2="93.7" y2="227" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="231.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="147" x2="920" y2="147" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="147" x2="93.7" y2="147" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="151.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="67" x2="93.7" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">3 000</tspan></text><line x1="93.7" y1="67" x2="93.7" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">millones de USD</text><rect x="121.243" y="222.36" width="220.347" height="84.64" rx="3" fill="#946512"/><text x="231.417" y="216.36" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.417" dy="0">1 058</tspan></text><text x="231.417" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">2023</tspan></text><rect x="396.677" y="169.24" width="220.347" height="137.76" rx="3" fill="#946512"/><text x="506.85" y="163.24" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">1 722</tspan></text><text x="506.85" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">2024</tspan></text><rect x="672.11" y="100.28" width="220.347" height="206.72" rx="3" fill="#946512"/><text x="782.283" y="94.28" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="782.283" dy="0">2 584</tspan></text><text x="782.283" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">2025</tspan></text><rect x="10" y="359" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Es un techo, no el ingreso de WhatsApp: el 10-K lo describe como pago por mensajería de WhatsApp más suscripciones Meta</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Verified, tarifas de pagos y otras fuentes, y no los separa. Frente a los 200 966 millones de ingresos totales de Meta en</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2025, equivale a 1,3 por ciento. Meta no publica el ingreso de WhatsApp por separado.</tspan></text><text x="470" y="464.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: Meta, Form 10-K de 2025 (SEC). Consulta: 16 de noviembre de 2026.</tspan></text></svg>
