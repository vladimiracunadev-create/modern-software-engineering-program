<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 573" width="940" height="573" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Nivel 4, secuencia: un mensaje con varios dispositivos (reparto en el cliente)</title><desc id="d">Diagrama de secuencia: el emisor consulta la lista de dispositivos del receptor, cifra el mensaje por separado para cada dispositivo con su sesión, envía todas las copias cifradas y el servidor las entrega a cada dispositivo; el mensaje no se guarda en el servidor una vez entregado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="573" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Nivel 4, secuencia: un mensaje con varios dispositivos (reparto en el cliente)</tspan></text><rect x="47.5" y="58" width="170" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="132.5" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="132.5" dy="0">Emisor</tspan></text><rect x="272.5" y="58" width="170" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="357.5" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="357.5" dy="0">Servidor</tspan></text><rect x="497.5" y="58" width="170" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="582.5" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="582.5" dy="0">Teléfono del</tspan></text><text x="582.5" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="582.5" dy="0">receptor</tspan></text><rect x="722.5" y="58" width="170" height="46" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="807.5" y="76.32" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="807.5" dy="0">Escritorio del</tspan></text><text x="807.5" y="92.96" font-size="13" text-anchor="middle" font-weight="700" fill="#0b3f45"><tspan x="807.5" dy="0">receptor</tspan></text><line x1="132.5" y1="104" x2="132.5" y2="450" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="357.5" y1="104" x2="357.5" y2="450" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="582.5" y1="104" x2="582.5" y2="450" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="807.5" y1="104" x2="807.5" y2="450" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="135.5,150 354.5,150" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="126" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="245" dy="0">1. Pide la lista de dispositivos del</tspan><tspan x="245" dy="16.64">receptor</tspan></text><polyline points="354.5,194 135.5,194" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="186" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="245" dy="0">2. Claves de cada dispositivo</tspan></text><polyline points="132.5,232 178.5,232 178.5,246 136.5,246" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="186.5" y="242" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="186.5" dy="0">3. Cifra una copia por dispositivo</tspan></text><polyline points="135.5,282 354.5,282" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="245" y="274" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="245" dy="0">4. Envía las copias cifradas</tspan></text><polyline points="360.5,326 579.5,326" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="318" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="470" dy="0">5. Copia para el teléfono</tspan></text><polyline points="360.5,370 804.5,370" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="582.5" y="362" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="582.5" dy="0">6. Copia para el escritorio</tspan></text><polyline points="357.5,408 403.5,408 403.5,422 361.5,422" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="411.5" y="418" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="411.5" dy="0">7. No conserva el mensaje entregado</tspan></text><rect x="10" y="464" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="488.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en el artículo de ingeniería de Meta: cada dispositivo tiene su propia clave de identidad, el servidor mantiene</tspan></text><text x="470" y="505.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">el mapa de cuentas a dispositivos, el emisor cifra y transmite una copia por dispositivo («reparto en el cliente») y los</tspan></text><text x="470" y="522.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">mensajes no se guardan en el servidor tras entregarse. El coste: el emisor trabaja N veces para N dispositivos.</tspan></text><text x="470" y="559.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: documentos públicos de WhatsApp y Meta citados en la página del caso. Consulta: 16 de noviembre de 2026.</tspan></text></svg>
