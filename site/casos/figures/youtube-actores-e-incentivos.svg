<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 562" width="940" height="562" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Quién obtiene qué en el ecosistema de YouTube</title><desc id="d">Diagrama de incentivos: los espectadores obtienen vídeo gratis y recomendado; los creadores audiencia y la posibilidad de ganar dinero; los anunciantes atención; los titulares de derechos una forma de reclamar; YouTube y Alphabet ingresos por anuncios y suscripciones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="562" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Quién obtiene qué en el ecosistema de YouTube</tspan></text><rect x="24" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="131" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">Espectador: ve gratis con</tspan></text><text x="131" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">anuncios o paga por</tspan></text><text x="131" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="131" dy="0">quitarlos</tspan></text><rect x="250" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Creador: audiencia y, si</tspan></text><text x="357" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">cumple umbrales, ingresos</tspan></text><rect x="476" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="583" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">Anunciante: alcance en</tspan></text><text x="583" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="583" dy="0">vídeo</tspan></text><rect x="702" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="809" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="809" dy="0">Suscriptor: sin anuncios,</tspan></text><text x="809" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="809" dy="0">música y televisión</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="221.96" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">YouTube: reunir audiencia y venderla con</tspan></text><text x="470" y="239.88" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">anuncios y suscripciones</tspan></text><polyline points="131,125 334.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">gana</tspan></text><polyline points="357,125 424.8,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">gana</tspan></text><polyline points="583,125 515.2,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">paga</tspan></text><polyline points="809,125 605.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">paga</tspan></text><rect x="24" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="131" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">Titular de derechos:</tspan></text><text x="131" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">bloquea, monetiza o sigue</tspan></text><rect x="250" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Alphabet: integra con</tspan></text><text x="357" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">anuncios y nube</tspan></text><rect x="476" y="345" width="214" height="74" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="583" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="583" dy="0">Regulador y familias:</tspan></text><text x="583" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="583" dy="0">menores, desinformación</tspan></text><rect x="702" y="345" width="214" height="74" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="809" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="809" dy="0">Competidor: otras</tspan></text><text x="809" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="809" dy="0">plataformas</tspan></text><polyline points="334.4,259 131,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="131" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="131" dy="0">decide</tspan></text><polyline points="424.8,259 357,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">monetiza</tspan></text><polyline points="515.2,259 583,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">exigen</tspan></text><polyline points="605.6,259 809,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="809" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="809" dy="0">disputa</tspan></text><rect x="10" y="439" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Análisis propio sobre hechos documentados: los umbrales de monetización de creadores (1 000 suscriptores con 4 000 horas de</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">visualización o con 10 millones de vistas de Shorts) y Content ID son los dos mecanismos públicos que ordenan los</tspan></text><text x="470" y="497.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">incentivos. Dónde deja de valer: el reparto de ingresos entre creadores y YouTube no figura en las fuentes consultadas.</tspan></text><text x="470" y="544.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: documentación de Vitess, publicaciones de Google Research y ayuda de YouTube (consulta 2026-11-23). Esquema del autor.</tspan></text></svg>
