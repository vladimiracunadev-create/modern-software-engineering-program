<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Crecimiento de cada línea de ingresos de Alphabet de 2024 a 2025</title><desc id="d">Barras con el crecimiento porcentual: búsqueda y otros 13,4, anuncios de YouTube 11,7, red de Google menos 1,9, suscripciones, plataformas y dispositivos 19,1 y nube 35,8 por ciento.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="420" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Crecimiento de cada línea de ingresos de Alphabet de 2024 a 2025</tspan></text><line x1="324" y1="49" x2="324" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="239" x2="324" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">−10</tspan></text><line x1="435.952" y1="49" x2="435.952" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="435.952" y1="239" x2="435.952" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="435.952" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="435.952" dy="0">0</tspan></text><line x1="547.904" y1="49" x2="547.904" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="547.904" y1="239" x2="547.904" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="547.904" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="547.904" dy="0">10</tspan></text><line x1="659.856" y1="49" x2="659.856" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="659.856" y1="239" x2="659.856" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="659.856" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="659.856" dy="0">20</tspan></text><line x1="771.808" y1="49" x2="771.808" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="771.808" y1="239" x2="771.808" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="771.808" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="771.808" dy="0">30</tspan></text><line x1="883.76" y1="49" x2="883.76" y2="239" stroke="#d5dde1" stroke-width="1"/><line x1="883.76" y1="239" x2="883.76" y2="244" stroke="#5b7280" stroke-width="1.4"/><text x="883.76" y="260" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="883.76" dy="0">40</tspan></text><line x1="324" y1="239" x2="883.76" y2="239" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Búsqueda y otros</tspan></text><text x="314" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Anuncios de YouTube</tspan></text><text x="314" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Red de Google</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Suscripciones, plataformas y dispositivos</tspan></text><text x="314" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Nube</tspan></text><rect x="324" y="55" width="261.968" height="26" rx="3" fill="#087f8c"/><text x="592.968" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="592.968" dy="0">13,4</tspan></text><rect x="324" y="93" width="242.936" height="26" rx="3" fill="#087f8c"/><text x="573.936" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="573.936" dy="0">11,7</tspan></text><rect x="324" y="131" width="2" height="26" rx="3" fill="#087f8c"/><text x="333" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="333" dy="0">−1,9</tspan></text><rect x="324" y="169" width="325.78" height="26" rx="3" fill="#087f8c"/><text x="656.78" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="656.78" dy="0">19,1</tspan></text><rect x="324" y="207" width="512.74" height="26" rx="3" fill="#087f8c"/><text x="843.74" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="843.74" dy="0">35,8</tspan></text><text x="603.88" y="283" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="603.88" dy="0">% de crecimiento</tspan></text><rect x="10" y="297" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="321.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo propio sobre los 10-K: 224 532 sobre 198 084; 40 367 sobre 36 147; 29 792 sobre 30 359; 48 030 sobre 40 340 y 58</tspan></text><text x="470" y="338.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">705 sobre 43 229. El 10-K atribuye el aumento de YouTube a los productos de respuesta directa y de marca. Dónde deja de</tspan></text><text x="470" y="355.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">valer: son porcentajes sobre bases muy distintas.</tspan></text><text x="470" y="402.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Alphabet de los años 2023 y 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
