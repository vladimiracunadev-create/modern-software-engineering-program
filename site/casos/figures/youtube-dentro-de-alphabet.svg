<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 458" width="940" height="458" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De qué se componen los ingresos de Alphabet en 2025, con YouTube dentro</title><desc id="d">Barras horizontales en millones de dólares: búsqueda y otros 224 532, nube 58 705, suscripciones, plataformas y dispositivos 48 030, anuncios de YouTube 40 367, red de Google 29 792 y otras apuestas 1 537; los ingresos totales fueron 402 836 millones.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="458" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De qué se componen los ingresos de Alphabet en 2025, con YouTube dentro</tspan></text><line x1="324" y1="49" x2="324" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="324" y1="277" x2="324" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="324" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="324" dy="0">0</tspan></text><line x1="431.116" y1="49" x2="431.116" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="431.116" y1="277" x2="431.116" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="431.116" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="431.116" dy="0">50 000</tspan></text><line x1="538.232" y1="49" x2="538.232" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="538.232" y1="277" x2="538.232" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="538.232" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="538.232" dy="0">100 000</tspan></text><line x1="645.348" y1="49" x2="645.348" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="645.348" y1="277" x2="645.348" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="645.348" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="645.348" dy="0">150 000</tspan></text><line x1="752.464" y1="49" x2="752.464" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="752.464" y1="277" x2="752.464" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="752.464" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="752.464" dy="0">200 000</tspan></text><line x1="859.58" y1="49" x2="859.58" y2="277" stroke="#d5dde1" stroke-width="1"/><line x1="859.58" y1="277" x2="859.58" y2="282" stroke="#5b7280" stroke-width="1.4"/><text x="859.58" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="859.58" dy="0">250 000</tspan></text><line x1="324" y1="277" x2="859.58" y2="277" stroke="#5b7280" stroke-width="1.6"/><text x="314" y="72.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Búsqueda y otros</tspan></text><text x="314" y="110.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Nube</tspan></text><text x="314" y="148.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Suscripciones, plataformas y dispositivos</tspan></text><text x="314" y="186.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Anuncios de YouTube</tspan></text><text x="314" y="224.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Red de Google</tspan></text><text x="314" y="262.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="314" dy="0">Otras apuestas</tspan></text><rect x="324" y="55" width="481.019" height="26" rx="3" fill="#102a43"/><text x="812.019" y="72.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="812.019" dy="0">224 532</tspan></text><rect x="324" y="93" width="125.765" height="26" rx="3" fill="#102a43"/><text x="456.765" y="110.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="456.765" dy="0">58 705</tspan></text><rect x="324" y="131" width="102.896" height="26" rx="3" fill="#102a43"/><text x="433.896" y="148.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="433.896" dy="0">48 030</tspan></text><rect x="324" y="169" width="86.479" height="26" rx="3" fill="#102a43"/><text x="417.479" y="186.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="417.479" dy="0">40 367</tspan></text><rect x="324" y="207" width="63.824" height="26" rx="3" fill="#102a43"/><text x="394.824" y="224.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="394.824" dy="0">29 792</tspan></text><rect x="324" y="245" width="3.29275" height="26" rx="3" fill="#102a43"/><text x="334.293" y="262.5" font-size="13" text-anchor="start" font-weight="700" fill="#142231"><tspan x="334.293" dy="0">1 537</tspan></text><text x="591.79" y="321" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="591.79" dy="0">millones de USD</tspan></text><rect x="10" y="335" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="359.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo propio: los anuncios de YouTube son 10,0 % de los 402 836 millones de Alphabet (40 367 sobre 402 836). La partida</tspan></text><text x="470" y="376.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de suscripciones incluye también Google One, Google Play y dispositivos Pixel, de modo que no equivale a las suscripciones</tspan></text><text x="470" y="393.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">de YouTube. Dónde deja de valer: no hay ingreso total de YouTube.</tspan></text><text x="470" y="440.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Alphabet de los años 2023 y 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
