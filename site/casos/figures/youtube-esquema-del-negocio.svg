<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cómo gana dinero YouTube según lo que Alphabet publica</title><desc id="d">Flujo del negocio: los creadores y los titulares de derechos aportan vídeo; los espectadores aportan atención; los anunciantes pagan 40 367 millones de dólares en 2025; los suscriptores pagan por servicios de YouTube que están dentro de una partida mayor de suscripciones; el reparto con los creadores no se publica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="960" height="345" fill="#ffffff"/><rect x="10" y="14" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="111" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">Creadores y titulares de</tspan></text><text x="111" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="111" dy="0">derechos aportan vídeo</tspan></text><rect x="256" y="14" width="202" height="84" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="357" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">Espectadores aportan</tspan></text><text x="357" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="357" dy="0">atención</tspan></text><polyline points="212,56 256,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="14" width="202" height="84" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="603" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="603" dy="0">Anuncios: 40 367</tspan></text><text x="603" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="603" dy="0">millones de USD en 2025</tspan></text><polyline points="458,56 502,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="14" width="202" height="84" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="849" y="34.68" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">Suscripciones (YouTube</tspan></text><text x="849" y="51.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">TV, Music, Premium):</tspan></text><text x="849" y="67.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">dentro de 48 030</tspan></text><text x="849" y="84.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="849" dy="0">millones</tspan></text><polyline points="704,56 748,56" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="138" width="202" height="84" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="111" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">Content ID: bloquear,</tspan></text><text x="111" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="111" dy="0">monetizar o seguir</tspan></text><rect x="256" y="138" width="202" height="84" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="357" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="357" dy="0">Reparto con creadores:</tspan></text><text x="357" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="357" dy="0">no publicado</tspan></text><polyline points="212,180 256,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502" y="138" width="202" height="84" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="603" y="167" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="603" dy="0">Costes de</tspan></text><text x="603" y="183.64" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="603" dy="0">infraestructura: no</tspan></text><text x="603" y="200.28" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="603" dy="0">publicados</tspan></text><polyline points="458,180 502,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="748" y="138" width="202" height="84" rx="10" fill="#eef1f2" stroke="#8a9aa3" stroke-width="1.6"/><text x="849" y="175.32" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="849" dy="0">Beneficio de YouTube: no</tspan></text><text x="849" y="191.96" font-size="13" text-anchor="middle" font-weight="400" fill="#2b3a44"><tspan x="849" dy="0">publicado</tspan></text><polyline points="704,180 748,180" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="849,98 849,118 111,118 111,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="236" width="940" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="480" y="260.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">Documentado: la partida de anuncios y la descripción de las suscripciones. No se sabe: el beneficio, el reparto con creadores</tspan></text><text x="480" y="277.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">y los costes de YouTube; Alphabet no los separa. Dónde deja de valer: cualquier cifra de beneficio de YouTube que circule no</tspan></text><text x="480" y="294.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="480" dy="0">tiene fuente primaria aquí.</tspan></text><text x="480" y="335.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="480" dy="0">Fuente: 10-K de Alphabet de los años 2023 y 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
