<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" width="940" height="492" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Ingresos por anuncios de YouTube, 2021 a 2025</title><desc id="d">Barras en millones de dólares: 28 845 en 2021, 29 243 en 2022, 31 510 en 2023, 36 147 en 2024 y 40 367 en 2025; el crecimiento fue de 1 por ciento en 2022 y de 12 por ciento en 2025.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="492" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Ingresos por anuncios de YouTube, 2021 a 2025</tspan></text><line x1="101.24" y1="317" x2="920" y2="317" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="317" x2="101.24" y2="317" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="321.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">0</tspan></text><line x1="101.24" y1="267" x2="920" y2="267" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="267" x2="101.24" y2="267" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="271.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">10 000</tspan></text><line x1="101.24" y1="217" x2="920" y2="217" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="217" x2="101.24" y2="217" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="221.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">20 000</tspan></text><line x1="101.24" y1="167" x2="920" y2="167" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="167" x2="101.24" y2="167" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="171.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">30 000</tspan></text><line x1="101.24" y1="117" x2="920" y2="117" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="117" x2="101.24" y2="117" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="121.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">40 000</tspan></text><line x1="101.24" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="96.24" y1="67" x2="101.24" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="92.24" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="92.24" dy="0">50 000</tspan></text><line x1="101.24" y1="67" x2="101.24" y2="317" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="192" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 192)">millones de USD</text><rect x="117.615" y="172.775" width="131.002" height="144.225" rx="3" fill="#c0432f"/><text x="183.116" y="166.775" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="183.116" dy="0">28 845</tspan></text><text x="183.116" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="183.116" dy="0">2021</tspan></text><rect x="281.367" y="170.785" width="131.002" height="146.215" rx="3" fill="#c0432f"/><text x="346.868" y="164.785" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="346.868" dy="0">29 243</tspan></text><text x="346.868" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="346.868" dy="0">2022</tspan></text><rect x="445.119" y="159.45" width="131.002" height="157.55" rx="3" fill="#c0432f"/><text x="510.62" y="153.45" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="510.62" dy="0">31 510</tspan></text><text x="510.62" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="510.62" dy="0">2023</tspan></text><rect x="608.871" y="136.265" width="131.002" height="180.735" rx="3" fill="#c0432f"/><text x="674.372" y="130.265" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="674.372" dy="0">36 147</tspan></text><text x="674.372" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="674.372" dy="0">2024</tspan></text><rect x="772.623" y="115.165" width="131.002" height="201.835" rx="3" fill="#c0432f"/><text x="838.124" y="109.165" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="838.124" dy="0">40 367</tspan></text><text x="838.124" y="338" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="838.124" dy="0">2025</tspan></text><rect x="10" y="369" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cálculo propio de crecimiento: 2022 sobre 2021, 1,4 %; 2023, 7,8 %; 2024, 14,7 %; 2025, 11,7 %. Mire el estancamiento de</tspan></text><text x="470" y="410.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">2022 y la recuperación posterior. Dónde deja de valer: es solo la línea de anuncios; las suscripciones de YouTube están</tspan></text><text x="470" y="427.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">dentro de otra partida de Alphabet que no se separa.</tspan></text><text x="470" y="474.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Alphabet de los años 2023 y 2025 (SEC), consulta 2026-11-23.</tspan></text></svg>
