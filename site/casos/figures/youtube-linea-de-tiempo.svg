<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 419" width="940" height="419" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">YouTube de 2005 a 2026: compra, infraestructura e investigación</title><desc id="d">Línea de tiempo con tres carriles: empresa (fundada en febrero de 2005, adquirida por Google, anunciada el 9 de octubre de 2006 y cerrada en noviembre de 2006), datos (Vitess nace en 2010; CNCF en 2018 y 2019) y sistemas (recomendación en 2016 y aceleración de vídeo en 2021).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="419" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">YouTube de 2005 a 2026: compra, infraestructura e investigación</tspan></text><line x1="96.48" y1="83" x2="96.48" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="96.48" y1="221" x2="96.48" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="96.48" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="96.48" dy="0">2005</tspan></text><line x1="244.756" y1="83" x2="244.756" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="244.756" y1="221" x2="244.756" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="244.756" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244.756" dy="0">2009</tspan></text><line x1="393.033" y1="83" x2="393.033" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="393.033" y1="221" x2="393.033" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="393.033" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="393.033" dy="0">2013</tspan></text><line x1="541.309" y1="83" x2="541.309" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="541.309" y1="221" x2="541.309" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="541.309" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="541.309" dy="0">2017</tspan></text><line x1="689.585" y1="83" x2="689.585" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="689.585" y1="221" x2="689.585" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="689.585" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="689.585" dy="0">2021</tspan></text><line x1="837.862" y1="83" x2="837.862" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="837.862" y1="221" x2="837.862" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="837.862" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="837.862" dy="0">2025</tspan></text><line x1="912" y1="83" x2="912" y2="221" stroke="#d5dde1" stroke-width="1"/><line x1="912" y1="221" x2="912" y2="226" stroke="#5b7280" stroke-width="1.4"/><text x="912" y="242" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="912" dy="0">2027</tspan></text><line x1="96.48" y1="221" x2="912" y2="221" stroke="#5b7280" stroke-width="1.6"/><text x="86.48" y="110.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="86.48" dy="0">Empresa</tspan></text><text x="86.48" y="156.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="86.48" dy="0">Datos</tspan></text><text x="86.48" y="202.5" font-size="13" text-anchor="end" font-weight="700" fill="#142231"><tspan x="86.48" dy="0">Sistemas</tspan></text><line x1="100.187" y1="75" x2="100.187" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="100.187" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="100.187" dy="0">fundación</tspan></text><line x1="165.058" y1="75" x2="165.058" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="166.637" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="166.637" dy="0">compra</tspan></text><line x1="530.188" y1="75" x2="530.188" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="530.188" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="530.188" dy="0">recomendación</tspan></text><line x1="696.999" y1="75" x2="696.999" y2="221" stroke="#102a43" stroke-width="1.4" stroke-dasharray="5 4"/><text x="696.999" y="69" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="696.999" dy="0">VCU</tspan></text><rect x="100.187" y="92" width="64.8709" height="28" rx="4" fill="#6b7c86" stroke="#ffffff" stroke-width="1"/><rect x="165.058" y="92" width="709.873" height="28" rx="4" fill="#087f8c" stroke="#ffffff" stroke-width="1"/><text x="519.994" y="110.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="519.994" dy="0">Parte de Google y de Alphabet</tspan></text><line x1="14" y1="129" x2="912" y2="129" stroke="#d5dde1" stroke-width="1"/><rect x="281.825" y="138" width="593.105" height="28" rx="4" fill="#102a43" stroke="#ffffff" stroke-width="1"/><text x="578.378" y="156.5" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="578.378" dy="0">Vitess nace en YouTube y llega a la CNCF</tspan></text><line x1="14" y1="175" x2="912" y2="175" stroke="#d5dde1" stroke-width="1"/><rect x="526.481" y="184" width="7.41382" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><rect x="693.292" y="184" width="7.41382" height="28" rx="4" fill="#c0432f" stroke="#ffffff" stroke-width="1"/><text x="504.24" y="265" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280"><tspan x="504.24" dy="0">año</tspan></text><rect x="10" y="279" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="303.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Hechos con fuente: fundada en febrero de 2005 y compra anunciada el 9 de octubre de 2006 por 1 650 millones en acciones</tspan></text><text x="470" y="320.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">(comunicado de Google), cerrada en noviembre de 2006 (10-K de Google); Vitess creado en 2010 y graduado de la CNCF en</tspan></text><text x="470" y="337.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">noviembre de 2019; trabajos de investigación de 2016 y 2021. Dónde deja de valer: los marcadores de sistemas son fechas de</tspan></text><text x="470" y="353.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">publicación, no de despliegue.</tspan></text><text x="470" y="401.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: comunicado y 10-K de Google (2006), documentación de Vitess y Google Research.</tspan></text></svg>
