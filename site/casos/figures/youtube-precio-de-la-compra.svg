<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 499" width="940" height="499" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Tres formas de contar lo que costó YouTube</title><desc id="d">Barras en millones de dólares: 1 650 millones anunciados en octubre de 2006, 1 194 millones de precio contable al cerrar la compra en noviembre de 2006 y 564,5 millones adicionales en compensación diferida a empleados que se reconoce con el tiempo.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="499" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Tres formas de contar lo que costó YouTube</tspan></text><line x1="93.7" y1="307" x2="920" y2="307" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="307" x2="93.7" y2="307" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="311.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">0</tspan></text><line x1="93.7" y1="247" x2="920" y2="247" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="247" x2="93.7" y2="247" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="251.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">500</tspan></text><line x1="93.7" y1="187" x2="920" y2="187" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="187" x2="93.7" y2="187" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="191.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 000</tspan></text><line x1="93.7" y1="127" x2="920" y2="127" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="127" x2="93.7" y2="127" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="131.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">1 500</tspan></text><line x1="93.7" y1="67" x2="920" y2="67" stroke="#d5dde1" stroke-width="1"/><line x1="88.7" y1="67" x2="93.7" y2="67" stroke="#5b7280" stroke-width="1.4"/><text x="84.7" y="71.5" font-size="13" text-anchor="end" font-weight="400" fill="#142231"><tspan x="84.7" dy="0">2 000</tspan></text><line x1="93.7" y1="67" x2="93.7" y2="307" stroke="#5b7280" stroke-width="1.6"/><text x="20" y="187" font-size="13" text-anchor="middle" font-weight="400" fill="#5b7280" transform="rotate(-90 20 187)">millones de USD</text><rect x="121.243" y="109" width="220.347" height="198" rx="3" fill="#102a43"/><text x="231.417" y="103" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="231.417" dy="0">1 650,0</tspan></text><text x="231.417" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="231.417" dy="0">Anunciado (oct. 2006)</tspan></text><rect x="396.677" y="163.72" width="220.347" height="143.28" rx="3" fill="#102a43"/><text x="506.85" y="157.72" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="506.85" dy="0">1 194,0</tspan></text><text x="506.85" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="506.85" dy="0">Precio contable (nov. 2006)</tspan></text><rect x="672.11" y="239.26" width="220.347" height="67.74" rx="3" fill="#102a43"/><text x="782.283" y="233.26" font-size="13" text-anchor="middle" font-weight="700" fill="#142231"><tspan x="782.283" dy="0">564,5</tspan></text><text x="782.283" y="328" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="782.283" dy="0">Compensación diferida a empleados</tspan></text><rect x="10" y="359" width="920" height="92.56" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="383.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">El comunicado de Google habla de 1 650 millones en acciones; el 10-K de 2006 da un precio de 1 194 millones (21,2 en</tspan></text><text x="470" y="400.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">efectivo y 1 173 en acciones y opciones), más 564,5 millones en acciones sujetas a permanencia. Cálculo propio: 1 194 +</tspan></text><text x="470" y="417.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">564,5 son 1 758,5, no 1 650: miden cosas distintas y con cotizaciones de fechas distintas. Dónde deja de valer: el valor de</tspan></text><text x="470" y="433.88" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">las acciones cambia con la cotización.</tspan></text><text x="470" y="481.56" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: 10-K de Google del año 2006 (SEC) y comunicado de Google del 9 de octubre de 2006, consulta 2026-11-23.</tspan></text></svg>
