<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 521" width="940" height="521" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Cuatro recorridos en YouTube y su caso límite</title><desc id="d">Cuatro filas de pasos: un espectador que busca un vídeo, un creador que sube y monetiza, un titular de derechos que usa Content ID y una familia que usa una cuenta supervisada; cada fila termina en un caso límite.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="521" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Cuatro recorridos en YouTube y su caso límite</tspan></text><rect x="10" y="56" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="97.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Espectador</tspan></text><rect x="174" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="263.25" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.25" dy="0">Abre la página de</tspan></text><text x="263.25" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="263.25" dy="0">inicio</tspan></text><rect x="366.5" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="455.75" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">Ve recomendaciones y</tspan></text><text x="455.75" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="455.75" dy="0">suscripciones</tspan></text><polyline points="352.5,94 366.5,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="56" width="178.5" height="76" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="648.25" y="97.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="648.25" dy="0">Reproduce un vídeo</tspan></text><polyline points="545,94 559,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="56" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="89.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Emisión en directo</tspan></text><text x="840.75" y="105.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">con millones a la vez</tspan></text><polyline points="737.5,94 751.5,94" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="144" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="185.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Creador</tspan></text><rect x="174" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="263.25" y="185.64" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="263.25" dy="0">Sube un vídeo</tspan></text><rect x="366.5" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="455.75" y="177.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">YouTube lo procesa en</tspan></text><text x="455.75" y="193.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="455.75" dy="0">varios formatos</tspan></text><polyline points="352.5,182 366.5,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="144" width="178.5" height="76" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="648.25" y="177.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">Cumple los umbrales</tspan></text><text x="648.25" y="193.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="648.25" dy="0">de monetización</tspan></text><polyline points="545,182 559,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="144" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="177.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Reclamo de derechos</tspan></text><text x="840.75" y="193.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">sobre su vídeo</tspan></text><polyline points="737.5,182 751.5,182" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="232" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="265.32" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Titular de</tspan></text><text x="85" y="281.96" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">derechos</tspan></text><rect x="174" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="263.25" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="263.25" dy="0">Entrega archivos de</tspan></text><text x="263.25" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="263.25" dy="0">referencia</tspan></text><rect x="366.5" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="455.75" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="455.75" dy="0">Content ID escanea</tspan></text><text x="455.75" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="455.75" dy="0">cada subida</tspan></text><polyline points="352.5,270 366.5,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="232" width="178.5" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="648.25" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="648.25" dy="0">Elige bloquear,</tspan></text><text x="648.25" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff"><tspan x="648.25" dy="0">monetizar o seguir</tspan></text><polyline points="545,270 559,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="232" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="265.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Reclamo erróneo y</tspan></text><text x="840.75" y="281.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">disputa</tspan></text><polyline points="737.5,270 751.5,270" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="320" width="150" height="76" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="85" y="361.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="85" dy="0">Familia</tspan></text><rect x="174" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="263.25" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">Crea una cuenta</tspan></text><text x="263.25" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="263.25" dy="0">supervisada</tspan></text><rect x="366.5" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="455.75" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">Define límites de</tspan></text><text x="455.75" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="455.75" dy="0">contenido</tspan></text><polyline points="352.5,358 366.5,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="559" y="320" width="178.5" height="76" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="648.25" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">El menor ve contenido</tspan></text><text x="648.25" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="648.25" dy="0">filtrado</tspan></text><polyline points="545,358 559,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="751.5" y="320" width="178.5" height="76" rx="10" fill="#fbe4de" stroke="#c0432f" stroke-width="1.6"/><text x="840.75" y="353.32" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">Un vídeo inadecuado</tspan></text><text x="840.75" y="369.96" font-size="13" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="840.75" dy="0">pasa el filtro</tspan></text><polyline points="737.5,358 751.5,358" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="10" y="412" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="436.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Cada fila se lee de izquierda a derecha y la caja coral es el borde. Los pasos de Content ID y los umbrales de monetización</tspan></text><text x="470" y="453.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">salen de la ayuda de YouTube; el procesamiento en varios formatos, del trabajo sobre aceleración de vídeo; los bordes del</tspan></text><text x="470" y="470.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">espectador y la familia son escenarios del curso. Dónde deja de valer: no mide frecuencia de cada borde.</tspan></text><text x="470" y="507.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Esquema del autor sobre la ayuda de YouTube y los trabajos de Google Research.</tspan></text></svg>
