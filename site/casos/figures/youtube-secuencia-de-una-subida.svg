<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 529" width="940" height="529" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">De subir un vídeo a reproducirlo, con lo documentado y lo inferido</title><desc id="d">Secuencia de una subida: el creador sube el vídeo; el sistema escanea con Content ID; el vídeo se transcodifica a varios formatos en aceleradores de vídeo; se indexa y entra al sistema de recomendación; el espectador recibe recomendaciones y reproduce el formato adecuado.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="529" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">De subir un vídeo a reproducirlo, con lo documentado y lo inferido</tspan></text><rect x="26" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="110" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="110" dy="0">Creador</tspan></text><rect x="206" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="290" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="290" dy="0">Subida y Content ID</tspan></text><rect x="386" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Transcodificación</tspan></text><rect x="566" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="650" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="650" dy="0">Recomendación</tspan></text><rect x="746" y="58" width="168" height="46" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="830" y="84.64" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="830" dy="0">Espectador</tspan></text><line x1="110" y1="104" x2="110" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="290" y1="104" x2="290" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="470" y1="104" x2="470" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="650" y1="104" x2="650" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="830" y1="104" x2="830" y2="406" stroke="#8a9aa3" stroke-width="1.2" stroke-dasharray="5 4"/><polyline points="113,138 287,138" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="200" y="130" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="200" dy="0">1. sube el vídeo</tspan></text><polyline points="290,178 336,178 336,192 294,192" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="344" y="188" font-size="13" text-anchor="start" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="344" dy="0">2. Content ID lo escanea contra los archivos de referencia</tspan></text><polyline points="293,230 467,230" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="380" y="222" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="380" dy="0">3. pide procesarlo</tspan></text><polyline points="473,276 647,276" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="560" y="252" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="560" dy="0">4. vídeo listo en varios</tspan><tspan x="560" dy="16.64">formatos</tspan></text><polyline points="653,322 827,322" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="740" y="298" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="740" dy="0">5. lo recomienda según el</tspan><tspan x="740" dy="16.64">comportamiento del espectador</tspan></text><polyline points="827,368 473,368" fill="none" stroke="#32505f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="650" y="360" font-size="13" text-anchor="middle" font-weight="400" fill="#142231" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"><tspan x="650" dy="0">6. pide el formato adecuado a su conexión</tspan></text><rect x="10" y="420" width="920" height="75.92" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="444.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado: Content ID escanea toda subida; la transcodificación a escala usa aceleradores; la recomendación usa dos</tspan></text><text x="470" y="461.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">etapas. Inferido (trazo punteado): el orden y la forma exacta de cada paso. Dónde deja de valer: omite almacenamiento,</tspan></text><text x="470" y="478.24" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">entrega, moderación y subtítulos.</tspan></text><text x="470" y="515.92" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuentes: documentación de Vitess, publicaciones de Google Research y ayuda de YouTube (consulta 2026-11-23). Esquema del autor.</tspan></text></svg>
