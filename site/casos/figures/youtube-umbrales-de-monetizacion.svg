<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 546" width="940" height="546" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"><title id="t">Umbrales para que un creador entre en el programa de socios de YouTube</title><desc id="d">Esquema de los umbrales: 1 000 suscriptores y 4 000 horas de visualización cualificadas en los últimos 12 meses, o 1 000 suscriptores y 10 millones de vistas cualificadas de Shorts en los últimos 90 días; las horas de Shorts pueden contar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#32505f"/></marker><marker id="arrow-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0432f"/></marker></defs><rect width="940" height="546" fill="#ffffff"/><text x="14" y="27" font-size="15" text-anchor="start" font-weight="700" fill="#142231"><tspan x="14" dy="0">Umbrales para que un creador entre en el programa de socios de YouTube</tspan></text><rect x="137" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="244" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="244" dy="0">1 000 suscriptores</tspan></text><rect x="363" y="51" width="214" height="74" rx="10" fill="#dff1ee" stroke="#087f8c" stroke-width="1.6"/><text x="470" y="75" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">4 000 horas de</tspan></text><text x="470" y="91.64" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">visualización cualificadas</tspan></text><text x="470" y="108.28" font-size="13" text-anchor="middle" font-weight="400" fill="#0b3f45"><tspan x="470" dy="0">en 12 meses</tspan></text><rect x="589" y="51" width="214" height="74" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="696" y="83.32" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="696" dy="0">10 millones de vistas de</tspan></text><text x="696" y="99.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="696" dy="0">Shorts en 90 días</tspan></text><rect x="300" y="195" width="340" height="64" rx="10" fill="#102a43" stroke="#102a43" stroke-width="1.6"/><text x="470" y="230.92" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff"><tspan x="470" dy="0">Programa de socios de YouTube</tspan></text><polyline points="244,125 379.6,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="244" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="244" dy="0">y además</tspan></text><polyline points="470,125 470,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="470" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="470" dy="0">o bien</tspan></text><polyline points="696,125 560.4,195" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="696" y="157" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="696" dy="0">alternativa</tspan></text><rect x="250" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="357" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">Revisión y aprobación por</tspan></text><text x="357" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">YouTube</tspan></text><rect x="476" y="345" width="214" height="74" rx="10" fill="#ffffff" stroke="#5b7280" stroke-width="1.6"/><text x="583" y="377.32" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">Aviso por correo al</tspan></text><text x="583" y="393.96" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">alcanzar el umbral</tspan></text><polyline points="424.8,259 357,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="357" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="357" dy="0">después</tspan></text><polyline points="515.2,259 583,345" fill="none" stroke="#32505f" stroke-width="1.8" marker-end="url(#arrow)"/><text x="583" y="315" font-size="13" text-anchor="middle" font-weight="400" fill="#142231"><tspan x="583" dy="0">se informa</tspan></text><rect x="10" y="439" width="920" height="59.28" rx="10" fill="#f7ebc8" stroke="#a8761a" stroke-width="1.6"/><text x="470" y="463.96" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Documentado en la ayuda de YouTube: son los umbrales de elegibilidad vigentes en la fecha de consulta; pueden cambiar.</tspan></text><text x="470" y="480.6" font-size="13" text-anchor="middle" font-weight="400" fill="#4a3209"><tspan x="470" dy="0">Dónde deja de valer: no se publica el porcentaje del ingreso que recibe el creador en las fuentes consultadas.</tspan></text><text x="470" y="528.28" font-size="12" text-anchor="middle" font-weight="400" fill="#5c1f14"><tspan x="470" dy="0">Fuente: ayuda de YouTube, programa de socios, consulta 2026-11-23.</tspan></text></svg>
